[package]
name = "depyler"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
description.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
rust-version.workspace = true

[[bin]]
name = "depyler"
path = "src/main.rs"

[features]
default = []
coverage = [] # Feature flag to disable heavy property tests during coverage runs
ruchy = ["depyler-ruchy"]

[dependencies]
depyler-core = { version = "3.19.18", path = "../depyler-core" }
depyler-analysis = { version = "3.19.18", path = "../depyler-analysis" }
depyler-mcp = { version = "3.19.18", path = "../depyler-mcp" }
depyler-annotations = { version = "3.19.18", path = "../depyler-annotations" }
depyler-ruchy = { version = "3.19.18", path = "../depyler-ruchy", optional = true }

anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
indicatif.workspace = true
colored.workspace = true
dialoguer.workspace = true
rustpython-parser.workspace = true
rustpython-ast.workspace = true
tokio.workspace = true
pmcp.workspace = true
async-trait.workspace = true
notify = "8.0"

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
quickcheck.workspace = true
quickcheck_macros.workspace = true
proptest.workspace = true
tokio.workspace = true
quote.workspace = true
smallvec.workspace = true
rand.workspace = true
md5.workspace = true
assert_cmd = "2.0"
predicates = "3.0"