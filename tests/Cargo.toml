[package]
name = "depyler-tests"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Integration tests for Depyler Python-to-Rust transpiler"
rust-version.workspace = true

[lib]
path = "lib.rs"

[dependencies]
depyler = { path = "../crates/depyler" }
depyler-core = { path = "../crates/depyler-core" }
depyler-analysis = { path = "../crates/depyler-analysis" }
depyler-annotations = { path = "../crates/depyler-annotations" }
depyler-verify = { path = "../crates/depyler-verify" }

toml = "0.8"
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
rustpython-parser.workspace = true
rustpython-ast.workspace = true
syn.workspace = true
quote.workspace = true
proc-macro2.workspace = true
indexmap.workspace = true
smallvec.workspace = true
regex.workspace = true
colored.workspace = true
tempfile.workspace = true
md5 = "0.7"

[dev-dependencies]
assert_cmd = "2.0"
insta.workspace = true
predicates = "3.0"
proptest.workspace = true
quickcheck.workspace = true
quickcheck_macros.workspace = true
rand.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
