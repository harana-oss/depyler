[[test]]
name = "complex_exception_handling_pattern"
description = "Complex try/except with loop and continue"
tags = ["try", "except", "loop", "integration"]

[test.python]
code = '''
def complex_exception_handling(items: list[int]) -> int:
    total = 0
    try:
        for item in items:
            try:
                if item < 0:
                    raise ValueError("negative")
                total = total + item
            except ValueError as e:
                print("skipping negative")
                continue
    except Exception:
        return -1
    finally:
        print("done processing")
    
    return total
'''

[test.assertions]
contains = ["fn complex_exception_handling"]
