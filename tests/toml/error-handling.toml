[[test]]
name = "try_except_multiple_caught_types"
description = "Multiple exception types in try/except handlers"

python = '''
def process_data(value: int, divisor: int) -> int:
    try:
        if value < 0:
            raise ValueError("negative value")
        if divisor == 0:
            raise ZeroDivisionError("division by zero")
        return value // divisor
    except ValueError:
        return -1
    except ZeroDivisionError:
        return -2
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[derive(Debug, Clone)]
pub struct ValueError {
    message: String,
}
impl std::fmt::Display for ValueError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "value error: {}", self.message)
    }
}
impl std::error::Error for ValueError {}
impl ValueError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn process_data(value: i32, divisor: i32) -> i32 {
    {
        if value < 0 {
            panic!("{}", "negative value");
        }
        if divisor == 0 {
            panic!("{}", "division by zero");
        }
        return {
            let a = value;
            let b = divisor;
            let q = a / b;
            let r = a % b;
            let r_negative = r < 0;
            let b_negative = b < 0;
            let r_nonzero = r != 0;
            let signs_differ = r_negative != b_negative;
            let needs_adjustment = r_nonzero && signs_differ;
            if needs_adjustment { q - 1 } else { q }
        };
        return -1;
        return -2;
    }
}
'''

