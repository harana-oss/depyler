tags = ["error", "nested"]

[test.python]
code = '''
def nested(x: int, y: int) -> int:
    if x == 0:
        if y == 0:
            raise ValueError("both zero")
        raise ZeroDivisionError("x is zero")
    return 100 // x
'''

[test.assertions]
contains_any = [["nested", "zero", "Error"]]

[[test]]
name = "error_in_loop"
description = "Error raising inside loop"
tags = ["error", "loop"]

[test.python]
code = '''
def process_items(items: list) -> int:
    total = 0
    for i in range(len(items)):
        if items[i] < 0:
            raise ValueError("negative value found")
        total = total + items[i]
    return total
'''

[test.assertions]
contains = ["process_items", "total"]

[[test]]
name = "conditional_error_raising"
description = "Conditional error raising with elif"
tags = ["error", "conditional"]

[test.python]
code = '''
def conditional_error(x: int, strict: bool) -> int:
    if strict and x < 0:
        raise ValueError("strict mode: negative not allowed")
    elif x < -100:
        raise ValueError("value too small")
    return x
'''

[test.assertions]
contains = ["conditional_error"]

