[[test]]
name = "multiple_error_types"
description = "Multiple error types in same function"
tags = ["error", "multiple"]

[test.python]
code = '''
def complex_operation(a: int, b: int, items: list) -> int:
    if b == 0:
        raise ZeroDivisionError("cannot divide by zero")
    if a < 0:
        raise ValueError("a must be non-negative")
    if b >= len(items):
        raise IndexError("index out of range")
    return (a // b) + items[b]
'''

[test.assertions]
contains_any = [["Error", "Result", "divide", "negative", "range"]]

