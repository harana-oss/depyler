[metadata]
name = "Walrus Operator Tests"
category = "core-language"

# =============================================================================
# Basic Assignment Expressions
# =============================================================================

[[test]]
name = "walrus_in_if_condition"
description = "Assignment expression in if condition"
python = """
items = [1, 2, 3, 4, 5]
if (n := len(items)) > 3:
    print(f"List has {n} items, which is more than 3")
"""
rust = """
fn main() {
    let items = vec![1, 2, 3, 4, 5];
    let n = items.len();
    if n > 3 {
        log::info!("List has {} items, which is more than 3", n);
    }
}
"""

[[test]]
name = "walrus_in_while_condition"
description = "Assignment expression in while loop"
python = """
data = [1, 2, 3]
index = 0
while (item := data[index] if index < len(data) else None) is not None:
    print(f"Item: {item}")
    index += 1
"""
rust = """
fn main() {
    let data = vec![1, 2, 3];
    let mut index = 0;
    while index < data.len() {
        let item = data[index];
        log::info!("Item: {}", item);
        index += 1;
    }
}
"""

[[test]]
name = "walrus_in_list_comprehension"
description = "Assignment expression in list comprehension filter"
python = """
def expensive_func(x):
    return x * 2

data = [1, 2, 3, 4, 5]
results = [y for x in data if (y := expensive_func(x)) > 5]
print(results)
"""
rust = """
fn expensive_func(x: i32) -> i32 {
    x * 2
}

fn main() {
    let data = vec![1, 2, 3, 4, 5];
    let results: Vec<i32> = data
        .iter()
        .map(|&x| expensive_func(x))
        .filter(|&y| y > 5)
        .collect();
    log::info!("{:?}", results);
}
"""

[[test]]
name = "walrus_with_function_call"
description = "Assignment expression capturing function result"
python = """
import re

text = "The answer is 42"
pattern = r'\\d+'

if (match := re.search(pattern, text)) is not None:
    print(f"Found: {match.group()}")
"""
rust = """
use regex::Regex;

fn main() {
    let text = "The answer is 42";
    let pattern = Regex::new(r"\\d+").unwrap();

    if let Some(match_) = pattern.find(text) {
        log::info!("Found: {}", match_.as_str());
    }
}
"""

[[test]]
name = "walrus_nested"
description = "Multiple assignment expressions in one statement"
python = """
x = 5
y = 10
if (a := x * 2) > 5 and (b := y * 2) > 15:
    print(f"a={a}, b={b}")
"""
rust = """
fn main() {
    let x = 5;
    let y = 10;
    let a = x * 2;
    let b = y * 2;
    if a > 5 && b > 15 {
        log::info!("a={}, b={}", a, b);
    }
}
"""

[[test]]
name = "walrus_in_generator"
description = "Assignment expression in generator expression"
python = """
data = [1, 2, 3, 4, 5]
gen = (y for x in data if (y := x * 2) > 5)
print(list(gen))
"""
rust = """
fn main() {
    let data = vec![1, 2, 3, 4, 5];
    let gen: Vec<i32> = data.iter()
        .map(|&x| x * 2)
        .filter(|&y| y > 5)
        .collect();
    log::info!("{:?}", gen);
}
"""

[[test]]
name = "walrus_scope"
description = "Variable scope with walrus operator"
python = """
# Variable defined in walrus is available after the expression
if (result := 10 + 20) > 25:
    pass

# result is still accessible
print(f"Result: {result}")
"""
rust = """
fn main() {
    let result = 10 + 20;
    if result > 25 {
        // pass
    }

    log::info!("Result: {}", result);
}
"""

[[test]]
name = "walrus_while_simple"
description = "Simple walrus operator in while loop condition"
python = """
x = 0
while (y := x * 2) < 10:
    print(y)
    x += 1
"""
rust = """
fn main() {
    let mut x = 0;
    loop {
        let y = x * 2;
        if !(y < 10) {
            break;
        }
        log::info!("{}", y);
        x += 1;
    }
}
"""
expected_output = """0
2
4
6
8"""

[[test]]
name = "walrus_comprehensive_demo"
description = "Comprehensive demonstration of walrus operator in if, while, and multiple conditions"
python = """
def test_walrus_if():
    items = [1, 2, 3, 4, 5]
    if (n := len(items)) > 3:
        print(f"List has {n} items")
    print(f"n is still accessible: {n}")

def test_walrus_while():
    x = 0
    while (y := x * 2) < 10:
        print(f"y = {y}")
        x += 1

def test_multiple_walrus():
    x = 5
    y = 10
    if (a := x * 2) > 5 and (b := y * 2) > 15:
        print(f"a={a}, b={b}")

test_walrus_if()
test_walrus_while()
test_multiple_walrus()
"""
rust = """
fn test_walrus_if() {
    let items = vec![1, 2, 3, 4, 5];
    let n = items.len() as i32;
    if n > 3 {
        log::info!("List has {} items", n);
    }
    log::info!("n is still accessible: {}", n);
}

fn test_walrus_while() {
    let mut x = 0;
    loop {
        let y = x * 2;
        if !(y < 10) {
            break;
        }
        log::info!("y = {}", y);
        x += 1;
    }
}

fn test_multiple_walrus() {
    let x = 5;
    let y = 10;
    let a = x * 2;
    let b = y * 2;
    if a > 5 && b > 15 {
        log::info!("a={}, b={}", a, b);
    }
}

fn main() {
    test_walrus_if();
    test_walrus_while();
    test_multiple_walrus();
}
"""
expected_output = """List has 5 items
n is still accessible: 5
y = 0
y = 2
y = 4
y = 6
y = 8
a=10, b=20"""

