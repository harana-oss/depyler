[metadata]
name = "Walrus Operator Tests"
category = "core-language"

# =============================================================================
# Basic Assignment Expressions
# =============================================================================

[[test]]
name = "walrus_in_if_condition"
skip = true
description = "Assignment expression in if condition"
python = """
items = [1, 2, 3, 4, 5]
if (n := len(items)) > 3:
    print(f"List has {n} items, which is more than 3")
"""
rust = """
let items = vec![1, 2, 3, 4, 5];
let n = items.len() as i32;
if n > 3 {
    log::info!("{}", format!("List has {} items, which is more than 3", n));
}"""

[[test]]
name = "walrus_in_while_condition"
description = "Assignment expression in while loop"
python = """
data = [1, 2, 3]
index = 0
while (item := data[index] if index < len(data) else None) is not None:
    print(f"Item: {item}")
    index += 1
"""
status = "skip"
skip_reason = "Transpiler doesn't mark `index` as mut, causing compilation error"

[[test]]
name = "walrus_in_list_comprehension"
description = "Assignment expression in list comprehension filter"
python = """
def expensive_func(x):
    return x * 2

data = [1, 2, 3, 4, 5]
results = [y for x in data if (y := expensive_func(x)) > 5]
print(results)
"""
status = "skip"
skip_reason = "DEPYLER-0347: Walrus operator scoping bug - `y` scoped inside filter block, causing compilation error"

[[test]]
name = "walrus_with_function_call"
description = "Assignment expression capturing function result"
python = """
import re

text = "The answer is 42"
pattern = r'\\d+'

if (match := re.search(pattern, text)) is not None:
    print(f"Found: {match.group()}")
"""
status = "skip"
skip_reason = "Transpiler generates broken regex code"

[[test]]
name = "walrus_nested"
skip = true
description = "Multiple assignment expressions in one statement"
python = """
x = 5
y = 10
if (a := x * 2) > 5 and (b := y * 2) > 15:
    print(f"a={a}, b={b}")
"""
rust = """
let x = 5;
let y = 10;
let a = x * 2;
let b = y * 2;
if (a > 5) && (b > 15) {
    log::info!("{}", format!("a={}, b={}", a, b));
}"""

[[test]]
name = "walrus_in_generator"
description = "Assignment expression in generator expression"
python = """
data = [1, 2, 3, 4, 5]
gen = (y for x in data if (y := x * 2) > 5)
print(list(gen))
"""
status = "skip"
skip_reason = "DEPYLER-0347: Walrus operator scoping bug - `y` scoped inside filter block, causing compilation error"

[[test]]
name = "walrus_scope"
skip = true
description = "Variable scope with walrus operator"
python = """
# Variable defined in walrus is available after the expression
if (result := 10 + 20) > 25:
    pass

# result is still accessible
print(f"Result: {result}")
"""
rust = """
let result = 10 + 20;
if result > 25 {}
log::info!("{}", format!("Result: {}", result));"""

[[test]]
name = "walrus_while_simple"
description = "Simple walrus operator in while loop condition"
python = """
x = 0
while (y := x * 2) < 10:
    print(y)
    x += 1
"""
status = "skip"
skip_reason = "Transpiler doesn't mark `x` as mut, causing compilation error with `x += 1`"

[[test]]
name = "walrus_comprehensive_demo"
description = "Comprehensive demonstration of walrus operator in if, while, and multiple conditions"
python = """
def test_walrus_if():
    items = [1, 2, 3, 4, 5]
    if (n := len(items)) > 3:
        print(f"List has {n} items")
    print(f"n is still accessible: {n}")

def test_walrus_while():
    x = 0
    while (y := x * 2) < 10:
        print(f"y = {y}")
        x += 1

def test_multiple_walrus():
    x = 5
    y = 10
    if (a := x * 2) > 5 and (b := y * 2) > 15:
        print(f"a={a}, b={b}")

test_walrus_if()
test_walrus_while()
test_multiple_walrus()
"""
status = "skip"
skip_reason = "DEPYLER-0347: Walrus operator scoping bug - `a` and `b` scoped inside blocks, causing compilation error"

