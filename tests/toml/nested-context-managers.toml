[metadata]
name = "Nested Context Managers Tests"
category = "context-managers"

# =============================================================================
# Multiple Targets Syntax
# =============================================================================

[[test]]
name = "multi_with_comma"
description = "Multiple context managers with comma separation"

python = '''
def process_files():
    with open("a.txt"), open("b.txt"), open("c.txt"):
        pass
'''

rust = '''
pub fn process_files() {
    let _context = std::fs::File::open("a.txt")?;
    let _context = std::fs::File::open("b.txt")?;
    let _context = std::fs::File::open("c.txt")?;
}
'''

[[test]]
name = "multi_with_as"
description = "Multiple context managers with as clauses"

python = '''
def read_files():
    with open("a.txt") as f1, open("b.txt") as f2:
        content1 = f1.read()
        content2 = f2.read()
        return content1 + content2
'''

rust = '''
pub fn read_files() {
    let mut f1 = std::fs::File::open("a.txt")?;
    let mut f2 = std::fs::File::open("b.txt")?;
    let content1 = {
        let mut content = String::new();
        f1.read_to_string(&mut content)?;
        content
    };
    let content2 = {
        let mut content = String::new();
        f2.read_to_string(&mut content)?;
        content
    };
    return content1 + content2;
}
'''

[[test]]
name = "multi_mixed_as"
description = "Mixed as clauses in multiple context managers"

python = '''
def mixed_files():
    with open("a.txt") as f1, open("b.txt"), open("c.txt") as f3:
        return f1.read() + f3.read()
'''

rust = '''
pub fn mixed_files() {
    let mut f1 = std::fs::File::open("a.txt")?;
    let _context = std::fs::File::open("b.txt")?;
    let mut f3 = std::fs::File::open("c.txt")?;
    return {
        let mut content = String::new();
        f1.read_to_string(&mut content)?;
        content
    } + {
        let mut content = String::new();
        f3.read_to_string(&mut content)?;
        content
    }
'''

