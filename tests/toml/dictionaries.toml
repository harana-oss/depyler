def get_value(data: Dict[str, int]) -> int:
    return data["mykey"]
'''

[test.assertions]
contains = ["fn get_value"]
not_contains = ["as usize"]

# =============================================================================
# Dict Mutability Detection
# =============================================================================

[[test]]
name = "dict_insert_adds_mut"
description = "Dict insert should add mut"
tags = ["dict", "mutability"]

[test.python]
code = '''
def add_entry(d: dict[str, int], key: str, value: int) -> dict[str, int]:
    d[key] = value
    return d
'''

[test.assertions]
contains = ["fn add_entry", "insert(", "mut d: HashMap<String, i"]

[[test]]
name = "dict_clear_adds_mut"
description = "Dict clear should add mut"
tags = ["dict", "mutability"]

[test.python]
code = '''
def clear_dict(d: dict[str, int]) -> dict[str, int]:
    d.clear()
    return d
'''

[test.assertions]
contains = ["fn clear_dict", "clear()", "mut d: HashMap<String, i"]

[[test]]
name = "dict_no_mut_when_readonly"
description = "Dict read-only access should not add mut"
tags = ["dict", "mutability"]

[test.python]
code = '''
def get_value(d: dict[str, int], key: str) -> int:
    return d.get(key, 0)
'''

[test.assertions]
contains = ["fn get_value", "HashMap"]
not_contains = ["mut d:"]

# =============================================================================
# Dict Double Reference Prevention
# =============================================================================

[[test]]
name = "dict_pop_no_double_ref"
description = "Dict pop should not create double reference"
tags = ["dict", "reference"]

[test.python]
code = '''
def pop_entry(d: dict[str, int], key: str) -> int:
    return d.pop(key, -1)
'''

[test.assertions]
contains = ["fn pop_entry"]
not_contains = ["&&key", "& & key"]

[[test]]
name = "dict_contains_key_no_double_ref"
description = "Dict contains_key should not create double reference"
tags = ["dict", "reference"]

[test.python]
code = '''
def has_key(d: dict[str, int], key: str) -> bool:
    return key in d
'''

[test.assertions]
contains = ["fn has_key"]
not_contains = ["&&key", "& & key"]

[[test]]
name = "dict_combined_mutations"
description = "Dict combined mutations without double references"
tags = ["dict", "mutability", "reference"]

[test.python]
code = '''
def modify_dict(d: dict[str, int], k1: str, k2: str) -> dict[str, int]:
    d[k1] = 10
    if k2 in d:
        d.pop(k2)
    return d
'''

[test.assertions]
contains = ["fn modify_dict", "mut d: HashMap<String, i"]
not_contains = ["&&k2", "& & k2"]

[[test]]
name = "dict_remove_in_conditional"
description = "Dict remove in conditional without double references"
tags = ["dict", "mutability", "reference"]

[test.python]
code = '''
def remove_if_exists(d: dict[str, int], key: str) -> dict[str, int]:
    if key in d:
        d.pop(key)
    return d
'''

[test.assertions]
contains = ["fn remove_if_exists", "mut d: HashMap<String, i"]
not_contains = ["&&key", "& & key"]

