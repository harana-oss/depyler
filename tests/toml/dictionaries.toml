[test.python]
code = '''
def get_with_default(d: dict[str, int], key: str) -> int:
    return d.get(key, 0)
'''

[test.assertions]
contains_any = [[".unwrap_or(", ".unwrap_or_default()"]]

[[test]]
name = "get_non_optional_return_unwraps"
description = "Non-optional return type should not be Option<i32>"
tags = ["dict", "get", "return-type"]

[test.python]
code = '''
def get_or_zero(d: dict[str, int], key: str) -> int:
    result = d.get(key)
    if result is None:
        return 0
    return result
'''

[test.assertions]
contains = ["i32"]
not_contains = ["Option<i32"]

[[test]]
name = "for_loop_tuple_both_vars_used"
description = "Both k and v used should be (k, v) not (_k, v)"
tags = ["dict", "iteration", "tuple"]

[test.python]
code = '''
def sum_dict(d: dict[str, int]) -> int:
    total = 0
    for k, v in d.items():
        total += v
        print(k)
    return total
'''

[test.assertions]
contains = ["for (k, v)"]
not_contains = ["for (_k, v)"]

[[test]]
name = "for_loop_key_used_in_index"
description = "Key used in assignment target should be (k, v)"
tags = ["dict", "iteration", "tuple"]

[test.python]
code = '''
def update_dict(d1: dict[str, int], d2: dict[str, int]) -> None:
    for k, v in d2.items():
        d1[k] = v
'''

[test.assertions]
contains = ["for (k, v)"]
not_contains = ["for (_k,"]

[[test]]
name = "for_loop_only_value_used"
description = "Only value used should prefix unused key with underscore"
tags = ["dict", "iteration", "tuple"]

[test.python]
code = '''
def sum_values(d: dict[str, int]) -> int:
    total = 0
    for k, v in d.items():
        total += v
    return total
'''

[test.assertions]
contains_any = [["for (_k, v)", "for (_, v)"]]

[[test]]
name = "for_loop_items_clones_correctly"
description = "dict.items() iteration should clone both k and v"
tags = ["dict", "iteration", "clone"]

[test.python]
code = '''
def copy_keys(d: dict[str, int]) -> list[str]:
    keys = []
    for k, v in d.items():
        keys.append(k)
    return keys
'''

[test.assertions]
contains = [".iter()", ".map(", "k.clone()", "v.clone()"]

[[test]]
name = "phase2_all_fixes_combined"
description = "Test all phase2 fixes together"
tags = ["dict", "integration"]

[test.python]
code = '''
def merge_and_get(d1: dict[str, int], d2: dict[str, int], key: str) -> int | None:
    result = {}
    for k, v in d1.items():
        result[k] = v
    for k, v in d2.items():
        result[k] = v
    return result.get(key)
'''

[test.assertions]
contains = ["for (k, v)", ".cloned()"]
not_contains = ["Cow<", ".cloned().unwrap_or_default()"]

[[test]]
name = "regression_dict_operations_still_work"
description = "Ensure dict operations still work after fixes"
tags = ["dict", "regression"]

[test.python]
code = '''
def dict_ops(d: dict[str, int]) -> None:
    d["new_key"] = 42
    d.pop("old_key", None)
    if "check_key" in d:
        print(d["check_key"])
'''

[test.assertions]
contains = [".insert(", ".get(", ".is_some()"]
contains_any = [[".remove(", ".pop("]]
