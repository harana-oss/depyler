'''

rust = '''
use serde_json;
use std::collections::HashMap;
pub fn pop_item(d: &mut HashMap<serde_json::Value, serde_json::Value>) -> () {
    return {
        let key = d
            .keys()
            .next()
            .cloned()
            .expect("KeyError: popitem(): dictionary is empty");
        let value = d.remove(&key).expect("KeyError: key disappeared");
        (key, value)
    };
}
'''

