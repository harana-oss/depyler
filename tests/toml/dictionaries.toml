# =============================================================================
# Dict Value Operations (serde_json::Value compatibility)
# =============================================================================

[[test]]
name = "dict_in_operator_uses_get"
description = "'in' operator should use Value methods, not contains_key"
tags = ["dict", "value", "in"]

[test.python]
code = '''
config = {"host": "localhost", "port": 5432}

def has_host(config):
    return "host" in config
'''

[test.assertions]
not_contains = ["config.contains_key("]
contains_any = [[".get(", ".as_object()"]]

[[test]]
name = "dict_not_in_operator"
description = "'not in' operator should use Value methods"
tags = ["dict", "value", "not-in"]

[test.python]
