[[test]]
name = "dict_access_string_variable"
description = "Dict access with string variable keys"
tags = ["dict", "access", "variable-key"]

python = '''
from typing import Dict, List

def lookup_values(data: Dict[str, int], keys: List[str]) -> List[int]:
    results = []
    for key in keys:
        if key in data:
            results.append(data[key])
        else:
            results.append(0)
    return results
'''

rust = '''
use std::collections::HashMap;
pub fn lookup_values(data: &HashMap<String, i32>, keys: &Vec<String>) -> Vec<i32> {
    let mut results = vec![];
    for key in keys.iter().cloned() {
        if data.clone().get(&key.clone()).is_some() {
            results.push(data.get(&key).cloned().unwrap());
        } else {
            results.push(0);
        }
    }
    return results;
}
'''

