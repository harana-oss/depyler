[test.python]
code = '''
def get_without_default(d: dict[str, int], key: str) -> int | None:
    result = d.get(key)
    if result is None:
        return None
    return result
'''

[test.assertions]
contains = [".cloned()"]
contains_any = [["Option<"]]

[[test]]
