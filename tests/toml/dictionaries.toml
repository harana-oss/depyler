# =============================================================================
# Dict Double Reference Prevention
# =============================================================================

[[test]]
name = "dict_pop_no_double_ref"
description = "Dict pop should not create double reference"
tags = ["dict", "reference"]

[test.python]
code = '''
def pop_entry(d: dict[str, int], key: str) -> int:
    return d.pop(key, -1)
'''

[test.assertions]
contains = ["fn pop_entry"]
not_contains = ["&&key", "& & key"]

[[test]]
name = "dict_contains_key_no_double_ref"
description = "Dict contains_key should not create double reference"
tags = ["dict", "reference"]

[test.python]
code = '''
def has_key(d: dict[str, int], key: str) -> bool:
    return key in d
'''

[test.assertions]
contains = ["fn has_key"]
not_contains = ["&&key", "& & key"]

[[test]]
name = "dict_combined_mutations"
description = "Dict combined mutations without double references"
tags = ["dict", "mutability", "reference"]

[test.python]
code = '''
def modify_dict(d: dict[str, int], k1: str, k2: str) -> dict[str, int]:
    d[k1] = 10
    if k2 in d:
        d.pop(k2)
    return d
'''

[test.assertions]
contains = ["fn modify_dict", "mut d: HashMap<String, i"]
not_contains = ["&&k2", "& & k2"]

[[test]]
name = "dict_remove_in_conditional"
description = "Dict remove in conditional without double references"
tags = ["dict", "mutability", "reference"]

[test.python]
code = '''
def remove_if_exists(d: dict[str, int], key: str) -> dict[str, int]:
    if key in d:
        d.pop(key)
    return d
'''

[test.assertions]
contains = ["fn remove_if_exists", "mut d: HashMap<String, i"]
not_contains = ["&&key", "& & key"]

