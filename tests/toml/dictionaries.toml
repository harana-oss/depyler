use std::collections::HashMap;
pub fn merge_with_pipe(d1: &HashMap<String, i32>, d2: &HashMap<String, i32>) -> HashMap<String, i32> {
    return {
        let mut __merge_result = d1.clone();
        __merge_result.extend(d2.iter().map(|(k, v)| (k.clone(), *v)));
        __merge_result
    };
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn quickcheck_merge_with_pipe() {
        fn prop(d1: (), d2: ()) -> TestResult {
            let result1 = merge_with_pipe(&d1, &d2);
            let result2 = merge_with_pipe(&d2, &d1);
            if result1 != result2 {
                return TestResult::failed();
            }
            TestResult::passed()
        }
        quickcheck(prop as fn((), ()) -> TestResult);
    }
}
