# =============================================================================
# Dict Variable Key Access
# =============================================================================

[[test]]
name = "dict_access_string_variable"
description = "Dict access with string variable keys"
tags = ["dict", "access", "variable-key"]

[test.python]
code = '''
from typing import Dict, List

def lookup_values(data: Dict[str, int], keys: List[str]) -> List[int]:
    results = []
    for key in keys:
        if key in data:
            results.append(data[key])
        else:
            results.append(0)
    return results
'''

[test.assertions]
contains = ["fn lookup_values"]
not_contains = ["key as usize"]

[[test]]
name = "dict_literal_key_access"
description = "Dict access with string literal"
tags = ["dict", "access", "literal-key"]

