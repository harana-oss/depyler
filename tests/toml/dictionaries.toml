[[test]]
name = "string_param_not_escaping"
description = "String used in comparison shouldn't use Cow"
tags = ["dict", "string", "cow"]

[test.python]
code = '''
def find_value(d: dict[str, int], search_key: str) -> int:
    for k, v in d.items():
        if k == search_key:
            return v
    return -1
'''

