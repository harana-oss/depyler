tags = ["getattr", "default"]

python = '''
class Person:
    name: str

def get_name(p: Person) -> str:
    return getattr(p, "name", "Unknown")
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Person {
    pub name: String,
}
impl Person {
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "name" => Some(Box::new(self.name.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "name" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.name = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn get_name(p: &Person) -> String {
    return p.name;
}
'''

