[[test]]
name = "property_with_conditional"
description = "Property with conditional logic"
tags = ["class", "property", "conditional"]

[test.python]
code = '''
class User:
    def __init__(self, age: int, premium: bool):
        self.age = age
        self.premium = premium

    @property
    def access_level(self) -> str:
        if self.premium:
            return "premium"
        elif self.age >= 18:
            return "adult"
        else:
            return "basic"
'''

[test.assertions]
contains = ["fn access_level", "&self"]
