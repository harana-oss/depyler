name = "formatting_class_with_error"
description = "Class transpilation with error handling (rustfmt compliant)"
tags = ["class", "formatting", "error"]
compile_check = true

python = '''
class CustomError(Exception):
    def __init__(self, message: str):
        self.message = message

class DataProcessor:
    def __init__(self, name: str, threshold: int):
        self.name = name
        self.threshold = threshold

    def process(self, value: int) -> int:
        if value < self.threshold:
            raise CustomError("Value below threshold")
        return value * 2
'''

rust = '''
#[derive(Debug, Clone)]
pub struct CustomError {
    pub message: String,
}
impl CustomError {
    pub fn new(message: String) -> Self {
        Self { message }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "message" => Some(Box::new(self.message.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "message" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.message = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
#[derive(Debug, Clone)]
pub struct DataProcessor {
    pub name: String,
    pub threshold: i32,
}
impl DataProcessor {
    pub fn new(name: String, threshold: i32) -> Self {
        Self { name, threshold }
    }
    pub fn process(&self, value: i32) -> i32 {
        if value < self.threshold {
            panic!("Exception: {}", CustomError::new("Value below threshold".to_string()));
        };
        return value * 2;
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "name" => Some(Box::new(self.name.clone()) as Box<dyn std::any::Any>),
            "threshold" => Some(Box::new(self.threshold.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "name" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.name = v.clone();
                    true
                } else {
                    false
                }
            }
            "threshold" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.threshold = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
