[[test]]
name = "formatting_impl_blocks"
description = "Class with multiple methods generates proper impl blocks"
tags = ["class", "formatting", "impl"]
compile_check = true

python = '''
class Point:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y

    def distance(self) -> float:
        return (self.x ** 2 + self.y ** 2) ** 0.5

    def __str__(self) -> str:
        return f"Point({self.x}, {self.y})"
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
    pub fn distance(&self) -> f64 {
        return ({
            if 2 >= 0 && (2 as i64) <= (u32::MAX as i64) {
                (self.x as i32)
                    .checked_pow(2 as u32)
                    .expect("Power operation overflowed")
            } else {
                (self.x as f64).powf(2 as f64) as i32
            }
        } + {
            if 2 >= 0 && (2 as i64) <= (u32::MAX as i64) {
                (self.y as i32)
                    .checked_pow(2 as u32)
                    .expect("Power operation overflowed")
            } else {
                (self.y as f64).powf(2 as f64) as i32
            }
        } as f64)
            .powf(0.5 as f64);
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "x" => Some(Box::new(self.x.clone()) as Box<dyn std::any::Any>),
            "y" => Some(Box::new(self.y.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "x" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.x = v.clone();
                    true
                } else {
                    false
                }
            }
            "y" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.y = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
'''