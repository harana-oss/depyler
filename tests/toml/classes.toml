# =============================================================================
# Properties
# =============================================================================

[[test]]
name = "class_property_getter"
description = "@property decorator for getter"
tags = ["class", "property", "getter"]

[test.python]
code = '''
class Circle:
    def __init__(self, radius: float):
        self._radius = radius
    
