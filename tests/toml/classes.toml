# =============================================================================
# setattr/getattr Tests
# =============================================================================

[[test]]
name = "setattr_literal_field"
description = "setattr with literal field name generates direct assignment"
tags = ["setattr", "literal"]

[test.python]
code = '''
class Config:
    value: int

def set_config_value(c: Config) -> None:
    setattr(c, "value", 42)
'''

[test.assertions]
contains = ["c.value = 42"]

[[test]]
name = "setattr_string_value"
description = "setattr with string value generates to_string"
tags = ["setattr", "string"]

[test.python]
code = '''
class Person:
    name: str

def set_name(p: Person) -> None:
    setattr(p, "name", "Alice")
'''

[test.assertions]
contains_any = [[".to_string()", "String::from"]]

[[test]]
name = "setattr_variable_value"
description = "setattr with variable value"
tags = ["setattr", "variable"]

[test.python]
code = '''
class Counter:
    count: int

def set_count(c: Counter, new_count: int) -> None:
    setattr(c, "count", new_count)
'''

[test.assertions]
contains = ["c.count = new_count"]

[[test]]
name = "setattr_string_variable_clones"
description = "setattr with string variable should clone"
tags = ["setattr", "string", "clone"]

[test.python]
code = '''
class Person:
    name: str

def set_name(p: Person, new_name: str) -> None:
