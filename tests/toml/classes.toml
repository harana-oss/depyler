[[test]]
name = "mix_properties_and_methods"
description = "Class mixing properties and regular methods"
tags = ["class", "property", "method", "mix"]

[test.python]
code = '''
class Account:
    def __init__(self, balance: float):
        self.balance = balance

    @property
    def formatted_balance(self) -> str:
        return "$" + str(self.balance)

    def deposit(self, amount: float) -> None:
        self.balance = self.balance + amount

    @property
    def is_positive(self) -> bool:
        return self.balance > 0.0
'''

[test.assertions]
contains = ["fn formatted_balance", "fn deposit", "fn is_positive", "&self"]

