# =============================================================================
# Task Management
# =============================================================================

[[test]]
name = "task_cancel"
description = "Cancel a running task"

python = '''
import asyncio

async def long_task() -> int:
    await asyncio.sleep(10)
    return 42

async def test_task_cancel() -> bool:
    task = asyncio.create_task(long_task())
    task.cancel()
    return task.cancelled()
'''

rust = '''
use tokio::time::{sleep, Duration};
use tokio::task;

async fn long_task() -> i32 {
    sleep(Duration::from_secs(10)).await;
    42
}

pub async fn test_task_cancel() -> bool {
    let task = task::spawn(long_task());
    task.abort();
    task.await.is_err()
}
'''


