[[test]]
name = "task_exception"
description = "Get exception from failed task"

python = '''
import asyncio

async def failing_coro() -> int:
    raise ValueError("Task failed")

async def test_task_exception() -> bool:
    task = asyncio.create_task(failing_coro())
    try:
        await task
        return False
    except ValueError:
        return task.exception() is not None
'''

rust = '''
use tokio::task;

async fn failing_coro() -> Result<i32, String> {
    Err("Task failed".to_string())
}

pub async fn test_task_exception() -> bool {
    let task = task::spawn(failing_coro());
    task.await.unwrap().is_err()
}
'''


