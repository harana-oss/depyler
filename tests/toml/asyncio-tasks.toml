# =============================================================================
# Task Groups (Python 3.11+)
# =============================================================================

[[test]]
name = "task_group"
description = "async with asyncio.TaskGroup() as tg: tg.create_task()"

python = '''
import asyncio

async def my_coro(n: int) -> int:
    return n

async def test_task_group() -> int:
    async with asyncio.TaskGroup() as tg:
        task1 = tg.create_task(my_coro(1))
        task2 = tg.create_task(my_coro(2))
    return task1.result() + task2.result()
'''

rust = '''
use tokio::task::JoinSet;

async fn my_coro(n: i32) -> i32 {
    n
}

pub async fn test_task_group() -> i32 {
    let mut set = JoinSet::new();
    set.spawn(my_coro(1));
    set.spawn(my_coro(2));
    
    let mut sum = 0;
    while let Some(result) = set.join_next().await {
        sum += result.unwrap();
    }
    sum
}
'''


[[test]]
name = "task_group_exception"
description = "TaskGroup cancels all on first exception"

python = '''
import asyncio

async def failing_coro() -> int:
    raise ValueError("Failed")

async def test_task_group_exception() -> bool:
    try:
        async with asyncio.TaskGroup() as tg:
            tg.create_task(failing_coro())
        return False
    except ValueError:
        return True
'''

rust = '''
use tokio::task::JoinSet;

async fn failing_coro() -> Result<i32, String> {
    Err("Failed".to_string())
}

pub async fn test_task_group_exception() -> bool {
    let mut set = JoinSet::new();
    set.spawn(failing_coro());
    
    while let Some(result) = set.join_next().await {
        if result.unwrap().is_err() {
            return true;
        }
    }
    false
}
'''


