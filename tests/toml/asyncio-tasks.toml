[metadata]
name = "Asyncio Tasks Tests"
category = "async"

# =============================================================================
# Creating Tasks
# =============================================================================

[[test]]
name = "create_task"
description = "task = asyncio.create_task(coro())"

python = '''
import asyncio

async def my_coro() -> int:
    return 42

async def test_create_task() -> int:
    task = asyncio.create_task(my_coro())
    return await task
'''

rust = '''
use tokio::task;

async fn my_coro() -> i32 {
    42
}

pub async fn test_create_task() -> i32 {
    let task = task::spawn(my_coro());
    task.await.unwrap()
}
'''


[[test]]
name = "task_name"
description = "asyncio.create_task(coro(), name='my_task')"

python = '''
