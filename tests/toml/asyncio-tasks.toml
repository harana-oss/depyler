[[test]]
name = "gather_basic"
description = "results = await asyncio.gather(*coros)"

python = '''
import asyncio

async def coro1() -> int:
    return 1

async def coro2() -> int:
    return 2

async def test_gather_basic() -> list:
    results = await asyncio.gather(coro1(), coro2())
    return list(results)
'''

rust = '''
