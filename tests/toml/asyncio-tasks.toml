}
'''


[[test]]
name = "gather_exceptions"
description = "gather(return_exceptions=True)"

python = '''
import asyncio

async def success_coro() -> int:
    return 1

async def failing_coro() -> int:
    raise ValueError("Failed")

async def test_gather_exceptions() -> int:
    results = await asyncio.gather(success_coro(), failing_coro(), return_exceptions=True)
    return len(results)
'''

rust = '''
use tokio::join;

async fn success_coro() -> Result<i32, String> {
    Ok(1)
}

async fn failing_coro() -> Result<i32, String> {
    Err("Failed".to_string())
}

pub async fn test_gather_exceptions() -> usize {
    let (r1, r2) = join!(success_coro(), failing_coro());
    vec![r1, r2].len()
}
'''


[[test]]
name = "gather_cancel"
description = "Cancelling gathered tasks"

python = '''
import asyncio

async def long_coro() -> int:
    await asyncio.sleep(10)
    return 1

async def test_gather_cancel() -> bool:
    task = asyncio.create_task(asyncio.gather(long_coro(), long_coro()))
    task.cancel()
    try:
        await task
        return False
    except asyncio.CancelledError:
        return True
'''

rust = '''
use tokio::time::{sleep, Duration};
use tokio::task;

async fn long_coro() -> i32 {
    sleep(Duration::from_secs(10)).await;
    1
}

pub async fn test_gather_cancel() -> bool {
    let task = task::spawn(async {
        tokio::join!(long_coro(), long_coro());
    });
    task.abort();
    task.await.is_err()
}
'''


# =============================================================================
# Waiting for Tasks
# =============================================================================

[[test]]
name = "wait_basic"
description = "done, pending = await asyncio.wait(tasks)"

python = '''
import asyncio

async def my_coro(n: int) -> int:
    return n

async def test_wait_basic() -> int:
    task1 = asyncio.create_task(my_coro(1))
    task2 = asyncio.create_task(my_coro(2))
    done, pending = await asyncio.wait([task1, task2])
    return len(done)
'''

rust = '''
use tokio::task::{self, JoinSet};

async fn my_coro(n: i32) -> i32 {
    n
}

pub async fn test_wait_basic() -> usize {
    let mut set = JoinSet::new();
    set.spawn(my_coro(1));
    set.spawn(my_coro(2));
    
    let mut count = 0;
    while let Some(_) = set.join_next().await {
        count += 1;
    }
    count
}
'''


[[test]]
name = "wait_timeout"
description = "asyncio.wait(tasks, timeout=1.0)"

python = '''
import asyncio

async def long_coro() -> int:
    await asyncio.sleep(10)
    return 1

async def test_wait_timeout() -> bool:
    task = asyncio.create_task(long_coro())
    done, pending = await asyncio.wait([task], timeout=0.1)
    return len(pending) > 0
'''

rust = '''
use tokio::time::{sleep, Duration, timeout};

async fn long_coro() -> i32 {
    sleep(Duration::from_secs(10)).await;
    1
}

pub async fn test_wait_timeout() -> bool {
    let result = timeout(Duration::from_millis(100), long_coro()).await;
    result.is_err()
}
'''


[[test]]
name = "wait_return_when"
description = "FIRST_COMPLETED, FIRST_EXCEPTION, ALL_COMPLETED"

python = '''
import asyncio

async def fast_coro() -> int:
    await asyncio.sleep(0.01)
    return 1

async def slow_coro() -> int:
    await asyncio.sleep(10)
    return 2

async def test_wait_return_when() -> int:
    task1 = asyncio.create_task(fast_coro())
    task2 = asyncio.create_task(slow_coro())
    done, pending = await asyncio.wait([task1, task2], return_when=asyncio.FIRST_COMPLETED)
    return len(done)
'''

rust = '''
use tokio::time::{sleep, Duration};
use tokio::select;

async fn fast_coro() -> i32 {
    sleep(Duration::from_millis(10)).await;
    1
}

async fn slow_coro() -> i32 {
    sleep(Duration::from_secs(10)).await;
    2
}

pub async fn test_wait_return_when() -> usize {
    let f1 = fast_coro();
    let f2 = slow_coro();
    
    select! {
        _ = f1 => 1,
        _ = f2 => 1,
    }
}
'''


