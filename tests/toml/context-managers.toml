[[test]]
name = "cm_enter"
description = "__enter__ method for setup"
python = '''
class Resource:
    def __init__(self):
        self.setup_called = False
    
    def __enter__(self):
        self.setup_called = True
        return self
    
    def __exit__(self, exc_type, exc_val, exc_tb):
        return False

r = Resource()
assert not r.setup_called
with r:
    assert r.setup_called
'''
rust = '''
struct Resource {
    setup_called: bool,
}

impl Resource {
    fn new() -> Self {
        Resource { setup_called: false }
    }
    
    fn setup(&mut self) {
        self.setup_called = true;
    }
}

let mut r = Resource::new();
assert!(!r.setup_called);
r.setup();
assert!(r.setup_called);
'''

