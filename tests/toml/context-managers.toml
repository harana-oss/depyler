rust = '''
// Rust: Drop still called on early return
struct Tracker {
    exit_called: bool,
}

impl Tracker {
    fn new() -> Self {
        Tracker { exit_called: false }
    }
}

impl Drop for Tracker {
    fn drop(&mut self) {
        // In real code, would use RefCell or similar to track
        // Conceptual example
    }
}

fn func() -> String {
    let _tracker = Tracker::new();
    return "early".to_string(); // Drop still called
    // "late".to_string()
}

let result = func();
assert_eq!(result, "early");
'''

[[test]]
name = "cm_break"
description = "break in with block still calls __exit__"
python = '''
class Counter:
    def __init__(self):
        self.enter_count = 0
        self.exit_count = 0
    
    def __enter__(self):
        self.enter_count += 1
        return self
    
    def __exit__(self, exc_type, exc_val, exc_tb):
        self.exit_count += 1
        return False

counter = Counter()
for i in range(5):
    with counter:
        if i == 2:
            break
assert counter.enter_count == 3  # Entered 0, 1, 2
assert counter.exit_count == 3   # Exited all 3 times
'''
rust = '''
// Rust: Drop called even with break
struct Counter {
    enter_count: i32,
    exit_count: i32,
}

impl Counter {
    fn new() -> Self {
        Counter { enter_count: 0, exit_count: 0 }
    }
    
    fn enter(&mut self) {
        self.enter_count += 1;
    }
}

struct Guard<'a> {
    counter: &'a mut Counter,
}

impl<'a> Drop for Guard<'a> {
    fn drop(&mut self) {
        self.counter.exit_count += 1;
    }
}

let mut counter = Counter::new();
for i in 0..5 {
    counter.enter();
    let _guard = Guard { counter: &mut counter };
    if i == 2 {
        break;
    }
    // Guard dropped here in each iteration
}
assert_eq!(counter.enter_count, 3);
assert_eq!(counter.exit_count, 3);
'''
