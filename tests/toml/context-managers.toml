[[test]]
name = "cm_custom_class"
description = "Class implementing __enter__ and __exit__"
python = '''
class Database:
    def __init__(self):
        self.connected = False
    
    def __enter__(self):
        self.connected = True
        return self
    
    def __exit__(self, exc_type, exc_val, exc_tb):
        self.connected = False
        return False
    
    def query(self):
        assert self.connected
        return "result"

db = Database()
assert not db.connected
with db:
    assert db.connected
    result = db.query()
    assert result == "result"
assert not db.connected
'''
rust = '''
struct Database {
    connected: bool,
}

impl Database {
    fn new() -> Self {
        Database { connected: false }
    }
    
    fn connect(&mut self) {
        self.connected = true;
    }
    
    fn disconnect(&mut self) {
        self.connected = false;
    }
    
    fn query(&self) -> String {
        assert!(self.connected);
        "result".to_string()
    }
}

impl Drop for Database {
    fn drop(&mut self) {
        self.disconnect();
    }
}

let mut db = Database::new();
assert!(!db.connected);
{
    db.connect();
    assert!(db.connected);
    let result = db.query();
    assert_eq!(result, "result");
} // Drop called
assert!(!db.connected);
'''

[[test]]
name = "cm_reusable"
description = "Context manager used multiple times"
python = '''
class Connection:
    def __init__(self):
        self.active = False
    
    def __enter__(self):
        self.active = True
        return self
    
    def __exit__(self, exc_type, exc_val, exc_tb):
        self.active = False
        return False

conn = Connection()

with conn:
    assert conn.active
assert not conn.active

with conn:
    assert conn.active
assert not conn.active
'''
rust = '''
struct Connection {
    active: bool,
}

impl Connection {
    fn new() -> Self {
        Connection { active: false }
    }
    
    fn open(&mut self) {
        self.active = true;
    }
    
    fn close(&mut self) {
        self.active = false;
    }
}

let mut conn = Connection::new();

{
    conn.open();
    assert!(conn.active);
    conn.close();
}
assert!(!conn.active);

{
    conn.open();
    assert!(conn.active);
    conn.close();
}
assert!(!conn.active);
'''

[[test]]
name = "cm_stateful"
description = "Context manager maintaining state"
python = '''
class Transaction:
    def __init__(self):
        self.depth = 0
        self.committed = False
    
    def __enter__(self):
        self.depth += 1
        return self
    
    def __exit__(self, exc_type, exc_val, exc_tb):
        self.depth -= 1
        if self.depth == 0 and exc_type is None:
            self.committed = True
        return False

txn = Transaction()
assert txn.depth == 0
with txn:
    assert txn.depth == 1
    with txn:
        assert txn.depth == 2
    assert txn.depth == 1
assert txn.depth == 0
assert txn.committed
'''
rust = '''
struct Transaction {
    depth: i32,
    committed: bool,
}

impl Transaction {
    fn new() -> Self {
        Transaction { depth: 0, committed: false }
    }
    
    fn begin(&mut self) {
        self.depth += 1;
    }
    
    fn end(&mut self, success: bool) {
        self.depth -= 1;
        if self.depth == 0 && success {
            self.committed = true;
        }
    }
}

let mut txn = Transaction::new();
assert_eq!(txn.depth, 0);
txn.begin();
assert_eq!(txn.depth, 1);
txn.begin();
assert_eq!(txn.depth, 2);
txn.end(true);
assert_eq!(txn.depth, 1);
txn.end(true);
assert_eq!(txn.depth, 0);
assert!(txn.committed);
'''

