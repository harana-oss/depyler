    items[0] = 42;
}
'''

[[test]]
name = "field_alias_method_mutation"
skip = true
description = "Field alias method mutation marks param as mutated"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    items: list[int]

def add_to_list(state: State) -> None:
    items = state.items
    items.append(1)
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub items: Vec<i32>,
}
impl State {
    pub fn new(items: Vec<i32>) -> Self {
        Self { items }
    }
}
pub fn add_to_list(state: &mut State) {
    let mut items = state.items.clone();
    items.push(1);
}
'''

[[test]]
name = "value_copy_does_not_mark_param_mutated"
skip = true
description = "Non-alias (value copy) does NOT mark param as mutated"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    count: int

def copy_value(state: State) -> int:
    x = state.count
    x = 10
    return x
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub count: i32,
}
impl State {
    pub fn new(count: i32) -> Self {
        Self { count }
    }
}
pub fn copy_value(state: &State) -> i32 {
    let mut x = state.count;
    x = 10;
    return x;
}
'''

[[test]]
name = "direct_param_field_access_no_alias"
skip = true
description = "Direct parameter field access without aliasing"

python = '''
from dataclasses import dataclass

@dataclass
class Config:
    enabled: bool
    value: int

def toggle_config(config: Config) -> None:
    config.enabled = not config.enabled
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Config {
    pub enabled: bool,
    pub value: i32,
}
impl Config {
    pub fn new(enabled: bool, value: i32) -> Self {
        Self { enabled, value }
    }
}
pub fn toggle_config(config: &mut Config) {
    config.enabled = !config.enabled;
}
'''
