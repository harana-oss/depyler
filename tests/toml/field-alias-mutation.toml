[metadata]
name = "Field Alias Mutation Detection Tests"
category = "ownership-mutability"
description = "Tests for field alias mutations marking parameters as mutated"

[[test]]
name = "field_alias_attribute_mutation"
skip = true
description = "Field alias attribute mutation marks param as mutated"

python = '''
from dataclasses import dataclass

@dataclass
class Stats:
    score: int

@dataclass
class State:
    home_statistics: Stats

def update_stats(state: State) -> None:
    team_stats = state.home_statistics
    team_stats.score = 10
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Stats {
    pub score: i32,
}
impl Stats {
    pub fn new(score: i32) -> Self {
        Self { score }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub home_statistics: Stats,
}
impl State {
    pub fn new(home_statistics: Stats) -> Self {
        Self { home_statistics }
    }
}
pub fn update_stats(state: &mut State) {
    let mut team_stats = state.home_statistics.clone();
    team_stats.score = 10;
}
'''

[[test]]
