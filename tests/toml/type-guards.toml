# =============================================================================
# Union Narrowing
# =============================================================================

[[test]]
name = "union_narrowing"
description = "Union type narrowing"

python = '''
from typing import Union

def process_union(value: Union[int, str]) -> str:
    if isinstance(value, int):
        return str(value)
    return value
'''

rust = '''
#[derive(Debug, Clone, PartialEq)]
pub enum IntOrStringUnion {
    Integer(i32),
    Text(String),
}
impl From<i32> for IntOrStringUnion {
    fn from(value: i32) -> Self {
        IntOrStringUnion::Integer(value)
    }
}
impl From<String> for IntOrStringUnion {
    fn from(value: String) -> Self {
        IntOrStringUnion::Text(value)
    }
}
impl IntOrStringUnion {
    pub fn is_integer(&self) -> bool {
        matches!(self, IntOrStringUnion::Integer(_))
    }
    pub fn is_text(&self) -> bool {
        matches!(self, IntOrStringUnion::Text(_))
    }
    pub fn as_integer(&self) -> Option<&i32> {
        match self {
            IntOrStringUnion::Integer(value) => Some(value),
            _ => None,
        }
    }
    pub fn as_text(&self) -> Option<&String> {
        match self {
            IntOrStringUnion::Text(value) => Some(value),
            _ => None,
        }
    }
}
pub fn process_union(value: &IntOrStringUnion) -> String {
    if true {
        return (value.clone()).to_string();
    }
    return value.clone();
}
'''

[[test]]
name = "union_narrowing_exhaustive"
description = "Exhaustive union narrowing"

python = '''
from typing import Union

def describe(value: Union[int, str, float]) -> str:
    if isinstance(value, int):
        return "integer"
    elif isinstance(value, str):
        return "string"
    else:
        return "float"
'''

rust = '''
#[derive(Debug, Clone, PartialEq)]
pub enum FloatOrIntOrStringUnion {
    Float(f64),
    Integer(i32),
    Text(String),
}
impl From<f64> for FloatOrIntOrStringUnion {
    fn from(value: f64) -> Self {
        FloatOrIntOrStringUnion::Float(value)
    }
}
impl From<i32> for FloatOrIntOrStringUnion {
    fn from(value: i32) -> Self {
        FloatOrIntOrStringUnion::Integer(value)
    }
}
impl From<String> for FloatOrIntOrStringUnion {
    fn from(value: String) -> Self {
        FloatOrIntOrStringUnion::Text(value)
    }
}
impl FloatOrIntOrStringUnion {
    pub fn is_float(&self) -> bool {
        matches!(self, FloatOrIntOrStringUnion::Float(_))
    }
    pub fn is_integer(&self) -> bool {
        matches!(self, FloatOrIntOrStringUnion::Integer(_))
    }
    pub fn is_text(&self) -> bool {
        matches!(self, FloatOrIntOrStringUnion::Text(_))
    }
    pub fn as_float(&self) -> Option<&f64> {
        match self {
            FloatOrIntOrStringUnion::Float(value) => Some(value),
            _ => None,
        }
    }
    pub fn as_integer(&self) -> Option<&i32> {
        match self {
            FloatOrIntOrStringUnion::Integer(value) => Some(value),
            _ => None,
        }
    }
    pub fn as_text(&self) -> Option<&String> {
        match self {
            FloatOrIntOrStringUnion::Text(value) => Some(value),
            _ => None,
        }
    }
}
pub fn describe(value: &FloatOrIntOrStringUnion) -> String {
    if true {
        return "integer".to_string();
    } else {
        if true {
            return "string".to_string();
        } else {
            return "float".to_string();
        }
    }
}
'''

[[test]]
name = "union_narrowing_match"
description = "Union narrowing with match-like pattern"

python = '''
from typing import Union

def handle(result: Union[int, str]) -> int:
    if isinstance(result, int):
        return result
    return len(result)
'''

rust = '''
#[derive(Debug, Clone, PartialEq)]
pub enum IntOrStringUnion {
    Integer(i32),
    Text(String),
}
impl From<i32> for IntOrStringUnion {
    fn from(value: i32) -> Self {
        IntOrStringUnion::Integer(value)
    }
}
impl From<String> for IntOrStringUnion {
    fn from(value: String) -> Self {
        IntOrStringUnion::Text(value)
    }
}
impl IntOrStringUnion {
    pub fn is_integer(&self) -> bool {
        matches!(self, IntOrStringUnion::Integer(_))
    }
    pub fn is_text(&self) -> bool {
        matches!(self, IntOrStringUnion::Text(_))
    }
    pub fn as_integer(&self) -> Option<&i32> {
        match self {
            IntOrStringUnion::Integer(value) => Some(value),
            _ => None,
        }
    }
    pub fn as_text(&self) -> Option<&String> {
        match self {
            IntOrStringUnion::Text(value) => Some(value),
            _ => None,
        }
    }
}
pub fn handle(result: &IntOrStringUnion) -> i32 {
    if true {
        return result.clone();
    }
    return result.len() as i32 as i32;
}
'''

# =============================================================================
# Optional Narrowing
# =============================================================================

[[test]]
name = "optional_narrowing"
description = "Optional[T] to T narrowing"

python = '''
from typing import Optional

def unwrap_or(value: Optional[int], default: int) -> int:
    if value is not None:
        return value
    return default
'''

rust = '''
pub fn unwrap_or(value: &Option<i32>, default: i32) -> i32 {
    if value.is_some() {
        return value.as_ref().unwrap().clone();
    }
    return default;
}
'''

[[test]]
name = "optional_narrowing_early_return"
description = "Optional narrowing with early return"

python = '''
from typing import Optional

def process_optional(value: Optional[int]) -> int:
    if value is None:
        return 0
    return value * 2
'''

rust = '''
pub fn process_optional(value: &Option<i32>) -> i32 {
    if value.is_none() {
        return 0;
    }
    return value.unwrap() * 2;
}
'''

[[test]]
name = "optional_narrowing_nested"
description = "Nested optional narrowing"

python = '''
from typing import Optional

class Container:
    def __init__(self, value: Optional[int]):
        self.value = value

def get_value(c: Optional[Container]) -> int:
    if c is not None and c.value is not None:
        return c.value
    return 0
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct Container {
    pub value: Option<i32>,
}
impl Container {
    pub fn new(value: Option<i32>) -> Self {
        Self { value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<Option<i32>>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn get_value(c: &Option<Container>) -> i32 {
    if (c.is_some()) && (c.as_ref().unwrap().value.is_some()) {
        return c.as_ref().unwrap().value;
    }
    return 0;
}
'''

[[test]]
name = "optional_narrowing_method_chain"
description = "Optional narrowing in method chain"

python = '''
