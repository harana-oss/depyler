[metadata]
name = "Type Guards Tests"
category = "type-narrowing"

# =============================================================================
# isinstance Narrowing
# =============================================================================

[[test]]
name = "isinstance_narrowing"
description = "isinstance() type narrowing"

python = '''
def process(value: object) -> int:
    if isinstance(value, int):
        return value * 2
    return 0
'''

rust = '''
pub fn process(value: i32) -> i32 {
    return value * 2;
}
'''

[[test]]
name = "isinstance_narrowing_str"
description = "isinstance narrowing for strings"

python = '''
def get_length(value: object) -> int:
    if isinstance(value, str):
        return len(value)
    return 0
'''

rust = '''
pub fn get_length(value: &str) -> i32 {
    return value.len() as i32;
}
'''

[[test]]
name = "isinstance_narrowing_list"
description = "isinstance narrowing for lists"

python = '''
def sum_if_list(value: object) -> int:
    if isinstance(value, list):
        return sum(value)
    return 0
'''

rust = '''
pub fn sum_if_list(value: Vec<i32>) -> i32 {
    return value.iter().sum::<i32>();
}
'''

[[test]]
name = "isinstance_narrowing_custom"
description = "isinstance narrowing for custom class"

python = '''
class Box:
    def __init__(self, value: int):
        self.value = value

def unbox(obj: object) -> int:
    if isinstance(obj, Box):
        return obj.value
    return 0
'''

rust = '''
pub struct Box {
    pub value: i32,
}

impl Box {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}

pub fn unbox(obj: &Box) -> i32 {
    return obj.value;
}
'''

[[test]]
name = "isinstance_multiple_types"
description = "isinstance with multiple types"

python = '''
def to_int(value: object) -> int:
    if isinstance(value, (int, float)):
        return int(value)
    return 0
'''

rust = '''
pub fn to_int(value: f64) -> i32 {
    return value as i32;
}
'''

# =============================================================================
# TypeGuard Function
# =============================================================================

[[test]]
name = "typeguard_function"
description = "TypeGuard function support"

python = '''
from typing import TypeGuard

def is_int_list(value: list) -> TypeGuard[list[int]]:
    return all(isinstance(x, int) for x in value)

def process_ints(items: list) -> int:
    if is_int_list(items):
        return sum(items)
    return 0
'''

rust = '''
pub fn is_int_list(value: &Vec<i32>) -> bool {
    return true;
}

pub fn process_ints(items: Vec<i32>) -> i32 {
    if is_int_list(&items) {
        return items.iter().sum::<i32>();
    }
    return 0;
}
'''

[[test]]
name = "typeguard_custom"
description = "Custom TypeGuard implementation"

python = '''
from typing import TypeGuard

class ValidData:
    def __init__(self, value: int):
        self.value = value

def is_valid(data: object) -> TypeGuard[ValidData]:
    return isinstance(data, ValidData) and data.value >= 0

def process_valid(data: object) -> int:
    if is_valid(data):
        return data.value
    return -1
'''

rust = '''
pub struct ValidData {
    pub value: i32,
}

impl ValidData {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}

pub fn is_valid(data: &ValidData) -> bool {
    return data.value >= 0;
}

pub fn process_valid(data: &ValidData) -> i32 {
    if is_valid(data) {
        return data.value;
    }
    return -1;
}
'''

