# =============================================================================
# TypeGuard Function
# =============================================================================

[[test]]
name = "typeguard_function"
description = "TypeGuard function support"

python = '''
from typing import TypeGuard

def is_int_list(value: list) -> TypeGuard[list[int]]:
    return all(isinstance(x, int) for x in value)

def process_ints(items: list) -> int:
    if is_int_list(items):
        return sum(items)
    return 0
'''

rust = '''
use serde_json;
pub fn is_int_list(value: &Vec<serde_json::Value>) -> bool {
    return value.iter().cloned().map(|x| true).all(|x| x);
}
pub fn process_ints(items: &Vec<serde_json::Value>) -> i32 {
    if is_int_list(items) {
        return items.iter().sum::<i32>();
    }
    return 0;
}
'''

[[test]]
name = "typeguard_custom"
description = "Custom TypeGuard implementation"

python = '''
from typing import TypeGuard

class ValidData:
    def __init__(self, value: int):
        self.value = value

def is_valid(data: object) -> TypeGuard[ValidData]:
    return isinstance(data, ValidData) and data.value >= 0

def process_valid(data: object) -> int:
    if is_valid(data):
        return data.value
    return -1
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct ValidData {
    pub value: i32,
}
impl ValidData {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn is_valid(data: &object) -> bool {
    return (true) && (data.value >= 0);
}
pub fn process_valid(data: object) -> i32 {
    if is_valid(&data) {
        return data.value;
    }
    return -1;
}
'''

