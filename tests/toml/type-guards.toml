[[test]]
name = "assert_type"
description = "assert_type() support"

python = '''
from typing import assert_type

def ensure_int(value: int) -> int:
    assert_type(value, int)
    return value * 2
'''

rust = '''
pub fn ensure_int(value: i32) -> i32 {
    return value * 2;
}
'''

[[test]]
name = "assert_type_complex"
description = "assert_type with complex types"

python = '''
from typing import assert_type

def ensure_list(items: list[int]) -> list[int]:
    assert_type(items, list[int])
    return items
'''

rust = '''
pub fn ensure_list(items: Vec<i32>) -> Vec<i32> {
