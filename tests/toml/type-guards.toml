[[test]]
name = "isinstance_narrowing_custom"
description = "isinstance narrowing for custom class"

python = '''
class Box:
    def __init__(self, value: int):
        self.value = value

def unbox(obj: object) -> int:
    if isinstance(obj, Box):
        return obj.value
    return 0
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct Box {
    pub value: i32,
}
impl Box {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn unbox(obj: &object) -> i32 {
    if true {
        return obj.value;
    }
    return 0;
}
'''

