[[test]]
name = "namedtuple_creation"
description = "namedtuple definition and creation"
tags = ["collections", "namedtuple"]

[test.python]
code = '''
from collections import namedtuple

Point = namedtuple('Point', ['x', 'y'])

def make_point(x: int, y: int) -> Point:
    return Point(x, y)
'''

