[[test]]
name = "bisect_left"
description = "bisect.bisect_left() leftmost insert point"

python = '''
import bisect

def find_insert_left(a: list, x: int) -> int:
    return bisect.bisect_left(a, x)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'bisect'()"]
pub fn find_insert_left(a: &Vec<serde_json::Value>, x: i32) -> i32 {
    return {
        let arr = a;
        let val = &x;
        match arr.binary_search(val) {
            Ok(mut pos) => {
                while pos > 0 && &arr[pos - 1] == val {
                    pos -= 1;
                }
                pos
            }
            Err(pos) => pos,
        }
    }
'''

[[test]]
name = "bisect_right"
description = "bisect.bisect_right() rightmost insert point"

python = '''
import bisect

def find_insert_right(a: list, x: int) -> int:
    return bisect.bisect_right(a, x)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'bisect'()"]
pub fn find_insert_right(a: &Vec<serde_json::Value>, x: i32) -> i32 {
    return {
        let arr = a;
        let val = &x;
        match arr.binary_search(val) {
            Ok(mut pos) => {
                pos += 1;
                while pos < arr.len() && &arr[pos] == val {
                    pos += 1;
                }
                pos
            }
            Err(pos) => pos,
        }
    }
'''

[[test]]
name = "bisect_insort_left"
description = "bisect.insort_left() insert in sorted order"

python = '''
import bisect

def insert_left(a: list, x: int) -> None:
    bisect.insort_left(a, x)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'bisect'()"]
pub fn insert_left(a: &Vec<serde_json::Value>, x: i32) {
    {
        let arr = &mut (a);
        let val = x;
        let pos = match arr.binary_search(&val) {
            Ok(mut pos) => {
                while pos > 0 && arr[pos - 1] == val {
                    pos -= 1;
                }
                pos
            }
            Err(pos) => pos,
        };
        arr.insert(pos, val);
    }
'''

