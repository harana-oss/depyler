[[test]]
name = "counter_elements"
description = "Counter.elements() iteration"

python = '''
from collections import Counter

def expand_counts(counts: dict[str, int]) -> list[str]:
    c = Counter(counts)
    return list(c.elements())
'''

rust = '''
use std::collections::HashMap;
pub fn expand_counts(counts: HashMap<String, i32>) -> Vec<String> {
    let c = counts.into_iter().fold(HashMap::new(), |mut acc, item| {
        *acc.entry(item).or_insert(0) += 1;
        acc
    });
    return c.elements().into_iter().collect::<Vec<_>>();
}
'''

[[test]]
name = "defaultdict_int"
description = "defaultdict with int factory"

python = '''
from collections import defaultdict

def count_words(words: list[str]) -> dict[str, int]:
    counts = defaultdict(int)
    for word in words:
        counts[word] += 1
    return dict(counts)
'''

rust = '''
use std::collections::HashMap;
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn count_words(words: &Vec<String>) -> HashMap<String, i32> {
    let mut counts = std::collections::HashMap(int);
    for word in words.iter().cloned() {
        {
            let _key = word;
            let _old_val = counts.get(&_key).cloned().unwrap_or_default();
            counts.insert(_key, _old_val + 1);
        }
    }
    return counts.into_iter().collect::<HashMap<_, _>>();
}
'''

[[test]]
name = "defaultdict_list"
description = "defaultdict with list factory"

python = '''
from collections import defaultdict

def group_by_first_char(words: list[str]) -> dict[str, list[str]]:
    groups = defaultdict(list)
    for word in words:
        groups[word[0]].append(word)
    return dict(groups)
'''

rust = '''
use std::collections::HashMap;
pub fn group_by_first_char(words: &Vec<String>) -> HashMap<String, Vec<String>> {
    let mut groups = std::collections::HashMap(list);
    for word in words.iter().cloned() {
        {
            let base = &groups;
            let idx: i32 = {
                let base = &word.clone();
                let idx: i32 = 0;
                let actual_idx = if idx < 0 {
                    base.chars().count().saturating_sub(idx.abs() as usize)
                } else {
                    idx as usize
                };
                base.chars().nth(actual_idx).map(|c| c.to_string()).unwrap()
            };
            let actual_idx = if idx < 0 {
                base.len().saturating_sub(idx.abs() as usize)
            } else {
                idx as usize
            };
            base.get(actual_idx).cloned().unwrap()
        }
        .push(word);
    }
    return groups.into_iter().collect::<HashMap<_, _>>();
}
'''

