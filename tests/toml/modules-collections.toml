[[test]]
name = "heapq_heapify"
description = "heapq.heapify() create min-heap"

python = '''
import heapq

def create_heap(items: list) -> None:
    heapq.heapify(items)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'heapq'()"]
pub fn create_heap(items: &Vec<serde_json::Value>) {
    {
        let heap = &mut (items);
        let len = heap.len();
        if len > 1 {
            for i in (0..len / 2).rev() {
                let mut pos = i;
                loop {
                    let left = 2 * pos + 1;
                    let right = 2 * pos + 2;
                    let mut smallest = pos;
                    if left < len && heap[left] < heap[smallest] {
                        smallest = left;
                    }
                    if right < len && heap[right] < heap[smallest] {
                        smallest = right;
                    }
                    if smallest == pos {
                        break;
                    }
                    heap.swap(pos, smallest);
                    pos = smallest;
                }
            }
        }
    }
'''

[[test]]
name = "heapq_heappush"
description = "heapq.heappush() add to heap"

python = '''
import heapq

def push_item(heap: list, item: int) -> None:
    heapq.heappush(heap, item)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'heapq'()"]
pub fn push_item(heap: &Vec<serde_json::Value>, item: i32) {
    {
        let heap = &mut (heap);
        let item = item;
        heap.push(item);
        let mut pos = heap.len() - 1;
        while pos > 0 {
            let parent = (pos - 1) / 2;
            if heap[pos] >= heap[parent] {
                break;
            }
            heap.swap(pos, parent);
            pos = parent;
        }
    }
'''

[[test]]
name = "heapq_heappop"
description = "heapq.heappop() remove min"

python = '''
import heapq

def pop_min(heap: list) -> int:
    return heapq.heappop(heap)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'heapq'()"]
pub fn pop_min(heap: &Vec<serde_json::Value>) -> i32 {
    return {
        let heap = &mut (heap);
        if heap.is_empty() {
            panic!("heappop from empty heap");
        }
        let result = heap[0].clone();
        let last = heap.pop().unwrap();
        if !heap.is_empty() {
            heap[0] = last;
            let mut pos = 0;
            loop {
                let left = 2 * pos + 1;
                let right = 2 * pos + 2;
                let mut smallest = pos;
                if left < heap.len() && heap[left] < heap[smallest] {
                    smallest = left;
                }
                if right < heap.len() && heap[right] < heap[smallest] {
                    smallest = right;
                }
                if smallest == pos {
                    break;
                }
                heap.swap(pos, smallest);
                pos = smallest;
            }
        }
        result
    };
}
'''

[[test]]
name = "heapq_nlargest"
description = "heapq.nlargest() get n largest"

python = '''
import heapq

def get_largest(n: int, items: list) -> list:
    return heapq.nlargest(n, items)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'heapq'()"]
pub fn get_largest(n: i32, items: &Vec<serde_json::Value>) -> Vec<serde_json::Value> {
    return {
        let n = n as usize;
        let mut items = items;
        items.sort_by(|a, b| b.cmp(a));
        items.into_iter().take(n).collect::<Vec<_>>()
    }
'''

