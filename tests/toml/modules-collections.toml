# Collections Module Tests - Migrated from test_collections_unit.rs, test_counter_unit.rs, test_defaultdict_unit.rs, test_deque_unit.rs

[metadata]
name = "Collections Module Tests"
category = "stdlib-collections"

# =============================================================================
# Counter
# =============================================================================

[[test]]
name = "counter_from_list"
description = "Counter from list initialization"
tags = ["collections", "counter"]

[test.python]
code = '''
from collections import Counter

def count_items(items: list[str]) -> dict[str, int]:
    return dict(Counter(items))
'''

[test.assertions]
contains_any = [["HashMap", "count", "entry"]]

[[test]]
name = "counter_most_common"
description = "Counter.most_common() method"
tags = ["collections", "counter"]

[test.python]
code = '''
from collections import Counter

def top_items(items: list[str], n: int) -> list[tuple[str, int]]:
    return Counter(items).most_common(n)
'''

[test.assertions]
contains_any = [["sort", "HashMap", "Vec"]]

[[test]]
name = "counter_elements"
description = "Counter.elements() iteration"
tags = ["collections", "counter"]

[test.python]
code = '''
from collections import Counter

def expand_counts(counts: dict[str, int]) -> list[str]:
    c = Counter(counts)
    return list(c.elements())
'''

[test.assertions]
contains_any = [["flat_map", "repeat", "iter"]]

# =============================================================================
# DefaultDict
# =============================================================================

[[test]]
name = "defaultdict_int"
description = "defaultdict with int factory"
tags = ["collections", "defaultdict"]

[test.python]
code = '''
from collections import defaultdict

def count_words(words: list[str]) -> dict[str, int]:
    counts = defaultdict(int)
    for word in words:
        counts[word] += 1
    return dict(counts)
'''

[test.assertions]
contains_any = [["entry", "or_insert", "HashMap"]]

[[test]]
name = "defaultdict_list"
description = "defaultdict with list factory"
tags = ["collections", "defaultdict"]

[test.python]
code = '''
from collections import defaultdict

def group_by_first_char(words: list[str]) -> dict[str, list[str]]:
    groups = defaultdict(list)
    for word in words:
        groups[word[0]].append(word)
    return dict(groups)
'''

[test.assertions]
contains_any = [["entry", "or_insert_with", "HashMap", "Vec"]]

