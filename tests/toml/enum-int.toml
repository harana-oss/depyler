[metadata]
name = "IntEnum Tests"
category = "data-structures"

# =============================================================================
# Basic IntEnum
# =============================================================================

[[test]]
name = "intenum_basic"
skip = true
description = "IntEnum inherits from both int and Enum"
python = '''
from enum import IntEnum

class Priority(IntEnum):
    LOW = 1
    MEDIUM = 2
    HIGH = 3

assert Priority.LOW == 1
assert Priority.HIGH == 3
assert isinstance(Priority.LOW, int)
'''
rust = '''
#[repr(i32)]
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
enum Priority {
    Low = 1,
    Medium = 2,
    High = 3,
}

assert_eq!(Priority::Low as i32, 1);
assert_eq!(Priority::High as i32, 3);
'''

