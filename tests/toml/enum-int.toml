# =============================================================================
# IntFlag
# =============================================================================

[[test]]
name = "intflag_basic"
skip = true
description = "IntFlag for bitwise flag operations"
python = '''
from enum import IntFlag

class Perm(IntFlag):
    R = 4
    W = 2
    X = 1

assert Perm.R == 4
assert Perm.W == 2
assert Perm.X == 1
'''
rust = '''
use std::ops::{BitAnd, BitOr};

#[repr(i32)]
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
struct Perm(i32);

impl Perm {
    const R: Perm = Perm(4);
    const W: Perm = Perm(2);
    const X: Perm = Perm(1);
}

impl BitOr for Perm {
    type Output = Perm;
    fn bitor(self, rhs: Self) -> Self::Output {
        Perm(self.0 | rhs.0)
    }
}

impl BitAnd for Perm {
    type Output = Perm;
    fn bitand(self, rhs: Self) -> Self::Output {
        Perm(self.0 & rhs.0)
    }
}

assert_eq!(Perm::R.0, 4);
assert_eq!(Perm::W.0, 2);
assert_eq!(Perm::X.0, 1);
'''

[[test]]
name = "intflag_or"
skip = true
description = "Combine flags with bitwise OR"
python = '''
from enum import IntFlag

class Perm(IntFlag):
    R = 4
    W = 2
    X = 1

rw = Perm.R | Perm.W
assert rw == 6
assert isinstance(rw, Perm)
'''
rust = '''
    use std::ops::BitOr;

    #[repr(i32)]
    #[derive(Debug, Clone, Copy, PartialEq, Eq)]
    struct Perm(i32);

    impl Perm {
        const R: Perm = Perm(4);
        const W: Perm = Perm(2);
        const X: Perm = Perm(1);
    }

    impl BitOr for Perm {
        type Output = Perm;
        fn bitor(self, rhs: Self) -> Self::Output {
            Perm(self.0 | rhs.0)
        }
    }

    let rw = Perm::R | Perm::W;
    assert_eq!(rw.0, 6);
'''

[[test]]
name = "intflag_and"
skip = true
description = "Test flags with bitwise AND"
python = '''
from enum import IntFlag

class Perm(IntFlag):
    R = 4
    W = 2
    X = 1

rw = Perm.R | Perm.W
has_read = (rw & Perm.R) == Perm.R
has_execute = (rw & Perm.X) == Perm.X
assert has_read
assert not has_execute
'''
rust = '''
    use std::ops::{BitAnd, BitOr};

    #[repr(i32)]
    #[derive(Debug, Clone, Copy, PartialEq, Eq)]
    struct Perm(i32);

    impl Perm {
        const R: Perm = Perm(4);
        const W: Perm = Perm(2);
        const X: Perm = Perm(1);
    }

    impl BitOr for Perm {
        type Output = Perm;
        fn bitor(self, rhs: Self) -> Self::Output {
            Perm(self.0 | rhs.0)
        }
    }

    impl BitAnd for Perm {
        type Output = Perm;
        fn bitand(self, rhs: Self) -> Self::Output {
            Perm(self.0 & rhs.0)
        }
    }

    let rw = Perm::R | Perm::W;
    let has_read = (rw & Perm::R).0 == Perm::R.0;
    let has_execute = (rw & Perm::X).0 == Perm::X.0;
    assert!(has_read);
    assert!(!has_execute);
'''

[[test]]
name = "intflag_in"
skip = true
description = "Check flag membership"
python = '''
from enum import IntFlag

class Perm(IntFlag):
    R = 4
    W = 2
    X = 1

rw = Perm.R | Perm.W
assert Perm.R in rw
assert Perm.W in rw
assert Perm.X not in rw
'''
rust = '''
    use std::ops::{BitAnd, BitOr};

    #[repr(i32)]
    #[derive(Debug, Clone, Copy, PartialEq, Eq)]
    struct Perm(i32);

    impl Perm {
        const R: Perm = Perm(4);
        const W: Perm = Perm(2);
        const X: Perm = Perm(1);

        fn contains(self, flag: Perm) -> bool {
            (self.0 & flag.0) == flag.0
        }
    }

    impl BitOr for Perm {
        type Output = Perm;
        fn bitor(self, rhs: Self) -> Self::Output {
            Perm(self.0 | rhs.0)
        }
    }

    let rw = Perm::R | Perm::W;
    assert!(rw.contains(Perm::R));
    assert!(rw.contains(Perm::W));
    assert!(!rw.contains(Perm::X));
'''

