# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "intenum_sort"
skip = true
description = "Sort IntEnum values"
python = '''
from enum import IntEnum

class Priority(IntEnum):
    LOW = 1
    MEDIUM = 2
    HIGH = 3

values = [Priority.HIGH, Priority.LOW, Priority.MEDIUM]
sorted_values = sorted(values)
assert sorted_values == [Priority.LOW, Priority.MEDIUM, Priority.HIGH]
'''
rust = '''
    #[repr(i32)]
    #[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]
    enum Priority {
        Low = 1,
        Medium = 2,
        High = 3,
    }

    let mut values = vec![Priority::High, Priority::Low, Priority::Medium];
    values.sort();
    assert_eq!(
        values,
        vec![Priority::Low, Priority::Medium, Priority::High]
    );
'''

[[test]]
name = "intenum_dict"
skip = true
description = "IntEnum as dict key"
python = '''
from enum import IntEnum

class Priority(IntEnum):
    LOW = 1
    HIGH = 2

mapping = {
    Priority.HIGH: "important",
    Priority.LOW: "can wait"
}

assert mapping[Priority.HIGH] == "important"
assert mapping[2] == "important"  # Can use int value
'''
rust = '''
    use std::collections::HashMap;

    #[repr(i32)]
    #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
    enum Priority {
        Low = 1,
        High = 2,
    }

    let mut mapping = HashMap::new();
    mapping.insert(Priority::High, "important");
    mapping.insert(Priority::Low, "can wait");

    assert_eq!(mapping[&Priority::High], "important");
    // Rust: can't mix enum and int as keys
'''

