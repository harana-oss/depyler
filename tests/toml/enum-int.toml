[[test]]
name = "flag_iter"
description = "Iterate over flags in a combination"
skip = ["complex-iteration"]
python = '''
from enum import Flag, auto

class Color(Flag):
    RED = auto()
    GREEN = auto()
    BLUE = auto()

purple = Color.RED | Color.BLUE
flags = list(purple)
assert len(flags) == 2
assert Color.RED in flags
assert Color.BLUE in flags
'''
rust = '''
    // Rust doesn't have built-in flag iteration
    // Would need custom implementation
    use std::ops::BitOr;

    #[repr(i32)]
    #[derive(Debug, Clone, Copy, PartialEq, Eq)]
    struct Color(i32);

    impl Color {
        const RED: Color = Color(1);
        const GREEN: Color = Color(2);
        const BLUE: Color = Color(4);

        fn iter_flags(self) -> Vec<Color> {
            let mut result = Vec::new();
            if self.0 & Color::RED.0 != 0 {
                result.push(Color::RED);
            }
            if self.0 & Color::GREEN.0 != 0 {
                result.push(Color::GREEN);
            }
            if self.0 & Color::BLUE.0 != 0 {
                result.push(Color::BLUE);
            }
            result
        }
    }

    impl BitOr for Color {
        type Output = Color;
        fn bitor(self, rhs: Self) -> Self::Output {
            Color(self.0 | rhs.0)
        }
    }

    let purple = Color::RED | Color::BLUE;
    let flags = purple.iter_flags();
    assert_eq!(flags.len(), 2);
'''

# =============================================================================
# StrEnum (Python 3.11+)
# =============================================================================

[[test]]
name = "strenum_basic"
description = "StrEnum with string values"
skip = ["python-3.11"]
python = '''
# Python 3.11+
from enum import StrEnum

class Status(StrEnum):
    OK = "ok"
    ERROR = "error"

assert Status.OK == "ok"
assert isinstance(Status.OK, str)
'''
rust = '''
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
enum Status {
    Ok,
    Error,
}

impl Status {
    fn as_str(&self) -> &'static str {
        match self {
            Status::Ok => "ok",
            Status::Error => "error",
        }
    }
}

assert_eq!(Status::Ok.as_str(), "ok");
'''

[[test]]
name = "strenum_str_ops"
description = "StrEnum supports string operations"
skip = ["python-3.11"]
python = '''
# Python 3.11+
from enum import StrEnum

class Status(StrEnum):
    OK = "ok"

assert Status.OK.upper() == "OK"
assert Status.OK.startswith("o")
'''
rust = '''
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
enum Status {
    Ok,
}

impl Status {
    fn as_str(&self) -> &'static str {
        match self {
            Status::Ok => "ok",
        }
    }
}

assert_eq!(Status::Ok.as_str().to_uppercase(), "OK");
assert!(Status::Ok.as_str().starts_with("o"));
'''

