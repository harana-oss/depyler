'''

[[test]]
name = "negative_int_list_static_array"
description = "List with negative integers generates pub static array"

python = '''
OFFSETS = [-1, 0, 1]
'''

rust = '''
pub static OFFSETS: [i32; 3] = [-1, 0, 1];
'''

[[test]]
name = "string_list_still_lazy_static"
description = "String lists still use lazy_static Vec since strings need heap"

python = '''
NAMES = ["Alice", "Bob"]
'''

rust = '''
lazy_static::lazy_static! {
    pub static ref NAMES: Vec<String> = vec!["Alice".to_string(), "Bob".to_string()];
}
'''

[[test]]
name = "static_array_index_variable"
description = "Indexing a static array constant with a variable uses direct bracket indexing"

python = '''
X_VALUES = [(0, 100), (100, 200), (200, 300)]

def get_x_value(x_position: int) -> tuple:
    return X_VALUES[x_position]
'''

[test.assertions]
contains = ["X_VALUES[x_position as usize]"]
not_contains = ["X_VALUES.get("]

[[test]]
name = "static_array_index_literal"
description = "Indexing a static array constant with a literal uses direct bracket indexing"

python = '''
SCORES = [10, 20, 30]

def get_first() -> int:
    return SCORES[0]
'''

[test.assertions]
contains = ["SCORES[0usize]"]
not_contains = ["SCORES.get("]

