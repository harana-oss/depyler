# =============================================================================
# Tail Call Optimization
# =============================================================================

[[test]]
name = "tail_call_optimization"
skip = true
description = "Tail call optimization detection"

python = '''
def factorial_iter(n: int) -> int:
    result = 1
    for i in range(1, n + 1):
        result *= i
    return result
'''

rust = '''
pub fn factorial_iter(n: i32) -> i32 {
    let mut result = 1;
    for i in 1..=n {
        result *= i;
    }
    return result;
}
'''

[[test]]
name = "tail_recursion_converted"
