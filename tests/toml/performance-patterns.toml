[metadata]
name = "Performance Patterns Tests"
category = "optimization"

# =============================================================================
# Loop Invariant Hoisting
# =============================================================================

[[test]]
name = "loop_invariant_hoisting"
skip = true
description = "Loop invariant code motion"

python = '''
def sum_with_factor(items: list[int], factor: int) -> int:
    total = 0
    for item in items:
        total += item * factor
    return total
'''

rust = '''
pub fn sum_with_factor(items: Vec<i32>, factor: i32) -> i32 {
    let mut total = 0;
    for item in items {
        total += item * factor;
    }
    return total;
}
'''

[[test]]
name = "loop_invariant_len"
skip = true
description = "Hoist length calculation"

python = '''
def process_all(items: list[int]) -> int:
    n = len(items)
    total = 0
    for i in range(n):
        total += items[i]
    return total
'''

rust = '''
pub fn process_all(items: Vec<i32>) -> i32 {
    let n = items.len();
    let mut total = 0;
    for i in 0..n {
        total += items[i];
    }
    return total;
}
'''

[[test]]
name = "loop_invariant_expression"
skip = true
description = "Hoist invariant expression"

python = '''
def compute_with_constant(items: list[int], a: int, b: int) -> int:
    multiplier = a + b
    total = 0
    for item in items:
        total += item * multiplier
    return total
'''

rust = '''
pub fn compute_with_constant(items: Vec<i32>, a: i32, b: i32) -> i32 {
    let multiplier = a + b;
    let mut total = 0;
    for item in items {
        total += item * multiplier;
    }
    return total;
}
'''

# =============================================================================
# Strength Reduction
# =============================================================================

[[test]]
name = "strength_reduction"
skip = true
description = "Strength reduction optimizations"

python = '''
def power_of_two(n: int) -> int:
    return n * 2
'''

rust = '''
pub fn power_of_two(n: i32) -> i32 {
    return n << 1;
}
'''

