# =============================================================================
# Inlining Heuristics
# =============================================================================

[[test]]
name = "inlining_heuristics"
skip = true
description = "Function inlining decisions"

python = '''
def square(x: int) -> int:
    return x * x

def sum_of_squares(a: int, b: int) -> int:
    return square(a) + square(b)
'''

rust = '''
#[inline]
pub fn square(x: i32) -> i32 {
    return x * x;
}

pub fn sum_of_squares(a: i32, b: i32) -> i32 {
    return square(a) + square(b);
}
'''

[[test]]
name = "inline_simple_accessor"
skip = true
description = "Inline simple accessor"

python = '''
class Point:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y
    
    def get_x(self) -> int:
        return self.x
    
    def get_y(self) -> int:
        return self.y
'''

rust = '''
pub struct Point {
    pub x: i32,
    pub y: i32,
}

impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }

    #[inline]
    pub fn get_x(&self) -> i32 {
        return self.x;
    }

    #[inline]
    pub fn get_y(&self) -> i32 {
        return self.y;
    }
}
'''

[[test]]
name = "inline_wrapper"
skip = true
description = "Inline wrapper functions"

python = '''
def add(a: int, b: int) -> int:
    return a + b

def increment(x: int) -> int:
    return add(x, 1)
'''

rust = '''
#[inline]
pub fn add(a: i32, b: i32) -> i32 {
    return a + b;
}

pub fn increment(x: i32) -> i32 {
    return add(x, 1);
}
'''

# =============================================================================
# Bounds Check Elimination
# =============================================================================

[[test]]
name = "bounds_check_elimination"
skip = true
description = "Bounds check elimination"

python = '''
def safe_access(items: list[int], idx: int) -> int:
    if 0 <= idx < len(items):
        return items[idx]
    return 0
'''

rust = '''
pub fn safe_access(items: &Vec<i32>, idx: i32) -> i32 {
    if 0 <= idx && (idx as usize) < items.len() {
        return items[idx as usize];
    }
    return 0;
}
'''

[[test]]
name = "bounds_checked_loop"
skip = true
description = "Loop with bounds already checked"

python = '''
def sum_array(items: list[int]) -> int:
