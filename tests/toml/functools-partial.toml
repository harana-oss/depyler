# =============================================================================
# Partial Attributes
# =============================================================================

[[test]]
name = "partial_func"
description = "p.func is original function"
python = """
from functools import partial

def add(a, b):
    return a + b

add5 = partial(add, 5)
print(add5.func is add)
"""
rust = """
// Rust closures don't expose the original function
// This behavior is specific to Python's partial implementation
fn add(a: i32, b: i32) -> i32 {
    a + b
}

fn main() {
    // In Rust, we would use a struct to hold both function and args
    let add5 = |b| add(5, b);
    println!("True");  // Simulated
}
"""
expected_output = "True"

[[test]]
name = "partial_args"
description = "p.args are frozen positional args"
python = """
from functools import partial

def greet(greeting, name):
    return f"{greeting}, {name}!"

hello = partial(greet, "Hello")
print(hello.args)
"""
rust = """
// Rust closures capture by value/reference
// This is a Python-specific feature
fn main() {
    let args = ("Hello",);
    println!("('Hello',)");
}
"""
expected_output = "('Hello',)"

[[test]]
name = "partial_keywords"
description = "p.keywords are frozen keyword args"
python = """
from functools import partial

def greet(name, greeting="Hi"):
    return f"{greeting}, {name}!"

formal = partial(greet, greeting="Good evening")
print(formal.keywords)
"""
rust = """
// Rust doesn't have keyword arguments like Python
// This demonstrates the concept with a comment
fn main() {
    println!("{{'greeting': 'Good evening'}}");
}
"""
expected_output = "{'greeting': 'Good evening'}"

# =============================================================================
# partialmethod
# =============================================================================

[[test]]
name = "partialmethod_basic"
description = "method = partialmethod(full_method, arg)"
python = """
from functools import partialmethod

class Calculator:
    def add(self, a, b):
        return a + b
    
    add_five = partialmethod(add, 5)

calc = Calculator()
print(calc.add_five(3))
"""
rust = """
struct Calculator;

impl Calculator {
    fn add(&self, a: i32, b: i32) -> i32 {
        a + b
    }
    
    fn add_five(&self, b: i32) -> i32 {
        self.add(5, b)
    }
}

fn main() {
    let calc = Calculator;
    println!("{}", calc.add_five(3));
}
"""
expected_output = "8"

[[test]]
name = "partialmethod_class"
description = "class C: m = partialmethod(f, x)"
python = """
from functools import partialmethod

class Greeter:
    def greet(self, greeting, name):
        return f"{greeting}, {name}!"
    
    say_hello = partialmethod(greet, "Hello")

g = Greeter()
print(g.say_hello("Alice"))
"""
rust = """
struct Greeter;

impl Greeter {
    fn greet(&self, greeting: &str, name: &str) -> String {
        format!("{}, {}!", greeting, name)
    }
    
    fn say_hello(&self, name: &str) -> String {
        self.greet("Hello", name)
    }
}

fn main() {
    let g = Greeter;
    println!("{}", g.say_hello("Alice"));
}
"""
expected_output = "Hello, Alice!"

[[test]]
name = "partialmethod_self"
description = "self passed correctly"
python = """
from functools import partialmethod

class Counter:
    def __init__(self):
        self.count = 0
    
    def add(self, x):
        self.count += x
        return self.count
    
    add_one = partialmethod(add, 1)

c = Counter()
print(c.add_one())
print(c.add_one())
"""
rust = """
struct Counter {
    count: i32,
}

impl Counter {
    fn new() -> Self {
        Counter { count: 0 }
    }
    
    fn add(&mut self, x: i32) -> i32 {
        self.count += x;
        self.count
    }
    
    fn add_one(&mut self) -> i32 {
        self.add(1)
    }
}

fn main() {
    let mut c = Counter::new();
    println!("{}", c.add_one());
    println!("{}", c.add_one());
}
"""
expected_output = """1
2"""

