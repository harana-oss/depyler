# Edge Cases
# =============================================================================

[[test]]
name = "partial_nested"
skip = true
description = "partial(partial(f, a), b)"
python = """
from functools import partial

def add_three(a, b, c):
    return a + b + c

add_10 = partial(add_three, 10)
add_10_20 = partial(add_10, 20)
print(add_10_20(30))
"""
rust = """
fn add_three(a: i32, b: i32, c: i32) -> i32 {
    a + b + c
}

let add_10 = |b, c| add_three(10, b, c);
let add_10_20 = |c| add_10(20, c);
log::info!("{}", add_10_20(30));"""
expected_output = "60"

[[test]]
name = "partial_varargs"
skip = true
description = "partial on *args function"
python = """
from functools import partial

def sum_all(*args):
    return sum(args)

add_to_10 = partial(sum_all, 10)
print(add_to_10(20, 30))
"""
rust = """
fn sum_all(args: &[i32]) -> i32 {
    args.iter().sum()
}

let add_to_10 = |rest: &[i32]| {
    let mut all_args = vec![10];
    all_args.extend_from_slice(rest);
    sum_all(&all_args)
};
log::info!("{}", add_to_10(&[20, 30]));"""
expected_output = "60"

[[test]]
name = "partial_kwargs_func"
skip = true
description = "partial on **kwargs function"
python = """
from functools import partial

def process(**kwargs):
    return sum(kwargs.values())

with_a = partial(process, a=10)
print(with_a(b=20, c=30))
"""
rust = """
use std::collections::HashMap;

fn process(kwargs: HashMap<&str, i32>) -> i32 {
    kwargs.values().sum()
}

let with_a = |mut extra: HashMap<&str, i32>| {
    extra.insert("a", 10);
    process(extra)
};
let mut args = HashMap::new();
args.insert("b", 20);
args.insert("c", 30);
log::info!("{}", with_a(args));"""
expected_output = "60"

[[test]]
name = "partial_override"
skip = true
description = "Call can override partial's kwargs"
python = """
from functools import partial

def greet(name, greeting="Hello"):
    return f"{greeting}, {name}!"

hello_greeter = partial(greet, greeting="Hello")
# Can still override the keyword argument
print(hello_greeter("Alice", greeting="Hi"))
"""
rust = """
fn greet(name: &str, greeting: &str) -> String {
    format!("{}, {}!", greeting, name)
}

let hello_greeter =
    |name, greeting_override: Option<&str>| greet(name, greeting_override.unwrap_or("Hello"));
log::info!("{}", hello_greeter("Alice", Some("Hi")));"""
expected_output = "Hi, Alice!"
