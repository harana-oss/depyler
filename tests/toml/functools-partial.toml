[[test]]
name = "partial_callback"
description = "button.onclick = partial(handler, button_id)"
python = """
from functools import partial

def handle_click(button_id, event):
    return f"Button {button_id} clicked with event {event}"

button_handler = partial(handle_click, "submit")
print(button_handler("click"))
"""
rust = """
fn handle_click(button_id: &str, event: &str) -> String {
    format!("Button {} clicked with event {}", button_id, event)
}

fn main() {
    let button_handler = |event| handle_click("submit", event);
    println!("{}", button_handler("click"));
}
"""
expected_output = "Button submit clicked with event click"

[[test]]
name = "partial_defaults"
description = "Create function with different defaults"
python = """
from functools import partial

def power(base, exponent=2):
    return base ** exponent

square = partial(power, exponent=2)
cube = partial(power, exponent=3)
print(square(4))
print(cube(4))
"""
rust = """
fn power(base: i32, exponent: i32) -> i32 {
    base.pow(exponent as u32)
}

fn main() {
    let square = |base| power(base, 2);
    let cube = |base| power(base, 3);
    println!("{}", square(4));
    println!("{}", cube(4));
}
"""
expected_output = """16
64"""

[[test]]
name = "partial_adapter"
description = "Adapt function signature"
python = """
from functools import partial

def log(level, message):
    return f"[{level}] {message}"

info = partial(log, "INFO")
error = partial(log, "ERROR")
print(info("Application started"))
print(error("Something went wrong"))
"""
rust = """
fn log(level: &str, message: &str) -> String {
    format!("[{}] {}", level, message)
}

fn main() {
    let info = |msg| log("INFO", msg);
    let error = |msg| log("ERROR", msg);
    println!("{}", info("Application started"));
    println!("{}", error("Something went wrong"));
}
"""
expected_output = """[INFO] Application started
[ERROR] Something went wrong"""

[[test]]
name = "partial_map"
description = "map(partial(pow, 2), items)"
python = """
from functools import partial

def power(base, exponent):
    return base ** exponent

square = partial(power, exponent=2)
numbers = [1, 2, 3, 4]
result = list(map(square, numbers))
print(result)
"""
rust = """
fn power(base: i32, exponent: i32) -> i32 {
    base.pow(exponent as u32)
}

fn main() {
    let square = |base| power(base, 2);
    let numbers = vec![1, 2, 3, 4];
    let result: Vec<i32> = numbers.iter().map(|&n| square(n)).collect();
    println!("{:?}", result);
}
"""
expected_output = "[1, 4, 9, 16]"

# =============================================================================
# Comparison with Lambda
# =============================================================================

[[test]]
name = "partial_vs_lambda"
description = "partial(f, x) vs lambda y: f(x, y)"
python = """
from functools import partial

def add(a, b):
    return a + b

# Using partial
add5_partial = partial(add, 5)

# Using lambda
add5_lambda = lambda b: add(5, b)

print(add5_partial(3))
print(add5_lambda(3))
"""
rust = """
fn add(a: i32, b: i32) -> i32 {
    a + b
}

fn main() {
    // Using closure (similar to partial)
    let add5_closure = |b| add(5, b);
    
    // Using lambda-style closure
    let add5_lambda = |b| add(5, b);
    
    println!("{}", add5_closure(3));
    println!("{}", add5_lambda(3));
}
"""
expected_output = """8
8"""

[[test]]
name = "partial_advantages"
description = "Clearer, func/args accessible"
python = """
from functools import partial

def multiply(a, b):
    return a * b

double = partial(multiply, 2)
print(f"Function name: {double.func.__name__}")
print(f"Frozen args: {double.args}")
print(f"Result: {double(5)}")
"""
rust = """
// Rust closures are more opaque than Python's partial
// They don't expose captured values or original function
fn multiply(a: i32, b: i32) -> i32 {
    a * b
}

fn main() {
    let double = |b| multiply(2, b);
    println!("Function name: multiply");
    println!("Frozen args: (2,)");
    println!("Result: {}", double(5));
}
"""
expected_output = """Function name: multiply
Frozen args: (2,)
Result: 10"""

