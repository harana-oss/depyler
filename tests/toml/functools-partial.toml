[metadata]
name = "functools.partial Tests"
category = "decorators-closures"

# =============================================================================
# Basic partial
# =============================================================================

[[test]]
name = "partial_basic"
skip = true
description = "add5 = partial(add, 5)"
python = """
from functools import partial

def add(a, b):
    return a + b

add5 = partial(add, 5)
print(add5(3))
"""
rust = """
fn add(a: i32, b: i32) -> i32 {
    a + b
}

let add5 = |b| add(5, b);
log::info!("{}", add5(3));"""
expected_output = "8"

[[test]]
name = "partial_call"
skip = true
description = "add5(3) == add(5, 3)"
python = """
from functools import partial

def add(a, b):
    return a + b

add5 = partial(add, 5)
print(add5(3) == add(5, 3))
"""
rust = """
fn add(a: i32, b: i32) -> i32 {
    a + b
}

let add5 = |b| add(5, b);
log::info!("{}", add5(3) == add(5, 3));"""
expected_output = "True"

[[test]]
name = "partial_keyword"
skip = true
description = "partial(func, x=10)"
python = """
from functools import partial

def greet(name, greeting="Hello"):
    return f"{greeting}, {name}!"

greet_hi = partial(greet, greeting="Hi")
print(greet_hi("Alice"))
"""
rust = """
fn greet(name: &str, greeting: &str) -> String {
    format!("{}, {}!", greeting, name)
}

let greet_hi = |name| greet(name, "Hi");
log::info!("{}", greet_hi("Alice"));"""
expected_output = "Hi, Alice!"

