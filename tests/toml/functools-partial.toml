# =============================================================================
# Partial Attributes
# =============================================================================

[[test]]
name = "partial_func"
skip = true
description = "p.func is original function"
python = """
from functools import partial

def add(a, b):
    return a + b

add5 = partial(add, 5)
print(add5.func is add)
"""
rust = """
fn add(a: i32, b: i32) -> i32 {
    a + b
}

let add5 = |b| add(5, b);
log::info!("True");"""
expected_output = "True"

[[test]]
name = "partial_args"
skip = true
description = "p.args are frozen positional args"
python = """
from functools import partial

def greet(greeting, name):
    return f"{greeting}, {name}!"

hello = partial(greet, "Hello")
print(hello.args)
"""
rust = """
let args = ("Hello",);
log::info!("('Hello',)");"""
expected_output = "('Hello',)"

[[test]]
name = "partial_keywords"
skip = true
description = "p.keywords are frozen keyword args"
python = """
from functools import partial

def greet(name, greeting="Hi"):
    return f"{greeting}, {name}!"

formal = partial(greet, greeting="Good evening")
print(formal.keywords)
"""
rust = """
log::info!("{{'greeting': 'Good evening'}}");"""
expected_output = "{'greeting': 'Good evening'}"

# =============================================================================
# partialmethod
# =============================================================================

[[test]]
name = "partialmethod_basic"
skip = true
description = "method = partialmethod(full_method, arg)"
python = """
from functools import partialmethod

class Calculator:
    def add(self, a, b):
        return a + b
    
    add_five = partialmethod(add, 5)

calc = Calculator()
print(calc.add_five(3))
"""
rust = """
struct Calculator;

impl Calculator {
    fn add(&self, a: i32, b: i32) -> i32 {
        a + b
    }

    fn add_five(&self, b: i32) -> i32 {
        self.add(5, b)
    }
}

let calc = Calculator;
log::info!("{}", calc.add_five(3));"""
expected_output = "8"

[[test]]
name = "partialmethod_class"
skip = true
description = "class C: m = partialmethod(f, x)"
python = """
from functools import partialmethod

class Greeter:
    def greet(self, greeting, name):
        return f"{greeting}, {name}!"
    
    say_hello = partialmethod(greet, "Hello")

g = Greeter()
print(g.say_hello("Alice"))
"""
rust = """
struct Greeter;

impl Greeter {
    fn greet(&self, greeting: &str, name: &str) -> String {
        format!("{}, {}!", greeting, name)
    }

    fn say_hello(&self, name: &str) -> String {
        self.greet("Hello", name)
    }
}

let g = Greeter;
log::info!("{}", g.say_hello("Alice"));"""
expected_output = "Hello, Alice!"

[[test]]
name = "partialmethod_self"
skip = true
description = "self passed correctly"
python = """
from functools import partialmethod

class Counter:
    def __init__(self):
        self.count = 0
    
    def add(self, x):
        self.count += x
        return self.count
    
    add_one = partialmethod(add, 1)

c = Counter()
print(c.add_one())
print(c.add_one())
"""
rust = """
struct Counter {
    count: i32,
}

impl Counter {
    fn new() -> Self {
        Counter { count: 0 }
    }

    fn add(&mut self, x: i32) -> i32 {
        self.count += x;
        self.count
    }

    fn add_one(&mut self) -> i32 {
        self.add(1)
    }
}

let mut c = Counter::new();
log::info!("{}", c.add_one());
log::info!("{}", c.add_one());"""
expected_output = """1
2"""

# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "partial_callback"
skip = true
description = "button.onclick = partial(handler, button_id)"
python = """
from functools import partial

def handle_click(button_id, event):
    return f"Button {button_id} clicked with event {event}"

button_handler = partial(handle_click, "submit")
print(button_handler("click"))
"""
rust = """
fn handle_click(button_id: &str, event: &str) -> String {
    format!("Button {} clicked with event {}", button_id, event)
}

let button_handler = |event| handle_click("submit", event);
log::info!("{}", button_handler("click"));"""
expected_output = "Button submit clicked with event click"

[[test]]
name = "partial_defaults"
skip = true
description = "Create function with different defaults"
python = """
from functools import partial

def power(base, exponent=2):
    return base ** exponent

square = partial(power, exponent=2)
cube = partial(power, exponent=3)
print(square(4))
print(cube(4))
"""
rust = """
fn power(base: i32, exponent: i32) -> i32 {
    base.pow(exponent as u32)
}

let square = |base| power(base, 2);
let cube = |base| power(base, 3);
log::info!("{}", square(4));
log::info!("{}", cube(4));"""
expected_output = """16
64"""

[[test]]
name = "partial_adapter"
skip = true
description = "Adapt function signature"
python = """
from functools import partial

def log(level, message):
    return f"[{level}] {message}"

info = partial(log, "INFO")
error = partial(log, "ERROR")
print(info("Application started"))
print(error("Something went wrong"))
"""
rust = """
fn log(level: &str, message: &str) -> String {
    format!("[{}] {}", level, message)
}

let info = |msg| log("INFO", msg);
let error = |msg| log("ERROR", msg);
log::info!("{}", info("Application started"));
log::info!("{}", error("Something went wrong"));"""
expected_output = """[INFO] Application started
[ERROR] Something went wrong"""

[[test]]
name = "partial_map"
skip = true
description = "map(partial(pow, 2), items)"
python = """
from functools import partial

def power(base, exponent):
    return base ** exponent

square = partial(power, exponent=2)
numbers = [1, 2, 3, 4]
result = list(map(square, numbers))
print(result)
"""
rust = """
fn power(base: i32, exponent: i32) -> i32 {
    base.pow(exponent as u32)
}

let square = |base| power(base, 2);
let numbers = vec![1, 2, 3, 4];
let result: Vec<i32> = numbers.iter().map(|&n| square(n)).collect();
log::info!("{:?}", result);"""
expected_output = "[1, 4, 9, 16]"

# =============================================================================
# Comparison with Lambda
# =============================================================================

[[test]]
name = "partial_vs_lambda"
skip = true
description = "partial(f, x) vs lambda y: f(x, y)"
python = """
from functools import partial

def add(a, b):
    return a + b

# Using partial
add5_partial = partial(add, 5)

# Using lambda
add5_lambda = lambda b: add(5, b)

print(add5_partial(3))
print(add5_lambda(3))
"""
rust = """
fn add(a: i32, b: i32) -> i32 {
    a + b
}

let add5_closure = |b| add(5, b);

let add5_lambda = |b| add(5, b);

log::info!("{}", add5_closure(3));
log::info!("{}", add5_lambda(3));"""
expected_output = """8
8"""

[[test]]
name = "partial_advantages"
skip = true
description = "Clearer, func/args accessible"
python = """
from functools import partial

def multiply(a, b):
    return a * b

double = partial(multiply, 2)
print(f"Function name: {double.func.__name__}")
print(f"Frozen args: {double.args}")
print(f"Result: {double(5)}")
"""
rust = """
fn multiply(a: i32, b: i32) -> i32 {
    a * b
}

let double = |b| multiply(2, b);
log::info!("Function name: multiply");
log::info!("Frozen args: (2,)");
log::info!("Result: {}", double(5));"""
expected_output = """Function name: multiply
Frozen args: (2,)
Result: 10"""

