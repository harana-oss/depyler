[[test]]
name = "argument_type_error_port_validator"
description = "Port validator with ArgumentTypeError returns Result type"

python = '''
import argparse

def port_number(value):
    try:
        port = int(value)
        if port < 1 or port > 65535:
            raise argparse.ArgumentTypeError(f"Port must be between 1 and 65535, got {port}")
