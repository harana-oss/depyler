# =============================================================================
# CUSTOM TYPE VALIDATORS (from test_argparse_type_inference.rs)
# =============================================================================

[[test]]
name = "validator_parameter_type_str"
description = "Argparse validator parameter should be &str"
tags = ["argparse", "validator", "type-inference"]

[test.python]
code = '''
def port_validator(value):
    """Argparse custom type validator."""
    port = int(value)
    if port < 1 or port > 65535:
        raise ValueError(f"Port must be 1-65535")
    return port
'''

[test.assertions]
contains = ["value: &str"]
not_contains = ["serde_json::Value"]

[[test]]
name = "validator_int_parse_not_cast"
description = "int() on string should use .parse(), not cast"
tags = ["argparse", "validator", "parse"]

[test.python]
code = '''
def validator(value):
    num = int(value)
    return num
'''

[test.assertions]
contains_any = [[".parse", "parse::<i32>"]]
not_contains = ["(value) as i32"]

[[test]]
name = "validator_with_try_except"
description = "Validator with try/except should still use &str"
tags = ["argparse", "validator", "exception"]

[test.python]
code = '''
def validator(value):
    try:
        num = int(value)
        return num
    except ValueError:
        raise ValueError("Invalid number")
'''

[test.assertions]
contains = ["value: &str"]
not_contains = ["serde_json::Value"]

[[test]]
name = "validator_full_port_compiles"
description = "Complete port validator should compile"
tags = ["argparse", "validator", "compile"]
compile_check = true

[test.python]
code = '''
def port_number(value):
    """Port validator for argparse."""
    try:
        port = int(value)
        if port < 1 or port > 65535:
            raise ValueError(f"Port must be 1-65535, got {port}")
        return port
    except ValueError:
        raise ValueError(f"Invalid port: {value}")
'''

[test.assertions]
contains = ["fn port_number"]
