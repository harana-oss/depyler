struct Args {
    #[command(subcommand)]
    command: Commands,
}
pub fn main() {
    let args = Args::parse();
    match args.command {
        Commands::Clone { url } => {
            handle_clone(&args);
        }
        Commands::Push { remote } => {
            handle_push(&args);
