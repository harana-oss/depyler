[[test]]
name = "wordcount_full_integration"
description = "Test full wordcount program with argparse, Path, and exception handling"

python = '''
import argparse
import sys
from pathlib import Path
from typing import NamedTuple

class Stats(NamedTuple):
    lines: int
    words: int
    chars: int
    filename: str

def count_file(filepath: Path) -> Stats:
    try:
        content = filepath.read_text()
        lines = len(content.splitlines())
        words = len(content.split())
        chars = len(content)
        return Stats(lines, words, chars, str(filepath))
    except IOError as e:
        print(f"Error reading {filepath}: {e}", file=sys.stderr)
        return Stats(0, 0, 0, str(filepath))

def run() -> int:
    parser = argparse.ArgumentParser(description="Count words")
    parser.add_argument("files", nargs="+", type=Path)
    parser.add_argument("-l", "--lines", action="store_true")
    args = parser.parse_args()

    for filepath in args.files:
        stats = count_file(filepath)
        if args.lines:
            print(f"{stats.lines} {stats.filename}")

    return 0
'''

rust = '''
use clap::Parser;
use std as sys;
use std::path::PathBuf;
#[derive(Debug, Clone)]
pub struct Stats {
    pub lines: i32,
    pub words: i32,
    pub chars: i32,
    pub filename: String,
}
impl Stats {
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "lines" => Some(Box::new(self.lines.clone()) as Box<dyn std::any::Any>),
            "words" => Some(Box::new(self.words.clone()) as Box<dyn std::any::Any>),
            "chars" => Some(Box::new(self.chars.clone()) as Box<dyn std::any::Any>),
            "filename" => Some(Box::new(self.filename.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "lines" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.lines = v.clone();
                    true
                } else {
                    false
                }
            }
            "words" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.words = v.clone();
                    true
                } else {
                    false
                }
            }
            "chars" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.chars = v.clone();
                    true
                } else {
                    false
                }
            }
            "filename" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.filename = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
#[derive(Debug, clap::Parser)]
#[command(about = "Count words")]
struct Args {
    files: Vec<PathBuf>,
    #[arg(short = 'l', long)]
    #[arg(action = clap::ArgAction::SetTrue)]
    lines: bool,
}
pub fn count_file(filepath: &Path) -> Stats {
    let content = std::fs::read_to_string(filepath.clone()).unwrap();
    let lines = content
        .lines()
        .map(|s| s.to_string())
        .collect::<Vec<String>>()
        .len() as i32;
    let words = content
        .split_whitespace()
        .map(|s| s.to_string())
        .collect::<Vec<String>>()
        .len() as i32;
    let chars = content.len() as i32;
    return Stats::new(lines, words, chars, (filepath).to_string());
}
pub fn run() -> i32 {
    let args = Args::parse();
    for filepath in &args.files {
        let filepath = filepath.clone();
        let stats = count_file(&filepath);
        if args.lines {
            log::info!("{}", format!("{} {}", stats.lines, stats.filename.clone()));
        }
    }
    return 0;
}
'''

