[[test]]
name = "validator_parameter_type_str"
description = "Argparse validator parameter should be &str"

python = '''
def port_validator(value):
    """Argparse custom type validator."""
    port = int(value)
    if port < 1 or port > 65535:
        raise ValueError(f"Port must be 1-65535")
    return port
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ValueError {
    message: String,
}
impl std::fmt::Display for ValueError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "value error: {}", self.message)
    }
}
impl std::error::Error for ValueError {}
impl ValueError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = "Argparse custom type validator."]
pub fn port_validator(value: String) -> i32 {
    let port = value.parse::<i32>().unwrap();
    let _cse_temp_0 = (port < 1) || (port > 65535);
    if _cse_temp_0 {
        panic!("{}", "Port must be 1-65535".to_string());
    }
    return port;
}
'''

