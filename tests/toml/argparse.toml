[[test]]
name = "subcommand_handlers"
description = "Test subcommand handlers receive &Args type"
tags = ["argparse", "subcommand", "handler", "types"]

[test.python]
code = '''
import argparse

def main():
    parser = argparse.ArgumentParser()
    parser.add_argument("--verbose", action="store_true")

    subparsers = parser.add_subparsers(dest="command", required=True)

    parser_clone = subparsers.add_parser("clone")
    parser_clone.add_argument("url")

    args = parser.parse_args()

    if args.command == "clone":
        handle_clone(args)

def handle_clone(args):
    print(args.url)
'''

[test.assertions]
contains = ["fn handle_clone(args: &Args)"]
not_contains = ["fn handle_clone(args: &serde_json::Value)"]

