# =============================================================================
# FULL INTEGRATION
# =============================================================================

[[test]]
name = "wordcount_full_integration"
description = "Test full wordcount program with argparse, Path, and exception handling"
tags = ["argparse", "integration", "path", "exception"]

[test.python]
code = '''
import argparse
import sys
from pathlib import Path
from typing import NamedTuple

class Stats(NamedTuple):
    lines: int
    words: int
    chars: int
    filename: str

def count_file(filepath: Path) -> Stats:
    try:
        content = filepath.read_text()
        lines = len(content.splitlines())
        words = len(content.split())
        chars = len(content)
        return Stats(lines, words, chars, str(filepath))
    except IOError as e:
        print(f"Error reading {filepath}: {e}", file=sys.stderr)
        return Stats(0, 0, 0, str(filepath))

def run() -> int:
    parser = argparse.ArgumentParser(description="Count words")
    parser.add_argument("files", nargs="+", type=Path)
    parser.add_argument("-l", "--lines", action="store_true")
    args = parser.parse_args()

    for filepath in args.files:
        stats = count_file(filepath)
        if args.lines:
            print(f"{stats.lines} {stats.filename}")

    return 0
'''

[test.assertions]
contains = ["clap"]
not_contains = ["TODO", "argparse"]

