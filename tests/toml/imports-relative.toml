# =============================================================================
# In __init__.py
# =============================================================================

[[test]]
name = "relative_in_init"
skip = true
description = "Relative imports in __init__.py"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


