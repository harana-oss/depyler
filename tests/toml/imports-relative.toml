# =============================================================================
# In __init__.py
# =============================================================================

[[test]]
name = "relative_in_init"
description = "Relative imports in __init__.py"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example { value: i32 }
'''


[[test]]
name = "relative_reexport"
description = "from .mod import func to re-export"

python = '''
# from .mod import func to re-export
# In a real __init__.py: from .mod import func
result = True
'''

rust = '''
// from .mod import func to re-export
// In Rust: pub use super::mod::func;
let result = true;
'''


# =============================================================================
# Absolute vs Relative
# =============================================================================

[[test]]
name = "relative_explicit"
description = "from . import x vs import x"

python = '''
# from . import x vs import x
# from . import x - relative (current package)
# import x - absolute (sys.path search)
result = True
'''

rust = '''
// from . import x vs import x
// use super::x; - relative
// use x; or use crate::x; - absolute
let result = true;
'''


[[test]]
name = "relative_absolute"
description = "import pkg (absolute)"

python = '''
# import pkg (absolute)
# Absolute import from sys.path
result = True
'''

rust = '''
// import pkg (absolute)
// In Rust: use crate::pkg; or use pkg;
let result = true;
'''


# =============================================================================
# Error Cases
# =============================================================================

[[test]]
name = "relative_beyond_top"
description = "from ... in top-level raises"
skip = true

python = '''
# from ... in top-level raises
# This would raise ValueError: attempted relative import beyond top-level package
result = True
'''

rust = '''
// from ... in top-level raises
// In Rust: This would be a compile error
let result = true;
'''


[[test]]
name = "relative_in_script"
description = "Relative import in __main__"
skip = true

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example { value: i32 }
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "relative_star"
description = "from . import *"

python = '''
# from . import *
# In a real module: from . import * (imports all public names)
result = True
'''

rust = '''
// from . import *
// In Rust: use super::*; (imports all public items)
let result = true;
'''


[[test]]
name = "relative_as"
description = "from . import mod as m"

python = '''
# from . import mod as m
# In a real module: from . import mod as m
result = True
'''

rust = '''
// from . import mod as m
// In Rust: use super::mod as m;
let result = true;
'''


[[test]]
name = "relative_circular"
description = "Circular relative imports"
skip = true

python = '''
# Circular relative imports
# Can cause ImportError if not handled properly
result = True
'''

rust = '''
// Circular relative imports
// In Rust: Circular dependencies cause compile errors
let result = true;
'''

