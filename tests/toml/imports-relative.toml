[metadata]
name = "Relative Imports Tests"
category = "imports"

# =============================================================================
# Single Dot (Current Package)
# =============================================================================

[[test]]
name = "relative_single_dot"
skip = true
description = "from . import sibling"

python = '''
# from . import sibling
# In a real module: from . import sibling
result = True
'''

rust = '''
    let result = true;
'''


