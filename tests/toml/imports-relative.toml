[metadata]
name = "Relative Imports Tests"
category = "imports"

# =============================================================================
# Single Dot (Current Package)
# =============================================================================

[[test]]
name = "relative_single_dot"
description = "from . import sibling"

python = '''
# from . import sibling
# In a real module: from . import sibling
result = True
'''

rust = '''
// from . import sibling
// In Rust: use super::sibling;
let result = true;
'''


[[test]]
name = "relative_from_current"
description = "from .sibling import func"

python = '''
# from .sibling import func
# In a real module: from .sibling import func
result = True
'''

rust = '''
// from .sibling import func
// In Rust: use super::sibling::func;
let result = true;
'''


