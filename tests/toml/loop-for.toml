[[test]]
name = "complex_loop_patterns"
description = "Test complex loop with enumerate, tuple unpacking, and type tracking"
tags = ["for", "loop", "complex", "enumerate"]

python = '''
def complex_analysis(data: list[tuple[int, str]]) -> dict[str, int]:
    result: dict[str, int] = {}
    for idx, item in enumerate(data):
        key, val = item
        if idx > 0:
            result[key] = len(val)
    return result
'''

rust = '''
use std::collections::HashMap;
pub fn complex_analysis(data: Vec<(i32, String)>) -> HashMap<String, i32> {
    let mut result: HashMap<String, i32> = {
        let map = HashMap::new();
        map
    };
    for (idx, item) in data.iter().enumerate().map(|(i, x)| (i as i32, x.clone())) {
        let idx = idx as i32;
        let (key, val) = item;
        if idx > 0 {
            result.insert(key, val.len() as i32);
        }
    }
    return result;
}
'''

[[test]]
name = "for_loop_comparison_compiles"
description = "For loop with comparison should compile (iterator dereferencing)"
tags = ["for", "loop", "compile", "comparison"]
compile_check = true

python = '''
def find_min(numbers: list[int]) -> int:
    if not numbers:
        return 0
    min_val = numbers[0]
    for num in numbers:
        if num < min_val:
            min_val = num
    return min_val
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn find_min(numbers: &Vec<i32>) -> i32 {
    if numbers.clone().is_empty() {
        return 0;
    }
    let mut min_val = numbers.clone().get(0usize).cloned().unwrap();
    for num in numbers.iter().cloned() {
        if num < min_val {
            min_val = num;
        }
    }
    return min_val;
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_find_min_examples() {
        assert_eq!(find_min(vec![]), 0);
        assert_eq!(find_min(vec![1]), 1);
        assert_eq!(find_min(vec![1, 2, 3]), 3);
    }
}
'''

