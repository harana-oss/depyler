        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn find_longest(words: &Vec<String>) -> String {
    if words.clone().is_empty() {
        return "".to_string();
    }
    let mut longest = words.clone().get(0usize).cloned().unwrap();
    for word in words.iter().cloned() {
        if word.clone().len() as i32 > longest.clone().len() as i32 {
            longest = word;
        }
    }
    return longest;
}
