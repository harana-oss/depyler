# ============================================================================
# Other Loop Patterns
# ============================================================================

[[test]]
name = "char_to_string_conversion"
description = "Test char-to-String conversion for dict keys"
tags = ["for", "loop", "string", "dict"]

[test.python]
code = '''
def char_frequency(s: str) -> dict[str, int]:
    freq: dict[str, int] = {}
    for char in s:
        if char in freq:
            freq[char] = freq[char] + 1
        else:
            freq[char] = 1
    return freq
'''

[test.assertions]
contains = ["fn char_frequency"]

