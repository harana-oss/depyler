[[test]]
name = "unused_loop_variable"
description = "Test unused loop variable detection and underscore prefixing"

python = '''
def count_items(items: list[int]) -> int:
    count = 0
    for item in items:
        count += 1
    return count
'''

rust = '''
pub fn count_items(items: &Vec<i32>) -> i32 {
    let mut count = 0;
    for _item in items.iter().cloned() {
        count += 1;
    }
    return count;
}
'''

