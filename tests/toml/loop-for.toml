[[test]]
name = "enumerate_unused_index_compiles"
description = "Enumerate with unused index should compile"
compile_check = true

python = '''
def process_values(items: list[str]) -> int:
    """Process list values, ignore indices."""
    count = 0
    for i, val in enumerate(items):
        if val:
            count += 1
    return count
'''

rust = '''
#[doc = "Process list values, ignore indices."]
pub fn process_values(items: Vec<String>) -> i32 {
    let mut count = 0;
    for (_i, val) in items.iter().enumerate().map(|(i, x)| (i as i32, x.clone())) {
        if !val.is_empty() {
            count += 1;
        }
    }
    return count;
}
'''