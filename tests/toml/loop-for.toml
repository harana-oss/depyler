[[test]]
name = "char_to_string_conversion"
skip = true
description = "Test char-to-String conversion for dict keys"

python = '''
def char_frequency(s: str) -> dict[str, int]:
    freq: dict[str, int] = {}
    for char in s:
        if char in freq:
            freq[char] = freq[char] + 1
        else:
            freq[char] = 1
    return freq
'''

rust = '''
use std::collections::HashMap;
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn char_frequency(s: String) -> HashMap<String, i32> {
    let mut freq: HashMap<String, i32> = {
        let map = HashMap::new();
        map
    };
    for _char in s.chars() {
        let char = _char.to_string();
        if freq.clone().get(&char).is_some() {
            {
                let _key = char;
                let _old_val = freq.clone().get(&_key).cloned().unwrap_or_default();
                freq.clone().insert(_key, _old_val + 1);
            }
        } else {
            freq.insert(char, 1);
        }
    }
    return freq;
}
'''

