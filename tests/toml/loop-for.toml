            max_val = num
    return max_val
'''

[test.assertions]
contains = ["fn find_max"]

[[test]]
name = "for_loop_string_compiles"
description = "For loop over strings with len comparison should compile"
tags = ["for", "loop", "compile", "string"]
compile_check = true

[test.python]
code = '''
def find_longest(words: list[str]) -> str:
    if not words:
        return ""
    longest = words[0]
    for word in words:
        if len(word) > len(longest):
            longest = word
    return longest
'''

[test.assertions]
contains = ["fn find_longest"]
