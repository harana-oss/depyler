[[test]]
name = "for_loop_string_compiles"
skip = true
description = "For loop over strings with len comparison should compile"
compile_check = true

python = '''
def find_longest(words: list[str]) -> str:
    if not words:
        return ""
    longest = words[0]
    for word in words:
        if len(word) > len(longest):
            longest = word
    return longest
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn find_longest(words: &Vec<String>) -> String {
    if words.is_empty() {
        return "".to_string();
    }
    let mut longest = words.clone().get(0usize).cloned().unwrap();
    for word in words.iter().cloned() {
        if word.len() as i32 > longest.len() as i32 {
            longest = word;
        }
    }
    return longest;
}
'''

[[test]]
name = "fibonacci_unused_index_compiles"
description = "Fibonacci with unused loop index should compile without warnings"
compile_check = true

python = '''
def fibonacci(n: int) -> int:
    """Calculate Fibonacci number."""
    if n <= 1:
        return n
    a = 0
    b = 1
    for i in range(2, n + 1):
        c = a + b
        a = b
        b = c
    return b
'''

rust = '''
#[doc = "Calculate Fibonacci number."]
pub fn fibonacci(n: i32) -> i32 {
        if n <= 1 {
        return n;
    }
    let mut a = 0;
    let mut b = 1;
    for _i in 2..n + 1 {
        let c = a + b;
        a = b;
        b = c;
    }
    return b;
}
'''

