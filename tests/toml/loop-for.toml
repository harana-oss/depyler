[[test]]
name = "for_loop_assignment_compiles"
description = "For loop with conditional assignment should compile"
tags = ["for", "loop", "compile", "assignment"]
compile_check = true

[test.python]
code = '''
def find_max(numbers: list[int]) -> int:
    if not numbers:
        return 0
    max_val = numbers[0]
    for num in numbers:
