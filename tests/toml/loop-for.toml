[[test]]
name = "complex_loop_patterns"
description = "Test complex loop with enumerate, tuple unpacking, and type tracking"
tags = ["for", "loop", "complex", "enumerate"]

[test.python]
code = '''
def complex_analysis(data: list[tuple[int, str]]) -> dict[str, int]:
    result: dict[str, int] = {}
    for idx, item in enumerate(data):
        key, val = item
        if idx > 0:
            result[key] = len(val)
    return result
'''

[test.assertions]
contains = ["fn complex_analysis"]

# ============================================================================
# Iterator Dereferencing - Migrated from test_iterator_deref.rs
# ============================================================================

[[test]]
name = "for_loop_comparison_compiles"
description = "For loop with comparison should compile (iterator dereferencing)"
tags = ["for", "loop", "compile", "comparison"]
compile_check = true

[test.python]
code = '''
def find_min(numbers: list[int]) -> int:
    if not numbers:
        return 0
    min_val = numbers[0]
    for num in numbers:
        if num < min_val:
            min_val = num
    return min_val
'''

[test.assertions]
contains = ["fn find_min"]

[[test]]
name = "for_loop_arithmetic_compiles"
