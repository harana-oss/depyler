[[test]]
name = "unused_loop_variable"
description = "Test unused loop variable detection and underscore prefixing"
tags = ["for", "loop", "unused", "variable"]

python = '''
def count_items(items: list[int]) -> int:
    count = 0
    for item in items:
        count = count + 1
    return count
'''

rust = '''
pub fn count_items(items: &Vec<i32>) -> i32 {
    let mut count = 0;
    for _item in items.iter().cloned() {
        count = count + 1;
    }
    return count;
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_count_items_examples() {
        assert_eq!(count_items(vec![]), 0);
        assert_eq!(count_items(vec![1]), 1);
        assert_eq!(count_items(vec![1, 2, 3]), 3);
    }
}
'''

