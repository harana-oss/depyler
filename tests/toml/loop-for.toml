# Statement Generator For Loop Coverage Tests
# Migrated from test_stmt_gen_for_coverage.rs

[metadata]
name = "for-loop"
description = "Tests for for-loop code generation including variable usage detection"

# ============================================================================
# Unused Variable Detection
# ============================================================================

[[test]]
name = "unused_loop_variable"
description = "Test unused loop variable detection and underscore prefixing"
tags = ["for", "loop", "unused", "variable"]

[test.python]
code = '''
def count_items(items: list[int]) -> int:
    count = 0
    for item in items:
        count = count + 1
    return count
'''

[test.assertions]
contains = ["fn count_items"]
contains_any = [["for", "iter"]]

[[test]]
name = "used_loop_variable"
description = "Test used loop variable should not be prefixed with underscore"
tags = ["for", "loop", "used", "variable"]

