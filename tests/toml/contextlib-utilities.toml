# =============================================================================
# contextlib.aclosing (Python 3.10+)
# =============================================================================

[[test]]
name = "aclosing"
skip = true
description = "async with aclosing(async_gen): ..."

python = '''
from contextlib import aclosing

class AsyncIterable:
    def __init__(self):
        self.closed = False
    def __aiter__(self):
        return self
    async def __anext__(self):
        raise StopAsyncIteration
    async def aclose(self):
        self.closed = True

async def test_aclosing() -> bool:
    gen = AsyncIterable()
    async with aclosing(gen):
        pass
    return gen.closed
'''

rust = '''
struct AsyncIterable {
    closed: bool,
}

impl AsyncIterable {
    fn new() -> Self {
        Self { closed: false }
    }
    async fn aclose(&mut self) {
        self.closed = true;
    }
}

pub async fn test_aclosing() -> bool {
    let mut gen = AsyncIterable::new();
    {
    }
    gen.aclose().await;
    gen.closed
}
'''


# =============================================================================
# contextlib.chdir (Python 3.11+)
# =============================================================================

[[test]]
name = "chdir"
skip = true
description = "with chdir('/path'): ..."

python = '''
from contextlib import chdir
import os

def test_chdir() -> bool:
    original = os.getcwd()
    with chdir('/tmp'):
        changed = os.getcwd()
    restored = os.getcwd()
    return original == restored and changed != original
'''

rust = '''
use std::env;

pub fn test_chdir() -> bool {
    let original = env::current_dir().unwrap();
    {
        env::set_current_dir("/tmp").ok();
        let _changed = env::current_dir().unwrap();
    }
    env::set_current_dir(&original).ok();
    let restored = env::current_dir().unwrap();
    original == restored
}
'''


