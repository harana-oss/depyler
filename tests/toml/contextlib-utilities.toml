[[test]]
name = "exitstack_push"
skip = true
description = "stack.push(exit_func)"

python = '''
from contextlib import ExitStack

def test_exitstack_push() -> bool:
    called = []
    def cleanup(exc_type, exc_val, exc_tb):
        called.append(True)
        return False
    
    with ExitStack() as stack:
        stack.push(cleanup)
    return len(called) == 1
'''

rust = '''
pub fn test_exitstack_push() -> bool {
    let mut called = Vec::new();
    {
    }
    called.push(true);
    called.len() == 1
}
'''


[[test]]
name = "exitstack_pop_all"
skip = true
description = "Transfer cleanup to new stack"

python = '''
from contextlib import ExitStack

def test_exitstack_pop_all() -> bool:
    called = []
    with ExitStack() as stack1:
        stack1.callback(called.append, 1)
        stack2 = stack1.pop_all()
    # Nothing called yet
    if len(called) > 0:
        return False
    with stack2:
        pass
    # Now called
    return len(called) == 1
'''

rust = '''
pub fn test_exitstack_pop_all() -> bool {
    let mut called = Vec::new();
    let mut transferred_cleanup = Vec::new();
    {
        transferred_cleanup.push(1);
    }
    if !called.is_empty() {
        return false;
    }
    {
        called.extend(transferred_cleanup);
    }
    called.len() == 1
}
'''


