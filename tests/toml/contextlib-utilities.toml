[[test]]
name = "utilities_nested"
skip = true
description = "Combining multiple contextlib utilities"

python = '''
from contextlib import suppress, redirect_stdout, nullcontext
from io import StringIO

def test_utilities_nested() -> bool:
    f = StringIO()
    with suppress(ValueError):
        with redirect_stdout(f):
            with nullcontext():
                print("test")
    return len(f.getvalue()) > 0
'''

rust = '''
use std::io::Write;

pub fn test_utilities_nested() -> bool {
    let mut buffer = Vec::new();
    let _: Result<(), std::io::Error> = (|| {
        {
            {
                writeln!(&mut buffer, "test")?;
            }
        }
        Ok(())
    })();
    !buffer.is_empty()
}
'''


