# =============================================================================
# contextlib.suppress
# =============================================================================

[[test]]
name = "suppress_single"
skip = true
description = "with suppress(ValueError): ..."

python = '''
from contextlib import suppress

def test_suppress_single() -> bool:
    with suppress(ValueError):
        raise ValueError("ignored")
    return True
'''

rust = '''
pub fn test_suppress_single() -> bool {
    let result: Result<(), String> = (|| Err("ignored".to_string()))();
    result.is_err();
    true
}
'''


[[test]]
name = "suppress_multiple"
skip = true
description = "with suppress(ValueError, TypeError): ..."

python = '''
from contextlib import suppress

def test_suppress_multiple() -> int:
    count = 0
    with suppress(ValueError, TypeError):
        count += 1
        raise ValueError("ignored")
    with suppress(ValueError, TypeError):
        count += 1
        raise TypeError("also ignored")
    return count
'''

rust = '''
pub fn test_suppress_multiple() -> i32 {
    let mut count = 0;
    let _: Result<(), String> = (|| {
        count += 1;
        Err("ignored".to_string())
    })();
    let _: Result<(), String> = (|| {
        count += 1;
        Err("also ignored".to_string())
    })();
    count
}
'''


[[test]]
name = "suppress_non_matching"
skip = true
description = "Non-matching exception still propagates"

python = '''
value = 1
match value:
    case 1:
        result = 'one'
    case _:
        result = 'other'
'''

rust = '''
