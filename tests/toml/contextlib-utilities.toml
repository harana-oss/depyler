[metadata]
name = "contextlib Utilities Tests"
category = "context-managers"

# =============================================================================
# contextlib.closing
# =============================================================================

[[test]]
name = "closing_basic"
skip = true
description = "with closing(obj) as x: (calls x.close())"

python = '''
from contextlib import closing

class Resource:
    def __init__(self):
        self.closed = False
    def close(self):
        self.closed = True

def test_closing_basic() -> bool:
    res = Resource()
    with closing(res) as r:
        pass
    return res.closed
'''

rust = '''
struct Resource {
    closed: bool,
}

impl Resource {
    fn new() -> Self {
        Self { closed: false }
    }
    fn close(&mut self) {
        self.closed = true;
    }
}

impl Drop for Resource {
    fn drop(&mut self) {
        self.close();
    }
}

pub fn test_closing_basic() -> bool {
    let mut res = Resource::new();
    {
        let _r = &mut res;
    }
    res.closed
}
'''


[[test]]
name = "closing_file_like"
skip = true
description = "Close objects with .close() method"

python = '''
from contextlib import closing
from io import StringIO

def test_closing_file_like() -> bool:
    f = StringIO("test")
    with closing(f) as file:
        content = file.read()
    return f.closed
'''

rust = '''
use std::io::Cursor;

struct ClosableWrapper {
    cursor: Cursor<Vec<u8>>,
    closed: bool,
}

impl ClosableWrapper {
    fn new(data: Vec<u8>) -> Self {
        Self {
            cursor: Cursor::new(data),
            closed: false,
        }
    }
    fn close(&mut self) {
        self.closed = true;
    }
}

impl Drop for ClosableWrapper {
    fn drop(&mut self) {
        self.close();
    }
}

pub fn test_closing_file_like() -> bool {
    let mut f = ClosableWrapper::new(b"test".to_vec());
    {
        let _file = &mut f;
    }
    f.closed
}
'''


[[test]]
name = "closing_exception"
skip = true
description = "close() called even on exception"

python = '''
from contextlib import closing

