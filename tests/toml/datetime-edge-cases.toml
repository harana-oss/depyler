[[test]]
name = "dst_transitions"
description = "DST transition handling"

python = '''
def adjust_for_dst(hour: int, is_dst: bool) -> int:
    if is_dst:
        return hour + 1 if hour < 23 else 0
    return hour
'''

rust = '''
pub fn adjust_for_dst(hour: i32, is_dst: bool) -> i32 {
    if is_dst {
        return if hour < 23 { hour + 1 } else { 0 };
    }
    return hour;
}
'''

