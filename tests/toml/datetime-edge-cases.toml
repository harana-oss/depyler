[metadata]
name = "DateTime Edge Cases Tests"
category = "datetime"

# =============================================================================
# Timezone Aware
# =============================================================================

[[test]]
name = "timezone_aware"
skip = true
description = "Timezone-aware datetime"

python = '''
class DateTime:
    def __init__(self, year: int, month: int, day: int, hour: int, minute: int):
        self.year = year
        self.month = month
        self.day = day
        self.hour = hour
        self.minute = minute
    
    def to_string(self) -> str:
        return f"{self.year}-{self.month:02d}-{self.day:02d} {self.hour:02d}:{self.minute:02d}"
'''

rust = '''
pub struct DateTime {
    pub year: i32,
    pub month: i32,
    pub day: i32,
    pub hour: i32,
    pub minute: i32,
}

impl DateTime {
    pub fn new(year: i32, month: i32, day: i32, hour: i32, minute: i32) -> Self {
        Self {
            year,
            month,
            day,
            hour,
            minute,
        }
    }

    pub fn to_string(&self) -> String {
        return format!(
            "{}-{:02}-{:02} {:02}:{:02}",
            self.year, self.month, self.day, self.hour, self.minute
        );
    }
}
'''

[[test]]
name = "timezone_offset"
skip = true
description = "Timezone offset handling"

python = '''
def apply_offset(hour: int, offset: int) -> int:
    result = hour + offset
    if result >= 24:
        result -= 24
    elif result < 0:
        result += 24
    return result
'''

rust = '''
pub fn apply_offset(hour: i32, offset: i32) -> i32 {
    let mut result = hour + offset;
    if result >= 24 {
        result -= 24;
    } else if result < 0 {
        result += 24;
    }
    return result;
}
'''

# =============================================================================
# Leap Year Handling
# =============================================================================

[[test]]
name = "leap_year_handling"
skip = true
description = "Leap year calculations"

python = '''
def is_leap_year(year: int) -> bool:
    if year % 400 == 0:
        return True
    if year % 100 == 0:
        return False
    if year % 4 == 0:
        return True
    return False
'''

rust = '''
pub fn is_leap_year(year: i32) -> bool {
    if year % 400 == 0 {
        return true;
    }
    if year % 100 == 0 {
        return false;
    }
    if year % 4 == 0 {
        return true;
    }
    return false;
}
'''

[[test]]
name = "days_in_month"
skip = true
description = "Days in month with leap year"

python = '''
def days_in_month(year: int, month: int) -> int:
    if month in [1, 3, 5, 7, 8, 10, 12]:
        return 31
    elif month in [4, 6, 9, 11]:
        return 30
    elif month == 2:
        if is_leap(year):
            return 29
        return 28
    return 0

def is_leap(year: int) -> bool:
    return (year % 4 == 0 and year % 100 != 0) or (year % 400 == 0)
'''

rust = '''
pub fn days_in_month(year: i32, month: i32) -> i32 {
    match month {
        1 | 3 | 5 | 7 | 8 | 10 | 12 => return 31,
        4 | 6 | 9 | 11 => return 30,
        2 => {
            if is_leap(year) {
                return 29;
            }
            return 28;
        }
        _ => return 0,
    }
}

pub fn is_leap(year: i32) -> bool {
    return (year % 4 == 0 && year % 100 != 0) || (year % 400 == 0);
}
'''

