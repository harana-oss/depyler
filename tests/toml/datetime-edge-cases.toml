# =============================================================================
# Timestamp Precision
# =============================================================================

[[test]]
name = "timestamp_precision"
skip = true
description = "Sub-second timestamp precision"

python = '''
class Timestamp:
    def __init__(self, seconds: int, nanoseconds: int):
        self.seconds = seconds
        self.nanoseconds = nanoseconds
    
    def total_nanos(self) -> int:
        return self.seconds * 1000000000 + self.nanoseconds
    
    def to_millis(self) -> int:
        return self.seconds * 1000 + self.nanoseconds // 1000000
'''

rust = '''
pub struct Timestamp {
    pub seconds: i64,
    pub nanoseconds: i64,
}

impl Timestamp {
    pub fn new(seconds: i64, nanoseconds: i64) -> Self {
        Self {
            seconds,
            nanoseconds,
        }
    }

    pub fn total_nanos(&self) -> i64 {
        return self.seconds * 1000000000 + self.nanoseconds;
    }

    pub fn to_millis(&self) -> i64 {
        return self.seconds * 1000 + self.nanoseconds / 1000000;
    }
}
'''

[[test]]
name = "timestamp_comparison"
skip = true
description = "Timestamp comparison"

python = '''
def compare_timestamps(a_sec: int, a_nano: int, b_sec: int, b_nano: int) -> int:
    if a_sec < b_sec:
        return -1
    if a_sec > b_sec:
        return 1
    if a_nano < b_nano:
        return -1
    if a_nano > b_nano:
        return 1
    return 0
'''

rust = '''
pub fn compare_timestamps(a_sec: i64, a_nano: i64, b_sec: i64, b_nano: i64) -> i32 {
    if a_sec < b_sec {
        return -1;
    }
    if a_sec > b_sec {
        return 1;
    }
    if a_nano < b_nano {
        return -1;
    }
    if a_nano > b_nano {
        return 1;
    }
    return 0;
}
'''

# =============================================================================
# Date Arithmetic
# =============================================================================

[[test]]
name = "date_arithmetic"
description = "Date arithmetic operations"

python = '''
def add_days(year: int, month: int, day: int, days: int) -> tuple[int, int, int]:
    day += days
    while day > 28:
        day -= 28
        month += 1
        if month > 12:
            month = 1
            year += 1
    return (year, month, day)
'''

rust = '''
pub fn add_days(mut year: i32, mut month: i32, mut day: i32, days: i32) -> (i32, i32, i32) {
    day += days;
    while day > 28 {
        day -= 28;
        month += 1;
        if month > 12 {
            month = 1;
            year += 1;
        }
    }
    return (year, month, day);
}
'''

[[test]]
name = "days_between"
skip = true
description = "Calculate days between dates"

python = '''
def days_between(y1: int, m1: int, d1: int, y2: int, m2: int, d2: int) -> int:
    days1 = y1 * 365 + m1 * 30 + d1
    days2 = y2 * 365 + m2 * 30 + d2
    return days2 - days1
'''

rust = '''
pub fn days_between(y1: i32, m1: i32, d1: i32, y2: i32, m2: i32, d2: i32) -> i32 {
    let days1 = y1 * 365 + m1 * 30 + d1;
    let days2 = y2 * 365 + m2 * 30 + d2;
    return days2 - days1;
}
'''

[[test]]
name = "month_arithmetic"
description = "Month arithmetic"

python = '''
def add_months(year: int, month: int, months: int) -> tuple[int, int]:
    month += months
    while month > 12:
        month -= 12
        year += 1
    while month < 1:
        month += 12
        year -= 1
    return (year, month)
'''

rust = '''
pub fn add_months(mut year: i32, mut month: i32, months: i32) -> (i32, i32) {
    month += months;
    while month > 12 {
        month -= 12;
        year += 1;
    }
    while month < 1 {
        month += 12;
        year -= 1;
    }
    return (year, month);
}
'''

[[test]]
name = "weekday_calculation"
skip = true
description = "Calculate day of week"

python = '''
def day_of_week(year: int, month: int, day: int) -> int:
    t = [0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4]
    if month < 3:
        year -= 1
    return (year + year // 4 - year // 100 + year // 400 + t[month - 1] + day) % 7
'''

rust = '''
pub fn day_of_week(mut year: i32, month: i32, day: i32) -> i32 {
    let t = [0, 3, 2, 5, 0, 3, 5, 1, 4, 6, 2, 4];
    if month < 3 {
        year -= 1;
    }
    return (year + year / 4 - year / 100 + year / 400 + t[(month - 1) as usize] + day) % 7;
}
'''
