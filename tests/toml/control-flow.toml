# =============================================================================
# If-Elif-Else Variable Shadowing - Migrated from test_if_elif_variable_shadowing.rs
# =============================================================================

[[test]]
name = "simple_if_elif_else_single_declaration"
description = "Elif chain should generate single variable declaration, not duplicates"
tags = ["if", "elif", "shadowing"]

[test.python]
code = '''
def test_func():
    condition1 = True
    condition2 = False
    x = None
    if condition1:
        x = "a"
    elif condition2:
        x = "b"
    else:
        x = "c"
    return x
'''

[test.assertions]
contains = ["let mut x"]
not_contains = ["let mut x;\n    let mut x"]

[[test]]
name = "triple_elif_chain_no_duplicates"
description = "Triple elif chain maintains single declaration"
tags = ["if", "elif", "shadowing"]

[test.python]
code = '''
def test_func():
    a = True
    b = False
    c = False
    d = False
    value = None
    if a:
        value = 1
    elif b:
        value = 2
    elif c:
        value = 3
    elif d:
        value = 4
    else:
        value = 5
    return value
'''

[test.assertions]
contains = ["let mut value"]
not_contains = ["let mut value;\n    let mut value"]

[[test]]
name = "cli_output_format_pattern"
description = "Real-world CLI output format selection pattern"
tags = ["if", "elif", "cli", "pattern"]

[test.python]
code = '''
def process_args():
    json_flag = False
    xml_flag = True
    yaml_flag = False
    output_format = None
    if json_flag:
        output_format = "json"
    elif xml_flag:
        output_format = "xml"
    elif yaml_flag:
        output_format = "yaml"
    else:
        output_format = "text"
    return output_format
'''

[test.assertions]
contains = ["let mut output_format"]

[[test]]
name = "elif_chain_compiles"
description = "Generated code for elif chains must compile"
tags = ["if", "elif", "compile"]
compile_check = true

[test.python]
code = '''
def test_func():
    flag1 = True
    flag2 = False
    result = None
    if flag1:
        result = "first"
    elif flag2:
        result = "second"
    else:
        result = "default"
    return result
'''

[test.assertions]
contains = ["fn test_func"]
