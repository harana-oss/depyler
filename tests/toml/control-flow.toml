[[test]]
name = "simple_if_elif_else_single_declaration"
description = "Elif chain should generate single variable declaration, not duplicates"

python = '''
def test_func():
    condition1 = True
    condition2 = False
    x = None
    if condition1:
        x = "a"
    elif condition2:
        x = "b"
    else:
        x = "c"
    return x
'''

rust = '''
pub fn test_func() {
    let condition1 = true;
    let condition2 = false;
    let mut x = None;
    if condition1 {
        x = "a".to_string();
    } else {
        if condition2 {
            x = "b".to_string();
        } else {
            x = "c".to_string();
        }
    }
    return;
}
'''

[[test]]
name = "triple_elif_chain_no_duplicates"
description = "Triple elif chain maintains single declaration"

python = '''
def test_func():
    a = True
    b = False
    c = False
    d = False
    value = None
    if a:
        value = 1
    elif b:
        value = 2
    elif c:
        value = 3
    elif d:
        value = 4
    else:
        value = 5
    return value
'''

rust = '''
pub fn test_func() {
    let a = true;
    let b = false;
    let c = false;
    let d = false;
    let mut value = None;
    if a {
        value = 1;
    } else {
        if b {
            value = 2;
        } else {
            if c {
                value = 3;
            } else {
                if d {
                    value = 4;
                } else {
                    value = 5;
                }
            }
        }
    }
    return;
}
'''

[[test]]
name = "cli_output_format_pattern"
description = "Real-world CLI output format selection pattern"

python = '''
def process_args():
    json_flag = False
    xml_flag = True
    yaml_flag = False
    output_format = None
    if json_flag:
        output_format = "json"
    elif xml_flag:
        output_format = "xml"
    elif yaml_flag:
        output_format = "yaml"
    else:
        output_format = "text"
    return output_format
'''

rust = '''
pub fn process_args() {
    let json_flag = false;
    let xml_flag = true;
    let yaml_flag = false;
    let mut output_format = None;
    if json_flag {
        output_format = "json".to_string();
    } else {
        if xml_flag {
            output_format = "xml".to_string();
        } else {
            if yaml_flag {
                output_format = "yaml".to_string();
            } else {
                output_format = "text".to_string();
            }
        }
    }
    return;
}
'''

