[[test]]
name = "for_enumerate"
description = "For loop with enumerate"

python = '''
def indexed_items(items: list[str]) -> list[str]:
    result = []
    for i, item in enumerate(items):
        result.append(f"{i}: {item}")
    return result
'''

rust = '''
pub fn indexed_items(items: Vec<String>) -> Vec<String> {
    let mut result = vec![];
    for (i, item) in items.iter().enumerate().map(|(i, x)| (i as i32, x.clone())) {
        let i = i as i32;
        result.push(format!("{}: {}", i, item));
    }
    return result;
}
'''

