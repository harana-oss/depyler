name = "complex_statement_combinations"
description = "Complex statement combinations integration test"

python = '''
from typing import Optional

def complex_logic(items: list[int], target: int) -> Optional[int]:
    if not items:
        return None

    for i, item in enumerate(items):
        if item == target:
            return i

        count = 0
        while count < 3:
            if count == 2:
                break
            count += 1
            continue

    return None
'''

rust = '''
pub fn complex_logic(items: Vec<i32>, target: i32) -> Option<i32> {
    if items.is_empty() {
        return None;
    }
    for (i, item) in items.iter().enumerate().map(|(i, x)| (i as i32, x.clone())) {
        let i = i as i32;
        if item == target {
            return Some(i);
        }
        let mut count = 0;
        while count < 3 {
            if count == 2 {
                break;
            }
            count += 1;
            continue;
        }
    }
    return None;
}
'''
