[[test]]
name = "if_simple"
description = "Simple if statement"

python = '''
def check_positive(x: int) -> bool:
    if x > 0:
        return True
    return False
'''

rust = '''
pub fn check_positive(x: i32) -> bool {
        if x > 0 {
        return true;
    }
    return false;
}
'''

