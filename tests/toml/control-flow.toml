contains = ["fn return_in_except"]

[[test]]
name = "exception_scope_in_loop"
description = "Try-except inside a loop"
tags = ["exception", "try", "loop", "context-coverage"]

[test.python]
code = '''
def try_in_loop():
    result = 0
    for i in [1, 2, 0, 3]:
        try:
            result = result + 10 / i
        except ZeroDivisionError:
            result = result + 0
    return result
'''

[test.assertions]
contains = ["fn try_in_loop"]

