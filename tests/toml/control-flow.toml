[[test]]
name = "integration_complex_exception_handling"
description = "Complex nested exception handling with loops"
tags = ["exception", "try", "complex", "context-coverage"]

[test.python]
code = '''
def complex_exceptions(values: list[int]):
    total = 0
    for val in values:
        try:
            result = 100 / val
            try:
                formatted = str(result)
            except ValueError:
                formatted = "error"
        except ZeroDivisionError:
            result = 0
        finally:
            total = total + result
    return total
'''

[test.assertions]
contains = ["fn complex_exceptions"]

