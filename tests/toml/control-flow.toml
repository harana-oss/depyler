[[test]]
name = "while_with_break"
skip = true
description = "While loop with break"

python = '''
def find_first(items: list[int], target: int) -> int:
    i = 0
    while i < len(items):
        if items[i] == target:
            break
        i += 1
    return i
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn find_first(items: &Vec<i32>, target: i32) -> i32 {
    let mut i = 0;
    while i < items.len() as i32 {
        if items.get(i as usize).cloned().unwrap() == target {
            break;
        }
        i += 1;
    }
    return i;
}
'''

[[test]]
name = "while_with_continue"
skip = true
description = "While loop with continue"

python = '''
def sum_positive(items: list[int]) -> int:
    total = 0
    i = 0
    while i < len(items):
        if items[i] < 0:
            i += 1
            continue
        total += items[i]
        i += 1
    return total
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn sum_positive(items: &Vec<i32>) -> i32 {
    let mut total = 0;
    let mut i = 0;
    while i < items.len() as i32 {
        if items.clone().get(i as usize).cloned().unwrap() < 0 {
            i += 1;
            continue;
        }
        total += items.get(i as usize).cloned().unwrap();
        i += 1;
    }
    return total;
}
'''

[[test]]
name = "try_except_basic"
description = "Basic try-except block"

python = '''
def safe_divide(a: int, b: int) -> int:
    try:
        return a // b
    except ZeroDivisionError:
        return 0
'''

rust = '''
pub fn safe_divide(a: i32, b: i32) -> i32 {
    if b == 0 {
        return 0;
    } else {
        return {
            let d = a / b;
            let r = a % b;
            if r != 0 && (a ^ b) < 0 {
                d - 1
            } else {
                d
            }
        };
    }
}

'''

