[[test]]
name = "for_range_with_step"
description = "For loop with range(start, stop, step)"

python = '''
def sum_evens(n: int) -> int:
    total = 0
    for i in range(0, n, 2):
        total += i
    return total
'''

rust = '''
pub fn sum_evens(n: i32) -> i32 {
    let mut total = 0;
    for i in {
        let step = 2 as usize;
        if step == 0 {
            panic!("range() arg 3 must not be zero");
        }
        (0..n).step_by(step)
    } {
        total += i;
    }
    return total;
}
'''

