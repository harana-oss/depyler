[[test]]
name = "if_complex_nested_elif"
description = "Complex nested if-elif-else structure"
tags = ["if", "elif", "else", "nested", "complex"]

[test.python]
code = '''
def complex_check(x: int, y: int) -> str:
    if x > 0:
        if y > 0:
            return "both positive"
        elif y < 0:
            return "x positive, y negative"
        else:
            return "x positive, y zero"
    elif x < 0:
        if y > 0:
            return "x negative, y positive"
        else:
            return "x negative, y non-positive"
    else:
        return "x is zero"
'''

[test.assertions]
contains = ["fn complex_check"]
