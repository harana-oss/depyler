#[derive(Debug, Copy, Clone)]
pub struct Range {
    pub start: i32,
    pub stop: i32,
    pub current: i32,
}
impl Range {
    pub fn new(start: i32, stop: i32) -> Self {
        Self {
            start,
            stop,
            current: 0,
        }
    }
    pub fn __iter__(&self) -> &Self {
        return self;
    }
    pub fn __next__(&mut self) -> i32 {
        if self.current < self.stop {
            let mut value = self.current;
            self.current = self.current + 1;
            return value;
        } else {
