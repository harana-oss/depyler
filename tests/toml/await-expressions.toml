    true
}
'''


[[test]]
name = "await_sequential"
description = "Sequential awaits run one at a time"

python = '''
order = []

async def task1():
    order.append(1)
    return 1

async def task2():
    order.append(2)
    return 2

async def test_await_sequential() -> list:
    await task1()
    await task2()
    return order
'''

rust = '''
use std::sync::Mutex;
use lazy_static::lazy_static;

lazy_static! {
    static ref ORDER: Mutex<Vec<i32>> = Mutex::new(Vec::new());
}

async fn task1() -> i32 {
    ORDER.lock().unwrap().push(1);
    1
}

async fn task2() -> i32 {
    ORDER.lock().unwrap().push(2);
    2
}

async fn test_await_sequential() -> Vec<i32> {
    task1().await;
    task2().await;
    ORDER.lock().unwrap().clone()
}
'''


