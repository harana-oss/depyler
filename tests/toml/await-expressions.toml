# =============================================================================
# Await in Control Flow
# =============================================================================

[[test]]
name = "await_in_if"
description = "if await condition(): ..."

python = '''
async def condition() -> bool:
    return True

async def test_await_in_if() -> int:
    if await condition():
        return 1
    else:
        return 0
'''

rust = '''
async fn condition() -> bool {
    true
}

async fn test_await_in_if() -> i32 {
    if condition().await {
        1
    } else {
        0
    }
}
'''


[[test]]
name = "await_in_while"
description = "while await has_more(): ..."

python = '''
count = [3, 2, 1]

async def has_more() -> bool:
    return len(count) > 0

async def consume():
    if count:
        count.pop()

async def test_await_in_while() -> int:
    iterations = 0
    while await has_more():
        await consume()
        iterations += 1
    return iterations
'''

rust = '''
use std::sync::atomic::{AtomicUsize, Ordering};

static COUNT: AtomicUsize = AtomicUsize::new(3);

async fn has_more() -> bool {
    COUNT.load(Ordering::Relaxed) > 0
}

async fn consume() {
    COUNT.fetch_sub(1, Ordering::Relaxed);
}

async fn test_await_in_while() -> usize {
    let mut iterations = 0;
    while has_more().await {
        consume().await;
        iterations += 1;
    }
    iterations
}
'''


[[test]]
name = "await_in_try"
description = "try: await f() except: ..."

python = '''
async def f() -> int:
    raise ValueError("error")

async def test_await_in_try() -> int:
    try:
        await f()
        return 0
    except ValueError:
        return 1
'''

rust = '''
async fn f() -> Result<i32, String> {
    Err("error".to_string())
}

async fn test_await_in_try() -> i32 {
    match f().await {
        Ok(_) => 0,
        Err(_) => 1,
    }
}
'''


# =============================================================================
# Chained Await
# =============================================================================

[[test]]
name = "await_chained"
description = "await (await get_coro())()"

python = '''
async def inner() -> int:
    return 55

async def get_coro():
    return inner

async def test_await_chained() -> int:
    coro_func = await get_coro()
    result = await coro_func()
    return result
'''

rust = '''
use std::future::Future;
use std::pin::Pin;

async fn inner() -> i32 {
    55
}

async fn get_coro() -> fn() -> Pin<Box<dyn Future<Output = i32>>> {
    || Box::pin(inner())
}

async fn test_await_chained() -> i32 {
    let coro_func = get_coro().await;
    coro_func().await
}
'''


