# =============================================================================
# Error Handling
# =============================================================================

[[test]]
name = "await_exception"
description = "Exception in awaited coro propagates"

python = '''
async def failing_coro():
    raise RuntimeError("failure")

async def test_await_exception() -> bool:
    try:
        await failing_coro()
        return False
    except RuntimeError:
        return True
'''

rust = '''
async fn failing_coro() -> Result<(), String> {
    Err("failure".to_string())
}

async fn test_await_exception() -> bool {
    match failing_coro().await {
        Ok(_) => false,
        Err(_) => true,
    }
}
'''


[[test]]
name = "await_cancel"
description = "CancelledError on cancellation"

python = '''
import asyncio

async def long_running():
    await asyncio.sleep(10)

async def test_await_cancel() -> bool:
    task = asyncio.create_task(long_running())
    task.cancel()
    try:
        await task
        return False
    except asyncio.CancelledError:
        return True
'''

rust = '''
use tokio::time::{sleep, Duration};

async fn long_running() {
    sleep(Duration::from_secs(10)).await;
}

async fn test_await_cancel() -> bool {
    let handle = tokio::spawn(long_running());
    handle.abort();
    handle.await.is_err()
}
'''


[[test]]
name = "await_timeout"
description = "asyncio.wait_for with timeout"

python = '''
import asyncio

async def slow_task():
    await asyncio.sleep(10)
    return 42

async def test_await_timeout() -> bool:
    try:
        await asyncio.wait_for(slow_task(), timeout=0.1)
        return False
    except asyncio.TimeoutError:
        return True
'''

rust = '''
use tokio::time::{timeout, sleep, Duration};

async fn slow_task() -> i32 {
    sleep(Duration::from_secs(10)).await;
    42
}

async fn test_await_timeout() -> bool {
    timeout(Duration::from_millis(100), slow_task()).await.is_err()
}
'''


