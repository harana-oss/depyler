# Await Expressions Tests - Awaiting coroutines
# Rust Mapping: .await

[metadata]
name = "Await Expressions Tests"
category = "async"

# =============================================================================
# Basic Await
# =============================================================================

[[test]]
name = "await_basic"
description = "result = await coroutine()"

python = '''
async def coroutine() -> int:
    return 42

async def test_await_basic() -> int:
    result = await coroutine()
    return result
'''

rust = '''
async fn coroutine() -> i32 {
    42
}

async fn test_await_basic() -> i32 {
    let result = coroutine().await;
    result
}
'''


