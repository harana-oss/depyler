[metadata]
name = "Positional-Only Arguments Tests"
category = "modern-python"

# =============================================================================
# Basic Positional-Only
# =============================================================================

[[test]]
name = "posonly_basic"
skip = true
description = "def f(x, /): ..."
python = """
def greet(name, /):
    return f"Hello, {name}!"

print(greet("Alice"))
"""
rust = """
fn greet(name: &str) -> String {
    format!("Hello, {}!", name)
}

log::info!("{}", greet("Alice"));"""

[[test]]
name = "posonly_multiple"
skip = true
description = "def f(a, b, c, /): ..."
python = """
def add_three(a, b, c, /):
    return a + b + c

print(add_three(1, 2, 3))
"""
rust = """
fn add_three(a: i32, b: i32, c: i32) -> i32 {
    a + b + c
}

log::info!("{}", add_three(1, 2, 3));"""

[[test]]
name = "posonly_mixed"
skip = true
description = "def f(a, /, b): ..."
python = """
def mixed(a, /, b):
    return f"a={a}, b={b}"

print(mixed(1, 2))
print(mixed(1, b=2))
"""
rust = """
fn mixed(a: i32, b: i32) -> String {
    format!("a={}, b={}", a, b)
}

log::info!("{}", mixed(1, 2));
log::info!("{}", mixed(1, 2));"""

[[test]]
name = "posonly_defaults"
skip = true
description = "def f(a, b=1, /): ..."
python = """
def with_default(a, b=10, /):
    return a + b

print(with_default(5))
print(with_default(5, 3))
"""
rust = """
fn with_default(a: i32, b: Option<i32>) -> i32 {
    a + b.unwrap_or(10)
}

log::info!("{}", with_default(5, None));
log::info!("{}", with_default(5, Some(3)));"""

# =============================================================================
# Combined with Keyword-Only
# =============================================================================

[[test]]
name = "posonly_kwonly"
skip = true
description = "def f(a, /, b, *, c): ..."
python = """
def combined(a, /, b, *, c):
    return f"a={a}, b={b}, c={c}"

print(combined(1, 2, c=3))
"""
rust = """
fn combined(a: i32, b: i32, c: i32) -> String {
    format!("a={}, b={}, c={}", a, b, c)
}

log::info!("{}", combined(1, 2, 3));"""

[[test]]
name = "all_arg_kinds"
skip = true
description = "def f(a, /, b, *args, c, **kwargs): ..."
python = """
def all_kinds(a, /, b, *args, c, **kwargs):
    print(f"a={a}, b={b}")
    print(f"args={args}")
    print(f"c={c}")
    print(f"kwargs={kwargs}")

all_kinds(1, 2, 3, 4, c=5, x=10, y=20)
"""
rust = """
use std::collections::HashMap;

fn all_kinds(a: i32, b: i32, args: &[i32], c: i32, kwargs: &HashMap<&str, i32>) {
    log::info!("a={}, b={}", a, b);
    log::info!("args={:?}", args);
    log::info!("c={}", c);
    log::info!("kwargs={:?}", kwargs);
}

let args = vec![3, 4];
let mut kwargs = HashMap::new();
kwargs.insert("x", 10);
kwargs.insert("y", 20);
all_kinds(1, 2, &args, 5, &kwargs);"""

# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "posonly_prevent_kw"
skip = true
description = "f(x=1) raises TypeError for positional-only x"
python = """
def pos_only(x, /):
    return x * 2

# This works
print(pos_only(5))
# This would fail: pos_only(x=5)
"""
rust = """
fn pos_only(x: i32) -> i32 {
    x * 2
}

log::info!("{}", pos_only(5));"""

[[test]]
name = "posonly_name_reuse"
skip = true
description = "def f(x, /): x = 1 (no conflict)"
python = """
def reuse_name(x, /):
    # Can reuse parameter name in function body
    x += 1
    return x

print(reuse_name(5))
"""
rust = """
fn reuse_name(mut x: i32) -> i32 {
    x += 1;
    x
}

log::info!("{}", reuse_name(5));"""

[[test]]
name = "posonly_api_flex"
skip = true
description = "Can rename positional-only params without breaking callers"
python = """
# Version 1
def calculate(x, /):
    return x * 2

# Version 2 - renamed param, but callers don't break
def calculate_v2(value, /):
    return value * 2

print(calculate(10))
print(calculate_v2(10))
"""
rust = """
fn calculate(x: i32) -> i32 {
    x * 2
}

fn calculate_v2(value: i32) -> i32 {
    value * 2
}

log::info!("{}", calculate(10));
log::info!("{}", calculate_v2(10));"""

# =============================================================================
# Built-in Examples
# =============================================================================

[[test]]
name = "posonly_len"
skip = true
description = "len() style: single positional-only arg"
python = """
def my_len(obj, /):
    \"\"\"Custom len implementation style\"\"\"
    if isinstance(obj, (list, tuple, str)):
        return len(obj)
    return 0

print(my_len([1, 2, 3]))
print(my_len("hello"))
"""
rust = """
fn my_len<T>(obj: &[T]) -> usize {
    obj.len()
}

let list = vec![1, 2, 3];
log::info!("{}", my_len(&list));

let s = "hello";
log::info!("{}", s.len());"""

[[test]]
name = "posonly_pow"
skip = true
description = "pow() style: multiple with optional"
python = """
def my_pow(base, exp, mod=None, /):
    result = base ** exp
    if mod is not None:
        result = result % mod
    return result

print(my_pow(2, 3))
print(my_pow(2, 3, 5))
"""
rust = """
fn my_pow(base: i32, exp: u32, modulo: Option<i32>) -> i32 {
    let result = base.pow(exp);
    if let Some(m) = modulo {
        result % m
    } else {
        result
    }
}

log::info!("{}", my_pow(2, 3, None));
log::info!("{}", my_pow(2, 3, Some(5)));"""

