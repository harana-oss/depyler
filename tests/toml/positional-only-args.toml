[[test]]
name = "posonly_varargs"
skip = true
description = "def f(a, /, *args): ..."
python = """
def with_varargs(a, /, *args):
    return f"a={a}, args={args}"

print(with_varargs(1))
print(with_varargs(1, 2, 3, 4))
"""
rust = """
fn with_varargs(a: i32, args: &[i32]) -> String {
    format!("a={}, args={:?}", a, args)
}

log::info!("{}", with_varargs(1, &[]));
log::info!("{}", with_varargs(1, &[2, 3, 4]));"""
