# Edge Cases
# =============================================================================

[[test]]
name = "posonly_empty_after"
skip = true
description = "def f(a, /): all params are positional-only"
python = """
def all_posonly(a, b, c, /):
    return a + b + c

print(all_posonly(1, 2, 3))
"""
rust = """
fn all_posonly(a: i32, b: i32, c: i32) -> i32 {
    a + b + c
}

log::info!("{}", all_posonly(1, 2, 3));"""

