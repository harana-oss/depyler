[metadata]
name = "Memoryview Tests"
category = "data-structures"

# =============================================================================
# Basic Memoryview
# =============================================================================

[[test]]
name = "memoryview_create"
skip = true
description = "mv = memoryview(b'hello')"

python = '''
data = bytearray(b'hello')
mv = memoryview(data)
result = len(mv)
'''

rust = '''
    let data = b"hello";
    let slice = &data[..];
    let result = slice.len();
'''


