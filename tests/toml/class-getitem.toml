[metadata]
name = "__class_getitem__ Tests"
category = "advanced-oop"

# =============================================================================
# Basic __class_getitem__
# =============================================================================

[[test]]
name = "class_getitem_basic"
skip = true
description = "@classmethod def __class_getitem__(cls, item): ..."
python = """
class MyClass:
    @classmethod
    def __class_getitem__(cls, item):
        return f"{cls.__name__}[{item.__name__}]"

result = MyClass[int]
print(result)
"""
rust = """
// In Rust, __class_getitem__ is typically replaced with generics
// For runtime type information, we use std::any::type_name
struct MyClass<T> {
    _marker: std::marker::PhantomData<T>,
}

impl<T> MyClass<T> {
    fn type_name() -> String
    where
        T: 'static,
    {
        format!("MyClass[{}]", std::any::type_name::<T>())
    }
}

let result = MyClass::<i32>::type_name();
log::info!("{}", result);"""
expected_output = "MyClass[i32]"

[[test]]
name = "class_subscript"
skip = true
description = "MyClass[int] or MyClass['str']"
python = """
class Container:
    @classmethod
    def __class_getitem__(cls, item):
        return f"Container of {item}"

print(Container[int])
print(Container[str])
"""
rust = """
// Rust uses generic type parameters instead of runtime subscripting
struct Container<T> {
    _marker: std::marker::PhantomData<T>,
}

impl<T: 'static> Container<T> {
    fn describe() -> String {
        format!("Container of {}", std::any::type_name::<T>())
    }
}

log::info!("{}", Container::<i32>::describe());
log::info!("{}", Container::<String>::describe());"""
expected_output = """Container of i32
Container of alloc::string::String"""

[[test]]
name = "class_getitem_return"
skip = true
description = "Returns parameterized type or alias"
python = """
class Box:
    @classmethod
    def __class_getitem__(cls, item):
        class ParameterizedBox:
            item_type = item
        return ParameterizedBox

IntBox = Box[int]
print(IntBox.item_type)
"""
rust = """
// In Rust, this pattern is handled by type aliases with PhantomData
use std::marker::PhantomData;

struct Box<T> {
    _marker: PhantomData<T>,
}

// Type alias for Box<i32>
type IntBox = Box<i32>;

// Type information is compile-time; for runtime we use type_name
log::info!("{}", std::any::type_name::<i32>());"""
expected_output = "i32"

# =============================================================================
# Generic Classes
# =============================================================================

[[test]]
name = "generic_class"
skip = true
description = "class MyClass(Generic[T]): ..."
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Stack(Generic[T]):
    def __init__(self):
        self.items = []
    
    def push(self, item: T):
        self.items.append(item)
    
    def pop(self) -> T:
        return self.items.pop()

# Type hints only, runtime behavior is the same
int_stack = Stack()
int_stack.push(1)
int_stack.push(2)
print(int_stack.pop())
"""
rust = """
struct Stack<T> {
    items: Vec<T>,
}

impl<T> Stack<T> {
    fn new() -> Self {
        Stack { items: Vec::new() }
    }

    fn push(&mut self, item: T) {
        self.items.push(item);
    }

    fn pop(&mut self) -> Option<T> {
        self.items.pop()
    }
}

let mut int_stack: Stack<i32> = Stack::new();
int_stack.push(1);
int_stack.push(2);
log::info!("{}", int_stack.pop().unwrap());"""
expected_output = "2"

[[test]]
name = "generic_multiple"
skip = true
description = "class MyClass(Generic[K, V]): ..."
python = """
from typing import Generic, TypeVar

K = TypeVar('K')
V = TypeVar('V')

class Pair(Generic[K, V]):
    def __init__(self, key: K, value: V):
        self.key = key
        self.value = value
    
    def get_key(self) -> K:
        return self.key
    
    def get_value(self) -> V:
        return self.value

p = Pair("name", 42)
print(p.get_key())
print(p.get_value())
"""
rust = """
struct Pair<K, V> {
    key: K,
    value: V,
}

impl<K, V> Pair<K, V> {
    fn new(key: K, value: V) -> Self {
        Pair { key, value }
    }

    fn get_key(&self) -> &K {
        &self.key
    }

    fn get_value(&self) -> &V {
        &self.value
    }
}

let p = Pair::new("name", 42);
log::info!("{}", p.get_key());
log::info!("{}", p.get_value());"""
expected_output = """name
42"""

[[test]]
name = "generic_constrained"
skip = true
description = "TypeVar with constraints"
python = """
from typing import Generic, TypeVar

# T can only be int or str
T = TypeVar('T', int, str)

class Container(Generic[T]):
    def __init__(self, value: T):
        self.value = value

c1 = Container(42)
c2 = Container("hello")
print(c1.value)
print(c2.value)
"""
rust = """
// In Rust, TypeVar constraints are handled via trait bounds or enums
// For int|str constraint, we use an enum to represent the allowed types

enum IntOrStr {
    Int(i32),
    Str(String),
}

impl std::fmt::Display for IntOrStr {
    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {
        match self {
            IntOrStr::Int(i) => write!(f, "{}", i),
            IntOrStr::Str(s) => write!(f, "{}", s),
        }
    }
}

struct Container {
    value: IntOrStr,
}

impl Container {
    fn new(value: IntOrStr) -> Self {
        Container { value }
    }
}

let c1 = Container::new(IntOrStr::Int(42));
let c2 = Container::new(IntOrStr::Str("hello".to_string()));
log::info!("{}", c1.value);
log::info!("{}", c2.value);"""
expected_output = """42
hello"""

# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "class_getitem_container"
skip = true
description = "Stack[int], Queue[str]"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Queue(Generic[T]):
    def __init__(self):
        self.items = []
    
    def enqueue(self, item: T):
        self.items.append(item)
    
    def dequeue(self) -> T:
        return self.items.pop(0)

q = Queue()  # Could be Queue[int] for type hints
q.enqueue(1)
q.enqueue(2)
print(q.dequeue())
print(q.dequeue())
"""
rust = """
struct Queue<T> {
    items: Vec<T>,
}

impl<T> Queue<T> {
    fn new() -> Self {
        Queue { items: Vec::new() }
    }

    fn enqueue(&mut self, item: T) {
        self.items.push(item);
    }

    fn dequeue(&mut self) -> Option<T> {
        if self.items.is_empty() {
            None
        } else {
            Some(self.items.remove(0))
        }
    }
}

let mut q: Queue<i32> = Queue::new();
q.enqueue(1);
q.enqueue(2);
log::info!("{}", q.dequeue().unwrap());
log::info!("{}", q.dequeue().unwrap());"""
expected_output = """1
2"""

[[test]]
name = "class_getitem_alias"
skip = true
description = "Creating parameterized type aliases"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Box(Generic[T]):
    def __init__(self, value: T):
        self.value = value

# Type alias
IntBox = Box[int]
StrBox = Box[str]

b1 = IntBox(42)
b2 = StrBox("hello")
print(b1.value)
print(b2.value)
"""
rust = """
// In Rust, type aliases are defined with `type`
struct Box<T> {
    value: T,
}

impl<T> Box<T> {
    fn new(value: T) -> Self {
        Box { value }
    }
}

type IntBox = Box<i32>;
type StrBox = Box<String>;

let b1: IntBox = Box::new(42);
let b2: StrBox = Box::new("hello".to_string());
log::info!("{}", b1.value);
log::info!("{}", b2.value);"""
expected_output = """42
hello"""

[[test]]
name = "class_getitem_runtime"
skip = true
description = "Runtime behavior vs type checking"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Container(Generic[T]):
    def __init__(self, value: T):
        self.value = value
        self.type_param = T

c = Container(42)
print(c.value)
print(type(c.value).__name__)
"""
rust = """
struct Container<T> {
    value: T,
}

impl<T> Container<T> {
    fn new(value: T) -> Self {
        Container { value }
    }
}

let c = Container::new(42);
log::info!("{}", c.value);
log::info!("i32"); // Type is known at compile time"""
expected_output = """42
int"""

# =============================================================================
# __class_getitem__ Inheritance
# =============================================================================

[[test]]
name = "class_getitem_inherit"
skip = true
description = "Subclass inherits __class_getitem__"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Base(Generic[T]):
    pass

class Derived(Base[T]):
    pass

# Both support subscripting
print(Base[int])
print(Derived[str])
"""
rust = """
// In Rust, generic inheritance is expressed through traits and generic structs
struct Base<T> {
    _marker: std::marker::PhantomData<T>,
}

struct Derived<T> {
    _marker: std::marker::PhantomData<T>,
}

// Type names are compile-time only; we print equivalent representations
log::info!("Base[int]");
log::info!("Derived[str]");"""
expected_output = """Base[int]
Derived[str]"""

[[test]]
name = "class_getitem_override"
skip = true
description = "Subclass overrides __class_getitem__"
python = """
class Base:
    @classmethod
    def __class_getitem__(cls, item):
        return f"Base[{item}]"

class Derived(Base):
    @classmethod
    def __class_getitem__(cls, item):
        return f"Derived[{item}]"

print(Base[int])
print(Derived[int])
"""
rust = """
// In Rust, we can achieve similar behavior with trait methods
trait ClassGetItem {
    fn class_getitem(type_name: &str) -> String;
}

struct Base;
struct Derived;

impl ClassGetItem for Base {
    fn class_getitem(type_name: &str) -> String {
        format!("Base[{}]", type_name)
    }
}

impl ClassGetItem for Derived {
    fn class_getitem(type_name: &str) -> String {
        format!("Derived[{}]", type_name)
    }
}

log::info!("{}", Base::class_getitem("int"));
log::info!("{}", Derived::class_getitem("int"));"""
expected_output = """Base[int]
Derived[int]"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "class_getitem_slice"
skip = true
description = "MyClass[1:10] passes slice object"
python = """
class MyClass:
    @classmethod
    def __class_getitem__(cls, item):
        if isinstance(item, slice):
            return f"Slice from {item.start} to {item.stop}"
        return f"Item: {item}"

print(MyClass[1:10])
print(MyClass[5])
"""
rust = """
// Rust handles index/slice patterns differently via Index/SliceIndex traits
// For demonstration, we simulate the behavior
enum Subscript {
    Slice { start: i32, stop: i32 },
    Item(i32),
}

fn get_item(subscript: Subscript) -> String {
    match subscript {
        Subscript::Slice { start, stop } => format!("Slice from {} to {}", start, stop),
        Subscript::Item(i) => format!("Item: {}", i),
    }
}

log::info!("{}", get_item(Subscript::Slice { start: 1, stop: 10 }));
log::info!("{}", get_item(Subscript::Item(5)));"""
expected_output = """Slice from 1 to 10
Item: 5"""

[[test]]
name = "class_getitem_tuple"
skip = true
description = "MyClass[int, str] passes tuple"
python = """
class MyClass:
    @classmethod
    def __class_getitem__(cls, item):
        if isinstance(item, tuple):
            return f"Multiple params: {item}"
        return f"Single param: {item}"

print(MyClass[int, str])
print(MyClass[int])
"""
rust = """
// In Rust, multiple generic parameters are expressed as MyClass<T, U>
struct MyClass<T, U = ()> {
    _marker: std::marker::PhantomData<(T, U)>,
}

impl<T: 'static, U: 'static> MyClass<T, U> {
    fn describe() -> String {
        if std::any::type_name::<U>() == "()" {
            format!("Single param: {}", std::any::type_name::<T>())
        } else {
            format!(
                "Multiple params: ({}, {})",
                std::any::type_name::<T>(),
                std::any::type_name::<U>()
            )
        }
    }
}

log::info!("{}", MyClass::<i32, String>::describe());
log::info!("{}", MyClass::<i32>::describe());"""
expected_output = """Multiple params: (i32, alloc::string::String)
Single param: i32"""

[[test]]
name = "class_getitem_cache"
skip = true
description = "MyClass[int] is MyClass[int]?"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class MyClass(Generic[T]):
    pass

# Subscripted generics are typically cached
type1 = MyClass[int]
type2 = MyClass[int]
print(type1 is type2)
"""
rust = """
// In Rust, generic types are monomorphized at compile time
// Two uses of the same type are always identical
use std::any::TypeId;

struct MyClass<T> {
    _marker: std::marker::PhantomData<T>,
}

let type1 = TypeId::of::<MyClass<i32>>();
let type2 = TypeId::of::<MyClass<i32>>();
log::info!("{}", type1 == type2);"""
expected_output = "true"

[[test]]
name = "class_getitem_nongeneric"
skip = true
description = "Using without Generic base"
python = """
class CustomDict:
    @classmethod
    def __class_getitem__(cls, item):
        return f"CustomDict specialized for {item}"

print(CustomDict[str])
print(CustomDict[int])
"""
rust = """
// In Rust, we achieve similar pattern with generic impls
struct CustomDict<T> {
    _marker: std::marker::PhantomData<T>,
}

impl<T: 'static> CustomDict<T> {
    fn describe() -> String {
        format!("CustomDict specialized for {}", std::any::type_name::<T>())
    }
}

log::info!("{}", CustomDict::<String>::describe());
log::info!("{}", CustomDict::<i32>::describe());"""
expected_output = """CustomDict specialized for alloc::string::String
CustomDict specialized for i32"""
