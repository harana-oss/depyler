[[test]]
name = "class_getitem_slice"
description = "MyClass[1:10] passes slice object"
skip = true
skip_reason = "Slice subscripting is Python-specific"
python = """
class MyClass:
    @classmethod
    def __class_getitem__(cls, item):
        if isinstance(item, slice):
            return f"Slice from {item.start} to {item.stop}"
        return f"Item: {item}"

print(MyClass[1:10])
print(MyClass[5])
"""

[[test]]
name = "class_getitem_tuple"
description = "MyClass[int, str] passes tuple"
skip = true
skip_reason = "Tuple subscripting is for multiple type parameters in Python"
python = """
class MyClass:
    @classmethod
    def __class_getitem__(cls, item):
        if isinstance(item, tuple):
            return f"Multiple params: {item}"
        return f"Single param: {item}"

print(MyClass[int, str])
print(MyClass[int])
"""

[[test]]
