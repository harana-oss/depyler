# __class_getitem__ Tests - Making classes subscriptable
# Rust Mapping: Generics

[metadata]
name = "__class_getitem__ Tests"
category = "advanced-oop"

# =============================================================================
# Basic __class_getitem__
# =============================================================================

[[test]]
name = "class_getitem_basic"
description = "@classmethod def __class_getitem__(cls, item): ..."
skip = true
skip_reason = "__class_getitem__ is Python-specific for type subscripting"
python = """
class MyClass:
    @classmethod
    def __class_getitem__(cls, item):
        return f"{cls.__name__}[{item.__name__}]"

result = MyClass[int]
print(result)
"""

[[test]]
name = "class_subscript"
description = "MyClass[int] or MyClass['str']"
skip = true
skip_reason = "Class subscripting is for Python type hints"
python = """
class Container:
    @classmethod
    def __class_getitem__(cls, item):
        return f"Container of {item}"

print(Container[int])
print(Container[str])
"""

[[test]]
name = "class_getitem_return"
description = "Returns parameterized type or alias"
skip = true
skip_reason = "Type parameterization is handled by Rust generics at compile time"
python = """
class Box:
    @classmethod
    def __class_getitem__(cls, item):
        class ParameterizedBox:
            item_type = item
        return ParameterizedBox

IntBox = Box[int]
print(IntBox.item_type)
"""

# =============================================================================
# Generic Classes
# =============================================================================

[[test]]
name = "generic_class"
description = "class MyClass(Generic[T]): ..."
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Stack(Generic[T]):
    def __init__(self):
        self.items = []
    
    def push(self, item: T):
        self.items.append(item)
    
    def pop(self) -> T:
        return self.items.pop()

# Type hints only, runtime behavior is the same
int_stack = Stack()
int_stack.push(1)
int_stack.push(2)
print(int_stack.pop())
"""
rust = """
struct Stack<T> {
    items: Vec<T>,
}

impl<T> Stack<T> {
    fn new() -> Self {
        Stack { items: Vec::new() }
    }
    
    fn push(&mut self, item: T) {
        self.items.push(item);
    }
    
    fn pop(&mut self) -> Option<T> {
        self.items.pop()
    }
}

fn main() {
    let mut int_stack: Stack<i32> = Stack::new();
    int_stack.push(1);
    int_stack.push(2);
    println!("{}", int_stack.pop().unwrap());
}
"""
expected_output = "2"

[[test]]
name = "generic_multiple"
description = "class MyClass(Generic[K, V]): ..."
python = """
from typing import Generic, TypeVar

K = TypeVar('K')
V = TypeVar('V')

class Pair(Generic[K, V]):
    def __init__(self, key: K, value: V):
        self.key = key
        self.value = value
    
    def get_key(self) -> K:
        return self.key
    
    def get_value(self) -> V:
        return self.value

p = Pair("name", 42)
print(p.get_key())
print(p.get_value())
"""
rust = """
struct Pair<K, V> {
    key: K,
    value: V,
}

impl<K, V> Pair<K, V> {
    fn new(key: K, value: V) -> Self {
        Pair { key, value }
    }
    
    fn get_key(&self) -> &K {
        &self.key
    }
    
    fn get_value(&self) -> &V {
        &self.value
    }
}

fn main() {
    let p = Pair::new("name", 42);
    println!("{}", p.get_key());
    println!("{}", p.get_value());
}
"""
expected_output = """name
42"""

[[test]]
