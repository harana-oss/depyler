# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "class_getitem_container"
description = "Stack[int], Queue[str]"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Queue(Generic[T]):
    def __init__(self):
        self.items = []
    
    def enqueue(self, item: T):
        self.items.append(item)
    
    def dequeue(self) -> T:
        return self.items.pop(0)

q = Queue()  # Could be Queue[int] for type hints
q.enqueue(1)
q.enqueue(2)
print(q.dequeue())
print(q.dequeue())
"""
rust = """
struct Queue<T> {
    items: Vec<T>,
}

impl<T> Queue<T> {
    fn new() -> Self {
        Queue { items: Vec::new() }
    }
    
    fn enqueue(&mut self, item: T) {
        self.items.push(item);
    }
    
    fn dequeue(&mut self) -> Option<T> {
        if self.items.is_empty() {
            None
        } else {
            Some(self.items.remove(0))
        }
    }
}

fn main() {
    let mut q: Queue<i32> = Queue::new();
    q.enqueue(1);
    q.enqueue(2);
    println!("{}", q.dequeue().unwrap());
    println!("{}", q.dequeue().unwrap());
}
"""
expected_output = """1
2"""

[[test]]
name = "class_getitem_alias"
description = "Creating parameterized type aliases"
skip = true
skip_reason = "Type aliases are for type checking, not runtime behavior"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Box(Generic[T]):
    def __init__(self, value: T):
        self.value = value

# Type alias
IntBox = Box[int]
StrBox = Box[str]

b1 = IntBox(42)
b2 = StrBox("hello")
print(b1.value)
print(b2.value)
"""

[[test]]
name = "class_getitem_runtime"
description = "Runtime behavior vs type checking"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Container(Generic[T]):
    def __init__(self, value: T):
        self.value = value
        self.type_param = T

c = Container(42)
print(c.value)
print(type(c.value).__name__)
"""
rust = """
struct Container<T> {
    value: T,
}

impl<T> Container<T> {
    fn new(value: T) -> Self {
        Container { value }
    }
}

fn main() {
    let c = Container::new(42);
    println!("{}", c.value);
    println!("i32");  // Type is known at compile time
}
"""
expected_output = """42
int"""

