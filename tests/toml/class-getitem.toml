[[test]]
name = "class_getitem_inherit"
description = "Subclass inherits __class_getitem__"
skip = true
skip_reason = "__class_getitem__ inheritance is Python typing-specific"
python = """
from typing import Generic, TypeVar

T = TypeVar('T')

class Base(Generic[T]):
    pass

class Derived(Base[T]):
    pass

# Both support subscripting
print(Base[int])
print(Derived[str])
"""

[[test]]
name = "class_getitem_override"
description = "Subclass overrides __class_getitem__"
skip = true
skip_reason = "Overriding __class_getitem__ is Python-specific"
python = """
class Base:
    @classmethod
    def __class_getitem__(cls, item):
        return f"Base[{item}]"

class Derived(Base):
    @classmethod
    def __class_getitem__(cls, item):
        return f"Derived[{item}]"

print(Base[int])
print(Derived[int])
"""

