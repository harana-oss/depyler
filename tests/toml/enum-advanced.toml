[metadata]
name = "Enum Advanced Tests"
category = "data-structures"

# =============================================================================
# Functional API
# =============================================================================

[[test]]
name = "enum_functional"
description = "Color = Enum('Color', ['RED', 'GREEN'])"

python = '''
from enum import Enum

def test_enum_functional() -> int:
    Color = Enum('Color', ['RED', 'GREEN'])
    return len(list(Color))
'''

rust = '''
#[derive(Debug)]
enum Color {
    Red,
    Green,
}

pub fn test_enum_functional() -> usize {
    2
}
'''


