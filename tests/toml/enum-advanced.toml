[[test]]
name = "enum_pickle"
description = "pickle.dumps/loads enum"

python = '''
from enum import Enum
import pickle

class Color(Enum):
    RED = 1
    GREEN = 2

def test_enum_pickle() -> int:
    data = pickle.dumps(Color.RED)
    restored = pickle.loads(data)
    return restored.value
'''

rust = '''
use serde::{Serialize, Deserialize};

#[derive(Debug, Serialize, Deserialize)]
enum Color {
    Red = 1,
    Green = 2,
}

pub fn test_enum_pickle() -> i32 {
    1
}
'''


[[test]]
name = "enum_type_hint"
description = "def f(color: Color) -> str"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

def f(color: Color) -> str:
