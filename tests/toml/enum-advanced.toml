# =============================================================================
# @unique Decorator
# =============================================================================

[[test]]
name = "enum_unique"
description = "@unique prevents duplicate values"

python = '''
from enum import Enum, unique

@unique
class Color(Enum):
    RED = 1
    GREEN = 2
    BLUE = 3

def test_enum_unique() -> int:
    return Color.RED.value
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    Red = 1,
    Green = 2,
    Blue = 3,
}

pub fn test_enum_unique() -> i32 {
    Color::Red as i32
}
'''


[[test]]
name = "enum_unique_error"
description = "@unique decorator validates enum uniqueness at compile time in Rust"

python = '''
from enum import Enum, unique

@unique
class Color(Enum):
    RED = 1
    GREEN = 2

def test_enum_unique_error() -> bool:
    return Color.RED.value != Color.GREEN.value
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    Red = 1,
    Green = 2,
}

pub fn test_enum_unique_error() -> bool {
    Color::Red as i32 != Color::Green as i32
}
'''


# =============================================================================
# Aliases
# =============================================================================

[[test]]
name = "enum_alias"
description = "CRIMSON = RED = 1 creates alias"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    CRIMSON = 1

def test_enum_alias() -> bool:
    return Color.RED == Color.CRIMSON
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    Red = 1,
}

pub fn test_enum_alias() -> bool {
    const CRIMSON: i32 = 1;
    const RED: i32 = 1;
    CRIMSON == RED
}
'''


