[[test]]
name = "enum_hash"
description = "Enums are hashable"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

def test_enum_hash() -> int:
    s = {Color.RED, Color.GREEN}
    return len(s)
'''

rust = '''
use std::collections::HashSet;

#[derive(Debug, Hash, Eq, PartialEq)]
enum Color {
    Red = 1,
    Green = 2,
}

pub fn test_enum_hash() -> usize {
    let mut s = HashSet::new();
    s.insert(Color::Red);
    s.insert(Color::Green);
    s.len()
}
'''


