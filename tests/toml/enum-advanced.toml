# =============================================================================
# Extending Enums
# =============================================================================

[[test]]
name = "enum_no_extend"
description = "Enum values remain constant in Rust"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

def test_enum_no_extend() -> bool:
    return Color.RED.value == 1 and Color.GREEN.value == 2
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    Red = 1,
    Green = 2,
}

pub fn test_enum_no_extend() -> bool {
    Color::Red as i32 == 1 && Color::Green as i32 == 2
}
'''


[[test]]
name = "enum_extend_base"
description = "Can extend enum without members"

python = '''
from enum import Enum

class NoMembers(Enum):
    pass

class Color(NoMembers):
    RED = 1
    GREEN = 2

def test_enum_extend_base() -> int:
    return Color.RED.value
'''

rust = '''
#[derive(Debug)]
enum Color {
    Red = 1,
    Green = 2,
}

pub fn test_enum_extend_base() -> i32 {
    Color::Red as i32
}
'''


[[test]]
name = "enum_shared_mixin"
description = "Share methods via mixin class"

python = '''
from enum import Enum

class Mixin:
    def double(self):
        return self.value * 2

class Color(Mixin, Enum):
    RED = 1
    GREEN = 2

def test_enum_shared_mixin() -> int:
    return Color.RED.double()
'''

rust = '''
#[derive(Debug)]
enum Color {
    Red = 1,
    Green = 2,
}

impl Color {
    fn double(&self) -> i32 {
        (*self as i32) * 2
    }
}

pub fn test_enum_shared_mixin() -> i32 {
    Color::Red.double()
}
'''


# =============================================================================
# Complex Member Values
# =============================================================================

[[test]]
name = "enum_tuple_value"
description = "RED = (255, 0, 0)"

python = '''
from enum import Enum

class Color(Enum):
    RED = (255, 0, 0)
    GREEN = (0, 255, 0)

def test_enum_tuple_value() -> int:
    return Color.RED.value[0]
'''

rust = '''
#[derive(Debug)]
enum Color {
    Red,
    Green,
}

impl Color {
    fn value(&self) -> (u8, u8, u8) {
        match self {
            Color::Red => (255, 0, 0),
            Color::Green => (0, 255, 0),
        }
    }
}

pub fn test_enum_tuple_value() -> u8 {
    Color::Red.value().0
}
'''


[[test]]
name = "enum_dict_value"
description = "CONFIG = {'key': 'value'}"

python = '''
from enum import Enum

class Config(Enum):
    PROD = {'host': 'prod.com', 'port': 443}
    DEV = {'host': 'localhost', 'port': 8080}

def test_enum_dict_value() -> str:
    return Config.PROD.value['host']
'''

rust = '''
use std::collections::HashMap;

#[derive(Debug)]
enum Config {
    Prod,
    Dev,
}

impl Config {
    fn value(&self) -> HashMap<String, String> {
        match self {
            Config::Prod => {
                let mut map = HashMap::new();
                map.insert("host".to_string(), "prod.com".to_string());
                map.insert("port".to_string(), "443".to_string());
                map
            }
            Config::Dev => {
                let mut map = HashMap::new();
                map.insert("host".to_string(), "localhost".to_string());
                map.insert("port".to_string(), "8080".to_string());
                map
            }
        }
    }
}

pub fn test_enum_dict_value() -> String {
    Config::Prod.value().get("host").unwrap().clone()
}
'''


