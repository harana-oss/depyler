# =============================================================================
# Boundary and CONFORM
# =============================================================================

[[test]]
name = "flag_strict"
description = "Flag with boundary=STRICT"

python = '''
from enum import Flag, STRICT

class Permission(Flag, boundary=STRICT):
    READ = 1
    WRITE = 2
    EXECUTE = 4

def test_flag_strict() -> int:
    return (Permission.READ | Permission.WRITE).value
'''

rust = '''
#[derive(Debug, Clone, Copy)]
struct Permission {
    value: u8,
}

impl Permission {
    const READ: Self = Self { value: 1 };
    const WRITE: Self = Self { value: 2 };
    const EXECUTE: Self = Self { value: 4 };
}

impl std::ops::BitOr for Permission {
    type Output = Self;
    fn bitor(self, rhs: Self) -> Self {
        Self { value: self.value | rhs.value }
    }
}

pub fn test_flag_strict() -> u8 {
    (Permission::READ | Permission::WRITE).value
}
'''


