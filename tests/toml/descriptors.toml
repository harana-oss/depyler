[[test]]
name = "descriptor_resolution"
description = "Data descriptor > instance > non-data descriptor"
python = """
class DataDescriptor:
    def __get__(self, obj, objtype=None):
        return "data descriptor"
    def __set__(self, obj, value):
        pass

class NonDataDescriptor:
    def __get__(self, obj, objtype=None):
        return "non-data descriptor"

class MyClass:
    data = DataDescriptor()
    nondata = NonDataDescriptor()

instance = MyClass()
# Try to override in instance dict
instance.__dict__['data'] = "instance value"
instance.__dict__['nondata'] = "instance value"

print(instance.data)      # Data descriptor wins
print(instance.nondata)   # Instance value wins
"""
rust = """
// Rust handles this through its type system and ownership model
// The resolution is determined at compile time

struct DataDescriptor;
impl DataDescriptor {
    fn get(&self) -> &'static str {
        "data descriptor"
    }
}

struct MyClass {
    data: DataDescriptor,
    nondata: String,
}

fn main() {
    let instance = MyClass {
        data: DataDescriptor,
        nondata: "instance value".to_string(),
    };
    println!("{}", instance.data.get());
    println!("{}", instance.nondata);
}
"""
expected_output = """data descriptor
instance value"""

[[test]]
name = "getattribute_descriptor"
description = "How __getattribute__ invokes descriptors"
python = """
class Descriptor:
    def __get__(self, obj, objtype=None):
        return "descriptor value"

class MyClass:
    x = Descriptor()
    
    def __getattribute__(self, name):
        print(f"__getattribute__: {name}")
        return super().__getattribute__(name)

instance = MyClass()
result = instance.x
print(result)
"""
rust = """
// Rust doesn't have __getattribute__, but we can demonstrate
// custom access patterns through traits

trait GetAttribute {
    fn get_attribute(&self, name: &str) -> String;
}

struct Descriptor;

impl Descriptor {
    fn get(&self) -> &'static str {
        "descriptor value"
    }
}

struct MyClass {
    x: Descriptor,
}

impl GetAttribute for MyClass {
    fn get_attribute(&self, name: &str) -> String {
        println!("__getattribute__: {}", name);
        self.x.get().to_string()
    }
}

fn main() {
    let instance = MyClass { x: Descriptor };
    let result = instance.get_attribute("x");
    println!("{}", result);
}
"""
expected_output = """__getattribute__: x
descriptor value"""

