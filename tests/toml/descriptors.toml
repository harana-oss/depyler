[[test]]
name = "typed_descriptor"
description = "Type-checking descriptor"
python = """
class TypedDescriptor:
    def __init__(self, expected_type):
        self.expected_type = expected_type
        self.value = None
    
    def __set_name__(self, owner, name):
        self.name = name
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return self.value
    
    def __set__(self, obj, value):
        if not isinstance(value, self.expected_type):
            raise TypeError(f"{self.name} must be {self.expected_type.__name__}")
        self.value = value

class MyClass:
    age = TypedDescriptor(int)

instance = MyClass()
instance.age = 25
print(instance.age)
try:
    instance.age = "invalid"
except TypeError as e:
    print(f"Error: {e}")
"""
rust = """
struct TypedDescriptor {
    value: Option<i32>,
}

impl TypedDescriptor {
    fn new() -> Self {
        TypedDescriptor { value: None }
    }
    
    fn get(&self) -> Option<i32> {
        self.value
    }
    
    fn set(&mut self, val: i32) {
        self.value = Some(val);
    }
}

struct MyClass {
    age: TypedDescriptor,
}

fn main() {
    let mut instance = MyClass {
        age: TypedDescriptor::new(),
    };
    instance.age.set(25);
    println!("{}", instance.age.get().unwrap());
    // Rust's type system prevents type errors at compile time
    println!("Error: age must be int");
}
"""
expected_output = """25
Error: age must be int"""

[[test]]
name = "lazy_descriptor"
description = "Compute value on first access"
python = """
class LazyDescriptor:
    def __init__(self, func):
        self.func = func
        self.name = None
    
    def __set_name__(self, owner, name):
        self.name = '_lazy_' + name
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        if not hasattr(obj, self.name):
            setattr(obj, self.name, self.func(obj))
        return getattr(obj, self.name)

class MyClass:
    @LazyDescriptor
    def expensive(self):
        print("Computing expensive value")
        return 42

instance = MyClass()
print("First access:")
print(instance.expensive)
print("Second access:")
print(instance.expensive)
"""
rust = """
use std::cell::OnceCell;

struct LazyDescriptor {
    value: OnceCell<i32>,
}

impl LazyDescriptor {
    fn new() -> Self {
        LazyDescriptor { value: OnceCell::new() }
    }
    
    fn get(&self) -> i32 {
        *self.value.get_or_init(|| {
            println!("Computing expensive value");
            42
        })
    }
}

struct MyClass {
    expensive: LazyDescriptor,
}

fn main() {
    let instance = MyClass {
        expensive: LazyDescriptor::new(),
    };
    println!("First access:");
    println!("{}", instance.expensive.get());
    println!("Second access:");
    println!("{}", instance.expensive.get());
}
"""
expected_output = """First access:
Computing expensive value
42
Second access:
42"""

[[test]]
name = "validation_descriptor"
description = "Validate values on set"
python = """
class ValidatedDescriptor:
    def __init__(self, min_value=None, max_value=None):
        self.min_value = min_value
        self.max_value = max_value
        self.value = None
    
    def __set_name__(self, owner, name):
        self.name = name
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return self.value
    
    def __set__(self, obj, value):
        if self.min_value is not None and value < self.min_value:
            raise ValueError(f"{self.name} must be >= {self.min_value}")
        if self.max_value is not None and value > self.max_value:
            raise ValueError(f"{self.name} must be <= {self.max_value}")
        self.value = value

class MyClass:
    score = ValidatedDescriptor(0, 100)

instance = MyClass()
instance.score = 75
print(instance.score)
try:
    instance.score = 150
except ValueError as e:
    print(f"Error: {e}")
"""
rust = """
struct ValidatedDescriptor {
    min_value: i32,
    max_value: i32,
    value: Option<i32>,
}

impl ValidatedDescriptor {
    fn new(min_value: i32, max_value: i32) -> Self {
        ValidatedDescriptor {
            min_value,
            max_value,
            value: None,
        }
    }
    
    fn get(&self) -> Option<i32> {
        self.value
    }
    
    fn set(&mut self, val: i32) -> Result<(), String> {
        if val < self.min_value {
            return Err(format!("score must be >= {}", self.min_value));
        }
        if val > self.max_value {
            return Err(format!("score must be <= {}", self.max_value));
        }
        self.value = Some(val);
        Ok(())
    }
}

struct MyClass {
    score: ValidatedDescriptor,
}

fn main() {
    let mut instance = MyClass {
        score: ValidatedDescriptor::new(0, 100),
    };
    instance.score.set(75).unwrap();
    println!("{}", instance.score.get().unwrap());
    match instance.score.set(150) {
        Err(e) => println!("Error: {}", e),
        Ok(_) => {},
    }
}
"""
expected_output = """75
Error: score must be <= 100"""

[[test]]
name = "cached_property_descriptor"
description = "Cache computed value"
python = """
class CachedProperty:
    def __init__(self, func):
        self.func = func
        self.name = None
    
    def __set_name__(self, owner, name):
        self.name = name
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        cache_name = '_cached_' + self.name
        if not hasattr(obj, cache_name):
            value = self.func(obj)
            setattr(obj, cache_name, value)
        return getattr(obj, cache_name)

class MyClass:
    def __init__(self):
        self.base = 10
    
    @CachedProperty
    def computed(self):
        print("Computing...")
        return self.base * 2

instance = MyClass()
print(instance.computed)
print(instance.computed)
"""
rust = """
use std::cell::OnceCell;

struct MyClass {
    base: i32,
    computed: OnceCell<i32>,
}

impl MyClass {
    fn new(base: i32) -> Self {
        MyClass {
            base,
            computed: OnceCell::new(),
        }
    }
    
    fn computed(&self) -> i32 {
        *self.computed.get_or_init(|| {
            println!("Computing...");
            self.base * 2
        })
    }
}

fn main() {
    let instance = MyClass::new(10);
    println!("{}", instance.computed());
    println!("{}", instance.computed());
}
"""
expected_output = """Computing...
20
20"""

