[[test]]
name = "descriptor_set"
description = "Data descriptor with __set__"
python = """
class Descriptor:
    def __init__(self):
        self.value = None
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return self.value
    
    def __set__(self, obj, value):
        self.value = value * 2

class MyClass:
    x = Descriptor()

instance = MyClass()
instance.x = 5
print(instance.x)
"""
rust = """
use std::cell::Cell;

struct Descriptor {
    value: Cell<i32>,
}

impl Descriptor {
    fn new() -> Self {
        Descriptor { value: Cell::new(0) }
    }
    
    fn get(&self) -> i32 {
        self.value.get()
    }
    
    fn set(&self, val: i32) {
        self.value.set(val * 2);
    }
}

struct MyClass {
    x: Descriptor,
}

fn main() {
    let instance = MyClass { x: Descriptor::new() };
    instance.x.set(5);
    println!("{}", instance.x.get());
}
"""
expected_output = "10"

[[test]]
name = "descriptor_delete"
description = "Data descriptor with __delete__"
python = """
class Descriptor:
    def __init__(self):
        self.value = "initial"
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return self.value
    
    def __set__(self, obj, value):
        self.value = value
    
    def __delete__(self, obj):
        self.value = "deleted"

class MyClass:
    x = Descriptor()

instance = MyClass()
instance.x = "new value"
print(instance.x)
del instance.x
print(instance.x)
"""
rust = """
use std::cell::RefCell;

struct Descriptor {
    value: RefCell<String>,
}

impl Descriptor {
    fn new() -> Self {
        Descriptor { value: RefCell::new("initial".to_string()) }
    }
    
    fn get(&self) -> String {
        self.value.borrow().clone()
    }
    
    fn set(&self, val: String) {
        *self.value.borrow_mut() = val;
    }
    
    fn delete(&self) {
        *self.value.borrow_mut() = "deleted".to_string();
    }
}

struct MyClass {
    x: Descriptor,
}

fn main() {
    let instance = MyClass { x: Descriptor::new() };
    instance.x.set("new value".to_string());
    println!("{}", instance.x.get());
    instance.x.delete();
    println!("{}", instance.x.get());
}
"""
expected_output = """new value
deleted"""

[[test]]
name = "descriptor_priority"
description = "Data descriptor overrides instance __dict__"
python = """
class DataDescriptor:
    def __get__(self, obj, objtype=None):
        return "descriptor value"
    
    def __set__(self, obj, value):
        pass

class MyClass:
    x = DataDescriptor()

instance = MyClass()
# Try to set in instance dict (won't work due to data descriptor)
instance.__dict__['x'] = "dict value"
print(instance.x)  # Data descriptor wins
"""
rust = """
// In Rust, this concept is handled through trait implementations
// and ownership rules rather than runtime attribute lookup

struct DataDescriptor;

impl DataDescriptor {
    fn get(&self) -> &'static str {
        "descriptor value"
    }
}

struct MyClass {
    x: DataDescriptor,
}

fn main() {
    let instance = MyClass { x: DataDescriptor };
    // In Rust, field access is direct and type-safe
    println!("{}", instance.x.get());
}
"""
expected_output = "descriptor value"

