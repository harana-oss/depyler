[[test]]
name = "descriptor_set_name"
description = "Descriptor using __set_name__ to know its name"
python = """
class Descriptor:
    def __set_name__(self, owner, name):
        self.name = name
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return f"Descriptor named '{self.name}'"

class MyClass:
    x = Descriptor()
    y = Descriptor()

instance = MyClass()
print(instance.x)
print(instance.y)
"""
rust = """
// In Rust, this is typically handled at compile time with macros
// or by explicitly naming descriptors

struct Descriptor {
    name: &'static str,
}

impl Descriptor {
    fn new(name: &'static str) -> Self {
        Descriptor { name }
    }
    
    fn get(&self) -> String {
        format!("Descriptor named '{}'", self.name)
    }
}

struct MyClass {
    x: Descriptor,
    y: Descriptor,
}

fn main() {
    let instance = MyClass {
        x: Descriptor::new("x"),
        y: Descriptor::new("y"),
    };
    println!("{}", instance.x.get());
    println!("{}", instance.y.get());
}
"""
expected_output = """Descriptor named 'x'
Descriptor named 'y'"""

[[test]]
name = "descriptor_self_aware"
description = "Descriptor stores its attribute name"
python = """
class NamedDescriptor:
    def __set_name__(self, owner, name):
        self.name = name
        self.private_name = '_' + name
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return getattr(obj, self.private_name, None)
    
    def __set__(self, obj, value):
        setattr(obj, self.private_name, value)

class MyClass:
    value = NamedDescriptor()

instance = MyClass()
instance.value = 42
print(f"{instance.value}")
print(f"Private: {hasattr(instance, '_value')}")
"""
rust = """
use std::cell::Cell;

struct NamedDescriptor {
    name: &'static str,
    value: Cell<Option<i32>>,
}

impl NamedDescriptor {
    fn new(name: &'static str) -> Self {
        NamedDescriptor {
            name,
            value: Cell::new(None),
        }
    }
    
    fn get(&self) -> Option<i32> {
        self.value.get()
    }
    
    fn set(&self, val: i32) {
        self.value.set(Some(val));
    }
}

struct MyClass {
    value: NamedDescriptor,
}

fn main() {
    let instance = MyClass {
        value: NamedDescriptor::new("value"),
    };
    instance.value.set(42);
    println!("{}", instance.value.get().unwrap());
    println!("Private: true");
}
"""
expected_output = """42
Private: True"""

