[[test]]
name = "descriptor_slots"
description = "Descriptor with __slots__ class"
python = """
class Descriptor:
    def __init__(self):
        self.value = None
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return self.value
    
    def __set__(self, obj, value):
        self.value = value

class MyClass:
    __slots__ = ['_x']
    x = Descriptor()

instance = MyClass()
instance.x = 42
print(instance.x)
"""
rust = """
// Rust doesn't have __slots__, but similar memory efficiency
// is achieved through careful struct design

struct Descriptor {
    value: Option<i32>,
}

impl Descriptor {
    fn new() -> Self {
        Descriptor { value: None }
    }
    
    fn get(&self) -> Option<i32> {
        self.value
    }
    
    fn set(&mut self, val: i32) {
        self.value = Some(val);
    }
}

struct MyClass {
    x: Descriptor,
}

fn main() {
    let mut instance = MyClass { x: Descriptor::new() };
    instance.x.set(42);
    println!("{}", instance.x.get().unwrap());
}
"""
expected_output = "42"

[[test]]
name = "descriptor_class_level"
