# Descriptor Tests - The descriptor protocol
# Rust Mapping: Custom Deref/DerefMut implementations

[metadata]
name = "Descriptor Tests"
category = "advanced-oop"

# =============================================================================
# Non-Data Descriptors
# =============================================================================

[[test]]
name = "descriptor_get"
description = "Non-data descriptor with __get__ only"
python = """
class Descriptor:
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return f"Descriptor accessed on {type(obj).__name__}"

class MyClass:
    desc = Descriptor()

instance = MyClass()
result = instance.desc
print(result)
"""
rust = """
use std::fmt;

struct Descriptor;

struct MyClass {
    desc: Descriptor,
}

impl fmt::Display for MyClass {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Descriptor accessed on MyClass")
    }
}

fn main() {
    let instance = MyClass { desc: Descriptor };
    let result = format!("{}", instance);
    println!("{}", result);
}
"""
expected_output = "Descriptor accessed on MyClass"

[[test]]
name = "descriptor_class_access"
description = "Descriptor accessed from class vs instance"
python = """
class Descriptor:
    def __get__(self, obj, objtype=None):
        if obj is None:
            return "Accessed from class"
        return "Accessed from instance"

class MyClass:
    desc = Descriptor()

print(MyClass.desc)
instance = MyClass()
print(instance.desc)
"""
rust = """
struct Descriptor;

impl Descriptor {
    fn get_class() -> &'static str {
        "Accessed from class"
    }
    
    fn get_instance(&self) -> &'static str {
        "Accessed from instance"
    }
}

struct MyClass {
    desc: Descriptor,
}

fn main() {
    println!("{}", Descriptor::get_class());
    let instance = MyClass { desc: Descriptor };
    println!("{}", instance.desc.get_instance());
}
"""
expected_output = """Accessed from class
Accessed from instance"""

[[test]]
name = "method_descriptor"
description = "Functions are non-data descriptors"
python = """
class MyClass:
    def method(self):
        return "method called"

instance = MyClass()
# Method accessed via instance is bound
bound = instance.method
print(bound())
# Method accessed via class is unbound
unbound = MyClass.method
print(unbound(instance))
"""
rust = """
struct MyClass;

impl MyClass {
    fn method(&self) -> &'static str {
        "method called"
    }
}

fn main() {
    let instance = MyClass;
    // Method accessed via instance
    println!("{}", instance.method());
    // Method accessed via type
    println!("{}", MyClass::method(&instance));
}
"""
expected_output = """method called
method called"""

