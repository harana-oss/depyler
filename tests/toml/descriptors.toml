[[test]]
name = "descriptor_inheritance"
description = "Descriptors in class hierarchy"
python = """
class Descriptor:
    def __init__(self, name):
        self.name = name
        self.value = None
    
    def __get__(self, obj, objtype=None):
        if obj is None:
            return self
        return f"{self.name}: {self.value}"
    
    def __set__(self, obj, value):
        self.value = value

class Base:
    x = Descriptor("base_x")

class Derived(Base):
    y = Descriptor("derived_y")

instance = Derived()
instance.x = 10
instance.y = 20
print(instance.x)
print(instance.y)
"""
rust = """
struct Descriptor {
    name: String,
    value: Option<i32>,
}

impl Descriptor {
    fn new(name: &str) -> Self {
        Descriptor {
            name: name.to_string(),
            value: None,
        }
    }
    
    fn get(&self) -> String {
        format!("{}: {}", self.name, self.value.unwrap_or(0))
    }
    
    fn set(&mut self, val: i32) {
        self.value = Some(val);
    }
}

struct Base {
    x: Descriptor,
}

struct Derived {
    base: Base,
    y: Descriptor,
}

fn main() {
    let mut instance = Derived {
        base: Base { x: Descriptor::new("base_x") },
        y: Descriptor::new("derived_y"),
    };
    instance.base.x.set(10);
    instance.y.set(20);
    println!("{}", instance.base.x.get());
    println!("{}", instance.y.get());
}
"""
expected_output = """base_x: 10
derived_y: 20"""
