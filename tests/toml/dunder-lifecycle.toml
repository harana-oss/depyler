m = Message("Hello")
print(m)  # Uses __str__
"""
rust = """
use std::fmt;

struct Message {
    text: String,
}

impl Message {
    fn new(text: &str) -> Self {
        Message {
            text: text.to_string(),
        }
    }
}

impl fmt::Display for Message {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Message: {}", self.text)
    }
}

fn main() {
    let m = Message::new("Hello");
    log::info!("{}", m);
}
"""
expected_output = "Message: Hello"

# =============================================================================
# Combined Lifecycle
# =============================================================================

[[test]]
name = "lifecycle_flow"
description = "Complete object creation sequence"
python = """
class Tracked:
    def __new__(cls, value):
        print("__new__ called")
        instance = super().__new__(cls)
        return instance
    
    def __init__(self, value):
        print("__init__ called")
        self.value = value
    
    def __del__(self):
        print("__del__ called")

t = Tracked(42)
print(f"Value: {t.value}")
del t
print("End")
"""
rust = """
struct Tracked {
    value: i32,
}

impl Tracked {
    fn new(value: i32) -> Self {
        log::info!("__new__ called");
        log::info!("__init__ called");
        Tracked { value }
    }
}

impl Drop for Tracked {
    fn drop(&mut self) {
        log::info!("__del__ called");
    }
}

fn main() {
    let t = Tracked::new(42);
    log::info!("Value: {}", t.value);
    drop(t);
    log::info!("End");
}
"""
expected_output = """__new__ called
__init__ called
Value: 42
__del__ called
End"""

[[test]]
name = "repr_vs_str"
description = "Different purposes: debugging vs display"
python = """
class Product:
    def __init__(self, name, price):
        self.name = name
        self.price = price
    
    def __str__(self):
        return f"{self.name} - ${self.price:.2f}"
    
    def __repr__(self):
        return f"Product(name='{self.name}', price={self.price})"

p = Product("Laptop", 999.99)
print(f"For users: {str(p)}")
print(f"For developers: {repr(p)}")
"""
rust = """
use std::fmt;

struct Product {
    name: String,
    price: f64,
}

impl Product {
    fn new(name: &str, price: f64) -> Self {
        Product {
            name: name.to_string(),
            price,
        }
    }
}

impl fmt::Display for Product {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "{} - ${:.2}", self.name, self.price)
    }
}

impl fmt::Debug for Product {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Product(name='{}', price={})", self.name, self.price)
    }
}

fn main() {
    let p = Product::new("Laptop", 999.99);
    log::info!("For users: {}", p);
    log::info!("For developers: {:?}", p);
}
"""
expected_output = """For users: Laptop - $999.99
For developers: Product(name='Laptop', price=999.99)"""

