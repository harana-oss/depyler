[[test]]
name = "dunder_init_params"
description = "def __init__(self, x, y): ..."
python = """
class Rectangle:
    def __init__(self, width, height):
        self.width = width
        self.height = height
    
    def area(self):
        return self.width * self.height

r = Rectangle(5, 3)
print(r.width)
print(r.height)
print(r.area())
"""
rust = """
struct Rectangle {
    width: i32,
    height: i32,
}

impl Rectangle {
    fn new(width: i32, height: i32) -> Self {
        Rectangle { width, height }
    }

    fn area(&self) -> i32 {
        self.width * self.height
    }
}

fn main() {
    let r = Rectangle::new(5, 3);
    log::info!("{}", r.width);
    log::info!("{}", r.height);
    log::info!("{}", r.area());
}
"""
expected_output = """5
3
15"""

[[test]]
name = "dunder_init_defaults"
description = "def __init__(self, x=0): ..."
python = """
class Config:
    def __init__(self, timeout=30, retries=3):
        self.timeout = timeout
        self.retries = retries

c1 = Config()
c2 = Config(60)
c3 = Config(timeout=45, retries=5)

print(f"{c1.timeout}, {c1.retries}")
print(f"{c2.timeout}, {c2.retries}")
print(f"{c3.timeout}, {c3.retries}")
"""
rust = """
struct Config {
    timeout: i32,
    retries: i32,
}

impl Config {
    fn new() -> Self {
        Config {
            timeout: 30,
            retries: 3,
        }
    }

    fn with_timeout(timeout: i32) -> Self {
        Config {
            timeout,
            retries: 3,
        }
    }

    fn with_both(timeout: i32, retries: i32) -> Self {
        Config { timeout, retries }
    }
}

fn main() {
    let c1 = Config::new();
    let c2 = Config::with_timeout(60);
    let c3 = Config::with_both(45, 5);

    log::info!("{}, {}", c1.timeout, c1.retries);
    log::info!("{}, {}", c2.timeout, c2.retries);
    log::info!("{}, {}", c3.timeout, c3.retries);
}
"""
expected_output = """30, 3
60, 3
45, 5"""

# =============================================================================
# __del__
# =============================================================================

[[test]]
name = "dunder_del"
description = "def __del__(self): cleanup()"
python = """
class Resource:
    def __init__(self, name):
        self.name = name
        print(f"Acquired {name}")
    
    def __del__(self):
        print(f"Released {self.name}")

r = Resource("file.txt")
print("Using resource")
del r
print("Done")
"""
rust = """
struct Resource {
    name: String,
}

impl Resource {
    fn new(name: &str) -> Self {
        log::info!("Acquired {}", name);
        Resource {
            name: name.to_string(),
        }
    }
}

impl Drop for Resource {
    fn drop(&mut self) {
        log::info!("Released {}", self.name);
    }
}

fn main() {
    let r = Resource::new("file.txt");
    log::info!("Using resource");
    drop(r);
    log::info!("Done");
}
"""
expected_output = """Acquired file.txt
Using resource
Released file.txt
Done"""

[[test]]
name = "dunder_del_timing"
description = "__del__ called when object is garbage collected"
python = """
class Temp:
    def __init__(self, id):
        self.id = id
    
    def __del__(self):
        print(f"Deleting Temp {self.id}")

def create_temp():
    t = Temp(1)
    print("Inside function")
    # t goes out of scope here

create_temp()
print("After function")
"""
rust = """
struct Temp {
    id: i32,
}

impl Temp {
    fn new(id: i32) -> Self {
        Temp { id }
    }
}

impl Drop for Temp {
    fn drop(&mut self) {
        log::info!("Deleting Temp {}", self.id);
    }
}

fn create_temp() {
    let t = Temp::new(1);
    log::info!("Inside function");
    // t goes out of scope here
}

fn main() {
    create_temp();
    log::info!("After function");
}
"""
expected_output = """Inside function
Deleting Temp 1
After function"""

[[test]]
name = "dunder_del_references"
description = "__del__ not called with circular references (without gc)"
python = """
import gc

class Node:
    def __init__(self, value):
        self.value = value
        self.next = None
    
    def __del__(self):
        print(f"Deleting Node {self.value}")

# Create circular reference
gc.disable()
n1 = Node(1)
n2 = Node(2)
n1.next = n2
n2.next = n1

del n1
del n2
print("Nodes deleted (but __del__ not called due to circular ref)")
gc.enable()
gc.collect()
print("After gc.collect()")
"""
rust = """
// Rust prevents circular references through its ownership model
// For cyclic structures, we use Rc<RefCell<T>> or Weak references
use std::cell::RefCell;
use std::rc::{Rc, Weak};

struct Node {
    value: i32,
    next: Option<Weak<RefCell<Node>>>,
}

impl Drop for Node {
    fn drop(&mut self) {
        log::info!("Deleting Node {}", self.value);
    }
}

fn main() {
    {
        let n1 = Rc::new(RefCell::new(Node {
            value: 1,
            next: None,
        }));
        let n2 = Rc::new(RefCell::new(Node {
            value: 2,
            next: None,
        }));

        // Use Weak to avoid circular reference
        n1.borrow_mut().next = Some(Rc::downgrade(&n2));
        n2.borrow_mut().next = Some(Rc::downgrade(&n1));
    }
    // Nodes are dropped when they go out of scope
    log::info!("After scope ends");
}
"""
expected_output = """Deleting Node 2
Deleting Node 1
After scope ends"""

# =============================================================================
# __repr__
# =============================================================================

[[test]]
name = "dunder_repr"
description = "def __repr__(self): return f'MyClass({self.x})'"
python = """
class Point:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def __repr__(self):
        return f"Point({self.x}, {self.y})"

p = Point(3, 4)
print(repr(p))
print(p)  # Also uses __repr__ in interactive mode
"""
rust = """
use std::fmt;

#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn new(x: i32, y: i32) -> Self {
        Point { x, y }
    }
}

impl fmt::Display for Point {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Point({}, {})", self.x, self.y)
    }
}

fn main() {
    let p = Point::new(3, 4);
    log::info!("{}", p);
    log::info!("{}", p);
}
"""
expected_output = """Point(3, 4)
Point(3, 4)"""

[[test]]
name = "dunder_repr_eval"
description = "__repr__ should be eval()-able when possible"
python = """
class Circle:
    def __init__(self, radius):
        self.radius = radius
    
    def __repr__(self):
        return f"Circle({self.radius})"

c1 = Circle(5)
print(repr(c1))

# Should be able to recreate object from repr
c2 = eval(repr(c1))
print(c2.radius)
"""
rust = """
struct Circle {
    radius: i32,
}

impl Circle {
    fn new(radius: i32) -> Self {
        Circle { radius }
    }
}

impl std::fmt::Display for Circle {
    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {
        write!(f, "Circle({})", self.radius)
    }
}

fn main() {
    let c1 = Circle::new(5);
    log::info!("{}", c1);

    // Rust doesn't have eval, but the concept is that repr should be clear
    let c2 = Circle::new(5); // Simulating recreation
    log::info!("{}", c2.radius);
}
"""
expected_output = """Circle(5)
5"""

[[test]]
name = "repr_builtin"
description = "repr(obj) calls obj.__repr__()"
python = """
class Book:
    def __init__(self, title, author):
        self.title = title
        self.author = author
    
    def __repr__(self):
        return f"Book(title='{self.title}', author='{self.author}')"

b = Book("1984", "Orwell")
print(repr(b))
"""
rust = """
struct Book {
    title: String,
    author: String,
}

impl Book {
    fn new(title: &str, author: &str) -> Self {
        Book {
            title: title.to_string(),
            author: author.to_string(),
        }
    }
}

impl std::fmt::Display for Book {
    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {
        write!(f, "Book(title='{}', author='{}')", self.title, self.author)
    }
}

fn main() {
    let b = Book::new("1984", "Orwell");
    log::info!("{}", b);
}
"""
expected_output = "Book(title='1984', author='Orwell')"

# =============================================================================
# __str__
# =============================================================================

[[test]]
name = "dunder_str"
description = "def __str__(self): return 'human readable'"
python = """
class Person:
    def __init__(self, name, age):
        self.name = name
        self.age = age
    
    def __str__(self):
        return f"{self.name}, {self.age} years old"
    
    def __repr__(self):
        return f"Person('{self.name}', {self.age})"

p = Person("Alice", 30)
print(str(p))
print(repr(p))
"""
rust = """
use std::fmt;

struct Person {
    name: String,
    age: i32,
}

impl Person {
    fn new(name: &str, age: i32) -> Self {
        Person {
            name: name.to_string(),
            age,
        }
    }
}

impl fmt::Display for Person {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "{}, {} years old", self.name, self.age)
    }
}

impl fmt::Debug for Person {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Person('{}', {})", self.name, self.age)
    }
}

fn main() {
    let p = Person::new("Alice", 30);
    log::info!("{}", p);
    log::info!("{:?}", p);
}
"""
expected_output = """Alice, 30 years old
Person('Alice', 30)"""

[[test]]
name = "dunder_str_fallback"
description = "str() uses __repr__ if __str__ not defined"
python = """
class Widget:
    def __init__(self, id):
        self.id = id
    
    def __repr__(self):
        return f"Widget({self.id})"
    # No __str__ defined

w = Widget(42)
print(str(w))  # Falls back to __repr__
print(repr(w))
"""
rust = """
use std::fmt;

struct Widget {
    id: i32,
}

impl Widget {
    fn new(id: i32) -> Self {
        Widget { id }
    }
}

impl fmt::Display for Widget {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Widget({})", self.id)
    }
}

impl fmt::Debug for Widget {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Widget({})", self.id)
    }
}

fn main() {
    let w = Widget::new(42);
    log::info!("{}", w);
    log::info!("{:?}", w);
}
"""
expected_output = """Widget(42)
Widget(42)"""

