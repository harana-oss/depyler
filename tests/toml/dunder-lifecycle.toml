[metadata]
name = "Dunder Lifecycle Tests"
category = "dunder-methods"

# =============================================================================
# __new__
# =============================================================================

[[test]]
name = "dunder_new"
description = "def __new__(cls): return super().__new__(cls)"
python = """
class Counter:
    _count = 0
    
    def __new__(cls):
        cls._count += 1
        instance = super().__new__(cls)
        return instance
    
    def __init__(self):
        self.id = Counter._count

c1 = Counter()
c2 = Counter()
print(c1.id)
print(c2.id)
"""
rust = """
struct Counter {
    id: i32,
}

static mut COUNT: i32 = 0;

impl Counter {
    fn new() -> Self {
        unsafe {
            COUNT += 1;
            Counter { id: COUNT }
        }
    }
}

fn main() {
    let c1 = Counter::new();
    let c2 = Counter::new();
    log::info!("{}", c1.id);
    log::info!("{}", c2.id);
}
"""
expected_output = """1
2"""

[[test]]
name = "dunder_new_args"
description = "__new__ receiving and passing arguments"
python = """
class Validated:
    def __new__(cls, value):
        if value < 0:
            raise ValueError("Value must be non-negative")
        instance = super().__new__(cls)
        return instance
    
    def __init__(self, value):
        self.value = value

v = Validated(10)
print(v.value)
"""
rust = """
struct Validated {
    value: i32,
}

impl Validated {
    fn new(value: i32) -> Result<Self, String> {
        if value < 0 {
            Err("Value must be non-negative".to_string())
        } else {
            Ok(Validated { value })
        }
    }
}

fn main() {
    let v = Validated::new(10).unwrap();
    log::info!("{}", v.value);
}
"""
expected_output = "10"

