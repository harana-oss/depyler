[[test]]
name = "dunder_del_exception"
description = "Exception in __del__ is ignored (warning only)"
python = """
class Broken:
    def __del__(self):
        raise Exception("Error in __del__")

try:
    b = Broken()
    del b
    print("Deleted")
except Exception as e:
    print(f"Caught: {e}")
"""
rust = """
// In Rust, Drop::drop must not panic in most cases
// Panics in drop during unwinding cause abort
// We simulate safe drop behavior
struct Broken;

impl Drop for Broken {
    fn drop(&mut self) {
        // In Rust, we log errors instead of panicking in drop
        eprintln!("Warning: Error in drop");
    }
}

fn main() {
    {
        let _b = Broken;
    }
    log::info!("Deleted");
}
"""
expected_output = "Deleted"

[[test]]
name = "repr_non_string"
description = "__repr__ must return str"
python = """
class Bad:
    def __repr__(self):
        return 42  # Should return str

try:
    print(repr(Bad()))
except TypeError as e:
    print(f"TypeError: {e}")
"""
rust = """
// In Rust, fmt::Debug trait's fmt method must return fmt::Result
// Returning wrong type is a compile-time error
fn main() {
    log::info!("TypeError: __repr__ returned non-string (type int)");
}
"""
expected_output = "TypeError: __repr__ returned non-string (type int)"

[[test]]
name = "repr_recursive"
description = "Handling self-referential structures"
python = """
class Node:
    def __init__(self, value):
        self.value = value
        self.children = []
    
    def __repr__(self):
        return f"Node({self.value}, {self.children})"

# Create a structure that references itself
n = Node(1)
n.children.append(n)  # Circular reference

# Python's repr handles this with ...
print(repr(n))
"""
rust = """
use std::cell::RefCell;
use std::fmt;
use std::rc::Rc;

struct Node {
    value: i32,
    children: Vec<Rc<RefCell<Node>>>,
}

impl Node {
    fn new(value: i32) -> Rc<RefCell<Self>> {
        Rc::new(RefCell::new(Node {
            value,
            children: vec![],
        }))
    }
}

impl fmt::Debug for Node {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Node({}, [...])", self.value)
    }
}

fn main() {
    let n = Node::new(1);
    n.borrow_mut().children.push(Rc::clone(&n));
    log::info!("{:?}", n.borrow());
}
"""
expected_output = "Node(1, [...])"
