'''

[[test]]
name = "set_empty"
description = "set() not {}"
tags = ["sets", "creation"]

python = '''
result = set()
empty_dict = {}
is_set = type(result).__name__ == 'set'
is_dict = type(empty_dict).__name__ == 'dict'
result = (is_set, is_dict)
'''

rust = '''
pub const result: serde_json::Value = HashSet::<i32>::new();
pub const is_set: serde_json::Value = std::any::type_name_of_val(&result).__name__ == "set";
pub const is_dict: serde_json::Value = std::any::type_name_of_val(&empty_dict.clone()).__name__ == "dict";
pub const result: (serde_json::Value, serde_json::Value) = (is_set, is_dict);
lazy_static! {
    pub static ref empty_dict: HashMap<serde_json::Value, serde_json::Value> = {
        let map = HashMap::new();
        map
    };
}
use lazy_static::lazy_static;
use serde_json;
use std::collections::HashMap;
use std::collections::HashSet;
'''

