[[test]]
name = "frozenset_immutable"
description = "Cannot add/remove"
tags = ["frozenset"]
skip = true

python = '''
fs = frozenset([1, 2, 3])
try:
    fs.add(4)
    result = False
except AttributeError:
    result = True
'''

rust = '''
pub const fs: serde_json::Value = std::sync::Arc::new(vec![1, 2, 3].into_iter().collect::<HashSet<_>>());
use serde_json;
use std::collections::HashSet;
'''

[[test]]
name = "frozenset_hashable"
description = "Can be dict key or set element"
tags = ["frozenset", "hash"]

python = '''
fs = frozenset([1, 2, 3])
d = {fs: 'value'}
s = {fs, frozenset([4, 5])}
result = (d[fs], len(s))
'''

rust = '''
pub const fs: serde_json::Value = std::sync::Arc::new(vec![1, 2, 3].into_iter().collect::<HashSet<_>>());
pub const result: (serde_json::Value, serde_json::Value) =
    (d.clone().get(&fs).cloned().unwrap(), s.clone().len() as i32);
lazy_static! {
    pub static ref d: HashMap<serde_json::Value, String> = {
        let mut map = HashMap::new();
        map.insert(fs, "value".to_string());
        map
    };
    pub static ref s: HashSet<serde_json::Value> = {
        let mut set = HashSet::new();
        set.insert(fs);
        set.insert(std::sync::Arc::new(vec![4, 5].into_iter().collect::<HashSet<_>>()));
        set
    };
}
use lazy_static::lazy_static;
use serde_json;
use std::collections::HashMap;
use std::collections::HashSet;
'''

