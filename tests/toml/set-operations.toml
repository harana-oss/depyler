# Set Operations Tests - Set mathematical operations
# Rust Mapping: HashSet operations

[metadata]
name = "Set Operations Tests"
category = "data-structures"

# =============================================================================
# Set Creation
# =============================================================================

[[test]]
name = "set_literal"
description = "{1, 2, 3}"
tags = ["sets", "creation"]

python = '''
result = {1, 2, 3}
'''

rust = '''
lazy_static! {
    pub static ref result: HashSet<i32> = {
        let mut set = HashSet::new();
        set.insert(1);
        set.insert(2);
        set.insert(3);
        set
    };
}
use lazy_static::lazy_static;
use std::collections::HashSet;
'''

[[test]]
name = "set_constructor"
description = "set([1, 2, 3])"
tags = ["sets", "creation"]

python = '''
