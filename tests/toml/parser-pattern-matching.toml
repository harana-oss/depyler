[[test]]
name = "pattern_star"
skip = true
tags = ["match", "star"]
description = "Star pattern for remaining elements - using slice matching"
python = '''
def get_len_category(items: list) -> str:
    length = len(items)
    if length == 0:
        return "empty"
    elif length == 1:
        return "single"
    else:
        return "multiple"
result = get_len_category([1, 2, 3])
print(result)
'''
rust = '''
fn get_len_category(items: Vec<i64>) -> String {
    match items.as_slice() {
        [] => "empty".to_string(),
        [_] => "single".to_string(),
        _ => "multiple".to_string(),
    }
}

fn main() {
    let result = get_len_category(vec![1, 2, 3]);
    println!("{}", result);
}
'''
expected_output = "multiple"

[[test]]
name = "pattern_star_middle"
skip = true
tags = ["match", "star"]
description = "Star pattern in middle position - using slice matching"
python = '''
def get_first_last(items: list) -> str:
    length = len(items)
    if length < 2:
        return "too short"
    first = items[0]
    last = items[-1]
    return f"{first} to {last}"
result = get_first_last([1, 2, 3, 4, 5])
print(result)
'''
rust = '''
fn get_first_last(items: Vec<i64>) -> String {
    match items.as_slice() {
        [] | [_] => "too short".to_string(),
        [first, .., last] => format!("{} to {}", first, last),
        _ => "too short".to_string(),
    }
}

fn main() {
    let result = get_first_last(vec![1, 2, 3, 4, 5]);
    println!("{}", result);
}
'''
expected_output = "1 to 5"

[[test]]
name = "pattern_dict"
skip = true
tags = ["match", "mapping"]
description = "Dict pattern matching - using explicit key checks"
python = '''
def check_dict(d: dict) -> str:
    if "x" in d and "y" in d:
        return f"point: ({d['x']}, {d['y']})"
    elif "x" in d:
        return f"x only: {d['x']}"
    else:
        return "no x"
d = {"x": 1, "y": 2}
result = check_dict(d)
print(result)
'''
rust = '''
use std::collections::HashMap;

fn check_dict(d: HashMap<String, i64>) -> String {
    match (d.get("x"), d.get("y")) {
        (Some(x), Some(y)) => format!("point: ({}, {})", x, y),
        (Some(x), None) => format!("x only: {}", x),
        _ => "no x".to_string(),
    }
}

fn main() {
    let mut d = HashMap::new();
    d.insert("x".to_string(), 1);
    d.insert("y".to_string(), 2);
    let result = check_dict(d);
    println!("{}", result);
}
'''
expected_output = "point: (1, 2)"

[[test]]
name = "pattern_dict_star"
skip = true
tags = ["match", "mapping", "star"]
description = "Dict pattern with double-star for rest - checking keys"
python = '''
def get_info(d: dict) -> str:
    if "name" in d:
        return f"name: {d['name']}"
    else:
        return "anonymous"
result = get_info({"name": "Alice", "age": 30})
print(result)
'''
rust = '''
use std::collections::HashMap;

fn get_info(d: HashMap<String, String>) -> String {
    match d.get("name") {
        Some(name) => format!("name: {}", name),
        None => "anonymous".to_string(),
    }
}

fn main() {
    let mut d = HashMap::new();
    d.insert("name".to_string(), "Alice".to_string());
    d.insert("age".to_string(), "30".to_string());
    let result = get_info(d);
    println!("{}", result);
}
'''
expected_output = "name: Alice"

[[test]]
name = "pattern_class_positional"
skip = true
tags = ["match", "class"]
description = "Class pattern with positional args - using struct matching"
python = '''
class Point:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y

def describe_point(p: Point) -> str:
    return f"Point({p.x}, {p.y})"

p = Point(3, 4)
result = describe_point(p)
print(result)
'''
rust = '''
struct Point {
    x: i64,
    y: i64,
}

fn describe_point(p: &Point) -> String {
    match p {
        Point { x, y } => format!("Point({}, {})", x, y),
    }
}

fn main() {
    let p = Point { x: 3, y: 4 };
    let result = describe_point(&p);
    println!("{}", result);
}
'''
expected_output = "Point(3, 4)"

[[test]]
name = "pattern_class_keyword"
skip = true
tags = ["match", "class"]
description = "Class pattern with keyword args - using struct field matching"
python = '''
class Config:
    def __init__(self, debug: bool, verbose: bool):
        self.debug = debug
        self.verbose = verbose

def describe_config(c: Config) -> str:
    if c.debug and c.verbose:
        return "full debug"
    elif c.debug:
        return "debug only"
    else:
        return "normal"

c = Config(True, False)
result = describe_config(c)
print(result)
'''
rust = '''
struct Config {
    debug: bool,
    verbose: bool,
}

fn describe_config(c: &Config) -> String {
    match c {
        Config {
            debug: true,
            verbose: true,
        } => "full debug".to_string(),
        Config {
            debug: true,
            verbose: false,
        } => "debug only".to_string(),
        _ => "normal".to_string(),
    }
}

fn main() {
    let c = Config {
        debug: true,
        verbose: false,
    };
    let result = describe_config(&c);
    println!("{}", result);
}
'''
expected_output = "debug only"

