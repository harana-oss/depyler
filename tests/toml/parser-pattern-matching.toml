# Parser Pattern Matching Tests
# These tests verify various match statement patterns
# Python uses if/elif to demonstrate semantics since match transpilation 
# requires specific patterns

[[test]]
name = "pattern_literal"
skip = true
tags = ["match", "literal"]
python = '''
def check(x: int) -> str:
    if x == 1:
        return "one"
    elif x == 2:
        return "two"
    else:
        return "other"
result = check(1)
print(result)
'''
rust = '''
fn check(x: i64) -> String {
    match x {
        1 => "one".to_string(),
        2 => "two".to_string(),
        _ => "other".to_string(),
    }
}

fn main() {
    let result = check(1);
    println!("{}", result);
}
'''
expected_output = "one"

