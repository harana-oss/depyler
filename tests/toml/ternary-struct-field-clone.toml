# =============================================================================
# Mutable conditional assignment — borrow instead of clone when mutating
# =============================================================================

[[test]]
name = "ternary_mut_ref_field_no_clone"
description = "Ternary selecting between &mut struct fields should use &mut not clone when mutated"

python = '''
from dataclasses import dataclass
from enum import Enum

class Team(Enum):
    Home = 0
    Away = 1

@dataclass
class Scores:
    tries: int

@dataclass
class PlayerStatistics:
    scores: Scores

@dataclass
class Statistics:
    player_statistics: list[PlayerStatistics]

@dataclass
class GameState:
    home_statistics: Statistics
    away_statistics: Statistics

def assign_try(state: GameState, team: Team, player_list_idx: int) -> None:
    team_stats = state.home_statistics if team == Team.Home else state.away_statistics
    team_stats.player_statistics[player_list_idx].scores.tries = team_stats.player_statistics[player_list_idx].scores.tries + 1
'''

rust = '''
#[derive(Debug, Default, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash)]
pub enum Team {
    #[default]
    Home = 0,
    Away = 1,
}
impl Team {
    pub fn from_i32(value: i32) -> Option<Self> {
        match value {
            0 => Some(Self::Home),
            1 => Some(Self::Away),
            _ => None,
        }
    }
    pub fn from_i32_or_default(value: i32) -> Self {
        Self::from_i32(value).unwrap_or(Self::Home)
    }
}
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Scores {
    pub tries: i32,
}
impl Scores {
    pub fn new(tries: i32) -> Self {
        Self { tries }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct PlayerStatistics {
    pub scores: Scores,
}
impl PlayerStatistics {
    pub fn new(scores: Scores) -> Self {
        Self { scores }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Statistics {
    pub player_statistics: Vec<PlayerStatistics>,
}
impl Statistics {
    pub fn new(player_statistics: Vec<PlayerStatistics>) -> Self {
        Self {
            player_statistics,
        }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct GameState {
    pub home_statistics: Statistics,
    pub away_statistics: Statistics,
}
impl GameState {
    pub fn new(home_statistics: Statistics, away_statistics: Statistics) -> Self {
        Self {
            home_statistics,
            away_statistics,
        }
    }
}
pub fn assign_try(state: &mut GameState, team: &Team, player_list_idx: i32) {
    let team_stats = if *team == Team::Home {
        &mut state.home_statistics
    } else {
        &mut state.away_statistics
    };
    team_stats
        .player_statistics
        .get_mut(player_list_idx as usize)
        .unwrap()
        .scores
        .tries = team_stats
        .player_statistics
        .get(player_list_idx as usize)
        .cloned()
        .unwrap()
        .scores
        .tries
        + 1;
}
'''
