[[test]]
name = "string_zfill"
skip = true
description = "Python zfill() - zero fill string"

python = '''
def zero_fill(text: str, width: int) -> str:
    return text.zfill(width)
'''

rust = '''
pub fn zero_fill(text: String, width: i32) -> String {
    return {
        let s = text;
        let width = width as usize;
        if s.len() >= width {
            s.to_string()
        } else {
            let sign = if s.starts_with('-') || s.starts_with('+') {
                &s[0..1]
            } else {
                ""
            };
            let num = if !sign.is_empty() { &s[1..] } else { &s[..] };
            format!("{}{}{}", sign, "0".repeat(width - s.len()), num)
        }
    }
'''

[[test]]
name = "str_capitalize"
description = "str.capitalize() capitalize first character"

python = '''
def capitalize_str(s: str) -> str:
    return s.capitalize()
'''

rust = '''
pub fn capitalize_str(s: String) -> String {
    return {
        let s = s;
        let mut chars = s.chars();
        match chars.next() {
            None => String::new(),
            Some(first) => {
                first.to_uppercase().collect::<String>() + &chars.as_str().to_lowercase()
            }
        }
    };
}
'''

