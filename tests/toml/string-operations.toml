[[test]]
name = "string_all_methods_combined"
description = "Multiple string methods together"
tags = ["string", "method"]

python = '''
def process_string(text: str) -> tuple[str, str, bool, int]:
    leading = text.lstrip()
    trailing = text.rstrip()
    is_alnum = text.isalnum()
    count_a = text.count("a")
    return (leading, trailing, is_alnum, count_a)
'''

rust = '''
pub fn process_string(text: String) -> (String, String, bool, i32) {
    let leading = text.trim_start();
    let trailing = text.trim_end();
    let is_alnum = text.chars().all(|c| c.is_alphanumeric());
    let count_a = text.matches("a").count() as i32;
    return (leading, trailing, is_alnum, count_a);
}
'''

[[test]]
name = "string_center"
description = "Python center() - center text in field"
tags = ["string", "method", "padding"]

python = '''
def center_text(text: str, width: int) -> str:
    return text.center(width)
'''

rust = '''
pub fn center_text(text: String, width: i32) -> String {
    return {
        let s = text;
        let width = width as usize;
        let fillchar = " ";
        if s.len() >= width {
            s.to_string()
        } else {
            let total_pad = width - s.len();
            let left_pad = total_pad / 2;
            let right_pad = total_pad - left_pad;
            format!("{}{}{}", fillchar.repeat(left_pad), s, fillchar.repeat(right_pad))
        }
    };
}
'''

