[[test]]
name = "string_slice_last_n"
description = "Get last N characters of string"

python = '''
def get_last_n_chars(s: str, n: int) -> str:
    return s[-n:]
'''

rust = '''
pub fn get_last_n_chars(s: String, n: i32) -> String {
    return {
        let base = &s;
        let start_idx: i32 = (-n);
        let len = base.chars().count() as i32;
        let actual_start = if start_idx < 0 {
            (len + start_idx).max(0) as usize
        } else {
            start_idx.min(len) as usize
        };
        base.chars().skip(actual_start).collect::<String>()
    };
}
'''

