[[test]]
name = "string_field_mutation"
description = "String field mutation requires .to_string()"
tags = ["string", "mutation", "dataclass"]

python = '''
@dataclass
class State:
    value: str

def set_value(state: State) -> None:
    state.value = "updated"
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub value: String,
}
impl State {
    pub fn new(value: String) -> Self {
        Self { value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn set_value(state: &mut State) {
    state.value = "updated".to_string();
}
'''

