name = "String Operations Tests"
category = "strings"

# =============================================================================
# String Method Mappings
# =============================================================================

[[test]]
name = "string_lstrip"
description = "Python lstrip() → Rust trim_start()"
tags = ["string", "method"]

[test.python]
code = '''
def strip_leading(s: str) -> str:
    return s.lstrip()
'''

[test.assertions]
contains = ["trim_start()"]
not_contains = ["lstrip()"]

