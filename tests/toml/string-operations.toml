[[test]]
name = "string_reverse"
description = "Reverse string with [::-1]"
tags = ["string", "slicing"]

python = '''
def reverse_string(s: str) -> str:
    return s[::-1]
'''

rust = '''
pub fn reverse_string(s: String) -> String {
    return {
        let base = &s;
        let step: i32 = -1;
        if step == 1 {
            base.to_string()
        } else if step > 0 {
            base.chars().step_by(step as usize).collect::<String>()
        } else if step == -1 {
            base.chars().rev().collect::<String>()
        } else {
            let abs_step = step.abs() as usize;
            base.chars().rev().step_by(abs_step).collect::<String>()
        }
    };
}
'''

[[test]]
name = "string_slice_start_stop"
description = "String slice with start:stop"
tags = ["string", "slicing"]

python = '''
def substring(s: str, start: int, stop: int) -> str:
    return s[start:stop]
'''

rust = '''
pub fn substring(s: String, start: i32, stop: i32) -> String {
    return {
        let base = &s;
        let start_idx: i32 = start;
        let stop_idx: i32 = stop;
        let len = base.chars().count() as i32;
        let actual_start = if start_idx < 0 {
            (len + start_idx).max(0) as usize
        } else {
            start_idx.min(len) as usize
        };
        let actual_stop = if stop_idx < 0 {
            (len + stop_idx).max(0) as usize
        } else {
            stop_idx.min(len) as usize
        };
        if actual_start < actual_stop {
            base.chars()
                .skip(actual_start)
                .take(actual_stop - actual_start)
                .collect::<String>()
        } else {
            String::new()
        }
    };
}
'''

