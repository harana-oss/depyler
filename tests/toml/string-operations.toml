'''

rust = '''
pub fn swap_case(s: String) -> String {
    return s
        .chars()
        .map(|c| {
            if c.is_uppercase() {
                c.to_lowercase().to_string()
            } else {
                c.to_uppercase().to_string()
            }
        })
        .collect::<String>();
}
'''

