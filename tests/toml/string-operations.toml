[[test]]
name = "string_zfill"
description = "Python zfill() - zero fill string"
tags = ["string", "method", "padding"]

python = '''
def zero_fill(text: str, width: int) -> str:
    return text.zfill(width)
'''

rust = '''
pub fn zero_fill(text: String, width: i32) -> String {
    return {
        let s = text;
        let width = width as usize;
        if s.len() >= width {
            s.to_string()
        } else {
            let sign = if s.starts_with('-') || s.starts_with('+') {
                &s[0..1]
            } else {
                ""
            };
            let num = if !sign.is_empty() { &s[1..] } else { &s[..] };
            format!("{}{}{}", sign, "0".repeat(width - s.len()), num)
        }
    };
}
'''

