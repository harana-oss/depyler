[[test]]
name = "string_slice_chars"
skip = true
description = "String slicing with chars()"

python = '''
def get_last_char(s: str) -> str:
    return s[-1]
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn get_last_char(s: String) -> String {
    return {
        let base = &s;
        let idx: i32 = -1;
        let actual_idx = if idx < 0 {
            base.chars().count().saturating_sub(idx.abs() as usize)
        } else {
            idx as usize
        };
        base.chars().nth(actual_idx).map(|c| c.to_string()).unwrap()
    };
}
'''

