# String Methods Combined
# =============================================================================

[[test]]
name = "string_all_methods_combined"
description = "Multiple string methods together"
tags = ["string", "method"]

[test.python]
code = '''
def process_string(text: str) -> tuple[str, str, bool, int]:
    leading = text.lstrip()
    trailing = text.rstrip()
    is_alnum = text.isalnum()
    count_a = text.count("a")
    return (leading, trailing, is_alnum, count_a)
'''

[test.assertions]
contains = ["trim_start()", "trim_end()", "matches"]

