[[test]]
name = "string_return_type"
description = "Returned string function should return String type"
tags = ["string", "optimization", "return"]

[test.python]
code = '''
def get_greeting() -> str:
    return "Hello!"
'''

[test.assertions]
contains = ["-> String", "\"Hello!\""]

[[test]]
name = "string_concatenation_returns_string"
description = "String concatenation should return String type"
tags = ["string", "optimization", "concat"]

[test.python]
code = '''
def concat_strings(a: str, b: str) -> str:
    return a + b
'''

[test.assertions]
contains = ["-> String"]
contains_any = [["format!", "+"]]

[[test]]
name = "string_param_reference"
description = "Read-only string param should be borrowed"
tags = ["string", "optimization", "borrow"]

[test.python]
code = '''
def validate_string(s: str) -> bool:
    return len(s) > 0
'''

[test.assertions]
contains = ["&", "str"]

[[test]]
name = "string_local_variable"
description = "Local string variable in concatenation"
tags = ["string", "optimization", "local"]

[test.python]
code = '''
def format_number(n: int) -> str:
    prefix = "Number: "
