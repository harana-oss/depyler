pub fn get_all_but_last_n(s: String, n: i32) -> String {
    return {
        let base = &s;
        let stop_idx: i32 = (-n);
        let len = base.chars().count() as i32;
        let actual_stop = if stop_idx < 0 {
            (len + stop_idx).max(0) as usize
        } else {
            stop_idx.min(len) as usize
