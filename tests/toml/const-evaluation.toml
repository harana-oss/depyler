# =============================================================================
# Const Dict Literals
# =============================================================================

[[test]]
name = "const_dict_literals"
description = "Compile-time dict to phf_map"

python = '''
CONFIG = {"debug": 1, "verbose": 0}
'''

rust = '''
use std::collections::HashMap;
lazy_static! {
    pub static ref CONFIG: HashMap<String, i32> = {
        let mut m = HashMap::new();
        m.insert("debug".to_string(), 1);
        m.insert("verbose".to_string(), 0);
        m
    }
use lazy_static::lazy_static;
'''

