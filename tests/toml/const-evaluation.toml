# =============================================================================
# Const Frozen Dataclass
# =============================================================================

[[test]]
name = "const_frozen_dataclass"
description = "Frozen dataclass as const"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

ORIGIN = Point(0, 0)
'''

rust = '''
#[derive(Clone, PartialEq, Eq, Hash)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}

impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}

lazy_static! {
    pub static ref ORIGIN: Point = Point::new(0, 0);
}
use lazy_static::lazy_static;
'''

[[test]]
name = "const_frozen_dataclass_default"
description = "Frozen dataclass with defaults"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Config:
    name: str
    value: int
'''

rust = '''
#[derive(Clone, PartialEq, Eq, Hash)]
pub struct Config {
    pub name: String,
    pub value: i32,
}

impl Config {
    pub fn new(name: String, value: i32) -> Self {
        Self { name, value }
    }
}
'''

