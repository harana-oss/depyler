[metadata]
name = "Const Evaluation Tests"
category = "optimization"

# =============================================================================
# Const Arithmetic
# =============================================================================

[[test]]
name = "const_arithmetic"
description = "Compile-time constant folding"

python = '''
RESULT = 2 + 3 * 4
'''

rust = '''
pub const RESULT: i32 = 2 + 3 * 4;
'''

[[test]]
name = "const_arithmetic_complex"
description = "Complex constant arithmetic"

python = '''
A = 10
B = 20
C = A + B
D = C * 2
'''

rust = '''
pub const A: i32 = 10;
pub const B: i32 = 20;
pub const C: i32 = A + B;
pub const D: i32 = C * 2;
'''

[[test]]
name = "const_arithmetic_division"
description = "Constant division"

python = '''
TOTAL = 100
PARTS = 4
EACH = TOTAL // PARTS
'''

rust = '''
pub const TOTAL: i32 = 100;
pub const PARTS: i32 = 4;
pub const EACH: i32 = TOTAL / PARTS;
'''

[[test]]
name = "const_arithmetic_negative"
description = "Negative constant arithmetic"

python = '''
NEG = -10
POS = 5
SUM = NEG + POS
'''

rust = '''
pub const NEG: i32 = -10;
pub const POS: i32 = 5;
pub const SUM: i32 = NEG + POS;
'''

