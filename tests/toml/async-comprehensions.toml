[[test]]
name = "async_gen_expr"
skip = true
description = "(x async for x in async_iter)"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def test():
    gen = (x async for x in async_range(5))
    result = []
    async for x in gen:
        result.append(x)
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let mut stream = stream::iter(0..5);
let mut result = Vec::new();
while let Some(x) = stream.next().await {
    result.push(x);
}
log::info!("{:?}", result);"""

# =============================================================================
# Await in Comprehension
# =============================================================================

[[test]]
name = "await_in_comp"
skip = true
description = "[await f(x) for x in items]"
python = """
async def fetch(x):
    return x * 2

async def test():
    items = [1, 2, 3]
    result = [await fetch(x) for x in items]
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
async fn fetch(x: i32) -> i32 {
    x * 2
}

#[tokio::main]
async let items = vec![1, 2, 3];
let mut result = Vec::new();
for x in items {
    result.push(fetch(x).await);
}
log::info!("{:?}", result);"""

[[test]]
name = "await_async_for_comp"
skip = true
description = "[await f(x) async for x in async_iter]"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def process(x):
    return x * 2

async def test():
    result = [await process(x) async for x in async_range(5)]
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

async fn process(x: i32) -> i32 {
    x * 2
}

#[tokio::main]
async let stream = stream::iter(0..5);
let result: Vec<i32> = stream
    .then(|x| async move { process(x).await })
    .collect()
    .await;
log::info!("{:?}", result);"""

[[test]]
name = "await_in_filter"
skip = true
description = "[x for x in items if await is_valid(x)]"
python = """
async def is_valid(x):
    return x % 2 == 0

async def test():
    items = [1, 2, 3, 4, 5]
    result = [x for x in items if await is_valid(x)]
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
async fn is_valid(x: i32) -> bool {
    x % 2 == 0
}

#[tokio::main]
async let items = vec![1, 2, 3, 4, 5];
let mut result = Vec::new();
for x in items {
    if is_valid(x).await {
        result.push(x);
    }
}
log::info!("{:?}", result);"""

# =============================================================================
# Combined Patterns
# =============================================================================

[[test]]
name = "async_comp_condition"
skip = true
description = "[x async for x in iter if x > 0]"
python = """
async def async_range(start, end):
    for i in range(start, end):
        yield i

async def test():
    result = [x async for x in async_range(-2, 3) if x > 0]
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let result: Vec<i32> = stream::iter(-2..3)
    .filter(|x| futures::future::ready(*x > 0))
    .collect()
    .await;
log::info!("{:?}", result);"""

[[test]]
name = "async_comp_await_cond"
skip = true
description = "[x async for x in iter if await check(x)]"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def check(x):
    return x % 2 == 0

async def test():
    result = [x async for x in async_range(5) if await check(x)]
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

async fn check(x: i32) -> bool {
    x % 2 == 0
}

#[tokio::main]
async let result: Vec<i32> = stream::iter(0..5)
    .filter(|x| async move { check(*x).await })
    .collect()
    .await;
log::info!("{:?}", result);"""

[[test]]
name = "async_comp_nested"
skip = true
description = "[y async for x in iter1 for y in x]"
python = """
async def async_lists():
