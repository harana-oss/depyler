[metadata]
name = "Async Comprehensions Tests"
category = "async"

# =============================================================================
# Async For in Comprehension
# =============================================================================

[[test]]
name = "async_list_comp"
skip = true
description = "[x async for x in async_iter]"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def test():
    result = [x async for x in async_range(5)]
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
// Async comprehensions map to stream collectors
use futures::stream::{self, StreamExt};

#[tokio::main]
async let result: Vec<i32> = stream::iter(0..5).collect().await;
log::info!("{:?}", result);"""

[[test]]
name = "async_set_comp"
skip = true
description = "{x async for x in async_iter}"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def test():
    result = {x async for x in async_range(5)}
    return sorted(result)

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};
use std::collections::HashSet;

#[tokio::main]
async let result: HashSet<i32> = stream::iter(0..5).collect().await;
let mut sorted: Vec<_> = result.into_iter().collect();
sorted.sort();
log::info!("{:?}", sorted);"""

