[[test]]
name = "async_comp_exception"
skip = true
description = "Exception during async comprehension"
python = """
async def failing_async():
    for i in range(3):
        if i == 2:
            raise ValueError("Error at 2")
        yield i

async def test():
    try:
        result = [x async for x in failing_async()]
        return result
    except ValueError as e:
        return str(e)

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let stream = stream::iter(0..3).map(|i| if i == 2 { Err("Error at 2") } else { Ok(i) });

match stream
    .collect::<Vec<_>>()
    .await
    .into_iter()
    .collect::<Result<Vec<_>, _>>()
{
    Ok(result) => log::info!("{:?}", result),
    Err(e) => log::info!("{}", e),
}"""

[[test]]
name = "async_comp_memory"
skip = true
description = "Generator expression vs list comprehension"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def test():
    # List comprehension - evaluates immediately
    list_comp = [x async for x in async_range(5)]
    
    # Generator expression - lazy evaluation
    gen_expr = (x async for x in async_range(5))
    gen_result = [x async for x in gen_expr]
    
    return list_comp, gen_result

import asyncio
result = asyncio.run(test())
print(result[0], result[1])
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async // Eager collection
let list_comp: Vec<i32> = stream::iter(0..5).collect().await;

// Lazy stream
let gen_expr = stream::iter(0..5);
let gen_result: Vec<i32> = gen_expr.collect().await;

log::info!("{:?} {:?}", list_comp, gen_result);"""
