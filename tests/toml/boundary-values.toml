[[test]]
name = "nested_control_structures"
description = "Deeply nested control flow structures"
tags = ["edge-case", "control-flow", "nested"]

[test.python]
code = '''
def nested_control(n: int) -> int:
    result = 0
    for i in range(n):
        if i % 2 == 0:
            for j in range(i):
                if j % 3 == 0:
                    result += j
    return result
'''

[test.assertions]
contains = ["fn nested_control", "for", "if"]

[[test]]
name = "all_python_operators"
description = "All Python operators in a single function"
tags = ["edge-case", "operators"]

[test.python]
code = '''
def all_operators(a: int, b: int) -> bool:
    add = a + b
    sub = a - b
    mul = a * b
    div = a // b
    mod = a % b
    
    eq = a == b
    ne = a != b
    lt = a < b
    le = a <= b
    gt = a > b
    ge = a >= b
    
    and_op = a and b
    or_op = a or b
    not_op = not a
    
    return eq or ne or lt or le or gt or ge
'''

[test.assertions]
contains = ["fn all_operators"]
