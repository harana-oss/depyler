# Boundary Values Tests
# Migrated from test_boundary_values.rs

[metadata]
name = "boundary-values"
description = "Tests for boundary conditions and edge cases"

# ========== ZERO AND EMPTY VALUES ==========

[[test]]
name = "zero_values"
description = "Test zero values for int, float, list, and dict"
tags = ["boundary", "zero", "empty"]

[test.python]
code = '''
def zero_test() -> int:
    zero_int = 0
    zero_float = 0.0
    zero_list = []
    zero_dict = {}
    return len(zero_list) + len(zero_dict) + zero_int
'''

[test.assertions]
contains = ["len"]

[[test]]
name = "negative_one_values"
description = "Test negative indexing with -1"
tags = ["boundary", "negative", "indexing"]

[test.python]
code = '''
def negative_one_test(arr: list) -> int:
    last_index = -1
    if arr:
        return arr[last_index]
    return -1
'''

[test.assertions]
contains_any = [["- 1", "-1"]]

[[test]]
name = "maximum_list_size"
description = "Test creating large lists with append"
tags = ["boundary", "list", "size"]

[test.python]
code = '''
def create_large_list(size: int) -> list:
    result = []
    for i in range(size):
        result.append(i)
    return result
'''

[test.assertions]
contains = ["push"]

[[test]]
name = "single_element_collections"
description = "Test single element list and dict"
tags = ["boundary", "single", "collection"]

[test.python]
code = '''
def single_element_test() -> int:
    single_list = [42]
    single_dict = {"key": "value"}
    return len(single_list) + len(single_dict)
'''

[test.assertions]
contains = ["len"]

# ========== NUMERIC BOUNDARIES ==========

[[test]]
name = "power_of_two_boundaries"
description = "Test power of two values in loops"
tags = ["boundary", "numeric", "powers"]

[test.python]
code = '''
def power_of_two_test() -> int:
    powers = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024]
    total = 0
    for power in powers:
        total += power
    return total
'''

[test.assertions]
contains = ["for"]

[[test]]
name = "off_by_one_loop_conditions"
description = "Test loop boundary conditions to avoid off-by-one errors"
tags = ["boundary", "loop", "off-by-one"]

[test.python]
code = '''
def off_by_one_test(n: int) -> int:
    count1 = 0
    for i in range(n):
        count1 += 1
    
    count2 = 0  
    for i in range(n + 1):
        count2 += 1
        
    count3 = 0
    for i in range(n - 1):
        count3 += 1
        
    return count1 + count2 + count3
'''

[test.assertions]
contains = ["for"]

[[test]]
name = "floating_point_boundaries"
description = "Test floating point boundary values"
tags = ["boundary", "float", "numeric"]

[test.python]
code = '''
def float_boundary_test() -> float:
    tiny = 0.0001
    zero = 0.0
    negative_tiny = -0.0001
    one = 1.0
    
    return tiny + zero + negative_tiny + one
'''

[test.assertions]
contains = ["f64"]

[[test]]
name = "arithmetic_overflow_boundaries"
description = "Test potential overflow conditions with large values"
tags = ["boundary", "arithmetic", "overflow"]

[test.python]
code = '''
def arithmetic_boundary_test() -> int:
    large_positive = 1000000
    large_negative = -1000000
    
    addition = large_positive + large_positive
    subtraction = large_positive - large_negative
    multiplication = large_positive * 2
    
    return addition + subtraction + multiplication
'''

[test.assertions]
contains_any = [["+", "-", "*"]]

