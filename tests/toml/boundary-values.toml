[[test]]
name = "off_by_one_loop_conditions"
description = "Test loop boundary conditions to avoid off-by-one errors"

python = '''
def off_by_one_test(n: int) -> int:
    count1 = 0
    for i in range(n):
        count1 += 1
    
    count2 = 0  
    for i in range(n + 1):
        count2 += 1
        
    count3 = 0
    for i in range(n - 1):
        count3 += 1
        
    return count1 + count2 + count3
'''

rust = '''
pub fn off_by_one_test(n: i32) -> i32 {
    let mut count1 = 0;
    for _i in 0..n {
        count1 = count1 + 1;
    }
    let mut count2 = 0;
    for _i in 0..n + 1 {
        count2 = count2 + 1;
    }
    let mut count3 = 0;
    for _i in 0..n - 1 {
        count3 = count3 + 1;
    }
    return count1 + count2 + count3;
}
'''

