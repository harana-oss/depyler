[[test]]
name = "deeply_nested_functions"
description = "Deeply nested function definitions"
tags = ["edge-case", "nested", "functions"]

[test.python]
code = '''
def level1(x: int) -> int:
    def level2(y: int) -> int:
        def level3(z: int) -> int:
            def level4(w: int) -> int:
                return w + 1
            return level4(z) + 1
        return level3(y) + 1
    return level2(x) + 1
'''

[test.assertions]
contains = ["fn level1"]

