# ========== RECURSION ==========

[[test]]
name = "recursive_depth_boundaries"
description = "Test recursive function calls at various depths"
tags = ["boundary", "recursion"]

[test.python]
code = '''
def factorial_recursive(n: int) -> int:
    if n <= 1:
        return 1
    return n * factorial_recursive(n - 1)

def test_recursion_depths() -> int:
    small = factorial_recursive(5)
    medium = factorial_recursive(10)
    return small + medium
'''

[test.assertions]
contains = ["factorial_recursive"]

# ========== BOOLEAN BOUNDARIES ==========

[[test]]
name = "boolean_boundaries"
description = "Test boolean truthiness boundaries"
tags = ["boundary", "boolean", "truthiness"]

[test.python]
code = '''
def boolean_boundary_test() -> bool:
    true_val = True
    false_val = False
    
    zero_truthy = bool(0)
    one_truthy = bool(1)
    empty_list_truthy = bool([])
    non_empty_list_truthy = bool([1])
    
    return true_val and not false_val
'''

[test.assertions]
contains_any = [["true", "false", "bool"]]

# ========== MODULO AND RANGE ==========

[[test]]
name = "modulo_operation_boundaries"
description = "Test modulo with various divisors"
tags = ["boundary", "modulo", "arithmetic"]

[test.python]
code = '''
def modulo_boundary_test(n: int) -> int:
    mod_one = n % 1 if n != 0 else 0
    mod_two = n % 2
    mod_ten = n % 10
    mod_hundred = n % 100
    
    return mod_two + mod_ten + mod_hundred
'''

[test.assertions]
contains = ["%"]

[[test]]
name = "range_boundaries"
description = "Test edge cases for range function"
tags = ["boundary", "range"]

[test.python]
code = '''
def range_boundary_test() -> int:
    empty_range = list(range(0))
    single_range = list(range(1))
    reverse_range = list(range(5, 0, -1))
    
    return len(empty_range) + len(single_range) + len(reverse_range)
'''

[test.assertions]
contains_any = [["collect", "range"]]

# ========== CONDITIONAL BOUNDARIES ==========

[[test]]
name = "conditional_boundaries"
description = "Test boundary conditions in if statements"
tags = ["boundary", "conditional", "if"]

[test.python]
code = '''
def conditional_boundary_test(x: int) -> int:
    if x < 0:
        return -1
    elif x == 0:
        return 0
    elif x == 1:
        return 1
    else:
        return x
'''

[test.assertions]
contains_any = [["if", "else"]]

[[test]]
name = "comparison_operator_boundaries"
description = "Test all comparison operators at boundaries"
tags = ["boundary", "comparison", "operators"]

[test.python]
code = '''
def comparison_boundary_test(a: int, b: int) -> bool:
    equal = a == b
    not_equal = a != b
    less_than = a < b
    less_equal = a <= b
    greater_than = a > b
    greater_equal = a >= b
    
    return equal or not_equal or less_than or less_equal or greater_than or greater_equal
'''

[test.assertions]
contains_any = [["==", "!=", "<", "<=", ">", ">="]]

# ========== CONTAINER ACCESS ==========

[[test]]
name = "container_access_boundaries"
description = "Test boundary access patterns for lists including slicing"
tags = ["boundary", "container", "access", "slicing"]

[test.python]
code = '''
def container_access_test() -> int:
    items = [1, 2, 3, 4, 5]
    
    first = items[0]
    last = items[-1]
    
    all_items = items[:]
    first_two = items[:2]
    last_two = items[-2:]
    middle = items[1:-1]
    
    return first + last + len(all_items) + len(first_two) + len(last_two) + len(middle)
'''

[test.assertions]
contains_any = [["[", "]", "len"]]

