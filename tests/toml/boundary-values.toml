'''

rust = '''
pub fn conditional_boundary_test(x: i32) -> i32 {
    if x < 0 {
        return -1;
    } else {
        if x == 0 {
            return 0;
        } else {
            if x == 1 {
                return 1;
            } else {
                return x;
            }
        }
    }
}
'''

[[test]]
name = "comparison_operator_boundaries"
description = "Test all comparison operators at boundaries"

python = '''
def comparison_boundary_test(a: int, b: int) -> bool:
    equal = a == b
    not_equal = a != b
    less_than = a < b
    less_equal = a <= b
    greater_than = a > b
    greater_equal = a >= b
    
    return equal or not_equal or less_than or less_equal or greater_than or greater_equal
'''

rust = '''
pub fn comparison_boundary_test(a: i32, b: i32) -> bool {
    let equal = a == b;
    let not_equal = a != b;
    let less_than = a < b;
    let less_equal = a <= b;
    let greater_than = a > b;
    let greater_equal = a >= b;
    return (((((equal) || (not_equal)) || (less_than)) || (less_equal)) || (greater_than))
        || (greater_equal);
}
'''

[[test]]
name = "container_access_boundaries"
description = "Test boundary access patterns for lists including slicing"

python = '''
def container_access_test() -> int:
    items = [1, 2, 3, 4, 5]
    
    first = items[0]
    last = items[-1]
    
    all_items = items[:]
    first_two = items[:2]
    last_two = items[-2:]
    middle = items[1:-1]
    
    return first + last + len(all_items) + len(first_two) + len(last_two) + len(middle)
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = " Depyler: proven to terminate"]
pub fn container_access_test() -> i32 {
    let items = vec![1, 2, 3, 4, 5];
    let first = items.clone().get(0usize).cloned().unwrap();
    let last = items.clone().last().cloned().unwrap();
    let all_items = items.clone().clone();
    let first_two = {
        let base = &items.clone();
        let stop = (2).max(0) as usize;
        base[..stop.min(base.len())].to_vec()
    };
    let last_two = {
        let base = &items.clone();
        let start = (-2).max(0) as usize;
        if start < base.len() {
            base[start..].to_vec()
        } else {
            Vec::new()
        }
    };
    let middle = {
        let base = &items;
        let start = (1).max(0) as usize;
        let stop = (-1).max(0) as usize;
        if start < base.len() {
            base[start..stop.min(base.len())].to_vec()
        } else {
            Vec::new()
        }
    };
    return first
        + last
        + all_items.len() as i32
        + first_two.len() as i32
        + last_two.len() as i32
        + middle.len() as i32 as i32;
}
'''

