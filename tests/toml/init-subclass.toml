[[test]]
name = "init_subclass_abc"
description = "__init_subclass__ combined with ABC"
tags = ["advanced-oop", "init-subclass", "edge-case"]
python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    registry = []
    
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        Base.registry.append(cls.__name__)
    
    @abstractmethod
    def process(self):
        pass

class Concrete(Base):
    def process(self):
        return "processed"

assert "Concrete" in Base.registry
obj = Concrete()
assert obj.process() == "processed"
'''
rust = '''
// Rust: combine trait with static registration
trait Base {
    fn process(&self) -> String;
}

struct Concrete;
impl Base for Concrete {
    fn process(&self) -> String {
        "processed".to_string()
    }
}

// Registry would be built at compile-time or with lazy_static
let registry = vec!["Concrete"];
assert!(registry.contains(&"Concrete"));
let obj = Concrete;
assert_eq!(obj.process(), "processed");
'''

[[test]]
name = "init_subclass_multiple"
description = "Multiple classes define __init_subclass__"
tags = ["advanced-oop", "init-subclass", "edge-case"]
python = '''
class A:
    def __init_subclass__(cls, a_param=None, **kwargs):
        super().__init_subclass__(**kwargs)
        cls.a_param = a_param

class B(A):
    def __init_subclass__(cls, b_param=None, **kwargs):
        super().__init_subclass__(**kwargs)
        cls.b_param = b_param

class C(B, a_param="from_a", b_param="from_b"):
    pass

assert C.a_param == "from_a"
assert C.b_param == "from_b"
'''
rust = '''
// Rust: multiple trait bounds
trait A {
    fn a_param() -> &'static str { "" }
}

trait B: A {
    fn b_param() -> &'static str { "" }
}

struct C;
impl A for C {
    fn a_param() -> &'static str { "from_a" }
}
impl B for C {
    fn b_param() -> &'static str { "from_b" }
}

assert_eq!(C::a_param(), "from_a");
assert_eq!(C::b_param(), "from_b");
'''

[[test]]
name = "init_subclass_metaclass"
description = "Interaction with custom metaclass"
tags = ["advanced-oop", "init-subclass", "edge-case"]
skip = ["metaclass"]
python = '''
class Meta(type):
    def __new__(mcs, name, bases, namespace):
        namespace['from_meta'] = True
        return super().__new__(mcs, name, bases, namespace)

class Base(metaclass=Meta):
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        cls.from_init_subclass = True

class Sub(Base):
    pass

assert Sub.from_meta == True
assert Sub.from_init_subclass == True
'''
rust = '''
// Rust: use procedural macros for similar effect
// Conceptual example showing both derive and trait

#[derive(Debug)]  // Like metaclass
struct Sub;

trait Base {
    fn from_trait() -> bool { true }
}

impl Base for Sub {}

// Simulates both metaclass and init_subclass effects
assert_eq!(Sub::from_trait(), true);
'''

