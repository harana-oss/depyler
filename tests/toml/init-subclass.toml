[[test]]
name = "init_subclass_super"
description = "Calling super() in __init_subclass__"
tags = ["advanced-oop", "init-subclass"]
python = '''
class Base:
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        cls.from_base = True

class Middle(Base):
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        cls.from_middle = True

class Leaf(Middle):
    pass

assert Leaf.from_base == True
assert Leaf.from_middle == True
'''
rust = '''
// Rust: trait composition
trait Base {
    fn from_base() -> bool { true }
}

trait Middle: Base {
    fn from_middle() -> bool { true }
}

struct Leaf;
impl Base for Leaf {}
impl Middle for Leaf {}

assert_eq!(Leaf::from_base(), true);
assert_eq!(Leaf::from_middle(), true);
'''

[[test]]
name = "init_subclass_chain"
description = "Chain of __init_subclass__ calls"
tags = ["advanced-oop", "init-subclass"]
python = '''
class A:
    chain = []
    
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        A.chain.append('A')

class B(A):
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        A.chain.append('B')

class C(B):
    pass

# C's creation triggers B's __init_subclass__ which calls A's
assert 'A' in A.chain
assert 'B' in A.chain
'''
rust = '''
// Rust: trait methods are called explicitly
trait A {
    fn init() -> Vec<&'static str> {
        vec!["A"]
    }
}

trait B: A {
    fn init() -> Vec<&'static str> {
        let mut chain = <Self as A>::init();
        chain.push("B");
        chain
    }
}

struct C;
impl A for C {}
impl B for C {}

let chain = <C as B>::init();
assert!(chain.contains(&"A"));
assert!(chain.contains(&"B"));
'''

