[[test]]
name = "init_subclass_register"
description = "Auto-register subclasses in a registry"
tags = ["advanced-oop", "init-subclass", "use-case"]
python = '''
class Plugin:
    registry = {}
    
    def __init_subclass__(cls, plugin_id=None, **kwargs):
        super().__init_subclass__(**kwargs)
        if plugin_id:
            Plugin.registry[plugin_id] = cls

class DatabasePlugin(Plugin, plugin_id="db"):
    pass

class CachePlugin(Plugin, plugin_id="cache"):
    pass

assert "db" in Plugin.registry
assert "cache" in Plugin.registry
assert Plugin.registry["db"] is DatabasePlugin
'''
rust = '''
// Rust: use inventory crate or lazy_static for registration
use std::collections::HashMap;

trait Plugin {
    fn id() -> &'static str;
}

struct DatabasePlugin;
impl Plugin for DatabasePlugin {
    fn id() -> &'static str { "db" }
}

struct CachePlugin;
impl Plugin for CachePlugin {
    fn id() -> &'static str { "cache" }
}

// Manually build registry (or use macro)
let mut registry = HashMap::new();
registry.insert(DatabasePlugin::id(), "DatabasePlugin");
registry.insert(CachePlugin::id(), "CachePlugin");

assert!(registry.contains_key("db"));
assert!(registry.contains_key("cache"));
'''

[[test]]
name = "init_subclass_validate"
description = "Validate subclass definition"
tags = ["advanced-oop", "init-subclass", "use-case"]
python = '''
class Base:
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        if not hasattr(cls, 'required_attr'):
            raise TypeError(f"{cls.__name__} must define required_attr")

# This would raise TypeError:
# class BadSub(Base):
#     pass

class GoodSub(Base):
    required_attr = "present"

assert GoodSub.required_attr == "present"
'''
rust = '''
// Rust: use traits to enforce requirements at compile-time
trait Base {
    fn required_attr() -> &'static str;
}

// Won't compile without required_attr:
// struct BadSub;
// impl Base for BadSub {}  // ERROR: missing required_attr

struct GoodSub;
impl Base for GoodSub {
    fn required_attr() -> &'static str { "present" }
}

assert_eq!(GoodSub::required_attr(), "present");
'''

