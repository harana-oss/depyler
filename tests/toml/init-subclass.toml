# =============================================================================
# Basic __init_subclass__
# =============================================================================

[[test]]
name = "init_subclass_basic"
description = "Basic __init_subclass__ hook"
tags = ["advanced-oop", "init-subclass"]
python = '''
class Base:
    subclass_created = []
    
    def __init_subclass__(cls, **kwargs):
        super().__init_subclass__(**kwargs)
        Base.subclass_created.append(cls.__name__)

class Sub1(Base):
    pass

class Sub2(Base):
    pass

assert Base.subclass_created == ["Sub1", "Sub2"]
'''
rust = '''
// Rust doesn't have dynamic subclass hooks
// Use declarative macros or compile-time code gen
// Conceptual equivalent:
trait Base {
    fn name() -> &'static str;
}

struct Sub1;
impl Base for Sub1 {
    fn name() -> &'static str { "Sub1" }
}

struct Sub2;
impl Base for Sub2 {
    fn name() -> &'static str { "Sub2" }
}

// Would need to manually register or use a macro
let names = vec![Sub1::name(), Sub2::name()];
assert_eq!(names, vec!["Sub1", "Sub2"]);
'''

