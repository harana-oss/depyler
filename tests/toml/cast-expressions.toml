[[test]]
name = "int_abs_constants_and_struct_field"
skip = true
description = "int(abs(CONST - (CONST - struct.field))) with constants and field access"

python = '''
from dataclasses import dataclass

CENTRE_OF_FIELD_Y = 50
FIELD_HEIGHT = 100

@dataclass
class Position:
    x: int
    y: int

@dataclass
class GameState:
    ball_location: Position

def compute_distance(state: GameState) -> int:
    return int(abs(CENTRE_OF_FIELD_Y - (FIELD_HEIGHT - state.ball_location.y)))
'''

rust = '''
pub const CENTRE_OF_FIELD_Y: i32 = 50;
pub const FIELD_HEIGHT: i32 = 100;
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Position {
    pub x: i32,
    pub y: i32,
}
impl Position {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct GameState {
    pub ball_location: Position,
}
impl GameState {
    pub fn new(ball_location: Position) -> Self {
        Self { ball_location }
    }
}
pub fn compute_distance(state: &GameState) -> i32 {
    return (CENTRE_OF_FIELD_Y - (FIELD_HEIGHT - state.ball_location.y)).abs();
}
'''

[[test]]
name = "int_abs_float_expression"
skip = true
description = "int(abs(float_expr)) casts float abs to int"

python = '''
def compute(a: float, b: float) -> int:
    return int(abs(a - b))
'''

rust = '''
pub fn compute(a: f64, b: f64) -> i32 {
    return (a - b).abs() as i32;
}
'''

[[test]]
name = "cast_parenthesized_precedence"
description = "float() cast with parenthesized precedence override"

python = '''
def compute(a: int, b: int, c: int) -> float:
    return float((a + b) * c)
'''

rust = '''
pub fn compute(a: i32, b: i32, c: i32) -> f64 {
    return ((a + b) * c) as f64;
}
'''

[[test]]
name = "cast_nested_grouped_arithmetic"
description = "float() with deeply nested grouped operations"

python = '''
def compute(a: int, b: int, c: int, d: int) -> float:
    return float((a + b) * (c - d))
'''

rust = '''
pub fn compute(a: i32, b: i32, c: i32, d: i32) -> f64 {
    return ((a + b) * (c - d)) as f64;
}
'''
