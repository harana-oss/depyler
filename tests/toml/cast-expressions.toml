[[test]]
name = "int_abs_nested_parentheses"
skip = true
description = "int(abs(a - (b - c))) preserves inner parentheses"

python = '''
def compute(a: int, b: int, c: int) -> int:
    return int(abs(a - (b - c)))
'''

rust = '''
