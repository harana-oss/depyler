[metadata]
name = "Cast Expressions Tests"
category = "codegen"
description = "Tests for cast operations requiring values, not references"

[[test]]
name = "float_cast_no_references"
description = "float() cast has no references inside expression"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    x: int
    y: int

def cast_to_float(state: State, cond: bool) -> float:
    return float(state.x if cond else state.y)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub x: i32,
    pub y: i32,
}
impl State {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
pub fn cast_to_float(state: &State, cond: bool) -> f64 {
    return (if cond { state.x } else { state.y }) as f64;
}
'''

[[test]]
name = "int_cast_no_references"
description = "int() cast has no references inside expression"

python = '''
from dataclasses import dataclass

@dataclass
class Data:
    a: float
    b: float

def cast_to_int(data: Data, cond: bool) -> int:
    return int(data.a if cond else data.b)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Data {
    pub a: f64,
    pub b: f64,
}
impl Data {
    pub fn new(a: f64, b: f64) -> Self {
        Self { a, b }
    }
}
pub fn cast_to_int(data: &Data, cond: bool) -> i32 {
    return (if cond { data.a } else { data.b }) as i32;
}
'''

[[test]]
name = "str_cast_from_int"
description = "str() cast from int"

python = '''
def int_to_string(x: int) -> str:
    return str(x)
'''

rust = '''
pub fn int_to_string(x: i32) -> String {
    return x.to_string();
}
'''

[[test]]
name = "bool_cast_from_int"
description = "bool() cast from int"

python = '''
def int_to_bool(x: int) -> bool:
    return bool(x)
'''

rust = '''
pub fn int_to_bool(x: i32) -> bool {
    return x != 0;
}
'''

[[test]]
name = "nested_cast_expression"
description = "Nested cast expression"

python = '''
def nested_cast(x: float) -> str:
    return str(int(x))
'''

rust = '''
pub fn nested_cast(x: f64) -> String {
    return (x as i32).to_string();
}
'''

[[test]]
name = "cast_with_arithmetic"
description = "Cast with arithmetic expression"

python = '''
def cast_sum(a: int, b: int) -> float:
    return float(a + b)
'''

rust = '''
pub fn cast_sum(a: i32, b: i32) -> f64 {
    return (a + b) as f64;
}
'''
