# Template Strings Tests - string.Template
# Rust Mapping: Custom templating

[metadata]
name = "Template Strings Tests"
category = "strings"

# =============================================================================
# Basic Template
# =============================================================================

[[test]]
name = "template_simple"
description = "Template('$name').substitute(name='World')"

python = '''
from string import Template

t = Template('Hello $name')
result = t.substitute(name='World')
assert result == 'Hello World'
'''

rust = '''
// Rust: simple string replacement
let name = "World";
let result = format!("Hello {}", name);
assert_eq!(result, "Hello World");
'''


[[test]]
name = "template_braced"
description = "Template('${name}').substitute(name='World')"

python = '''
from string import Template

t = Template('Hello ${name}!')
result = t.substitute(name='World')
assert result == 'Hello World!'
'''

rust = '''
// Rust: braced format syntax
let name = "World";
let result = format!("Hello {}!", name);
assert_eq!(result, "Hello World!");
'''


[[test]]
name = "template_multiple"
description = "Template('$a and $b').substitute(a=1, b=2)"

python = '''
from string import Template

t = Template('$a and $b')
result = t.substitute(a=1, b=2)
assert result == '1 and 2'
'''

rust = '''
// Rust: multiple format parameters
let a = 1;
let b = 2;
let result = format!("{} and {}", a, b);
assert_eq!(result, "1 and 2");
'''


# =============================================================================
# substitute vs safe_substitute
# =============================================================================

[[test]]
name = "template_missing"
description = "substitute raises KeyError"
skip = true

python = '''
from string import Template

t = Template('$name and $missing')
try:
    result = t.substitute(name='John')
    assert False, "Should raise KeyError"
except KeyError:
    result = True
assert result
'''

rust = '''
// Rust: compile-time format checking prevents this
// At runtime, would need custom template engine
let result = true;
'''


[[test]]
name = "template_safe"
description = "safe_substitute leaves missing placeholders"

python = '''
from string import Template

t = Template('$name and $missing')
result = t.safe_substitute(name='John')
assert result == 'John and $missing'
'''

rust = '''
// Rust: custom template with default handling
let name = "John";
let result = format!("{} and $missing", name);
assert_eq!(result, "John and $missing");
'''


[[test]]
name = "template_safe_partial"
description = "safe_substitute with some keys"

python = '''
from string import Template

t = Template('$a, $b, and $c')
result = t.safe_substitute(a=1, c=3)
assert result == '1, $b, and 3'
'''

rust = '''
// Rust: partial substitution with custom logic
let a = 1;
let c = 3;
let result = format!("{}, $b, and {}", a, c);
assert_eq!(result, "1, $b, and 3");
'''


# =============================================================================
# Escaping
# =============================================================================

[[test]]
name = "template_escape"
description = "Template('$$10') -> '$10'"

python = '''
from string import Template

t = Template('Price: $$10')
result = t.substitute()
assert result == 'Price: $10'
'''

rust = '''
// Rust: literal dollar sign
let result = String::from("Price: $10");
assert_eq!(result, "Price: $10");
'''


[[test]]
name = "template_escape_text"
description = "Template('Cost: $$${price}')"

python = '''
from string import Template

t = Template('Cost: $$${price}')
result = t.substitute(price='9.99')
assert result == 'Cost: $9.99'
'''

rust = '''
// Rust: mixing literal and formatted
let price = "9.99";
let result = format!("Cost: ${}", price);
assert_eq!(result, "Cost: $9.99");
'''


# =============================================================================
# Mapping vs Keyword Args
# =============================================================================

[[test]]
name = "template_dict"
description = "substitute({'name': 'World'})"

python = '''
from string import Template

t = Template('Hello $name')
