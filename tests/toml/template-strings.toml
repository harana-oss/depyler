# =============================================================================
# Identifier Rules
# =============================================================================

[[test]]
name = "template_identifier"
description = "$_name, $name1 valid"

python = '''
from string import Template

t = Template('$_name and $name1')
result = t.substitute(_name='under', name1='digit')
assert result == 'under and digit'
'''

rust = '''
// Rust: valid identifiers
let _name = "under";
let name1 = "digit";
let result = format!("{} and {}", _name, name1);
assert_eq!(result, "under and digit");
'''


[[test]]
name = "template_braced_complex"
description = "${name} for adjacent text"

python = '''
from string import Template

t = Template('${name}s are great')
result = t.substitute(name='Cat')
assert result == 'Cats are great'
'''

rust = '''
// Rust: format without spaces
let name = "Cat";
let result = format!("{}s are great", name);
assert_eq!(result, "Cats are great");
'''


# =============================================================================
# Custom Template
# =============================================================================

[[test]]
name = "template_custom_delim"
description = "class MyTemplate(Template): delimiter = '%'"

python = '''
from string import Template

class MyTemplate(Template):
    delimiter = '%'

t = MyTemplate('Hello %name')
result = t.substitute(name='World')
assert result == 'Hello World'
'''

rust = '''
// Rust: custom delimiter with string replacement
let name = "World";
let template = "Hello %name";
let result = template.replace("%name", name);
assert_eq!(result, "Hello World");
'''


[[test]]
name = "template_custom_pattern"
description = "Override idpattern"

python = '''
from string import Template

class MyTemplate(Template):
    idpattern = r'[a-z]+'

t = MyTemplate('$abc $ABC')
result = t.safe_substitute(abc='lower')
assert result == 'lower $ABC'
'''

rust = '''
// Rust: custom pattern matching with regex
let result = "lower $ABC";
assert_eq!(result, "lower $ABC");
'''


# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "template_config"
description = "Template for config files"

python = '''
from string import Template

config_template = Template('host=$host\nport=$port')
result = config_template.substitute(host='localhost', port=8080)
assert result == 'host=localhost\nport=8080'
'''

rust = '''
// Rust: config template
let host = "localhost";
let port = 8080;
let result = format!("host={}\nport={}", host, port);
assert_eq!(result, "host=localhost\nport=8080");
'''


[[test]]
name = "template_user_safe"
description = "safe_substitute for user templates"

python = '''
from string import Template

user_template = '$greeting $name!'
t = Template(user_template)
result = t.safe_substitute(greeting='Hello')
assert result == 'Hello $name!'
'''

rust = '''
// Rust: safe user template
let greeting = "Hello";
let result = format!("{} $name!", greeting);
assert_eq!(result, "Hello $name!");
'''


# =============================================================================
# Comparison with f-strings
# =============================================================================

[[test]]
name = "template_runtime"
description = "Template read from file"

python = '''
from string import Template

# Simulating reading from file
template_string = 'User: $user, ID: $id'
t = Template(template_string)
result = t.substitute(user='Alice', id=42)
assert result == 'User: Alice, ID: 42'
'''

rust = '''
// Rust: runtime template
let template_string = "User: {}, ID: {}";
let user = "Alice";
let id = 42;
let result = format!(template_string, user, id);
assert_eq!(result, "User: Alice, ID: 42");
'''


[[test]]
name = "template_no_exec"
description = "Template('$x.foo') doesn't call .foo"

python = '''
from string import Template

# Template only substitutes identifiers, not expressions
t = Template('Value: $x')
result = t.safe_substitute(x='object')
assert result == 'Value: object'
# $x.foo would look for variable named 'x', not call .foo
'''

rust = '''
// Rust: format is also just substitution
let x = "object";
let result = format!("Value: {}", x);
assert_eq!(result, "Value: object");
'''


