[[test]]
name = "template_brace_space"
skip = true
description = "${ name } invalid"

python = '''
from string import Template

# Spaces in braces are invalid, won't be substituted
t = Template('${ name }')
result = t.safe_substitute(name='Test')
# The pattern won't match because of spaces
assert '${ name }' in result
result = True
'''

rust = '''
    let template = "${ name }";
    let result = template.contains("${ name }");
    assert!(result);
    let result = true;
'''

