[[test]]
name = "multiple_functions_different_attributes"
description = "Different functions with different attributes"

python = '''
# @depyler: custom_attribute = "inline"
def fast_func(x: int) -> int:
    return x + 1

# @depyler: custom_attribute = "cold"
def slow_func(x: int) -> int:
    return x - 1
'''

rust = '''
#[inline]
pub fn fast_func(x: i32) -> i32 {
    return x + 1;
}
#[cold]
pub fn slow_func(x: i32) -> i32 {
    return x - 1;
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_fast_func_examples() {
        assert_eq!(fast_func(0), 0);
        assert_eq!(fast_func(1), 1);
        assert_eq!(fast_func(-1), -1);
    }
    #[test]
    fn test_slow_func_examples() {
        assert_eq!(slow_func(0), 0);
        assert_eq!(slow_func(1), 1);
        assert_eq!(slow_func(-1), -1);
    }
}
'''

