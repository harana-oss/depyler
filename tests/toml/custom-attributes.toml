# Custom Attributes Tests - Migrated from test_custom_attributes.rs

[metadata]
name = "Custom Attributes Tests"
category = "attributes"

# =============================================================================
# Single Attributes
# =============================================================================

[[test]]
name = "single_custom_attribute"
description = "Single custom attribute via @depyler annotation"

python = '''
# @depyler: custom_attribute = "inline"
def add(a: int, b: int) -> int:
    return a + b
'''

rust = '''
#[inline]
pub fn add(a: i32, b: i32) -> i32 {
    return a + b;
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn quickcheck_add() {
        fn prop(a: i32, b: i32) -> TestResult {
            if (a > 0 && b > i32::MAX - a) || (a < 0 && b < i32::MIN - a) {
                return TestResult::discard();
            }
            let result1 = add(a.clone(), b.clone());
            let result2 = add(b.clone(), a.clone());
            if result1 != result2 {
                return TestResult::failed();
            }
            TestResult::passed()
        }
        quickcheck(prop as fn(i32, i32) -> TestResult);
    }
    #[test]
    fn test_add_examples() {
        assert_eq!(add(0, 0), 0);
        assert_eq!(add(1, 2), 3);
        assert_eq!(add(-1, 1), 0);
    }
}
'''

