[[test]]
name = "custom_attributes_with_other_annotations"
description = "Custom attributes mixed with other depyler annotations"

python = '''
# @depyler: optimization_level = "aggressive"
# @depyler: custom_attribute = "inline"
# @depyler: performance_critical = "true"
def hot_path(items: list[int]) -> int:
    total = 0
    for item in items:
        total += item
    return total
'''

rust = '''
#[inline]
pub fn hot_path(items: &Vec<i32>) -> i32 {
    let mut total = 0;
    for item in items.iter().cloned() {
        total = total + item;
        total = total + item;
        total = total + item;
        total = total + item;
    }
    return total;
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_hot_path_examples() {
        assert_eq!(hot_path(vec![]), 0);
        assert_eq!(hot_path(vec![1]), 1);
        assert_eq!(hot_path(vec![1, 2, 3]), 3);
    }
}
'''

