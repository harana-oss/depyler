# =============================================================================
# Borrow Conflict Test
# =============================================================================

[[test]]
name = "borrow_conflict"
skip = true
description = "Test borrow conflict detection with state and team"

python = '''
from dataclasses import dataclass

@dataclass
class Team:
    name: str

@dataclass
class State:
    score: int
    team_in_possession: Team

def assign_try(state: State, player_index: int, team: Team) -> None:
    state.score = state.score + 5

def process_play(state: State, player_index: int) -> None:
    # This should trigger borrow conflict detection:
    # state is passed as &mut (first arg)
    # state.team_in_possession accesses a field on state (third arg)
    assign_try(state, player_index, state.team_in_possession)
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Team {
    pub name: String,
}
impl Team {
    pub fn new(name: String) -> Self {
        Self { name }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub score: i32,
    pub team_in_possession: Team,
}
impl State {
    pub fn new(score: i32, team_in_possession: Team) -> Self {
        Self {
            score,
            team_in_possession,
        }
    }
}
pub fn assign_try(state: &mut State, player_index: i32, team: &Team) {
    state.score = state.score + 5;
}
pub fn process_play(state: &mut State, player_index: i32) {
    assign_try(state, player_index, &state.team_in_possession.clone());
}
'''

# =============================================================================
# Complex Dataclass Test
# =============================================================================

[[test]]
name = "complex_dataclass"
skip = true
description = "Test different dataclass field types and defaults"

python = '''
from dataclasses import dataclass, field
from typing import Set, List, Dict

@dataclass
class ComplexState:
    # Test different default_factory types
    events: Set[str] = field(default_factory=set)
    items: List[int] = field(default_factory=list)
    metadata: Dict[str, int] = field(default_factory=dict)
    
    # Test field(default=value)
    count: int = field(default=0)
    name: str = field(default="unknown")
    
    # Test regular default (not using field())
    enabled: bool = True
    
    # Test no default
    id: int
'''

rust = '''
use std::collections::HashMap;
use std::collections::HashSet;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct ComplexState {
    pub events: HashSet<String>,
    pub items: Vec<i32>,
    pub metadata: HashMap<String, i32>,
    pub count: i32,
    pub name: String,
    pub enabled: bool,
    pub id: i32,
}
impl ComplexState {
    pub fn new(id: i32) -> Self {
        Self {
            events: HashSet::new(),
            items: Vec::new(),
            metadata: HashMap::new(),
            count: 0,
            name: "unknown".to_string(),
            enabled: Default::default(),
            id,
        }
    }
}
'''
