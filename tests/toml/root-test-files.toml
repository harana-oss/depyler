# =============================================================================
# Simple Mutation Test
# =============================================================================

[[test]]
name = "simple_mutation"
description = "Test case for attribute assignment bug with nested class structures"

python = '''
#!/usr/bin/env python3
"""Simple test case for the attribute assignment bug"""

class Scores:
    def __init__(self):
        self.tries = 0
        self.total = 0

class Statistics:
    def __init__(self):
        self.scores = Scores()

class TeamStatistics:
    def __init__(self):
        self.period_statistics = [Statistics()]

class State:
    def __init__(self):
        self.home_statistics = TeamStatistics()

def add_try(state: State) -> None:
    """Test function that should generate correct mutation code"""
    period_idx = 0
    
    # This should generate direct indexing, not .get().cloned().unwrap()
    state.home_statistics.period_statistics[period_idx].scores.tries = 5
    state.home_statistics.period_statistics[period_idx].scores.total = 25
'''

# =============================================================================
# Field Alias Mutation Test
# =============================================================================

[[test]]
name = "field_alias_mutation"
skip = true
description = "Test field alias mutation with sin bin players"

python = '''
from dataclasses import dataclass
from enum import IntEnum
from typing import List

class Team(IntEnum):
    Home = 0
    Away = 1

class SinBinStatus(IntEnum):
    NotSet = 0
    Active = 1

@dataclass
class Player:
    sin_bin_status: SinBinStatus

@dataclass
class TeamStatistics:
    sin_bin_players: List[Player]

@dataclass
class State:
    home_sin_bin: List[Player]
    away_sin_bin: List[Player]
    home_statistics: TeamStatistics
    away_statistics: TeamStatistics

def rebuild_sin_bin_players(state: State, team: Team) -> None:
    for team in [Team.Home, Team.Away]:
        sin_bin_collection = state.home_sin_bin if team == Team.Home else state.away_sin_bin
        sin_bin_players = [player for player in sin_bin_collection if player.sin_bin_status != SinBinStatus.NotSet]

        team_stats = state.home_statistics if team == Team.Home else state.away_statistics
        team_stats.sin_bin_players = sin_bin_players
'''

rust = '''
#[derive(Debug, Default, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash)]
pub enum Team {
    #[default]
    Home = 0,
    Away = 1,
}
impl Team {
    pub fn from_i32(value: i32) -> Option<Self> {
        match value {
            0 => Some(Self::Home),
            1 => Some(Self::Away),
            _ => None,
        }
    }
    pub fn from_i32_or_default(value: i32) -> Self {
        Self::from_i32(value).unwrap_or(Self::Home)
    }
}
#[derive(Debug, Default, Clone, Copy, PartialEq, Eq, PartialOrd, Ord, Hash)]
pub enum SinBinStatus {
    #[default]
    NotSet = 0,
    Active = 1,
}
impl SinBinStatus {
    pub fn from_i32(value: i32) -> Option<Self> {
        match value {
            0 => Some(Self::NotSet),
            1 => Some(Self::Active),
            _ => None,
        }
    }
    pub fn from_i32_or_default(value: i32) -> Self {
        Self::from_i32(value).unwrap_or(Self::NotSet)
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub sin_bin_status: SinBinStatus,
}
impl Player {
    pub fn new(sin_bin_status: SinBinStatus) -> Self {
        Self { sin_bin_status }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct TeamStatistics {
    pub sin_bin_players: Vec<Player>,
}
impl TeamStatistics {
    pub fn new(sin_bin_players: Vec<Player>) -> Self {
        Self { sin_bin_players }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub home_sin_bin: Vec<Player>,
    pub away_sin_bin: Vec<Player>,
    pub home_statistics: TeamStatistics,
    pub away_statistics: TeamStatistics,
}
impl State {
    pub fn new(
        home_sin_bin: Vec<Player>,
        away_sin_bin: Vec<Player>,
        home_statistics: TeamStatistics,
        away_statistics: TeamStatistics,
    ) -> Self {
        Self {
            home_sin_bin,
            away_sin_bin,
            home_statistics,
            away_statistics,
        }
    }
}
pub fn rebuild_sin_bin_players(state: &mut State, team: &Team) {
    for team in vec![Team::Home, Team::Away] {
        let sin_bin_collection = if team == Team::Home {
            &state.home_sin_bin
        } else {
            &state.away_sin_bin
        };
        let sin_bin_players = sin_bin_collection
            .iter()
            .cloned()
            .filter(|player| player.sin_bin_status != SinBinStatus::NotSet)
            .collect::<Vec<_>>();
        let mut team_stats = if team == Team::Home {
            &mut state.home_statistics
        } else {
            &mut state.away_statistics
        };
        team_stats.sin_bin_players = sin_bin_players;
    }
}
'''

