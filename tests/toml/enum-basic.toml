[metadata]
name = "Enum Basic Tests"
category = "data-structures"

# =============================================================================
# Basic Enum
# =============================================================================

[[test]]
name = "enum_basic"
description = "class Color(Enum): RED = 1; GREEN = 2"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color.RED.value == 1 and Color.GREEN.value == 2
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

let result = Color::RED as i32 == 1 && Color::GREEN as i32 == 2;
'''


[[test]]
name = "enum_member"
description = "Color.RED"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

red = Color.RED
result = red == Color.RED
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

let red = Color::RED;
let result = red == Color::RED;
'''


[[test]]
name = "enum_value"
description = "Color.RED.value == 1"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color.RED.value == 1
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

let result = Color::RED as i32 == 1;
'''


[[test]]
name = "enum_name"
description = "Color.RED.name == 'RED'"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color.RED.name == 'RED'
'''

rust = '''
// Rust enums don't have built-in name property, use Debug formatting
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

let name = format!("{:?}", Color::RED);
let result = name == "RED";
'''


# =============================================================================
# Enum Access
# =============================================================================

[[test]]
name = "enum_by_name"
description = "Color['RED']"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color['RED'] == Color.RED
'''

rust = '''
// Rust doesn't support runtime string-to-enum lookup natively
// Would typically use match or a helper function
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

fn from_name(name: &str) -> Option<Color> {
    match name {
        "RED" => Some(Color::RED),
        "GREEN" => Some(Color::GREEN),
        _ => None,
    }
}

let result = from_name("RED") == Some(Color::RED);
'''


[[test]]
name = "enum_by_value"
description = "Color(1)"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color(1) == Color.RED
'''

rust = '''
// Rust doesn't support value-to-enum conversion automatically
// Use a helper function or match
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

fn from_value(value: i32) -> Option<Color> {
    match value {
        1 => Some(Color::RED),
        2 => Some(Color::GREEN),
        _ => None,
    }
}

let result = from_value(1) == Some(Color::RED);
'''


[[test]]
name = "enum_iteration"
description = "list(Color)"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2
    BLUE = 3

colors = list(Color)
result = len(colors) == 3 and Color.RED in colors
'''

rust = '''
// Rust enums can't be iterated automatically
// Use a const array or macro for iteration
#[derive(Debug, PartialEq, Clone, Copy)]
enum Color {
    RED = 1,
    GREEN = 2,
    BLUE = 3,
}

const ALL_COLORS: [Color; 3] = [Color::RED, Color::GREEN, Color::BLUE];

let result = ALL_COLORS.len() == 3 && ALL_COLORS.contains(&Color::RED);
'''


# =============================================================================
# Enum Comparison
# =============================================================================

[[test]]
name = "enum_is"
description = "Color.RED is Color.RED"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color.RED is Color.RED
'''

rust = '''
// Rust enums are value types, not references
// Use equality comparison instead
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

let result = Color::RED == Color::RED;
'''


[[test]]
name = "enum_equality"
description = "Color.RED == Color.RED"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color.RED == Color.RED
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

let result = Color::RED == Color::RED;
'''


[[test]]
name = "enum_inequality"
description = "Color.RED != Color.GREEN"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color.RED != Color.GREEN
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

let result = Color::RED != Color::GREEN;
'''


[[test]]
name = "enum_not_value"
description = "Color.RED != 1"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

# Enum member is not equal to its value
result = Color.RED != 1
'''

rust = '''
// Rust enums are distinct types from their discriminants
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
    GREEN = 2,
}

// Cannot directly compare enum to integer in Rust (type safety)
let result = true;
'''


# =============================================================================
# String Values
# =============================================================================

[[test]]
name = "enum_string"
description = "class Status(Enum): OK = 'ok'"

python = '''
from enum import Enum

class Status(Enum):
    OK = 'ok'
    ERROR = 'error'

result = Status.OK.value == 'ok'
'''

rust = '''
// Rust enums can't directly hold string literals as discriminants
// Use associated constants or methods instead
#[derive(Debug, PartialEq)]
enum Status {
    OK,
    ERROR,
}

impl Status {
    fn value(&self) -> &str {
        match self {
            Status::OK => "ok",
            Status::ERROR => "error",
        }
    }
}

let result = Status::OK.value() == "ok";
'''


[[test]]
name = "enum_auto_string"
description = "auto() generates names as values"

python = '''
from enum import Enum, auto

class Color(Enum):
    def _generate_next_value_(name, start, count, last_values):
        return name.lower()
    
    RED = auto()
    GREEN = auto()

result = Color.RED.value == 'red'
'''

rust = '''
// Rust doesn't have auto(), define explicitly
#[derive(Debug, PartialEq)]
enum Color {
    RED,
    GREEN,
}

impl Color {
    fn value(&self) -> &str {
        match self {
            Color::RED => "red",
            Color::GREEN => "green",
        }
    }
}

let result = Color::RED.value() == "red";
'''


# =============================================================================
# auto()
# =============================================================================

[[test]]
name = "enum_auto"
description = "class Color(Enum): RED = auto()"

python = '''
from enum import Enum, auto

class Color(Enum):
    RED = auto()
    GREEN = auto()
    BLUE = auto()

result = Color.RED.value == 1 and Color.GREEN.value == 2
'''

rust = '''
// Rust doesn't have auto(), but discriminants auto-increment
#[derive(Debug, PartialEq)]
enum Color {
    RED,     // 0
    GREEN,   // 1
    BLUE,    // 2
}

let result = Color::RED as i32 == 0 && Color::GREEN as i32 == 1;
'''


[[test]]
name = "enum_auto_increment"
description = "auto() starts at 1, increments"

python = '''
from enum import Enum, auto

class Priority(Enum):
    LOW = auto()     # 1
    MEDIUM = auto()  # 2
    HIGH = auto()    # 3

result = Priority.LOW.value == 1 and Priority.MEDIUM.value == 2 and Priority.HIGH.value == 3
'''

rust = '''
// Rust discriminants start at 0 by default, but can be set
#[derive(Debug, PartialEq)]
enum Priority {
    LOW = 1,
    MEDIUM,  // 2
    HIGH,    // 3
}

let result = Priority::LOW as i32 == 1 && Priority::MEDIUM as i32 == 2 && Priority::HIGH as i32 == 3;
'''


[[test]]
name = "enum_mixed_auto"
description = "A = 1; B = auto(); C = auto()"

python = '''
from enum import Enum, auto

class Number(Enum):
    A = 1
    B = auto()  # 2
    C = auto()  # 3

result = Number.A.value == 1 and Number.B.value == 2 and Number.C.value == 3
'''

rust = '''
#[derive(Debug, PartialEq)]
enum Number {
    A = 1,
    B,  // 2
    C,  // 3
}

let result = Number::A as i32 == 1 && Number::B as i32 == 2 && Number::C as i32 == 3;
'''


