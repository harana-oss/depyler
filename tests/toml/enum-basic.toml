# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "enum_alias"
description = "RED = 1; CRIMSON = 1 creates alias"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    CRIMSON = 1  # Alias for RED

result = Color.RED is Color.CRIMSON
'''

rust = '''
// Rust doesn't support enum aliases directly
// All variants must have unique discriminants or be unit variants
#[derive(Debug, PartialEq)]
enum Color {
    RED = 1,
}

// Type alias can refer to the same variant
type Crimson = Color;

let result = true;
'''


[[test]]
name = "enum_unique"
description = "@unique prevents aliases"

python = '''
from enum import Enum, unique

@unique
class Status(Enum):
    OK = 1
    SUCCESS = 2
    # GOOD = 1  # Would raise ValueError with @unique

result = Status.OK.value == 1 and Status.SUCCESS.value == 2
'''

rust = '''
// Rust enforces unique discriminants by default
#[derive(Debug, PartialEq)]
enum Status {
    OK = 1,
    SUCCESS = 2,
    // GOOD = 1,  // Compile error: discriminant value already used
}

let result = Status::OK as i32 == 1 && Status::SUCCESS as i32 == 2;
'''


[[test]]
name = "enum_match"
description = "match color: case Color.RED: ..."

python = '''
value = 2
match value:
    case 1 | 2 | 3:
        result = 'small'
    case _:
        result = 'other'
'''

rust = '''
let value = 2;
let result = match value {
    1 | 2 | 3 => "small",
    _ => "other",
};
'''


[[test]]
name = "enum_conditional_assignment"
description = "Team.Home if condition else Team.Away - enum variants should not be borrowed"

python = '''
from enum import IntEnum

class Team(IntEnum):
    HOME = 1
    AWAY = 2

def get_team(is_home: bool) -> Team:
    return Team.HOME if is_home else Team.AWAY

result = get_team(True) == Team.HOME
'''

rust = '''
#[derive(Debug, Clone, Copy, PartialEq, Eq)]
enum Team {
    Home = 1,
    Away = 2,
}

fn get_team(is_home: bool) -> Team {
    if is_home { Team::Home } else { Team::Away }
}

let result = get_team(true) == Team::Home;
'''
