# =============================================================================
# Enum Methods
# =============================================================================

[[test]]
name = "enum_method"
skip = true
description = "class Color(Enum): def describe(self): ..."

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2
    
    def describe(self):
        return f"Color: {self.name}"

result = Color.RED.describe() == "Color: RED"
'''

rust = '''
    #[derive(Debug, PartialEq)]
    enum Color {
        RED = 1,
        GREEN = 2,
    }

    impl Color {
        fn describe(&self) -> String {
            format!("Color: {:?}", self)
        }
    }

    let result = Color::RED.describe() == "Color: RED";
'''


