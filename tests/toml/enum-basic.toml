# =============================================================================
# String Values
# =============================================================================

[[test]]
name = "enum_string"
skip = true
description = "class Status(Enum): OK = 'ok'"

python = '''
from enum import Enum

class Status(Enum):
    OK = 'ok'
    ERROR = 'error'

result = Status.OK.value == 'ok'
'''

rust = '''
    #[derive(Debug, PartialEq)]
    enum Status {
        OK,
        ERROR,
    }

    impl Status {
        fn value(&self) -> &str {
            match self {
                Status::OK => "ok",
                Status::ERROR => "error",
            }
        }
    }

    let result = Status::OK.value() == "ok";
'''


[[test]]
name = "enum_auto_string"
skip = true
description = "auto() generates names as values"

python = '''
from enum import Enum, auto

class Color(Enum):
    def _generate_next_value_(name, start, count, last_values):
        return name.lower()
    
    RED = auto()
    GREEN = auto()

result = Color.RED.value == 'red'
'''

rust = '''
    #[derive(Debug, PartialEq)]
    enum Color {
        RED,
        GREEN,
    }

    impl Color {
        fn value(&self) -> &str {
            match self {
                Color::RED => "red",
                Color::GREEN => "green",
            }
        }
    }

    let result = Color::RED.value() == "red";
'''


