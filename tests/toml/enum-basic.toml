[metadata]
name = "Enum Basic Tests"
category = "data-structures"

# =============================================================================
# Basic Enum
# =============================================================================

[[test]]
name = "enum_basic"
skip = true
description = "class Color(Enum): RED = 1; GREEN = 2"

python = '''
from enum import Enum

class Color(Enum):
    RED = 1
    GREEN = 2

result = Color.RED.value == 1 and Color.GREEN.value == 2
'''

rust = '''
    #[derive(Debug, PartialEq)]
    enum Color {
        RED = 1,
        GREEN = 2,
    }

    let result = Color::RED as i32 == 1 && Color::GREEN as i32 == 2;
'''


