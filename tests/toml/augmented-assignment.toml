# Edge Cases
# =============================================================================

[[test]]
name = "augmented_inplace_semantics"
description = "Test that mutable types modify in-place"
python = """
original_list = [1, 2, 3]
same_list = original_list
same_list += [4]
print(original_list is same_list, original_list)
"""
rust = """
fn main() {
    let original_list = vec![1, 2, 3];
    let same_list = original_list;
    same_list += vec![4];
    log::info!("{} {:?}", original_list == same_list, original_list);
}
"""

[[test]]
name = "augmented_custom_iadd"
description = "Custom class with __iadd__ implementation"
python = """
class Counter:
    def __init__(self, value):
        self.value = value
    
    def __iadd__(self, other):
        self.value += other
        return self
    
    def __repr__(self):
        return f"Counter({self.value})"

c = Counter(10)
c += 5
print(c)
"""
rust = """
use serde_json;
#[derive(Debug, Clone)]
pub struct Counter {
    pub value: serde_json::Value,
}
impl Counter {
    pub fn new(value: serde_json::Value) -> Self {
        Self { value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<serde_json::Value>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
fn main() {
    let c = Counter::new(10);
    c += 5;
    log::info!("{:?}", c);
}
"""
expected_output = "Counter(15)"

[[test]]
name = "augmented_class_with_list_and_dict"
description = "Complex augmented assignment with class attributes, list elements, and dict values"
python = """
class Counter:
    def __init__(self):
        self.count = 0
        self.values = [1, 2, 3, 4, 5]
    
    def increment(self):
        self.count += 1
    
    def add_to_index(self, index: int, value: int):
        self.values[index] += value

def test_compound_ops():
    c = Counter()
    c.increment()
    c.add_to_index(0, 10)
    
    # Test with dict
    d = {"score": 100}
    d["score"] += 50
    
    return c.count, c.values[0], d["score"]

result = test_compound_ops()
print(result[0])
print(result[1])
print(result[2])
"""
rust = """
use serde_json;
use std::collections::HashMap;
#[derive(Debug, Clone)]
pub struct Counter {
    pub count: i32,
    pub values: Vec<serde_json::Value>,
}
impl Counter {
    pub fn new() -> Self {
        Self {
            count: 0,
            values: [1, 2, 3, 4, 5],
        }
    }
    pub fn increment(&mut self) {
        self.count += 1;
    }
    pub fn add_to_index(&self, index: i32, value: i32) {
        self.values
            .insert(index, format!("{}{}", self.values[index as usize], value));
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "count" => Some(Box::new(self.count.clone()) as Box<dyn std::any::Any>),
            "values" => Some(Box::new(self.values.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "count" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.count = v.clone();
                    true
                } else {
                    false
                }
            }
            "values" => {
                if let Some(v) = value.downcast_ref::<Vec<serde_json::Value>>() {
                    self.values = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn test_compound_ops() -> (serde_json::Value, serde_json::Value, i32) {
    let mut c = Counter::new();
    c.increment();
    c.add_to_index(0, 10);
    let mut d = {
        let mut map = HashMap::new();
        map.insert("score".to_string(), 100);
        map
    };
    d.clone()
        .insert("score".to_string(), d.get("score").cloned().unwrap() + 50);
    return (
        c.count,
        c.values.get(0usize).cloned().unwrap(),
        d.get("score").cloned().unwrap(),
    );
}
fn main() {
    let result = test_compound_ops();
    log::info!("{}", result.get(0usize).cloned().unwrap());
    log::info!("{}", result.get(1usize).cloned().unwrap());
    log::info!("{}", result.get(2usize).cloned().unwrap());
}
"""
expected_output = """1
11
150"""

