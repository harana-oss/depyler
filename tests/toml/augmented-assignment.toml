# =============================================================================
# Augmented Assignment with Subscripts
# =============================================================================

[[test]]
name = "augmented_subscript"
description = "lst[0] += 1"
python = """
lst = [10, 20, 30]
lst[0] += 5
print(lst)
"""
rust = """
fn main() {
    let lst = vec![10, 20, 30];
    lst[0 as usize] = lst.get(0usize).cloned().unwrap() + 5;
    log::info!("{:?}", lst);
}
"""

[[test]]
name = "augmented_dict_value"
description = "d['key'] += 1"
python = """
d = {'a': 10, 'b': 20}
d['a'] += 5
print(d['a'])
"""
rust = """
fn main() {
    let d = {
        let mut map = HashMap::new();
        map.insert("a".to_string(), 10);
        map.insert("b".to_string(), 20);
        map
    };
    d.insert("a".to_string(), d.get("a").cloned().unwrap() + 5);
    log::info!("{}", d.get("a").cloned().unwrap());
}
"""

# =============================================================================
# Augmented Assignment with Attributes
# =============================================================================

[[test]]
name = "augmented_attribute"
description = "obj.attr += 1"
python = """
class Counter:
    def __init__(self):
        self.count = 0

obj = Counter()
obj.count += 5
print(obj.count)
"""
rust = """
#[derive(Debug, Copy, Clone)]
pub struct Counter {
    pub count: i32,
}
impl Counter {
    pub fn new() -> Self {
        Self { count: 0 }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "count" => Some(Box::new(self.count.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "count" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.count = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
fn main() {
    let obj = Counter::new();
    obj.count += 5;
    log::info!("{}", obj.count);
}
"""

