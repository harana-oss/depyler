# =============================================================================
# Augmented Assignment with Collections
# =============================================================================

[[test]]
name = "augmented_add_list"
description = "lst += [item] extends list"
python = """
lst = [1, 2, 3]
lst += [4, 5]
print(lst)
"""
rust = """
fn main() {
    let mut lst = vec![1, 2, 3];
    lst.extend(vec![4, 5]);
    log::info!("{:?}", lst);
}
"""

[[test]]
name = "augmented_add_string"
description = "s += 'more' concatenates strings"
python = """
s = "hello"
s += " world"
print(s)
"""
rust = """
fn main() {
    let mut s = String::from("hello");
    s += " world";
    log::info!("{}", s);
}
"""

[[test]]
name = "augmented_mul_list"
description = "lst *= n repeats list"
python = """
lst = [1, 2]
lst *= 3
print(lst)
"""
rust = """
fn main() {
    let lst = vec![1, 2];
    let result: Vec<i32> = lst.repeat(3).into_iter().flatten().collect();
    log::info!("{:?}", result);
}
"""

