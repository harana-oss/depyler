[[test]]
name = "augmented_dict_value"
description = "d['key'] += 1"
python = """
d = {'a': 10, 'b': 20}
d['a'] += 5
print(d['a'])
"""
rust = """
use std::collections::HashMap;
fn main() {
    let mut d: HashMap<&str, i32> = [("a", 10), ("b", 20)].iter().cloned().collect();
    *d.get_mut("a").unwrap() += 5;
    log::info!("{}", d.get("a").unwrap());
}
"""

# =============================================================================
# Augmented Assignment with Attributes
# =============================================================================

[[test]]
name = "augmented_attribute"
description = "obj.attr += 1"
python = """
class Counter:
    def __init__(self):
        self.count = 0

obj = Counter()
obj.count += 5
print(obj.count)
"""
rust = """
struct Counter {
    count: i32,
}

impl Counter {
    fn new() -> Self {
        Counter { count: 0 }
    }
}

fn main() {
    let mut obj = Counter::new();
    obj.count += 5;
    log::info!("{}", obj.count);
}
"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "augmented_inplace_semantics"
description = "Test that mutable types modify in-place"
python = """
original_list = [1, 2, 3]
same_list = original_list
same_list += [4]
print(original_list is same_list, original_list)
"""
rust = """
fn main() {
    let mut original_list = vec![1, 2, 3];
    original_list.extend(vec![4]);
    log::info!("true {:?}", original_list);
}
"""

[[test]]
name = "augmented_custom_iadd"
description = "Custom class with __iadd__ implementation"
python = """
class Counter:
    def __init__(self, value):
        self.value = value
    
    def __iadd__(self, other):
        self.value += other
        return self
    
    def __repr__(self):
        return f"Counter({self.value})"

c = Counter(10)
c += 5
print(c)
"""
rust = """
use std::ops::AddAssign;

#[derive(Debug)]
struct Counter {
    value: i32,
}

impl Counter {
    fn new(value: i32) -> Self {
        Counter { value }
    }
}

impl AddAssign<i32> for Counter {
    fn add_assign(&mut self, other: i32) {
        self.value += other;
    }
}

impl std::fmt::Display for Counter {
    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {
        write!(f, "Counter({})", self.value)
    }
}

fn main() {
    let mut c = Counter::new(10);
    c += 5;
    log::info!("{}", c);
}
"""
expected_output = "Counter(15)"
