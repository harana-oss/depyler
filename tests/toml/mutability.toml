# =============================================================================
# Nested Field Mutation
# =============================================================================

[[test]]
name = "mut_nested_field_mutation"
description = "Variable with nested field mutation requires mut"
tags = ["mutability", "nested-fields", "regression"]

[test.python]
code = '''
class Inner:
    def __init__(self):
        self.values: list[int] = []

class Outer:
    def __init__(self):
        self.inner: Inner = Inner()

class State:
    def __init__(self):
        self.data: Outer = Outer()

def mutate_nested_field(state: State, value: int) -> None:
    """Test that nested field mutation properly marks the variable as mutable."""
    obj = state.data
    obj.inner.values.append(value)
'''

[test.assertions]
contains = ["let mut obj"]
not_contains = ["let obj = state.data;"]

[[test]]
name = "mut_deeply_nested_field_mutation"
description = "Deeply nested field mutation requires mut on root variable"
tags = ["mutability", "nested-fields", "regression"]

[test.python]
code = '''
class Level3:
    def __init__(self):
        self.items: list[str] = []

class Level2:
    def __init__(self):
        self.level3: Level3 = Level3()

class Level1:
    def __init__(self):
        self.level2: Level2 = Level2()

def mutate_deeply_nested(root: Level1, item: str) -> None:
    """Test that deeply nested field mutation marks the root variable as mutable."""
    obj = root.level2
    obj.level3.items.append(item)
'''

[test.assertions]
contains = ["let mut obj"]

[[test]]
name = "mut_cloned_nested_field_mutation"
description = "Cloned variable with nested field mutation requires mut"
tags = ["mutability", "nested-fields", "clone", "regression"]

[test.python]
code = '''
class TryTracker:
    def __init__(self):
        self.player_indices: list[int] = []

class State:
    def __init__(self):
        self.try_tracker: TryTracker = TryTracker()

def record_try(state: State, player_index: int) -> None:
    """Test the pattern from test_mega where cloned object has nested field mutation."""
    t = state.try_tracker
    t.player_indices.append(player_index)
'''

[test.assertions]
contains = ["let mut t"]
not_contains = ["let t = state.try_tracker"]

