[metadata]
name = "Mutability Tests"
category = "mutability"

# =============================================================================
# Variable Mutability
# =============================================================================

[[test]]
name = "mut_reassign_variable"
description = "Variable requiring mut for reassignment"

python = '''
def counter() -> int:
    x = 0
    x = 1
    x = 2
    return x
'''

rust = '''
pub fn counter() -> i32 {
    let mut x = 0;
    x = 1;
    x = 2;
    return x;
}
'''

