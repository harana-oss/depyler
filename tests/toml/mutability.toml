[[test]]
name = "field_access_not_alias"
skip = true
description = "Assigning from param.field should not create an alias to param"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    current_play_type: str
    team_in_possession: str
    home_score: int
    away_score: int

def calculate_margin(state: State) -> int:
    """Read-only function - should take &State not &mut State"""
    if state.current_play_type == "WonPenalty":
        penalty_team = state.team_in_possession
    else:
        penalty_team = "Away" if state.team_in_possession == "Home" else "Home"

    if penalty_team == "Home":
        return state.home_score - state.away_score
    else:
        return state.away_score - state.home_score
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub current_play_type: String,
    pub team_in_possession: String,
    pub home_score: i32,
    pub away_score: i32,
}
impl State {
    pub fn new(
        current_play_type: String,
        team_in_possession: String,
        home_score: i32,
        away_score: i32,
    ) -> Self {
        Self {
            current_play_type,
            team_in_possession,
            home_score,
            away_score,
        }
    }
}
#[doc = "Read-only function - should take &State not &mut State"]
pub fn calculate_margin(state: &State) -> i32 {
    let penalty_team;
    if state.current_play_type == "WonPenalty" {
        penalty_team = state.team_in_possession.clone();
    } else {
        penalty_team = if state.team_in_possession == "Home" {
            "Away".to_string()
        } else {
            "Home".to_string()
        };
    }
    if penalty_team == "Home" {
        return state.home_score - state.away_score;
    } else {
        return state.away_score - state.home_score;
    }
}
'''

[[test]]
name = "mut_parameter_reassignment"
skip = true
description = "GCD algorithm - parameters reassigned require mut"

python = '''
def gcd(a: int, b: int) -> int:
    while b != 0:
        temp = a % b
        a = b
        b = temp
    return a
'''

rust = '''
pub fn gcd(mut a: i32, mut b: i32) -> i32 {
    while b != 0 {
        let temp = a % b;
        a = b;
        b = temp;
    }
    return a;
}
'''

[[test]]
name = "mut_list_multiple_methods"
description = "List with multiple mutating methods"

python = '''
def mutate_list() -> list[int]:
    items = [1, 2, 3]
    items.extend([4, 5])
    items.insert(0, 0)
    items.remove(2)
    items.pop()
    return items
'''

rust = '''
pub fn mutate_list() -> Vec<i32> {
    let mut items = vec![1, 2, 3];
    items.extend(vec![4, 5].iter().cloned());
    items.insert(0 as usize, 0);
    if let Some(pos) = items.iter().position(|x| x == &2) {
        items.remove(pos)
    } else {
        panic!("ValueError: list.remove(x): x not in list")
    };
    items.pop().unwrap();
    return items;
}
'''

