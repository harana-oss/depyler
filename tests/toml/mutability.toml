rust = '''
use std::collections::HashMap;
pub fn mutate_dict() -> HashMap<String, i32> {
    let mut d = {
        let mut map = HashMap::new();
        map.insert("a".to_string(), 1);
        map
    };
    d.insert("b".to_string(), 2);
    for (k, v) in {
        let mut map = HashMap::new();
        map.insert("c".to_string(), 3);
        map
    } {
        d.insert(k, v);
    }
    return d;
}
'''

