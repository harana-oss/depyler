# Complex Mutability Scenarios (from test_rust_gen_coverage.rs)
# =============================================================================

[[test]]
name = "mut_parameter_reassignment"
description = "GCD algorithm - parameters reassigned require mut"
tags = ["mutability", "parameter", "reassign"]

[test.python]
code = '''
def gcd(a: int, b: int) -> int:
    while b != 0:
        temp = a % b
        a = b
        b = temp
    return a
'''

[test.assertions]
contains = ["fn gcd"]

