# Mutability Tests - Migrated from test_mutability.rs, test_clone.rs, test_mutationing.rs

[metadata]
name = "Mutability Tests"
category = "mutability"

# =============================================================================
# Variable Mutability
# =============================================================================

[[test]]
name = "mut_reassign_variable"
description = "Variable requiring mut for reassignment"
tags = ["mutability", "reassign"]

[test.python]
code = '''
def counter() -> int:
    x = 0
    x = 1
    x = 2
    return x
'''

[test.assertions]
contains = ["let mut x"]

[[test]]
name = "immutable_no_reassign"
description = "Variable not reassigned is immutable"
tags = ["mutability", "immutable"]

[test.python]
code = '''
def constant() -> int:
    x = 42
    return x
'''

[test.assertions]
contains = ["let x"]
not_contains = ["let mut x"]

[[test]]
name = "mut_augmented_assign"
description = "Augmented assignment requires mut"
tags = ["mutability", "augmented"]

[test.python]
code = '''
def accumulate(items: list[int]) -> int:
    total = 0
    for item in items:
        total += item
    return total
'''

