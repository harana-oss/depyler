[[test]]
name = "mut_complex_scenario"
description = "Complex mutations - params, lists, loops, conditionals"
tags = ["mutability", "complex"]

[test.python]
code = '''
def complex_mutations(initial: int) -> list:
    initial = initial * 2
    results = []
    results.append(initial)
    counter = 0
    while counter < 3:
        results.append(counter)
        counter = counter + 1
    if len(results) > 0:
        results.pop()
    return results
'''

[test.assertions]
contains = ["fn complex_mutations", "mut"]

