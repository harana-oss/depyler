[[test]]
name = "slice_assignment_requires_mut_param"
description = "Slice assignment to a field should require &mut parameter"

python = '''
from dataclasses import dataclass

@dataclass
class Player:
    name: str
    score: int

@dataclass
class State:
    all_players: list[Player]

def refresh_players(state: State) -> None:
    combined = []
    state.all_players[:] = combined
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub name: String,
    pub score: i32,
}
impl Player {
    pub fn new(name: String, score: i32) -> Self {
        Self { name, score }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub all_players: Vec<Player>,
}
impl State {
    pub fn new(all_players: Vec<Player>) -> Self {
        Self { all_players }
    }
}
pub fn refresh_players(state: &mut State) {
    let combined = vec![];
    state.all_players.clear();
    state.all_players.extend(combined);
}
'''

[[test]]
name = "slice_assignment_generates_clear_extend"
description = "Slice assignment should generate clear() and extend() without clone()"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    items: list[int]

def update_items(state: State) -> None:
    new_items = [1, 2, 3]
    state.items[:] = new_items
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub items: Vec<i32>,
}
impl State {
    pub fn new(items: Vec<i32>) -> Self {
        Self { items }
    }
}
pub fn update_items(state: &mut State) {
    let new_items = vec![1, 2, 3];
    state.items.clear();
    state.items.extend(new_items);
}
'''

