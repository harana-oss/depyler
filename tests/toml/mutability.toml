# =============================================================================
# Slice Assignment Mutability - Migrated from test_slice_assignment_mutability.rs
# =============================================================================

[[test]]
name = "slice_assignment_requires_mut_param"
description = "Slice assignment to a field should require &mut parameter"
tags = ["mutability", "slice", "struct"]

[test.python]
code = '''
from dataclasses import dataclass

@dataclass
class Player:
    name: str
    score: int

@dataclass
class State:
    all_players: list[Player]

def refresh_players(state: State) -> None:
    combined = []
    state.all_players[:] = combined
'''

[test.assertions]
contains = ["state: &mut State"]

[[test]]
name = "slice_assignment_generates_clear_extend"
description = "Slice assignment should generate clear() and extend() without clone()"
tags = ["mutability", "slice", "codegen"]

[test.python]
code = '''
from dataclasses import dataclass

@dataclass
class State:
    items: list[int]

def update_items(state: State) -> None:
    new_items = [1, 2, 3]
    state.items[:] = new_items
'''

[test.assertions]
contains = [".clear()", ".extend("]
not_contains = [".clone().clear()", ".clone().extend("]

[[test]]
name = "slice_assignment_simple_variable"
description = "Slice assignment to a simple variable"
tags = ["mutability", "slice", "variable"]

[test.python]
code = '''
def update_list() -> list[int]:
    items = [1, 2, 3]
    new_items = [4, 5, 6]
    items[:] = new_items
    return items
'''

[test.assertions]
contains = [".clear()", ".extend("]

# =============================================================================
# Field Access vs Alias Detection
# =============================================================================

[[test]]
name = "field_access_not_alias"
description = "Assigning from param.field should not create an alias to param"
tags = ["mutability", "alias", "field-access"]

[test.python]
code = '''
from dataclasses import dataclass

@dataclass
class State:
    current_play_type: str
    team_in_possession: str
    home_score: int
    away_score: int

def calculate_margin(state: State) -> int:
    """Read-only function - should take &State not &mut State"""
    if state.current_play_type == "WonPenalty":
        penalty_team = state.team_in_possession
    else:
        penalty_team = "Away" if state.team_in_possession == "Home" else "Home"

    if penalty_team == "Home":
        return state.home_score - state.away_score
    else:
        return state.away_score - state.home_score
'''

[test.assertions]
contains = ["state: &State"]
not_contains = ["state: &mut State"]

