[[test]]
name = "mut_complex_scenario"
skip = true
description = "Complex mutations - params, lists, loops, conditionals"

python = '''
def complex_mutations(initial: int) -> list:
    initial *= 2
    results = []
    results.append(initial)
    counter = 0
    while counter < 3:
        results.append(counter)
        counter += 1
    if len(results) > 0:
        results.pop()
    return results
'''

rust = '''
pub fn complex_mutations(mut initial: i32) -> Vec<i32> {
    initial *= 2;
    let mut results = vec![];
    results.push(initial);
    let mut counter = 0;
    while counter < 3 {
        results.push(counter);
        counter += 1;
    }
    if results.len() as i32 > 0 {
        results.pop().unwrap();
    }
    return results;
}
'''

