# For-Loop Variable Mutability (field assignment on loop variable)
# =============================================================================

[[test]]
name = "for_loop_mut_field_assignment"
description = "For loop variable needs mut when field is assigned"
tags = ["mutability", "for-loop", "field-assignment"]

[test.python]
code = '''
class PlayerStats:
    def __init__(self):
        self.time_on_field_in_seconds: int = 0

def add_time_to_players(players: list[PlayerStats], seconds: int) -> None:
    for s in players:
        s.time_on_field_in_seconds = s.time_on_field_in_seconds + seconds
'''

[test.assertions]
contains = ["for mut s in"]

[[test]]
name = "for_loop_mut_nested_field_assignment"
description = "For loop variable needs mut when deeply nested field is assigned"
tags = ["mutability", "for-loop", "nested-fields"]

[test.python]
code = '''
class Scores:
    def __init__(self):
        self.tries: int = 0
        self.total: int = 0

class MatchStats:
    def __init__(self):
        self.scores: Scores = Scores()

class PlayerStatistics:
    def __init__(self):
        self.match_statistics: MatchStats = MatchStats()

def add_try_to_all(player_stats: list[PlayerStatistics]) -> None:
    TRY_POINTS = 4
    for stats in player_stats:
        stats.match_statistics.scores.tries = stats.match_statistics.scores.tries + 1
        stats.match_statistics.scores.total = stats.match_statistics.scores.total + TRY_POINTS
'''

[test.assertions]
contains = ["for mut stats in"]

