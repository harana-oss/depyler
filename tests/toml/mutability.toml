[[test]]
name = "for_loop_mut_nested_field_assignment"
description = "For loop variable needs mut when deeply nested field is assigned"

python = '''
class Scores:
    def __init__(self):
        self.tries: int = 0
        self.total: int = 0

class MatchStats:
    def __init__(self):
        self.scores: Scores = Scores()

class PlayerStatistics:
    def __init__(self):
        self.match_statistics: MatchStats = MatchStats()

def add_try_to_all(player_stats: list[PlayerStatistics]) -> None:
    TRY_POINTS = 4
    for stats in player_stats:
        stats.match_statistics.scores.tries = stats.match_statistics.scores.tries + 1
        stats.match_statistics.scores.total = stats.match_statistics.scores.total + TRY_POINTS
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct Scores {
    pub tries: i32,
    pub total: i32,
}
impl Scores {
    pub fn new() -> Self {
        Self { tries: 0, total: 0 }
    }
}
#[derive(Debug, Clone)]
pub struct MatchStats {
    pub scores: Scores,
}
impl MatchStats {
    pub fn new() -> Self {
        Self {
            scores: Scores::new(),
        }
    }
}
#[derive(Debug, Clone)]
pub struct PlayerStatistics {
    pub match_statistics: MatchStats,
}
impl PlayerStatistics {
    pub fn new() -> Self {
        Self {
            match_statistics: MatchStats::new(),
        }
    }
}
pub fn add_try_to_all(player_stats: &mut Vec<PlayerStatistics>) {
    let TRY_POINTS = 4;
    for mut stats in player_stats.iter().cloned() {
        stats.match_statistics.scores.tries = stats.match_statistics.scores.tries + 1;
        stats.match_statistics.scores.total = stats.match_statistics.scores.total + TRY_POINTS;
    }
}
'''

