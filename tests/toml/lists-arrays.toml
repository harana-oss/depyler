# Lists and Arrays Tests - Migrated from test_array_generation.rs, test_array_literal_regression.rs,
# test_array_unit.rs, test_list_methods_unit.rs, test_collection_operations.rs

[metadata]
name = "Lists and Arrays Tests"
category = "lists"

# =============================================================================
# List Creation
# =============================================================================

[[test]]
name = "list_empty"
description = "Create empty list"
tags = ["list", "creation"]

[test.python]
code = '''
def create_empty() -> list:
    return []
'''

[test.assertions]
contains_any = [["Vec::new()", "vec![]"]]

[[test]]
name = "list_literal"
description = "Create list with literal values"
tags = ["list", "creation"]

[test.python]
code = '''
def create_list() -> list[int]:
    return [1, 2, 3, 4, 5]
'''

[test.assertions]
contains = ["vec![1, 2, 3, 4, 5]"]

[[test]]
name = "list_typed"
description = "Typed list annotation"
tags = ["list", "typing"]

[test.python]
code = '''
from typing import List

def typed_list(items: List[int]) -> int:
    return len(items)
'''

[test.assertions]
contains_any = [["Vec<i32>", "Vec<i64>"]]

