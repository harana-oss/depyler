# =============================================================================
# Array Generation (from test_array_generation.rs)
# =============================================================================

[[test]]
name = "array_literal_generation"
description = "Literal arrays should generate with proper syntax"
tags = ["array", "literal"]

[test.python]
code = '''
def test_arrays():
    arr1 = [1, 2, 3, 4, 5]
    arr2 = [True, False, True]
    return arr1, arr2
'''

[test.assertions]
contains = ["[1, 2, 3, 4, 5]", "[true, false, true]", "vec!"]

[[test]]
name = "array_multiplication_pattern"
description = "Array multiplication pattern [x] * n"
tags = ["array", "multiplication"]

[test.python]
code = '''
def test_multiplication():
    zeros = [0] * 10
    ones = [1] * 5
    pattern = [42] * 8
    return zeros, ones, pattern
'''

[test.assertions]
contains = ["[0; 10]", "[1; 5]", "[42; 8]"]

[[test]]
name = "array_init_functions"
description = "Array initialization functions zeros/ones/full"
tags = ["array", "init"]

[test.python]
code = '''
def test_init():
    z = zeros(10)
    o = ones(5)
    f = full(8, 42)
    return z, o, f
'''

[test.assertions]
contains = ["[0; 10 as usize]", "[1; 5 as usize]", "[42; 8 as usize]"]

[[test]]
name = "array_large_uses_vec"
description = "Large arrays use proper array syntax"
tags = ["array", "large"]

[test.python]
code = '''
def test_large():
    large = [0] * 50
    return large
'''

[test.assertions]
contains = ["[0; 50]"]
not_contains = ["* 50"]

[[test]]
name = "array_not_in_string_list"
description = "not in operator for string list"
tags = ["array", "membership"]

[test.python]
code = '''
def test_membership(variable: str) -> bool:
    return variable not in ['A', 'B']
'''

[test.assertions]
contains = ["fn test_membership", "contains"]
not_contains = ["contains_key"]

[[test]]
name = "array_iteration_with_fstring"
description = "Array iteration with f-string formatting"
tags = ["array", "iteration", "fstring"]

[test.python]
code = '''
def test_array_iteration_with_fstring():
    array = [10, 20, 30, 40, 50]
    temp = "10"
    for item in array:
        temp = f"{item}"
    return temp
'''

[test.assertions]
contains = ["fn test_array_iteration_with_fstring", "[10, 20, 30, 40, 50]", "for item in array", "format!"]

