    }
}
'''

[[test]]
name = "list_add_if_missing_dataclass"
skip = true
description = "'if item not in items' with dataclass - membership check with custom type"

python = '''
from dataclasses import dataclass

@dataclass
class Value:
    x: int

def add_if_missing(items: list[Value], item: Value) -> None:
    if item not in items:
        items.append(item)
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Value {
    pub x: i32,
}
impl Value {
    pub fn new(x: i32) -> Self {
        Self { x }
    }
}
pub fn add_if_missing(items: &mut Vec<Value>, item: &Value) {
        if !items.contains(&item.clone()) {
        items.push(item);
    }
}
'''

[[test]]
name = "list_iterate"
description = "Iterate over list"

python = '''
