# =============================================================================
# Bytes vs Bytearray
# =============================================================================

[[test]]
name = "bytes_immutable"
description = "b'x'[0] = 1 raises"

python = '''
def test_bytes_immutable() -> bool:
    try:
        b = b'x'
        b[0] = 1
        return False
    except TypeError:
        return True
'''

rust = '''
pub fn test_bytes_immutable() -> bool {
    // Bytes are immutable in Rust by default
    return true;
}
'''


[[test]]
name = "bytearray_mutable"
description = "ba[0] = 65"

python = '''
def test_bytearray_mutable() -> bytearray:
    ba = bytearray(b'hello')
    ba[0] = 65
    return ba
'''

rust = '''
pub fn test_bytearray_mutable() -> Vec<u8> {
    let mut ba = b"hello".to_vec();
    ba[0] = 65;
    return ba;
}
'''


[[test]]
name = "bytes_to_bytearray"
description = "bytearray(b'hello')"

python = '''
def test_bytes_to_bytearray() -> bytearray:
    return bytearray(b'hello')
'''

rust = '''
pub fn test_bytes_to_bytearray() -> Vec<u8> {
