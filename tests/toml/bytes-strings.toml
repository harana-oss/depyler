# =============================================================================
# Bytes Methods
# =============================================================================

[[test]]
name = "bytes_find"
description = "b'hello'.find(b'l')"

python = '''
def test_bytes_find() -> int:
    return b'hello'.find(b'l')
'''

rust = '''
pub fn test_bytes_find() -> Option<usize> {
    let haystack = b"hello";
    let needle = b"l";
    return haystack.windows(needle.len())
        .position(|window| window == needle);
}
'''


[[test]]
name = "bytes_split"
description = "b'a,b,c'.split(b',')"

python = '''
def test_bytes_split() -> list:
    return b'a,b,c'.split(b',')
'''

rust = '''
pub fn test_bytes_split() -> Vec<Vec<u8>> {
    let bytes = b"a,b,c";
    return bytes.split(|&b| b == b',')
        .map(|s| s.to_vec())
        .collect();
}
'''


[[test]]
name = "bytes_join"
description = "b','.join([b'a', b'b'])"

python = '''
def test_bytes_join() -> bytes:
    return b','.join([b'a', b'b'])
'''

rust = '''
pub fn test_bytes_join() -> Vec<u8> {
    let parts: Vec<&[u8]> = vec![b"a", b"b"];
    let separator = b",";
    let mut result = Vec::new();
    
    for (i, part) in parts.iter().enumerate() {
        if i > 0 {
            result.extend_from_slice(separator);
        }
        result.extend_from_slice(part);
    }
    
    return result;
}
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "bytes_non_ascii"
description = "b'é' syntax error"

python = '''
def test_bytes_non_ascii() -> bool:
    # Non-ASCII characters require encoding
    try:
        # This would be a syntax error: b'é'
        # Instead use encoding
        result = 'é'.encode('utf-8')
        return True
    except:
        return False
'''

rust = '''
pub fn test_bytes_non_ascii() -> bool {
    // Non-ASCII requires explicit encoding
    let result = "é".as_bytes();
    return result.len() > 0;
}
'''


[[test]]
name = "bytes_empty"
description = "b'' and bytes()"

python = '''
def test_bytes_empty() -> tuple[bytes, bytes]:
    return (b'', bytes())
'''

rust = '''
pub fn test_bytes_empty() -> (Vec<u8>, Vec<u8>) {
    return (b"".to_vec(), Vec::new());
}
'''


[[test]]
name = "bytes_str_compare"
description = "b'a' != 'a'"

python = '''
def test_bytes_str_compare() -> bool:
    return b'a' != 'a'
'''

rust = '''
pub fn test_bytes_str_compare() -> bool {
    let bytes = b"a";
    let string = "a";
    return bytes != string.as_bytes();
}
'''

