[metadata]
name = "Bytes Strings Tests"
category = "strings"

# =============================================================================
# Bytes Literals
# =============================================================================

[[test]]
name = "bytes_literal"
description = "b'hello'"

python = '''
def test_bytes_literal() -> bytes:
    return b'hello'
'''

rust = '''
pub fn test_bytes_literal() -> Vec<u8> {
    return b"hello".to_vec();
}
'''


