[metadata]
name = "Dynamic Imports Tests"
category = "imports"

# =============================================================================
# __import__ Function
# =============================================================================

[[test]]
name = "dynamic_import_builtin"
skip = true
description = "mod = __import__('os')"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


[[test]]
name = "dynamic_import_fromlist"
skip = true
description = "__import__('os.path', fromlist=['join'])"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


# =============================================================================
# importlib
# =============================================================================

[[test]]
name = "dynamic_import_module"
skip = true
description = "importlib.import_module('os')"

python = '''
import importlib
os_module = importlib.import_module('os')
result = os_module is not None
'''

rust = '''
    let result = true;
'''


[[test]]
name = "dynamic_import_relative"
skip = true
description = "import_module('.sub', 'pkg')"

python = '''
import importlib
# In real code: mod = importlib.import_module('.sub', 'pkg')
result = True
'''

rust = '''
    let result = true;
'''


[[test]]
name = "dynamic_reload"
skip = true
description = "importlib.reload(mod)"

python = '''
import importlib
import sys
# In real code: importlib.reload(some_module)
result = True
'''

rust = '''
    let result = true;
'''


