[metadata]
name = "I/O Streams Tests"
category = "io-streams"

# =============================================================================
# sys.stdin Operations
# =============================================================================

[[test]]
name = "stdin_iteration"
description = "sys.stdin iteration"

python = '''
import sys

def process_stdin():
    for line in sys.stdin:
        print(line.rstrip())
'''

rust = '''
use std as sys;
pub fn process_stdin() {
    for line in &sys.stdin.lines().map(|l| l.unwrap_or_default()) {
        let line = line.clone();
        log::info!("{}", line.trim_end());
    }
}
'''

[[test]]
name = "stderr_print"
description = "sys.stderr print output"

python = '''
import sys

def log_error(msg: str):
    print(f"Error: {msg}", file=sys.stderr)
'''

rust = '''
use std as sys;
pub fn log_error(msg: String) {
    log::info!("{} {}", format!("Error: {}", msg), std::io::stderr());
}
'''

[[test]]
name = "file_read_text"
skip = true
description = "File read in text mode"

python = '''
def read_file(filepath: str) -> str:
    with open(filepath) as f:
        content = f.read()
    return content
'''

rust = '''
pub fn read_file(filepath: String) -> String {
    let mut f = std::fs::File::open(filepath)?;
    let content = {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    };
    return content;
}
'''

[[test]]
name = "file_read_binary"
skip = true
description = "File read in binary mode"

python = '''
def read_binary(filepath: str) -> bytes:
    with open(filepath, "rb") as f:
        data = f.read()
    return data
'''

rust = '''
pub fn read_binary(filepath: String) -> bytes {
    let mut f = std::fs::File::open(filepath)?;
    let data = {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    };
    return data;
}
'''

[[test]]
name = "file_iteration"
skip = true
description = "File line-by-line iteration"

python = '''
def count_lines(filepath: str) -> int:
    count = 0
    with open(filepath) as f:
        for line in f:
            count += 1
    return count
'''

rust = '''
pub fn count_lines(filepath: String) -> i32 {
    let count = 0;
    let mut f = std::fs::File::open(filepath)?;
    for _line in std::io::BufReader::new(f)
        .lines()
        .map(|l| l.unwrap_or_default())
    {
        count += 1;
    }
    return count;
}
'''

