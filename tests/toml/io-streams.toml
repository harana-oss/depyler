[[test]]
name = "tempfile_named"
description = "tempfile.NamedTemporaryFile translation"

python = '''
import tempfile

def create_temp() -> str:
    with tempfile.NamedTemporaryFile(mode="w", delete=False) as f:
        temp_path = f.name
        f.write("test content")
    return temp_path
'''

rust = '''
use tempfile;
pub fn create_temp() -> String {
    let _context = tempfile::NamedTempFile();
    let mut f = _context.__enter__();
    let temp_path = f.name;
    f.write("test content");
    return temp_path;
}
'''