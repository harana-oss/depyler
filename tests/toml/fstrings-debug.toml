# F-Strings Debug Tests - Debug specifier (Python 3.8+)
# Rust Mapping: dbg! macro

[metadata]
name = "F-Strings Debug Tests"
category = "strings"

# =============================================================================
# Basic Debug (=)
# =============================================================================

[[test]]
name = "fstring_debug_basic"
description = "f'{x=}' outputs 'x=value'"

python = '''
x = 42
result = f'Value: {x}'
'''

rust = '''
let x = 42;
let result = format!("Value: {}", x);
'''


[[test]]
name = "fstring_debug_expr"
description = "f'{1+2=}' outputs '1+2=3'"

python = '''
