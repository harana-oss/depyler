# =============================================================================
# is_dataclass
# =============================================================================

[[test]]
name = "dataclass_is"
description = "dataclasses.is_dataclass(obj)"

python = '''
from dataclasses import dataclass, is_dataclass

@dataclass
class Point:
    x: int
    y: int

class Regular:
    pass

def test_dataclass_is() -> bool:
    return is_dataclass(Point) and not is_dataclass(Regular)
'''

rust = '''
#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}

struct Regular {}

pub fn test_dataclass_is() -> bool {
    true  // Point is a dataclass-like struct, Regular is not
}
'''


[[test]]
name = "dataclass_is_instance"
description = "is_dataclass on class and instance"

python = '''
from dataclasses import dataclass, is_dataclass

@dataclass
class Point:
    x: int
    y: int

def test_dataclass_is_instance() -> bool:
    p = Point(1, 2)
    return is_dataclass(Point) and is_dataclass(p)
'''

rust = '''
#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}

pub fn test_dataclass_is_instance() -> bool {
    let _p = Point { x: 1, y: 2 };
    true
}
'''


