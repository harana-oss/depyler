    y: int

def test_dataclass_replace_multi() -> tuple:
    p1 = Point(0, 0)
    p2 = replace(p1, x=1, y=2)
    return (p2.x, p2.y)
'''

rust = '''
#[derive(Debug, Clone)]
struct Point {
    x: i32,
    y: i32,
}

