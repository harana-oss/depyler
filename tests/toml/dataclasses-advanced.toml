# =============================================================================
# replace() Function
# =============================================================================

[[test]]
name = "dataclass_replace"
description = "dataclasses.replace(obj, x=10)"

python = '''
from dataclasses import dataclass, replace

@dataclass
class Point:
    x: int
    y: int

def test_dataclass_replace() -> int:
    p1 = Point(1, 2)
    p2 = replace(p1, x=10)
    return p2.x
'''

rust = '''
#[derive(Debug, Clone)]
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn replace_x(&self, x: i32) -> Self {
        Self { x, y: self.y }
    }
}

pub fn test_dataclass_replace() -> i32 {
    let p1 = Point { x: 1, y: 2 };
    let p2 = p1.replace_x(10);
    p2.x
}
'''


