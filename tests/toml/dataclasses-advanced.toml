# Dataclasses Advanced Tests - Advanced dataclass features
# Rust Mapping: Complex struct patterns

[metadata]
name = "Dataclasses Advanced Tests"
category = "data-structures"

# =============================================================================
# Inheritance
# =============================================================================

[[test]]
name = "dataclass_inheritance"
description = "@dataclass class Child(Parent): ..."

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

result = Point(1, 2)
'''

rust = '''
#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}
'''


[[test]]
name = "dataclass_inherit_order"
description = "Parent fields before child fields"

python = '''
from dataclasses import dataclass

@dataclass
class Base:
    x: int

@dataclass
class Child(Base):
    y: int

def test_dataclass_inherit_order() -> tuple:
    c = Child(x=1, y=2)
    return (c.x, c.y)
'''

rust = '''
#[derive(Debug)]
struct Base {
    x: i32,
}

#[derive(Debug)]
struct Child {
    x: i32,
    y: i32,
}

pub fn test_dataclass_inherit_order() -> (i32, i32) {
    let c = Child { x: 1, y: 2 };
    (c.x, c.y)
}
'''


[[test]]
name = "dataclass_override_field"
description = "Override parent field with new default"

python = '''
from dataclasses import dataclass

@dataclass
class Base:
    x: int = 0

@dataclass
class Child(Base):
    x: int = 10

def test_dataclass_override_field() -> int:
    c = Child()
    return c.x
'''

rust = '''
#[derive(Debug)]
struct Base {
    x: i32,
}

#[derive(Debug)]
struct Child {
    x: i32,
}

impl Default for Child {
    fn default() -> Self {
        Self { x: 10 }
    }
}

pub fn test_dataclass_override_field() -> i32 {
    let c = Child::default();
    c.x
}
'''


[[test]]
name = "dataclass_mixed_inherit"
description = "Dataclass inheriting from regular class"

python = '''
from dataclasses import dataclass

class Regular:
    def __init__(self):
        self.base_value = 42

@dataclass
class Child(Regular):
    x: int
    
    def __post_init__(self):
        super().__init__()

def test_dataclass_mixed_inherit() -> int:
    c = Child(x=10)
    return c.base_value
'''

rust = '''
struct Regular {
    base_value: i32,
}

impl Regular {
    fn new() -> Self {
        Self { base_value: 42 }
    }
}

#[derive(Debug)]
struct Child {
    base: Regular,
    x: i32,
}

impl Child {
    fn new(x: i32) -> Self {
        Self {
            base: Regular::new(),
            x,
        }
    }
}

pub fn test_dataclass_mixed_inherit() -> i32 {
    let c = Child::new(10);
    c.base.base_value
}
'''


# =============================================================================
# Comparison and Ordering
# =============================================================================

[[test]]
name = "dataclass_custom_order"
description = "@dataclass(order=True) comparison by fields"

python = '''
from dataclasses import dataclass

@dataclass(order=True)
class Point:
    x: int
    y: int

result = Point(1, 2) < Point(2, 3)
'''

rust = '''
#[derive(Debug, PartialEq, Eq, PartialOrd, Ord)]
struct Point {
    x: i32,
    y: i32,
}
'''


[[test]]
name = "dataclass_order_fields"
description = "field(compare=False) excludes from ordering"

python = '''
from dataclasses import dataclass, field

@dataclass(order=True)
class Point:
    x: int
    y: int
    label: str = field(default="", compare=False)

def test_dataclass_order_fields() -> bool:
    p1 = Point(1, 2, "A")
    p2 = Point(1, 2, "B")
    return p1 == p2
'''

rust = '''
#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
    label: String,
}

impl PartialEq for Point {
    fn eq(&self, other: &Self) -> bool {
        self.x == other.x && self.y == other.y
    }
}

impl Eq for Point {}

impl PartialOrd for Point {
    fn partial_cmp(&self, other: &Self) -> Option<std::cmp::Ordering> {
        Some(self.cmp(other))
    }
}

impl Ord for Point {
    fn cmp(&self, other: &Self) -> std::cmp::Ordering {
        (self.x, self.y).cmp(&(other.x, other.y))
    }
}

pub fn test_dataclass_order_fields() -> bool {
    let p1 = Point { x: 1, y: 2, label: "A".to_string() };
    let p2 = Point { x: 1, y: 2, label: "B".to_string() };
    p1 == p2
}
'''


[[test]]
name = "dataclass_hash_frozen"
description = "frozen=True makes hashable"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

def test_dataclass_hash_frozen() -> int:
    p = Point(1, 2)
    return hash(p)
'''

rust = '''
use std::collections::hash_map::DefaultHasher;
use std::hash::{Hash, Hasher};

#[derive(Debug, Hash, PartialEq, Eq)]
struct Point {
    x: i32,
    y: i32,
}

pub fn test_dataclass_hash_frozen() -> u64 {
    let p = Point { x: 1, y: 2 };
    let mut hasher = DefaultHasher::new();
    p.hash(&mut hasher);
    hasher.finish()
}
'''


