# =============================================================================
# asdict and astuple
# =============================================================================

[[test]]
name = "dataclass_asdict"
description = "dataclasses.asdict(instance)"

python = '''
from dataclasses import dataclass, asdict

@dataclass
class Point:
    x: int
    y: int

def test_dataclass_asdict() -> int:
    p = Point(1, 2)
    d = asdict(p)
    return d['x']
'''

rust = '''
use std::collections::HashMap;

#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn as_dict(&self) -> HashMap<String, i32> {
        let mut map = HashMap::new();
        map.insert("x".to_string(), self.x);
        map.insert("y".to_string(), self.y);
        map
    }
}

pub fn test_dataclass_asdict() -> i32 {
    let p = Point { x: 1, y: 2 };
    let d = p.as_dict();
    *d.get("x").unwrap()
}
'''


[[test]]
name = "dataclass_astuple"
description = "dataclasses.astuple(instance)"

python = '''
from dataclasses import dataclass, astuple

@dataclass
class Point:
    x: int
    y: int

def test_dataclass_astuple() -> tuple:
    p = Point(1, 2)
    return astuple(p)
'''

rust = '''
#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn as_tuple(&self) -> (i32, i32) {
        (self.x, self.y)
    }
}

pub fn test_dataclass_astuple() -> (i32, i32) {
    let p = Point { x: 1, y: 2 };
    p.as_tuple()
}
'''


[[test]]
name = "dataclass_nested_convert"
description = "asdict with nested dataclasses"

python = '''
from dataclasses import dataclass, asdict

@dataclass
class Point:
    x: int
    y: int

@dataclass
class Line:
    start: Point
    end: Point

def test_dataclass_nested_convert() -> int:
    line = Line(Point(0, 0), Point(1, 1))
    d = asdict(line)
    return d['start']['x']
'''

rust = '''
use std::collections::HashMap;

#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}

#[derive(Debug)]
struct Line {
    start: Point,
    end: Point,
}

pub fn test_dataclass_nested_convert() -> i32 {
    let line = Line {
        start: Point { x: 0, y: 0 },
        end: Point { x: 1, y: 1 },
    };
    line.start.x
}
'''


[[test]]
name = "dataclass_dict_factory"
description = "asdict(obj, dict_factory=OrderedDict)"

python = '''
from dataclasses import dataclass, asdict
from collections import OrderedDict

@dataclass
class Point:
    x: int
    y: int

def test_dataclass_dict_factory() -> int:
    p = Point(1, 2)
    d = asdict(p, dict_factory=OrderedDict)
    return len(d)
'''

rust = '''
use indexmap::IndexMap;

#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn as_ordered_dict(&self) -> IndexMap<String, i32> {
        let mut map = IndexMap::new();
        map.insert("x".to_string(), self.x);
        map.insert("y".to_string(), self.y);
        map
    }
}

pub fn test_dataclass_dict_factory() -> usize {
    let p = Point { x: 1, y: 2 };
    let d = p.as_ordered_dict();
    d.len()
}
'''


