[[test]]
name = "dunder_bool"
skip = true
description = "def __bool__(self): return bool_value"
python = """
class Container:
    def __init__(self, items):
        self.items = items
    
    def __bool__(self):
        return len(self.items) > 0

c1 = Container([1, 2, 3])
c2 = Container([])
print(bool(c1))
print(bool(c2))
"""
rust = """
struct Container {
    items: Vec<i32>,
}

impl Container {
    fn new(items: Vec<i32>) -> Self {
        Container { items }
    }

    fn to_bool(&self) -> bool {
        !self.items.is_empty()
    }
}

let c1 = Container::new(vec![1, 2, 3]);
let c2 = Container::new(vec![]);
log::info!("{}", c1.to_bool());
log::info!("{}", c2.to_bool());"""
expected_output = """True
False"""

