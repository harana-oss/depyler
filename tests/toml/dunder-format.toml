// This would be caught at compile time
log::info!("TypeError: __bool__ should return bool, returned str");"""
expected_output = "TypeError: __bool__ should return bool, returned str"

[[test]]
name = "format_spec_parse"
skip = true
description = "Parsing complex format specifications"
python = """
class Styled:
    def __init__(self, text):
        self.text = text
    
    def __format__(self, spec):
        # Parse spec like: 'u' (upper), 'l' (lower), 't' (title)
        if 'u' in spec:
            return self.text.upper()
        elif 'l' in spec:
            return self.text.lower()
        elif 't' in spec:
            return self.text.title()
        return self.text

s = Styled("hello world")
print(f"{s}")
print(f"{s:u}")
print(f"{s:l}")
print(f"{s:t}")
"""
rust = """
struct Styled {
    text: String,
}

impl Styled {
    fn new(text: &str) -> Self {
        Styled {
            text: text.to_string(),
        }
    }

    fn format_spec(&self, spec: &str) -> String {
        if spec.contains('u') {
            self.text.to_uppercase()
        } else if spec.contains('l') {
            self.text.to_lowercase()
        } else if spec.contains('t') {
            // Title case approximation
            self.text
                .split_whitespace()
                .map(|word| {
                    let mut chars = word.chars();
                    match chars.next() {
                        Some(first) => first.to_uppercase().collect::<String>() + chars.as_str(),
                        None => String::new(),
                    }
                })
                .collect::<Vec<_>>()
                .join(" ")
        } else {
            self.text.clone()
        }
    }
}

let s = Styled::new("hello world");
log::info!("{}", s.format_spec(""));
log::info!("{}", s.format_spec("u"));
log::info!("{}", s.format_spec("l"));
log::info!("{}", s.format_spec("t"));"""
