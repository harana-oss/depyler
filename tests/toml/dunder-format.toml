[[test]]
name = "bool_default"
skip = true
description = "Without __bool__ or __len__, always True"
python = """
class Thing:
    def __init__(self, value):
        self.value = value
    # No __bool__ or __len__ defined

thing = Thing(42)
print(bool(thing))

thing2 = Thing(0)
print(bool(thing2))
"""
rust = """
struct Thing {
    value: i32,
}

impl Thing {
    fn new(value: i32) -> Self {
        Thing { value }
    }
}

let thing = Thing::new(42);
// In Rust, we need to explicitly define what "truthy" means
// Python objects without __bool__ or __len__ are always True
log::info!("True");

let thing2 = Thing::new(0);
log::info!("True");"""
expected_output = """True
True"""

