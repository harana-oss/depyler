[metadata]
name = "Dunder Format Tests"
category = "dunder-methods"

# =============================================================================
# __format__
# =============================================================================

[[test]]
name = "dunder_format"
skip = true
description = "def __format__(self, spec): return formatted_string"
python = """
class Point:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def __format__(self, spec):
        if spec == 'polar':
            import math
            r = math.sqrt(self.x**2 + self.y**2)
            theta = math.atan2(self.y, self.x)
            return f"({r:.2f}, {theta:.2f})"
        return f"({self.x}, {self.y})"

p = Point(3, 4)
print(format(p))
print(format(p, 'polar'))
"""
rust = """
use std::fmt;

struct Point {
    x: f64,
    y: f64,
}

impl Point {
    fn new(x: f64, y: f64) -> Self {
        Point { x, y }
    }
}

impl fmt::Display for Point {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "({}, {})", self.x, self.y)
    }
}

let p = Point::new(3.0, 4.0);
log::info!("{}", p);
// Polar format would require custom implementation
let r = (p.x.powi(2) + p.y.powi(2)).sqrt();
let theta = p.y.atan2(p.x);
log::info!("({:.2}, {:.2})", r, theta);"""
expected_output = """(3, 4)
(5.00, 0.93)"""

[[test]]
name = "format_builtin"
skip = true
description = "format(obj, spec) calls obj.__format__(spec)"
python = """
class Temperature:
    def __init__(self, celsius):
        self.celsius = celsius
    
    def __format__(self, spec):
        if spec == 'F':
            return f"{self.celsius * 9/5 + 32:.1f}°F"
        elif spec == 'K':
            return f"{self.celsius + 273.15:.1f}K"
        return f"{self.celsius:.1f}°C"

temp = Temperature(25)
print(format(temp))
print(format(temp, 'F'))
print(format(temp, 'K'))
"""
rust = """
use std::fmt;

struct Temperature {
    celsius: f64,
}

impl Temperature {
    fn new(celsius: f64) -> Self {
        Temperature { celsius }
    }

    fn format_spec(&self, spec: &str) -> String {
        match spec {
            "F" => format!("{:.1}°F", self.celsius * 9.0 / 5.0 + 32.0),
            "K" => format!("{:.1}K", self.celsius + 273.15),
            _ => format!("{:.1}°C", self.celsius),
        }
    }
}

let temp = Temperature::new(25.0);
log::info!("{}", temp.format_spec(""));
log::info!("{}", temp.format_spec("F"));
log::info!("{}", temp.format_spec("K"));"""
expected_output = """25.0°C
77.0°F
298.2K"""

[[test]]
name = "fstring_format"
skip = true
description = "f'{obj:spec}' calls __format__"
python = """
class Money:
    def __init__(self, amount):
        self.amount = amount
    
    def __format__(self, spec):
        if spec == 'USD':
            return f"${self.amount:.2f}"
        elif spec == 'EUR':
            return f"€{self.amount:.2f}"
        return f"{self.amount:.2f}"

m = Money(42.5)
print(f"{m}")
print(f"{m:USD}")
print(f"{m:EUR}")
"""
rust = """
struct Money {
    amount: f64,
}

impl Money {
    fn new(amount: f64) -> Self {
        Money { amount }
    }

    fn format_spec(&self, spec: &str) -> String {
        match spec {
            "USD" => format!("${:.2}", self.amount),
            "EUR" => format!("€{:.2}", self.amount),
            _ => format!("{:.2}", self.amount),
        }
    }
}

let m = Money::new(42.5);
log::info!("{}", m.format_spec(""));
log::info!("{}", m.format_spec("USD"));
log::info!("{}", m.format_spec("EUR"));"""
expected_output = """42.50
$42.50
€42.50"""

[[test]]
name = "format_empty_spec"
skip = true
description = "__format__('') default formatting"
python = """
class Person:
    def __init__(self, name):
        self.name = name
    
    def __format__(self, spec):
        if not spec:
            return self.name
        return f"Person({self.name})"

p = Person("Alice")
print(f"{p}")
print(f"{p:full}")
"""
rust = """
struct Person {
    name: String,
}

impl Person {
    fn new(name: &str) -> Self {
        Person {
            name: name.to_string(),
        }
    }

    fn format_spec(&self, spec: &str) -> String {
        if spec.is_empty() {
            self.name.clone()
        } else {
            format!("Person({})", self.name)
        }
    }
}

let p = Person::new("Alice");
log::info!("{}", p.format_spec(""));
log::info!("{}", p.format_spec("full"));"""
expected_output = """Alice
Person(Alice)"""

