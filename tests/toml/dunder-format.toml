[[test]]
name = "dunder_sizeof"
skip = true
description = "def __sizeof__(self): return size_in_bytes"
python = """
class CustomObject:
    def __init__(self, data):
        self.data = data
    
    def __sizeof__(self):
        import sys
        return object.__sizeof__(self) + sys.getsizeof(self.data)

obj = CustomObject([1, 2, 3, 4, 5])
print(f"Size: {obj.__sizeof__()} bytes")
"""
rust = """
// In Rust, we use std::mem::size_of for compile-time size
// and can implement a sizeof method for runtime estimation
struct CustomObject {
    data: Vec<i32>,
}

impl CustomObject {
    fn new(data: Vec<i32>) -> Self {
        CustomObject { data }
    }

    fn sizeof(&self) -> usize {
        std::mem::size_of::<Self>() + self.data.len() * std::mem::size_of::<i32>()
    }
}

let obj = CustomObject::new(vec![1, 2, 3, 4, 5]);
log::info!("Size: {} bytes", obj.sizeof());"""
expected_output = "Size: 44 bytes"

[[test]]
name = "getsizeof"
skip = true
description = "sys.getsizeof(obj) uses __sizeof__"
python = """
import sys

class Buffer:
    def __init__(self, size):
        self.data = bytearray(size)
    
    def __sizeof__(self):
        return object.__sizeof__(self) + len(self.data)

buf = Buffer(1024)
print(f"Buffer size: {sys.getsizeof(buf)} bytes")
"""
rust = """
// In Rust, we estimate size similarly
struct Buffer {
    data: Vec<u8>,
}

impl Buffer {
    fn new(size: usize) -> Self {
        Buffer {
            data: vec![0; size],
        }
    }

    fn sizeof(&self) -> usize {
        std::mem::size_of::<Self>() + self.data.len()
    }
}

let buf = Buffer::new(1024);
log::info!("Buffer size: {} bytes", buf.sizeof());"""
expected_output = "Buffer size: 1048 bytes"

