[[test]]
name = "format_custom_spec"
skip = true
description = "Custom format specification language"
python = """
class Color:
    def __init__(self, r, g, b):
        self.r = r
        self.g = g
        self.b = b
    
    def __format__(self, spec):
        if spec == 'hex':
            return f"#{self.r:02x}{self.g:02x}{self.b:02x}"
        elif spec == 'rgb':
            return f"rgb({self.r}, {self.g}, {self.b})"
        return f"Color({self.r}, {self.g}, {self.b})"

c = Color(255, 128, 64)
print(f"{c}")
print(f"{c:hex}")
print(f"{c:rgb}")
"""
rust = """
struct Color {
    r: u8,
    g: u8,
    b: u8,
}

impl Color {
    fn new(r: u8, g: u8, b: u8) -> Self {
        Color { r, g, b }
    }

    fn format_spec(&self, spec: &str) -> String {
        match spec {
            "hex" => format!("#{:02x}{:02x}{:02x}", self.r, self.g, self.b),
            "rgb" => format!("rgb({}, {}, {})", self.r, self.g, self.b),
            _ => format!("Color({}, {}, {})", self.r, self.g, self.b),
        }
    }
}

let c = Color::new(255, 128, 64);
log::info!("{}", c.format_spec(""));
log::info!("{}", c.format_spec("hex"));
log::info!("{}", c.format_spec("rgb"));"""
expected_output = """Color(255, 128, 64)
#ff8040
rgb(255, 128, 64)"""

[[test]]
name = "format_width"
skip = true
description = "f'{obj:>10}' right align with width"
python = """
class Item:
    def __init__(self, value):
        self.value = value
    
    def __format__(self, spec):
        result = str(self.value)
        if spec:
            return format(result, spec)
        return result

item = Item(42)
print(f"'{item:>10}'")
print(f"'{item:<10}'")
print(f"'{item:^10}'")
"""
rust = """
struct Item {
    value: i32,
}

impl Item {
    fn new(value: i32) -> Self {
        Item { value }
    }
}

let item = Item::new(42);
log::info!("'{:>10}'", item.value);
log::info!("'{:<10}'", item.value);
log::info!("'{:^10}'", item.value);"""
expected_output = """'        42'
'42        '
'    42    '"""

[[test]]
name = "format_fill"
skip = true
description = "f'{obj:*^10}' fill with *"
python = """
class Label:
    def __init__(self, text):
        self.text = text
    
    def __format__(self, spec):
        if spec:
            return format(self.text, spec)
        return self.text

label = Label("Hi")
print(f"{label:*^10}")
print(f"{label:=>10}")
print(f"{label:-<10}")
"""
rust = """
let label = "Hi";
// Rust's formatting doesn't support custom fill characters as easily
// Manual implementation:
let width = 10;
let len = label.len();
let padding = width.saturating_sub(len);

// Center with *
let left = padding / 2;
let right = padding - left;
log::info!("{}{}{}", "*".repeat(left), label, "*".repeat(right));

// Right align with =
log::info!("{}{}", "=".repeat(padding), label);

// Left align with -
log::info!("{}{}", label, "-".repeat(padding));"""
expected_output = """****Hi****
========Hi
Hi--------"""

