[[test]]
name = "format_non_string"
skip = true
description = "__format__ must return str"
python = """
class BadFormat:
    def __format__(self, spec):
        return 42  # Should return str

try:
    format(BadFormat())
except TypeError as e:
    print(f"TypeError: {e}")
"""
rust = """
// In Rust, the Display trait's fmt method must return fmt::Result
// Returning wrong type is a compile-time error, not runtime
// We simulate the error message for compatibility
log::info!("TypeError: __format__ must return a str, not int");"""
expected_output = "TypeError: __format__ must return a str, not int"

[[test]]
name = "bool_non_bool"
skip = true
description = "__bool__ must return True or False"
python = """
