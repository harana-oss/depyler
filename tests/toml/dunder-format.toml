[[test]]
name = "dunder_bytes"
skip = true
description = "def __bytes__(self): return bytes(...)"
python = """
class Message:
    def __init__(self, text):
        self.text = text
    
    def __bytes__(self):
        return self.text.encode('utf-8')

msg = Message("Hello")
b = bytes(msg)
print(b)
print(type(b).__name__)
"""
rust = """
struct Message {
    text: String,
}

impl Message {
    fn new(text: &str) -> Self {
        Message {
            text: text.to_string(),
        }
    }

    fn to_bytes(&self) -> Vec<u8> {
        self.text.as_bytes().to_vec()
    }
}

let msg = Message::new("Hello");
let b = msg.to_bytes();
log::info!("{:?}", b);
log::info!("Vec");"""
expected_output = """b'Hello'
bytes"""

[[test]]
name = "bytes_builtin"
skip = true
description = "bytes(obj) calls obj.__bytes__()"
python = """
class Data:
    def __init__(self, values):
        self.values = values
    
    def __bytes__(self):
        return bytes(self.values)

data = Data([72, 101, 108, 108, 111])
print(bytes(data))
print(bytes(data).decode('utf-8'))
"""
rust = """
struct Data {
    values: Vec<u8>,
}

impl Data {
    fn new(values: Vec<u8>) -> Self {
        Data { values }
    }

    fn to_bytes(&self) -> Vec<u8> {
        self.values.clone()
    }
}

let data = Data::new(vec![72, 101, 108, 108, 111]);
let b = data.to_bytes();
log::info!("{:?}", b);
log::info!("{}", String::from_utf8(b.clone()).unwrap());"""
expected_output = """b'Hello'
Hello"""

[[test]]
name = "bytes_serialization"
skip = true
description = "Convert object to bytes representation"
python = """
class Packet:
    def __init__(self, type_id, data):
        self.type_id = type_id
        self.data = data
    
    def __bytes__(self):
        # Simple serialization: type (1 byte) + length (2 bytes) + data
        data_bytes = self.data.encode('utf-8')
        length = len(data_bytes)
        return bytes([self.type_id]) + length.to_bytes(2, 'big') + data_bytes

packet = Packet(1, "test")
b = bytes(packet)
print(b)
print(len(b))
"""
rust = """
struct Packet {
    type_id: u8,
    data: String,
}

impl Packet {
    fn new(type_id: u8, data: &str) -> Self {
        Packet {
            type_id,
            data: data.to_string(),
        }
    }

    fn to_bytes(&self) -> Vec<u8> {
        let data_bytes = self.data.as_bytes();
        let length = data_bytes.len() as u16;
        let mut result = vec![self.type_id];
        result.extend_from_slice(&length.to_be_bytes());
        result.extend_from_slice(data_bytes);
        result
    }
}

let packet = Packet::new(1, "test");
let b = packet.to_bytes();
log::info!("{:?}", b);
log::info!("{}", b.len());"""
expected_output = """b'\\x01\\x00\\x04test'
7"""

