[[test]]
name = "format_number"
skip = true
description = "Custom numeric type with format spec"
python = """
class Fraction:
    def __init__(self, numerator, denominator):
        self.num = numerator
        self.den = denominator
    
    def __format__(self, spec):
        if spec == 'dec':
            return f"{self.num / self.den:.2f}"
        elif spec == 'perc':
            return f"{100 * self.num / self.den:.1f}%"
        return f"{self.num}/{self.den}"

f = Fraction(3, 4)
print(f"{f}")
print(f"{f:dec}")
print(f"{f:perc}")
"""
rust = """
struct Fraction {
    num: i32,
    den: i32,
}

impl Fraction {
    fn new(num: i32, den: i32) -> Self {
        Fraction { num, den }
    }

    fn format_spec(&self, spec: &str) -> String {
        match spec {
            "dec" => format!("{:.2}", self.num as f64 / self.den as f64),
            "perc" => format!("{:.1}%", 100.0 * self.num as f64 / self.den as f64),
            _ => format!("{}/{}", self.num, self.den),
        }
    }
}

let f = Fraction::new(3, 4);
log::info!("{}", f.format_spec(""));
log::info!("{}", f.format_spec("dec"));
log::info!("{}", f.format_spec("perc"));"""
expected_output = """3/4
0.75
75.0%"""

[[test]]
name = "format_datetime"
skip = true
description = "f'{dt:%Y-%m-%d}' style formatting"
python = """
from datetime import datetime

class CustomDate:
    def __init__(self, year, month, day):
        self.dt = datetime(year, month, day)
    
    def __format__(self, spec):
        if not spec:
            return str(self.dt)
        return self.dt.strftime(spec)

d = CustomDate(2025, 12, 10)
print(f"{d:%Y-%m-%d}")
print(f"{d:%B %d, %Y}")
"""
rust = """
use chrono::NaiveDate;

struct CustomDate {
    dt: NaiveDate,
}

impl CustomDate {
    fn new(year: i32, month: u32, day: u32) -> Self {
        CustomDate {
            dt: NaiveDate::from_ymd_opt(year, month, day).unwrap(),
        }
    }

    fn format_spec(&self, spec: &str) -> String {
        if spec.is_empty() {
            self.dt.to_string()
        } else {
            self.dt.format(spec).to_string()
        }
    }
}

let d = CustomDate::new(2025, 12, 10);
log::info!("{}", d.format_spec("%Y-%m-%d"));
log::info!("{}", d.format_spec("%B %d, %Y"));"""
expected_output = """2025-12-10
December 10, 2025"""

