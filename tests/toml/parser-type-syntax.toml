# =============================================================================
# Type Aliases
# =============================================================================

[[test]]
name = "simple_alias"
description = "Simple type alias"
python = '''
from typing import get_type_hints

Vector = list[float]

def scale(v: Vector, factor: float) -> Vector:
    return [x * factor for x in v]

hints = get_type_hints(scale)
assert hints["v"] == list[float]
'''

# =============================================================================
# Self Type (PEP 673)
# =============================================================================

[[test]]
name = "self_in_method"
description = "Self type in method return"
python = '''
from typing import Self

class Builder:
    def add(self, x: int) -> Self:
        return self

b = Builder()
result = b.add(1)
assert isinstance(result, Builder)
'''

# =============================================================================
# TypeGuard (PEP 647)
# =============================================================================

[[test]]
name = "typeguard_basic"
description = "TypeGuard narrows type"
python = '''
from typing import TypeGuard

def is_str_list(val: list[object]) -> TypeGuard[list[str]]:
    return all(isinstance(x, str) for x in val)

data: list[object] = ["a", "b", "c"]
if is_str_list(data):
    result = data[0].upper()
    assert result == "A"
'''

# =============================================================================
# Literal Type
# =============================================================================

[[test]]
name = "literal_string"
description = "Literal with strings"
python = '''
from typing import Literal

def process(mode: Literal["read", "write"]) -> str:
    return mode

assert process("read") == "read"
'''

[[test]]
name = "literal_int"
description = "Literal with integers"
python = '''
from typing import Literal

def get_priority(level: Literal[1, 2, 3]) -> str:
    return ["low", "medium", "high"][level - 1]

assert get_priority(1) == "low"
'''

