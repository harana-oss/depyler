# Type Syntax Tests
# Migrated from tests/python/parser/test_type_syntax.py
# Tests PEP 604 unions (X | Y), typing.Annotated, type statements (3.12+).
# These verify the parser accepts modern syntax and preserves semantics.

[metadata]
name = "Type Syntax Tests"
category = "parser"

# =============================================================================
# PEP 604 Union Syntax (X | Y)
# =============================================================================

[[test]]
name = "union_type_hint"
description = "X | Y in type hints"
python = '''
from typing import get_type_hints

def func(x: int | str) -> int | str:
    return x

hints = get_type_hints(func)
assert hints["x"] == int | str
assert hints["return"] == int | str
'''

[[test]]
name = "union_with_none"
description = "X | None is equivalent to Optional[X]"
python = '''
from typing import get_type_hints

def func(x: int | None) -> int | None:
    return x

hints = get_type_hints(func)
assert hints["x"] == int | None
'''

[[test]]
name = "union_multiple"
description = "Multiple types in union"
python = '''
from typing import get_type_hints

def func(x: int | str | float | None) -> int | str | float | None:
    return x

hints = get_type_hints(func)
assert hints["x"] == int | str | float | None
'''

[[test]]
name = "union_isinstance"
description = "isinstance with union type"
python = '''
assert isinstance(42, int | str)
assert isinstance("hello", int | str)
assert not isinstance(3.14, int | str)
'''

# =============================================================================
# typing.Annotated
# =============================================================================

[[test]]
name = "annotated_basic"
description = "Annotated preserves base type"
python = '''
from typing import Annotated, get_type_hints

def func(x: Annotated[int, "positive"]) -> int:
    return x

hints = get_type_hints(func)
assert hints["x"] == int
'''

[[test]]
name = "annotated_metadata"
description = "Annotated metadata access"
python = '''
from typing import Annotated, get_type_hints

def func(x: Annotated[int, "metadata1", "metadata2"]) -> int:
    return x

hints = get_type_hints(func, include_extras=True)
ann = hints["x"]
if hasattr(ann, "__origin__") and ann.__origin__ is not int:
    assert ann.__origin__ is Annotated
    assert ann.__metadata__ == ("metadata1", "metadata2")
'''

# =============================================================================
# Generic Syntax
# =============================================================================

[[test]]
name = "list_generic"
description = "list[int] syntax"
python = '''
from typing import get_type_hints

def func(x: list[int]) -> list[int]:
    return x

hints = get_type_hints(func)
assert hints["x"] == list[int]
'''

[[test]]
name = "dict_generic"
description = "dict[K, V] syntax"
python = '''
from typing import get_type_hints

def func(x: dict[str, int]) -> dict[str, int]:
    return x

hints = get_type_hints(func)
assert hints["x"] == dict[str, int]
'''

[[test]]
name = "nested_generic"
description = "Nested generic types"
python = '''
from typing import get_type_hints

def func(x: list[dict[str, list[int]]]) -> None:
    pass

hints = get_type_hints(func)
assert hints["x"] == list[dict[str, list[int]]]
'''

[[test]]
name = "tuple_generic"
description = "tuple[...] syntax"
python = '''
from typing import get_type_hints

def func(x: tuple[int, str, float]) -> tuple[int, ...]:
    return (1,)

hints = get_type_hints(func)
assert hints["x"] == tuple[int, str, float]
assert hints["return"] == tuple[int, ...]
'''

