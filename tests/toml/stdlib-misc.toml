# Miscellaneous Standard Library Tests - uuid, urllib, statistics, shlex, textwrap

[metadata]
name = "Miscellaneous Stdlib Tests"
category = "stdlib-misc"

# =============================================================================
# uuid Module
# =============================================================================

[[test]]
name = "uuid_uuid1"
description = "uuid.uuid1() time-based UUID"
tags = ["uuid", "v1"]

[test.python]
code = '''
import uuid

def generate_uuid1() -> str:
    return uuid.uuid1()
'''

[test.assertions]
contains_any = [["uuid", "Uuid"]]
contains = ["to_string"]

[[test]]
name = "uuid_uuid4"
description = "uuid.uuid4() random UUID"
tags = ["uuid", "v4"]

[test.python]
code = '''
import uuid

def generate_uuid4() -> str:
    return uuid.uuid4()
'''

[test.assertions]
contains_any = [["uuid", "Uuid"]]
contains_any = [["new_v4", "v4"]]

[[test]]
name = "uuid_uuid3"
description = "uuid.uuid3() MD5 hash UUID"
tags = ["uuid", "v3"]

[test.python]
code = '''
import uuid

def generate_uuid3(namespace: uuid.UUID, name: str) -> str:
    return str(uuid.uuid3(namespace, name))
'''

[test.assertions]
contains_any = [["uuid", "Uuid"]]

[[test]]
name = "uuid_uuid5"
description = "uuid.uuid5() SHA1 hash UUID"
tags = ["uuid", "v5"]

[test.python]
code = '''
import uuid

def generate_uuid5(namespace: uuid.UUID, name: str) -> str:
    return str(uuid.uuid5(namespace, name))
'''

[test.assertions]
contains_any = [["uuid", "Uuid"]]

# =============================================================================
# urllib.parse Module
# =============================================================================

[[test]]
name = "urlparse"
description = "urlparse() parse URL"
tags = ["urllib", "parse"]

[test.python]
code = '''
from urllib.parse import urlparse

def parse_url(url: str) -> tuple:
    result = urlparse(url)
    return (result.scheme, result.netloc, result.path)
'''

[test.assertions]
contains_any = [["parse", "url"]]

[[test]]
name = "quote"
description = "quote() URL encoding"
tags = ["urllib", "encode"]

[test.python]
code = '''
from urllib.parse import quote

def encode_url(text: str) -> str:
    return quote(text)
'''

[test.assertions]
contains_any = [["percent_encoding", "utf8_percent_encode", "encode"]]

[[test]]
name = "unquote"
description = "unquote() URL decoding"
tags = ["urllib", "decode"]

[test.python]
code = '''
from urllib.parse import unquote

def decode_url(text: str) -> str:
    return unquote(text)
'''

[test.assertions]
contains_any = [["percent_decode", "decode_utf8_lossy", "decode"]]

