[[test]]
name = "statistics_mean"
description = "statistics.mean() average"

python = '''
import statistics

def calculate_mean(data: list[float]) -> float:
    return statistics.mean(data)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'statistics'()"]
pub fn calculate_mean(data: &Vec<f64>) -> f64 {
    return {
        let data = data;
        data.iter().map(|&x| x as f64).sum::<f64>() / data.len() as f64
    }
'''

[[test]]
name = "statistics_median"
description = "statistics.median() middle value"

python = '''
import statistics

def calculate_median(data: list[float]) -> float:
    return statistics.median(data)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'statistics'()"]
pub fn calculate_median(data: &Vec<f64>) -> f64 {
    return {
        let mut sorted = data.clone();
        sorted.sort_by(|a, b| a.partial_cmp(b).unwrap());
        let len = sorted.len();
        if len % 2 == 0 {
            let mid = len / 2;
            ((sorted[mid - 1] as f64) + (sorted[mid] as f64)) / 2.0
        } else {
            sorted[len / 2] as f64
        }
    }
'''

[[test]]
name = "statistics_mode"
description = "statistics.mode() most common"

python = '''
import statistics

def calculate_mode(data: list[int]) -> int:
    return statistics.mode(data)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'statistics'()"]
use std::collections::HashMap;
pub fn calculate_mode(data: &Vec<i32>) -> i32 {
    return {
        let mut counts: HashMap<_, usize> = HashMap::new();
        for &item in data.iter() {
            *counts.entry(item).or_insert(0) += 1;
        }
        *counts.iter().max_by_key(|(_, &count)| count).unwrap().0
    };
}
'''

[[test]]
name = "statistics_stdev"
description = "statistics.stdev() standard deviation"

python = '''
import statistics

def calculate_stdev(data: list[float]) -> float:
    return statistics.stdev(data)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'statistics'()"]
pub fn calculate_stdev(data: &Vec<f64>) -> f64 {
    return {
        let data = data;
        let mean = data.iter().map(|&x| x as f64).sum::<f64>() / data.len() as f64;
        let sum_sq_diff: f64 = data
            .iter()
            .map(|&x| {
                let diff = (x as f64) - mean;
                diff * diff
            })
            .sum();
        let variance = sum_sq_diff / ((data.len() - 1) as f64);
        variance.sqrt()
    }
'''

[[test]]
name = "statistics_variance"
description = "statistics.variance() sample variance"

python = '''
import statistics

def calculate_variance(data: list[float]) -> float:
    return statistics.variance(data)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'statistics'()"]
pub fn calculate_variance(data: &Vec<f64>) -> f64 {
    return {
        let data = data;
        let mean = data.iter().map(|&x| x as f64).sum::<f64>() / data.len() as f64;
        let sum_sq_diff: f64 = data
            .iter()
            .map(|&x| {
                let diff = (x as f64) - mean;
                diff * diff
            })
            .sum();
        sum_sq_diff / ((data.len() - 1) as f64)
    }
'''

[[test]]
name = "copy_shallow_copy_list"
description = "copy.copy() should generate clone, not invalid .copy() method"

python = '''
import copy

def test_shallow_copy() -> int:
    original = [1, 2, 3]
    copied = copy.copy(original)
    copied.append(4)
    return len(original)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'copy'()"]
pub fn test_shallow_copy() -> i32 {
    let original = vec![1, 2, 3];
    let mut copied = (original.clone()).clone();
    copied.push(4);
    return original.len() as i32 as i32;
}
'''

[[test]]
name = "copy_shallow_copy_dict"
description = "copy.copy() for dictionaries"

python = '''
import copy

def test_dict_copy() -> int:
    original = {"a": 1, "b": 2}
    copied = copy.copy(original)
    copied["c"] = 3
    return len(original)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'copy'()"]
use std::collections::HashMap;
pub fn test_dict_copy() -> i32 {
    let original = {
        let mut map = HashMap::new();
        map.insert("a".to_string(), 1);
        map.insert("b".to_string(), 2);
        map
    };
    let mut copied = (original.clone()).clone();
    copied.insert("c".to_string(), 3);
    return original.len() as i32 as i32;
}
'''

