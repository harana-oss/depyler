# =============================================================================
# copy Module
# =============================================================================

[[test]]
name = "copy_shallow_copy_list"
description = "copy.copy() should generate clone, not invalid .copy() method"
tags = ["copy", "shallow", "list"]

[test.python]
code = '''
import copy

def test_shallow_copy() -> int:
    original = [1, 2, 3]
    copied = copy.copy(original)
    copied.append(4)
    return len(original)
'''

[test.assertions]
contains = ["fn test_shallow_copy"]
not_contains = [".copy()"]

[[test]]
name = "copy_shallow_copy_dict"
description = "copy.copy() for dictionaries"
tags = ["copy", "shallow", "dict"]

[test.python]
code = '''
import copy

def test_dict_copy() -> int:
    original = {"a": 1, "b": 2}
    copied = copy.copy(original)
    copied["c"] = 3
    return len(original)
'''

[test.assertions]
contains = ["fn test_dict_copy"]

[[test]]
name = "copy_deepcopy_list"
description = "copy.deepcopy() for nested lists"
tags = ["copy", "deep", "list"]

[test.python]
code = '''
import copy

def test_deep_copy() -> int:
    original = [[1, 2], [3, 4]]
    copied = copy.deepcopy(original)
    copied[0].append(5)
    return len(original[0])
'''

[test.assertions]
contains = ["fn test_deep_copy"]
