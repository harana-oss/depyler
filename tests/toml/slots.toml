# __slots__ Edge Cases
# =============================================================================

[[test]]
name = "slots_duplicate"
description = "Duplicate names in __slots__"
python = """
# Python allows this but it's redundant
class Duplicate:
    __slots__ = ['x', 'x']
# The duplicate is ignored
"""

[[test]]
name = "slots_class_attr_conflict"
description = "Class attribute vs slot conflict"
python = """
class Conflict:
    __slots__ = ['x']
    x = 10  # Class attribute
    
    def __init__(self, val):
        self.x = val  # Instance attribute

c = Conflict(20)
print(c.x)  # Instance attribute shadows class attribute
print(Conflict.x)  # Class attribute still accessible
"""
rust = """
struct Conflict {
    x: i32,
}

impl Conflict {
    const CLASS_X: i32 = 10;
    
    fn new(val: i32) -> Self {
        Conflict { x: val }
    }
}

fn main() {
    let c = Conflict::new(20);
    log::info!("{}", c.x);
    log::info!("{}", Conflict::CLASS_X);
}
"""

[[test]]
name = "slots_property"
description = "Property wrapping a slotted attribute"
python = """
class Validated:
    __slots__ = ['_x']
    
    def __init__(self, x):
        self._x = x
    
    @property
    def x(self):
        return self._x
    
    @x.setter
    def x(self, value):
        if value < 0:
            raise ValueError("Must be positive")
        self._x = value

v = Validated(10)
print(v.x)
"""
rust = """
struct Validated {
    x: i32,
}

impl Validated {
    fn new(x: i32) -> Self {
        Validated { x }
    }
    
    fn get_x(&self) -> i32 {
        self.x
    }
    
    fn set_x(&mut self, value: i32) -> Result<(), &str> {
        if value < 0 {
            Err("Must be positive")
        } else {
            self.x = value;
            Ok(())
        }
    }
}

fn main() {
    let v = Validated::new(10);
    log::info!("{}", v.get_x());
}
"""

[[test]]
name = "slots_defaults"
description = "__slots__ doesn't support default values directly"
python = """
class NoDefaults:
    __slots__ = ['x', 'y']
    
    def __init__(self, x=0, y=0):
        self.x = x
        self.y = y

n = NoDefaults()
print(n.x, n.y)
"""
rust = """
struct NoDefaults {
    x: i32,
    y: i32,
}

impl NoDefaults {
    fn new(x: Option<i32>, y: Option<i32>) -> Self {
        NoDefaults { 
            x: x.unwrap_or(0), 
            y: y.unwrap_or(0) 
        }
    }
}

fn main() {
    let n = NoDefaults::new(None, None);
    log::info!("{} {}", n.x, n.y);
}
"""
