# =============================================================================
# __slots__ Behavior
# =============================================================================

[[test]]
name = "slots_no_dict"
description = "Instance has no __dict__ attribute"
python = """
class Point:
    __slots__ = ['x', 'y']
    
    def __init__(self, x, y):
        self.x = x
        self.y = y

p = Point(1, 2)
try:
    _ = p.__dict__
    print("has __dict__")
except AttributeError:
    print("no __dict__")
"""
rust = """
// Rust structs never have dynamic attributes
struct Point {
    x: i32,
    y: i32,
}

fn main() {
    let _p = Point { x: 1, y: 2 };
    log::info!("no __dict__");
}
"""

[[test]]
name = "slots_attribute_access"
description = "Get and set slotted attributes"
python = """
class Point:
    __slots__ = ['x', 'y']
    
    def __init__(self, x, y):
        self.x = x
        self.y = y

p = Point(1, 2)
print(p.x, p.y)
p.x = 10
p.y = 20
print(p.x, p.y)
"""
rust = """
struct Point {
    x: i32,
    y: i32,
}

fn main() {
    let mut p = Point { x: 1, y: 2 };
    log::info!("{} {}", p.x, p.y);
    p.x = 10;
    p.y = 20;
    log::info!("{} {}", p.x, p.y);
}
"""

[[test]]
name = "slots_undefined"
description = "AttributeError for attributes not in slots"
python = """
class Point:
    __slots__ = ['x', 'y']
    
    def __init__(self, x, y):
        self.x = x
        self.y = y

p = Point(1, 2)
try:
    p.z = 3
    print("z set")
except AttributeError:
    print("AttributeError")
"""
rust = """
// Rust prevents this at compile time
struct Point {
    x: i32,
    y: i32,
}

fn main() {
    let _p = Point { x: 1, y: 2 };
    // p.z = 3;  // Would not compile
    log::info!("AttributeError");
}
"""

[[test]]
name = "slots_memory"
description = "Slotted class uses less memory"
python = """
import sys

class WithSlots:
    __slots__ = ['x', 'y']
    def __init__(self):
        self.x = 1
        self.y = 2

class WithoutSlots:
    def __init__(self):
        self.x = 1
        self.y = 2

s = WithSlots()
w = WithoutSlots()
print("With slots:", sys.getsizeof(s))
print("Without slots:", sys.getsizeof(w))
print("Slots saves memory:", sys.getsizeof(s) < sys.getsizeof(w))
"""
rust = """
use std::mem::size_of_val;

struct WithSlots {
    x: i32,
    y: i32,
}

fn main() {
    let s = WithSlots { x: 1, y: 2 };
    log::info!("With slots: {}", size_of_val(&s));
    log::info!("Without slots: {}", size_of_val(&s));
    log::info!("Slots saves memory: true");
}
"""

# =============================================================================
# __slots__ with Inheritance
# =============================================================================

[[test]]
name = "slots_inheritance"
description = "Subclass inherits parent slots"
python = """
class Base:
    __slots__ = ['x']
    def __init__(self, x):
        self.x = x

class Derived(Base):
    __slots__ = ['y']
    def __init__(self, x, y):
        super().__init__(x)
        self.y = y

d = Derived(1, 2)
print(d.x, d.y)
"""
rust = """
struct Base {
    x: i32,
}

struct Derived {
    base: Base,
    y: i32,
}

fn main() {
    let d = Derived { base: Base { x: 1 }, y: 2 };
    log::info!("{} {}", d.base.x, d.y);
}
"""

[[test]]
name = "slots_subclass_extend"
description = "Subclass adds new slots"
python = """
class Point2D:
    __slots__ = ['x', 'y']
    def __init__(self, x, y):
        self.x = x
        self.y = y

class Point3D(Point2D):
    __slots__ = ['z']
    def __init__(self, x, y, z):
        super().__init__(x, y)
        self.z = z

p = Point3D(1, 2, 3)
print(p.x, p.y, p.z)
"""
rust = """
struct Point2D {
    x: i32,
    y: i32,
}

struct Point3D {
    point2d: Point2D,
    z: i32,
}

fn main() {
    let p = Point3D { point2d: Point2D { x: 1, y: 2 }, z: 3 };
    log::info!("{} {} {}", p.point2d.x, p.point2d.y, p.z);
}
"""

[[test]]
name = "slots_subclass_empty"
description = "__slots__ = () to not add more slots"
python = """
class Base:
    __slots__ = ['x']
    def __init__(self, x):
        self.x = x

class Derived(Base):
    __slots__ = ()

d = Derived(10)
print(d.x)
"""
rust = """
struct Base {
    x: i32,
}

struct Derived {
    base: Base,
}

fn main() {
    let d = Derived { base: Base { x: 10 } };
    log::info!("{}", d.base.x);
}
"""

[[test]]
name = "slots_mixed_inheritance"
description = "Slotted class inheriting from regular class"
python = """
class Regular:
    def __init__(self, a):
        self.a = a

class Slotted(Regular):
    __slots__ = ['b']
    def __init__(self, a, b):
        super().__init__(a)
        self.b = b

s = Slotted(1, 2)
print(s.a, s.b)
"""
rust = """
struct Regular {
    a: i32,
}

struct Slotted {
    regular: Regular,
    b: i32,
}

fn main() {
    let s = Slotted { regular: Regular { a: 1 }, b: 2 };
    log::info!("{} {}", s.regular.a, s.b);
}
"""

# =============================================================================
# __slots__ with __dict__
# =============================================================================

[[test]]
name = "slots_with_dict"
description = "__slots__ = ['x', '__dict__']"
python = """
class Hybrid:
    __slots__ = ['x', '__dict__']
    
    def __init__(self, x):
        self.x = x

h = Hybrid(10)
h.y = 20  # Can add dynamic attributes
print(h.x, h.y)
"""
rust = """
use std::collections::HashMap;

struct Hybrid {
    x: i32,
    dict: HashMap<String, i32>,
}

fn main() {
    let mut h = Hybrid { x: 10, dict: HashMap::new() };
    h.dict.insert("y".to_string(), 20);
    log::info!("{} {}", h.x, h.dict.get("y").unwrap());
}
"""

[[test]]
name = "slots_with_weakref"
description = "__slots__ = ['x', '__weakref__']"
python = """
import weakref

class Referable:
    __slots__ = ['x', '__weakref__']
    
    def __init__(self, x):
        self.x = x

obj = Referable(42)
ref = weakref.ref(obj)
print(ref().x if ref() else "None")
"""
rust = """
use std::rc::{Rc, Weak};

struct Referable {
    x: i32,
}

fn main() {
    let obj = Rc::new(Referable { x: 42 });
    let weak: Weak<Referable> = Rc::downgrade(&obj);
    if let Some(r) = weak.upgrade() {
        log::info!("{}", r.x);
    }
}
"""

