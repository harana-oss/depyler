[metadata]
name = "__slots__ Tests"
category = "advanced-oop"

# =============================================================================
# Basic __slots__
# =============================================================================

[[test]]
name = "slots_basic"
description = "__slots__ = ['x', 'y']"
python = """
class Point:
    __slots__ = ['x', 'y']
    
    def __init__(self, x, y):
        self.x = x
        self.y = y

p = Point(1, 2)
print(p.x, p.y)
"""
rust = """
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn new(x: i32, y: i32) -> Self {
        Point { x, y }
    }
}

fn main() {
    let p = Point::new(1, 2);
    log::info!("{} {}", p.x, p.y);
}
"""

