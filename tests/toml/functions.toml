[[test]]
name = "email_validation_function"
description = "Email validation with string checks"
tags = ["function", "validation", "property-based"]
compile_check = true

[test.python]
code = '''
def is_valid_email(email: str) -> bool:
    if "@" not in email:
        return False
    parts = email.split("@")
    if len(parts) != 2:
        return False
    local = parts[0]
    domain = parts[1]
    return len(local) > 0 and len(domain) > 0 and "." in domain
'''

[test.assertions]
contains = ["fn is_valid_email"]

