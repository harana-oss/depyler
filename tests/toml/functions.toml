python = '''
def fibonacci_iterative(n: int) -> int:
    """Calculate nth Fibonacci number."""
    if n <= 1:
        return n
    a = 0
    b = 1
    for i in range(2, n + 1):
        c = a + b
        a = b
        b = c
    return b

def main():
    """Run benchmark - NO RETURN TYPE."""
    limits = [25, 30, 35]
    for limit in limits:
        result = fibonacci_iterative(limit)
        print(result)
'''

rust = '''
#[doc = "Calculate nth Fibonacci number."]
pub fn fibonacci_iterative(n: i32) -> i32 {
        if n <= 1 {
        return n;
    }
    let mut a = 0;
    let mut b = 1;
    for _i in 2..n + 1 {
        let c = a + b;
        a = b;
        b = c;
    }
    return b;
}
#[doc = "Run benchmark - NO RETURN TYPE."]
pub fn main() {
    let limits = vec![25, 30, 35];
    for limit in limits.iter().cloned() {
        let result = fibonacci_iterative(limit);
        log::info!("{}", result);
    }
}
'''

