name = "bubble_sort_function"
description = "Sorting function with nested loops"
tags = ["function", "sorting", "property-based"]
compile_check = true

[test.python]
code = '''
def bubble_sort(arr: list[int]) -> list[int]:
    n = len(arr)
    for i in range(n):
        for j in range(0, n-i-1):
            if arr[j] > arr[j+1]:
                arr[j], arr[j+1] = arr[j+1], arr[j]
    return arr
'''

[test.assertions]
contains = ["fn bubble_sort"]

