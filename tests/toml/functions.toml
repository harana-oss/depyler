[test.python]
code = '''
def find_max(arr: list[int]) -> int:
    if len(arr) == 0:
        return 0
    max_val = arr[0]
    for x in arr:
        if x > max_val:
            max_val = x
    return max_val
'''

[test.assertions]
contains = ["fn find_max"]

