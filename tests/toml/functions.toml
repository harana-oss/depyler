[[test]]
name = "benchmark_main_pattern"
tags = ["function", "main", "benchmark"]
compile_check = true

[test.python]
code = '''
def fibonacci_iterative(n: int) -> int:
    """Calculate nth Fibonacci number."""
    if n <= 1:
        return n
    a = 0
    b = 1
    for i in range(2, n + 1):
        c = a + b
        a = b
        b = c
    return b

def main():
    """Run benchmark - NO RETURN TYPE."""
    limits = [25, 30, 35]
    for limit in limits:
        result = fibonacci_iterative(limit)
        print(result)
'''

[test.assertions]
contains = ["fn fibonacci_iterative", "fn main"]

