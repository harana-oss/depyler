rust = '''
#[doc = " Generator state struct"]
#[derive(Debug)]
struct CounterState {
    state: usize,
    n: i32,
}
#[doc = " Generator function - returns Iterator"]
pub fn counter(n: i32) -> impl Iterator<Item = i32> {
    CounterState { state: 0, n: n }
}
impl Iterator for CounterState {
    type Item = i32;
    fn next(&mut self) -> Option<Self::Item> {
        match self.state {
            0 => {
                self.state = 1;
                for _i in 0..self.n {
                    return Some(i);
                }
                None
            }
            _ => None,
        }
    }
}
'''

