# Function Transpilation Tests
# Migrated from: test_func_gens.rs, test_nested_functions.rs, test_default_arguments.rs,
#                test_main_return_type.rs, test_function_borrowing.rs, test_star_args_unpacking.rs
# Note: test_default_parameters.rs contains HIR-level unit tests, not transpilation tests

[metadata]
name = "Function Tests"
category = "functions"

# =============================================================================
# Basic Function Generation (from test_func_gens.rs)
# =============================================================================

[[test]]
name = "generic_function"
tags = ["function", "generics"]

[test.python]
code = '''
from typing import TypeVar

T = TypeVar('T')

def identity(value: T) -> T:
    return value
'''

[test.assertions]
contains = ["fn identity"]

