[[test]]
name = "enum_new"
description = "__new__ for complex members"
python = """
from enum import Enum

class Planet(Enum):
    def __new__(cls, mass, radius):
        obj = object.__new__(cls)
        obj._value_ = mass
        obj.mass = mass
        obj.radius = radius
        return obj
    
    EARTH = (5.97e24, 6371)
    MARS = (6.39e23, 3390)

print(Planet.EARTH.mass)
print(Planet.EARTH.radius)
"""
rust = """
// In Rust, we use a struct-like enum or associated constants
struct Planet {
    mass: f64,
    radius: i32,
}

impl Planet {
    const EARTH: Planet = Planet { mass: 5.97e24, radius: 6371 };
    const MARS: Planet = Planet { mass: 6.39e23, radius: 3390 }

fn main() {
    log::info!("{}", Planet::EARTH.mass);
    log::info!("{}", Planet::EARTH.radius);
}
"""
expected_output = """5970000000000000000000000
6371"""

[[test]]
name = "enum_multi_value"
description = "MEMBER = (value, extra)"
python = """
from enum import Enum

class Month(Enum):
    JANUARY = (1, 31)
    FEBRUARY = (2, 28)
    MARCH = (3, 31)
    
    def __init__(self, number, days):
        self.number = number
        self.days = days

print(Month.JANUARY.number)
print(Month.JANUARY.days)
"""
rust = """
// In Rust, we use a struct variant or associated data
#[derive(Debug, Clone, Copy)]
struct Month {
    number: i32,
    days: i32,
}

impl Month {
    const JANUARY: Month = Month { number: 1, days: 31 };
    const FEBRUARY: Month = Month { number: 2, days: 28 };
    const MARCH: Month = Month { number: 3, days: 31 }

fn main() {
    log::info!("{}", Month::JANUARY.number);
    log::info!("{}", Month::JANUARY.days);
}
"""
expected_output = """1
31"""

