# =============================================================================

[[test]]
name = "enum_ignore"
description = "_ignore_ = ['helper'] excludes names"
python = """
from enum import Enum

class Animal(Enum):
    _ignore_ = ['helper']
    
    @staticmethod
    def helper():
        return "Helper method"
    
    CAT = 1
    DOG = 2

print(list(Animal.__members__.keys()))
print(Animal.helper())
"""
rust = """
// In Rust, non-variant items are naturally separate from enum variants
#[derive(Debug, Clone, Copy)]
enum Animal {
    Cat = 1,
    Dog = 2,
}

impl Animal {
    const MEMBERS: [&'static str; 2] = ["Cat", "Dog"];
    
    fn helper() -> &'static str {
        "Helper method"
    }
}

fn main() {
    log::info!("{:?}", Animal::MEMBERS.to_vec());
    log::info!("{}", Animal::helper());
}
"""
expected_output = """["Cat", "Dog"]
Helper method"""

