[[test]]
name = "enum_staticmethod"
description = "@staticmethod def helper(): ..."
python = """
from enum import Enum

class HttpMethod(Enum):
    GET = "GET"
    POST = "POST"
    PUT = "PUT"
    
    @staticmethod
    def all_methods():
        return ["GET", "POST", "PUT", "DELETE"]

print(HttpMethod.all_methods())
print(HttpMethod.GET.value)
"""
rust = """
#[derive(Debug)]
enum HttpMethod {
    Get,
    Post,
    Put,
}

impl HttpMethod {
    fn all_methods() -> Vec<&'static str> {
        vec!["GET", "POST", "PUT", "DELETE"]
    }
    
    fn value(&self) -> &str {
        match self {
            HttpMethod::Get => "GET",
            HttpMethod::Post => "POST",
            HttpMethod::Put => "PUT",
        }
    }
}

fn main() {
    log::info!("{:?}", HttpMethod::all_methods());
    log::info!("{}", HttpMethod::Get.value());
}
"""
expected_output = """['GET', 'POST', 'PUT', 'DELETE']
GET"""

[[test]]
name = "enum_classmethod"
description = "@classmethod def from_string(cls, s): ..."
python = """
from enum import Enum

class Day(Enum):
    MONDAY = 1
    TUESDAY = 2
    WEDNESDAY = 3
    
    @classmethod
    def from_string(cls, s):
        try:
            return cls[s.upper()]
        except KeyError:
            return None

d = Day.from_string("monday")
print(d.name if d else "None")
print(d.value if d else "None")
"""
rust = """
#[derive(Debug)]
enum Day {
    Monday = 1,
    Tuesday = 2,
    Wednesday = 3,
}

impl Day {
    fn from_string(s: &str) -> Option<Self> {
        match s.to_uppercase().as_str() {
            "MONDAY" => Some(Day::Monday),
            "TUESDAY" => Some(Day::Tuesday),
            "WEDNESDAY" => Some(Day::Wednesday),
            _ => None,
        }
    }
}

fn main() {
    let d = Day::from_string("monday");
    match d {
        Some(day) => {
            log::info!("{:?}", format!("{:?}", day).to_uppercase());
            log::info!("{}", day as i32);
        }
        None => log::info!("None"),
    }
}
"""
expected_output = """MONDAY
1"""

