[[test]]
name = "enum_mixin"
description = "class Color(Mixin, Enum): ..."
python = """
from enum import Enum

class JsonMixin:
    def to_json(self):
        return {'name': self.name, 'value': self.value}

class Status(JsonMixin, Enum):
    PENDING = 1
    ACTIVE = 2

print(Status.PENDING.to_json())
"""
rust = """
// In Rust, we use traits instead of mixins
use std::collections::HashMap;

trait ToJson {
    fn to_json(&self) -> HashMap<String, String>;
}

#[derive(Debug, Clone, Copy)]
enum Status {
    Pending = 1,
    Active = 2,
}

impl ToJson for Status {
    fn to_json(&self) -> HashMap<String, String> {
        let mut map = HashMap::new();
        map.insert("name".to_string(), format!("{:?}", self));
        map.insert("value".to_string(), (*self as i32).to_string());
        map
    }
}

fn main() {
    let json = Status::Pending.to_json();
    log::info!("{{{}: {}, {}: {}}}", 
        "'name'", format!("'{}'", json.get("name").unwrap()),
        "'value'", json.get("value").unwrap()
    );
}
"""
expected_output = "{'name': 'Pending', 'value': 1}"

[[test]]
name = "enum_ordered"
description = "Mixin providing ordering"
python = """
from enum import Enum

class OrderedEnum(Enum):
    def __lt__(self, other):
        if self.__class__ is other.__class__:
            return self.value < other.value
        return NotImplemented

class Priority(OrderedEnum):
    LOW = 1
    MEDIUM = 2
    HIGH = 3

print(Priority.LOW < Priority.HIGH)
print(sorted([Priority.HIGH, Priority.LOW, Priority.MEDIUM]))
"""
rust = """
// In Rust, we derive Ord and PartialOrd
#[derive(Debug, Clone, Copy, PartialEq, Eq, PartialOrd, Ord)]
enum Priority {
    Low = 1,
    Medium = 2,
    High = 3,
}

fn main() {
    log::info!("{}", Priority::Low < Priority::High);
    let mut priorities = vec![Priority::High, Priority::Low, Priority::Medium];
    priorities.sort();
    log::info!("{:?}", priorities);
}
"""
expected_output = """true
[Low, Medium, High]"""

