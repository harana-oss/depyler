[[test]]
name = "enum_custom_str"
description = "def __str__(self): return self.value"
python = """
from enum import Enum

class Currency(Enum):
    USD = "$"
    EUR = "€"
    GBP = "£"
    
    def __str__(self):
        return self.value

print(str(Currency.USD))
print(f"Price: {Currency.EUR}100")
"""
rust = """
use std::fmt;

enum Currency {
    Usd,
    Eur,
    Gbp,
}

impl fmt::Display for Currency {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        match self {
            Currency::Usd => write!(f, "$"),
            Currency::Eur => write!(f, "€"),
            Currency::Gbp => write!(f, "£"),
        }
    }
}

fn main() {
    log::info!("{}", Currency::Usd);
    log::info!("Price: {}100", Currency::Eur);
}
"""
expected_output = """$
Price: €100"""

[[test]]
name = "enum_custom_repr"
description = "def __repr__(self): ..."
python = """
from enum import Enum

class State(Enum):
    INIT = 0
    RUNNING = 1
    STOPPED = 2
    
    def __repr__(self):
        return f"<State.{self.name}>"

print(repr(State.RUNNING))
"""
rust = """
use std::fmt;

#[derive(Debug)]
enum State {
    Init = 0,
    Running = 1,
    Stopped = 2,
}

impl fmt::Display for State {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "<State.{:?}>", self)
