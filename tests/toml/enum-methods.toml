[[test]]
name = "enum_generate_next"
description = "Customize auto() behavior"
python = """
from enum import Enum, auto

class Power(Enum):
    def _generate_next_value_(name, start, count, last_values):
        return 2 ** count
    
    FIRST = auto()   # 2^0 = 1
    SECOND = auto()  # 2^1 = 2
    THIRD = auto()   # 2^2 = 4

print(Power.FIRST.value)
print(Power.SECOND.value)
print(Power.THIRD.value)
"""
rust = """
// In Rust, we define enum values explicitly
// We can use a const fn for power-of-2 generation
#[derive(Debug, Clone, Copy)]
enum Power {
    First = 1,   // 2^0
    Second = 2,  // 2^1
    Third = 4,   // 2^2
}

fn main() {
    log::info!("{}", Power::First as i32);
    log::info!("{}", Power::Second as i32);
    log::info!("{}", Power::Third as i32);
}
"""
expected_output = """1
2
4"""

[[test]]
name = "enum_custom_auto"
description = "auto() returns custom values"
python = """
from enum import Enum, auto

class Id(Enum):
    def _generate_next_value_(name, start, count, last_values):
        return f"ID_{count:03d}"
    
    FIRST = auto()
    SECOND = auto()

print(Id.FIRST.value)
print(Id.SECOND.value)
"""
rust = """
// In Rust, we use string values explicitly or via const fn
#[derive(Debug, Clone, Copy)]
enum Id {
    First,
    Second,
}

impl Id {
    fn value(&self) -> &'static str {
        match self {
            Id::First => "ID_000",
            Id::Second => "ID_001",
        }
    }
}

fn main() {
    log::info!("{}", Id::First.value());
    log::info!("{}", Id::Second.value());
}
"""
expected_output = """ID_000
ID_001"""

