[[test]]
name = "enum_custom_format"
description = "def __format__(self, spec): ..."
python = """
from enum import Enum

class Size(Enum):
    SMALL = 1
    MEDIUM = 2
    LARGE = 3
    
    def __format__(self, spec):
        if spec == 'short':
            return self.name[0]
        return self.name

s = Size.MEDIUM
print(f"{s}")
print(f"{s:short}")
"""
rust = """
enum Size {
    Small = 1,
    Medium = 2,
    Large = 3,
}

impl Size {
    fn format_spec(&self, spec: &str) -> String {
        let name = match self {
            Size::Small => "SMALL",
            Size::Medium => "MEDIUM",
            Size::Large => "LARGE",
        };
        if spec == "short" {
            name.chars().next().unwrap().to_string()
        } else {
            name.to_string()
        }
    }
}

fn main() {
    let s = Size::Medium;
    log::info!("{}", s.format_spec(""));
    log::info!("{}", s.format_spec("short"));
}
"""
expected_output = """MEDIUM
M"""

[[test]]
name = "enum_custom_bool"
description = "def __bool__(self): return self.value != 0"
python = """
from enum import Enum

class Toggle(Enum):
    OFF = 0
    ON = 1
    
    def __bool__(self):
        return self.value != 0

if Toggle.ON:
    print("Toggle is ON")

if not Toggle.OFF:
    print("Toggle is OFF")
"""
rust = """
#[derive(Copy, Clone)]
enum Toggle {
    Off = 0,
    On = 1,
}

impl Toggle {
    fn to_bool(&self) -> bool {
        *self as i32 != 0
    }
}

fn main() {
    if Toggle::On.to_bool() {
        log::info!("Toggle is ON");
    }
    
    if !Toggle::Off.to_bool() {
        log::info!("Toggle is OFF");
    }
}
"""
expected_output = """Toggle is ON
Toggle is OFF"""

