[[test]]
name = "enum_missing"
description = "Handle unknown values"
skip = true
skip_reason = "_missing_ is Python-specific enum fallback mechanism"
python = """
from enum import Enum

class ErrorCode(Enum):
    SUCCESS = 0
    ERROR = 1
    UNKNOWN = 999
    
    @classmethod
    def _missing_(cls, value):
        return cls.UNKNOWN

print(ErrorCode(0).name)
print(ErrorCode(100).name)  # Returns UNKNOWN
"""

[[test]]
name = "enum_fallback"
description = "_missing_ returns default member"
skip = true
skip_reason = "_missing_ is Python-specific enum fallback mechanism"
python = """
from enum import Enum

class Grade(Enum):
    A = 90
    B = 80
    C = 70
    F = 0
    
    @classmethod
    def _missing_(cls, value):
        if value >= 90:
            return cls.A
        elif value >= 80:
            return cls.B
        elif value >= 70:
            return cls.C
        return cls.F

print(Grade(95).name)
print(Grade(85).name)
"""

