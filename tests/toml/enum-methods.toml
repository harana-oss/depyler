[[test]]
name = "enum_computed"
description = "Property computing from value"
python = """
from enum import Enum

class Temperature(Enum):
    COLD = 0
    WARM = 20
    HOT = 35
    
    @property
    def fahrenheit(self):
        return self.value * 9/5 + 32

print(Temperature.COLD.fahrenheit)
print(Temperature.HOT.fahrenheit)
"""
rust = """
#[derive(Copy, Clone)]
enum Temperature {
    Cold = 0,
    Warm = 20,
    Hot = 35,
}

impl Temperature {
    fn fahrenheit(&self) -> f64 {
        (*self as i32 as f64) * 9.0/5.0 + 32.0
    }
}

fn main() {
    log::info!("{}", Temperature::Cold.fahrenheit());
    log::info!("{}", Temperature::Hot.fahrenheit());
}
"""
expected_output = """32.0
95.0"""

