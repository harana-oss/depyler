[[test]]
name = "enum_new"
description = "__new__ for complex members"
skip = true
skip_reason = "Custom __new__ in enums is Python-specific"
python = """
from enum import Enum

class Planet(Enum):
    def __new__(cls, mass, radius):
        obj = object.__new__(cls)
        obj._value_ = mass
        obj.mass = mass
        obj.radius = radius
        return obj
    
    EARTH = (5.97e24, 6371)
    MARS = (6.39e23, 3390)

print(Planet.EARTH.mass)
print(Planet.EARTH.radius)
"""

