# Enum Methods Tests - Custom enum methods
# Rust Mapping: impl block for enum

[metadata]
name = "Enum Methods Tests"
category = "data-structures"

# =============================================================================
# Instance Methods
# =============================================================================

[[test]]
name = "enum_custom_method"
description = "def describe(self): return f'{self.name}: {self.value}'"
python = """
from enum import Enum

class Status(Enum):
    PENDING = 1
    ACTIVE = 2
    DONE = 3
    
    def describe(self):
        return f"{self.name}: {self.value}"

print(Status.PENDING.describe())
print(Status.ACTIVE.describe())
"""
rust = """
#[derive(Debug)]
enum Status {
    Pending = 1,
    Active = 2,
    Done = 3,
}

impl Status {
    fn describe(&self) -> String {
        format!("{:?}: {}", self, *self as i32)
    }
}

fn main() {
    log::info!("{}", Status::Pending.describe());
    log::info!("{}", Status::Active.describe());
}
"""
expected_output = """PENDING: 1
ACTIVE: 2"""

