[[test]]
name = "enum_missing"
description = "Handle unknown values"
python = """
from enum import Enum

class ErrorCode(Enum):
    SUCCESS = 0
    ERROR = 1
    UNKNOWN = 999
    
    @classmethod
    def _missing_(cls, value):
        return cls.UNKNOWN

print(ErrorCode(0).name)
print(ErrorCode(100).name)  # Returns UNKNOWN
"""
rust = """
// In Rust, we implement a from_value method with fallback
#[derive(Debug, Clone, Copy)]
enum ErrorCode {
    Success = 0,
    Error = 1,
    Unknown = 999,
}

impl ErrorCode {
    fn from_value(value: i32) -> Self {
        match value {
            0 => ErrorCode::Success,
            1 => ErrorCode::Error,
            _ => ErrorCode::Unknown,
        }
    }
}

fn main() {
    log::info!("{:?}", ErrorCode::from_value(0));
    log::info!("{:?}", ErrorCode::from_value(100));
}
"""
expected_output = """Success
Unknown"""

[[test]]
name = "enum_fallback"
description = "_missing_ returns default member"
python = """
from enum import Enum

class Grade(Enum):
    A = 90
    B = 80
    C = 70
    F = 0
    
    @classmethod
    def _missing_(cls, value):
        if value >= 90:
            return cls.A
        elif value >= 80:
            return cls.B
        elif value >= 70:
            return cls.C
        return cls.F

print(Grade(95).name)
print(Grade(85).name)
"""
rust = """
// In Rust, we implement the fallback logic in a from_value method
#[derive(Debug, Clone, Copy)]
enum Grade {
    A,
    B,
    C,
    F,
}

impl Grade {
    fn from_score(value: i32) -> Self {
        if value >= 90 {
            Grade::A
        } else if value >= 80 {
            Grade::B
        } else if value >= 70 {
            Grade::C
        } else {
            Grade::F
        }
    }
}

fn main() {
    log::info!("{:?}", Grade::from_score(95));
    log::info!("{:?}", Grade::from_score(85));
}
"""
expected_output = """A
B"""

