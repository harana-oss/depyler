# =============================================================================
# Other Reflected
# =============================================================================

[[test]]
name = "dunder_rmatmul"
description = "def __rmatmul__(self, other): return ... (other @ self)"
python = """
class Matrix:
    def __init__(self, data):
        self.data = data
    
    def __rmatmul__(self, other):
        return Matrix(f"{other} @ {self.data}")
    
    def __repr__(self):
        return f"Matrix({self.data})"

m = Matrix("B")
result = "A" @ m
print(result)
"""
rust = """
use std::fmt;

#[derive(Debug)]
struct Matrix {
    data: String,
}

impl fmt::Display for Matrix {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Matrix({})", self.data)
    }
}

fn matmul(left: &str, right: Matrix) -> Matrix {
    Matrix { data: format!("{} @ {}", left, right.data) }
}

fn main() {
    let m = Matrix { data: "B".to_string() };
    let result = matmul("A", m);
    log::info!("{}", result);
}
"""

[[test]]
name = "dunder_rdivmod"
description = "def __rdivmod__(self, other): return divmod(other, self)"
python = """
class Number:
    def __init__(self, value):
        self.value = value
    
    def __rdivmod__(self, other):
        q, r = divmod(other, self.value)
        return (q, r)

n = Number(3)
result = divmod(10, n)
print(result)
"""
rust = """
fn divmod(dividend: i32, divisor: i32) -> (i32, i32) {
    (dividend / divisor, dividend % divisor)
}

fn main() {
    let result = divmod(10, 3);
    log::info!("{:?}", result);
}
"""

# =============================================================================
# When Reflected is Called
# =============================================================================

[[test]]
name = "reflected_fallback"
description = "1 + custom_obj calls custom_obj.__radd__(1)"
python = """
class Custom:
    def __init__(self, value):
        self.value = value
    
    def __radd__(self, other):
        return f"Reflected: {other} + {self.value}"

obj = Custom(5)
result = 1 + obj
print(result)
"""
rust = """
use std::ops::Add;

struct Custom {
    value: i32,
}

impl Add<Custom> for i32 {
    type Output = String;
    
    fn add(self, other: Custom) -> String {
        format!("Reflected: {} + {}", self, other.value)
    }
}

fn main() {
    let obj = Custom { value: 5 };
    let result = 1 + obj;
    log::info!("{}", result);
}
"""

[[test]]
name = "reflected_subclass"
description = "Subclass reflected method called first"
python = """
class Base:
    def __init__(self, value):
        self.value = value
    
    def __radd__(self, other):
        return f"Base: {other} + {self.value}"

class Derived(Base):
    def __radd__(self, other):
        return f"Derived: {other} + {self.value}"

obj = Derived(10)
result = 5 + obj
print(result)
"""
rust = """
trait Addable {
    fn radd(&self, other: i32) -> String;
}

struct Base {
    value: i32,
}

struct Derived {
    value: i32,
}

impl Addable for Base {
    fn radd(&self, other: i32) -> String {
        format!("Base: {} + {}", other, self.value)
    }
}

impl Addable for Derived {
    fn radd(&self, other: i32) -> String {
        format!("Derived: {} + {}", other, self.value)
    }
}

fn main() {
    let obj = Derived { value: 10 };
    let result = obj.radd(5);
    log::info!("{}", result);
}
"""

[[test]]
name = "reflected_both_fail"
description = "TypeError when both __add__ and __radd__ return NotImplemented"
python = """
class Custom:
    def __init__(self, value):
        self.value = value

# This would raise TypeError: unsupported operand type(s)
# But for demo, we'll just show the concept
obj = Custom(5)
try:
    result = obj + "string"
except TypeError as e:
    print(f"TypeError: unsupported operand types")
"""
rust = """
fn main() {
    // Rust's type system prevents this at compile time
    log::info!("TypeError: unsupported operand types");
}
"""

