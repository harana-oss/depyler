[[test]]
name = "dunder_rand"
description = "def __rand__(self, other): return ... (other & self)"
python = """
class Bits:
    def __init__(self, value):
        self.value = value
    
    def __rand__(self, other):
        return Bits(other & self.value)
    
    def __repr__(self):
        return f"Bits({self.value})"

b = Bits(0b1100)
result = 0b1010 & b
print(result)
"""
