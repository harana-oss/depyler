[metadata]
name = "Dunder Reflected Tests"
category = "dunder-methods"

# =============================================================================
# Reflected Arithmetic
# =============================================================================

[[test]]
name = "dunder_radd"
description = "def __radd__(self, other): return ... (other + self)"
python = """
class Number:
    def __init__(self, value):
        self.value = value
    
    def __radd__(self, other):
        return Number(other + self.value)
    
    def __repr__(self):
        return f"Number({self.value})"

n = Number(5)
result = 10 + n
print(result)
"""
rust = """
use std::ops::Add;
use std::fmt;

#[derive(Debug)]
struct Number {
    value: i32,
}

impl Add<Number> for i32 {
    type Output = Number;
    
    fn add(self, other: Number) -> Number {
        Number { value: self + other.value }
    }
}

impl fmt::Display for Number {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Number({})", self.value)
    }
}

fn main() {
    let n = Number { value: 5 };
    let result = 10 + n;
    log::info!("{}", result);
}
"""

