[[test]]
name = "reflected_same_type"
description = "When both operands are same custom type"
python = """
class Number:
    def __init__(self, value):
        self.value = value
    
    def __add__(self, other):
        if isinstance(other, Number):
            return Number(self.value + other.value)
        return NotImplemented
    
    def __radd__(self, other):
        if isinstance(other, Number):
            return Number(other.value + self.value)
        return NotImplemented
    
    def __repr__(self):
        return f"Number({self.value})"

a = Number(5)
b = Number(3)
result = a + b
print(result)
"""
rust = """
use std::ops::Add;
use std::fmt;

#[derive(Debug)]
struct Number {
    value: i32,
}

impl Add for Number {
    type Output = Number;
    
    fn add(self, other: Number) -> Number {
        Number { value: self.value + other.value }
    }
}

impl fmt::Display for Number {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Number({})", self.value)
    }
}

fn main() {
    let a = Number { value: 5 };
    let b = Number { value: 3 };
    let result = a + b;
    log::info!("{}", result);
}
"""

