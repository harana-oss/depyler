[[test]]
name = "scalar_times_object"
description = "2 * Vector(1, 2) via __rmul__"
python = """
class Vector:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def __rmul__(self, scalar):
        return Vector(scalar * self.x, scalar * self.y)
    
    def __repr__(self):
        return f"Vector({self.x}, {self.y})"

v = Vector(1, 2)
result = 2 * v
print(result)
"""
rust = """
use std::ops::Mul;
use std::fmt;

#[derive(Debug)]
struct Vector {
    x: i32,
    y: i32,
}

impl Mul<Vector> for i32 {
    type Output = Vector;
    
    fn mul(self, vec: Vector) -> Vector {
        Vector { x: self * vec.x, y: self * vec.y }
    }
}

impl fmt::Display for Vector {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Vector({}, {})", self.x, self.y)
    }
}

fn main() {
    let v = Vector { x: 1, y: 2 };
    let result = 2 * v;
    log::info!("{}", result);
}
"""

[[test]]
name = "reflected_format"
description = "'%s' % custom_obj uses __str__"
python = """
class Person:
    def __init__(self, name):
        self.name = name
    
    def __str__(self):
        return self.name

p = Person("Alice")
result = "Hello, %s!" % p
print(result)
"""
rust = """
use std::fmt;

struct Person {
    name: String,
}

impl fmt::Display for Person {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "{}", self.name)
    }
}

fn main() {
    let p = Person { name: "Alice".to_string() };
    let result = format!("Hello, {}!", p);
    log::info!("{}", result);
}
"""

