# =============================================================================
# @dataclass
# =============================================================================

[[test]]
name = "dataclass_decorator"
description = "@dataclass class Point: x: int; y: int"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

result = Point(1, 2)
'''

rust = '''
#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}
'''


[[test]]
name = "dataclass_options"
description = "@dataclass(frozen=True, order=True)"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

result = hash(Point(1, 2))  # Now hashable
'''

rust = '''
#[derive(Debug, Hash)]
struct Point {
    x: i32,
    y: i32,
}
'''


