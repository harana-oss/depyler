# Class Decorators Tests - Decorating classes
# Rust Mapping: Derive macros, attribute macros

[metadata]
name = "Class Decorators Tests"
category = "decorators-closures"

# =============================================================================
# Basic Class Decorator
# =============================================================================

[[test]]
name = "class_decorator_basic"
description = "@decorator class MyClass: ..."

python = '''
def decorator(func):
    def wrapper(*args, **kwargs):
        return func(*args, **kwargs)
    return wrapper

@decorator
def f():
    return 42

result = f()
'''

rust = '''
// Rust procedural macro
// #[decorator]
// fn f() -> i32 { 42 }
'''


