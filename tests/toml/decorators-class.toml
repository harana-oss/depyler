[[test]]
name = "dataclass_field"
description = "@dataclass with field() for defaults"

python = '''
from dataclasses import dataclass, field

@dataclass
class Example:
    x: int
    y: int = field(default=10)

result = Example(x=5)
'''

rust = '''
#[derive(Debug)]
struct Example {
    x: i32,
    y: i32,
}

impl Default for Example {
    fn default() -> Self {
        Self { x: 0, y: 10 }
    }
}
'''


