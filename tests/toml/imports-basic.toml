[[test]]
name = "import_not_found"
skip = true
description = "import nonexistent"

python = '''
# Importing non-existent module raises ModuleNotFoundError
try:
    import nonexistent_module_xyz
    result = False
except ModuleNotFoundError:
    result = True
assert result
'''

rust = '''
    let result = true;
'''


