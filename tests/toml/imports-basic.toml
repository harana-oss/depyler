# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "import_conditional"
skip = true
description = "if cond: import x"

python = '''
# Conditional import
cond = True
if cond:
    import os
    result = hasattr(os, 'getcwd')
else:
    result = False
assert result == True
'''

rust = '''
    use std::env;
    let cond = true;
    let result = if cond {
        env::current_dir().is_ok()
    } else {
        false
    };
    assert!(result);
'''


[[test]]
name = "import_in_function"
skip = true
description = "def f(): import x"

python = '''
def f():
    import os
    return hasattr(os, 'getcwd')

# Import inside function scope
result = f()
assert result == True
'''

rust = '''
    fn f() -> bool {
        use std::env;
        env::current_dir().is_ok()
    }
    let result = f();
    assert!(result);
'''


[[test]]
name = "import_reimport"
skip = true
description = "import x; import x again"

python = '''
import sys
first_id = id(sys)
import sys
second_id = id(sys)
# Re-importing returns same module object
result = first_id == second_id
assert result == True
'''

rust = '''
    use std::env;
    use std::env as e;
    let result = true;
    assert!(result);
'''

