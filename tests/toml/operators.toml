[[test]]
name = "power_precedence"
skip = true
description = "Power operator precedence"

python = '''
def test_precedence() -> tuple[int, int, int]:
    a = 2 + 3 ** 2
    b = (2 + 3) ** 2
    c = 2 ** 3 * 4
    return a, b, c
'''

rust = '''
pub fn test_precedence() -> (i32, i32, i32) {
    let _cse_temp_0 = 3_i32.pow(2 as u32);
    let a = (2 as f64) + _cse_temp_0;
    let _cse_temp_1 = 5_i32.pow(2 as u32);
    let b = _cse_temp_1;
    let _cse_temp_2 = 2_i32.pow(3 as u32);
    let _cse_temp_3 = _cse_temp_2 * (4 as f64);
    let c = _cse_temp_3;
    return (a, b, c);
}
'''

[[test]]
name = "floor_division_positive"
skip = true
description = "Floor division with positive operands"

python = '''
def test_floordiv(a: int, b: int) -> int:
    return a // b
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn test_floordiv(a: i32, b: i32) -> i32 {
    return {
        let d = a / b;
        let r = a % b;
        if r != 0 && (a ^ b) < 0 { d - 1 } else { d }
    };
}
'''

