# Operator Tests - Migrated from test_operators.rs, test_power_operator.rs, test_floor_div_zero_handler.rs

[metadata]
name = "Operator Tests"
category = "operators"

# =============================================================================
# Arithmetic Operators
# =============================================================================

[[test]]
name = "operator_add"
description = "Addition operator"
tags = ["operator", "arithmetic"]

[test.python]
code = '''
def add(a: int, b: int) -> int:
    return a + b
'''

[test.assertions]
contains = ["a + b"]

[[test]]
name = "operator_subtract"
description = "Subtraction operator"
tags = ["operator", "arithmetic"]

[test.python]
code = '''
def subtract(a: int, b: int) -> int:
    return a - b
'''

[test.assertions]
contains = ["a - b"]

[[test]]
name = "operator_multiply"
description = "Multiplication operator"
tags = ["operator", "arithmetic"]

[test.python]
code = '''
def multiply(a: int, b: int) -> int:
    return a * b
'''

[test.assertions]
contains = ["a * b"]

[[test]]
name = "operator_divide"
description = "Division operator"
tags = ["operator", "arithmetic"]

[test.python]
code = '''
def divide(a: float, b: float) -> float:
    return a / b
'''

[test.assertions]
contains = ["a / b"]

[[test]]
name = "operator_floor_div"
description = "Floor division operator"
tags = ["operator", "arithmetic"]

[test.python]
code = '''
def floor_div(a: int, b: int) -> int:
    return a // b
'''

[test.assertions]
contains_any = [["a / b", "div_euclid"]]
not_contains = ["//"]

[[test]]
name = "operator_modulo"
description = "Modulo operator"
tags = ["operator", "arithmetic"]

[test.python]
code = '''
def modulo(a: int, b: int) -> int:
    return a % b
'''

[test.assertions]
contains = ["a % b"]

# =============================================================================
# Power Operator
# =============================================================================

[[test]]
name = "operator_power_literal"
description = "Power operator with literals"
tags = ["operator", "power"]

[test.python]
code = '''
def power_literal() -> int:
    return 2 ** 8
'''

[test.assertions]
contains_any = [["pow(8", "2_i32.pow(", "2i32.pow(", "256"]]

[[test]]
name = "operator_power_variable"
description = "Power operator with variables"
tags = ["operator", "power"]

[test.python]
code = '''
def power_var(base: int, exp: int) -> int:
    return base ** exp
'''

[test.assertions]
contains_any = [["pow(", "checked_pow"]]

[[test]]
name = "operator_pow_builtin"
description = "pow() builtin function"
tags = ["operator", "power", "builtin"]

[test.python]
code = '''
def pow_call(base: int, exp: int) -> int:
    return pow(base, exp)
'''

[test.assertions]
contains = ["pow("]

