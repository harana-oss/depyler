# =============================================================================
# Arithmetic Type Propagation
# =============================================================================

[[test]]
name = "mixed_float_int_multiplication"
description = "Float * int should cast int to f64"
tags = ["math", "arithmetic"]

[test.python]
code = '''
def multiply(x: float) -> float:
    return x * 3
'''

[test.assertions]
contains = ["x * (3 as f64)"]

[[test]]
name = "int_float_multiplication"
description = "Int * float should cast int to f64"
tags = ["math", "arithmetic"]

[test.python]
code = '''
def multiply(n: int) -> float:
    return 6.0 * n
'''

[test.assertions]
contains = ["6.0 * (n as f64)"]

[[test]]
name = "arithmetic_no_format"
description = "Arithmetic should not use format! for concatenation"
tags = ["math", "arithmetic"]

[test.python]
code = '''
def compute(a: int, b: int) -> int:
    result = a * 10 + b
    return result
'''

[test.assertions]
contains = ["* 10", "+ b"]
not_contains = ["format!"]

