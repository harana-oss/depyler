[[test]]
name = "math_gcd"
description = "math.gcd() greatest common divisor"
tags = ["math", "arithmetic"]

python = '''
import math

def gcd_func(a: int, b: int) -> int:
    return math.gcd(a, b)
'''

rust = '''
use std::f64 as math;
pub fn gcd_func(a: i32, b: i32) -> i32 {
    return {
        let mut a = (a as i64).abs();
        let mut b = (b as i64).abs();
        while b != 0 {
            let temp = b;
            b = a % b;
            a = temp;
        }
        a as i32
    };
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_gcd_func_examples() {
        assert_eq!(gcd_func(0, 0), 0);
        assert_eq!(gcd_func(1, 2), 3);
        assert_eq!(gcd_func(-1, 1), 0);
    }
}
'''

[[test]]
name = "math_lcm"
description = "math.lcm() least common multiple"
tags = ["math", "arithmetic"]

python = '''
import math

def lcm_func(a: int, b: int) -> int:
    return math.lcm(a, b)
'''

rust = '''
use std::f64 as math;
pub fn lcm_func(a: i32, b: i32) -> i32 {
    return {
        let a = (a as i64).abs();
        let b = (b as i64).abs();
        if a == 0 || b == 0 {
            0
        } else {
            let mut gcd_a = a;
            let mut gcd_b = b;
            while gcd_b != 0 {
                let temp = gcd_b;
                gcd_b = gcd_a % gcd_b;
                gcd_a = temp;
            }
            let gcd = gcd_a;
            ((a / gcd) * b) as i32
        }
    };
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_lcm_func_examples() {
        assert_eq!(lcm_func(0, 0), 0);
        assert_eq!(lcm_func(1, 2), 3);
        assert_eq!(lcm_func(-1, 1), 0);
    }
}
'''

