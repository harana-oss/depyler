# Math Module Tests - Migrated from test_math_unit.rs, test_maths.rs, test_math_additional_unit.rs

[metadata]
name = "Math Module Tests"
category = "stdlib-math"

# =============================================================================
# Trigonometric Functions
# =============================================================================

[[test]]
name = "math_sin"
description = "math.sin() function"
tags = ["math", "trig"]

[test.python]
code = '''
import math

def calculate_sin(x: float) -> float:
    return math.sin(x)
'''

[test.assertions]
contains_any = [["x.sin()", "f64::sin", ".sin()"]]

