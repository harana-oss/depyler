[[test]]
name = "floor_division_with_constant"
description = "Floor division operation with module-level constant"
tags = ["math", "operators", "floor-division"]

python = '''
VALUE = 23.34

def test() -> None:
    a = VALUE // 2
'''

rust = '''
pub const VALUE: f64 = 23.34;
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = " Depyler: proven to terminate"]
pub fn test() {
    let _cse_temp_0 = {
        let a = VALUE;
        let b = 2 as f64;
        let q = a / b;
        let r = a % b;
        let r_negative = r < 0.0;
        let b_negative = b < 0.0;
        let r_nonzero = r != 0.0;
        let signs_differ = r_negative != b_negative;
        let needs_adjustment = r_nonzero && signs_differ;
        if needs_adjustment { q - 1.0 } else { q }
    };
    let a = _cse_temp_0;
}
'''