[metadata]
name = "Keyword-Only Arguments Tests"
category = "modern-python"

# =============================================================================
# Basic Keyword-Only
# =============================================================================

[[test]]
name = "kwonly_basic"
description = "def f(*, x): ... (x must be keyword)"
python = """
def greet(*, name):
    return f"Hello, {name}!"

print(greet(name="Alice"))
"""
rust = """
struct GreetArgs {
    name: String,
}

fn greet(args: GreetArgs) -> String {
    format!("Hello, {}!", args.name)
}

fn main() {
    let args = GreetArgs {
        name: "Alice".to_string(),
    };
    log::info!("{}", greet(args));
}
"""

[[test]]
name = "kwonly_multiple"
description = "def f(*, a, b, c): ..."
python = """
def configure(*, host, port, debug):
    return f"Connecting to {host}:{port} (debug={debug})"

print(configure(host="localhost", port=8080, debug=True))
"""
rust = """
struct ConfigArgs {
    host: String,
    port: u16,
    debug: bool,
}

fn configure(args: ConfigArgs) -> String {
    format!(
        "Connecting to {}:{} (debug={})",
        args.host, args.port, args.debug
    )
}

fn main() {
    let args = ConfigArgs {
        host: "localhost".to_string(),
        port: 8080,
        debug: true,
    };
    log::info!("{}", configure(args));
}
"""

[[test]]
name = "kwonly_defaults"
description = "def f(*, x=0, y=0): ..."
python = """
def point(*, x=0, y=0):
    return f"({x}, {y})"

print(point())
print(point(x=5))
print(point(x=3, y=4))
"""
rust = """
struct PointArgs {
    x: i32,
    y: i32,
}

impl Default for PointArgs {
    fn default() -> Self {
        PointArgs { x: 0, y: 0 }
    }
}

fn point(args: PointArgs) -> String {
    format!("({}, {})", args.x, args.y)
}

fn main() {
    log::info!("{}", point(PointArgs::default()));
    log::info!(
        "{}",
        point(PointArgs {
            x: 5,
            ..Default::default()
        })
    );
    log::info!("{}", point(PointArgs { x: 3, y: 4 }));
}
"""

# =============================================================================
# Combined with Regular Args
# =============================================================================

[[test]]
name = "kwonly_with_regular"
description = "def f(a, b, *, c, d): ..."
python = """
def mixed(a, b, *, c, d):
    return f"a={a}, b={b}, c={c}, d={d}"

print(mixed(1, 2, c=3, d=4))
"""
rust = """
fn mixed(a: i32, b: i32, c: i32, d: i32) -> String {
    format!("a={}, b={}, c={}, d={}", a, b, c, d)
}

fn main() {
    log::info!("{}", mixed(1, 2, 3, 4));
}
"""

[[test]]
name = "kwonly_with_varargs"
description = "def f(*args, x, y): ..."
python = """
def varargs_kwonly(*args, x, y):
    return f"args={args}, x={x}, y={y}"

print(varargs_kwonly(1, 2, 3, x=10, y=20))
"""
rust = """
fn varargs_kwonly(args: &[i32], x: i32, y: i32) -> String {
    format!("args={:?}, x={}, y={}", args, x, y)
}

fn main() {
    let args = vec![1, 2, 3];
    log::info!("{}", varargs_kwonly(&args, 10, 20));
}
"""

[[test]]
name = "kwonly_with_kwargs"
description = "def f(*, x, **kwargs): ..."
python = """
def kwonly_kwargs(*, x, **kwargs):
    print(f"x={x}")
    for k, v in kwargs.items():
        print(f"{k}={v}")

kwonly_kwargs(x=5, a=1, b=2)
"""
rust = """
use std::collections::HashMap;

fn kwonly_kwargs(x: i32, kwargs: &HashMap<&str, i32>) {
    log::info!("x={}", x);
    for (k, v) in kwargs {
        log::info!("{}={}", k, v);
    }
}

fn main() {
    let mut kwargs = HashMap::new();
    kwargs.insert("a", 1);
    kwargs.insert("b", 2);
    kwonly_kwargs(5, &kwargs);
}
"""

# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "kwonly_force_named"
description = "f(x=1) required, f(1) raises TypeError"
python = """
def create_user(*, username, email):
    return f"User: {username} <{email}>"

# This works
print(create_user(username="alice", email="alice@example.com"))
# This would fail: create_user("alice", "alice@example.com")
"""
rust = """
struct CreateUserArgs {
    username: String,
    email: String,
}

fn create_user(args: CreateUserArgs) -> String {
    format!("User: {} <{}>", args.username, args.email)
}

fn main() {
    let args = CreateUserArgs {
        username: "alice".to_string(),
        email: "alice@example.com".to_string(),
    };
    log::info!("{}", create_user(args));
}
"""

[[test]]
name = "kwonly_self_doc"
description = "f(verbose=True, recursive=False)"
python = """
def process_files(*, verbose=False, recursive=False, backup=True):
    flags = []
    if verbose:
        flags.append("verbose")
    if recursive:
        flags.append("recursive")
    if backup:
        flags.append("backup")
    return f"Processing with: {', '.join(flags)}"

print(process_files(verbose=True, recursive=False))
"""
rust = """
struct ProcessFilesArgs {
    verbose: bool,
    recursive: bool,
    backup: bool,
}

fn process_files(args: ProcessFilesArgs) -> String {
    let mut flags = Vec::new();
    if args.verbose {
        flags.push("verbose");
    }
    if args.recursive {
        flags.push("recursive");
    }
    if args.backup {
        flags.push("backup");
    }
    format!("Processing with: {}", flags.join(", "))
}

fn main() {
    let args = ProcessFilesArgs {
        verbose: true,
        recursive: false,
        backup: true,
    };
    log::info!("{}", process_files(args));
}
"""

[[test]]
name = "kwonly_clarity"
description = "Avoid confusion with multiple similar args"
python = """
def resize_image(*, width, height, maintain_aspect=True):
    return f"Resizing to {width}x{height} (maintain={maintain_aspect})"

# Clear what each number means
print(resize_image(width=800, height=600, maintain_aspect=False))
"""
rust = """
struct ResizeImageArgs {
    width: u32,
    height: u32,
    maintain_aspect: bool,
}

fn resize_image(args: ResizeImageArgs) -> String {
    format!(
        "Resizing to {}x{} (maintain={})",
        args.width, args.height, args.maintain_aspect
    )
}

fn main() {
    let args = ResizeImageArgs {
        width: 800,
        height: 600,
        maintain_aspect: false,
    };
    log::info!("{}", resize_image(args));
}
"""

# =============================================================================
# Required vs Optional Keyword-Only
# =============================================================================

[[test]]
name = "kwonly_required"
description = "def f(*, x): x has no default, must be passed"
python = """
def login(*, username):
    return f"Logging in as {username}"

print(login(username="admin"))
"""
rust = """
struct LoginArgs {
    username: String,
}

fn login(args: LoginArgs) -> String {
    format!("Logging in as {}", args.username)
}

fn main() {
    let args = LoginArgs {
        username: "admin".to_string(),
    };
    log::info!("{}", login(args));
}
"""

[[test]]
name = "kwonly_optional"
description = "def f(*, x=None): x has default"
python = """
def connect(*, timeout=30):
    return f"Connecting with timeout={timeout}s"

print(connect())
print(connect(timeout=60))
"""
rust = """
struct ConnectArgs {
    timeout: u32,
}

impl Default for ConnectArgs {
    fn default() -> Self {
        ConnectArgs { timeout: 30 }
    }
}

fn connect(args: ConnectArgs) -> String {
    format!("Connecting with timeout={}s", args.timeout)
}

fn main() {
    log::info!("{}", connect(ConnectArgs::default()));
    log::info!("{}", connect(ConnectArgs { timeout: 60 }));
}
"""

[[test]]
name = "kwonly_mixed_req"
description = "def f(*, a, b=0): a required, b optional"
python = """
def setup(*, host, port=8080):
    return f"Server at {host}:{port}"

print(setup(host="localhost"))
print(setup(host="example.com", port=9000))
"""
rust = """
struct SetupArgs {
    host: String,
    port: u16,
}

impl SetupArgs {
    fn new(host: String) -> Self {
        SetupArgs { host, port: 8080 }
    }
}

fn setup(args: SetupArgs) -> String {
    format!("Server at {}:{}", args.host, args.port)
}

fn main() {
    log::info!("{}", setup(SetupArgs::new("localhost".to_string())));
    log::info!(
        "{}",
        setup(SetupArgs {
            host: "example.com".to_string(),
            port: 9000,
        })
    );
}
"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "kwonly_type_hints"
description = "def f(*, x: int, y: str = ''): ..."
python = """
def typed_func(*, count: int, message: str = "default"):
    return f"{message}: {count}"

print(typed_func(count=42))
print(typed_func(count=5, message="Items"))
"""
rust = """
struct TypedFuncArgs {
    count: i32,
    message: String,
}

impl TypedFuncArgs {
    fn new(count: i32) -> Self {
        TypedFuncArgs {
            count,
            message: "default".to_string(),
        }
    }
}

fn typed_func(args: TypedFuncArgs) -> String {
    format!("{}: {}", args.message, args.count)
}

fn main() {
    log::info!("{}", typed_func(TypedFuncArgs::new(42)));
    log::info!(
        "{}",
        typed_func(TypedFuncArgs {
            count: 5,
            message: "Items".to_string(),
        })
    );
}
"""

[[test]]
name = "kwonly_method"
description = "def method(self, *, x): ..."
python = """
class Calculator:
    def __init__(self):
        self.base = 10
    
    def add(self, *, value):
        return self.base + value

calc = Calculator()
print(calc.add(value=5))
"""
rust = """
struct Calculator {
    base: i32,
}

impl Calculator {
    fn new() -> Self {
        Calculator { base: 10 }
    }

    fn add(&self, value: i32) -> i32 {
        self.base + value
    }
}

fn main() {
    let calc = Calculator::new();
    log::info!("{}", calc.add(5));
}
"""

[[test]]
name = "kwonly_classmethod"
description = "@classmethod def f(cls, *, x): ..."
python = """
class Factory:
    @classmethod
    def create(cls, *, name, value):
        return f"Creating {name}={value}"

print(Factory.create(name="item", value=42))
"""
rust = """
struct Factory;

impl Factory {
    fn create(name: &str, value: i32) -> String {
        format!("Creating {}={}", name, value)
    }
}

fn main() {
    log::info!("{}", Factory::create("item", 42));
}
"""

[[test]]
name = "kwonly_bare_star_end"
description = "def f(a, *): is syntax error"
python = """
# Bare * must be followed by keyword-only parameters
# Valid usage: def f(a, *, b): where b is keyword-only
def valid(a, *, keyword_arg):
    return a + keyword_arg

result = valid(1, keyword_arg=2)
print(result)
"""
rust = """
fn valid(a: i32, keyword_arg: i32) -> i32 {
    a + keyword_arg
}

fn main() {
    let result = valid(1, 2);
    log::info!("{}", result);
}
"""
expected_output = "3"
