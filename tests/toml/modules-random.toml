[[test]]
name = "random_randrange"
description = "random.randrange(start, stop, step)"
tags = ["random", "range"]

python = '''
import random

def random_even(max_val: int) -> int:
    return random.randrange(0, max_val, 2)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
pub fn random_even(max_val: i32) -> i32 {
    return {
        let start = 0;
        let stop = max_val;
        let step = 2;
        let num_steps = ((stop - start) / step).max(0);
        let offset = rand::thread_rng().gen_range(0..num_steps);
        start + offset * step
    };
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_random_even_examples() {
        assert_eq!(random_even(0), 0);
        assert_eq!(random_even(1), 1);
        assert_eq!(random_even(-1), -1);
    }
}
'''

