[[test]]
name = "random_randrange_stop_only"
description = "random.randrange(stop) - single argument"

python = '''
import random

def get_random_below(n: int) -> int:
    return random.randrange(n)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
use rand::rngs::SmallRng;
use rand::SeedableRng;
pub fn get_random_below(n: i32) -> i32 {
    return {
        thread_local! {
            static RNG: std::cell::RefCell<SmallRng> = std::cell::RefCell::new(SmallRng::from_os_rng());
        }
        RNG.with(|rng| rng.borrow_mut().gen_range(0..n))
    }
'''

