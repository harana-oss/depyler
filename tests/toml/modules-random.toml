[[test]]
name = "random_random"
description = "random.random() float [0, 1)"

python = '''
import random

def get_random_float() -> float:
    return random.random()
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
pub fn get_random_float() -> f64 {
    return rand::random::<f64>();
}
'''

[[test]]
name = "random_randint"
description = "random.randint(a, b) inclusive range"

python = '''
import random

def roll_dice() -> int:
    return random.randint(1, 6)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
pub fn roll_dice() -> i32 {
    return rand::thread_rng().gen_range(1..=6);
}
'''

[[test]]
name = "random_randrange"
description = "random.randrange(start, stop, step)"

python = '''
import random

def random_even(max_val: int) -> int:
    return random.randrange(0, max_val, 2)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
pub fn random_even(max_val: i32) -> i32 {
    return {
        let start = 0;
        let stop = max_val;
        let step = 2;
        let num_steps = ((stop - start) / step).max(0);
        let offset = rand::thread_rng().gen_range(0..num_steps);
        start + offset * step
    };
}
'''

