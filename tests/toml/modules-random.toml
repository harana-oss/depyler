[[test]]
name = "random_gauss"
description = "random.gauss() normal distribution"
tags = ["random", "distribution"]

python = '''
import random

def normal_random(mu: float, sigma: float) -> float:
    return random.gauss(mu, sigma)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
pub fn normal_random(mu: f64, sigma: f64) -> f64 {
    return {
        use rand::distributions::Distribution;
        let normal = rand_distr::Normal::new(mu as f64, sigma as f64).unwrap();
        normal.sample(&mut rand::thread_rng())
    };
}
'''

