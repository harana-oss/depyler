[[test]]
name = "random_randrange_step"
description = "random.randrange(start, stop, step) - with step"

python = '''
import random

def get_random_stepped(start: int, stop: int, step: int) -> int:
    return random.randrange(start, stop, step)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
use rand::rngs::SmallRng;
use rand::SeedableRng;
pub fn get_random_stepped(start: i32, stop: i32, step: i32) -> i32 {
    return {
        thread_local! {
            static RNG: std::cell::RefCell<SmallRng> = std::cell::RefCell::new(SmallRng::from_os_rng());
        }
        let start = start;
        let stop = stop;
        let step = step;
        let num_steps = ((stop - start) / step).max(0);
        let offset = RNG.with(|rng| rng.borrow_mut().gen_range(0..num_steps));
        start + offset * step
    }
'''

