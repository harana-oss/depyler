# =============================================================================
# Seed for Reproducibility
# =============================================================================

[[test]]
name = "random_seed_value"
description = "random.seed(value) for reproducibility"

python = '''
import random

def set_seed_and_get(seed: int) -> int:
    random.seed(seed)
    return random.randrange(100)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
use rand::rngs::SmallRng;
use rand::SeedableRng;
pub fn set_seed_and_get(seed: i32) -> i32 {
    {
        thread_local! {
            static RNG: std::cell::RefCell<SmallRng> = std::cell::RefCell::new(SmallRng::from_os_rng());
        }
        RNG.with(|rng| *rng.borrow_mut() = SmallRng::seed_from_u64(seed as u64));
    };
    return {
        thread_local! {
            static RNG: std::cell::RefCell<SmallRng> = std::cell::RefCell::new(SmallRng::from_os_rng());
        }
        RNG.with(|rng| rng.borrow_mut().gen_range(0..100))
    }
'''