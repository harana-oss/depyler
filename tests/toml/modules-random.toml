[[test]]
name = "random_choices"
description = "random.choices() with replacement"
tags = ["random", "choice"]

python = '''
import random

def pick_many(items: list[str], k: int) -> list[str]:
    return random.choices(items, k=k)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
use rand::seq::SliceRandom;
pub fn pick_many(items: &Vec<String>, k: i32) -> Vec<String> {
    return {
        let mut rng = rand::thread_rng();
        (0..1)
            .map(|_| items.choose(&mut rng).cloned().unwrap())
            .collect::<Vec<_>>()
    };
}
'''

[[test]]
name = "random_sample"
description = "random.sample() without replacement"
tags = ["random", "sample"]

python = '''
import random

def pick_unique(items: list[str], k: int) -> list[str]:
    return random.sample(items, k)
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
use rand::seq::SliceRandom;
pub fn pick_unique(items: &Vec<String>, k: i32) -> Vec<String> {
    return items
        .choose_multiple(&mut rand::thread_rng(), k as usize)
        .cloned()
        .collect::<Vec<_>>();
}
'''

