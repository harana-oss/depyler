[metadata]
name = "For Loop Iterator Mutation Detection Tests"
category = "ownership-mutability"
description = "Tests for detecting mutations in for loop iterators requiring &mut"

[[test]]
name = "for_loop_param_field_mutation"
skip = true
description = "Iterating over param.field with mutating loop body needs &mut"

python = '''
from dataclasses import dataclass

@dataclass
class Player:
    score: int

@dataclass
class State:
    players: list[Player]

def update_scores(state: State) -> None:
    for player in state.players:
        player.score = player.score + 1
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub score: i32,
}
impl Player {
    pub fn new(score: i32) -> Self {
        Self { score }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub players: Vec<Player>,
}
impl State {
    pub fn new(players: Vec<Player>) -> Self {
        Self { players }
    }
}
pub fn update_scores(state: &mut State) {
    for mut player in state.players.iter_mut() {
        player.score = player.score + 1;
    }
}
'''

[[test]]
name = "for_loop_param_field_no_mutation"
skip = true
description = "Iterating over param.field with non-mutating loop body"

python = '''
from dataclasses import dataclass

@dataclass
class Player:
    name: str

@dataclass
class State:
    players: list[Player]

def print_names(state: State) -> int:
    count = 0
    for player in state.players:
        count += 1
    return count
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub name: String,
}
impl Player {
    pub fn new(name: String) -> Self {
        Self { name }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub players: Vec<Player>,
}
impl State {
    pub fn new(players: Vec<Player>) -> Self {
        Self { players }
    }
}
pub fn print_names(state: &State) -> i32 {
    let mut count = 0;
    for player in state.players.iter() {
        count += 1;
    }
    return count;
}
'''

[[test]]
name = "for_loop_local_variable_iteration"
description = "Iterating over local variable (not param)"

python = '''
def sum_local() -> int:
    items = [1, 2, 3]
    total = 0
    for x in items:
        total += x
    return total
'''

rust = '''
pub fn sum_local() -> i32 {
    let items = vec![1, 2, 3];
    let mut total = 0;
    for x in items.iter().copied() {
        total += x;
    }
    return total;
}
'''

[[test]]
name = "for_loop_enumerate_mutation"
skip = true
description = "For loop with enumerate and mutation"

python = '''
def double_items(items: list[int]) -> None:
    for i, value in enumerate(items):
        items[i] = value * 2
'''

rust = '''
pub fn double_items(items: &mut Vec<i32>) {
    for (i, value) in items.clone().iter().enumerate() {
        items[i] = value * 2;
    }
}
'''

[[test]]
name = "for_loop_method_mutation_on_element"
skip = true
description = "For loop with method mutation on list element"

python = '''
from dataclasses import dataclass

@dataclass
class Container:
    items: list[int]

@dataclass
class Data:
    containers: list[Container]

def add_to_all(data: Data, value: int) -> None:
    for container in data.containers:
        container.items.append(value)
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Container {
    pub items: Vec<i32>,
}
impl Container {
    pub fn new(items: Vec<i32>) -> Self {
        Self { items }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Data {
    pub containers: Vec<Container>,
}
impl Data {
    pub fn new(containers: Vec<Container>) -> Self {
        Self { containers }
    }
}
pub fn add_to_all(data: &mut Data, value: i32) {
    for mut container in data.containers.iter_mut() {
        container.items.push(value);
    }
}
'''

[[test]]
name = "nested_for_loops_with_mutation"
skip = true
description = "Nested for loops with mutation in inner loop"

python = '''
from dataclasses import dataclass

@dataclass
class Cell:
    value: int

@dataclass
class Row:
    cells: list[Cell]

@dataclass
class Grid:
    rows: list[Row]

def increment_all(grid: Grid) -> None:
    for row in grid.rows:
        for cell in row.cells:
            cell.value = cell.value + 1
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Cell {
    pub value: i32,
}
impl Cell {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Row {
    pub cells: Vec<Cell>,
}
impl Row {
    pub fn new(cells: Vec<Cell>) -> Self {
        Self { cells }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Grid {
    pub rows: Vec<Row>,
}
impl Grid {
    pub fn new(rows: Vec<Row>) -> Self {
        Self { rows }
    }
}
pub fn increment_all(grid: &mut Grid) {
    for mut row in grid.rows.iter_mut() {
        for mut cell in row.cells.iter_mut() {
            cell.value = cell.value + 1;
        }
    }
}
'''
