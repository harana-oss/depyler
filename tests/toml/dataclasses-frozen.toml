# =============================================================================
# Inheritance with Frozen
# =============================================================================

[[test]]
name = "frozen_inherit_frozen"
description = "Frozen subclass of frozen"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point2D:
    x: int
    y: int

@dataclass(frozen=True)
class Point3D(Point2D):
    z: int

p = Point3D(1, 2, 3)
result = (p.x, p.y, p.z)
'''

rust = '''
pub const p: Point3D = Point3D::new(1, 2, 3);
pub const result: (i32, i32, i32) = (p.x, p.y, p.z);
#[derive(Debug, Copy, Clone]
pub struct Point2D {
    pub x: i32,
    pub y: i32,
}
impl Point2D {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
#[derive(Debug, Copy, Clone]
pub struct Point3D {
    pub z: i32,
}
impl Point3D {
    pub fn new(x: i32, y: i32, z: i32) -> Self {
        Self { z }
    }
}
'''

[[test]]
name = "frozen_inherit_mutable"
description = "Frozen cannot inherit non-frozen dataclass"

python = '''
from dataclasses import dataclass

@dataclass
class Point2D:
    x: int
    y: int

try:
    @dataclass(frozen=True)
    class Point3D(Point2D):
        z: int
    result = False
except:
    result = True
'''

rust = '''
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Point2D {
    pub x: i32,
    pub y: i32,
}
impl Point2D {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "mutable_inherit_frozen"
