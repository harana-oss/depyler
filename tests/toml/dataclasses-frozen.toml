# =============================================================================
# __post_init__ with Frozen
# =============================================================================

[[test]]
name = "frozen_post_init"
description = "Can use object.__setattr__ in __post_init__"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int
    
    def __post_init__(self):
        object.__setattr__(self, 'x', self.x * 2)

p = Point(5, 10)
result = p.x
'''

rust = '''
pub const p: Point = Point::new(5, 10);
pub const result: i32 = p.x;
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "frozen_computed"
description = "Set computed field in __post_init__"

python = '''
from dataclasses import dataclass, field

@dataclass(frozen=True)
class Rectangle:
    width: int
    height: int
    area: int = field(init=False)
    
    def __post_init__(self):
        object.__setattr__(self, 'area', self.width * self.height)

r = Rectangle(3, 4)
result = r.area
'''

rust = '''
pub const r: Rectangle = Rectangle::new(3, 4);
pub const result: i32 = r.area;
#[derive(Debug, Copy, Clone]
pub struct Rectangle {
    pub width: i32,
    pub height: i32,
    pub area: i32,
}
impl Rectangle {
    pub fn new(width: i32, height: i32) -> Self {
        Self { width, height, area: width * height }
    }
}
'''

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "frozen_classvar"
description = "ClassVar can be modified"

python = '''
from dataclasses import dataclass
from typing import ClassVar

@dataclass(frozen=True)
class Point:
    x: int
    y: int
    count: ClassVar[int] = 0

Point.count = 5
result = Point.count
'''

rust = '''
pub const result: i32 = Point::count;
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub const count: i32 = 0;
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "frozen_equality"
description = "Frozen objects compare by value"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p1 = Point(1, 2)
p2 = Point(1, 2)
result = p1 == p2
'''

rust = '''
pub const p1: Point = Point::new(1, 2);
pub const p2: Point = Point::new(1, 2);
pub const result: bool = p1 == p2;
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

