# =============================================================================
# Hashability
# =============================================================================

[[test]]
name = "frozen_hashable"
description = "hash(frozen_instance)"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p = Point(1, 2)
result = hash(p)
'''

rust = '''
pub const p: Point = Point::new(1, 2);
pub const result: i64 = {
    use std::collections::hash_map::DefaultHasher;
    use std::hash::{Hash, Hasher};
    let mut hasher = DefaultHasher::new();
    p.hash(&mut hasher);
    hasher.finish() as i64
};
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "frozen_dict_key"
description = "{frozen_obj: 'value'}"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p = Point(1, 2)
d = {p: 'value'}
result = d[p]
'''

rust = '''
pub const p: Point = Point::new(1, 2);
lazy_static! {
    pub static ref d: HashMap<Point, String> = {
        let mut map = HashMap::new();
        map.insert(p, "value".to_string());
        map
    }
}
use lazy_static::lazy_static;
use std::collections::HashMap;
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "frozen_set_element"
description = "{frozen_obj1, frozen_obj2}"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p1 = Point(1, 2)
p2 = Point(3, 4)
s = {p1, p2}
result = len(s)
'''

rust = '''
pub const p1: Point = Point::new(1, 2);
pub const p2: Point = Point::new(3, 4);
pub const result: i32 = s.len() as i32;
lazy_static! {
    pub static ref s: HashSet<Point> = {
        let mut set = HashSet::new();
        set.insert(p1);
        set.insert(p2);
        set
    }
}
use lazy_static::lazy_static;
use std::collections::HashSet;
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "frozen_hash_stable"
description = "Same values = same hash"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p1 = Point(1, 2)
p2 = Point(1, 2)
result = hash(p1) == hash(p2)
'''

rust = '''
pub const p1: Point = Point::new(1, 2);
pub const p2: Point = Point::new(1, 2);
pub const result: bool = {
    use std::collections::hash_map::DefaultHasher;
    use std::hash::{Hash, Hasher};
    let mut hasher = DefaultHasher::new();
    p1.hash(&mut hasher);
    hasher.finish() as i64
} == {
    use std::collections::hash_map::DefaultHasher;
    use std::hash::{Hash, Hasher};
    let mut hasher = DefaultHasher::new();
    p2.hash(&mut hasher);
    hasher.finish() as i64
};
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

