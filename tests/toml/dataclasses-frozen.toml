[[test]]
name = "frozen_replace_chain"
description = "replace(replace(obj, x=1), y=2)"

python = '''
from dataclasses import dataclass, replace

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p = Point(0, 0)
p2 = replace(replace(p, x=1), y=2)
result = (p2.x, p2.y)
'''

rust = '''
pub const p: Point = Point::new(0, 0);
