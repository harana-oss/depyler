    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

# =============================================================================
# Frozen with Nested Mutable
# =============================================================================

[[test]]
name = "frozen_mutable_field"
description = "items: list can still be mutated"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Container:
    items: list

c = Container([1, 2, 3])
c.items.append(4)
result = len(c.items)
'''

rust = '''
pub const c: Container = Container::new(vec![1, 2, 3]);
pub const result: i32 = c.items.len() as i32;
#[derive(Debug, Clone)]
pub struct Container {
    pub items: Vec<i32>,
}
impl Container {
    pub fn new(items: Vec<i32>) -> Self {
        Self { items }
    }
}
'''

[[test]]
name = "frozen_deep"
description = "Freeze nested structures manually"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Inner:
    value: int

@dataclass(frozen=True)
class Outer:
    inner: Inner

o = Outer(Inner(42))
result = o.inner.value
'''

rust = '''
pub const o: Outer = Outer::new(Inner::new(42));
pub const result: i32 = o.inner.value;
#[derive(Debug, Copy, Clone]
pub struct Inner {
    pub value: i32,
}
impl Inner {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone)]
pub struct Outer {
    pub inner: Inner,
}
impl Outer {
    pub fn new(inner: Inner) -> Self {
        Self { inner }
    }
}
'''

[[test]]
name = "frozen_tuple_field"
description = "Use tuple for truly immutable collections"

python = '''
