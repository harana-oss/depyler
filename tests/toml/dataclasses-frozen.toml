[metadata]
name = "Dataclasses Frozen Tests"
category = "data-structures"

# =============================================================================
# Basic Frozen
# =============================================================================

[[test]]
name = "frozen_basic"
description = "@dataclass(frozen=True)"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p = Point(1, 2)
result = (p.x, p.y)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
pub const p: serde_json::Value = Point::new(1, 2);
pub const result: (serde_json::Value, serde_json::Value) = (p.x, p.y);
use serde_json;
#[derive(Debug, Clone)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "x" => Some(Box::new(self.x.clone()) as Box<dyn std::any::Any>),
            "y" => Some(Box::new(self.y.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "x" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.x = v.clone();
                    true
                } else {
                    false
                }
            }
            "y" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.y = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
'''

