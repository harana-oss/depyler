[metadata]
name = "Dataclasses Frozen Tests"
category = "data-structures"

# =============================================================================
# Basic Frozen
# =============================================================================

[[test]]
name = "frozen_basic"
description = "@dataclass(frozen=True)"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p = Point(1, 2)
result = (p.x, p.y)
'''

rust = '''
pub const p: Point = Point::new(1, 2);
pub const result: (i32, i32) = (p.x, p.y);
#[derive(Debug, Copy, Clone]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "frozen_no_mutate"
description = "obj.x = 5 raises FrozenInstanceError"

python = '''
from dataclasses import dataclass

@dataclass(frozen=True)
class Point:
    x: int
    y: int

p = Point(1, 2)
try:
    p.x = 5
    result = False
except:
    result = True
'''

rust = '''
