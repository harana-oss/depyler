[metadata]
name = "Unicode Strings Tests"
category = "strings"

# =============================================================================
# Unicode Literals
# =============================================================================

[[test]]
name = "unicode_escape"
description = "Unicode escape sequences"

python = '''
def test_escape() -> str:
    return "\u0041"  # Returns 'A'
'''

rust = '''
pub fn test_escape() -> String {
    return "A".to_string();
}
'''

[[test]]
name = "unicode_name"
description = "Unicode character by name"

python = '''
def test_name() -> str:
    return "\N{GREEK SMALL LETTER ALPHA}"  # Returns 'α'
'''

rust = '''
pub fn test_name() -> String {
    return "α".to_string();
}
'''

[[test]]
name = "unicode_hex"
