[[test]]
name = "unicode_nfc"
description = "NFC normalization (canonical composition)"

python = '''
import unicodedata

def normalize_nfc(s: str) -> str:
    return unicodedata.normalize("NFC", s)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'unicodedata'()"]
pub fn normalize_nfc(s: String) -> String {
