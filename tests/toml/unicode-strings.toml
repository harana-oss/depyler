[[test]]
name = "unicode_surrogate"
description = "Length of emoji (single grapheme cluster)"

python = '''
def emoji_length() -> int:
    return len("😀")  # Should be 1
'''

rust = '''
pub fn emoji_length() -> i32 {
    return "😀".len() as i32 as i32;
}
'''

[[test]]
name = "unicode_combining"
description = "Length with combining characters"

python = '''
def combining_length() -> tuple:
    composed = "é"  # Single character
    decomposed = "e\u0301"  # e + combining acute
    return (len(composed), len(decomposed))
'''

rust = '''
pub fn combining_length() -> () {
    let composed = "é".to_string();
    let decomposed = "e\u{301}".to_string();
    return (composed.len() as i32, decomposed.len() as i32);
}
'''

[[test]]
name = "unicode_eq_normal"
description = "Equality with normalization"

python = '''
import unicodedata

def compare_normalized(s1: str, s2: str) -> bool:
    return unicodedata.normalize("NFC", s1) == unicodedata.normalize("NFC", s2)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'unicodedata'()"]
pub fn compare_normalized(s1: String, s2: String) -> bool {
    return unicodedata.normalize("NFC", s1) == unicodedata.normalize("NFC", s2);
};
'''

[[test]]
name = "unicode_locale"
description = "Locale-aware string comparison"

python = '''
import locale

def locale_compare(s1: str, s2: str) -> int:
    locale.setlocale(locale.LC_ALL, "")
    return locale.strcoll(s1, s2)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'locale'()"]
pub fn locale_compare(s1: String, s2: String) -> i32 {
    locale.setlocale(locale.LC_ALL, "");
    return locale.strcoll(s1, s2);
}
'''

