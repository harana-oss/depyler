[[test]]
name = "metaclass_new"
description = "def __new__(mcs, name, bases, namespace): ..."
python = """
class TrackedMeta(type):
    _classes = []
    
    def __new__(mcs, name, bases, namespace):
        cls = super().__new__(mcs, name, bases, namespace)
        mcs._classes.append(name)
        return cls

class A(metaclass=TrackedMeta):
    pass

class B(metaclass=TrackedMeta):
    pass

print(TrackedMeta._classes)
"""
rust = """
// In Rust, we use a static registry for class tracking
use std::sync::Mutex;

static TRACKED_CLASSES: Mutex<Vec<&str>> = Mutex::new(Vec::new());

struct A;
struct B;

fn register_class(name: &'static str) {
    TRACKED_CLASSES.lock().unwrap().push(name);
}

fn main() {
    register_class("A");
    register_class("B");
    log::info!("{:?}", *TRACKED_CLASSES.lock().unwrap());
}
"""
expected_output = """["A", "B"]"""

[[test]]
name = "metaclass_init"
description = "def __init__(cls, name, bases, namespace): ..."
python = """
class InitMeta(type):
    def __init__(cls, name, bases, namespace):
        super().__init__(name, bases, namespace)
        cls.initialized = True
        print(f"Initialized {name}")

class MyClass(metaclass=InitMeta):
    pass

print(MyClass.initialized)
"""
rust = """
// In Rust, initialization happens at compile time
struct MyClass;

impl MyClass {
    const INITIALIZED: bool = true;
}

fn main() {
    log::info!("Initialized MyClass");
    log::info!("{}", MyClass::INITIALIZED);
}
"""
expected_output = """Initialized MyClass
true"""

[[test]]
name = "metaclass_call"
description = "Control instance creation"
python = """
class CallMeta(type):
    def __call__(cls, *args, **kwargs):
        print(f"Creating instance of {cls.__name__}")
        instance = super().__call__(*args, **kwargs)
        print(f"Instance created")
        return instance

class MyClass(metaclass=CallMeta):
    def __init__(self, x):
        self.x = x

obj = MyClass(42)
print(obj.x)
"""
rust = """
// In Rust, we control instantiation via factory functions
struct MyClass {
    x: i32,
}

impl MyClass {
    fn new(x: i32) -> Self {
        log::info!("Creating instance of MyClass");
        let instance = MyClass { x };
        log::info!("Instance created");
        instance
    }
}

fn main() {
    let obj = MyClass::new(42);
    log::info!("{}", obj.x);
}
"""
expected_output = """Creating instance of MyClass
Instance created
42"""

[[test]]
name = "metaclass_prepare"
description = "@classmethod def __prepare__(mcs, name, bases): ..."
python = """
from collections import OrderedDict

class OrderedMeta(type):
    @classmethod
    def __prepare__(mcs, name, bases):
        return OrderedDict()
    
    def __new__(mcs, name, bases, namespace):
        result = super().__new__(mcs, name, bases, namespace)
        result._ordered_keys = list(namespace.keys())
        return result

class MyClass(metaclass=OrderedMeta):
    a = 1
    b = 2
    c = 3

print([k for k in MyClass._ordered_keys if not k.startswith('__')])
"""
rust = """
// In Rust, field order is guaranteed in structs
struct MyClass;

impl MyClass {
    const ORDERED_KEYS: [&'static str; 3] = ["a", "b", "c"];
    const A: i32 = 1;
    const B: i32 = 2;
    const C: i32 = 3;
}

fn main() {
    log::info!("{:?}", MyClass::ORDERED_KEYS.to_vec());
}
"""
expected_output = """["a", "b", "c"]"""

