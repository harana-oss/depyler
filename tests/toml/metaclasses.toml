[metadata]
name = "Metaclass Tests"
category = "advanced-oop"

# =============================================================================
# Basic Metaclass
# =============================================================================

[[test]]
name = "type_as_metaclass"
description = "type('MyClass', (Base,), {'attr': value})"
skip = true
skip_reason = "Dynamic type() creation not supported in Rust"
python = """
# Creating a class dynamically with type()
MyClass = type('MyClass', (), {'x': 10, 'method': lambda self: self.x * 2})
obj = MyClass()
print(obj.x)
print(obj.method())
"""

[[test]]
name = "custom_metaclass"
description = "class Meta(type): ..."
skip = true
skip_reason = "Metaclasses are Python-specific; use proc macros in Rust"
python = """
class Meta(type):
    def __new__(mcs, name, bases, namespace):
        namespace['added_by_meta'] = True
        return super().__new__(mcs, name, bases, namespace)

class MyClass(metaclass=Meta):
    pass

obj = MyClass()
print(hasattr(obj, 'added_by_meta'))
print(obj.added_by_meta)
"""

[[test]]
name = "metaclass_keyword"
description = "class MyClass(metaclass=Meta): ..."
skip = true
skip_reason = "Metaclass keyword argument not supported"
python = """
class UpperAttrMeta(type):
    def __new__(mcs, name, bases, namespace):
        uppercase_attrs = {
            (k.upper() if not k.startswith('__') else k): v
            for k, v in namespace.items()
        }
        return super().__new__(mcs, name, bases, uppercase_attrs)

class MyClass(metaclass=UpperAttrMeta):
    x = 10
    
print(hasattr(MyClass, 'X'))
print(MyClass.X)
"""

# =============================================================================
# Metaclass Methods
# =============================================================================

[[test]]
name = "metaclass_new"
description = "def __new__(mcs, name, bases, namespace): ..."
skip = true
skip_reason = "Metaclass __new__ requires runtime type manipulation"
python = """
class TrackedMeta(type):
    _classes = []
    
    def __new__(mcs, name, bases, namespace):
        cls = super().__new__(mcs, name, bases, namespace)
        mcs._classes.append(name)
        return cls

class A(metaclass=TrackedMeta):
    pass

class B(metaclass=TrackedMeta):
    pass

print(TrackedMeta._classes)
"""

[[test]]
name = "metaclass_init"
description = "def __init__(cls, name, bases, namespace): ..."
skip = true
skip_reason = "Metaclass __init__ not supported in transpilation"
python = """
class InitMeta(type):
    def __init__(cls, name, bases, namespace):
        super().__init__(name, bases, namespace)
        cls.initialized = True
        print(f"Initialized {name}")

class MyClass(metaclass=InitMeta):
    pass

print(MyClass.initialized)
"""

[[test]]
name = "metaclass_call"
description = "Control instance creation"
skip = true
skip_reason = "Metaclass __call__ requires custom instantiation logic"
python = """
class CallMeta(type):
    def __call__(cls, *args, **kwargs):
        print(f"Creating instance of {cls.__name__}")
        instance = super().__call__(*args, **kwargs)
        print(f"Instance created")
        return instance

class MyClass(metaclass=CallMeta):
    def __init__(self, x):
        self.x = x

obj = MyClass(42)
print(obj.x)
"""

[[test]]
name = "metaclass_prepare"
description = "@classmethod def __prepare__(mcs, name, bases): ..."
skip = true
skip_reason = "Metaclass __prepare__ not supported"
python = """
from collections import OrderedDict

class OrderedMeta(type):
    @classmethod
    def __prepare__(mcs, name, bases):
        return OrderedDict()
    
    def __new__(mcs, name, bases, namespace):
        result = super().__new__(mcs, name, bases, namespace)
        result._ordered_keys = list(namespace.keys())
        return result

class MyClass(metaclass=OrderedMeta):
    a = 1
    b = 2
    c = 3

print([k for k in MyClass._ordered_keys if not k.startswith('__')])
"""

# =============================================================================
# Metaclass Use Cases
# =============================================================================

[[test]]
name = "singleton_metaclass"
description = "Metaclass ensuring single instance"
skip = true
skip_reason = "Singleton pattern should use static Once cell in Rust"
python = """
class Singleton(type):
    _instances = {}
    
    def __call__(cls, *args, **kwargs):
        if cls not in cls._instances:
            cls._instances[cls] = super().__call__(*args, **kwargs)
        return cls._instances[cls]

class Database(metaclass=Singleton):
    def __init__(self):
        self.connection = "Connected"

db1 = Database()
db2 = Database()
print(db1 is db2)
print(db1.connection)
"""

[[test]]
name = "registration_metaclass"
description = "Auto-register classes on creation"
skip = true
skip_reason = "Use inventory crate or static registry in Rust"
python = """
class RegistryMeta(type):
    registry = {}
    
    def __new__(mcs, name, bases, namespace):
        cls = super().__new__(mcs, name, bases, namespace)
        if name != 'Base':
            mcs.registry[name] = cls
        return cls

class Base(metaclass=RegistryMeta):
    pass

class PluginA(Base):
    pass

class PluginB(Base):
    pass

print(sorted(RegistryMeta.registry.keys()))
"""

[[test]]
name = "validation_metaclass"
description = "Validate class definition at creation"
skip = true
skip_reason = "Use compile-time checks or proc macros in Rust"
python = """
class ValidatedMeta(type):
    def __new__(mcs, name, bases, namespace):
        if 'required_method' not in namespace and name != 'Base':
            raise TypeError(f"{name} must define 'required_method'")
        return super().__new__(mcs, name, bases, namespace)

class Base(metaclass=ValidatedMeta):
    pass

class Valid(Base):
    def required_method(self):
        return "OK"

obj = Valid()
print(obj.required_method())

# This would raise TypeError:
# class Invalid(Base):
#     pass
"""

[[test]]
name = "attribute_injection"
description = "Add attributes/methods via metaclass"
skip = true
skip_reason = "Use proc macros or trait implementations in Rust"
python = """
class InjectorMeta(type):
    def __new__(mcs, name, bases, namespace):
        # Inject a to_dict method
        def to_dict(self):
            return {k: v for k, v in self.__dict__.items()}
        namespace['to_dict'] = to_dict
        namespace['__class_name__'] = name
        return super().__new__(mcs, name, bases, namespace)

class MyClass(metaclass=InjectorMeta):
    def __init__(self, x, y):
        self.x = x
        self.y = y

obj = MyClass(10, 20)
print(obj.to_dict())
print(obj.__class_name__)
"""

