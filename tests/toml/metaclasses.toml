[[test]]
name = "singleton_metaclass"
description = "Metaclass ensuring single instance"
python = """
class Singleton(type):
    _instances = {}
    
    def __call__(cls, *args, **kwargs):
        if cls not in cls._instances:
            cls._instances[cls] = super().__call__(*args, **kwargs)
        return cls._instances[cls]

class Database(metaclass=Singleton):
    def __init__(self):
        self.connection = "Connected"

db1 = Database()
db2 = Database()
print(db1 is db2)
print(db1.connection)
"""
rust = """
// In Rust, we use OnceCell or lazy_static for singleton
use std::sync::OnceLock;

static DATABASE: OnceLock<Database> = OnceLock::new();

struct Database {
    connection: &'static str,
}

impl Database {
    fn get_instance() -> &'static Database {
        DATABASE.get_or_init(|| Database { connection: "Connected" })
    }
}

fn main() {
    let db1 = Database::get_instance();
    let db2 = Database::get_instance();
    log::info!("{}", std::ptr::eq(db1, db2));
    log::info!("{}", db1.connection);
}
"""
expected_output = """true
Connected"""

[[test]]
name = "registration_metaclass"
description = "Auto-register classes on creation"
python = """
class RegistryMeta(type):
    registry = {}
    
    def __new__(mcs, name, bases, namespace):
        cls = super().__new__(mcs, name, bases, namespace)
        if name != 'Base':
            mcs.registry[name] = cls
        return cls

class Base(metaclass=RegistryMeta):
    pass

class PluginA(Base):
    pass

class PluginB(Base):
    pass

print(sorted(RegistryMeta.registry.keys()))
"""
rust = """
// In Rust, we use the inventory crate or a manual registry
use std::collections::HashMap;
use std::sync::Mutex;

static REGISTRY: Mutex<HashMap<&str, fn()>> = Mutex::new(HashMap::new());

fn register(name: &'static str, _factory: fn()) {
    REGISTRY.lock().unwrap().insert(name, _factory);
}

fn main() {
    register("PluginA", || {});
    register("PluginB", || {});
    
    let mut keys: Vec<_> = REGISTRY.lock().unwrap().keys().copied().collect();
    keys.sort();
    log::info!("{:?}", keys);
}
"""
expected_output = """["PluginA", "PluginB"]"""

[[test]]
name = "validation_metaclass"
description = "Validate class definition at creation"
python = """
class ValidatedMeta(type):
    def __new__(mcs, name, bases, namespace):
        if 'required_method' not in namespace and name != 'Base':
            raise TypeError(f"{name} must define 'required_method'")
        return super().__new__(mcs, name, bases, namespace)

class Base(metaclass=ValidatedMeta):
    pass

class Valid(Base):
    def required_method(self):
        return "OK"

obj = Valid()
print(obj.required_method())

# This would raise TypeError:
# class Invalid(Base):
#     pass
"""
rust = """
// In Rust, we use traits to enforce required methods
trait HasRequiredMethod {
    fn required_method(&self) -> &'static str;
}

struct Valid;

impl HasRequiredMethod for Valid {
    fn required_method(&self) -> &'static str {
        "OK"
    }
}

fn main() {
    let obj = Valid;
    log::info!("{}", obj.required_method());
}
"""
expected_output = "OK"

[[test]]
name = "attribute_injection"
description = "Add attributes/methods via metaclass"
python = """
class InjectorMeta(type):
    def __new__(mcs, name, bases, namespace):
        # Inject a to_dict method
        def to_dict(self):
            return {k: v for k, v in self.__dict__.items()}
        namespace['to_dict'] = to_dict
        namespace['__class_name__'] = name
        return super().__new__(mcs, name, bases, namespace)

class MyClass(metaclass=InjectorMeta):
    def __init__(self, x, y):
        self.x = x
        self.y = y

obj = MyClass(10, 20)
print(obj.to_dict())
print(obj.__class_name__)
"""
rust = """
// In Rust, we use traits or derive macros for attribute injection
use std::collections::HashMap;

struct MyClass {
    x: i32,
    y: i32,
}

impl MyClass {
    const CLASS_NAME: &'static str = "MyClass";
    
    fn new(x: i32, y: i32) -> Self {
        MyClass { x, y }
    }
    
    fn to_dict(&self) -> HashMap<String, i32> {
        let mut map = HashMap::new();
        map.insert("x".to_string(), self.x);
        map.insert("y".to_string(), self.y);
        map
    }
}

fn main() {
    let obj = MyClass::new(10, 20);
    log::info!("{:?}", obj.to_dict());
    log::info!("{}", MyClass::CLASS_NAME);
}
"""
expected_output = """{"x": 10, "y": 20}
MyClass"""

