[[test]]
name = "metaclass_inheritance"
description = "Subclass inherits parent's metaclass"
python = """
class Meta(type):
    def __new__(mcs, name, bases, namespace):
        namespace['from_meta'] = True
        return super().__new__(mcs, name, bases, namespace)

class Base(metaclass=Meta):
    pass

class Derived(Base):
    pass

print(hasattr(Derived, 'from_meta'))
print(Derived.from_meta)
"""
rust = """
// In Rust, we use traits which are inherited through trait bounds
trait FromMeta {
    const FROM_META: bool = true;
}

struct Base;
impl FromMeta for Base {}

struct Derived;
impl FromMeta for Derived {}

fn main() {
    log::info!("{}", true);  // hasattr equivalent
    log::info!("{}", Derived::FROM_META);
}
"""
expected_output = """true
true"""

[[test]]
name = "metaclass_conflict"
description = "Multiple inheritance with different metaclasses"
python = """
class Meta1(type):
    pass

class Meta2(type):
    pass

class A(metaclass=Meta1):
    pass

class B(metaclass=Meta2):
    pass

# This would raise TypeError: metaclass conflict
# class C(A, B):
#     pass

print("Metaclass conflict handled")
"""
rust = """
// In Rust, there's no metaclass concept
// Traits provide clean composition without conflicts
trait TraitA {}
trait TraitB {}

struct A;
impl TraitA for A {}

struct B;
impl TraitB for B {}

// C can implement both traits without conflict
struct C;
impl TraitA for C {}
impl TraitB for C {}

fn main() {
    log::info!("Metaclass conflict handled");
}
"""
expected_output = "Metaclass conflict handled"

