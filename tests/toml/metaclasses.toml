[metadata]
name = "Metaclass Tests"
category = "advanced-oop"

# =============================================================================
# Basic Metaclass
# =============================================================================

[[test]]
name = "type_as_metaclass"
description = "type('MyClass', (Base,), {'attr': value})"
python = """
# Creating a class dynamically with type()
MyClass = type('MyClass', (), {'x': 10, 'method': lambda self: self.x * 2})
obj = MyClass()
print(obj.x)
print(obj.method())
"""
rust = """// Transpilation failed
// Dynamic type() creation is not supported in Rust
// Use static struct definitions instead:
//
// struct MyClass {
//     x: i32,
// }
//
// impl MyClass {
//     fn new() -> Self { MyClass { x: 10 } }
//     fn method(&self) -> i32 { self.x * 2 }
// }
"""

[[test]]
name = "custom_metaclass"
description = "class Meta(type): ..."
python = """
class Meta(type):
    def __new__(mcs, name, bases, namespace):
        namespace['added_by_meta'] = True
        return super().__new__(mcs, name, bases, namespace)

class MyClass(metaclass=Meta):
    pass

obj = MyClass()
print(hasattr(obj, 'added_by_meta'))
print(obj.added_by_meta)
"""
rust = """
// In Rust, we use derive macros or traits for similar behavior
// The #[derive(AddMeta)] macro would add the attribute

struct MyClass {
    added_by_meta: bool,
}

impl Default for MyClass {
    fn default() -> Self {
        MyClass { added_by_meta: true }
    }
}

fn main() {
    let obj = MyClass::default();
    log::info!("{}", true); // hasattr equivalent
    log::info!("{}", obj.added_by_meta);
}
"""
expected_output = """true
true"""

[[test]]
name = "metaclass_keyword"
description = "class MyClass(metaclass=Meta): ..."
python = """
class UpperAttrMeta(type):
    def __new__(mcs, name, bases, namespace):
        uppercase_attrs = {
            (k.upper() if not k.startswith('__') else k): v
            for k, v in namespace.items()
        }
        return super().__new__(mcs, name, bases, uppercase_attrs)

class MyClass(metaclass=UpperAttrMeta):
    x = 10
    
print(hasattr(MyClass, 'X'))
print(MyClass.X)
"""
rust = """
// In Rust, attribute transformation happens at compile-time via macros
// We simulate with explicit uppercase constant
struct MyClass;

impl MyClass {
    const X: i32 = 10;  // Uppercase by convention
}

fn main() {
    log::info!("{}", true); // MyClass has X
    log::info!("{}", MyClass::X);
}
"""
expected_output = """true
10"""

