# =============================================================================
# Best Practices
# =============================================================================

[[test]]
name = "all_explicit_better"
description = "Avoid * imports, use explicit"

python = '''
# Best practice: avoid star imports, use explicit imports
# Instead of: from module import *
# Use: from module import foo, bar, baz
# This makes dependencies clear and avoids namespace pollution
result = True
print("Explicit imports are better than star imports")
'''

rust = '''
    // Rust doesn't have star imports by default
    // Must explicitly list what to import: use module::{Item1, Item2};
    // Or import entire module: use module;
    // This enforces clarity and prevents namespace pollution
    let result = true;
    log::info!("Rust enforces explicit imports");
'''


