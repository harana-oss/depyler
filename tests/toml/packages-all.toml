# =============================================================================
# Without __all__
# =============================================================================

[[test]]
name = "all_missing"
description = "Star imports non-underscore names"

python = '''
# When __all__ is not defined, star imports non-underscore names
# Example module without __all__:
# Contents: x = 1, y = 2, _private = 3
# from module import * would import x and y, but not _private
result = True
print("Without __all__, star imports all non-underscore names")
'''

rust = '''
    // In Rust, all items must be explicitly exported with pub
    // There's no equivalent to Python's star import
    // All exports are explicit via pub keyword
    let result = true;
    log::info!("Rust requires explicit pub exports");
'''


[[test]]
name = "all_underscore"
description = "_private not star imported"

python = '''
# _private not star imported
# Module with: x = 1, _private = 2
# from module import * imports x but not _private
# Names starting with _ are considered private
result = True
print("Names starting with underscore are not star-imported")
'''

rust = '''
    // In Rust, items without pub are module-private
    // No star imports; visibility is explicit
    // Private items cannot be accessed outside module
    let result = true;
    log::info!("Rust uses pub keyword for visibility");
'''


