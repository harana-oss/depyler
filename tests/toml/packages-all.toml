[metadata]
name = "Package __all__ Tests"
category = "imports"

# =============================================================================
# Basic __all__
# =============================================================================

[[test]]
name = "all_list"
description = "__all__ = ['func1', 'Class1']"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


