[[test]]
name = "all_reexport"
description = "Control what package exposes"

python = '''
# __all__ controls what package exposes
# Example: __all__ = ['foo', 'bar']
# Only foo and bar are exported with star import
# Even if module has baz, it won't be star-imported
result = True
print("__all__ controls package public API")
'''

rust = '''
    // In Rust, use pub use for re-exports
    // Example: pub use internal_module::Item;
    // This makes Item available at current module level
    let result = true;
    log::info!("Rust uses 'pub use' for re-exports");
'''


