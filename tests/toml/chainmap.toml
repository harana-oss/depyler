rust = '''
use std::collections::HashMap;

pub fn test_chainmap_push() -> (i32, i32) {
    let mut outer = HashMap::new();
    outer.insert("x".to_string(), 1);
    
    let mut maps1 = vec![outer.clone()];
    
    let mut new_scope = HashMap::new();
    new_scope.insert("x".to_string(), 2);
    let mut maps2 = vec![new_scope];
    maps2.extend(maps1.clone());
    
    let val2 = *maps2[0].get("x").unwrap();
    let val1 = *maps1[0].get("x").unwrap();
    
    return (val2, val1);
}
