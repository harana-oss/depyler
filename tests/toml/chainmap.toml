[[test]]
name = "chainmap_copy"
description = "c.copy() shallow copy"

python = '''
from collections import ChainMap

def test_chainmap_copy() -> dict:
    dict1 = {'a': 1, 'b': 2}
    dict2 = {'c': 3}
    c = ChainMap(dict1, dict2)
    return dict(c.copy())
'''

rust = '''
use std::collections::HashMap;

pub fn test_chainmap_copy() -> HashMap<String, i32> {
    let mut dict1 = HashMap::new();
    dict1.insert("a".to_string(), 1);
    dict1.insert("b".to_string(), 2);
    
    let mut dict2 = HashMap::new();
    dict2.insert("c".to_string(), 3);
    
    let maps = vec![dict1, dict2];
    
    let mut result = HashMap::new();
    let mut seen_keys = std::collections::HashSet::new();
    
    for map in &maps {
        for (key, value) in map {
            if seen_keys.insert(key.clone()) {
                result.insert(key.clone(), *value);
            }
        }
    }
    
    return result;
}
'''


