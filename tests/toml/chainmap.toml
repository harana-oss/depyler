# =============================================================================
# Creating ChainMap
# =============================================================================

[[test]]
name = "chainmap_create"
description = "ChainMap(dict1, dict2)"

python = '''
from collections import ChainMap

def test_chainmap_create() -> ChainMap:
    dict1 = {'a': 1, 'b': 2}
    dict2 = {'b': 3, 'c': 4}
    return ChainMap(dict1, dict2)
'''

rust = '''
use std::collections::HashMap;

#[derive(Debug, Clone)]
pub struct ChainMap {
    maps: Vec<HashMap<String, i32>>,
}

impl ChainMap {
    pub fn new(maps: Vec<HashMap<String, i32>>) -> Self {
        Self { maps }
    }
    
    pub fn get(&self, key: &str) -> Option<&i32> {
        for map in &self.maps {
            if let Some(value) = map.get(key) {
                return Some(value);
            }
        }
        None
    }
}

pub fn test_chainmap_create() -> ChainMap {
    let mut dict1 = HashMap::new();
    dict1.insert("a".to_string(), 1);
    dict1.insert("b".to_string(), 2);
    
    let mut dict2 = HashMap::new();
    dict2.insert("b".to_string(), 3);
    dict2.insert("c".to_string(), 4);
    
    return ChainMap::new(vec![dict1, dict2]);
}
'''


