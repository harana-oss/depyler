rust = '''
use std::collections::HashMap;

pub fn test_chainmap_template() -> String {
    let mut global_vars = HashMap::new();
    global_vars.insert("name".to_string(), "World".to_string());
    
    let mut local_vars = HashMap::new();
    local_vars.insert("greeting".to_string(), "Hello".to_string());
    
    let maps = vec![local_vars, global_vars];
    
    let mut greeting = String::new();
    let mut name = String::new();
    
    for map in &maps {
        if greeting.is_empty() {
            if let Some(g) = map.get("greeting") {
                greeting = g.clone();
            }
        }
        if name.is_empty() {
            if let Some(n) = map.get("name") {
                name = n.clone();
            }
        }
    }
    
    return format!("{} {}", greeting, name);
}
'''


