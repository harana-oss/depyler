[[test]]
name = "chainmap_config"
description = "ChainMap(user_config, default_config)"

python = '''
from collections import ChainMap

def test_chainmap_config() -> str:
    default_config = {'host': 'localhost', 'port': 8080}
    user_config = {'port': 3000}
    config = ChainMap(user_config, default_config)
    return f"{config['host']}:{config['port']}"
'''

rust = '''
use std::collections::HashMap;

pub fn test_chainmap_config() -> String {
    let mut default_config = HashMap::new();
    default_config.insert("host".to_string(), "localhost".to_string());
    default_config.insert("port".to_string(), "8080".to_string());
    
    let mut user_config = HashMap::new();
    user_config.insert("port".to_string(), "3000".to_string());
    
    let maps = vec![user_config, default_config];
    
    let mut host = String::new();
    let mut port = String::new();
    
    for map in &maps {
        if host.is_empty() {
            if let Some(h) = map.get("host") {
                host = h.clone();
            }
        }
        if port.is_empty() {
            if let Some(p) = map.get("port") {
                port = p.clone();
            }
        }
    }
    
    return format!("{}:{}", host, port);
}
'''


[[test]]
name = "chainmap_template"
