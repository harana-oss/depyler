description = "Basic slice assignment"

python = '''
def replace_middle(items: list[int], start: int, end: int, new: list[int]):
    items[start:end] = new
'''

rust = '''
pub fn replace_middle(mut items: Vec<i32>, start: i32, end: i32, new: &Vec<i32>) {
    items.clear();
    items.extend(new);
}
'''

