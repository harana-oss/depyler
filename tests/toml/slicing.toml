[[test]]
name = "slice_step"
description = "Slice with step (items[::n])"

python = '''
def every_nth(items: list[int], n: int) -> list[int]:
    return items[::n]
'''

rust = '''
pub fn every_nth(items: &Vec<i32>, n: i32) -> Vec<i32> {
    return {
        let base = &items;
        let step = n;
        if step == 1 {
            base.clone()
        } else if step > 0 {
            base.iter().step_by(step as usize).cloned().collect::<Vec<_>>()
        } else if step == -1 {
            base.iter().rev().cloned().collect::<Vec<_>>()
        } else {
            let abs_step = (-step) as usize;
            base.iter().rev().step_by(abs_step).cloned().collect::<Vec<_>>()
        }
    }
'''

[[test]]
name = "slice_step_with_range"
description = "Slice with start, end, and step"

python = '''
def range_step(items: list[int], start: int, end: int, step: int) -> list[int]:
    return items[start:end:step]
'''

rust = '''
pub fn range_step(items: &Vec<i32>, start: i32, end: i32, step: i32) -> Vec<i32> {
    return {
        let base = &items;
        let start = (start).max(0) as usize;
        let stop = (end).max(0) as usize;
        let step = step;
        if step == 1 {
            if start < base.len() {
                base[start..stop.min(base.len())].to_vec()
            } else {
                Vec::new()
            }
        } else if step > 0 {
            base[start..stop.min(base.len())]
                .iter()
                .step_by(step as usize)
                .cloned()
                .collect::<Vec<_>>()
        } else {
            let abs_step = (-step) as usize;
            if start < base.len() {
                base[start..stop.min(base.len())]
                    .iter()
                    .rev()
                    .step_by(abs_step)
                    .cloned()
                    .collect::<Vec<_>>()
            } else {
                Vec::new()
            }
        }
    }
'''

