        } else if step == -1 {
            base.iter().rev().cloned().collect::<Vec<_>>()
        } else {
            let abs_step = (-step) as usize;
            base.iter().rev().step_by(abs_step).cloned().collect::<Vec<_>>()
        }
    }
'''

