[[test]]
name = "slice_start_only"
description = "Slice with start index only (items[n:])"

python = '''
def skip_first_n(items: list[int], n: int) -> list[int]:
    return items[n:]
'''

rust = '''
pub fn skip_first_n(items: &Vec<i32>, n: i32) -> Vec<i32> {
    return {
        let base = &items;
        let start = (n).max(0) as usize;
        if start < base.len() {
            base[start..].to_vec()
        } else {
            Vec::new()
        }
    }
'''

[[test]]
name = "slice_end_only"
description = "Slice with end index only (items[:n])"

python = '''
def first_n(items: list[int], n: int) -> list[int]:
    return items[:n]
'''

rust = '''
pub fn first_n(items: &Vec<i32>, n: i32) -> Vec<i32> {
    return {
        let base = &items;
        let stop = (n).max(0) as usize;
        base[..stop.min(base.len())].to_vec()
    }
'''

