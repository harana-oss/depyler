'''

[[test]]
name = "string_slice_start"
description = "String slice from start"

python = '''
def skip_chars(s: str, n: int) -> str:
    return s[n:]
'''

rust = '''
pub fn skip_chars(s: String, n: i32) -> String {
    return {
        let base = &s;
        let start_idx: i32 = n;
        let len = base.chars().count() as i32;
        let actual_start = if start_idx < 0 {
            (len + start_idx).max(0) as usize
        } else {
            start_idx.min(len) as usize
        };
        base.chars().skip(actual_start).collect::<String>()
    }
'''

[[test]]
name = "string_slice_end"
description = "String slice to end"

python = '''
def first_chars(s: str, n: int) -> str:
    return s[:n]
'''

rust = '''
pub fn first_chars(s: String, n: i32) -> String {
    return {
        let base = &s;
        let stop_idx: i32 = n;
        let len = base.chars().count() as i32;
        let actual_stop = if stop_idx < 0 {
            (len + stop_idx).max(0) as usize
        } else {
            stop_idx.min(len) as usize
        };
        base.chars().take(actual_stop).collect::<String>()
    }
'''

