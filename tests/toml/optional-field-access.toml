[[test]]
name = "optional_param_field_access"
description = "Field access on Optional parameter adds unwrap"

python = '''
from typing import Optional

class Config:
    host: str
    port: int

def get_host(config: Optional[Config]) -> str:
    return config.host
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Config {
    pub host: String,
    pub port: i32,
}
pub fn get_host(config: Option<Config>) -> String {
    return config.as_ref().unwrap().host;
}
'''

[[test]]
name = "optional_local_var_field_access"
description = "Field access on Optional local variable adds unwrap"

python = '''
from typing import Optional

class Result:
    score: int

def get_result() -> Optional[Result]:
    return None

def process() -> int:
    result: Optional[Result] = get_result()
    return result.score
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct Result {
    pub score: i32,
}
impl Result {
    pub fn new(score: i32) -> Self {
        Self { score }
    }
}
pub fn get_result() -> Option<Result> {
    return None;
}
pub fn process() -> i32 {
    let result: Option<Result> = Some(get_result());
    return result.as_ref().unwrap().score;
}
'''

[[test]]
name = "optional_class_field_chain_access"
description = "Chained field access through Optional class field adds unwrap"

python = '''
from typing import Optional

class Inner:
    value: int

class Outer:
    inner: Optional[Inner]

def get_inner_value(obj: Outer) -> int:
    return obj.inner.value
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct Inner {
    pub value: i32,
}
impl Inner {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone)]
pub struct Outer {
    pub inner: Option<Inner>,
}
pub fn get_inner_value(obj: &Outer) -> i32 {
    return obj.inner.as_ref().unwrap().value;
}
'''
