[metadata]
name = "Optional Field Access Unwrap Tests"
category = "optional-types"
description = "Tests that field access on Option types automatically adds unwrap()"

[[test]]
name = "dict_get_field_access"
description = "Field access on dict.get() result adds unwrap"

python = '''
class Person:
    name: str
    age: int

def get_person_name(people: dict[str, Person]) -> str:
    person = people.get("alice")
    return person.name
'''

rust = '''
use std::collections::HashMap;
#[derive(Debug, Clone)]
pub struct Person {
    pub name: String,
    pub age: i32,
}
pub fn get_person_name(people: &HashMap<String, Person>) -> String {
    let person = people.get("alice").cloned();
    return person.as_ref().unwrap().name;
}
'''

