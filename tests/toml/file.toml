[[test]]
name = "open_error_handling"
description = "Test open() with try/except error handling"

python = '''
def safe_read(path: str) -> str:
    try:
        with open(path) as f:
            return f.read()
    except FileNotFoundError:
        return ""
'''

rust = '''
pub fn safe_read(path: String) -> String {
    {
        let mut f = std::fs::File::open(path)?;
        return {
            let mut content = String::new();
            f.read_to_string(&mut content)?;
            content
        };
        return "".to_string();
    }
}
'''

# =============================================================================
# File Mode Tracking Tests
# Current implementation defaults to text mode. Tests document this behavior.
# =============================================================================

[[test]]
name = "file_read_text_mode"
description = "f.read() on text mode file generates read_to_string()"

python = '''
def read_text_file(path: str) -> str:
    with open(path, 'r') as f:
        content = f.read()
        return content
'''

rust = '''
pub fn read_text_file(path: String) -> String {
    let mut f = std::fs::File::open(path)?;
    let content = {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    };
    return content;
}
'''

[[test]]
name = "file_readlines_text_mode"
description = "f.readlines() in text mode generates line-based iteration"

python = '''
def read_lines(path: str) -> list:
    with open(path, 'r') as f:
        lines = f.readlines()
        return lines
'''

rust = '''
use std::io::BufRead;
pub fn read_lines(path: String) -> Vec<String> {
    let mut f = std::fs::File::open(path)?;
    let lines = std::io::BufReader::new(&f)
        .lines()
        .collect::<Vec<_>>()?
        .iter()
        .map(|s| s.to_string())
        .collect();
    return lines;
}
'''

[[test]]
name = "file_readline_single"
description = "f.readline() reads a single line from file"

python = '''
def read_first_line(path: str) -> str:
    with open(path, 'r') as f:
        line = f.readline()
        return line
'''

rust = '''
use std::io::BufRead;
pub fn read_first_line(path: String) -> String {
    let mut f = std::fs::File::open(path)?;
    let mut line = String::new();
    std::io::BufReader::new(&f).read_line(&mut line)?;
    return line;
}
'''

