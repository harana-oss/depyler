[metadata]
name = "open-builtin"
description = "Tests for Python open() builtin function"

# ========== READ MODES ==========

[[test]]
name = "open_read_mode"
description = "Test open() with read mode 'r'"

python = '''
def read_file(path: str) -> str:
    with open(path, 'r') as f:
        return f.read()
'''

rust = '''
pub fn read_file(path: String) -> String {
    let mut f = std::fs::File::open(path)?;
    return {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    }
'''

[[test]]
name = "open_default_mode"
description = "Test open() with default mode (read)"

python = '''
def open_default(path: str) -> str:
    with open(path) as f:
        return f.read()
'''

rust = '''
pub fn open_default(path: String) -> String {
    let mut f = std::fs::File::open(path)?;
    return {
