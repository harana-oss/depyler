[[test]]
name = "file_iteration"
description = "Iterating over file lines"

python = '''
def count_lines(path: str) -> int:
    count = 0
    with open(path, 'r') as f:
        for line in f:
            count += 1
    return count
'''

rust = '''
use std::io::BufRead;
pub fn count_lines(path: String) -> i32 {
    let count = 0;
    let mut f = std::fs::File::open(path)?;
    for line in std::io::BufReader::new(&f).lines() {
        count += 1;
    }
    return count;
}
'''