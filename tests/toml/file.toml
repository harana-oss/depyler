# ========== ENCODING ==========

[[test]]
name = "open_with_encoding"
description = "Test open() with encoding parameter"
tags = ["open", "file", "encoding", "utf8"]

[test.python]
code = '''
def read_utf8(path: str) -> str:
    with open(path, 'r', encoding='utf-8') as f:
