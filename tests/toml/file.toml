    f.write(content);
}
'''

[[test]]
name = "open_read_write_mode"
description = "Test open() with read+write mode 'r+'"

python = '''
def open_read_write(path: str) -> None:
    with open(path, 'r+') as f:
        content = f.read()
        f.write(content)
'''

rust = '''
pub fn open_read_write(path: String) {
    let mut f = std::fs::File::open(path)?;
    let content = {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    };
    f.write(content);
}
'''

