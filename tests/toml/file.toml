# Open Builtin Tests
# Migrated from test_open_builtin.rs

[metadata]
name = "open-builtin"
description = "Tests for Python open() builtin function"

# ========== READ MODES ==========

[[test]]
name = "open_read_mode"
description = "Test open() with read mode 'r'"

python = '''
def read_file(path: str) -> str:
    with open(path, 'r') as f:
        return f.read()
'''

rust = '''
pub fn read_file(path: String) -> String {
    let mut f = std::fs::File::open(path)?;
    return {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    };
}
'''

[[test]]
name = "open_default_mode"
description = "Test open() with default mode (read)"

python = '''
def open_default(path: str) -> str:
    with open(path) as f:
        return f.read()
'''

rust = '''
pub fn open_default(path: String) -> String {
    let mut f = std::fs::File::open(path)?;
    return {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    };
}
'''

[[test]]
name = "open_write_mode"
description = "Test open() with write mode 'w'"

python = '''
def write_file(path: str, content: str) -> None:
    with open(path, 'w') as f:
        f.write(content)
'''

rust = '''
pub fn write_file(path: String, content: String) {
    let mut f = std::fs::File::create(path)?;
    f.write(content);
}
'''

[[test]]
name = "open_append_mode"
description = "Test open() with append mode 'a'"

python = '''
def append_file(path: str, content: str) -> None:
    with open(path, 'a') as f:
        f.write(content)
'''

rust = '''
pub fn append_file(path: String, content: String) {
    let mut f = std::fs::OpenOptions::new().append(true).create(true).open(path)?;
    f.write(content);
}
'''

[[test]]
name = "open_read_write_mode"
description = "Test open() with read+write mode 'r+'"

python = '''
def open_read_write(path: str) -> None:
    with open(path, 'r+') as f:
        content = f.read()
        f.write(content)
'''

rust = '''
pub fn open_read_write(path: String) {
    let mut f = std::fs::File::open(path)?;
    let content = {
        let mut content = String::new();
        f.read_to_string(&mut content)?;
        content
    };
    f.write(content);
}
'''

