# Open Builtin Tests
# Migrated from test_open_builtin.rs

[metadata]
name = "open-builtin"
description = "Tests for Python open() builtin function"

# ========== READ MODES ==========

[[test]]
name = "open_read_mode"
description = "Test open() with read mode 'r'"
tags = ["open", "file", "read"]

[test.python]
code = '''
def read_file(path: str) -> str:
    with open(path, 'r') as f:
        return f.read()
'''

[test.assertions]
contains_any = [["File::open", "read"]]

[[test]]
name = "open_default_mode"
description = "Test open() with default mode (read)"
tags = ["open", "file", "read", "default"]

[test.python]
code = '''
def open_default(path: str) -> str:
    with open(path) as f:
        return f.read()
'''

[test.assertions]
contains = ["File::open"]

# ========== WRITE MODES ==========

[[test]]
name = "open_write_mode"
description = "Test open() with write mode 'w'"
tags = ["open", "file", "write"]

[test.python]
code = '''
def write_file(path: str, content: str) -> None:
    with open(path, 'w') as f:
        f.write(content)
'''

[test.assertions]
contains_any = [["File::create", "write"]]

[[test]]
name = "open_append_mode"
description = "Test open() with append mode 'a'"
tags = ["open", "file", "append"]

[test.python]
code = '''
def append_file(path: str, content: str) -> None:
    with open(path, 'a') as f:
        f.write(content)
'''

[test.assertions]
contains_any = [["OpenOptions", "append"]]

[[test]]
name = "open_read_write_mode"
description = "Test open() with read+write mode 'r+'"
tags = ["open", "file", "read", "write"]

[test.python]
code = '''
def open_read_write(path: str) -> None:
    with open(path, 'r+') as f:
        content = f.read()
        f.write(content)
'''

[test.assertions]
contains_any = [["OpenOptions", "read"]]

