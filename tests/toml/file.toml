'''

[test.assertions]
contains_any = [["File::open", "read"]]

# ========== CONTEXT MANAGER ==========

[[test]]
name = "open_context_manager"
description = "Test open() with context manager (with statement)"
tags = ["open", "file", "context", "with"]

[test.python]
code = '''
def use_context_manager(path: str) -> str:
    with open(path) as f:
        return f.read()
'''

[test.assertions]
contains = ["File::open"]

# ========== ERROR HANDLING ==========

[[test]]
name = "open_error_handling"
description = "Test open() with try/except error handling"
tags = ["open", "file", "error", "exception"]

[test.python]
code = '''
def safe_read(path: str) -> str:
    try:
        with open(path) as f:
            return f.read()
    except FileNotFoundError:
        return ""
'''

[test.assertions]
contains_any = [["File::open", "Result"]]
