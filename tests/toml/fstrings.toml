[metadata]
name = "F-Strings Tests"
category = "strings"

# =============================================================================
# Basic F-Strings
# =============================================================================

[[test]]
name = "fstring_var"
skip = true
description = "f'{name}'"

python = '''
x = 42
result = f'Value: {x}'
'''

rust = '''
    let x = 42;
    let result = format!("Value: {}", x);
'''


