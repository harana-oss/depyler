# =============================================================================
# @classmethod
# =============================================================================

[[test]]
name = "classmethod_basic"
description = "@classmethod def method(cls): ..."
python = """
class MyClass:
    count = 0
    
    @classmethod
    def increment(cls):
        cls.count += 1
        return cls.count

print(MyClass.increment())
print(MyClass.increment())
"""
rust = """
#[derive(Debug, Copy, Clone)]
pub struct MyClass {}
impl MyClass {
    pub const count: i32 = 0;
    pub fn new() -> Self {
        Self {}
    }
    pub fn increment() {
        cls.count += 1;
        return Self::count;
    }
}
fn main() {
    log::info!("{}", MyClass::increment());
    log::info!("{}", MyClass::increment());
}
"""
expected_output = """1
2"""

