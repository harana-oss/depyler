[[test]]
name = "classmethod_use_case"
description = "Alternative constructors, accessing class state"
python = """
class Person:
    species = "Homo sapiens"
    
    def __init__(self, name):
        self.name = name
    
    @classmethod
    def get_species(cls):
        return cls.species
    
    @classmethod
    def from_birth_year(cls, name, year):
        age = 2023 - year
        return cls(name)

p = Person.from_birth_year("Alice", 1990)
print(Person.get_species())
"""
rust = """
use serde_json;
#[derive(Debug, Clone)]
pub struct Person {
    pub name: serde_json::Value,
}
impl Person {
    pub const species: String = "Homo sapiens".to_string();
    pub fn new(name: serde_json::Value) -> Self {
        Self { name }
    }
    pub fn get_species() {
        return Self::species;
    }
    pub fn from_birth_year(name: serde_json::Value, year: serde_json::Value) {
        let mut age = 2023 - year;
        return Self::new(name);
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "name" => Some(Box::new(self.name.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "name" => {
                if let Some(v) = value.downcast_ref::<serde_json::Value>() {
                    self.name = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
fn main() {
    let p = Person::from_birth_year("Alice", 1990);
    log::info!("{}", Person::get_species());
}
"""
expected_output = "Homo sapiens"

[[test]]
name = "staticmethod_use_case"
description = "Pure utility functions related to class"
python = """
class Validator:
    @staticmethod
    def is_valid_email(email):
        return "@" in email and "." in email
    
    @staticmethod
    def is_valid_phone(phone):
        return len(phone) == 10 and phone.isdigit()

print(Validator.is_valid_email("test@example.com"))
print(Validator.is_valid_phone("1234567890"))
"""
rust = """
use serde_json;
#[derive(Debug, Copy, Clone)]
pub struct Validator {}
impl Validator {
    pub fn new() -> Self {
        Self {}
    }
    pub fn is_valid_email(email: serde_json::Value) -> bool {
        return email.contains_key(&"@".to_string()) && email.contains_key(&".".to_string());
    }
    pub fn is_valid_phone(phone: serde_json::Value) -> bool {
        return phone.len() == 10 && !phone.is_empty() && phone.chars().all(|c| c.is_ascii_digit());
    }
}
fn main() {
    log::info!("{}", Validator::is_valid_email("test@example.com"));
    log::info!("{}", Validator::is_valid_phone("1234567890"));
}
"""
expected_output = """True
True"""

# =============================================================================
# Combining with Other Decorators
# =============================================================================

[[test]]
name = "classmethod_stacked"
description = "Order matters: @decorator @classmethod"
python = """
def uppercase_decorator(func):
    def wrapper(*args, **kwargs):
        result = func(*args, **kwargs)
        return result.upper()
    return wrapper

class MyClass:
    @classmethod
    @uppercase_decorator
    def greet(cls):
        return "hello"

print(MyClass.greet())
"""
rust = """
use serde_json;
#[derive(Debug, Copy, Clone)]
pub struct MyClass {}
impl MyClass {
    pub fn new() -> Self {
        Self {}
    }
    pub fn greet() -> String {
        return "hello".to_string();
    }
}
pub fn uppercase_decorator(func: &serde_json::Value) {
    fn wrapper() -> () {
        let result = func(args);
        return result.to_uppercase();
    }
    return wrapper;
}
fn main() {
    log::info!("{}", MyClass::greet());
}
"""
expected_output = "HELLO"

[[test]]
name = "staticmethod_stacked"
description = "Order matters: @decorator @staticmethod"
python = """
def double_decorator(func):
    def wrapper(*args, **kwargs):
        result = func(*args, **kwargs)
        return result * 2
    return wrapper

class Math:
    @staticmethod
    @double_decorator
    def add_five(x):
        return x + 5

print(Math.add_five(10))
"""
rust = """
use serde_json;
#[derive(Debug, Copy, Clone)]
pub struct Math {}
impl Math {
    pub fn new() -> Self {
        Self {}
    }
    pub fn add_five(x: serde_json::Value) -> i32 {
        return x + 5;
    }
}
pub fn double_decorator(func: &serde_json::Value) {
    fn wrapper() -> () {
        let result = func(args);
        return result * 2;
    }
    return wrapper;
}
fn main() {
    log::info!("{}", Math::add_five(10));
}
"""
expected_output = "30"

