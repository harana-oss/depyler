[[test]]
name = "classmethod_factory"
description = "@classmethod def from_string(cls, s): return cls(...)"
python = """
class Date:
    def __init__(self, year, month, day):
        self.year = year
        self.month = month
        self.day = day
    
    @classmethod
    def from_string(cls, date_string):
        year, month, day = map(int, date_string.split('-'))
        return cls(year, month, day)
    
    def __str__(self):
        return f"{self.year}-{self.month}-{self.day}"

d = Date.from_string("2023-12-25")
print(d)
"""
rust = """
struct Date {
    year: i32,
    month: i32,
    day: i32,
}

impl Date {
    fn new(year: i32, month: i32, day: i32) -> Self {
        Date { year, month, day }
    }

    fn from_string(date_string: &str) -> Self {
        let parts: Vec<i32> = date_string.split('-').map(|s| s.parse().unwrap()).collect();
        Date::new(parts[0], parts[1], parts[2])
    }
}

impl std::fmt::Display for Date {
    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {
        write!(f, "{}-{}-{}", self.year, self.month, self.day)
    }
}

fn main() {
    let d = Date::from_string("2023-12-25");
    log::info!("{}", d);
}
"""
expected_output = "2023-12-25"

[[test]]
name = "classmethod_instance_call"
description = "instance.classmethod() works (cls is class)"
python = """
class MyClass:
    value = 100
    
    @classmethod
    def get_value(cls):
        return cls.value

obj = MyClass()
print(obj.get_value())
print(MyClass.get_value())
"""
rust = """
struct MyClass;

impl MyClass {
    const VALUE: i32 = 100;

    fn get_value() -> i32 {
        Self::VALUE
    }
}

fn main() {
    let _obj = MyClass;
    log::info!("{}", MyClass::get_value());
    log::info!("{}", MyClass::get_value());
}
"""
expected_output = """100
100"""

[[test]]
name = "classmethod_inheritance"
description = "Subclass.parent_classmethod() gets subclass as cls"
python = """
class Parent:
    @classmethod
    def who_am_i(cls):
        return cls.__name__

class Child(Parent):
    pass

print(Parent.who_am_i())
print(Child.who_am_i())
"""
rust = """
struct Parent;
struct Child;

impl Parent {
    fn who_am_i() -> &'static str {
        "Parent"
    }
}

impl Child {
    fn who_am_i() -> &'static str {
        "Child"
    }
}

fn main() {
    log::info!("{}", Parent::who_am_i());
    log::info!("{}", Child::who_am_i());
}
"""
expected_output = """Parent
Child"""

