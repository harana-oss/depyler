[[test]]
name = "classmethod_chain"
description = "cls.other_classmethod() from classmethod"
python = """
class Calculator:
    @classmethod
    def add(cls, a, b):
        return a + b
    
    @classmethod
    def add_and_double(cls, a, b):
        return cls.add(a, b) * 2

print(Calculator.add_and_double(5, 3))
"""
rust = """
use serde_json;
#[derive(Debug, Copy, Clone)]
pub struct Calculator {}
impl Calculator {
    pub fn new() -> Self {
        Self {}
    }
    pub fn add(a: serde_json::Value, b: serde_json::Value) {
        return a + b;
    }
    pub fn add_and_double(a: serde_json::Value, b: serde_json::Value) -> i32 {
        return Self::add(a, b) * 2;
    }
}
fn main() {
    log::info!("{}", Calculator::add_and_double(5, 3));
}
"""
expected_output = "16"

[[test]]
name = "classmethod_calls_instance"
description = "Cannot call instance methods from classmethod directly"
python = """
class MyClass:
    def instance_method(self):
        return "instance"
    
    @classmethod
    def class_method(cls):
        # Need to create instance first
        obj = cls()
        return obj.instance_method()

print(MyClass.class_method())
"""
rust = """
#[derive(Debug, Copy, Clone)]
pub struct MyClass {}
impl MyClass {
    pub fn new() -> Self {
        Self {}
    }
    pub fn instance_method(&self) -> String {
        return "instance".to_string();
    }
    pub fn class_method() {
        let mut obj = Self::new();
        return obj.instance_method();
    }
}
fn main() {
    log::info!("{}", MyClass::class_method());
}
"""
expected_output = "instance"

