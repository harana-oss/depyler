[[test]]
name = "classmethod_factory"
description = "@classmethod def from_string(cls, s): return cls(...)"
python = """
class Date:
    def __init__(self, year, month, day):
        self.year = year
        self.month = month
        self.day = day
    
    @classmethod
    def from_string(cls, date_string):
        year, month, day = map(int, date_string.split('-'))
        return cls(year, month, day)
    
    def __str__(self):
        return f"{self.year}-{self.month}-{self.day}"

d = Date.from_string("2023-12-25")
print(d)
"""
rust = """
use serde_json;
#[derive(Debug, Clone)]
pub struct Date {
    pub year: serde_json::Value,
    pub month: serde_json::Value,
    pub day: serde_json::Value,
}
impl Date {
    pub fn new(year: serde_json::Value, month: serde_json::Value, day: serde_json::Value) -> Self {
        Self { year, month, day }
    }
    pub fn from_string(date_string: serde_json::Value) {
        let (mut year, mut month, mut day) = map(
            int,
            date_string
                .split("-".to_string())
                .map(|s| s.to_string())
                .collect(),
        );
        return Self::new(year, month, day);
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "year" => Some(Box::new(self.year.clone()) as Box<dyn std::any::Any>),
            "month" => Some(Box::new(self.month.clone()) as Box<dyn std::any::Any>),
            "day" => Some(Box::new(self.day.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "year" => {
                if let Some(v) = value.downcast_ref::<serde_json::Value>() {
                    self.year = v.clone();
                    true
                } else {
                    false
                }
            }
            "month" => {
                if let Some(v) = value.downcast_ref::<serde_json::Value>() {
                    self.month = v.clone();
                    true
                } else {
                    false
                }
            }
            "day" => {
                if let Some(v) = value.downcast_ref::<serde_json::Value>() {
                    self.day = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
fn main() {
    let d = Date::from_string("2023-12-25");
    log::info!("{}", d);
}
"""
expected_output = "2023-12-25"

