[[test]]
name = "staticmethod_utility"
description = "Helper function namespaced to class"
python = """
class StringUtils:
    @staticmethod
    def is_palindrome(s):
        return s == s[::-1]

print(StringUtils.is_palindrome("racecar"))
print(StringUtils.is_palindrome("hello"))
"""
rust = """
struct StringUtils;

impl StringUtils {
    fn is_palindrome(s: &str) -> bool {
        let chars: Vec<char> = s.chars().collect();
        let reversed: String = chars.iter().rev().collect();
        s == reversed
    }
}

fn main() {
    log::info!("{}", StringUtils::is_palindrome("racecar"));
    log::info!("{}", StringUtils::is_palindrome("hello"));
}
"""
expected_output = """True
False"""

