[metadata]
name = "Class Methods Tests"
category = "advanced-oop"

# =============================================================================
# @classmethod
# =============================================================================

[[test]]
name = "classmethod_basic"
description = "@classmethod def method(cls): ..."
python = """
class MyClass:
    count = 0
    
    @classmethod
    def increment(cls):
        cls.count += 1
        return cls.count

print(MyClass.increment())
print(MyClass.increment())
"""
rust = """
struct MyClass;

static mut COUNT: i32 = 0;

impl MyClass {
    fn increment() -> i32 {
        unsafe {
            COUNT += 1;
            COUNT
        }
    }
}

fn main() {
    log::info!("{}", MyClass::increment());
    log::info!("{}", MyClass::increment());
}
"""
expected_output = """1
2"""

