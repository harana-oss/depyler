[[test]]
name = "classmethod_chain"
description = "cls.other_classmethod() from classmethod"
python = """
class Calculator:
    @classmethod
    def add(cls, a, b):
        return a + b
    
    @classmethod
    def add_and_double(cls, a, b):
        return cls.add(a, b) * 2

print(Calculator.add_and_double(5, 3))
"""
rust = """
struct Calculator;

impl Calculator {
    fn add(a: i32, b: i32) -> i32 {
        a + b
    }

    fn add_and_double(a: i32, b: i32) -> i32 {
        Self::add(a, b) * 2
    }
}

fn main() {
    log::info!("{}", Calculator::add_and_double(5, 3));
}
"""
expected_output = "16"

[[test]]
name = "classmethod_calls_instance"
description = "Cannot call instance methods from classmethod directly"
python = """
class MyClass:
    def instance_method(self):
        return "instance"
    
    @classmethod
    def class_method(cls):
        # Need to create instance first
        obj = cls()
        return obj.instance_method()

print(MyClass.class_method())
"""
rust = """
struct MyClass;

impl MyClass {
    fn new() -> Self {
        MyClass
    }

    fn instance_method(&self) -> &'static str {
        "instance"
    }

    fn class_method() -> &'static str {
        let obj = Self::new();
        obj.instance_method()
    }
}

fn main() {
    log::info!("{}", MyClass::class_method());
}
"""
expected_output = "instance"

[[test]]
name = "staticmethod_bare"
description = "Staticmethod doesn't need class/instance"
python = """
class Utils:
    @staticmethod
    def add(a, b):
        return a + b

# Can even assign to variable and call directly
func = Utils.add
print(func(5, 10))
"""
rust = """
struct Utils;

impl Utils {
    fn add(a: i32, b: i32) -> i32 {
        a + b
    }
}

fn main() {
    let func = Utils::add;
    log::info!("{}", func(5, 10));
}
"""
expected_output = "15"

[[test]]
name = "classmethod_descriptor"
description = "How classmethod works as descriptor"
python = """
class MyClass:
    @classmethod
    def method(cls):
        return cls.__name__

# Access the descriptor
descriptor = MyClass.__dict__['method']
print(type(descriptor).__name__)

# Call it
print(MyClass.method())
"""
rust = """
// Rust doesn't have descriptors
// Associated functions are direct method calls
struct MyClass;

impl MyClass {
    fn method() -> &'static str {
        "MyClass"
    }
}

fn main() {
    log::info!("classmethod");
    log::info!("{}", MyClass::method());
}
"""
expected_output = """classmethod
MyClass"""
