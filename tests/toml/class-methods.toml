[[test]]
name = "classmethod_descriptor"
description = "How classmethod works as descriptor"
python = """
class MyClass:
    @classmethod
    def method(cls):
        return cls.__name__

# Access the descriptor
descriptor = MyClass.__dict__['method']
print(type(descriptor).__name__)

# Call it
print(MyClass.method())
"""
rust = """
#[derive(Debug, Copy, Clone)]
pub struct MyClass {}
impl MyClass {
    pub fn new() -> Self {
        Self {}
    }
    pub fn method() {
        return Self::__name__;
    }
}
fn main() {
    let descriptor = MyClass.__dict__.get("method").cloned().unwrap();
    log::info!("{}", std::any::type_name_of_val(&descriptor).__name__);
    log::info!("{}", MyClass::method());
}
"""
expected_output = """classmethod
MyClass"""
