[[test]]
name = "classmethod_inheritance"
description = "Subclass.parent_classmethod() gets subclass as cls"
python = """
class Parent:
    @classmethod
    def who_am_i(cls):
        return cls.__name__

class Child(Parent):
    pass

print(Parent.who_am_i())
print(Child.who_am_i())
"""
rust = """
#[derive(Debug, Copy, Clone)]
pub struct Parent {}
impl Parent {
    pub fn new() -> Self {
        Self {}
    }
    pub fn who_am_i() {
        return Self::__name__;
    }
}
#[derive(Debug, Copy, Clone)]
pub struct Child {}
impl Child {
    pub fn new() -> Self {
        Self {}
    }
}
fn main() {
    log::info!("{}", Parent::who_am_i());
    log::info!("{}", Child::who_am_i());
}
"""
expected_output = """Parent
Child"""

