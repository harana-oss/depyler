# =============================================================================
# classmethod vs staticmethod
# =============================================================================

[[test]]
name = "classmethod_use_case"
description = "Alternative constructors, accessing class state"
python = """
class Person:
    species = "Homo sapiens"
    
    def __init__(self, name):
        self.name = name
    
    @classmethod
    def get_species(cls):
        return cls.species
    
    @classmethod
    def from_birth_year(cls, name, year):
        age = 2023 - year
        return cls(name)

p = Person.from_birth_year("Alice", 1990)
print(Person.get_species())
"""
rust = """
struct Person {
    name: String,
}

impl Person {
    const SPECIES: &'static str = "Homo sapiens";

    fn new(name: &str) -> Self {
        Person {
            name: name.to_string(),
        }
    }

    fn get_species() -> &'static str {
        Self::SPECIES
    }

    fn from_birth_year(name: &str, _year: i32) -> Self {
        Self::new(name)
    }
}

fn main() {
    let _p = Person::from_birth_year("Alice", 1990);
    log::info!("{}", Person::get_species());
}
"""
expected_output = "Homo sapiens"

[[test]]
name = "staticmethod_use_case"
description = "Pure utility functions related to class"
python = """
class Validator:
    @staticmethod
    def is_valid_email(email):
        return "@" in email and "." in email
    
    @staticmethod
    def is_valid_phone(phone):
        return len(phone) == 10 and phone.isdigit()

print(Validator.is_valid_email("test@example.com"))
print(Validator.is_valid_phone("1234567890"))
"""
rust = """
struct Validator;

impl Validator {
    fn is_valid_email(email: &str) -> bool {
        email.contains("@") && email.contains(".")
    }

    fn is_valid_phone(phone: &str) -> bool {
        phone.len() == 10 && phone.chars().all(|c| c.is_digit(10))
    }
}

fn main() {
    log::info!("{}", Validator::is_valid_email("test@example.com"));
    log::info!("{}", Validator::is_valid_phone("1234567890"));
}
"""
expected_output = """True
True"""

# =============================================================================
# Combining with Other Decorators
# =============================================================================

[[test]]
name = "classmethod_stacked"
description = "Order matters: @decorator @classmethod"
python = """
def uppercase_decorator(func):
    def wrapper(*args, **kwargs):
        result = func(*args, **kwargs)
        return result.upper()
    return wrapper

class MyClass:
    @classmethod
    @uppercase_decorator
    def greet(cls):
        return "hello"

print(MyClass.greet())
"""
rust = """
// Rust doesn't have decorators like Python
// This demonstrates the concept with a wrapper function
struct MyClass;

impl MyClass {
    fn greet() -> String {
        let result = "hello";
        result.to_uppercase()
    }
}

fn main() {
    log::info!("{}", MyClass::greet());
}
"""
expected_output = "HELLO"

[[test]]
name = "staticmethod_stacked"
description = "Order matters: @decorator @staticmethod"
python = """
def double_decorator(func):
    def wrapper(*args, **kwargs):
        result = func(*args, **kwargs)
        return result * 2
    return wrapper

class Math:
    @staticmethod
    @double_decorator
    def add_five(x):
        return x + 5

print(Math.add_five(10))
"""
rust = """
struct Math;

impl Math {
    fn add_five(x: i32) -> i32 {
        let result = x + 5;
        result * 2
    }
}

fn main() {
    log::info!("{}", Math::add_five(10));
}
"""
expected_output = "30"

