[metadata]
name = "Dunder Callable Tests"
category = "dunder-methods"

# =============================================================================
# Basic __call__
# =============================================================================

[[test]]
name = "dunder_call_no_args"
skip = true
description = "def __call__(self): return self.value"
python = """
class Callable:
    def __init__(self, value):
        self.value = value
    
    def __call__(self):
        return self.value

obj = Callable(42)
print(obj())
"""
rust = """
struct Callable {
    value: i32,
}

impl Callable {
    fn new(value: i32) -> Self {
        Callable { value }
    }

    fn call(&self) -> i32 {
        self.value
    }
}

let obj = Callable::new(42);
log::info!("{}", obj.call());"""

[[test]]
name = "dunder_call_args"
skip = true
description = "def __call__(self, x, y): return x + y"
python = """
class Adder:
    def __call__(self, x, y):
        return x + y

add = Adder()
print(add(3, 4))
print(add(10, 20))
"""
rust = """
struct Adder;

impl Adder {
    fn call(&self, x: i32, y: i32) -> i32 {
        x + y
    }
}

let add = Adder;
log::info!("{}", add.call(3, 4));
log::info!("{}", add.call(10, 20));"""

[[test]]
name = "dunder_call_kwargs"
skip = true
description = "def __call__(self, **kwargs): ..."
python = """
class Handler:
    def __call__(self, **kwargs):
        return f"Called with: {sorted(kwargs.items())}"

handler = Handler()
print(handler(a=1, b=2))
"""
rust = """
use std::collections::HashMap;

struct Handler;

impl Handler {
    fn call(&self, kwargs: HashMap<String, i32>) -> String {
        let mut items: Vec<_> = kwargs.iter().collect();
        items.sort_by_key(|&(k, _)| k);
        format!("Called with: {:?}", items)
    }
}

let handler = Handler;
let mut kwargs = HashMap::new();
kwargs.insert("a".to_string(), 1);
kwargs.insert("b".to_string(), 2);
log::info!("{}", handler.call(kwargs));"""

[[test]]
name = "dunder_call_varargs"
skip = true
description = "def __call__(self, *args, **kwargs): ..."
python = """
class Flexible:
    def __call__(self, *args, **kwargs):
        return f"args: {args}, kwargs: {kwargs}"

flex = Flexible()
print(flex(1, 2, x=3))
"""
rust = """
use std::collections::HashMap;

struct Flexible;

impl Flexible {
    fn call(&self, args: Vec<i32>, kwargs: HashMap<String, i32>) -> String {
        format!("args: {:?}, kwargs: {:?}", args, kwargs)
    }
}

let flex = Flexible;
let args = vec![1, 2];
let mut kwargs = HashMap::new();
kwargs.insert("x".to_string(), 3);
log::info!("{}", flex.call(args, kwargs));"""

# =============================================================================
# callable() Check
# =============================================================================

[[test]]
name = "callable_true"
skip = true
description = "callable(obj_with_call) == True"
python = """
class MyCallable:
    def __call__(self):
        return "called"

obj = MyCallable()
print(callable(obj))
print(obj())
"""
rust = """
struct MyCallable;

impl MyCallable {
    fn call(&self) -> &str {
        "called"
    }
}

let obj = MyCallable;
log::info!("true");
log::info!("{}", obj.call());"""

[[test]]
name = "callable_false"
skip = true
description = "callable(regular_obj) == False"
python = """
class NotCallable:
    pass

obj = NotCallable()
print(callable(obj))
print(callable(42))
"""
rust = """
struct NotCallable;

let _obj = NotCallable;
log::info!("false");
log::info!("false");"""

[[test]]
name = "callable_function"
skip = true
description = "callable(func) == True"
python = """
def my_function():
    return "hello"

print(callable(my_function))
print(callable(lambda x: x * 2))
"""
rust = """
fn my_function() -> &'static str {
    "hello"
}

log::info!("true");
log::info!("true");"""

# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "functor"
skip = true
description = "Class that acts like a function"
python = """
class Multiplier:
    def __init__(self, factor):
        self.factor = factor
    
    def __call__(self, x):
        return x * self.factor

times_two = Multiplier(2)
times_three = Multiplier(3)
print(times_two(5))
print(times_three(5))
"""
rust = """
struct Multiplier {
    factor: i32,
}

impl Multiplier {
    fn new(factor: i32) -> Self {
        Multiplier { factor }
    }

    fn call(&self, x: i32) -> i32 {
        x * self.factor
    }
}

let times_two = Multiplier::new(2);
let times_three = Multiplier::new(3);
log::info!("{}", times_two.call(5));
log::info!("{}", times_three.call(5));"""

[[test]]
name = "stateful_callable"
skip = true
description = "Callable that remembers state between calls"
python = """
class Counter:
    def __init__(self):
        self.count = 0
    
    def __call__(self):
        self.count += 1
        return self.count

counter = Counter()
print(counter())
print(counter())
print(counter())
"""
rust = """
struct Counter {
    count: i32,
}

impl Counter {
    fn new() -> Self {
        Counter { count: 0 }
    }

    fn call(&mut self) -> i32 {
        self.count += 1;
        self.count
    }
}

let mut counter = Counter::new();
log::info!("{}", counter.call());
log::info!("{}", counter.call());
log::info!("{}", counter.call());"""

[[test]]
name = "callable_decorator"
skip = true
description = "Class decorator using __call__"
python = """
class TimesTwo:
    def __init__(self, func):
        self.func = func
    
    def __call__(self, x):
        return self.func(x) * 2

@TimesTwo
def add_five(x):
    return x + 5

print(add_five(3))
"""
rust = """
struct TimesTwo<F> {
    func: F,
}

impl<F> TimesTwo<F>
where
    F: Fn(i32) -> i32,
{
    fn new(func: F) -> Self {
        TimesTwo { func }
    }

    fn call(&self, x: i32) -> i32 {
        (self.func)(x) * 2
    }
}

let add_five = |x: i32| x + 5;
let decorated = TimesTwo::new(add_five);
log::info!("{}", decorated.call(3));"""

[[test]]
name = "callable_factory"
skip = true
description = "Callable that returns other callables"
python = """
class Adder:
    def __init__(self, n):
        self.n = n
    
    def __call__(self, x):
        return x + self.n

def make_adder(n):
    return Adder(n)

add_10 = make_adder(10)
print(add_10(5))
"""
rust = """
struct Adder {
    n: i32,
}

impl Adder {
    fn new(n: i32) -> Self {
        Adder { n }
    }

    fn call(&self, x: i32) -> i32 {
        x + self.n
    }
}

fn make_adder(n: i32) -> Adder {
    Adder::new(n)
}

let add_10 = make_adder(10);
log::info!("{}", add_10.call(5));"""

[[test]]
name = "callable_memoize"
skip = true
description = "Callable that caches results"
python = """
class Memoize:
    def __init__(self):
        self.cache = {}
    
    def __call__(self, x):
        if x not in self.cache:
            print(f"Computing {x}")
            self.cache[x] = x * x
        return self.cache[x]

memo = Memoize()
print(memo(5))
print(memo(5))
print(memo(3))
"""
rust = """
use std::collections::HashMap;

struct Memoize {
    cache: HashMap<i32, i32>,
}

impl Memoize {
    fn new() -> Self {
        Memoize {
            cache: HashMap::new(),
        }
    }

    fn call(&mut self, x: i32) -> i32 {
        if !self.cache.contains_key(&x) {
            log::info!("Computing {}", x);
            self.cache.insert(x, x * x);
        }
        *self.cache.get(&x).unwrap()
    }
}

let mut memo = Memoize::new();
log::info!("{}", memo.call(5));
log::info!("{}", memo.call(5));
log::info!("{}", memo.call(3));"""

# =============================================================================
# __call__ with Methods
# =============================================================================

[[test]]
name = "call_uses_methods"
skip = true
description = "__call__ delegating to other methods"
python = """
class Processor:
    def process(self, x):
        return x * 2
    
    def __call__(self, x):
        return self.process(x) + 1

proc = Processor()
print(proc(5))
"""
rust = """
struct Processor;

impl Processor {
    fn process(&self, x: i32) -> i32 {
        x * 2
    }

    fn call(&self, x: i32) -> i32 {
        self.process(x) + 1
    }
}

let proc = Processor;
log::info!("{}", proc.call(5));"""

[[test]]
name = "call_modifies_self"
skip = true
description = "__call__ that modifies instance state"
python = """
class Accumulator:
    def __init__(self):
        self.total = 0
    
    def __call__(self, x):
        self.total += x
        return self.total

acc = Accumulator()
print(acc(10))
print(acc(5))
print(acc(3))
"""
rust = """
struct Accumulator {
    total: i32,
}

impl Accumulator {
    fn new() -> Self {
        Accumulator { total: 0 }
    }

    fn call(&mut self, x: i32) -> i32 {
        self.total += x;
        self.total
    }
}

let mut acc = Accumulator::new();
log::info!("{}", acc.call(10));
log::info!("{}", acc.call(5));
log::info!("{}", acc.call(3));"""

# =============================================================================
# Callable as Callback
# =============================================================================

[[test]]
name = "callable_callback"
skip = true
description = "Pass callable instance where function expected"
python = """
class Logger:
    def __call__(self, message):
        print(f"LOG: {message}")

def process(callback, data):
    callback(data)

logger = Logger()
process(logger, "Processing data")
"""
rust = """
struct Logger;

impl Logger {
    fn call(&self, message: &str) {
        log::info!("LOG: {}", message);
    }
}

fn process<F>(callback: F, data: &str)
where
    F: Fn(&str),
{
    callback(data);
}

let logger = Logger;
process(|msg| logger.call(msg), "Processing data");"""

[[test]]
name = "callable_higher_order"
skip = true
description = "map(callable_obj, items)"
python = """
class Square:
    def __call__(self, x):
        return x * x

square = Square()
result = list(map(square, [1, 2, 3, 4]))
print(result)
"""
rust = """
struct Square;

impl Square {
    fn call(&self, x: i32) -> i32 {
        x * x
    }
}

let square = Square;
let result: Vec<i32> = vec![1, 2, 3, 4].iter().map(|&x| square.call(x)).collect();
log::info!("{:?}", result);"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "call_returns_none"
skip = true
description = "__call__ with no return statement"
python = """
class SideEffect:
    def __call__(self):
        print("Side effect")

obj = SideEffect()
result = obj()
print(f"Result: {result}")
"""
rust = """
struct SideEffect;

impl SideEffect {
    fn call(&self) {
        log::info!("Side effect");
    }
}

let obj = SideEffect;
obj.call();
log::info!("Result: None");"""

[[test]]
name = "call_nested"
skip = true
description = "obj()(x) chained calls"
python = """
class Outer:
    def __call__(self):
        return Inner()

class Inner:
    def __call__(self, x):
        return x * 2

obj = Outer()
result = obj()(5)
print(result)
"""
rust = """
struct Outer;
struct Inner;

impl Outer {
    fn call(&self) -> Inner {
        Inner
    }
}

impl Inner {
    fn call(&self, x: i32) -> i32 {
        x * 2
    }
}

let obj = Outer;
let result = obj.call().call(5);
log::info!("{}", result);"""

[[test]]
name = "call_type_hints"
skip = true
description = "__call__ with parameter and return type hints"
python = """
class TypedCallable:
    def __call__(self, x: int, y: int) -> int:
        return x + y

obj = TypedCallable()
print(obj(3, 4))
"""
rust = """
struct TypedCallable;

impl TypedCallable {
    fn call(&self, x: i32, y: i32) -> i32 {
        x + y
    }
}

let obj = TypedCallable;
log::info!("{}", obj.call(3, 4));"""

[[test]]
name = "callable_subclass"
skip = true
description = "Subclass overriding __call__"
python = """
class Base:
    def __call__(self, x):
        return x

class Derived(Base):
    def __call__(self, x):
        return super().__call__(x) * 2

obj = Derived()
print(obj(5))
"""
rust = """
trait Callable {
    fn call(&self, x: i32) -> i32;
}

struct Base;
struct Derived;

impl Callable for Base {
    fn call(&self, x: i32) -> i32 {
        x
    }
}

impl Callable for Derived {
    fn call(&self, x: i32) -> i32 {
        Base.call(x) * 2
    }
}

let obj = Derived;
log::info!("{}", obj.call(5));"""
