[[test]]
name = "property_function"
description = "x = property(get_x, set_x, del_x, 'docstring')"
python = """
class Person:
    def __init__(self, name):
        self._name = name
    
    def get_name(self):
        return self._name
    
    def set_name(self, value):
        self._name = value
    
    def del_name(self):
        del self._name
    
    name = property(get_name, set_name, del_name, "Person's name")

p = Person("Alice")
print(f"Name: {p.name}")
p.name = "Bob"
print(f"Changed: {p.name}")
"""
rust = """
// Rust doesn't have property() function, use regular methods
struct Person {
    name: String,
}

impl Person {
    fn new(name: &str) -> Self {
        Person { name: name.to_string() }
    }
    
    fn name(&self) -> &str {
        &self.name
    }
    
    fn set_name(&mut self, value: &str) {
        self.name = value.to_string();
    }
}

fn main() {
    let mut p = Person::new("Alice");
    println!("Name: {}", p.name());
    p.set_name("Bob");
    println!("Changed: {}", p.name());
}
"""
contains = ["Name: Alice", "Changed: Bob"]

