[[test]]
name = "property_override"
description = "Subclass overrides parent property"
python = """
class Base:
    @property
    def value(self):
        return "base"

class Derived(Base):
    @property
    def value(self):
        return "derived"

b = Base()
d = Derived()
print(f"Base: {b.value}")
print(f"Derived: {d.value}")
"""
rust = """
trait HasValue {
    fn value(&self) -> &str;
}

struct Base;
struct Derived;

impl HasValue for Base {
    fn value(&self) -> &str {
        "base"
    }
}

impl HasValue for Derived {
    fn value(&self) -> &str {
        "derived"
    }
}

fn main() {
    let b = Base;
    let d = Derived;
    println!("Base: {}", b.value());
    println!("Derived: {}", d.value());
}
"""
contains = ["Base: base", "Derived: derived"]

[[test]]
name = "property_extend"
description = "Override only setter, keep parent getter"
python = """
class Base:
    def __init__(self):
        self._value = 0
    
    @property
    def value(self):
        return self._value
    
    @value.setter
    def value(self, v):
        self._value = v

class Derived(Base):
    @Base.value.setter
    def value(self, v):
        # Extended setter with validation
        if v < 0:
            raise ValueError("Must be positive")
        self._value = v

d = Derived()
print(f"Initial: {d.value}")
d.value = 10
print(f"After set: {d.value}")

try:
    d.value = -5
except ValueError as e:
    print(f"Error: {e}")
"""
rust = """
struct Base {
    value: i32,
}

impl Base {
    fn new() -> Self {
        Base { value: 0 }
    }
    
    fn value(&self) -> i32 {
        self.value
    }
    
    fn set_value(&mut self, v: i32) {
        self.value = v;
    }
}

struct Derived {
    base: Base,
}

impl Derived {
    fn new() -> Self {
        Derived { base: Base::new() }
    }
    
    fn value(&self) -> i32 {
        self.base.value()
    }
    
    fn set_value(&mut self, v: i32) -> Result<(), String> {
        if v < 0 {
            return Err("Must be positive".to_string());
        }
        self.base.set_value(v);
        Ok(())
    }
}

fn main() {
    let mut d = Derived::new();
    println!("Initial: {}", d.value());
    d.set_value(10).unwrap();
    println!("After set: {}", d.value());
    
    if let Err(e) = d.set_value(-5) {
        println!("Error: {}", e);
    }
}
"""
contains = ["Initial: 0", "After set: 10", "Error: Must be positive"]

