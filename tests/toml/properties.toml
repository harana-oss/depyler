[[test]]
name = "property_readonly"
description = "Property with only getter"
python = """
class Circle:
    def __init__(self, radius):
        self._radius = radius
    
    @property
    def area(self):
        return 3.14159 * self._radius ** 2

c = Circle(5)
print(f"Area: {c.area:.2f}")

# Trying to set will raise AttributeError
try:
    c.area = 100
    print("Should not reach here")
except AttributeError:
    print("Cannot set read-only property")
"""
rust = """
struct Circle {
    radius: f64,
}

impl Circle {
    fn new(radius: f64) -> Self {
        Circle { radius }
    }
    
    fn area(&self) -> f64 {
        3.14159 * self.radius * self.radius
    }
}

fn main() {
    let c = Circle::new(5.0);
    println!("Area: {:.2}", c.area());
    
    // In Rust, there's no setter so this is enforced at compile time
    println!("Cannot set read-only property");
}
"""
contains = ["Area: 78.54", "Cannot set read-only property"]

[[test]]
name = "property_computed"
description = "Property that computes value from other attributes"
python = """
class Rectangle:
    def __init__(self, width, height):
        self.width = width
        self.height = height
    
    @property
    def area(self):
        return self.width * self.height
    
    @property
    def perimeter(self):
        return 2 * (self.width + self.height)

r = Rectangle(5, 3)
print(f"Area: {r.area}")
print(f"Perimeter: {r.perimeter}")
"""
rust = """
struct Rectangle {
    width: i32,
    height: i32,
}

impl Rectangle {
    fn new(width: i32, height: i32) -> Self {
        Rectangle { width, height }
    }
    
    fn area(&self) -> i32 {
        self.width * self.height
    }
    
    fn perimeter(&self) -> i32 {
        2 * (self.width + self.height)
    }
}

fn main() {
    let r = Rectangle::new(5, 3);
    println!("Area: {}", r.area());
    println!("Perimeter: {}", r.perimeter());
}
"""
contains = ["Area: 15", "Perimeter: 16"]

[[test]]
name = "property_validated"
description = "Setter that validates before assignment"
python = """
class Person:
    def __init__(self, age):
        self._age = age
    
    @property
    def age(self):
        return self._age
    
    @age.setter
    def age(self, value):
        if value < 0 or value > 150:
            raise ValueError("Invalid age")
        self._age = value

p = Person(25)
print(f"Age: {p.age}")
p.age = 30
print(f"New age: {p.age}")

try:
    p.age = 200
except ValueError as e:
    print(f"Error: {e}")
"""
rust = """
struct Person {
    age: i32,
}

impl Person {
    fn new(age: i32) -> Result<Self, String> {
        if age < 0 || age > 150 {
            return Err("Invalid age".to_string());
        }
        Ok(Person { age })
    }
    
    fn age(&self) -> i32 {
        self.age
    }
    
    fn set_age(&mut self, value: i32) -> Result<(), String> {
        if value < 0 || value > 150 {
            return Err("Invalid age".to_string());
        }
        self.age = value;
        Ok(())
    }
}

fn main() {
    let mut p = Person::new(25).unwrap();
    println!("Age: {}", p.age());
    p.set_age(30).unwrap();
    println!("New age: {}", p.age());
    
    if let Err(e) = p.set_age(200) {
        println!("Error: {}", e);
    }
}
"""
contains = ["Age: 25", "New age: 30", "Error: Invalid age"]

[[test]]
name = "property_type_conversion"
description = "Setter converts type (e.g., str to int)"
python = """
class Config:
    def __init__(self, port):
        self._port = int(port)
    
    @property
    def port(self):
        return self._port
    
    @port.setter
    def port(self, value):
        self._port = int(value)

c = Config("8080")
print(f"Port: {c.port}, type: {type(c.port).__name__}")
c.port = "9000"
print(f"New port: {c.port}, type: {type(c.port).__name__}")
"""
rust = """
use std::str::FromStr;

struct Config {
    port: i32,
}

impl Config {
    fn new(port: &str) -> Result<Self, std::num::ParseIntError> {
        Ok(Config { port: i32::from_str(port)? })
    }
    
    fn port(&self) -> i32 {
        self.port
    }
    
    fn set_port(&mut self, value: &str) -> Result<(), std::num::ParseIntError> {
        self.port = i32::from_str(value)?;
        Ok(())
    }
}

fn main() {
    let mut c = Config::new("8080").unwrap();
    println!("Port: {}, type: i32", c.port());
    c.set_port("9000").unwrap();
    println!("New port: {}, type: i32", c.port());
}
"""
contains = ["Port: 8080", "type: int", "New port: 9000"]

