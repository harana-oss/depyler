[[test]]
name = "property_shadowing"
description = "Property name same as backing attribute"
python = """
class MyClass:
    def __init__(self, value):
        self._value = value
    
    @property
    def value(self):
        return self._value
    
    @value.setter
    def value(self, v):
        self._value = v

obj = MyClass(42)
print(f"Value: {obj.value}")
print(f"Backing: {obj._value}")
"""
rust = """
struct MyClass {
    _value: i32,
}

impl MyClass {
    fn new(value: i32) -> Self {
        MyClass { _value: value }
    }
    
    fn value(&self) -> i32 {
        self._value
    }
    
    fn set_value(&mut self, v: i32) {
        self._value = v;
    }
}

fn main() {
    let obj = MyClass::new(42);
    println!("Value: {}", obj.value());
    println!("Backing: {}", obj._value);
}
"""
contains = ["Value: 42", "Backing: 42"]

[[test]]
name = "cached_property"
description = "@functools.cached_property"
python = """
from functools import cached_property

class ExpensiveCalculation:
    def __init__(self):
        self.call_count = 0
    
    @cached_property
    def expensive(self):
        self.call_count += 1
        return 42

obj = ExpensiveCalculation()
print(f"First call: {obj.expensive}, call_count: {obj.call_count}")
print(f"Second call: {obj.expensive}, call_count: {obj.call_count}")
"""
rust = """
use std::cell::Cell;

struct ExpensiveCalculation {
    call_count: Cell<i32>,
    cached_value: Cell<Option<i32>>,
}

impl ExpensiveCalculation {
    fn new() -> Self {
        ExpensiveCalculation {
            call_count: Cell::new(0),
            cached_value: Cell::new(None),
        }
    }
    
    fn expensive(&self) -> i32 {
        if let Some(value) = self.cached_value.get() {
            return value;
        }
        
        self.call_count.set(self.call_count.get() + 1);
        let value = 42;
        self.cached_value.set(Some(value));
        value
    }
    
    fn call_count(&self) -> i32 {
        self.call_count.get()
    }
}

fn main() {
    let obj = ExpensiveCalculation::new();
    println!("First call: {}, call_count: {}", obj.expensive(), obj.call_count());
    println!("Second call: {}, call_count: {}", obj.expensive(), obj.call_count());
}
"""
contains = ["First call: 42, call_count: 1", "Second call: 42, call_count: 1"]
