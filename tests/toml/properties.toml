# Property Tests - The @property decorator
# Rust Mapping: Methods, builder pattern, getter/setter methods

[metadata]
name = "Property Tests"
category = "advanced-oop"

# =============================================================================
# Basic Property
# =============================================================================

[[test]]
name = "property_getter"
description = "@property def x(self): return self._x"
python = """
class Person:
    def __init__(self, name):
        self._name = name
    
    @property
    def name(self):
        return self._name

p = Person("Alice")
print(f"Name: {p.name}")
"""
rust = """
struct Person {
    name: String,
}

impl Person {
    fn new(name: &str) -> Self {
        Person { name: name.to_string() }
    }
    
    fn name(&self) -> &str {
        &self.name
    }
}

fn main() {
    let p = Person::new("Alice");
    println!("Name: {}", p.name());
}
"""
contains = ["Name: Alice"]

[[test]]
name = "property_setter"
description = "@x.setter def x(self, value): self._x = value"
python = """
class Person:
    def __init__(self, name):
        self._name = name
    
    @property
    def name(self):
        return self._name
    
    @name.setter
    def name(self, value):
        self._name = value

p = Person("Alice")
print(f"Before: {p.name}")
p.name = "Bob"
print(f"After: {p.name}")
"""
rust = """
struct Person {
    name: String,
}

impl Person {
    fn new(name: &str) -> Self {
        Person { name: name.to_string() }
    }
    
    fn name(&self) -> &str {
        &self.name
    }
    
    fn set_name(&mut self, value: &str) {
        self.name = value.to_string();
    }
}

fn main() {
    let mut p = Person::new("Alice");
    println!("Before: {}", p.name());
    p.set_name("Bob");
    println!("After: {}", p.name());
}
"""
contains = ["Before: Alice", "After: Bob"]

[[test]]
name = "property_deleter"
description = "@x.deleter def x(self): del self._x"
python = """
class Person:
    def __init__(self, name):
        self._name = name
    
    @property
    def name(self):
        return self._name
    
    @name.deleter
    def name(self):
        del self._name

p = Person("Alice")
print(f"Has name: {hasattr(p, '_name')}")
del p.name
print(f"Has name after delete: {hasattr(p, '_name')}")
"""
rust = """
struct Person {
    name: Option<String>,
}

impl Person {
    fn new(name: &str) -> Self {
        Person { name: Some(name.to_string()) }
    }
    
    fn has_name(&self) -> bool {
        self.name.is_some()
    }
    
    fn delete_name(&mut self) {
        self.name = None;
    }
}

fn main() {
    let mut p = Person::new("Alice");
    println!("Has name: {}", p.has_name());
    p.delete_name();
    println!("Has name after delete: {}", p.has_name());
}
"""
contains = ["Has name: True", "Has name after delete: False"]

