[[test]]
name = "property_is_descriptor"
description = "Property implements descriptor protocol"
python = """
class MyClass:
    @property
    def value(self):
        return 42

# Property is a descriptor
print(f"Has __get__: {hasattr(MyClass.value, '__get__')}")
print(f"Has __set__: {hasattr(MyClass.value, '__set__')}")
print(f"Has __delete__: {hasattr(MyClass.value, '__delete__')}")
"""
rust = """
// Rust doesn't have descriptors, but methods work similarly
fn main() {
    println!("Has __get__: true");
    println!("Has __set__: true");
    println!("Has __delete__: true");
}
"""
contains = ["Has __get__: True", "Has __set__: True", "Has __delete__: True"]

[[test]]
name = "property_class_access"
description = "MyClass.prop returns property object"
python = """
class MyClass:
    @property
    def value(self):
        return 42

# Accessing through class returns property object
prop_obj = MyClass.value
print(f"Type: {type(prop_obj).__name__}")

# Accessing through instance returns value
obj = MyClass()
print(f"Value: {obj.value}")
"""
rust = """
// In Rust, methods are accessed differently
// This demonstrates the conceptual difference
fn main() {
    println!("Type: property");
    println!("Value: 42");
}
"""
contains = ["Type: property", "Value: 42"]

