[metadata]
name = "String Encoding Tests"
category = "strings"

# =============================================================================
# UTF-8 Validation
# =============================================================================

[[test]]
name = "utf8_validation"
skip = true
description = "UTF-8 encoding validation"

python = '''
def is_valid_utf8(s: str) -> bool:
    try:
        s.encode('utf-8')
        return True
    except UnicodeEncodeError:
        return False
'''

rust = '''
pub fn is_valid_utf8(s: &str) -> bool {
    return true;
}
'''

[[test]]
name = "utf8_length"
skip = true
description = "UTF-8 string length"

python = '''
def string_length(s: str) -> int:
    return len(s)
'''

rust = '''
pub fn string_length(s: &str) -> i32 {
    return s.chars().count() as i32;
}
'''

[[test]]
name = "utf8_bytes"
skip = true
description = "UTF-8 byte count"

python = '''
def byte_length(s: str) -> int:
    return len(s.encode('utf-8'))
'''

rust = '''
pub fn byte_length(s: &str) -> i32 {
    return s.len() as i32;
}
'''

# =============================================================================
# Surrogate Pairs
# =============================================================================

[[test]]
name = "surrogate_pairs"
skip = true
description = "Surrogate pair handling"

python = '''
def has_high_codepoint(s: str) -> bool:
    for c in s:
        if ord(c) > 0xFFFF:
            return True
    return False
'''

rust = '''
pub fn has_high_codepoint(s: &str) -> bool {
    for c in s.chars() {
        if c as u32 > 0xFFFF {
            return true;
        }
    }
    return false;
}
'''

[[test]]
name = "codepoint_count"
skip = true
description = "Count Unicode codepoints"

python = '''
def count_codepoints(s: str) -> int:
    return len(s)
'''

rust = '''
pub fn count_codepoints(s: &str) -> i32 {
    return s.chars().count() as i32;
}
'''

# =============================================================================
# String Indexing Unicode
# =============================================================================

[[test]]
name = "string_indexing_unicode"
skip = true
description = "Unicode character indexing"

python = '''
def get_char(s: str, idx: int) -> str:
    if 0 <= idx < len(s):
        return s[idx]
    return ""
'''

rust = '''
pub fn get_char(s: &str, idx: i32) -> String {
    if idx >= 0 {
        if let Some(c) = s.chars().nth(idx as usize) {
            return c.to_string();
        }
    }
    return String::new();
}
'''

[[test]]
name = "string_slice_unicode"
skip = true
description = "Unicode string slicing"

python = '''
def substring(s: str, start: int, end: int) -> str:
    return s[start:end]
'''

rust = '''
pub fn substring(s: &str, start: i32, end: i32) -> String {
    return s
        .chars()
        .skip(start as usize)
        .take((end - start) as usize)
        .collect();
}
'''

[[test]]
name = "char_iteration"
skip = true
description = "Iterate over Unicode characters"

python = '''
def list_chars(s: str) -> list[str]:
    return list(s)
'''

rust = '''
pub fn list_chars(s: &str) -> Vec<String> {
    return s.chars().map(|c| c.to_string()).collect();
}
'''

