'''

[[test]]
name = "dataclass_list"
description = "items: list[int]"

python = '''
from dataclasses import dataclass, field

@dataclass
class Container:
    items: list = field(default_factory=list)

c = Container()
c.items.append(1)
c.items.append(2)
result = len(c.items)
'''

rust = '''
pub const c: Container = Container::new();
pub const result: i32 = c.items.len() as i32;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Container {}
impl Container {
    pub const items: Vec<i32> = field();
    pub fn new() -> Self {
        Self {}
    }
}
'''

