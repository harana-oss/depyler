impl Container {
    pub const items: Vec<i32> = field();
    pub fn new() -> Self {
        Self {}
    }
}
'''

[[test]]
name = "dataclass_mutable_error"
description = "items: list = [] raises ValueError"

python = '''
from dataclasses import dataclass, field

# Correct pattern: use field(default_factory=list)
@dataclass
class Container:
    items: list = field(default_factory=list)

c = Container()
result = isinstance(c.items, list)
'''

rust = '''
    #[derive(Debug, Clone, Default)]
    pub struct Container {
        items: Vec<i32>,
    }

    impl Container {
        pub fn new() -> Self {
            Self { items: Vec::new() }
        }
    }

    let c = Container::new();
    let result = true;
'''

