[[test]]
name = "dataclass_post_init"
description = "def __post_init__(self): ..."

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int
    
    def __post_init__(self):
        if self.x < 0:
            self.x = 0
        if self.y < 0:
            self.y = 0

p = Point(-5, -10)
result = (p.x, p.y)
'''

rust = '''
pub const p: Point = Point::new(-5, -10);
pub const result: (i32, i32) = (p.x, p.y);
use serde_json;
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "dataclass_initvar"
description = "init_only: InitVar[int]"

python = '''
from dataclasses import dataclass, field, InitVar

@dataclass
class Rectangle:
    width: int
    height: int
    scale: InitVar[int] = 1
    area: int = field(init=False)
    
    def __post_init__(self, scale):
        self.area = self.width * self.height * scale

r = Rectangle(3, 4, 2)
result = r.area
'''

rust = '''
pub const r: Rectangle = Rectangle::new(3, 4, 2);
pub const result: i32 = r.area;
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Rectangle {
    pub width: i32,
    pub height: i32,
}
impl Rectangle {
    pub const scale: InitVar<i32> = 1;
    pub const area: i32 = field();
    pub fn new(width: i32, height: i32) -> Self {
        Self { width, height }
    }
}
'''

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "dataclass_inherit"
description = "@dataclass class B(A): ..."

python = '''
from dataclasses import dataclass

@dataclass
class Point2D:
    x: int
    y: int

@dataclass
class Point3D(Point2D):
    z: int

p = Point3D(1, 2, 3)
result = (p.x, p.y, p.z)
'''

rust = '''
pub const p: Point3D = Point3D::new(1, 2, 3);
pub const result: (i32, i32, i32) = (p.x, p.y, p.z);
use serde_json;
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Point2D {
    pub x: i32,
    pub y: i32,
}
impl Point2D {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Point3D {
    pub z: i32,
}
impl Point3D {
    pub fn new(z: i32) -> Self {
        Self { z }
    }
}
'''

[[test]]
name = "dataclass_classvar"
description = "count: ClassVar[int] = 0"

python = '''
from dataclasses import dataclass
from typing import ClassVar

@dataclass
class Counter:
    value: int
    total: ClassVar[int] = 0
    
    def __post_init__(self):
        Counter.total += self.value

c1 = Counter(5)
c2 = Counter(10)
result = Counter.total
'''

rust = '''
pub const c1: Counter = Counter::new(5);
pub const c2: Counter = Counter::new(10);
pub const result: i32 = Counter.total;
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Counter {
    pub value: i32,
}
impl Counter {
    pub const total: ClassVar<i32> = 0;
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
'''

