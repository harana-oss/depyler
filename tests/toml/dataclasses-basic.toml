[metadata]
name = "Dataclasses Basic Tests"
category = "data-structures"

# =============================================================================
# Basic Dataclass
# =============================================================================

[[test]]
name = "dataclass_simple"
description = "@dataclass class Point: x: int; y: int"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

p = Point(1, 2)
result = (p.x, p.y)
'''

rust = '''
pub const p: Point = Point::new(1, 2);
pub const result: (i32, i32) = (p.x, p.y);
use serde_json;
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

