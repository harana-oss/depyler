[[test]]
name = "dataclass_defaults"
description = "x: int = 0"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int = 0
    y: int = 0

p1 = Point()
p2 = Point(5)
p3 = Point(5, 10)
result = (p1.x, p1.y, p2.x, p2.y, p3.x, p3.y)
'''

rust = '''
pub const p1: Point = Point::new();
pub const p2: Point = Point::new(5);
pub const p3: Point = Point::new(5, 10);
pub const result: (
    i32,
    i32,
    i32,
    i32,
    i32,
    i32,
) = (p1.x, p1.y, p2.x, p2.y, p3.x, p3.y);
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Point {}
impl Point {
    pub const x: i32 = 0;
    pub const y: i32 = 0;
    pub fn new() -> Self {
        Self {}
    }
}
'''

