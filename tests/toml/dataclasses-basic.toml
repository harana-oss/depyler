[[test]]
name = "dataclass_field_hash"
description = "field(hash=True)"

python = '''
from dataclasses import dataclass, field

@dataclass(frozen=True)
class Person:
    name: str
    id: int = field(hash=True)

p = Person('Alice', 123)
result = hash(p)
'''

rust = '''
pub const p: Person = Person::new("Alice".to_string(), 123);
pub const result: i64 = {
    use std::collections::hash_map::DefaultHasher;
    use std::hash::{Hash, Hasher};
    let mut hasher = DefaultHasher::new();
    p.hash(&mut hasher);
    hasher.finish() as i64
};
use serde_json;
#[derive(Debug, Clone)]
pub struct Person {
    pub name: String,
}
impl Person {
    pub const id: i32 = field();
}
'''

