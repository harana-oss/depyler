    """Large function - should NOT be inlined."""
    a = x + y
    b = y + z
    c = z + x
    d = a * b
    e = b * c
    f = c * a
    g = d + e
    h = e + f
    i = f + d
    j = g * h
    k = h * i
    l = i * g
    m = j + k
    n = k + l
    o = l + j
    result = m + n + o
    return result
