[metadata]
name = "Multi-Module Tests"
category = "modules"

# =============================================================================
# Circular Import
# =============================================================================

[[test]]
name = "circular_import"
description = "Circular import handling"

python = '''
def process_a(x: int) -> int:
    return x + 1

def process_b(x: int) -> int:
    return process_a(x) * 2
'''

rust = '''
pub fn process_a(x: i32) -> i32 {
    return x + 1;
}

pub fn process_b(x: i32) -> i32 {
    return process_a(x) * 2;
}
'''

[[test]]
name = "mutual_reference"
description = "Mutual function references"

python = '''
def is_even(n: int) -> bool:
    if n == 0:
        return True
    return is_odd(n - 1)

def is_odd(n: int) -> bool:
    if n == 0:
        return False
    return is_even(n - 1)
'''

rust = '''
pub fn is_even(n: i32) -> bool {
    if n == 0 {
        return true;
    }
    return is_odd(n - 1);
}

pub fn is_odd(n: i32) -> bool {
    if n == 0 {
        return false;
    }
    return is_even(n - 1);
}
'''

