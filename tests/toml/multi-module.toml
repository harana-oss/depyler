# =============================================================================
# Module Attribute Access
# =============================================================================

[[test]]
name = "module_attribute_access"
description = "Module-level attribute access"

python = '''
VERSION = "1.0.0"
BUILD = 123

def get_version() -> str:
    return VERSION

def get_build() -> int:
    return BUILD
'''

rust = '''
lazy_static! {
    pub static ref VERSION: String = "1.0.0";
}
use lazy_static::lazy_static;
pub const BUILD: i32 = 123;

pub fn get_version() -> String {
    return VERSION.clone();
}

pub fn get_build() -> i32 {
    return BUILD;
}
'''

[[test]]
name = "module_constant_usage"
description = "Module constants in functions"

python = '''
MAX_SIZE = 100
MIN_SIZE = 0

def clamp_size(size: int) -> int:
    if size > MAX_SIZE:
        return MAX_SIZE
    if size < MIN_SIZE:
        return MIN_SIZE
    return size
'''

rust = '''
pub const MAX_SIZE: i32 = 100;
pub const MIN_SIZE: i32 = 0;

pub fn clamp_size(size: i32) -> i32 {
    if size > MAX_SIZE {
        return MAX_SIZE;
    }
    if size < MIN_SIZE {
        return MIN_SIZE;
    }
    return size;
}
'''

[[test]]
name = "module_class_access"
description = "Module-level class access"

python = '''
class Config:
    def __init__(self, name: str):
        self.name = name
    
    def get_name(self) -> str:
        return self.name

def create_config(name: str) -> Config:
    return Config(name)
'''

rust = '''
pub struct Config {
    pub name: String,
}

impl Config {
    pub fn new(name: String) -> Self {
        Self { name }
    }
    
    pub fn get_name(&self) -> String {
        return self.name.clone();
    }
}

pub fn create_config(name: String) -> Config {
    return Config::new(name);
}
'''

[[test]]
name = "module_function_chain"
description = "Chain module functions"

python = '''
def step_one(x: int) -> int:
    return x + 1

def step_two(x: int) -> int:
    return x * 2

def step_three(x: int) -> int:
    return x - 1

def pipeline(x: int) -> int:
    return step_three(step_two(step_one(x)))
'''

rust = '''
pub fn step_one(x: i32) -> i32 {
    return x + 1;
}

pub fn step_two(x: i32) -> i32 {
    return x * 2;
}

pub fn step_three(x: i32) -> i32 {
    return x - 1;
}

pub fn pipeline(x: i32) -> i32 {
    return step_three(step_two(step_one(x)));
}
'''
