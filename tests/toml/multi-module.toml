# Wildcard Import Scope
# =============================================================================

[[test]]
name = "wildcard_import_scope"
description = "__all__ wildcard import"

python = '''
PUBLIC_CONST = 42

def public_func() -> int:
    return PUBLIC_CONST

def _private_func() -> int:
    return 0
'''

rust = '''
pub const PUBLIC_CONST: i32 = 42;

pub fn public_func() -> i32 {
    return PUBLIC_CONST;
}

fn _private_func() -> i32 {
    return 0;
}
'''

[[test]]
name = "all_export_list"
description = "__all__ export list pattern"

python = '''
EXPORTED = 1
NOT_EXPORTED = 2

def exported_func() -> int:
    return EXPORTED

def _hidden_func() -> int:
    return NOT_EXPORTED
'''

rust = '''
pub const EXPORTED: i32 = 1;
const NOT_EXPORTED: i32 = 2;

pub fn exported_func() -> i32 {
    return EXPORTED;
}

fn _hidden_func() -> i32 {
    return NOT_EXPORTED;
}
'''

