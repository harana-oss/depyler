[[test]]
name = "parameter_lifetime_propagation"
description = "Lifetime propagation with string selection"

python = '''
def select_longer(s1: str, s2: str) -> str:
    if len(s1) > len(s2):
        return s1
    else:
        return s2
'''

rust = '''
pub fn select_longer(s1: String, s2: String) -> String {
    let _cse_temp_0 = s1.clone().len() as i32;
    let _cse_temp_1 = s2.clone().len() as i32;
    let _cse_temp_2 = _cse_temp_0 > _cse_temp_1;
    if _cse_temp_2 {
        return s1;
    } else {
        return s2;
    }
}
'''

