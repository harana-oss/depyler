[[test]]
name = "iterator_modification"
description = "Handle iteration with modification"

python = '''
def modify_while_iterating(items: list[int]):
    for item in items:
        if item > 5:
            items.remove(item)
'''

rust = '''
pub fn modify_while_iterating(items: &mut Vec<i32>) {
    for item in items.iter().cloned() {
        if item > 5 {
            if let Some(pos) = items.iter().position(|x| x == &item) {
                items.remove(pos)
            } else {
                panic!("ValueError: list.remove(x): x not in list")
            };
        }
    }
}
'''

