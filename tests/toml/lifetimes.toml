    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "inner" => {
                if let Some(v) = value.downcast_ref::<Inner>() {
                    self.inner = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn get_inner_data(outer: &Outer) -> Vec<i32> {
