                if let Some(v) = value.downcast_ref::<Vec<i32>>() {
                    self.data = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
#[derive(Debug, Clone)]
pub struct Outer {
    pub inner: Inner,
}
impl Outer {
    pub fn new(inner: Inner) -> Self {
        Self { inner }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "inner" => Some(Box::new(self.inner.clone()) as Box<dyn std::any::Any>),
            _ => None,
