[[test]]
name = "return_field_from_borrowed_param"
description = "Return field from borrowed parameter should use reference"

python = '''
class State:
    def __init__(self, players: list[str]):
        self.players = players

def get_players(state: State) -> list[str]:
    return state.players
'''

rust = '''
#[derive(Debug, Clone)]
pub struct State {
    pub players: Vec<String>,
}
impl State {
    pub fn new(players: Vec<String>) -> Self {
        Self { players }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "players" => Some(Box::new(self.players.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "players" => {
                if let Some(v) = value.downcast_ref::<Vec<String>>() {
                    self.players = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn get_players(state: &State) -> Vec<String> {
    return state.players.clone();
}
'''

