# =============================================================================
# COW Lifetime Fix Tests
# =============================================================================

[[test]]
name = "string_param_no_static_lifetime"
description = "String parameter should not require 'static lifetime"
tags = ["cow", "lifetime", "static"]

[test.python]
code = '''
def concatenate(a: str, b: str) -> str:
    return a + b
'''

[test.assertions]
