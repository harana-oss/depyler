'''

[[test]]
name = "owned_param_field_return_needs_clone"
description = "Owned parameter field return may need clone (not borrowed)"

python = '''
class Container:
    def __init__(self, items: list[int]):
        self.items = items

def take_ownership_and_return_field(container: Container) -> list[int]:
    # When container is owned (not borrowed), returning the field doesn't need clone
    return container.items
'''

rust = '''
