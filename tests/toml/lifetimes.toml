rust = '''
#[derive(Debug, Clone)]
pub struct Team {
    pub home: Vec<String>,
    pub away: Vec<String>,
}
impl Team {
    pub fn new(home: Vec<String>, away: Vec<String>) -> Self {
        Self { home, away }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "home" => Some(Box::new(self.home.clone()) as Box<dyn std::any::Any>),
            "away" => Some(Box::new(self.away.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "home" => {
                if let Some(v) = value.downcast_ref::<Vec<String>>() {
                    self.home = v.clone();
                    true
                } else {
                    false
                }
            }
            "away" => {
                if let Some(v) = value.downcast_ref::<Vec<String>>() {
                    self.away = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn get_team_players(team: &Team, is_home: bool) -> Vec<String> {
    return if is_home { team.home.clone() } else { team.away.clone() };
}
'''

[[test]]
name = "return_nested_field_from_borrowed_param"
description = "Return nested field from borrowed param should use reference"

python = '''
class Inner:
    def __init__(self, data: list[int]):
        self.data = data

class Outer:
    def __init__(self, inner: Inner):
        self.inner = inner

def get_inner_data(outer: Outer) -> list[int]:
    return outer.inner.data
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Inner {
    pub data: Vec<i32>,
}
impl Inner {
    pub fn new(data: Vec<i32>) -> Self {
        Self { data }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "data" => Some(Box::new(self.data.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
