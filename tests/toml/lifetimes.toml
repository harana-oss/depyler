# Lifetime and COW Type Tests - Migrated from test_lifetimes.rs

[metadata]
name = "Lifetime Tests"
category = "ownership-lifetimes"

# =============================================================================
# COW Type Tests
# =============================================================================

[[test]]
name = "string_concat_returns_string"
description = "String concatenation returns String, not Cow"
tags = ["cow", "string", "concat"]

[test.python]
code = '''
def concat(a: str, b: str) -> str:
    return a + b
'''

[test.assertions]
contains = ["-> String"]
contains_any = [["a: &str", "a: String"]]
not_contains = ["-> Cow<"]

[[test]]
name = "fstring_returns_string"
description = "F-string returns String, not Cow"
tags = ["cow", "string", "fstring"]

[test.python]
code = '''
def format_name(first: str, last: str) -> str:
    return f"{first} {last}"
'''

[test.assertions]
contains = ["-> String"]
not_contains = ["-> Cow<"]

[[test]]
name = "format_call_returns_string"
description = "format() call returns String, not Cow"
tags = ["cow", "string", "format"]

[test.python]
code = '''
def format_msg(name: str, count: int) -> str:
    return "{} has {}".format(name, count)
'''

[test.assertions]
not_contains = ["-> Cow<"]

[[test]]
name = "multiple_concat_returns_string"
description = "Multiple concatenation returns String"
tags = ["cow", "string", "concat"]

[test.python]
code = '''
def concat_three(a: str, b: str, c: str) -> str:
