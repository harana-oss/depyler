# =============================================================================
# Time Operations
# =============================================================================

[[test]]
name = "time_sleep"
description = "time.sleep() delay"
tags = ["time", "sleep"]

[test.python]
code = '''
import time

def wait_seconds(seconds: float) -> None:
    time.sleep(seconds)
'''

[test.assertions]
contains_any = [["thread::sleep", "Duration::from_secs", "Duration::from_millis"]]

[[test]]
name = "time_time"
description = "time.time() unix timestamp"
tags = ["time", "timestamp"]

[test.python]
code = '''
import time

def get_timestamp() -> float:
    return time.time()
'''

[test.assertions]
contains_any = [["SystemTime::now()", "UNIX_EPOCH", "duration_since"]]

# =============================================================================
# Datetime Formatting
# =============================================================================

[[test]]
name = "datetime_strftime"
description = "datetime.strftime() formatting"
tags = ["datetime", "format"]

[test.python]
code = '''
from datetime import datetime

def format_date(dt: datetime) -> str:
    return dt.strftime("%Y-%m-%d")
'''

[test.assertions]
contains_any = [[".format(", "strftime"]]

[[test]]
name = "datetime_strptime"
description = "datetime.strptime() parsing"
tags = ["datetime", "parse"]

[test.python]
code = '''
from datetime import datetime

def parse_date(s: str) -> datetime:
    return datetime.strptime(s, "%Y-%m-%d")
'''

[test.assertions]
contains_any = [["parse_from_str", "NaiveDateTime::parse"]]

# =============================================================================
# Timedelta
# =============================================================================

[[test]]
name = "timedelta_creation"
description = "timedelta creation"
tags = ["datetime", "timedelta"]

[test.python]
code = '''
from datetime import timedelta

def days_duration(n: int) -> timedelta:
    return timedelta(days=n)
'''

[test.assertions]
contains_any = [["Duration::", "chrono::Duration"]]

[[test]]
name = "timedelta_addition"
description = "datetime + timedelta arithmetic"
tags = ["datetime", "timedelta"]

[test.python]
code = '''
from datetime import datetime, timedelta

def add_days(dt: datetime, days: int) -> datetime:
    return dt + timedelta(days=days)
'''

[test.assertions]
contains_any = [["+ Duration::", "checked_add", "chrono"]]
