}
'''

[[test]]
name = "datetime_constructor"
description = "datetime(year, month, day) constructor"
tags = ["datetime", "constructor"]

python = '''
from datetime import datetime

def create_date(year: int, month: int, day: int) -> datetime:
    return datetime(year, month, day)
'''

rust = '''
use chrono::DateTime;
pub fn create_date(year: i32, month: i32, day: i32) -> datetime {
    return chrono::NaiveDate::from_ymd_opt(year as i32, month as u32, day as u32)
        .unwrap()
        .and_hms_opt(0, 0, 0)
        .unwrap();
}
'''

