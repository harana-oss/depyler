[[test]]
name = "datetime_now"
description = "datetime.now() current time"
tags = ["datetime", "now"]

python = '''
from datetime import datetime

def get_current_time() -> datetime:
    return datetime.now()
'''

rust = '''
use chrono::DateTime;
pub fn get_current_time() -> datetime {
    return chrono::Local::now().naive_local();
}
'''

[[test]]
name = "datetime_utcnow"
description = "datetime.utcnow() UTC time"
tags = ["datetime", "utc"]

python = '''
from datetime import datetime

def get_utc_time() -> datetime:
    return datetime.utcnow()
'''

rust = '''
use chrono::DateTime;
pub fn get_utc_time() -> datetime {
