[metadata]
name = "Datetime and Time Module Tests"
category = "stdlib-datetime-time"

# =============================================================================
# Datetime Creation
# =============================================================================

[[test]]
name = "datetime_now"
description = "datetime.now() current time"

python = '''
from datetime import datetime

def get_current_time() -> datetime:
    return datetime.now()
'''

rust = '''
use chrono::DateTime;
pub fn get_current_time() -> datetime {
    return chrono::Local::now().naive_local();
}
'''

[[test]]
name = "datetime_utcnow"
description = "datetime.utcnow() UTC time"

python = '''
from datetime import datetime

def get_utc_time() -> datetime:
    return datetime.utcnow()
'''

rust = '''
use chrono::DateTime;
pub fn get_utc_time() -> datetime {
    return chrono::Utc::now().naive_utc();
}
'''

[[test]]
name = "datetime_constructor"
skip = true
description = "datetime(year, month, day) constructor"

python = '''
from datetime import datetime

def create_date(year: int, month: int, day: int) -> datetime:
    return datetime(year, month, day)
'''

rust = '''
use chrono::DateTime;
pub fn create_date(year: i32, month: i32, day: i32) -> datetime {
    return chrono::NaiveDate::from_ymd_opt(year as i32, month as u32, day as u32)
        .unwrap()
        .and_hms_opt(0, 0, 0)
        .unwrap();
}
'''

[[test]]
name = "datetime_date_extraction"
description = "datetime component extraction"

python = '''
from datetime import datetime

def get_year(dt: datetime) -> int:
    return dt.year
'''

rust = '''
use chrono::DateTime;
pub fn get_year(dt: &datetime) -> i32 {
    return dt.year() as i32;
}
'''

