[[test]]
name = "time_sleep"
description = "time.sleep() delay"

python = '''
import time

def wait_seconds(seconds: float) -> None:
    time.sleep(seconds)
'''

rust = '''
pub fn wait_seconds(seconds: f64) {
    std::thread::sleep(std::time::Duration::from_secs_f64(seconds));
}
'''

[[test]]
name = "time_time"
description = "time.time() unix timestamp"

python = '''
import time

def get_timestamp() -> float:
    return time.time()
'''

rust = '''
pub fn get_timestamp() -> f64 {
    return std::time::SystemTime::now()
        .duration_since(std::time::UNIX_EPOCH)
        .unwrap()
        .as_secs_f64();
}
'''

[[test]]
name = "datetime_strftime"
description = "datetime.strftime() formatting"

python = '''
from datetime import datetime

def format_date(dt: datetime) -> str:
    return dt.strftime("%Y-%m-%d")
'''

rust = '''
use chrono::DateTime;
pub fn format_date(dt: &datetime) -> String {
    return dt.strftime("%Y-%m-%d");
}
'''

[[test]]
name = "datetime_strptime"
description = "datetime.strptime() parsing"

python = '''
from datetime import datetime

def parse_date(s: str) -> datetime:
    return datetime.strptime(s, "%Y-%m-%d")
'''

rust = '''
use chrono::DateTime;
pub fn parse_date(s: String) -> datetime {
    return chrono::NaiveDateTime::parse_from_str(s, "%Y-%m-%d").unwrap();
}
'''

[[test]]
name = "timedelta_creation"
description = "timedelta creation"

python = '''
from datetime import timedelta

def days_duration(n: int) -> timedelta:
    return timedelta(days=n)
'''

rust = '''
use chrono::Duration;
pub fn days_duration(n: i32) -> timedelta {
    return chrono::Duration::zero();
}
'''

[[test]]
name = "timedelta_addition"
description = "datetime + timedelta arithmetic"

python = '''
from datetime import datetime, timedelta

def add_days(dt: datetime, days: int) -> datetime:
    return dt + timedelta(days=days)
'''

rust = '''
use chrono::DateTime;
use chrono::Duration;
pub fn add_days(dt: &datetime, days: i32) -> datetime {
    return dt + chrono::Duration::zero();
}
'''

