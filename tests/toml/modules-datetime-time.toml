# Datetime and Time Module Tests - Migrated from test_datetime_unit.rs, test_time_unit.rs

[metadata]
name = "Datetime and Time Module Tests"
category = "stdlib-datetime-time"

# =============================================================================
# Datetime Creation
# =============================================================================

[[test]]
name = "datetime_now"
description = "datetime.now() current time"
tags = ["datetime", "now"]

[test.python]
code = '''
from datetime import datetime

def get_current_time() -> datetime:
    return datetime.now()
'''

[test.assertions]
contains_any = [["chrono::Local::now()", "Local::now"]]

[[test]]
name = "datetime_utcnow"
description = "datetime.utcnow() UTC time"
tags = ["datetime", "utc"]

[test.python]
code = '''
from datetime import datetime

def get_utc_time() -> datetime:
    return datetime.utcnow()
'''

[test.assertions]
contains_any = [["chrono::Utc::now()", "Utc::now"]]

[[test]]
name = "datetime_constructor"
description = "datetime(year, month, day) constructor"
tags = ["datetime", "constructor"]

[test.python]
code = '''
from datetime import datetime

def create_date(year: int, month: int, day: int) -> datetime:
    return datetime(year, month, day)
'''

[test.assertions]
contains_any = [["NaiveDate::", "DateTime::", "chrono"]]

