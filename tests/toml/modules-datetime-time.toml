[[test]]
name = "timedelta_arithmetic"
skip = true
description = "timedelta addition"

python = '''
from datetime import timedelta

def add_deltas(a: timedelta, b: timedelta) -> timedelta:
    return a + b
'''

rust = '''
use chrono::Duration;
pub fn add_deltas(a: &chrono::Duration, b: &chrono::Duration) -> chrono::Duration {
    return *a + *b;
}
'''