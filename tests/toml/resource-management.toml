[metadata]
name = "Resource Management Tests"
category = "resources"

# =============================================================================
# File Handle Cleanup
# =============================================================================

[[test]]
name = "file_handle_cleanup"
skip = true
description = "File handle automatic cleanup"

python = '''
def read_file_safe(path: str) -> str:
    with open(path, 'r') as f:
        return f.read()
'''

rust = '''
pub fn read_file_safe(path: String) -> String {
    return std::fs::read_to_string(path).unwrap_or_default();
}
'''

[[test]]
name = "file_write_cleanup"
description = "File write with cleanup"

python = '''
def write_file_safe(path: str, content: str) -> bool:
    try:
        with open(path, 'w') as f:
            f.write(content)
        return True
    except IOError:
        return False
'''

rust = '''
pub fn write_file_safe(path: String, content: String) -> bool {
    match std::fs::write(path, content) {
        Ok(_) => return true,
        Err(_) => return false,
    }
}
'''

[[test]]
name = "file_lines_cleanup"
skip = true
description = "Read file lines with cleanup"

python = '''
def count_lines(path: str) -> int:
    count = 0
    with open(path, 'r') as f:
        for _ in f:
            count += 1
    return count
'''

rust = '''
pub fn count_lines(path: String) -> i32 {
    match std::fs::read_to_string(path) {
        Ok(content) => return content.lines().count() as i32,
        Err(_) => return 0,
    }
}
'''

# =============================================================================
# Socket Cleanup
# =============================================================================

[[test]]
name = "socket_cleanup"
description = "Socket resource cleanup"

python = '''
class Connection:
    def __init__(self, host: str, port: int):
        self.host = host
        self.port = port
        self.connected = False
    
    def connect(self) -> bool:
        self.connected = True
        return True
    
    def disconnect(self) -> None:
        self.connected = False
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Connection {
    pub host: String,
    pub port: i32,
    pub connected: bool,
}
impl Connection {
    pub fn new(host: String, port: i32) -> Self {
        Self {
            host,
            port,
            connected: false,
        }
    }
    pub fn connect(&mut self) -> bool {
        self.connected = true;
        return true;
    }
    pub fn disconnect(&mut self) {
        self.connected = false;
    }
}
'''

[[test]]
name = "socket_auto_close"
skip = true
description = "Socket auto-close pattern"

python = '''
class AutoCloser:
    def __init__(self):
        self.open = True
    
    def close(self) -> None:
        self.open = False
    
    def is_open(self) -> bool:
        return self.open
'''

rust = '''
#[derive(Debug, Copy, Clone]
pub struct AutoCloser {
    pub open: bool,
}
impl AutoCloser {
    pub fn new() -> Self {
        Self { open: true }
    }
    pub fn close(&mut self) {
        self.open = false;
    }
    pub fn is_open(&self) -> bool {
        return self.open;
    }
}
impl Drop for AutoCloser {
    fn drop(&mut self) {
        self.close();
    }
}
'''

