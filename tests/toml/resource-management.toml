# =============================================================================
# Nested Resource Cleanup
# =============================================================================

[[test]]
name = "nested_resource_cleanup"
skip = true
description = "Nested resource cleanup order"

python = '''
class Outer:
    def __init__(self):
        self.inner = None
        self.closed = False
    
    def set_inner(self, inner) -> None:
        self.inner = inner
    
    def close(self) -> None:
        if self.inner:
            self.inner.close()
        self.closed = True

class Inner:
    def __init__(self):
        self.closed = False
    
    def close(self) -> None:
        self.closed = True
'''

rust = '''
#[derive(Debug, Copy, Clone]
pub struct Inner {
    pub closed: bool,
}
impl Inner {
    pub fn new() -> Self {
        Self { closed: false }
    }
    pub fn close(&mut self) {
        self.closed = true;
    }
}
impl Drop for Inner {
    fn drop(&mut self) {
        self.close();
    }
}
#[derive(Debug, Clone)]
pub struct Outer {
    pub inner: Option<Inner>,
    pub closed: bool,
}
impl Outer {
    pub fn new() -> Self {
        Self {
            inner: None,
            closed: false,
        }
    }
    pub fn set_inner(&mut self, inner: Inner) {
        self.inner = Some(inner);
    }
    pub fn close(&mut self) {
        if let Some(ref mut inner) = self.inner {
            inner.close();
        }
        self.closed = true;
    }
}
impl Drop for Outer {
    fn drop(&mut self) {
        self.close();
    }
}
'''

[[test]]
name = "resource_stack"
description = "Stack of resources cleanup"

python = '''
class ResourceStack:
    def __init__(self):
        self.resources = []
    
    def push(self, name: str) -> None:
        self.resources.append(name)
    
    def pop(self) -> str:
        if len(self.resources) > 0:
            return self.resources.pop()
        return ""
    
    def cleanup_all(self) -> None:
        while len(self.resources) > 0:
            self.resources.pop()
'''

rust = '''
use serde_json;
#[derive(Debug, Clone)]
pub struct ResourceStack {
    pub resources: Vec<serde_json::Value>,
}
impl ResourceStack {
    pub fn new() -> Self {
        Self { resources: vec![] }
    }
    pub fn push(&mut self, name: String) {
        self.resources.push(name);
    }
    pub fn pop(&mut self) -> String {
        if self.resources.len() > 0 {
            return self.resources.pop().unwrap();
        }
        return "".to_string();
    }
    pub fn cleanup_all(&mut self) {
        while self.resources.len() > 0 {
            self.resources.pop().unwrap();
        }
    }
}
'''

# =============================================================================
# Exception During Cleanup
# =============================================================================

[[test]]
name = "exception_during_cleanup"
description = "Exception handling during cleanup"

python = '''
class SafeResource:
    def __init__(self):
        self.acquired = True
    
    def release(self) -> bool:
        if self.acquired:
            self.acquired = False
            return True
        return False
    
    def is_acquired(self) -> bool:
        return self.acquired
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct SafeResource {
    pub acquired: bool,
}
impl SafeResource {
    pub fn new() -> Self {
        Self { acquired: true }
    }
    pub fn release(&mut self) -> bool {
        if self.acquired {
            self.acquired = false;
            return true;
        }
        return false;
    }
    pub fn is_acquired(&self) -> bool {
        return self.acquired;
    }
}
'''

[[test]]
name = "cleanup_error_handling"
skip = true
description = "Handle errors during cleanup"

python = '''
def cleanup_with_error(should_fail: bool) -> bool:
    try:
        if should_fail:
            raise ValueError("cleanup failed")
        return True
    except ValueError:
        return False
'''

rust = '''
pub fn cleanup_with_error(should_fail: bool) -> bool {
    if should_fail {
        return false;
    }
    return true;
}
'''

[[test]]
name = "finally_cleanup"
skip = true
description = "Finally block cleanup"

python = '''
def always_cleanup() -> int:
    result = 0
    try:
        result = 1
    finally:
        result += 1
    return result
'''

rust = '''
pub fn always_cleanup() -> i32 {
    let mut result = 0;
    result = 1;
    result += 1;
    return result;
}
'''
