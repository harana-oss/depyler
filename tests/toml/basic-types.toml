[[test]]
name = "tuple_struct_field_in"
description = "Struct field 'in' tuple check"

python = '''
@dataclass
class State:
    item: str

def check_location(state: State) -> bool:
    return state.item in ("Home", "Away")
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub item: String,
}
impl State {
    pub fn new(item: String) -> Self {
        Self { item }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "item" => Some(Box::new(self.item.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "item" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.item = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn check_location(state: &State) -> bool {
    return ["Home", "Away"].contains(&state.item.as_str());
}
'''

