# Basic Types Tests - Migrated from test_constants.rs, test_boolean_conversion.rs, test_dynamic_type.rs

[[test]]
name = "simple_constants"
description = "Numeric constants should transpile to Rust const"

[test.python]
code = '''
A = -1
B = 2.0
C = 3
'''

[test.assertions]
contains = ["A", "B", "C", "1", "2", "3"]
contains_any = [
    ["pub const A: i64 = -1", "pub const A: i32 = -1"],
    ["pub const B: f64 = 2.0"],
    ["pub const C: i64 = 3", "pub const C: i32 = 3"]
]

[[test]]
name = "constants_with_types"
description = "Typed integer constants should transpile to Rust const"

[test.python]
code = '''
A: int = -1
B: int = 2
C: int = 3
'''

[test.assertions]
contains = ["A", "B", "C"]
contains_any = [
    ["pub const A: i64 = -1", "pub const A: i32 = -1"],
    ["pub const B: i64 = 2", "pub const B: i32 = 2"],
    ["pub const C: i64 = 3", "pub const C: i32 = 3"]
]

[[test]]
name = "string_constants"
description = "String constants should be preserved in output"

[test.python]
code = '''
NAME = "Alice"
GREETING = "Hello"
MESSAGE = "World"
'''

[test.assertions]
contains = ["NAME", "GREETING", "MESSAGE", "Alice", "Hello", "World"]

[[test]]
name = "mixed_type_constants"
description = "Mixed type constants should preserve their types"

[test.python]
code = '''
INT_VALUE = 42
FLOAT_VALUE = 3.14
STRING_VALUE = "test"
BOOL_VALUE = True
'''

[test.assertions]
contains = ["INT_VALUE", "FLOAT_VALUE", "STRING_VALUE", "BOOL_VALUE", "42", "3.14", "test"]
contains_any = [["true", "True"]]

[[test]]
name = "generated_constants_compiles"
description = "Simple constant declarations should compile"

[test.python]
code = '''
A = 1
B = 2
C = 3
'''

[test.assertions]
contains = ["A"]

[[test]]
name = "constants_used_in_function"
description = "Constants used in functions should be accessible"

[test.python]
code = '''
A = 1
B = 2
C = 3

def sum_constants() -> int:
    return A + B + C
'''

[test.assertions]
contains = ["A", "B", "C", "sum_constants"]

