[[test]]
name = "lazy_static_in_if_else"
description = "Using different lazy_static constants in if/else branches should work with clone()"

python = '''
X_VALUES = [[0, 100], [100, 200]]
X_VALUES_AWAY = [[50, 150], [150, 250]]

def get_values(is_home: bool) -> list[list[int]]:
    x_ranges: list[list[int]]
    if is_home:
        x_ranges = X_VALUES
    else:
        x_ranges = X_VALUES_AWAY
    return x_ranges
'''

rust = '''
lazy_static! {
    pub static ref X_VALUES: Vec<Vec<i32>> = vec![vec![0, 100], vec![100, 200]];
    pub static ref X_VALUES_AWAY: Vec<Vec<i32>> = vec![vec![50, 150], vec![150, 250]];
}
use lazy_static::lazy_static;
pub fn get_values(is_home: bool) -> Vec<Vec<i32>> {
    let mut x_ranges: Vec<Vec<i32>>;
    if is_home {
        x_ranges = X_VALUES.clone();
    } else {
        x_ranges = X_VALUES_AWAY.clone();
    }
    return x_ranges;
}
'''

