[[test]]
name = "error_handling_example"
description = "Safe division with error handling"
compile_check = true

python = '''
def div_safe(a: int, b: int) -> int:
    return a // b if b != 0 else 0
'''

rust = '''
pub fn div_safe(a: i32, b: i32) -> i32 {
    return if b != 0 {
        {
            let a = a;
            let b = b;
            let q = a / b;
            let r = a % b;
            let r_negative = r < 0;
            let b_negative = b < 0;
            let r_nonzero = r != 0;
            let signs_differ = r_negative != b_negative;
            let needs_adjustment = r_nonzero && signs_differ;
            if needs_adjustment { q - 1 } else { q }
        }
    } else {
        0
    };
}
'''

