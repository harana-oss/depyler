[[test]]
name = "method_call_on_param"
description = "Method call on param attribute handles correctly"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    items: list[int]

def get_length(state: State) -> int:
    return len(state.items)
'''

rust = '''
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub items: Vec<i32>,
}
impl State {
    pub fn new(items: Vec<i32>) -> Self {
        Self { items }
    }
}
pub fn get_length(state: &State) -> i32 {
    return state.items.len() as i32;
}
'''

[[test]]
name = "deeply_nested_attribute_access"
description = "Deeply nested attribute access a.b.c.d detects a as param"

python = '''
from dataclasses import dataclass

@dataclass
class D:
    value: int

@dataclass
class C:
    d: D

@dataclass
class B:
    c: C

@dataclass
class A:
    b: B

def get_deep(a: A) -> int:
    return a.b.c.d.value
'''

rust = '''
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct D {
    pub value: i32,
}
impl D {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct C {
    pub d: D,
}
impl C {
    pub fn new(d: D) -> Self {
        Self { d }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct B {
    pub c: C,
}
impl B {
    pub fn new(c: C) -> Self {
        Self { c }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct A {
    pub b: B,
}
impl A {
    pub fn new(b: B) -> Self {
        Self { b }
    }
}
pub fn get_deep(a: &A) -> i32 {
    return a.b.c.d.value;
}
'''

[[test]]
name = "multiple_params_attribute_access"
description = "Multiple params with attribute access on each"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

def add_coords(p1: Point, p2: Point) -> int:
    return p1.x + p2.y
'''

rust = '''
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
pub fn add_coords(p1: &Point, p2: &Point) -> i32 {
    return p1.x + p2.y;
}
'''
