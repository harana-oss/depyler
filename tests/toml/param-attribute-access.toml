[metadata]
name = "Parameter Attribute Access Detection Tests"
category = "ownership-mutability"
description = "Tests for detecting attribute access on specific parameters"

[[test]]
name = "direct_attribute_access"
description = "Direct attribute access state.data with param state returns true"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    data: int

def get_data(state: State) -> int:
    return state.data
'''

rust = '''
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub data: i32,
}
impl State {
    pub fn new(data: i32) -> Self {
        Self { data }
    }
}
pub fn get_data(state: &State) -> i32 {
    return state.data;
}
'''

[[test]]
name = "nested_attribute_access"
description = "Nested attribute access state.data.items detects state as param"

python = '''
from dataclasses import dataclass

@dataclass
class Inner:
    value: int

@dataclass
class State:
    inner: Inner

def get_nested(state: State) -> int:
    return state.inner.value
'''

rust = '''
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Inner {
    pub value: i32,
}
impl Inner {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub inner: Inner,
}
impl State {
    pub fn new(inner: Inner) -> Self {
        Self { inner }
    }
}
pub fn get_nested(state: &State) -> i32 {
    return state.inner.value;
}
'''

