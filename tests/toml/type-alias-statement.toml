[[test]]
name = "type_alias_protocol"
skip = true
description = "type Comparable = Protocol with __lt__"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
use serde_json;
#[derive(Debug, Clone)]
pub struct Example {
    pub value: serde_json::Value,
}
impl Example {
    pub fn new(value: serde_json::Value) -> Self {
        Self { value }
    }
}
fn main() {
    let result = Example::new(42);
}
'''


