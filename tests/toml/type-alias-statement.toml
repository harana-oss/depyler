let result: Point = (1, 2);
'''


[[test]]
name = "type_alias_protocol"
description = "type Comparable = Protocol with __lt__"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example { value: i32 }
'''


