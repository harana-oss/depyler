[metadata]
name = "Type Alias Statement Tests"
category = "modern-python"

# =============================================================================
# Basic Type Alias
# =============================================================================

[[test]]
name = "type_alias_basic"
description = "type Point = tuple[int, int]"

python = '''
type Point = tuple[int, int]

result: Point = (1, 2)
'''

rust = '''
type Point = (i32, i32);
let result: Point = (1, 2);
'''


[[test]]
name = "type_alias_generic"
description = "type IntList = list[int]"

python = '''
type Point = tuple[int, int]

result: Point = (1, 2)
'''

rust = '''
type Point = (i32, i32);
let result: Point = (1, 2);
'''


[[test]]
name = "type_alias_union"
description = "type MaybeInt = int | None"

python = '''
type Point = tuple[int, int]

result: Point = (1, 2)
'''

rust = '''
type Point = (i32, i32);
let result: Point = (1, 2);
'''


