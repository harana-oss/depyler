# =============================================================================
# vs TypeAlias (Pre-3.12)
# =============================================================================

[[test]]
name = "type_alias_vs_old"
description = "type X = ... vs X: TypeAlias = ..."

python = '''
type Point = tuple[int, int]

result: Point = (1, 2)
'''

rust = '''
type Point = (i32, i32);
let result: Point = (1, 2);
'''


[[test]]
name = "type_alias_lazy"
description = "type statement supports forward references"

python = '''
type Point = tuple[int, int]

result: Point = (1, 2)
'''

rust = '''
type Point = (i32, i32);
let result: Point = (1, 2);
'''


