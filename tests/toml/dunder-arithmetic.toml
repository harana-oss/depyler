skip = true

python = '''
# Arithmetic with None typically raises TypeError
try:
    result = 5 + None
except TypeError:
    result = True
assert result == True
'''

rust = '''
// Rust: Option<T> requires explicit handling
let x = Some(5);
let y: Option<i32> = None;
let result = x.unwrap_or(0) + y.unwrap_or(0);
assert_eq!(result, 5);
'''


[[test]]
name = "custom_numeric"
description = "Full numeric type implementation"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __add__(self, other):
        return Number(self.value + other.value)
    def __sub__(self, other):
        return Number(self.value - other.value)
    def __mul__(self, other):
        return Number(self.value * other.value)

a = Number(10)
b = Number(5)
result = (a + b) * Number(2)
assert result.value == 30
'''

rust = '''
// Rust: implementing arithmetic traits
#[derive(Clone, Copy)]
struct Number { value: i32 }
impl std::ops::Add for Number {
    type Output = Number;
    fn add(self, other: Number) -> Number {
        Number { value: self.value + other.value }
    }
}
impl std::ops::Mul for Number {
    type Output = Number;
    fn mul(self, other: Number) -> Number {
        Number { value: self.value * other.value }
    }
}
let a = Number { value: 10 };
let b = Number { value: 5 };
let result = (a + b) * Number { value: 2 };
assert_eq!(result.value, 30);
'''

