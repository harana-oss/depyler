# =============================================================================
# Chained Arithmetic
# =============================================================================

[[test]]
name = "arithmetic_chained"
skip = true
description = "a + b + c evaluates left to right"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __add__(self, other):
        return Number(self.value + other.value)

a = Number(1)
b = Number(2)
c = Number(3)
result = a + b + c
assert result.value == 6
'''

rust = '''
    struct Number {
        value: i32,
    }
    impl std::ops::Add for Number {
        type Output = Number;
        fn add(self, other: Number) -> Number {
            Number {
                value: self.value + other.value,
            }
        }
    }
    let a = Number { value: 1 };
    let b = Number { value: 2 };
    let c = Number { value: 3 };
    let result = a + b + c;
    assert_eq!(result.value, 6);
'''


[[test]]
name = "arithmetic_mixed"
skip = true
description = "a + b * c follows precedence"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __add__(self, other):
        return Number(self.value + other.value)
    def __mul__(self, other):
        return Number(self.value * other.value)

a = Number(2)
b = Number(3)
c = Number(4)
result = a + b * c
assert result.value == 14  # 2 + (3 * 4)
'''

rust = '''
    struct Number {
        value: i32,
    }
    impl std::ops::Add for Number {
        type Output = Number;
        fn add(self, other: Number) -> Number {
            Number {
                value: self.value + other.value,
            }
        }
    }
    impl std::ops::Mul for Number {
        type Output = Number;
        fn mul(self, other: Number) -> Number {
            Number {
                value: self.value * other.value,
            }
        }
    }
    let a = Number { value: 2 };
    let b = Number { value: 3 };
    let c = Number { value: 4 };
    let result = a + b * c;
    assert_eq!(result.value, 14);
'''


