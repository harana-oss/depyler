[[test]]
name = "arithmetic_coercion"
description = "Handling different numeric types"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __add__(self, other):
        if isinstance(other, Number):
            return Number(self.value + other.value)
        return Number(self.value + other)

n = Number(10)
result = n + 5
assert result.value == 15
'''

rust = '''
// Rust: explicit type conversion
struct Number { value: i32 }
impl std::ops::Add<i32> for Number {
    type Output = Number;
    fn add(self, other: i32) -> Number {
        Number { value: self.value + other }
    }
}
let n = Number { value: 10 };
let result = n + 5;
assert_eq!(result.value, 15);
'''


# =============================================================================
# Return NotImplemented
# =============================================================================

[[test]]
name = "arithmetic_notimplemented"
description = "Return NotImplemented for unsupported types"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __add__(self, other):
        if isinstance(other, Number):
            return Number(self.value + other.value)
        return NotImplemented

n = Number(10)
try:
    result = n + "string"
except TypeError:
    result = True
assert result == True
'''

rust = '''
// Rust: type system prevents unsupported operations at compile time
struct Number { value: i32 }
// Number + String would not compile
let result = true;
assert!(result);
'''


