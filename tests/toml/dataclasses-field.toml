# =============================================================================
# Metadata
# =============================================================================

[[test]]
name = "field_metadata"
skip = true
description = "field(metadata={'unit': 'meters'})"

python = '''
from dataclasses import dataclass, field, fields

@dataclass
class Distance:
    value: float = field(metadata={'unit': 'meters'})

d = Distance(100.0)
field_info = fields(d)[0]
result = field_info.metadata['unit'] == 'meters'
'''

rust = '''
    // Rust doesn't have built-in field metadata like Python dataclasses
    // This would typically be done with macros or documentation
    #[derive(Debug)]
    struct Distance {
        value: f64,
    }

    let d = Distance { value: 100.0 };
    // Metadata would be compile-time only in Rust
    let result = true;
'''


