[[test]]
name = "field_callable_factory"
skip = true
description = "field(default_factory=MyClass)"

python = '''
from dataclasses import dataclass, field

class MyClass:
    def __init__(self):
        self.value = 42

@dataclass
class Container:
    obj: MyClass = field(default_factory=MyClass)

c = Container()
result = c.obj.value == 42
'''

rust = '''
    #[derive(Debug)]
    struct MyClass {
        value: i32,
    }

    impl Default for MyClass {
        fn default() -> Self {
            MyClass { value: 42 }
        }
    }

    #[derive(Debug)]
    struct Container {
        obj: MyClass,
    }

    impl Default for Container {
        fn default() -> Self {
            Container {
                obj: MyClass::default(),
            }
        }
    }

    let c = Container::default();
    let result = c.obj.value == 42;
'''


[[test]]
name = "field_default_factory_set"
skip = true
description = "field(default_factory=set)"

python = '''
from dataclasses import dataclass, field
from typing import Set

@dataclass
class State:
    executed_events: Set[str] = field(default_factory=set)

s1 = State()
s2 = State()
s1.executed_events.add("event1")
result = len(s1.executed_events) == 1 and len(s2.executed_events) == 0
'''

rust = '''
    use std::collections::HashSet;
    #[derive(Debug)]
    struct State {
        executed_events: HashSet<String>,
    }

    impl State {
        fn new() -> Self {
            State {
                executed_events: HashSet::new(),
            }
        }
    }

    let mut s1 = State::new();
    let s2 = State::new();
    s1.executed_events.insert("event1".to_string());
    let result = s1.executed_events.len() == 1 && s2.executed_events.len() == 0;
'''


