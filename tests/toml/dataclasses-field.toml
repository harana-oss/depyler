[[test]]
name = "field_classvar_shared"
skip = true
description = "ClassVar shared across instances"

python = '''
from dataclasses import dataclass
from typing import ClassVar

@dataclass
class Counter:
    count: ClassVar[int] = 0
    id: int

c1 = Counter(1)
c2 = Counter(2)
Counter.count = 42
result = Counter.count == 42
'''

rust = '''
    use std::sync::atomic::{AtomicI32, Ordering};

    static COUNT: AtomicI32 = AtomicI32::new(0);

    #[derive(Debug)]
    struct Counter {
        id: i32,
    }

    let c1 = Counter { id: 1 };
    let c2 = Counter { id: 2 };
    COUNT.store(42, Ordering::Relaxed);
    let result = COUNT.load(Ordering::Relaxed) == 42;
'''


# =============================================================================
# KW_ONLY (Python 3.10+)
# =============================================================================

[[test]]
name = "field_kw_only_sentinel"
skip = true
description = "_: KW_ONLY marker"

python = '''
from dataclasses import dataclass, KW_ONLY

@dataclass
class Point:
    x: int
    _: KW_ONLY
    y: int

# y must be passed as keyword argument
p = Point(1, y=2)
result = p.x == 1 and p.y == 2
'''

rust = '''
    // Rust doesn't distinguish positional vs keyword arguments
    // Use builder pattern for similar functionality
    #[derive(Debug)]
    struct Point {
        x: i32,
        y: i32,
    }

    let p = Point { x: 1, y: 2 };
    let result = p.x == 1 && p.y == 2;
'''


[[test]]
name = "field_kw_only"
skip = true
description = "field(kw_only=True)"

python = '''
from dataclasses import dataclass, field

@dataclass
class Point:
    x: int
    y: int = field(kw_only=True)

p = Point(1, y=2)
result = p.x == 1 and p.y == 2
'''

rust = '''
    // Rust requires all struct fields to be named in initialization
    #[derive(Debug)]
    struct Point {
        x: i32,
        y: i32,
    }

    let p = Point { x: 1, y: 2 };
    let result = p.x == 1 && p.y == 2;
'''


# =============================================================================
# Field Order
# =============================================================================

[[test]]
name = "field_order_defaults"
skip = true
description = "Fields with defaults after fields without"

python = '''
from dataclasses import dataclass

@dataclass
class Person:
    name: str
    age: int = 0
    city: str = "Unknown"

p = Person("Alice")
result = p.name == "Alice" and p.age == 0 and p.city == "Unknown"
'''

rust = '''
    #[derive(Debug)]
    struct Person {
        name: String,
        age: i32,
        city: String,
    }

    impl Person {
        fn new(name: String) -> Self {
            Person {
                name,
                age: 0,
                city: "Unknown".to_string(),
            }
        }
    }

    let p = Person::new("Alice".to_string());
    let result = p.name == "Alice" && p.age == 0 && p.city == "Unknown";
'''


[[test]]
name = "field_kw_only_reorder"
skip = true
description = "KW_ONLY fields can have defaults anywhere"

python = '''
from dataclasses import dataclass, field

@dataclass
class Config:
    name: str
    port: int = field(default=8080, kw_only=True)
    host: str = field(kw_only=True)

c = Config("app", host="localhost")
result = c.name == "app" and c.port == 8080 and c.host == "localhost"
'''

rust = '''
    // Rust builder pattern for flexible initialization
    #[derive(Debug)]
    struct Config {
        name: String,
        port: i32,
        host: String,
    }

    impl Config {
        fn new(name: String, host: String) -> Self {
            Config {
                name,
                port: 8080,
                host,
            }
        }
    }

    let c = Config::new("app".to_string(), "localhost".to_string());
    let result = c.name == "app" && c.port == 8080 && c.host == "localhost";
'''


