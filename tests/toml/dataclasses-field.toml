c = Config(30)
meta = fields(c)[0].metadata
result = meta['unit'] == 'seconds' and meta['min'] == 0
'''

rust = '''
    // Rust doesn't have runtime field metadata access
    #[derive(Debug)]
    struct Config {
        timeout: i32,
    }

    let c = Config { timeout: 30 };
    let result = true;
'''


