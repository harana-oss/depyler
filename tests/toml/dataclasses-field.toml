[metadata]
name = "Dataclasses Field Tests"
category = "data-structures"

# =============================================================================
# Default Values
# =============================================================================

[[test]]
name = "field_default"
skip = true
description = "field(default=0)"

python = '''
from dataclasses import dataclass, field

@dataclass
class Counter:
    value: int = field(default=0)

c = Counter()
result = c.value == 0
'''

rust = '''
    #[derive(Debug)]
    struct Counter {
        value: i32,
    }

    impl Default for Counter {
        fn default() -> Self {
            Counter { value: 0 }
        }
    }

    let c = Counter::default();
    let result = c.value == 0;
'''


[[test]]
name = "field_default_factory"
skip = true
description = "field(default_factory=list)"

python = '''
from dataclasses import dataclass, field

@dataclass
class Collection:
    items: list = field(default_factory=list)

c1 = Collection()
c2 = Collection()
c1.items.append(1)
result = len(c1.items) == 1 and len(c2.items) == 0
'''

rust = '''
    #[derive(Debug)]
    struct Collection {
        items: Vec<i32>,
    }

    impl Default for Collection {
        fn default() -> Self {
            Collection { items: Vec::new() }
        }
    }

    let mut c1 = Collection::default();
    let c2 = Collection::default();
    c1.items.push(1);
    let result = c1.items.len() == 1 && c2.items.len() == 0;
'''


