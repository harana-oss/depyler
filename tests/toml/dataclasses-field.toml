[[test]]
name = "field_default_factory_mixed"
skip = true
description = "Multiple fields with different default_factory types"

python = '''
from dataclasses import dataclass, field
from typing import Set, List, Dict

@dataclass
class ComplexState:
    events: Set[str] = field(default_factory=set)
    items: List[int] = field(default_factory=list)
    metadata: Dict[str, int] = field(default_factory=dict)
    count: int = field(default=0)
    name: str = field(default="unknown")

c = ComplexState()
result = (len(c.events) == 0 and len(c.items) == 0 and 
          len(c.metadata) == 0 and c.count == 0 and c.name == "unknown")
'''

rust = '''
    use std::collections::{HashMap, HashSet};
    #[derive(Debug)]
    struct ComplexState {
        events: HashSet<String>,
        items: Vec<i32>,
        metadata: HashMap<String, i32>,
        count: i32,
        name: String,
    }

    impl ComplexState {
        fn new() -> Self {
            ComplexState {
                events: HashSet::new(),
                items: Vec::new(),
                metadata: HashMap::new(),
                count: 0,
                name: "unknown".to_string(),
            }
        }
    }

    let c = ComplexState::new();
    let result = c.events.len() == 0
        && c.items.len() == 0
        && c.metadata.len() == 0
        && c.count == 0
        && c.name == "unknown";
'''


# =============================================================================
# Field Options
# =============================================================================

[[test]]
name = "field_no_repr"
skip = true
description = "field(repr=False) excludes from repr"

python = '''
from dataclasses import dataclass, field

@dataclass
class User:
    name: str
    password: str = field(repr=False)

u = User("alice", "secret123")
repr_str = repr(u)
result = "alice" in repr_str and "secret123" not in repr_str
'''

rust = '''
    // In Rust, use custom Debug implementation to exclude fields
    #[derive(Debug)]
    struct User {
        name: String,
        #[allow(dead_code)]
        password: String,
    }

    impl std::fmt::Display for User {
        fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {
            write!(f, "User {{ name: {:?} }}", self.name)
        }
    }

    let u = User {
        name: "alice".to_string(),
        password: "secret123".to_string(),
    };
    let repr_str = format!("{:?}", u);
    let result = repr_str.contains("alice");
'''


[[test]]
name = "field_no_compare"
skip = true
description = "field(compare=False) excludes from eq/order"

python = '''
from dataclasses import dataclass, field

@dataclass
class Item:
    id: int
    metadata: str = field(compare=False)

i1 = Item(1, "meta1")
i2 = Item(1, "meta2")
result = i1 == i2
'''

rust = '''
    #[derive(Debug)]
    struct Item {
        id: i32,
        metadata: String,
    }

    impl PartialEq for Item {
        fn eq(&self, other: &Self) -> bool {
            self.id == other.id
        }
    }

    let i1 = Item {
        id: 1,
        metadata: "meta1".to_string(),
    };
    let i2 = Item {
        id: 1,
        metadata: "meta2".to_string(),
    };
    let result = i1 == i2;
'''


[[test]]
name = "field_hash"
skip = true
description = "field(hash=True) or field(hash=False)"

python = '''
from dataclasses import dataclass, field

@dataclass(frozen=True)
class Point:
    x: int
    y: int = field(hash=False)

p1 = Point(1, 2)
p2 = Point(1, 3)
result = hash(p1) == hash(p2)
'''

rust = '''
    use std::collections::hash_map::DefaultHasher;
    use std::hash::{Hash, Hasher};

    #[derive(Debug)]
    struct Point {
        x: i32,
        y: i32,
    }

    impl Hash for Point {
        fn hash<H: Hasher>(&self, state: &mut H) {
            self.x.hash(state);
            // y is excluded from hash
        }
    }

    fn calculate_hash<T: Hash>(t: &T) -> u64 {
        let mut s = DefaultHasher::new();
        t.hash(&mut s);
        s.finish()
    }

    let p1 = Point { x: 1, y: 2 };
    let p2 = Point { x: 1, y: 3 };
    let result = calculate_hash(&p1) == calculate_hash(&p2);
'''


