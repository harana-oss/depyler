# =============================================================================
# InitVar
# =============================================================================

[[test]]
name = "field_initvar"
skip = true
description = "x: InitVar[int]"

python = '''
from dataclasses import dataclass, InitVar

@dataclass
class C:
    x: int
    init_value: InitVar[int] = 10
    
    def __post_init__(self, init_value):
        self.x = self.x * init_value

c = C(5)
result = c.x == 50
'''

rust = '''
    // Rust uses builder pattern or constructor for similar functionality
    #[derive(Debug)]
    struct C {
        x: i32,
    }

    impl C {
        fn new(x: i32, init_value: i32) -> Self {
            C { x: x * init_value }
        }
    }

    let c = C::new(5, 10);
    let result = c.x == 50;
'''


[[test]]
name = "field_initvar_postinit"
skip = true
description = "InitVar passed to __post_init__"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __pos__(self):
        return Number(+self.value)

n = Number(5)
result = (+n).value
'''

rust = '''
// Rust doesn't have unary + operator trait
'''


[[test]]
name = "field_initvar_not_stored"
skip = true
description = "InitVar not an instance attribute"

python = '''
from dataclasses import dataclass, InitVar

@dataclass
class C:
    x: int
    multiplier: InitVar[int] = 2
    
    def __post_init__(self, multiplier):
        self.x = self.x * multiplier

c = C(5)
result = not hasattr(c, 'multiplier')
'''

rust = '''
    // In Rust, constructor parameters don't become fields unless stored
    #[derive(Debug)]
    struct C {
        x: i32,
    }

    impl C {
        fn new(x: i32, multiplier: i32) -> Self {
            C { x: x * multiplier }
        }
    }

    let c = C::new(5, 2);
    let result = true; // multiplier is not stored
'''


