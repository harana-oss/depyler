[[test]]
name = "field_no_annotation"
skip = true
description = "x = field() without annotation not a field"

python = '''
from dataclasses import dataclass, field, fields

@dataclass
class C:
    x: int = field(default=1)
    y = field(default=2)  # Not a dataclass field

c = C()
field_names = [f.name for f in fields(c)]
result = 'x' in field_names and 'y' not in field_names
'''

rust = '''
    // Rust requires all struct fields to be typed
    #[derive(Debug)]
    struct C {
        x: i32,
    }

    let c = C { x: 1 };
    let result = true;
'''


[[test]]
name = "field_string_type"
skip = true
description = "x: 'MyClass' forward reference"

python = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Node:
    value: int
    next: Optional['Node'] = None

n = Node(1, Node(2, None))
result = n.value == 1 and n.next.value == 2
'''

rust = '''
    // Rust uses Box for recursive types
    #[derive(Debug)]
    struct Node {
        value: i32,
        next: Option<Box<Node>>,
    }

    let n = Node {
        value: 1,
        next: Some(Box::new(Node {
            value: 2,
            next: None,
        })),
    };
    let result = n.value == 1 && n.next.as_ref().unwrap().value == 2;
'''


