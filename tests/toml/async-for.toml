[[test]]
name = "async_for_nested"
skip = true
description = "async for inside async for"
python = """
async def outer_iter():
    for i in range(3):
        yield i

async def inner_iter(x):
    for j in range(2):
        yield x * 10 + j

async def test():
    result = []
    async for i in outer_iter():
        async for j in inner_iter(i):
            result.append(j)
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

async fn inner_iter(x: i32) -> Vec<i32> {
    stream::iter(0..2).map(|j| x * 10 + j).collect().await
}

#[tokio::main]
async let mut result = Vec::new();
let mut outer = stream::iter(0..3);
while let Some(i) = outer.next().await {
    let inner_results = inner_iter(i).await;
    for j in inner_results {
        result.push(j);
    }
}
log::info!("{:?}", result);"""

