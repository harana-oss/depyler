# =============================================================================
# Async Iterator Protocol
# =============================================================================

[[test]]
name = "aiter"
skip = true
description = "def __aiter__(self): return self"
python = """
class AsyncRange:
    def __init__(self, n):
        self.n = n
        self.i = 0
    
    def __aiter__(self):
        return self
    
    async def __anext__(self):
        if self.i >= self.n:
            raise StopAsyncIteration
        value = self.i
        self.i += 1
        return value

async def test():
    result = []
    async for i in AsyncRange(5):
        result.append(i)
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, Stream, StreamExt};
use std::pin::Pin;
use std::task::{Context, Poll};

struct AsyncRange {
    n: i32,
    i: i32,
}

impl AsyncRange {
    fn new(n: i32) -> Self {
        AsyncRange { n, i: 0 }
    }
}

impl Stream for AsyncRange {
    type Item = i32;

    fn poll_next(mut self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<Option<Self::Item>> {
        if self.i >= self.n {
            Poll::Ready(None)
        } else {
            let value = self.i;
            self.i += 1;
            Poll::Ready(Some(value))
        }
    }
}

#[tokio::main]
async let mut result = Vec::new();
let mut stream = AsyncRange::new(5);
while let Some(i) = stream.next().await {
    result.push(i);
}
log::info!("{:?}", result);"""

[[test]]
name = "anext"
skip = true
description = "async def __anext__(self): ..."
python = """
class AsyncCounter:
    def __init__(self, start, end):
        self.current = start
        self.end = end
    
    def __aiter__(self):
        return self
    
    async def __anext__(self):
        if self.current >= self.end:
            raise StopAsyncIteration
        value = self.current
        self.current += 1
        return value

async def test():
    result = []
    async for i in AsyncCounter(0, 3):
        result.append(i)
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let result: Vec<i32> = stream::iter(0..3).collect().await;
log::info!("{:?}", result);"""

[[test]]
name = "stop_async_iteration"
skip = true
description = "raise StopAsyncIteration to end"
python = """
class AsyncLimit:
    def __init__(self, limit):
        self.limit = limit
        self.count = 0
    
    def __aiter__(self):
        return self
    
    async def __anext__(self):
        if self.count >= self.limit:
            raise StopAsyncIteration
        self.count += 1
        return self.count

async def test():
    result = []
    async for i in AsyncLimit(3):
        result.append(i)
    return result

import asyncio
print(asyncio.run(test()))
"""
