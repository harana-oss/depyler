[[test]]
name = "async_for_else"
skip = true
description = "async for ... else: (no break)"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def test():
    result = []
    async for i in async_range(3):
        result.append(i)
    else:
        result.append("completed")
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let mut result = Vec::new();
let mut stream = stream::iter(0..3);
let mut broke = false;
while let Some(i) = stream.next().await {
    result.push(i.to_string());
}
if !broke {
    result.push("completed".to_string());
}
log::info!("{:?}", result);"""

