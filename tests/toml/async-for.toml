# Basic Async For
# =============================================================================

[[test]]
name = "async_for_basic"
skip = true
description = "async for item in async_iter: ..."
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def test():
    result = []
    async for item in async_range(5):
        result.append(item)
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
