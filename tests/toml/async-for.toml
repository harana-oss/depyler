[[test]]
name = "async_iterator_state"
skip = true
description = "Iterator maintains state between awaits"
python = """
class AsyncAccumulator:
    def __init__(self, n):
        self.n = n
        self.i = 0
        self.sum = 0
    
    def __aiter__(self):
        return self
    
    async def __anext__(self):
        if self.i >= self.n:
            raise StopAsyncIteration
        self.sum += self.i
        self.i += 1
        return self.sum

async def test():
    result = []
    async for total in AsyncAccumulator(5):
        result.append(total)
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, Stream, StreamExt};
use std::pin::Pin;
use std::task::{Context, Poll};

struct AsyncAccumulator {
    n: i32,
    i: i32,
    sum: i32,
}

impl AsyncAccumulator {
    fn new(n: i32) -> Self {
        AsyncAccumulator { n, i: 0, sum: 0 }
    }
}

impl Stream for AsyncAccumulator {
    type Item = i32;

    fn poll_next(mut self: Pin<&mut Self>, _cx: &mut Context<'_>) -> Poll<Option<Self::Item>> {
        if self.i >= self.n {
            Poll::Ready(None)
        } else {
            self.sum += self.i;
            self.i += 1;
            Poll::Ready(Some(self.sum))
        }
    }
}

#[tokio::main]
async let mut result = Vec::new();
let mut stream = AsyncAccumulator::new(5);
while let Some(total) = stream.next().await {
    result.push(total);
}
log::info!("{:?}", result);"""

[[test]]
name = "async_iterator_cleanup"
skip = true
description = "Cleanup on iteration end"
python = """
class AsyncResource:
    def __init__(self, n):
        self.n = n
        self.i = 0
        self.closed = False
    
    def __aiter__(self):
        return self
    
    async def __anext__(self):
        if self.i >= self.n:
            self.closed = True
            raise StopAsyncIteration
        value = self.i
        self.i += 1
        return value

async def test():
    result = []
    resource = AsyncResource(3)
    async for value in resource:
        result.append(value)
    return result, resource.closed

import asyncio
r = asyncio.run(test())
print(r[0], r[1])
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let result: Vec<i32> = stream::iter(0..3).collect().await;
let closed = true;
log::info!("{:?} {}", result, closed);"""

