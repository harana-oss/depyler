[[test]]
name = "async_for_exception"
skip = true
description = "Exception during async iteration"
python = """
async def failing_async():
    for i in range(5):
        if i == 3:
            raise ValueError("Error at 3")
        yield i

async def test():
    result = []
    try:
        async for item in failing_async():
            result.append(item)
    except ValueError as e:
        result.append(str(e))
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let mut result = Vec::new();
let stream = stream::iter(0..5).map(|i| if i == 3 { Err("Error at 3") } else { Ok(i) });

futures::pin_mut!(stream);
while let Some(item) = stream.next().await {
    match item {
        Ok(val) => result.push(val.to_string()),
        Err(e) => {
            result.push(e.to_string());
            break;
        }
    }
}
log::info!("{:?}", result);"""

[[test]]
name = "aiter_anext_builtins"
skip = true
description = "aiter() and anext() helper functions"
python = """
async def async_range(n):
    for i in range(n):
        yield i

async def test():
    it = aiter(async_range(3))
    result = []
    result.append(await anext(it))
    result.append(await anext(it))
    result.append(await anext(it))
    try:
        await anext(it)
    except StopAsyncIteration:
        result.append("done")
    return result

import asyncio
print(asyncio.run(test()))
"""
rust = """
use futures::stream::{self, StreamExt};

#[tokio::main]
async let mut stream = stream::iter(0..3);
let mut result = Vec::new();
if let Some(val) = stream.next().await {
    result.push(val.to_string());
}
if let Some(val) = stream.next().await {
    result.push(val.to_string());
}
if let Some(val) = stream.next().await {
    result.push(val.to_string());
}
if stream.next().await.is_none() {
    result.push("done".to_string());
}
log::info!("{:?}", result);"""
