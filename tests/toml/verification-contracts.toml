[metadata]
name = "Verification and Contracts Tests"
category = "verification"

# =============================================================================
# Precondition Assertions
# =============================================================================

[[test]]
name = "precondition_assert"
skip = true
description = "Function preconditions"

python = '''
def divide(a: int, b: int) -> int:
    assert b != 0, "divisor cannot be zero"
    return a // b
'''

rust = '''
pub fn divide(a: i32, b: i32) -> i32 {
    assert!(b != 0, "divisor cannot be zero");
    return {
        let d = a / b;
        let r = a % b;
        if r != 0 && (a ^ b) < 0 {
            d - 1
        } else {
            d
        }
    };
}
'''

[[test]]
name = "precondition_range"
skip = true
description = "Range precondition assertion"

python = '''
def index_array(items: list[int], idx: int) -> int:
    assert 0 <= idx < len(items), "index out of bounds"
    return items[idx]
'''

rust = '''
pub fn index_array(items: &Vec<i32>, idx: i32) -> i32 {
    assert!(
        (0 <= idx) && (idx < items.len() as i32),
        "{}",
        "index out of bounds"
    );
    return items.get(idx as usize).cloned().unwrap();
}
'''

