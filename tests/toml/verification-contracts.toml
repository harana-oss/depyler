    return a + b;
}
'''

# =============================================================================
# Postcondition Assertions
# =============================================================================

[[test]]
name = "postcondition_assert"
skip = true
description = "Function postconditions"

python = '''
def absolute(n: int) -> int:
    if n < 0:
        result = -n
    else:
        result = n
    assert result >= 0, "result must be non-negative"
    return result
'''

rust = '''
pub fn absolute(n: i32) -> i32 {
    let result;
    if n < 0 {
        result = (-n);
    } else {
        result = n;
    }
    assert!(result >= 0, "result must be non-negative");
    return result;
}
'''

[[test]]
name = "postcondition_bounds"
description = "Bounds postcondition assertion"

python = '''
def clamp(value: int, min_val: int, max_val: int) -> int:
    if value < min_val:
        result = min_val
    elif value > max_val:
        result = max_val
    else:
        result = value
    assert min_val <= result <= max_val
    return result
'''

rust = '''
pub fn clamp(value: i32, min_val: i32, max_val: i32) -> i32 {
    let mut result;
    if value < min_val {
        result = min_val;
    } else {
        if value > max_val {
            result = max_val;
        } else {
            result = value;
        }
    }
    assert!((min_val <= result) && (result <= max_val));
    return result;
}
'''

[[test]]
name = "postcondition_sorted"
skip = true
description = "Sorted postcondition assertion"

python = '''
def sort_pair(a: int, b: int) -> tuple[int, int]:
    if a <= b:
        result = (a, b)
    else:
        result = (b, a)
    assert result[0] <= result[1]
    return result
'''

rust = '''
pub fn sort_pair(a: i32, b: i32) -> (i32, i32) {
    let result;
    if a <= b {
        result = (a, b);
    } else {
        result = (b, a);
    }
    assert!(result.get(0usize).cloned().unwrap() <= result.get(1usize).cloned().unwrap());
    return result;
}
'''

# =============================================================================
# Invariant Assertions
# =============================================================================

[[test]]
name = "invariant_assertion"
skip = true
description = "Loop/class invariants"

python = '''
def sum_positive(items: list[int]) -> int:
    total = 0
    for item in items:
        if item > 0:
            total += item
        assert total >= 0, "running total must be non-negative"
    return total
'''

rust = '''
pub fn sum_positive(items: &Vec<i32>) -> i32 {
    let mut total = 0;
    for item in items.iter().cloned() {
        if item > 0 {
            total += item;
        }
        assert!(total >= 0, "running total must be non-negative");
    }
    return total;
}
'''

[[test]]
name = "invariant_class"
description = "Class invariant assertion"

python = '''
class NonNegativeCounter:
    def __init__(self):
        self.count = 0
    
    def increment(self) -> None:
        self.count += 1
        assert self.count >= 0
    
    def decrement(self) -> None:
        if self.count > 0:
            self.count -= 1
        assert self.count >= 0
'''

rust = '''
#[derive(Debug, Copy, Clone)]
pub struct NonNegativeCounter {
    pub count: i32,
}
impl NonNegativeCounter {
    pub fn new() -> Self {
        Self { count: 0 }
    }
    pub fn increment(&mut self) {
        self.count += 1;
        assert!(self.count >= 0);
    }
    pub fn decrement(&mut self) {
        if self.count > 0 {
            self.count -= 1;
        }
        assert!(self.count >= 0);
    }
}
'''

[[test]]
name = "invariant_loop"
skip = true
description = "Loop invariant assertion"

python = '''
def binary_search(items: list[int], target: int) -> int:
    low = 0
    high = len(items) - 1
    while low <= high:
        assert low >= 0 and high < len(items), "bounds invariant"
        mid = (low + high) // 2
        if items[mid] == target:
            return mid
        elif items[mid] < target:
            low = mid + 1
        else:
            high = mid - 1
    return -1
'''

rust = '''
pub fn binary_search(items: &Vec<i32>, target: i32) -> i32 {
    let mut low = 0;
    let _cse_temp_0 = (items.len() as i32).saturating_sub(1);
    let mut high = _cse_temp_0;
    while low <= high {
        assert!(
            (low >= 0) && (high < items.len() as i32),
            "{}",
            "bounds invariant"
        );
        let mid = {
            let a = low + high;
            let b = 2;
            let d = a / b;
            let r = a % b;
            if r != 0 && (a ^ b) < 0 {
                d - 1
            } else {
                d
            }
        };
        if items.get(mid as usize).cloned().unwrap() == target {
            return mid;
        } else {
            if items.get(mid as usize).cloned().unwrap() < target {
                low = mid + 1;
            } else {
                high = mid - 1;
            }
        }
    }
    return -1;
}
'''

