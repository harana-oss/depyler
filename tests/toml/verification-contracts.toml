[[test]]
name = "type_contract_optional"
skip = true
description = "Optional type contract"

python = '''
from typing import Optional

def safe_divide(a: int, b: int) -> Optional[int]:
    if b == 0:
        return None
    return a // b
'''

rust = '''
pub fn safe_divide(a: i32, b: i32) -> Option<i32> {
    if b == 0 {
        return None;
    }
    return Some({
        let d = a / b;
        let r = a % b;
        if r != 0 && (a ^ b) < 0 { d - 1 } else { d }
    });
}
'''

# =============================================================================
# Panic vs Result Decision
# =============================================================================

[[test]]
name = "panic_vs_result"
skip = true
description = "Panic vs Result decision"

python = '''
def must_succeed(n: int) -> int:
    if n < 0:
        raise ValueError("n must be non-negative")
    return n * 2
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ValueError {
    message: String,
}
impl std::fmt::Display for ValueError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "value error: {}", self.message)
    }
}
impl std::error::Error for ValueError {}
impl ValueError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn must_succeed(n: i32) -> i32 {
    if n < 0 {
        panic!("{}", "n must be non-negative");
    }
    return n * 2;
}
'''

[[test]]
name = "panic_programmer_error"
skip = true
description = "Panic for programmer errors"

python = '''
def unreachable_branch(value: int) -> str:
    if value > 0:
        return "positive"
    elif value < 0:
        return "negative"
    elif value == 0:
        return "zero"
    else:
        raise AssertionError("unreachable")
'''

rust = '''
pub fn unreachable_branch(value: i32) -> String {
    if value > 0 {
        return "positive".to_string();
    } else {
        if value < 0 {
            return "negative".to_string();
        } else {
            if value == 0 {
                return "zero".to_string();
            } else {
                panic!("{}", AssertionError::new("unreachable"));
            }
        }
    }
}
'''

[[test]]
name = "result_recoverable"
skip = true
description = "Result for recoverable errors"

python = '''
from typing import Optional

def parse_int(s: str) -> Optional[int]:
    try:
        return int(s)
    except ValueError:
        return None
'''

rust = '''
pub fn parse_int(s: String) -> Option<i32> {
    match s.parse::<i32>() {
        Ok(__parsed_value) => Some(__parsed_value),
        Err(_) => None,
    }
}
'''

[[test]]
name = "result_propagation"
skip = true
description = "Result error propagation"

python = '''
from typing import Optional

def double_parse(s: str) -> Optional[int]:
    parsed = parse_safe(s)
    if parsed is None:
        return None
    return parsed * 2

def parse_safe(s: str) -> Optional[int]:
    try:
        return int(s)
    except ValueError:
        return None
'''

rust = '''
pub fn double_parse(s: String) -> Option<i32> {
    let parsed = parse_safe(s);
    if parsed.is_none() {
        return None;
    }
    return Some(parsed.unwrap() * 2);
}
pub fn parse_safe(s: String) -> Option<i32> {
    match s.parse::<i32>() {
        Ok(__parsed_value) => Some(__parsed_value),
        Err(_) => None,
    }
}
'''

