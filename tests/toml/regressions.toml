[[test]]
name = "sports_simulation_game_logic"
description = "Complex game logic with conditional branching"
tags = ["integration", "logic", "conditional"]

[test.python]
code = '''
from typing import Final

TACKLES_PER_SET: Final[int] = 6
STARTING_TACKLE: Final[int] = 1

def swap_possession(team_in_possession: str) -> str:
    return "Away" if team_in_possession == "Home" else "Home"

def process_tackle(tackles: int, team_in_possession: str) -> tuple[int, str]:
    tackles = tackles + 1
    if tackles > TACKLES_PER_SET:
        team_in_possession = swap_possession(team_in_possession)
        tackles = STARTING_TACKLE
    return (tackles, team_in_possession)

def calculate_margin(home_score: int, away_score: int, team: str) -> int:
    if team == "Home":
        return home_score - away_score
    return away_score - home_score

def is_in_scoring_position(ball_x: int, team: str, field_width: int) -> bool:
    if team == "Home":
        return ball_x > field_width - 100
    return ball_x < 100
'''

[test.assertions]
contains = ["fn swap_possession", "fn process_tackle", "fn calculate_margin", "fn is_in_scoring_position"]

[[test]]
name = "sports_simulation_event_handler"
description = "Event handler pattern with optional types"
tags = ["integration", "events", "optional"]

[test.python]
code = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Scores:
    total: int
    tries: int

@dataclass
class PeriodStatistic:
    scores: Scores

@dataclass
class TeamStatistics:
    period_statistics: list[PeriodStatistic]
    match_scores: Scores

@dataclass
class State:
    game_status: str
    is_over: bool
    home_statistics: TeamStatistics
    away_statistics: TeamStatistics
    home_match_score: int
    away_match_score: int

FIRST_HALF_INDEX: int = 0
SECOND_HALF_INDEX: int = 1

def end_of_game_output_event(state: State) -> None:
    away_second_half_stats: PeriodStatistic | None = None
    home_second_half_stats: PeriodStatistic | None = None
    team_a_won_match: bool = False
    draw_match: bool = False

    if state.game_status == "ENDED":
        home_second_half_stats = state.home_statistics.period_statistics[SECOND_HALF_INDEX]
        away_second_half_stats = state.away_statistics.period_statistics[SECOND_HALF_INDEX]
        
        team_a_won_match = state.home_match_score > state.away_match_score
        draw_match = state.home_match_score == state.away_match_score
'''

[test.assertions]
contains = ["fn end_of_game_output_event", "struct State", "struct TeamStatistics"]

