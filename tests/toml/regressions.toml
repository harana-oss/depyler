# =============================================================================
# Copy Module Tests
# =============================================================================

[[test]]
name = "copy_copy_list"
description = "copy.copy() for lists should generate .clone() not .copy()"
tags = ["copy", "stdlib"]

[test.python]
code = '''
import copy

def test_shallow_copy() -> int:
    original = [1, 2, 3]
    copied = copy.copy(original)
    copied.append(4)
    return len(original)
'''

[test.assertions]
contains_any = [[".clone()", "copy::copy"]]
not_contains = [".copy()"]

[[test]]
name = "copy_copy_dict"
description = "copy.copy() for dicts should generate valid Rust code"
tags = ["copy", "dict", "stdlib"]

[test.python]
code = '''
import copy

def test_dict_copy() -> int:
    original = {"a": 1, "b": 2}
    copied = copy.copy(original)
    copied["c"] = 3
    return len(original)
'''

[test.assertions]
contains_any = [[".clone()", "copy"]]

[[test]]
name = "copy_deepcopy_list"
description = "copy.deepcopy() should generate valid deep copy operation"
tags = ["copy", "deepcopy", "stdlib"]

[test.python]
code = '''
import copy

def test_deep_copy() -> int:
    original = [[1, 2], [3, 4]]
    copied = copy.deepcopy(original)
    copied[0].append(5)
    return len(original[0])
'''

[test.assertions]
contains_any = [["clone", "deep"]]

