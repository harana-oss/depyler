                }
            }
            "penalties" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.penalties = v.clone();
                    true
                } else {
                    false
                }
            }
            "total" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.total = v.clone();
                    true
                } else {
                    false
                }
            }
