[metadata]
name = "Bug Regression Tests"
category = "regressions"

# =============================================================================
# Final Type Annotation Tests - Python typing.Final to Rust const
# =============================================================================

[[test]]
name = "final_int_constant"
description = "Final[int] should generate const with i32 type"

python = '''
from typing import Final

def get_field_goal() -> int:
    FIELD_GOAL: Final[int] = 600
    return FIELD_GOAL
'''

rust = '''
pub fn get_field_goal() -> i32 {
    const FIELD_GOAL: i32 = 600;
    return FIELD_GOAL;
}
'''

[[test]]
name = "variable_shadowing_in_loops"
description = "Variable assignments inside loops should update existing variables, not shadow them"

python = '''
def factorial(n: int) -> int:
    result = 1
    for i in range(1, n + 1):
        result = result * i
    return result
'''

rust = '''
pub fn factorial(n: i32) -> i32 {
    let mut result = 1;
    for i in 1..n + 1 {
        result = result * i;
    }
    return result;
}
'''

[[test]]
name = "binary_search_variable_shadowing"
description = "Variable assignments in conditionals should not create new variables"

python = '''
def binary_search(arr: list, target: int) -> int:
    left = 0
    right = len(arr) - 1
    while left <= right:
        mid = (left + right) // 2
        if arr[mid] == target:
            return mid
        elif arr[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return -1
'''

rust = '''
use serde_json;
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
