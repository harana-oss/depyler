    scores: Scores
    time_on_field_in_seconds: float

@dataclass
class Player:
    is_home_team: bool
    is_injured: bool
    is_voided: bool
    jersey_number: int
    on_field: bool
    player_index: int
    position: PlayerPosition
    tries: int

@dataclass
class TeamStatistic:
    match_scores: Scores
    match_tackles: int
    match_turnovers: int
    period_statistics: List[PeriodStatistic]
    sin_bin_players: List[Player]

@dataclass
class TryScorers:
    player_indices: List[int]

@dataclass
class SimulationInvariants:
    away_handicap: float
    home_handicap: float
    total_points: float

@dataclass
class State:
    away_match_score: int
    away_players: List[Player]
    away_statistics: TeamStatistic
    ball_location: FieldPosition
    current_play_type: str
    home_match_score: int
    home_players: List[Player]
    home_statistics: TeamStatistic
    is_over: bool
    period: Period
    seconds_elapsed: int
    set: int
    simulation_invariants: SimulationInvariants
    tackles: int
    team_in_possession: str
'''

[test.assertions]
contains = ["struct Scores", "struct State", "struct Player", "struct TeamStatistic"]

