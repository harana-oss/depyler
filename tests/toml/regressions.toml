    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn binary_search(arr: &Vec<serde_json::Value>, target: i32) -> i32 {
    let mut left = 0;
    let _cse_temp_0 = arr.clone().len() as i32;
    let mut right = _cse_temp_0 - 1;
    while left <= right {
        let mid = {
            let a = left + right;
            let b = 2;
            let q = a / b;
            let r = a % b;
            let r_negative = r < 0;
            let b_negative = b < 0;
            let r_nonzero = r != 0;
            let signs_differ = r_negative != b_negative;
            let needs_adjustment = r_nonzero && signs_differ;
            if needs_adjustment { q - 1 } else { q }
        };
        if arr.clone().get(mid as usize).cloned().unwrap() == target {
            return mid;
        } else {
            if arr.get(mid as usize).cloned().unwrap() < target {
                left = mid + 1;
            } else {
                right = mid - 1;
            }
        }
    }
