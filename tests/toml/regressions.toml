# Bug Regression Tests
# Migrated from: test_bug_regressions.rs
# These tests verify that previously fixed bugs remain fixed

[metadata]
name = "Bug Regression Tests"
category = "regressions"

# =============================================================================
# Final Type Annotation Tests - Python typing.Final to Rust const
# =============================================================================

[[test]]
name = "final_int_constant"
description = "Final[int] should generate const with i32 type"
tags = ["final", "const", "typing"]

[test.python]
code = '''
from typing import Final

def get_field_goal() -> int:
    FIELD_GOAL: Final[int] = 600
    return FIELD_GOAL
'''

[test.assertions]
contains = ["const FIELD_GOAL", ": i32", "= 600"]
not_contains = ["let FIELD_GOAL"]

# =============================================================================
# Variable Shadowing Tests
# =============================================================================

[[test]]
name = "variable_shadowing_in_loops"
description = "Variable assignments inside loops should update existing variables, not shadow them"
tags = ["loops", "shadowing", "assignment"]

[test.python]
code = '''
def factorial(n: int) -> int:
    result = 1
    for i in range(1, n + 1):
        result = result * i
    return result
'''

[test.assertions]
contains = ["for i in 1.."]
not_contains = ["let mut result = result * i", "let mut result = (result * i)"]

[[test]]
name = "binary_search_variable_shadowing"
description = "Variable assignments in conditionals should not create new variables"
tags = ["conditional", "shadowing", "assignment"]

[test.python]
code = '''
def binary_search(arr: list, target: int) -> int:
    left = 0
    right = len(arr) - 1
    while left <= right:
        mid = (left + right) // 2
        if arr[mid] == target:
            return mid
        elif arr[mid] < target:
            left = mid + 1
        else:
            right = mid - 1
    return -1
'''

[test.assertions]
contains = ["fn binary_search"]

# =============================================================================
# Docstring Tests
# =============================================================================

[[test]]
name = "docstring_as_comment"
description = "Docstrings should become Rust doc comments, not executable expressions"
tags = ["docstring", "documentation"]

[test.python]
code = '''
def add(a: int, b: int) -> int:
    "Add two numbers"
    return a + b
'''

[test.assertions]
contains_any = [["/// Add two numbers", "#[doc"]]
not_contains = ["\"Add two numbers\" . to_string ()"]

[[test]]
name = "docstring_generation"
description = "Docstrings should generate proper Rust documentation"
tags = ["docstring", "documentation"]

[test.python]
code = '''
def example_function(x: int) -> int:
    """This is a docstring that should become a comment"""
    return x * 2
'''

[test.assertions]
contains_any = [["/// This is a docstring", "#[doc = \"This is a docstring"]]
not_contains = ["\"This is a docstring that should become a comment\" . to_string ()"]

