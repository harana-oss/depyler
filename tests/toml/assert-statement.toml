# Assert Statement Tests - Runtime assertions
# Rust Mapping: assert!, debug_assert!

[metadata]
name = "Assert Statement Tests"
category = "core-language"

# =============================================================================
# Basic Assert
# =============================================================================

[[test]]
name = "assert_basic"
description = "assert condition"

python = '''
x = 5
assert x > 0
result = True
'''

rust = '''
let x = 5;
assert!(x > 0);
let result = true;
'''

[[test]]
name = "assert_with_message"
description = "assert condition, 'error message'"

python = '''
x = 5
assert x > 0, "x must be positive"
result = True
'''

rust = '''
let x = 5;
assert!(x > 0, "x must be positive");
let result = true;
'''

[[test]]
name = "assert_true"
description = "assert True (always passes)"

python = '''
assert True
result = True
'''

rust = '''
assert!(true);
let result = true;
'''

# =============================================================================
# Assert with Expressions
# =============================================================================

[[test]]
name = "assert_comparison"
description = "assert x > 0"

python = '''
x = 10
assert x > 0
result = x > 0
'''

rust = '''
let x = 10;
assert!(x > 0);
let result = x > 0;
'''

[[test]]
name = "assert_equality"
description = "assert result == expected"

python = '''
result = 42
expected = 42
assert result == expected
value = result == expected
'''

rust = '''
let result = 42;
let expected = 42;
assert!(result == expected);
let value = result == expected;
'''

[[test]]
name = "assert_isinstance"
description = "assert isinstance(x, int)"

python = '''
x = 42
assert isinstance(x, int)
result = True
'''

rust = '''
let x: i32 = 42;
// Rust uses static typing, no runtime check needed
let result = true;
'''

[[test]]
name = "assert_in"
description = "assert item in collection"

python = '''
item = 2
collection = [1, 2, 3]
assert item in collection
result = True
'''

rust = '''
let item = 2;
let collection = vec![1, 2, 3];
assert!(collection.contains(&item));
let result = true;
'''

# =============================================================================
# Assert with Complex Conditions
# =============================================================================

[[test]]
name = "assert_and"
description = "assert cond1 and cond2"

python = '''
x = 5
y = 10
assert x > 0 and y > 0
result = True
'''

rust = '''
let x = 5;
let y = 10;
assert!(x > 0 && y > 0);
let result = true;
'''

[[test]]
name = "assert_or"
description = "assert cond1 or cond2"

python = '''
x = 5
y = -1
assert x > 0 or y > 0
result = True
'''

rust = '''
let x = 5;
let y = -1;
assert!(x > 0 || y > 0);
let result = true;
'''

[[test]]
name = "assert_not"
description = "assert not invalid"

python = '''
invalid = False
assert not invalid
result = True
'''

rust = '''
let invalid = false;
assert!(!invalid);
let result = true;
'''

[[test]]
name = "assert_function_call"
description = "assert is_valid(x)"

python = '''
def is_valid(x):
    return x > 0

x = 5
assert is_valid(x)
result = True
'''

rust = '''
fn is_valid(x: i32) -> bool {
    x > 0
}

let x = 5;
assert!(is_valid(x));
let result = true;
'''

# =============================================================================
# Assert Message Formatting
# =============================================================================

[[test]]
name = "assert_fstring_message"
description = "assert x > 0, f'x must be positive, got {x}'"

python = '''
x = 5
assert x > 0, f"x must be positive, got {x}"
result = True
'''

rust = '''
let x = 5;
assert!(x > 0, "x must be positive, got {}", x);
let result = true;
'''

[[test]]
name = "assert_expression_message"
description = "assert valid, str(error_details)"

python = '''
valid = True
error_details = {"code": 500}
assert valid, str(error_details)
result = True
'''

rust = '''
let valid = true;
let error_details = format!("{{code: 500}}");
assert!(valid, "{}", error_details);
let result = true;
'''

# =============================================================================
# Assert in Functions
# =============================================================================

[[test]]
name = "assert_precondition"
description = "Assert at start of function for input validation"

python = '''
def divide(a, b):
    assert b != 0, "Divisor cannot be zero"
    return a / b

result = divide(10, 2) == 5.0
'''

rust = '''
fn divide(a: i32, b: i32) -> i32 {
    assert!(b != 0, "Divisor cannot be zero");
    a / b
}

let result = divide(10, 2) == 5;
'''

[[test]]
name = "assert_postcondition"
description = "Assert before return for output validation"

python = '''
def get_positive(x):
    result = abs(x)
    assert result >= 0, "Result must be positive"
    return result

value = get_positive(-5)
result = value == 5
'''

rust = '''
fn get_positive(x: i32) -> i32 {
    let result = x.abs();
    assert!(result >= 0, "Result must be positive");
    result
}

let value = get_positive(-5);
let result = value == 5;
'''

[[test]]
name = "assert_invariant"
description = "Assert inside loop for invariant checking"

python = '''
total = 0
for i in range(1, 6):
    total += i
    assert total == i * (i + 1) // 2, "Sum invariant violated"

result = total == 15
'''

rust = '''
let mut total = 0;
for i in 1..=5 {
    total += i;
    assert!(total == i * (i + 1) / 2, "Sum invariant violated");
}

let result = total == 15;
'''

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "assert_tuple_gotcha"
description = "assert (False, 'msg') is always True!"
skip = true

python = '''
# This assert will PASS because non-empty tuple is truthy!
# assert (False, "This should fail")  # Actually passes!
# Correct usage: assert False, "This should fail"
result = True
'''

rust = '''
// Rust doesn't have this gotcha
// assert!(false, "This fails");
let result = true;
'''

[[test]]
name = "assert_none"
description = "assert x is not None"

python = '''
x = 42
assert x is not None
result = True
'''

rust = '''
let x: Option<i32> = Some(42);
assert!(x.is_some());
let result = true;
'''

[[test]]
name = "assert_optimization"
description = "Assert behavior with __debug__"

python = '''
# Asserts can be disabled with -O flag
# In Python, __debug__ is True by default
assert __debug__ or True
result = True
'''

rust = '''
// Rust has debug_assert! for debug-only checks
debug_assert!(true);
// Regular assert! is always checked
assert!(true);
let result = true;
'''
