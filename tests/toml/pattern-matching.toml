'''

rust = '''
#[doc = "// NOTE: Map Python module 'fnmatch'()"]
pub fn translate_pattern(pattern: String) -> String {
    return {
        let pattern_str = pattern;
        let regex_pattern = pattern_str
            .replace(".", "\\.")
            .replace("*", ".*")
            .replace("?", ".")
            .replace("[!", "[^");
        format!("(?ms)^{}$", regex_pattern)
    };
}
'''