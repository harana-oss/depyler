[[test]]
name = "fnmatch_filter"
description = "fnmatch.filter() filter list by pattern"
tags = ["fnmatch", "filter"]

python = '''
import fnmatch

def filter_files(names: list, pattern: str) -> list:
    return fnmatch.filter(names, pattern)
'''

rust = '''
use serde_json;
#[doc = "// NOTE: Map Python module 'fnmatch'()"]
pub fn filter_files(names: &Vec<serde_json::Value>, pattern: String) -> Vec<serde_json::Value> {
    return {
        let pattern_str = pattern;
        let regex_pattern = pattern_str
            .replace(".", "\\.")
            .replace("*", ".*")
            .replace("?", ".")
            .replace("[!", "[^");
        let regex =
            regex::Regex::new(&format!("^{}$", regex_pattern)).unwrap_or_else(|_| regex::Regex::new("^$").unwrap());
        (names)
            .into_iter()
            .filter(|name| regex.is_match(&name.to_string()))
            .collect::<Vec<_>>()
    };
}
'''

[[test]]
name = "fnmatch_translate"
description = "fnmatch.translate() pattern to regex"
tags = ["fnmatch", "translate"]

python = '''
import fnmatch

def translate_pattern(pattern: str) -> str:
