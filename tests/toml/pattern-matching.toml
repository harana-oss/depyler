[[test]]
name = "fnmatch_basic"
description = "fnmatch.fnmatch() pattern matching"
tags = ["fnmatch", "pattern"]

python = '''
import fnmatch

def match_pattern(filename: str, pattern: str) -> bool:
    return fnmatch.fnmatch(filename, pattern)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'fnmatch'()"]
pub fn match_pattern(filename: String, pattern: String) -> bool {
    return {
        let pattern_str = pattern;
        let regex_pattern = pattern_str
            .replace(".", "\\.")
            .replace("*", ".*")
            .replace("?", ".")
            .replace("[!", "[^");
        let regex =
            regex::Regex::new(&format!("^{}$", regex_pattern)).unwrap_or_else(|_| regex::Regex::new("^$").unwrap());
        regex.is_match(filename)
    };
}
'''

