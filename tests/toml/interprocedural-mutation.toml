# =============================================================================
# Multiple Callers of Same Mutating Function
# =============================================================================

[[test]]
name = "multiple_callers_inherit_mut"
description = "Multiple functions calling same mutating helper all need &mut"

python = '''
from dataclasses import dataclass

@dataclass
class Settings:
    volume: int
    brightness: int

def get_volume(settings: Settings) -> int:
    return settings.volume

def set_volume(settings: Settings, v: int) -> None:
    settings.volume = v

def increase_volume(settings: Settings) -> None:
    current = get_volume(settings)
    set_volume(settings, current + 10)

def decrease_volume(settings: Settings) -> None:
    current = get_volume(settings)
    set_volume(settings, current - 10)

def mute(settings: Settings) -> None:
    set_volume(settings, 0)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Settings {
    pub volume: i32,
    pub brightness: i32,
}
impl Settings {
    pub fn new(volume: i32, brightness: i32) -> Self {
        Self { volume, brightness }
    }
}
pub fn get_volume(settings: &Settings) -> i32 {
    return settings.volume;
}
pub fn set_volume(settings: &mut Settings, v: i32) {
    settings.volume = v;
}
pub fn increase_volume(settings: &mut Settings) {
    let current = get_volume(settings);
    set_volume(settings, current + 10);
}
pub fn decrease_volume(settings: &mut Settings) {
    let current = get_volume(settings);
    set_volume(settings, current - 10);
}
pub fn mute(settings: &mut Settings) {
    set_volume(settings, 0);
}
'''

# =============================================================================
# Ternary/Conditional Expression
# =============================================================================

[[test]]
name = "ternary_expr_with_mutating_calls"
description = "Ternary expression branches call mutating functions"

python = '''
from dataclasses import dataclass

@dataclass
class Pair:
    left: int
    right: int

def get_left(pair: Pair) -> int:
    return pair.left

def get_right(pair: Pair) -> int:
    return pair.right

def get_larger(pair: Pair) -> int:
    return get_left(pair) if get_left(pair) > get_right(pair) else get_right(pair)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Pair {
    pub left: i32,
    pub right: i32,
}
impl Pair {
    pub fn new(left: i32, right: i32) -> Self {
        Self { left, right }
    }
}
pub fn get_left(pair: &Pair) -> i32 {
    return pair.left;
}
pub fn get_right(pair: &Pair) -> i32 {
    return pair.right;
}
pub fn get_larger(pair: &Pair) -> i32 {
    return if get_left(pair) > get_right(pair) {
        get_left(pair)
    } else {
        get_right(pair)
    };
}
'''
