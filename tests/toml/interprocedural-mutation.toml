pub struct State {
    pub active: bool,
    pub data: Vec<i32>,
}
impl State {
    pub fn new(active: bool, data: Vec<i32>) -> Self {
        Self { active, data }
    }
}
pub fn is_active(state: &State) -> bool {
    return state.active;
}
pub fn get_data<'a>(state: &'a mut State) -> &'a mut Vec<i32> {
    return &mut state.data;
}
pub fn conditional_update(state: &mut State) {
    if is_active(state) {
        get_data(state).push(42);
    }
}
