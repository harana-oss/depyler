# =============================================================================
# While Loop Condition with Mutating Call
# =============================================================================

[[test]]
name = "while_condition_with_mutating_call"
description = "While loop condition contains call to mutating function"

python = '''
from dataclasses import dataclass

@dataclass
class Counter:
    count: int
    max_count: int

def get_count(counter: Counter) -> int:
    return counter.count

def get_max(counter: Counter) -> int:
    return counter.max_count

def increment_until_max(counter: Counter) -> None:
    while get_count(counter) < get_max(counter):
        counter.count = counter.count + 1
'''

rust = '''
