[[test]]
name = "if_condition_with_mutating_call"
description = "If condition contains call that requires mutation propagation"

python = '''
from dataclasses import dataclass

@dataclass
class State:
    active: bool
    data: list[int]

def is_active(state: State) -> bool:
    return state.active

def get_data(state: State) -> list[int]:
    return state.data

def conditional_update(state: State) -> None:
    if is_active(state):
        get_data(state).append(42)
'''

rust = '''
