# Tests for detecting &mut requirements across function boundaries

[metadata]
name = "Interprocedural Mutation Tests"
category = "ownership-mutability"
description = "Tests for mutation propagation through function calls in various contexts"

# =============================================================================
# For-loop Iterator with Mutating Function Call
# =============================================================================

[[test]]
name = "for_loop_iter_calls_mutating_function"
description = "For loop iterates over result of function that needs &mut"

python = '''
from dataclasses import dataclass

@dataclass
class Stats:
    value: int

@dataclass
class Container:
    stats: Stats

def get_stats(container: Container) -> Stats:
    return container.stats

def update_via_loop(container: Container) -> None:
    for s in [get_stats(container)]:
        s.value = s.value + 1
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Stats {
    pub value: i32,
}
impl Stats {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Container {
    pub stats: Stats,
}
impl Container {
    pub fn new(stats: Stats) -> Self {
        Self { stats }
    }
}
pub fn get_stats<'a>(container: &'a mut Container) -> &'a mut Stats {
    return &mut container.stats;
}
pub fn update_via_loop(container: &mut Container) {
    for mut s in vec![get_stats(container).clone()] {
        s.value = s.value + 1;
    }
}
'''

[[test]]
name = "for_loop_iter_with_slice_and_mutating_call"
description = "For loop with slice on result of function needing &mut"

python = '''
from dataclasses import dataclass

@dataclass
class Item:
    score: float

@dataclass
class Data:
    items: list[Item]

def get_items(data: Data) -> list[Item]:
    return data.items

def process_first_three(data: Data) -> None:
    for item in get_items(data)[:3]:
        item.score = item.score + 1.0
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Item {
    pub score: f64,
}
impl Item {
    pub fn new(score: f64) -> Self {
        Self { score }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Data {
    pub items: Vec<Item>,
}
impl Data {
    pub fn new(items: Vec<Item>) -> Self {
        Self { items }
    }
}
pub fn get_items<'a>(data: &'a mut Data) -> &'a mut Vec<Item> {
    return &mut data.items;
}
pub fn process_first_three(data: &mut Data) {
    for mut item in {
        let base = &get_items(data);
        let stop = (3).max(0) as usize;
        base[..stop.min(base.len())].to_vec()
    } {
        item.score = item.score + 1.0;
    }
}
'''

[[test]]
name = "for_loop_iter_attribute_on_mutating_call"
description = "For loop iterates over attribute of mutating function result"

python = '''
from dataclasses import dataclass

@dataclass 
class PlayerStats:
    time_on_field: float

@dataclass
class TeamStats:
    player_statistics: list[PlayerStats]

@dataclass
class State:
    home_stats: TeamStats
    away_stats: TeamStats

def get_team_stats(state: State, is_home: bool) -> TeamStats:
    if is_home:
        return state.home_stats
    else:
        return state.away_stats

def apply_time(state: State, is_home: bool, seconds: float) -> None:
    for s in get_team_stats(state, is_home).player_statistics[:13]:
        s.time_on_field = s.time_on_field + seconds
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct PlayerStats {
    pub time_on_field: f64,
}
impl PlayerStats {
    pub fn new(time_on_field: f64) -> Self {
        Self { time_on_field }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct TeamStats {
    pub player_statistics: Vec<PlayerStats>,
}
impl TeamStats {
    pub fn new(player_statistics: Vec<PlayerStats>) -> Self {
        Self { player_statistics }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub home_stats: TeamStats,
    pub away_stats: TeamStats,
}
impl State {
    pub fn new(home_stats: TeamStats, away_stats: TeamStats) -> Self {
        Self { home_stats, away_stats }
    }
}
pub fn get_team_stats<'a>(state: &'a mut State, is_home: bool) -> &'a mut TeamStats {
    if is_home {
        return &mut state.home_stats;
    } else {
        return &mut state.away_stats;
    }
}
pub fn apply_time(state: &mut State, is_home: bool, seconds: f64) {
    for mut s in {
        let base = &get_team_stats(state, is_home).player_statistics;
        let stop = (13).max(0) as usize;
        base[..stop.min(base.len())].to_vec()
    } {
        s.time_on_field = s.time_on_field + seconds;
    }
}
'''

# =============================================================================
# Return Value Mutation Detection
# =============================================================================

[[test]]
name = "return_value_mutated_needs_mut_param"
description = "Function returning field reference where return is mutated needs &mut param"

python = '''
from dataclasses import dataclass

@dataclass
class Inner:
    value: int

@dataclass
class Outer:
    inner: Inner

def get_inner(outer: Outer) -> Inner:
    return outer.inner

def modify_inner(outer: Outer) -> None:
    inner = get_inner(outer)
    inner.value = 42
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Inner {
    pub value: i32,
}
impl Inner {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Outer {
    pub inner: Inner,
}
impl Outer {
    pub fn new(inner: Inner) -> Self {
        Self { inner }
    }
}
pub fn get_inner<'a>(outer: &'a mut Outer) -> &'a mut Inner {
    return &mut outer.inner;
}
pub fn modify_inner(outer: &mut Outer) {
    let inner = get_inner(outer);
    inner.value = 42;
}
'''

