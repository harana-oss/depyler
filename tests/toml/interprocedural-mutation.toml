    pub count: i32,
    pub max_count: i32,
}
impl Counter {
    pub fn new(count: i32, max_count: i32) -> Self {
        Self { count, max_count }
    }
}
pub fn get_count(counter: &Counter) -> i32 {
    return counter.count;
}
pub fn get_max(counter: &Counter) -> i32 {
    return counter.max_count;
}
pub fn increment_until_max(counter: &mut Counter) {
    while get_count(counter) < get_max(counter) {
        counter.count = counter.count + 1;
    }
}
