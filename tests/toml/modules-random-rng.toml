[[test]]
name = "depyler_rng_choice"
description = "random.choice() uses DEPYLER_RNG with IndexedRandom"

python = '''
import random

def pick_one(items: list[str]) -> str:
    return random.choice(items)
'''

rust = '''
use rand as random;
use rand::rngs::SmallRng;
use rand::Rng;
use rand::SeedableRng;
thread_local! {
    static DEPYLER_RNG: std::cell::RefCell<SmallRng>= std::cell::RefCell::new(SmallRng::from_os_rng());

}
use rand::seq::IndexedRandom;
pub fn pick_one(items: &Vec<String>) -> String {
    return DEPYLER_RNG.with(|rng| items.choose(&mut *rng.borrow_mut()).cloned().unwrap());
}
'''

