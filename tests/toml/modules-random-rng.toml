[metadata]
name = "Random Module DEPYLER_RNG Tests"
category = "stdlib-random"

# =============================================================================
# Tests verifying DEPYLER_RNG thread_local generation for random module
# =============================================================================

[[test]]
name = "depyler_rng_random_float"
description = "random.random() generates DEPYLER_RNG thread_local"

python = '''
import random

def get_random_float() -> float:
    return random.random()
'''

rust = '''
use rand as random;
use rand::rngs::SmallRng;
use rand::Rng;
use rand::SeedableRng;
thread_local! {
    static DEPYLER_RNG: std::cell::RefCell<SmallRng>= std::cell::RefCell::new(SmallRng::from_os_rng());

}
pub fn get_random_float() -> f64 {
    return DEPYLER_RNG.with(|rng| rng.borrow_mut().gen::<f64>());
}
'''

