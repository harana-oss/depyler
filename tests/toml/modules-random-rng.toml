[[test]]
name = "depyler_rng_seed_and_randrange"
description = "random.seed() + random.randrange() both use DEPYLER_RNG"

python = '''
import random

def set_seed_and_get(seed: int) -> int:
    random.seed(seed)
    return random.randrange(100)
'''

rust = '''
use rand as random;
use rand::rngs::SmallRng;
use rand::Rng;
use rand::SeedableRng;
thread_local! {
    static DEPYLER_RNG: std::cell::RefCell<SmallRng>= std::cell::RefCell::new(SmallRng::from_os_rng());

}
pub fn set_seed_and_get(seed: i32) -> i32 {
    DEPYLER_RNG.with(|rng| *rng.borrow_mut() = SmallRng::seed_from_u64(seed as u64));
    return DEPYLER_RNG.with(|rng| rng.borrow_mut().gen_range(0..100));
}
'''

[[test]]
name = "depyler_rng_gauss"
description = "random.gauss() uses DEPYLER_RNG for normal distribution"

python = '''
import random

def normal_random(mu: float, sigma: float) -> float:
    return random.gauss(mu, sigma)
'''

rust = '''
use rand as random;
use rand::rngs::SmallRng;
use rand::Rng;
use rand::SeedableRng;
thread_local! {
    static DEPYLER_RNG: std::cell::RefCell<SmallRng>= std::cell::RefCell::new(SmallRng::from_os_rng());

}
pub fn normal_random(mu: f64, sigma: f64) -> f64 {
    return {
        use rand::distributions::Distribution;
        let normal = rand_distr::Normal::new(mu as f64, sigma as f64).unwrap();
        DEPYLER_RNG.with(|rng| normal.sample(&mut *rng.borrow_mut()))
    };
}
'''

[[test]]
name = "depyler_rng_choice_local_vec"
description = "random.choice() on locally-created Vec from list comprehension"

python = '''
import random

def pick_from_filtered(items: list[int], threshold: int) -> int:
    available = [x for x in items if x > threshold]
    return random.choice(available)
'''

rust = '''
use rand as random;
use rand::rngs::SmallRng;
use rand::Rng;
use rand::SeedableRng;
thread_local! {
    static DEPYLER_RNG: std::cell::RefCell<SmallRng>= std::cell::RefCell::new(SmallRng::from_os_rng());

}
use rand::seq::IndexedRandom;
pub fn pick_from_filtered(items: &Vec<i32>, threshold: i32) -> i32 {
    let available = items
        .iter()
        .cloned()
        .filter(|x| *x > threshold)
        .collect::<Vec<_>>();
    return DEPYLER_RNG.with(|rng| available.choose(&mut *rng.borrow_mut()).cloned().unwrap());
}
'''
