[metadata]
name = "F-Strings Nested Tests"
category = "strings"

# =============================================================================
# Basic Nested F-Strings (3.12+)
# =============================================================================

[[test]]
name = "fstring_nested_basic"
description = "f'{f\"{inner}\"}'"

python = '''
x = 42
result = f'Value: {x}'
'''

rust = '''
let x = 42;
let result = format!("Value: {}", x);
'''


[[test]]
name = "fstring_nested_expr"
description = "f'{f\"{x + y}\"}'"

python = '''
x = 42
result = f'Value: {x}'
'''

rust = '''
