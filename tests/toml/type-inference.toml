# Type Inference Tests - Migrated from test_type_inference.rs, test_type_system.rs, 
# test_type_mapper_coverage.rs, test_type_annotation.rs

[metadata]
name = "Type Inference Tests"
category = "type-inference"

# =============================================================================
# Basic Type Inference
# =============================================================================

[[test]]
name = "infer_int_from_literal"
description = "Infer int type from literal assignment"
tags = ["inference", "int"]

[test.python]
code = '''
def get_number():
    x = 42
    return x
'''

[test.assertions]
contains_any = [["i32", "i64"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_float_from_literal"
description = "Infer float type from literal"
tags = ["inference", "float"]

[test.python]
code = '''
def get_pi():
    x = 3.14
    return x
'''

[test.assertions]
contains = ["f64"]

[[test]]
name = "infer_string_from_literal"
description = "Infer string type from literal"
tags = ["inference", "string"]

[test.python]
code = '''
def get_greeting():
    s = "hello"
    return s
'''

[test.assertions]
contains_any = [["String", "&str"]]

[[test]]
name = "infer_bool_from_literal"
description = "Infer bool type from literal"
tags = ["inference", "bool"]

[test.python]
code = '''
def get_flag():
    b = True
    return b
'''

[test.assertions]
contains = ["bool"]

