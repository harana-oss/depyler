# =============================================================================
# isinstance Optimization
# =============================================================================

[[test]]
name = "isinstance_int_removed"
description = "isinstance(x, int) removed when x is typed as int"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_int(x: int) -> bool:
    return isinstance(x, int)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

[[test]]
name = "isinstance_str_removed"
description = "isinstance(s, str) removed when s is typed as str"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_str(s: str) -> bool:
    return isinstance(s, str)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

[[test]]
name = "isinstance_float_removed"
description = "isinstance(x, float) removed when x is typed as float"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_float(x: float) -> bool:
    return isinstance(x, float)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

[[test]]
name = "isinstance_list_removed"
description = "isinstance(items, list) removed when items is typed as list"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_list(items: list[int]) -> bool:
    return isinstance(items, list)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

# =============================================================================
# Inference from Usage Context (from test_type_inference.rs)
# =============================================================================

[[test]]
name = "infer_filepath_from_open"
description = "Infer string type from open() usage"
tags = ["inference", "usage"]

[test.python]
code = '''
def read_file(filepath):
    with open(filepath) as f:
        return f.read()
'''

[test.assertions]
contains_any = [["filepath: &str", "filepath: String"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_string_from_fstring"
description = "Infer string type from f-string usage"
tags = ["inference", "fstring"]

[test.python]
code = '''
def greet(name):
    return f"Hello, {name}"
'''

[test.assertions]
contains_any = [["name: &str", "name: String"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_list_from_iteration"
description = "Infer list type from iteration"
tags = ["inference", "iteration"]

[test.python]
code = '''
def sum_list(items):
    total = 0
    for item in items:
        total += item
    return total
'''

[test.assertions]
contains_any = [["items: &[", "items: Vec<", "items: &Vec<"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_bool_from_conditional"
description = "Infer bool type from conditional usage"
tags = ["inference", "conditional"]

[test.python]
code = '''
def conditional(flag):
    if flag:
        return "yes"
    return "no"
'''

[test.assertions]
contains = ["flag: bool"]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_mixed_types"
description = "Infer multiple parameter types"
tags = ["inference", "mixed"]

[test.python]
code = '''
def process(data, flag):
    if flag:
        return data.upper()
    return data
'''

[test.assertions]
contains_any = [["data: &str", "data: String"]]
contains = ["flag: bool"]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_csv_path"
description = "Infer string from CSV reader context"
tags = ["inference", "csv"]

[test.python]
code = '''
import csv

def process_csv(path):
    with open(path) as f:
        reader = csv.DictReader(f)
        for row in reader:
            print(row['name'])
'''

[test.assertions]
contains_any = [["path: &str", "path: String"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "return_type_propagation"
description = "Respect explicit return type annotations"
tags = ["inference", "return"]

[test.python]
code = '''
def get_length(text: str) -> int:
    return len(text)
'''

[test.assertions]
contains_any = [["text: &str", "text: String"]]
contains_any = [["-> i32", "-> i64", "-> usize"]]

[[test]]
name = "infer_search_function"
description = "Infer list and target types in search"
tags = ["inference", "complex"]

[test.python]
code = '''
def search(items, target):
    for item in items:
        if item == target:
            return True
    return False
'''

[test.assertions]
contains_any = [["items: &[", "items: Vec<"]]
not_contains = ["items: serde_json::Value"]

# =============================================================================
# int(str) Parsing (from test_int_str_parsing.rs)
# =============================================================================

[[test]]
name = "int_str_simple"
description = "int(str) uses .parse::<i32>()"
tags = ["parse", "int", "str"]

[test.python]
code = '''
def parse_number(s: str) -> int:
    return int(s)
'''

[test.assertions]
contains = [".parse::<i32>()"]
not_contains = [") as i32"]

[[test]]
name = "int_str_multiple_calls"
description = "Multiple int(str) conversions"
tags = ["parse", "int", "str"]

[test.python]
code = '''
def parse_and_add(s1: str, s2: str) -> int:
    a = int(s1)
    b = int(s2)
    return a + b
'''

[test.assertions]
contains = [".parse::<i32>()"]

[[test]]
name = "int_number_not_string"
description = "int(int) should not use .parse()"
tags = ["parse", "int"]

[test.python]
code = '''
def double_int(x: int) -> int:
    return int(x) * 2
'''

[test.assertions]
not_contains = [".parse"]

[[test]]
name = "int_float_cast"
description = "int(float) uses 'as i32' cast"
tags = ["parse", "int", "float"]

[test.python]
code = '''
def truncate_float(x: float) -> int:
    return int(x)
'''

[test.assertions]
contains_any = [["as i32", "as i64"]]
not_contains = [".parse"]

[[test]]
name = "int_bool_cast"
description = "int(bool) uses 'as i32' cast"
tags = ["parse", "int", "bool"]

[test.python]
code = '''
def bool_to_int(b: bool) -> int:
    return int(b)
'''

[test.assertions]
contains_any = [["as i32", "as i64"]]
not_contains = [".parse"]

[[test]]
name = "int_str_in_expression"
description = "int(str) nested in expression"
tags = ["parse", "int", "str"]

[test.python]
code = '''
def calculate(s: str) -> int:
    return int(s) * 2 + 10
'''

[test.assertions]
contains = [".parse::<i32>()"]

[[test]]
name = "int_str_as_function_arg"
description = "int(str) as function argument"
tags = ["parse", "int", "str"]

[test.python]
code = '''
def helper(x: int) -> int:
    return x * 2

def parse_and_call(s: str) -> int:
    return helper(int(s))
'''

[test.assertions]
contains = [".parse::<i32>()"]

# =============================================================================
# DynamicType Bug Tests - untyped collections should not use DynamicType
# =============================================================================

[[test]]
name = "untyped_list_parameter_no_dynamic"
description = "Untyped list parameter should not generate DynamicType"
tags = ["dynamic", "list", "regression"]

[test.python]
code = '''
def sum_list(numbers: list) -> int:
    total = 0
    for num in numbers:
        total = total + num
    return total
'''

[test.assertions]
not_contains = ["DynamicType"]

[[test]]
name = "untyped_dict_parameter_no_dynamic"
description = "Untyped dict parameter should not generate DynamicType"
tags = ["dynamic", "dict", "regression"]

[test.python]
code = '''
def get_value(data: dict, key: str) -> int:
    if key in data:
        return data[key]
    return 0
'''

[test.assertions]
not_contains = ["DynamicType"]

[[test]]
name = "untyped_set_parameter_no_dynamic"
description = "Untyped set parameter should not generate DynamicType"
tags = ["dynamic", "set", "regression"]

[test.python]
code = '''
def count_unique(items: set) -> int:
    return len(items)
'''

[test.assertions]
not_contains = ["DynamicType"]

# =============================================================================
# Type Annotation Preservation - Migrated from test_type_annotation.rs
# =============================================================================

[[test]]
name = "type_annotation_usize_to_i32"
description = "Type annotation forces conversion from usize (len) to i32"
tags = ["annotation", "conversion"]

[test.python]
code = '''
def test() -> int:
    arr = [1, 2, 3]
    right: int = len(arr) - 1
    return right
'''

[test.assertions]
contains = ["right: i32"]
contains_any = [["as i32", ".try_into()"]]

[[test]]
name = "type_annotation_simple_int"
description = "Simple int type annotation is preserved"
tags = ["annotation", "int"]

[test.python]
code = '''
def test(val: int) -> int:
    x: int = val + 1
    return x
'''

[test.assertions]
contains = ["x: i32"]

[[test]]
name = "type_annotation_str"
description = "String type annotation produces String or &str"
tags = ["annotation", "string"]

[test.python]
code = '''
def test() -> str:
    name: str = "hello"
    return name
'''

[test.assertions]
contains_any = [["String", "&str"]]

[[test]]
name = "no_annotation_infers_type"
description = "Type inference works without explicit annotation"
tags = ["inference", "no-annotation"]

[test.python]
code = '''
def test(n: int) -> int:
    x = n + 1
    return x
'''

[test.assertions]
contains = ["pub fn test"]

