[[test]]
name = "generic_call_with_keyword_args_and_array"
description = "Generic call with keyword args and array literal"
tags = ["generics", "kwargs", "array"]

[test.python]
code = '''
def test_func():
    result = call[Type](name = "name", input = [random.random(), float(int(2400 - 1200))])
    return result
'''

[test.assertions]
contains = ["call::<Type>", "\"name\"", "2400", "1200"]
contains_any = [["vec!", "rand::random"]]

