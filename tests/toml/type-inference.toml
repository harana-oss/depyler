[[test]]
name = "float_return_infers_f64"
description = "Float return infers f64"
tags = ["inference", "return", "float"]

[test.python]
code = '''
def get_pi():
    return 3.14159
'''

[test.assertions]
contains = ["pub fn get_pi() -> f64"]

[[test]]
name = "list_return_infers_vec"
description = "List return infers Vec, not i32"
tags = ["inference", "return", "list"]

[test.python]
code = '''
def get_items():
    return [1, 2, 3]
'''

[test.assertions]
not_contains = ["pub fn get_items() -> i32"]
contains_any = [["Vec", "Value"]]
