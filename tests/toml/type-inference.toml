[[test]]
name = "string_return_infers_string"
description = "String return infers String or &str"
tags = ["inference", "return", "string"]

[test.python]
code = '''
def get_name():
    return "Alice"
'''

[test.assertions]
contains_any = [["-> String", "-> &str"]]

[[test]]
name = "bool_return_infers_bool"
