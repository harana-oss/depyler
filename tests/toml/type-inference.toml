# =============================================================================
# isinstance Optimization
# =============================================================================

[[test]]
name = "isinstance_int_removed"
description = "isinstance(x, int) removed when x is typed as int"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_int(x: int) -> bool:
    return isinstance(x, int)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

[[test]]
name = "isinstance_str_removed"
description = "isinstance(s, str) removed when s is typed as str"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_str(s: str) -> bool:
    return isinstance(s, str)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

[[test]]
name = "isinstance_float_removed"
description = "isinstance(x, float) removed when x is typed as float"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_float(x: float) -> bool:
    return isinstance(x, float)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

[[test]]
name = "isinstance_list_removed"
description = "isinstance(items, list) removed when items is typed as list"
tags = ["isinstance", "optimization"]

[test.python]
code = '''
def check_list(items: list[int]) -> bool:
    return isinstance(items, list)
'''

[test.assertions]
contains = ["true"]
not_contains = ["isinstance"]

# =============================================================================
# Inference from Usage Context (from test_type_inference.rs)
# =============================================================================

[[test]]
name = "infer_filepath_from_open"
description = "Infer string type from open() usage"
