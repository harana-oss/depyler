# =============================================================================
# Generic Type Inference (migrated from test_generic_inference.rs)
# =============================================================================

[[test]]
name = "simple_generic_function"
description = "Simple generic function with type parameter T"
tags = ["generics", "typevar"]

[test.python]
code = '''
def identity(x: T) -> T:
    return x
'''

[test.assertions]
contains = ["pub fn identity<T: Clone>(x: T)", "-> T"]

[[test]]
name = "generic_list_function"
description = "Generic function with List[T] parameter"
tags = ["generics", "list"]

[test.python]
code = '''
from typing import List

def first_element(items: List[T]) -> T:
    return items[0]
'''

[test.assertions]
contains = ["Vec<T>"]
contains_any = [["T: Clone", "T:Clone"]]

[[test]]
name = "multiple_type_parameters"
description = "Function with multiple type parameters T and U"
tags = ["generics", "typevar"]

[test.python]
code = '''
from typing import Tuple

def pair(a: T, b: U) -> Tuple[T, U]:
    return (a, b)
'''

[test.assertions]
contains_any = [["T: Clone", "T:Clone"], ["U: Clone", "U:Clone"], ["Tuple<T, U>", "(T, U)"]]

[[test]]
name = "generic_with_constraints"
description = "Generic function should infer PartialOrd constraint from < operator"
tags = ["generics", "constraints"]

[test.python]
code = '''
def compare(a: T, b: T) -> bool:
    return a < b
'''

[test.assertions]
contains_any = [["T: Clone + PartialOrd", "T: PartialOrd + Clone"]]

[[test]]
name = "generic_dict"
description = "Generic function with Dict[K, V] parameter"
tags = ["generics", "dict"]

[test.python]
code = '''
from typing import Dict

def get_value(mapping: Dict[K, V], key: K) -> V:
    return mapping[key]
'''

[test.assertions]
contains = ["HashMap<K, V>"]
contains_any = [["K: Clone", "K:"], ["V: Clone", "V:"]]

[[test]]
name = "type_var_in_optional"
description = "Type variable in Optional type"
tags = ["generics", "optional"]

[test.python]
code = '''
from typing import Optional

def maybe_value(x: Optional[T]) -> T:
    return x
'''

[test.assertions]
contains = ["x: Option<T>"]
contains_any = [["T: Clone", "T:Clone"]]

[[test]]
name = "generic_method_call_single_type_param"
description = "Generic method call with single type parameter"
tags = ["generics", "method-call"]

[test.python]
code = '''
def test_infer():
    result = infer[str]("hello")
    return result
'''

[test.assertions]
contains_any = [["infer::<", "infer::"]]

[[test]]
name = "generic_method_call_multiple_type_params"
description = "Generic method call with multiple type parameters"
tags = ["generics", "method-call"]

[test.python]
code = '''
def test_convert():
    result = convert[int, str](42)
    return result
'''

[test.assertions]
contains_any = [["convert::<", "convert::"]]

[[test]]
name = "generic_method_on_object"
description = "Generic method call on object"
tags = ["generics", "method-call"]

[test.python]
code = '''
def test_method():
    obj = SomeClass()
    result = obj.method[int]("value")
    return result
'''

[test.assertions]
contains_any = [[".method::<", ".method::"]]

[[test]]
name = "generic_method_with_complex_types"
description = "Generic method with complex generic types as parameters"
tags = ["generics", "method-call"]

[test.python]
code = '''
from typing import List, Dict

def test_complex():
    result = process[List[int], Dict[str, int]]([1, 2, 3])
    return result
'''

[test.assertions]
contains_any = [["process::<Vec<i32>", "process::"]]

[[test]]
name = "chained_generic_method_calls"
description = "Chained method calls with type parameters"
tags = ["generics", "method-call"]

[test.python]
code = '''
def test_chain():
    result = obj.first[int](10).second[str]("hello")
    return result
'''

[test.assertions]
contains = [".first::<", ".second::<"]

[[test]]
name = "generic_method_with_type_vars"
description = "Generic method using type variables"
tags = ["generics", "typevar"]

[test.python]
code = '''
from typing import TypeVar

T = TypeVar('T')

def wrapper(value: T) -> T:
    result = identity[T](value)
    return result
'''

[test.assertions]
contains_any = [["identity::<T>", "identity::"]]

[[test]]
name = "generic_constructor_call"
description = "Generic constructor/instantiation"
tags = ["generics", "constructor"]

[test.python]
code = '''
