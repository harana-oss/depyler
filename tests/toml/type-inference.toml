tags = ["inference", "arithmetic"]

[test.python]
code = '''
def increment(x):
    return x + 1
'''

[test.assertions]
contains_any = [["i32", "i64", "isize"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_float_from_division"
description = "Infer float from true division"
tags = ["inference", "division"]

[test.python]
code = '''
def half(x: float) -> float:
    return x / 2.0
'''

[test.assertions]
contains = ["f64"]

[[test]]
name = "infer_string_from_concat"
description = "Infer string from concatenation"
tags = ["inference", "string"]

[test.python]
code = '''
def greet(name: str) -> str:
    return "Hello, " + name
'''

[test.assertions]
contains_any = [["String", "&str"]]

# =============================================================================
# Inference from Method Calls
# =============================================================================

[[test]]
name = "infer_string_from_upper"
description = "Infer string from .upper() call"
