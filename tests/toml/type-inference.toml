    with open(filepath) as f:
        return f.read()
'''

[test.assertions]
contains_any = [["filepath: &str", "filepath: String"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_string_from_fstring"
description = "Infer string type from f-string usage"
tags = ["inference", "fstring"]

[test.python]
code = '''
def greet(name):
    return f"Hello, {name}"
'''

[test.assertions]
contains_any = [["name: &str", "name: String"]]
not_contains = ["serde_json::Value"]

[[test]]
name = "infer_list_from_iteration"
