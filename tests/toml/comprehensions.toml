# =============================================================================
# Generator Expressions in Builtins
# =============================================================================

[[test]]
name = "generator_expr_sum"
description = "Generator expression in sum()"
tags = ["comprehension", "generator", "sum"]

[test.python]
code = '''
def sum_squares(n: int) -> int:
    return sum(x * x for x in range(n))
'''

[test.assertions]
contains = ["map("]
contains_any = [[".sum()", "sum::<"]]

[[test]]
name = "generator_expr_any"
description = "Generator expression in any()"
tags = ["comprehension", "generator", "any"]

[test.python]
code = '''
def has_positive(items: list[int]) -> bool:
    return any(x > 0 for x in items)
'''

[test.assertions]
contains = [".any("]

[[test]]
name = "generator_expr_all"
description = "Generator expression in all()"
tags = ["comprehension", "generator", "all"]

[test.python]
code = '''
def all_positive(items: list[int]) -> bool:
    return all(x > 0 for x in items)
'''

[test.assertions]
contains = [".all("]
