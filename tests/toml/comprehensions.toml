# Comprehension Tests - Migrated from test_list_comprehension.rs

[metadata]
name = "Comprehension Tests"
category = "comprehensions"

# =============================================================================
# Basic List Comprehension
# =============================================================================

[[test]]
name = "comprehension_simple"
description = "Simple list comprehension"

python = '''
def squares(n: int) -> list[int]:
    return [x * x for x in range(n)]
'''

rust = '''
pub fn squares(n: i32) -> Vec<i32> {
    return (0..n).map(|x| x * x).collect::<Vec<_>>();
}
'''

[[test]]
name = "comprehension_with_filter"
description = "List comprehension with if condition"

python = '''
def evens(n: int) -> list[int]:
    return [x for x in range(n) if x % 2 == 0]
'''

rust = '''
pub fn evens(n: i32) -> Vec<i32> {
    return (0..n).filter(|&x| *x % 2 == 0).map(|x| x).collect::<Vec<_>>();
}
'''

[[test]]
name = "comprehension_transform_filter"
description = "List comprehension with transform and filter"

python = '''
def even_squares(n: int) -> list[int]:
    return [x * x for x in range(n) if x % 2 == 0]
'''

rust = '''
pub fn even_squares(n: i32) -> Vec<i32> {
    return (0..n).filter(|&x| *x % 2 == 0).map(|x| x * x).collect::<Vec<_>>();
}
'''

[[test]]
name = "comprehension_string_transform"
description = "List comprehension with string transformation"

python = '''
def uppercase_words(words: list[str]) -> list[str]:
    return [word.upper() for word in words]
'''

rust = '''
pub fn uppercase_words(words: &Vec<String>) -> Vec<String> {
    return words
        .clone()
        .into_iter()
        .map(|word| word.to_uppercase())
        .collect::<Vec<_>>();
};
}
'''

[[test]]
name = "comprehension_string_filter"
description = "List comprehension filtering strings"

python = '''
def long_words(words: list[str]) -> list[str]:
    return [word for word in words if len(word) > 4]
'''

rust = '''
pub fn long_words(words: &Vec<String>) -> Vec<String> {
    return words
        .clone()
        .into_iter()
        .filter(|word| word.len() as i32 > 4)
        .map(|word| word)
        .collect::<Vec<_>>();
};
}
'''

