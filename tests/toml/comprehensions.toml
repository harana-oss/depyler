[[test]]
name = "set_comprehension_basic"
description = "Basic set comprehension"

python = '''
def unique_squares(items: list[int]) -> set[int]:
    return {x * x for x in items}
'''

rust = '''
use std::collections::HashSet;
pub fn unique_squares(items: &Vec<i32>) -> HashSet<i32> {
    return items.iter().cloned().map(|x| x * x).collect::<HashSet<_>>();
}
'''

[[test]]
name = "generator_expr_sum"
description = "Generator expression in sum()"

python = '''
def sum_squares(n: int) -> int:
    return sum(x * x for x in range(n))
'''

rust = '''
pub fn sum_squares(n: i32) -> i32 {
    return 0..n.map(|x| x * x).sum::<i32>();
};
}
'''

[[test]]
name = "generator_expr_any"
description = "Generator expression in any()"

python = '''
def has_positive(items: list[int]) -> bool:
    return any(x > 0 for x in items)
'''

rust = '''
pub fn has_positive(items: &Vec<i32>) -> bool {
    return items.iter().copied().map(|x| x > 0).any(|x| x);
};
}
'''

[[test]]
name = "generator_expr_all"
description = "Generator expression in all()"

python = '''
