[metadata]
name = "Chained Comparison Tests"
category = "core-language"

# =============================================================================
# Basic Chained Comparisons
# =============================================================================

[[test]]
name = "chained_less_than"
description = "a < b < c"

python = '''
a = 1
b = 2
c = 3
result = a < b < c
'''

rust = '''
// a < b < c
let a = 1;
let b = 2;
let c = 3;
let result = a < b && b < c;
'''


