# Result Error Propagation Tests
# Tests for ? operator usage with Result vs plain types

[metadata]
name = "Result Error Propagation Tests"
category = "error-propagation"
description = "Tests for selective error propagation to avoid E0277 errors"

[[test]]
name = "result_caller_calls_plain_return"
description = "Function returning Result calls function returning i32 - no ? added"

python = '''
def double(x: int) -> int:
    return x * 2

def process_with_double(x: int) -> int:
    result = double(x)
    return result
'''

rust = '''
pub fn double(x: i32) -> i32 {
    return x * 2;
}
pub fn process_with_double(x: i32) -> i32 {
    let result = double(x);
    return result;
};
}
'''

[[test]]
name = "plain_caller_uses_result_function"
description = "Non-Result caller calls Result-returning function with unwrap"

python = '''
def safe_divide(a: int, b: int) -> int:
    if b == 0:
        raise ValueError("division by zero")
    return a // b

def divide_or_zero(a: int, b: int) -> int:
    try:
        return safe_divide(a, b)
    except ValueError:
        return 0
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ValueError {
    message: String,
}
impl std::fmt::Display for ValueError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "value error: {}", self.message)
    }
}
impl std::error::Error for ValueError {}
impl ValueError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = " Depyler: proven to terminate"]
pub fn safe_divide(a: i32, b: i32) -> i32 {
    let _cse_temp_0 = b == 0;
    if _cse_temp_0 {
        panic!("{}", "division by zero");
    }
    return {
        let a = a;
        let b = b;
        let q = a / b;
        let r = a % b;
        let r_negative = r < 0;
        let b_negative = b < 0;
        let r_nonzero = r != 0;
        let signs_differ = r_negative != b_negative;
        let needs_adjustment = r_nonzero && signs_differ;
        if needs_adjustment { q - 1 } else { q }
    };
}
pub fn divide_or_zero(a: i32, b: i32) -> i32 {
    if b == 0 {
        return 0;
    } else {
        return safe_divide(a, b);
    }
};
}
'''

[[test]]
name = "nested_plain_function_calls"
description = "Nested function calls with mixed Result/non-Result types"

python = '''
def add(a: int, b: int) -> int:
    return a + b

def multiply(a: int, b: int) -> int:
    return a * b

def compound(x: int, y: int, z: int) -> int:
    sum_val = add(x, y)
    return multiply(sum_val, z)
'''

rust = '''
pub fn add(a: i32, b: i32) -> i32 {
    return a + b;
}
pub fn multiply(a: i32, b: i32) -> i32 {
    return a * b;
}
pub fn compound(x: i32, y: i32, z: i32) -> i32 {
    let sum_val = add(x, y);
    return multiply(sum_val, z);
};
}
'''

[[test]]
name = "chained_function_calls_no_question_mark"
description = "Chained plain function calls without ? operator"

python = '''
def step_a(x: int) -> int:
    return x + 1

def step_b(x: int) -> int:
    return x * 2

def pipeline(x: int) -> int:
    return step_b(step_a(x))
'''

rust = '''
pub fn step_a(x: i32) -> i32 {
    return x + 1;
}
pub fn step_b(x: i32) -> i32 {
    return x * 2;
}
pub fn pipeline(x: i32) -> i32 {
    return step_b(step_a(x));
};
}
'''

[[test]]
