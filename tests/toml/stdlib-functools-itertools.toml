# Stdlib functools and itertools Conformance Tests
# Migrated from tests/python/stdlib/test_functools_itertools.py
# Tests higher-order behavior and iterator laws.
# These verify the reference semantics that the transpiler must emulate.

[metadata]
name = "Functools Itertools Conformance Tests"
category = "stdlib"

# =============================================================================
# functools.partial
# =============================================================================

[[test]]
name = "partial_binds_positional"
description = "partial binds positional arguments"
python = '''
from functools import partial

def add(a, b, c):
    return a + b + c

add_5 = partial(add, 5)
assert add_5(10, 20) == 35
'''

[[test]]
name = "partial_binds_keyword"
description = "partial binds keyword arguments"
python = '''
from functools import partial

def greet(greeting, name):
    return f"{greeting}, {name}!"

hello = partial(greet, greeting="Hello")
assert hello(name="World") == "Hello, World!"
'''

[[test]]
name = "partial_preserves_func"
description = "partial.func references original function"
python = '''
from functools import partial

def original():
    pass

p = partial(original)
assert p.func is original
'''

# =============================================================================
# functools.reduce
# =============================================================================

[[test]]
name = "reduce_sums"
description = "reduce performs left fold"
python = '''
from functools import reduce

result = reduce(lambda a, b: a + b, [1, 2, 3, 4])
assert result == 10
'''

[[test]]
name = "reduce_with_initial"
description = "reduce with initial value"
python = '''
from functools import reduce

result = reduce(lambda a, b: a + b, [1, 2, 3], 10)
assert result == 16
'''

[[test]]
name = "reduce_empty_with_initial"
description = "reduce on empty with initial returns initial"
python = '''
from functools import reduce

result = reduce(lambda a, b: a + b, [], 42)
assert result == 42
'''

[[test]]
name = "reduce_empty_without_initial_raises"
description = "reduce on empty without initial raises TypeError"
python = '''
from functools import reduce

try:
    reduce(lambda a, b: a + b, [])
    assert False, "Should have raised TypeError"
except TypeError:
    pass
'''

# =============================================================================
# functools.lru_cache
# =============================================================================

[[test]]
name = "lru_cache_caches"
description = "lru_cache caches function results"
python = '''
from functools import lru_cache

call_count = [0]

@lru_cache(maxsize=128)
def expensive(n):
    call_count[0] += 1
    return n * 2

assert expensive(5) == 10
assert expensive(5) == 10
assert call_count[0] == 1
'''

[[test]]
name = "lru_cache_info"
description = "lru_cache provides cache info"
python = '''
from functools import lru_cache

@lru_cache(maxsize=128)
def func(n):
    return n

func(1)
func(2)
func(1)
info = func.cache_info()
assert info.hits == 1
assert info.misses == 2
'''

# =============================================================================
# functools.wraps
# =============================================================================

[[test]]
name = "wraps_preserves_metadata"
description = "wraps preserves function metadata"
python = '''
from functools import wraps

def decorator(func):
    @wraps(func)
    def wrapper(*args, **kwargs):
        return func(*args, **kwargs)
    return wrapper

@decorator
def my_func():
    """My docstring."""
    pass

assert my_func.__name__ == "my_func"
assert my_func.__doc__ == "My docstring."
'''

# =============================================================================
# Infinite Iterators
# =============================================================================

[[test]]
name = "itertools_count"
description = "count() produces infinite sequence"
python = '''
from itertools import count

c = count(10, 2)
assert next(c) == 10
assert next(c) == 12
assert next(c) == 14
'''

[[test]]
name = "itertools_cycle"
description = "cycle() repeats sequence"
python = '''
from itertools import cycle

c = cycle([1, 2, 3])
result = [next(c) for _ in range(7)]
assert result == [1, 2, 3, 1, 2, 3, 1]
'''

[[test]]
name = "itertools_repeat"
description = "repeat() with times limit"
python = '''
from itertools import repeat

result = list(repeat("x", 3))
assert result == ["x", "x", "x"]
'''

# =============================================================================
# Chain Combinators
# =============================================================================

[[test]]
name = "itertools_chain"
description = "chain() concatenates iterables"
python = '''
from itertools import chain

result = list(chain([1, 2], [3, 4], [5]))
assert result == [1, 2, 3, 4, 5]
'''

[[test]]
name = "itertools_chain_from_iterable"
description = "chain.from_iterable flattens"
python = '''
from itertools import chain

result = list(chain.from_iterable([[1, 2], [3, 4]]))
assert result == [1, 2, 3, 4]
'''

# =============================================================================
# Filtering Iterators
# =============================================================================

[[test]]
name = "itertools_takewhile"
description = "takewhile() stops at first false"
python = '''
from itertools import takewhile

result = list(takewhile(lambda x: x < 5, [1, 3, 5, 2, 1]))
assert result == [1, 3]
'''

[[test]]
name = "itertools_dropwhile"
description = "dropwhile() starts at first false"
python = '''
from itertools import dropwhile

result = list(dropwhile(lambda x: x < 5, [1, 3, 5, 2, 1]))
assert result == [5, 2, 1]
'''

[[test]]
name = "itertools_filterfalse"
description = "filterfalse() keeps elements where predicate is false"
python = '''
from itertools import filterfalse

result = list(filterfalse(lambda x: x % 2, [1, 2, 3, 4, 5]))
assert result == [2, 4]
'''

# =============================================================================
# Groupby
# =============================================================================

[[test]]
name = "itertools_groupby"
description = "groupby() groups consecutive equal elements"
python = '''
from itertools import groupby

data = [("a", 1), ("a", 2), ("b", 3), ("b", 4), ("a", 5)]
result = [(k, list(g)) for k, g in groupby(data, key=lambda x: x[0])]
assert result == [
    ("a", [("a", 1), ("a", 2)]),
    ("b", [("b", 3), ("b", 4)]),
    ("a", [("a", 5)]),
]
'''

# =============================================================================
# Combinatorics
# =============================================================================

[[test]]
name = "itertools_product"
description = "product() gives Cartesian product"
python = '''
from itertools import product

result = list(product([1, 2], ["a", "b"]))
assert result == [(1, "a"), (1, "b"), (2, "a"), (2, "b")]
'''

[[test]]
name = "itertools_permutations"
description = "permutations() gives all orderings"
python = '''
from itertools import permutations

result = list(permutations([1, 2, 3], 2))
assert len(result) == 6
assert (1, 2) in result
assert (2, 1) in result
'''

[[test]]
name = "itertools_combinations"
description = "combinations() gives subsets"
python = '''
from itertools import combinations

result = list(combinations([1, 2, 3, 4], 2))
assert result == [(1, 2), (1, 3), (1, 4), (2, 3), (2, 4), (3, 4)]
'''

# =============================================================================
# Slicing
# =============================================================================

[[test]]
name = "itertools_islice"
description = "islice() slices iterator"
python = '''
from itertools import islice, count

result = list(islice(count(), 5, 10))
assert result == [5, 6, 7, 8, 9]
'''

[[test]]
name = "itertools_islice_step"
description = "islice() with step"
python = '''
from itertools import islice, count

result = list(islice(count(), 0, 10, 2))
assert result == [0, 2, 4, 6, 8]
'''

# =============================================================================
# Zip Variants
# =============================================================================

[[test]]
name = "itertools_zip_longest"
description = "zip_longest() fills with fillvalue"
python = '''
from itertools import zip_longest

result = list(zip_longest([1, 2, 3], [4, 5], fillvalue=0))
assert result == [(1, 4), (2, 5), (3, 0)]
'''

[[test]]
name = "itertools_starmap"
description = "starmap() unpacks arguments"
python = '''
from itertools import starmap

result = list(starmap(pow, [(2, 3), (3, 2), (10, 2)]))
assert result == [8, 9, 100]
'''
