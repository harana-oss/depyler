[metadata]
name = "Match Mapping Patterns Tests"
category = "modern-python"

# =============================================================================
# Basic Mapping Patterns
# =============================================================================

[[test]]
name = "mapping_simple_key"
skip = true
description = "case {'key': value}: ..."

python = '''
data = {'key': 42}
match data:
    case {'key': value}:
        result = value
    case _:
        result = 0
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("key", 42);

    let result = match data.get("key") {
        Some(&value) => value,
        None => 0,
    };
'''


[[test]]
name = "mapping_multiple_keys"
skip = true
description = "case {'a': x, 'b': y}: ..."

python = '''
data = {'a': 10, 'b': 20}
match data:
    case {'a': x, 'b': y}:
        result = x + y
    case {'a': x}:
        result = x
    case _:
        result = 0
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("a", 10);
    data.insert("b", 20);

    let result = match (data.get("a"), data.get("b")) {
        (Some(&x), Some(&y)) => x + y,
        (Some(&x), None) => x,
        _ => 0,
    };
'''


[[test]]
name = "mapping_literal_value"
skip = true
description = "case {'type': 'error'}: ..."

python = '''
data = {'type': 'error', 'message': 'Failed'}
match data:
    case {'type': 'error', 'message': msg}:
        result = f"Error: {msg}"
    case {'type': 'warning', 'message': msg}:
        result = f"Warning: {msg}"
    case _:
        result = "Unknown"
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("type", "error");
    data.insert("message", "Failed");

    let result = match (data.get("type"), data.get("message")) {
        (Some(&"error"), Some(&msg)) => format!("Error: {}", msg),
        (Some(&"warning"), Some(&msg)) => format!("Warning: {}", msg),
        _ => "Unknown".to_string(),
    };
'''


# =============================================================================
# Capturing Values
# =============================================================================

[[test]]
name = "mapping_capture"
skip = true
description = "case {'name': name}: capture name"

python = '''
data = {'name': 'Alice', 'age': 30}
match data:
    case {'name': name}:
        result = f"Hello, {name}"
    case _:
        result = "Unknown"
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("name", "Alice");
    data.insert("age", "30");

    let result = match data.get("name") {
        Some(&name) => format!("Hello, {}", name),
        None => "Unknown".to_string(),
    };
'''


[[test]]
name = "mapping_capture_literal"
skip = true
description = "case {'type': 'user', 'id': id}: ..."

python = '''
data = {'type': 'user', 'id': 123}
match data:
    case {'type': 'user', 'id': id}:
        result = f"User ID: {id}"
    case {'type': 'admin', 'id': id}:
        result = f"Admin ID: {id}"
    case _:
        result = "Unknown"
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("type", "user");
    data.insert("id", 123);

    let result = match (data.get("type"), data.get("id")) {
        (Some(&"user"), Some(&id)) => format!("User ID: {}", id),
        (Some(&"admin"), Some(&id)) => format!("Admin ID: {}", id),
        _ => "Unknown".to_string(),
    };
'''


[[test]]
name = "mapping_nested_capture"
skip = true
description = "case {'data': {'id': id}}: ..."

python = '''
data = {'data': {'id': 456}}
match data:
    case {'data': {'id': id}}:
        result = f"ID: {id}"
    case _:
        result = "Unknown"
'''

rust = '''
    use std::collections::HashMap;

    let mut inner = HashMap::new();
    inner.insert("id", 456);

    let mut data = HashMap::new();
    data.insert("data", inner);

    let result = match data.get("data") {
        Some(inner_map) => match inner_map.get("id") {
            Some(&id) => format!("ID: {}", id),
            None => "Unknown".to_string(),
        },
        None => "Unknown".to_string(),
    };
'''


# =============================================================================
# **rest Pattern
# =============================================================================

[[test]]
name = "mapping_rest"
skip = true
description = "case {'key': v, **rest}: capture remaining"

python = '''
data = {'key': 1, 'a': 2, 'b': 3}
match data:
    case {'key': v, **rest}:
        result = (v, len(rest))
    case _:
        result = (0, 0)
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("key", 1);
    data.insert("a", 2);
    data.insert("b", 3);

    let result = match data.get("key") {
        Some(&v) => {
            let rest_count = data.len() - 1;
            (v, rest_count)
        }
        None => (0, 0),
    };
'''


[[test]]
name = "mapping_rest_empty"
skip = true
description = "**rest is empty dict when all keys matched"

python = '''
data = {'key': 1}
match data:
    case {'key': v, **rest}:
        result = len(rest) == 0
    case _:
        result = False
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("key", 1);

    let result = match data.get("key") {
        Some(&_v) => data.len() == 1,
        None => false,
    };
'''


[[test]]
name = "mapping_rest_discard"
skip = true
description = "case {'key': v, **_}: ignore rest"

python = '''
data = {'key': 1, 'extra': 2}
match data:
    case {'key': v, **_}:
        result = v * 2
    case _:
        result = 0
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("key", 1);
    data.insert("extra", 2);

    let result = match data.get("key") {
        Some(&v) => v * 2,
        None => 0,
    };
'''


