# =============================================================================
# Nested Patterns
# =============================================================================

[[test]]
name = "mapping_nested"
skip = true
description = "case {'outer': {'inner': v}}: ..."

python = '''
data = {'outer': {'inner': 42}}
match data:
    case {'outer': {'inner': v}}:
        result = v
    case _:
        result = 0
'''

rust = '''
    use std::collections::HashMap;

    let mut inner = HashMap::new();
    inner.insert("inner", 42);

    let mut data = HashMap::new();
    data.insert("outer", inner);

    let result = match data.get("outer") {
        Some(inner_map) => match inner_map.get("inner") {
            Some(&v) => v,
            None => 0,
        },
        None => 0,
    };
'''


[[test]]
name = "mapping_with_sequence"
skip = true
description = "case {'items': [first, *rest]}: ..."

python = '''
data = {'items': [1, 2, 3, 4]}
match data:
    case {'items': [first, *rest]}:
        result = (first, len(rest))
    case _:
        result = (0, 0)
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert("items", vec![1, 2, 3, 4]);

    let result = match data.get("items") {
        Some(items) if !items.is_empty() => {
            let first = items[0];
            let rest_len = items.len() - 1;
            (first, rest_len)
        }
        _ => (0, 0),
    };
'''


[[test]]
name = "mapping_with_class"
skip = true
description = "case {'point': Point(x, y)}: ..."

python = '''
class Point:
    __match_args__ = ('x', 'y')
    def __init__(self, x, y):
        self.x = x
        self.y = y

data = {'point': Point(3, 4)}
match data:
    case {'point': Point(x, y)}:
        result = x + y
    case _:
        result = 0
'''

rust = '''
    use std::collections::HashMap;

    struct Point {
        x: i32,
        y: i32,
    }

    let mut data = HashMap::new();
    data.insert("point", Point { x: 3, y: 4 });

    let result = match data.get("point") {
        Some(Point { x, y }) => x + y,
        None => 0,
    };
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "mapping_empty"
skip = true
description = "case {}: matches any mapping"

python = '''
data = {'a': 1, 'b': 2}
match data:
    case {}:
        result = "mapping"
    case _:
        result = "other"
'''

rust = '''
    use std::collections::HashMap;

    let mut data: HashMap<&str, i32> = HashMap::new();
    data.insert("a", 1);
    data.insert("b", 2);

    let result = if data.is_empty() || !data.is_empty() {
        "mapping"
    } else {
        "other"
    };
'''


[[test]]
name = "mapping_duplicate_keys"
skip = true
description = "case {'a': x, 'a': y}: syntax error"

python = '''
# case {'a': x, 'a': y}: syntax error
result = True  # Placeholder
'''

rust = '''
    // case {'a': x, 'a': y}: syntax error
    let result = true; // Placeholder
'''


[[test]]
name = "mapping_subclass"
skip = true
description = "Pattern matches dict subclasses"

python = '''
class MyDict(dict):
    pass

data = MyDict({'key': 42})
match data:
    case {'key': v}:
        result = v
    case _:
        result = 0
'''

rust = '''
    use std::collections::HashMap;

    struct MyDict {
        inner: HashMap<String, i32>,
    }

    let mut inner = HashMap::new();
    inner.insert("key".to_string(), 42);
    let data = MyDict { inner };

    let result = match data.inner.get("key") {
        Some(&v) => v,
        None => 0,
    };
'''


[[test]]
name = "mapping_non_dict"
skip = true
description = "Works with any Mapping type"

python = '''
from collections import UserDict

class MyMapping(UserDict):
    pass

data = MyMapping({'key': 42})
match data:
    case {'key': v}:
        result = v
    case _:
        result = 0
'''

rust = '''
    use std::collections::HashMap;

    trait Mapping {
        fn get(&self, key: &str) -> Option<i32>;
    }

    struct MyMapping {
        data: HashMap<String, i32>,
    }

    impl Mapping for MyMapping {
        fn get(&self, key: &str) -> Option<i32> {
            self.data.get(key).copied()
        }
    }

    let mut inner = HashMap::new();
    inner.insert("key".to_string(), 42);
    let data = MyMapping { data: inner };

    let result = match data.get("key") {
        Some(v) => v,
        None => 0,
    };
'''

