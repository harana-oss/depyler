[[test]]
name = "mapping_int_keys"
skip = true
description = "case {0: first, 1: second}: ..."

python = '''
data = {0: 'a', 1: 'b'}
match data:
    case {0: first, 1: second}:
        result = first + second
    case _:
        result = ""
'''

rust = '''
    use std::collections::HashMap;

    let mut data = HashMap::new();
    data.insert(0, "a");
    data.insert(1, "b");

    let result = match (data.get(&0), data.get(&1)) {
        (Some(&first), Some(&second)) => format!("{}{}", first, second),
        _ => "".to_string(),
    };
'''


[[test]]
name = "mapping_enum_keys"
skip = true
description = "case {Status.OK: data}: ..."

python = '''
from enum import Enum

class Status(Enum):
    OK = 1
    ERROR = 2

data = {Status.OK: 'success'}
match data:
    case {Status.OK: value}:
        result = value
    case {Status.ERROR: value}:
        result = f"Error: {value}"
    case _:
        result = "unknown"
'''

rust = '''
    use std::collections::HashMap;

    #[derive(Eq, Hash, PartialEq)]
    enum Status {
        OK,
        ERROR,
    }

    let mut data = HashMap::new();
    data.insert(Status::OK, "success");

    let result = match data.get(&Status::OK) {
        Some(&value) => value,
        None => match data.get(&Status::ERROR) {
            Some(&value) => format!("Error: {}", value).as_str(),
            None => "unknown",
        },
    };
'''


