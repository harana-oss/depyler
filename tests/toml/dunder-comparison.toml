[[test]]
name = "dunder_chaining"
skip = true
description = "a < b < c with custom comparisons"
python = """
class Number:
    def __init__(self, x):
        self.x = x
    
    def __lt__(self, other):
        return self.x < other.x

a = Number(1)
b = Number(2)
c = Number(3)
print(a < b < c)
print(c < b < a)
"""
rust = """
#[derive(PartialOrd, PartialEq)]
struct Number {
    x: i32,
}

impl Number {
    fn new(x: i32) -> Self {
        Number { x }
    }
}

let a = Number::new(1);
let b = Number::new(2);
let c = Number::new(3);
log::info!("{}", a < b && b < c);
log::info!("{}", c < b && b < a);"""
expected_output = """True
False"""

[[test]]
name = "eq_non_bool"
skip = true
description = "__eq__ can return non-bool (like numpy)"
python = """
class Special:
    def __init__(self, x):
        self.x = x
    
    def __eq__(self, other):
        # Return a string instead of bool
        if self.x == other.x:
            return "equal"
        return "not equal"

s1 = Special(5)
s2 = Special(5)
s3 = Special(10)
print(s1 == s2)
print(s1 == s3)
"""
rust = """
// Rust's PartialEq trait requires bool return
// This is a Python-specific feature
struct Special {
    x: i32,
}

impl Special {
    fn new(x: i32) -> Self {
        Special { x }
    }

    fn eq_str(&self, other: &Special) -> &'static str {
        if self.x == other.x {
            "equal"
        } else {
            "not equal"
        }
    }
}

let s1 = Special::new(5);
let s2 = Special::new(5);
let s3 = Special::new(10);
log::info!("{}", s1.eq_str(&s2));
log::info!("{}", s1.eq_str(&s3));"""
expected_output = """equal
not equal"""

[[test]]
name = "mutable_hash"
skip = true
description = "Mutable objects should not be hashable"
python = """
class MutablePoint:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def __eq__(self, other):
        return self.x == other.x and self.y == other.y
    
    # Don't define __hash__ for mutable objects
    __hash__ = None

p = MutablePoint(1, 2)
try:
    hash(p)
    print("Should not be hashable")
except TypeError:
    print("TypeError: unhashable type")
"""
rust = """
// Rust prevents this through the type system
// Mutable references can't implement Hash
struct MutablePoint {
    x: i32,
    y: i32,
}

impl MutablePoint {
    fn new(x: i32, y: i32) -> Self {
        MutablePoint { x, y }
    }
}

impl PartialEq for MutablePoint {
    fn eq(&self, other: &Self) -> bool {
        self.x == other.x && self.y == other.y
    }
}

let _p = MutablePoint::new(1, 2);
// Attempting to hash would fail at compile time without Hash trait
log::info!("TypeError: unhashable type");"""
expected_output = "TypeError: unhashable type"
