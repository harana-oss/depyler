# Comparison with Different Types
# =============================================================================

[[test]]
name = "eq_different_type"
skip = true
description = "Return NotImplemented for incompatible types"
python = """
class Value:
    def __init__(self, x):
        self.x = x
    
    def __eq__(self, other):
        if not isinstance(other, Value):
            return NotImplemented
        return self.x == other.x

v = Value(5)
print(v == Value(5))
print(v == 5)
"""
rust = """
struct Value {
    x: i32,
}

impl Value {
    fn new(x: i32) -> Self {
        Value { x }
    }
}

impl PartialEq for Value {
    fn eq(&self, other: &Self) -> bool {
        self.x == other.x
    }
}

let v = Value::new(5);
let v2 = Value::new(5);
log::info!("{}", v == v2);
// Rust is statically typed, can't compare Value with i32
log::info!("False");"""
expected_output = """True
False"""

[[test]]
name = "lt_different_type"
skip = true
description = "Comparison with incompatible type"
python = """
class Value:
