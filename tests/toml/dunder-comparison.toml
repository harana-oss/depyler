[metadata]
name = "Dunder Comparison Tests"
category = "dunder-methods"

# =============================================================================
# Equality
# =============================================================================

[[test]]
name = "dunder_eq"
skip = true
description = "def __eq__(self, other): return self.x == other.x"
python = """
class Point:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def __eq__(self, other):
        if not isinstance(other, Point):
            return False
        return self.x == other.x and self.y == other.y

p1 = Point(1, 2)
p2 = Point(1, 2)
p3 = Point(2, 3)
print(p1 == p2)
print(p1 == p3)
"""
rust = """
#[derive(PartialEq)]
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn new(x: i32, y: i32) -> Self {
        Point { x, y }
    }
}

let p1 = Point::new(1, 2);
let p2 = Point::new(1, 2);
let p3 = Point::new(2, 3);
log::info!("{}", p1 == p2);
log::info!("{}", p1 == p3);"""
expected_output = """True
False"""

[[test]]
name = "dunder_ne"
skip = true
description = "def __ne__(self, other): return self.x != other.x"
python = """
class Value:
    def __init__(self, x):
        self.x = x
    
    def __eq__(self, other):
        return self.x == other.x
    
    def __ne__(self, other):
        return self.x != other.x

v1 = Value(5)
v2 = Value(5)
v3 = Value(10)
print(v1 != v2)
print(v1 != v3)
"""
rust = """
#[derive(PartialEq)]
struct Value {
    x: i32,
}

impl Value {
    fn new(x: i32) -> Self {
        Value { x }
    }
}

let v1 = Value::new(5);
let v2 = Value::new(5);
let v3 = Value::new(10);
log::info!("{}", v1 != v2);
log::info!("{}", v1 != v3);"""
expected_output = """False
True"""

[[test]]
name = "dunder_ne_default"
skip = true
description = "__ne__ defaults to not __eq__"
python = """
class Simple:
    def __init__(self, x):
        self.x = x
    
    def __eq__(self, other):
        return self.x == other.x
    # __ne__ is automatically the negation of __eq__

s1 = Simple(5)
s2 = Simple(5)
s3 = Simple(10)
print(s1 == s2)
print(s1 != s3)
"""
rust = """
#[derive(PartialEq)]
struct Simple {
    x: i32,
}

impl Simple {
    fn new(x: i32) -> Self {
        Simple { x }
    }
}

let s1 = Simple::new(5);
let s2 = Simple::new(5);
let s3 = Simple::new(10);
log::info!("{}", s1 == s2);
log::info!("{}", s1 != s3);"""
expected_output = """True
True"""

