[[test]]
name = "comparison_reflected"
skip = true
description = "Python tries reflected method if NotImplemented"
python = """
class A:
    def __init__(self, x):
        self.x = x
    
    def __eq__(self, other):
        if isinstance(other, B):
            return self.x == other.y
        return NotImplemented

class B:
    def __init__(self, y):
        self.y = y
    
    def __eq__(self, other):
        if isinstance(other, A):
            return self.y == other.x
        return NotImplemented

a = A(5)
b = B(5)
print(a == b)
print(b == a)
"""
rust = """
struct A {
    x: i32,
}

struct B {
    y: i32,
}

impl A {
    fn new(x: i32) -> Self {
        A { x }
    }

    fn eq_b(&self, other: &B) -> bool {
        self.x == other.y
    }
}

impl B {
    fn new(y: i32) -> Self {
        B { y }
    }

    fn eq_a(&self, other: &A) -> bool {
        self.y == other.x
    }
}

let a = A::new(5);
let b = B::new(5);
log::info!("{}", a.eq_b(&b));
log::info!("{}", b.eq_a(&a));"""
expected_output = """True
True"""

