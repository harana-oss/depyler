# =============================================================================
# @total_ordering
# =============================================================================

[[test]]
name = "total_ordering"
skip = true
description = "@total_ordering with __eq__ and one of __lt__, __le__, __gt__, __ge__"
python = """
from functools import total_ordering

@total_ordering
class Student:
    def __init__(self, name, grade):
        self.name = name
        self.grade = grade
    
    def __eq__(self, other):
        return self.grade == other.grade
    
    def __lt__(self, other):
        return self.grade < other.grade

s1 = Student("Alice", 85)
s2 = Student("Bob", 90)
print(s1 < s2)
print(s1 <= s2)
print(s1 > s2)
print(s1 >= s2)
"""
rust = """
#[derive(Eq, PartialEq, Ord, PartialOrd)]
struct Student {
    grade: i32,
    name: String,
}

impl Student {
    fn new(name: &str, grade: i32) -> Self {
        Student {
            name: name.to_string(),
            grade,
        }
    }
}

let s1 = Student::new("Alice", 85);
let s2 = Student::new("Bob", 90);
log::info!("{}", s1 < s2);
log::info!("{}", s1 <= s2);
log::info!("{}", s1 > s2);
log::info!("{}", s1 >= s2);"""
expected_output = """True
True
False
False"""

# =============================================================================
# __hash__
# =============================================================================

[[test]]
name = "dunder_hash"
skip = true
description = "def __hash__(self): return hash(self.x)"
python = """
class Point:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def __eq__(self, other):
        return self.x == other.x and self.y == other.y
    
    def __hash__(self):
        return hash((self.x, self.y))

p1 = Point(1, 2)
p2 = Point(1, 2)
print(hash(p1) == hash(p2))
"""
rust = """
use std::collections::hash_map::DefaultHasher;
use std::hash::{Hash, Hasher};

#[derive(PartialEq, Eq, Hash)]
struct Point {
    x: i32,
    y: i32,
}

impl Point {
    fn new(x: i32, y: i32) -> Self {
        Point { x, y }
    }
}

fn calculate_hash<T: Hash>(t: &T) -> u64 {
    let mut s = DefaultHasher::new();
    t.hash(&mut s);
    s.finish()
}

let p1 = Point::new(1, 2);
let p2 = Point::new(1, 2);
log::info!("{}", calculate_hash(&p1) == calculate_hash(&p2));"""
expected_output = "True"

[[test]]
name = "hash_eq_consistency"
skip = true
description = "Equal objects must have same hash"
python = """
class HashableValue:
    def __init__(self, x):
        self.x = x
    
    def __eq__(self, other):
        return self.x == other.x
    
    def __hash__(self):
        return hash(self.x)

v1 = HashableValue(42)
v2 = HashableValue(42)
print(v1 == v2)
print(hash(v1) == hash(v2))
"""
rust = """
use std::collections::hash_map::DefaultHasher;
use std::hash::{Hash, Hasher};

#[derive(PartialEq, Eq, Hash)]
struct HashableValue {
    x: i32,
}

impl HashableValue {
    fn new(x: i32) -> Self {
        HashableValue { x }
    }
}

fn calculate_hash<T: Hash>(t: &T) -> u64 {
    let mut s = DefaultHasher::new();
    t.hash(&mut s);
    s.finish()
}

let v1 = HashableValue::new(42);
let v2 = HashableValue::new(42);
log::info!("{}", v1 == v2);
log::info!("{}", calculate_hash(&v1) == calculate_hash(&v2));"""
expected_output = """True
True"""

[[test]]
name = "unhashable"
skip = true
description = "__hash__ = None makes class unhashable"
python = """
class Unhashable:
    __hash__ = None
    
    def __init__(self, x):
        self.x = x

obj = Unhashable(5)
try:
    hash(obj)
    print("Should not reach here")
except TypeError:
    print("TypeError: unhashable type")
"""
rust = """
// Rust doesn't have __hash__ = None equivalent
// Types simply don't implement Hash trait
struct Unhashable {
    x: i32,
}

impl Unhashable {
    fn new(x: i32) -> Self {
        Unhashable { x }
    }
}

let _obj = Unhashable::new(5);
// In Rust, trying to hash would be a compile-time error
log::info!("TypeError: unhashable type");"""
expected_output = "TypeError: unhashable type"

