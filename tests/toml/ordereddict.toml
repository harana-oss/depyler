[metadata]
name = "OrderedDict Tests"
category = "data-structures"

# =============================================================================
# Creating OrderedDict
# =============================================================================

[[test]]
name = "ordereddict_empty"
description = "OrderedDict()"

python = '''
from collections import OrderedDict

od = OrderedDict([('a', 1), ('b', 2)])
result = list(od.keys())
'''

rust = '''
// Using indexmap crate for insertion-order preservation
use indexmap::IndexMap;
let mut od = IndexMap::new();
od.insert("a", 1);
od.insert("b", 2);
'''


