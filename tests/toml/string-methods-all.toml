description = "'hello world'.title()"
tags = ["strings", "case"]

python = '''
result = 'hello world'.title()
'''

rust = '''
pub const result: serde_json::Value = "hello world"
    .split_whitespace()
    .map(|word| {
        let mut chars = word.chars();
        match chars.next() {
            None => String::new(),
            Some(first) => first.to_uppercase().chain(chars).collect::<String>(),
        }
    })
    .collect::<Vec<_>>()
    .join(" ");
use serde_json;
'''

