[[test]]
name = "str_partition"
description = "'hello'.partition('l')"

python = '''
result = 'hello'.partition('l')
'''

rust = '''
pub const result: (String, String, String) = {
    let s = "hello";
    let sep = "l";
    match s.find(sep) {
        Some(pos) => (
            s[..pos].to_string(),
            sep.to_string(),
            s[pos + sep.len()..].to_string(),
        ),
        None => (s.to_string(), String::new(), String::new()),
    }
};
'''

