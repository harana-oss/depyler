# =============================================================================
# Padding Methods
# =============================================================================

[[test]]
name = "str_center"
description = "'hi'.center(10)"

python = '''
result = 'hi'.center(10)
'''

rust = '''
pub const result: String = {
    let s = "hi";
    let width = 10 as usize;
    let fillchar = " ";
    if s.len() >= width {
        s.to_string()
    } else {
        let total_pad = width - s.len();
        let left_pad = total_pad / 2;
        let right_pad = total_pad - left_pad;
        format!(
            "{}{}{}",
            fillchar.repeat(left_pad),
            s,
            fillchar.repeat(right_pad)
        )
    }
};
'''

[[test]]
name = "str_ljust"
description = "'hi'.ljust(10)"

python = '''
result = 'hi'.ljust(10)
'''

rust = '''
pub const result: String = {
    let s = "hi";
    let width = 10 as usize;
    let fillchar = " ";
    if s.len() >= width {
        s.to_string()
    } else {
        format!("{}{}", s, fillchar.repeat(width - s.len()))
    }
};
'''

[[test]]
name = "str_rjust"
