'''

rust = '''
pub const result: String = "Hello"
    .chars()
    .map(|c| {
        if c.is_uppercase() {
            c.to_lowercase().collect::<String>()
        } else {
            c.to_uppercase().collect::<String>()
        }
    })
    .collect();
'''

