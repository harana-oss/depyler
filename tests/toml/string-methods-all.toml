# =============================================================================
# Padding Methods
# =============================================================================

[[test]]
name = "str_center"
description = "'hi'.center(10)"
tags = ["strings", "padding"]

python = '''
result = 'hi'.center(10)
'''

rust = '''
pub const result: serde_json::Value = {
    let s = "hi";
    let width = 10 as usize;
    let fillchar = " ";
    if s.len() >= width {
        s.to_string()
    } else {
        let total_pad = width - s.len();
        let left_pad = total_pad / 2;
        let right_pad = total_pad - left_pad;
        format!("{}{}{}", fillchar.repeat(left_pad), s, fillchar.repeat(right_pad))
    }
};
use serde_json;
'''

[[test]]
name = "str_ljust"
description = "'hi'.ljust(10)"
tags = ["strings", "padding"]

python = '''
result = 'hi'.ljust(10)
'''

rust = '''
pub const result: serde_json::Value = {
    let s = "hi";
    let width = 10 as usize;
    let fillchar = " ";
    if s.len() >= width {
        s.to_string()
    } else {
        format!("{}{}", s, fillchar.repeat(width - s.len()))
    }
};
use serde_json;
'''

[[test]]
name = "str_rjust"
description = "'hi'.rjust(10)"
tags = ["strings", "padding"]

python = '''
result = 'hi'.rjust(10)
'''

rust = '''
pub const result: serde_json::Value = {
    let s = "hi";
    let width = 10 as usize;
    let fillchar = " ";
    if s.len() >= width {
        s.to_string()
    } else {
        format!("{}{}", fillchar.repeat(width - s.len()), s)
    }
};
use serde_json;
'''

[[test]]
name = "str_zfill"
description = "'42'.zfill(5)"
tags = ["strings", "padding"]

python = '''
result = '42'.zfill(5)
'''

rust = '''
pub const result: serde_json::Value = {
    let s = "42";
    let width = 5 as usize;
    if s.len() >= width {
        s.to_string()
    } else {
        let sign = if s.starts_with('-') || s.starts_with('+') {
            &s[0..1]
        } else {
            ""
        };
        let num = if !sign.is_empty() { &s[1..] } else { &s[..] };
        format!("{}{}{}", sign, "0".repeat(width - s.len()), num)
    }
};
use serde_json;
'''

