# =============================================================================
# Translation
# =============================================================================

[[test]]
name = "str_maketrans"
description = "str.maketrans('abc', 'xyz')"

python = '''
result = str.maketrans('abc', 'xyz')
'''

rust = '''
pub const result: HashMap<char, char> = {
    let mut map = HashMap::new();
    let from = "abc".chars().collect::<Vec<_>>();
    let to = "xyz".chars().collect::<Vec<_>>();
    for (f, t) in from.iter().zip(to.iter()) {
        map.insert(*f, *t);
    }
    map
};
use std::collections::HashMap;
'''

[[test]]
name = "str_translate"
description = "'abc'.translate(table)"

python = '''
table = str.maketrans('abc', 'xyz')
result = 'abc'.translate(table)
'''

rust = '''
pub const table: HashMap<char, char> = {
    let mut map = HashMap::new();
    let from = "abc".chars().collect::<Vec<_>>();
    let to = "xyz".chars().collect::<Vec<_>>();
    for (f, t) in from.iter().zip(to.iter()) {
        map.insert(*f, *t);
    }
    map
};
pub const result: String = "abc"
    .chars()
    .map(|c| table.get(&c).copied().unwrap_or(c))
    .collect();
use std::collections::HashMap;
'''

# =============================================================================
# Other Methods
# =============================================================================

[[test]]
name = "str_expandtabs"
description = "'a\\tb'.expandtabs(4)"

python = '''
result = 'a\tb'.expandtabs(4)
'''

rust = '''
pub const result: String = {
    let s = "a\tb";
    let tabsize = 4;
    let mut result = String::new();
    let mut col = 0;
    for c in s.chars() {
        if c == '\t' {
            let spaces = tabsize - (col % tabsize);
            result.push_str(&" ".repeat(spaces));
            col += spaces;
        } else {
            result.push(c);
            if c == '\n' || c == '\r' {
                col = 0;
            } else {
                col += 1;
            }
        }
    }
    result
};
'''

