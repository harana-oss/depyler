[[test]]
name = "str_capitalize"
description = "'hello world'.capitalize()"

python = '''
result = 'hello world'.capitalize()
'''

rust = '''
pub const result: String = {
    let s = "hello world";
    let mut chars = s.chars();
    match chars.next() {
        None => String::new(),
        Some(first) => first.to_uppercase().collect::<String>() + &chars.as_str().to_lowercase(),
    }
};
'''

[[test]]
name = "str_title"
description = "'hello world'.title()"

python = '''
result = 'hello world'.title()
'''

rust = '''
pub const result: String = "hello world"
    .split_whitespace()
    .map(|word| {
        let mut chars = word.chars();
        match chars.next() {
            None => String::new(),
            Some(first) => first.to_uppercase().chain(chars).collect::<String>(),
        }
    })
    .collect::<Vec<_>>()
    .join(" ");
'''

