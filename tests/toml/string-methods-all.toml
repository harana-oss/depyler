[[test]]
name = "str_istitle"
description = "'Hello World'.istitle()"

python = '''
result = 'Hello World'.istitle()
'''

rust = '''
pub const result: bool = {
    let s = "Hello World";
    let mut prev_is_cased = false;
    let mut result = false;
    for c in s.chars() {
        if c.is_uppercase() || c.is_titlecase() {
            if prev_is_cased {
                return false;
            }
            prev_is_cased = true;
            result = true;
        } else if c.is_lowercase() {
            if !prev_is_cased {
                return false;
            }
            prev_is_cased = true;
            result = true;
        } else {
            prev_is_cased = false;
        }
    }
    result
};
'''

