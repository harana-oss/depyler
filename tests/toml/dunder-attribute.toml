[[test]]
name = "getattribute_vs_getattr"
description = "__getattribute__ first, __getattr__ as fallback"
python = """
class Both:
    real = "real"
    
    def __getattribute__(self, name):
        try:
            return object.__getattribute__(self, name)
        except AttributeError:
            return self.__getattr__(name)
    
    def __getattr__(self, name):
        return f"fallback: {name}"

obj = Both()
print(obj.real)
print(obj.missing)
"""
rust = """
struct Both {
    real: &'static str,
}

impl Both {
    fn new() -> Self {
        Both { real: "real" }
    }
    
    fn get_attribute(&self, name: &str) -> String {
        match name {
            "real" => self.real.to_string(),
            _ => self.get_attr(name),
        }
    }
    
    fn get_attr(&self, name: &str) -> String {
        format!("fallback: {}", name)
    }
}

fn main() {
    let obj = Both::new();
    log::info!("{}", obj.get_attribute("real"));
    log::info!("{}", obj.get_attribute("missing"));
}
"""

