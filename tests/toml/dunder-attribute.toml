# Dunder Attribute Tests - Attribute access magic methods
# Rust Mapping: Custom accessor methods, Deref

[metadata]
name = "Dunder Attribute Tests"
category = "dunder-methods"

# =============================================================================
# __getattr__
# =============================================================================

[[test]]
name = "dunder_getattr"
description = "def __getattr__(self, name): ... (fallback)"
python = """
class DynamicAttrs:
    def __getattr__(self, name):
        return f"Dynamic: {name}"

obj = DynamicAttrs()
print(obj.anything)
print(obj.foo)
"""
rust = """
// Rust doesn't have dynamic attribute access like Python's __getattr__
// Closest equivalent is implementing methods or using HashMap
use std::collections::HashMap;

struct DynamicAttrs {
    attrs: HashMap<String, String>,
}

impl DynamicAttrs {
    fn get_attr(&self, name: &str) -> String {
        format!("Dynamic: {}", name)
    }
}

fn main() {
    let obj = DynamicAttrs { attrs: HashMap::new() };
    log::info!("{}", obj.get_attr("anything"));
    log::info!("{}", obj.get_attr("foo"));
}
"""

[[test]]
name = "getattr_only_missing"
description = "__getattr__ only called for missing attributes"
python = """
class Obj:
    def __init__(self):
        self.real = "real value"
    
    def __getattr__(self, name):
        return f"fallback: {name}"

obj = Obj()
print(obj.real)
print(obj.missing)
"""
rust = """
struct Obj {
    real: String,
}

impl Obj {
    fn new() -> Self {
        Obj { real: "real value".to_string() }
    }
    
    fn get_attr(&self, name: &str) -> String {
        match name {
            "real" => self.real.clone(),
            _ => format!("fallback: {}", name),
        }
    }
}

fn main() {
    let obj = Obj::new();
    log::info!("{}", obj.real);
    log::info!("{}", obj.get_attr("missing"));
}
"""

[[test]]
name = "getattr_return_value"
description = "Return computed value for missing attribute"
python = """
class LazyAttrs:
    def __getattr__(self, name):
        if name.startswith("compute_"):
            return len(name)
        raise AttributeError(f"No attribute {name}")

obj = LazyAttrs()
print(obj.compute_something)
print(obj.compute_x)
"""
rust = """
struct LazyAttrs;

impl LazyAttrs {
    fn get_attr(&self, name: &str) -> Result<usize, String> {
        if name.starts_with("compute_") {
            Ok(name.len())
        } else {
            Err(format!("No attribute {}", name))
        }
    }
}

fn main() {
    let obj = LazyAttrs;
    log::info!("{}", obj.get_attr("compute_something").unwrap());
    log::info!("{}", obj.get_attr("compute_x").unwrap());
}
"""

[[test]]
name = "getattr_raise"
description = "Raise AttributeError for truly missing"
python = """
class StrictAttrs:
    def __getattr__(self, name):
        if name == "allowed":
            return "ok"
        raise AttributeError(f"'{type(self).__name__}' has no attribute '{name}'")

obj = StrictAttrs()
print(obj.allowed)
try:
    print(obj.forbidden)
except AttributeError as e:
    print(f"Error: {e}")
"""
rust = """
struct StrictAttrs;

impl StrictAttrs {
    fn get_attr(&self, name: &str) -> Result<&str, String> {
        match name {
            "allowed" => Ok("ok"),
            _ => Err(format!("'StrictAttrs' has no attribute '{}'", name)),
        }
    }
}

fn main() {
    let obj = StrictAttrs;
    log::info!("{}", obj.get_attr("allowed").unwrap());
    match obj.get_attr("forbidden") {
        Err(e) => log::info!("Error: {}", e),
        Ok(_) => {},
    }
}
"""

