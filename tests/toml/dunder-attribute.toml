[[test]]
name = "dunder_setattr"
description = "def __setattr__(self, name, value): ..."
python = """
class TrackedSets:
    def __setattr__(self, name, value):
        print(f"Setting {name} = {value}")
        object.__setattr__(self, name, value)

obj = TrackedSets()
obj.x = 10
obj.y = 20
print(obj.x, obj.y)
"""
rust = """
// Rust doesn't have dynamic setattr - use builder pattern or methods
struct TrackedSets {
    x: Option<i32>,
    y: Option<i32>,
}

impl TrackedSets {
    fn new() -> Self {
        TrackedSets { x: None, y: None }
    }
    
    fn set_attribute(&mut self, name: &str, value: i32) {
        log::info!("Setting {} = {}", name, value);
        match name {
            "x" => self.x = Some(value),
            "y" => self.y = Some(value),
            _ => {},
        }
    }
}

fn main() {
    let mut obj = TrackedSets::new();
    obj.set_attribute("x", 10);
    obj.set_attribute("y", 20);
    log::info!("{} {}", obj.x.unwrap(), obj.y.unwrap());
}
"""

