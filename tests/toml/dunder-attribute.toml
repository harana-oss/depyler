[[test]]
name = "delattr_cleanup"
description = "Perform cleanup when attribute deleted"
python = """
class Resource:
    def __init__(self):
        self.file = "opened"
    
    def __delattr__(self, name):
        if name == "file":
            print("Closing file")
        object.__delattr__(self, name)

