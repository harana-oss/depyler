[[test]]
name = "dunder_getattribute"
description = "def __getattribute__(self, name): ... (all access)"
python = """
class TrackedAttrs:
    def __init__(self):
        object.__setattr__(self, 'value', 42)
    
    def __getattribute__(self, name):
        print(f"Getting: {name}")
        return object.__getattribute__(self, name)

obj = TrackedAttrs()
print(obj.value)
"""
rust = """
// Rust doesn't have __getattribute__ - all access is explicit
struct TrackedAttrs {
    value: i32,
}

impl TrackedAttrs {
    fn new() -> Self {
        TrackedAttrs { value: 42 }
    }
    
    fn get_attribute(&self, name: &str) -> Option<i32> {
        log::info!("Getting: {}", name);
        match name {
            "value" => Some(self.value),
            _ => None,
        }
    }
}

fn main() {
    let obj = TrackedAttrs::new();
    log::info!("{}", obj.get_attribute("value").unwrap());
}
"""

[[test]]
name = "getattribute_always"
description = "__getattribute__ called for ALL attribute access"
python = """
class AllAccess:
    existing = "exists"
    
    def __getattribute__(self, name):
        print(f"Access: {name}")
        return object.__getattribute__(self, name)

obj = AllAccess()
_ = obj.existing
"""
rust = """
struct AllAccess {
    existing: &'static str,
}

impl AllAccess {
    fn new() -> Self {
        AllAccess { existing: "exists" }
    }
    
    fn get_attribute(&self, name: &str) -> Option<&str> {
        log::info!("Access: {}", name);
        match name {
            "existing" => Some(self.existing),
            _ => None,
        }
    }
}

fn main() {
    let obj = AllAccess::new();
    let _ = obj.get_attribute("existing");
}
"""

