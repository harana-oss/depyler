# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "attr_proxy"
description = "Forward attribute access to wrapped object"
python = """
class Wrapper:
    def __init__(self, obj):
        object.__setattr__(self, '_obj', obj)
    
    def __getattr__(self, name):
        return getattr(self._obj, name)

class Inner:
    value = 42

wrapper = Wrapper(Inner())
print(wrapper.value)
"""
rust = """
struct Inner {
    value: i32,
}

struct Wrapper {
    obj: Inner,
}

impl Wrapper {
    fn new(obj: Inner) -> Self {
        Wrapper { obj }
    }
}

// Rust uses Deref trait for transparent proxying
use std::ops::Deref;

impl Deref for Wrapper {
    type Target = Inner;
    
    fn deref(&self) -> &Self::Target {
        &self.obj
    }
}

fn main() {
    let inner = Inner { value: 42 };
    let wrapper = Wrapper::new(inner);
    log::info!("{}", wrapper.value);
}
"""

[[test]]
name = "dynamic_attrs"
description = "Attributes computed on access"
python = """
class Computed:
    def __getattr__(self, name):
        if name.startswith('double_'):
            n = int(name[7:])
            return n * 2
        raise AttributeError(name)

obj = Computed()
print(obj.double_5)
print(obj.double_10)
"""
rust = """
struct Computed;

impl Computed {
    fn get_attr(&self, name: &str) -> Result<i32, String> {
        if name.starts_with("double_") {
            let n: i32 = name[7..].parse().map_err(|_| "Invalid number".to_string())?;
            Ok(n * 2)
        } else {
            Err(name.to_string())
        }
    }
}

fn main() {
    let obj = Computed;
    log::info!("{}", obj.get_attr("double_5").unwrap());
    log::info!("{}", obj.get_attr("double_10").unwrap());
}
"""

[[test]]
name = "attr_logging"
description = "Log all attribute access/modification"
python = """
class Logged:
    def __init__(self):
        object.__setattr__(self, 'value', 0)
    
    def __getattribute__(self, name):
        if not name.startswith('_'):
            print(f"Get: {name}")
        return object.__getattribute__(self, name)
    
    def __setattr__(self, name, value):
        print(f"Set: {name} = {value}")
        object.__setattr__(self, name, value)

obj = Logged()
obj.value = 10
print(obj.value)
"""
rust = """
struct Logged {
    value: i32,
}

impl Logged {
    fn new() -> Self {
        Logged { value: 0 }
    }
    
    fn get_value(&self) -> i32 {
        log::info!("Get: value");
        self.value
    }
    
    fn set_value(&mut self, value: i32) {
        log::info!("Set: value = {}", value);
        self.value = value;
    }
}

fn main() {
    let mut obj = Logged::new();
    obj.set_value(10);
    log::info!("{}", obj.get_value());
}
"""

