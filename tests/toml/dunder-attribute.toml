[[test]]
name = "dunder_delattr"
description = "def __delattr__(self, name): ..."
python = """
class TrackedDel:
    def __init__(self):
        self.x = 10
    
    def __delattr__(self, name):
        print(f"Deleting {name}")
        object.__delattr__(self, name)

obj = TrackedDel()
print(obj.x)
del obj.x
try:
    print(obj.x)
except AttributeError:
    print("x was deleted")
"""
rust = """
use std::collections::HashMap;

struct TrackedDel {
    attrs: HashMap<String, i32>,
}

impl TrackedDel {
    fn new() -> Self {
        let mut attrs = HashMap::new();
        attrs.insert("x".to_string(), 10);
        TrackedDel { attrs }
    }
    
    fn delete_attr(&mut self, name: &str) {
        log::info!("Deleting {}", name);
        self.attrs.remove(name);
    }
    
    fn get_attr(&self, name: &str) -> Option<&i32> {
        self.attrs.get(name)
    }
}

fn main() {
    let mut obj = TrackedDel::new();
    log::info!("{}", obj.get_attr("x").unwrap());
    obj.delete_attr("x");
    if obj.get_attr("x").is_none() {
        log::info!("x was deleted");
    }
}
"""

