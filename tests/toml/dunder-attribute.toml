[[test]]
name = "setattr_validation"
description = "Validate values before setting"
python = """
class Validated:
    def __setattr__(self, name, value):
        if name == "age" and value < 0:
            raise ValueError("Age cannot be negative")
        object.__setattr__(self, name, value)

obj = Validated()
obj.age = 25
print(obj.age)
try:
    obj.age = -5
except ValueError as e:
    print(f"Error: {e}")
"""
rust = """
struct Validated {
    age: i32,
}

impl Validated {
    fn new() -> Self {
        Validated { age: 0 }
    }
    
    fn set_age(&mut self, age: i32) -> Result<(), String> {
        if age < 0 {
            return Err("Age cannot be negative".to_string());
        }
        self.age = age;
        Ok(())
    }
}

fn main() {
    let mut obj = Validated::new();
    obj.set_age(25).unwrap();
    log::info!("{}", obj.age);
    match obj.set_age(-5) {
        Err(e) => log::info!("Error: {}", e),
        Ok(_) => {},
    }
}
"""

