[[test]]
name = "getattr_slots"
description = "__getattr__ behavior with __slots__"
python = """
class Slotted:
    __slots__ = ['x']
    
    def __init__(self):
        self.x = 10
    
    def __getattr__(self, name):
        return f"fallback: {name}"

obj = Slotted()
print(obj.x)
print(obj.missing)
"""
rust = """
// Rust doesn't have __slots__ but structs are fixed-size by default
struct Slotted {
    x: i32,
}

impl Slotted {
    fn new() -> Self {
        Slotted { x: 10 }
    }
    
    fn get_attr(&self, name: &str) -> String {
        match name {
            "x" => self.x.to_string(),
            _ => format!("fallback: {}", name),
        }
    }
}

fn main() {
    let obj = Slotted::new();
    log::info!("{}", obj.x);
    log::info!("{}", obj.get_attr("missing"));
}
"""

[[test]]
name = "special_method_lookup"
description = "Special methods bypass __getattribute__"
python = """
class Special:
    def __getattribute__(self, name):
        print(f"Getting: {name}")
        return object.__getattribute__(self, name)
    
    def __str__(self):
        return "Special object"

obj = Special()
# __str__ is looked up on the class, not the instance
result = str(obj)
print(result)
"""
rust = """
use std::fmt;

struct Special;

impl Special {
    fn get_attribute(&self, name: &str) {
        log::info!("Getting: {}", name);
    }
}

impl fmt::Display for Special {
    fn fmt(&self, f: &mut fmt::Formatter) -> fmt::Result {
        write!(f, "Special object")
    }
}

fn main() {
    let obj = Special;
    let result = obj.to_string();
    log::info!("{}", result);
}
"""

[[test]]
name = "getattr_descriptor"
description = "__getattr__ returning a descriptor"
python = """
class Descriptor:
    def __get__(self, obj, objtype=None):
        return "descriptor value"

class Container:
    def __getattr__(self, name):
        if name == 'desc':
            return Descriptor()
        raise AttributeError(name)

obj = Container()
# Getting a descriptor from __getattr__ returns the descriptor itself
desc = obj.desc
print(type(desc).__name__)
"""
rust = """
// Rust doesn't have Python-style descriptors
// Use traits or methods instead
struct Descriptor;

impl Descriptor {
    fn get(&self) -> &str {
        "descriptor value"
    }
}

struct Container;

impl Container {
    fn get_attr(&self, name: &str) -> Option<Descriptor> {
        match name {
            "desc" => Some(Descriptor),
            _ => None,
        }
    }
}

fn main() {
    let obj = Container;
    let desc = obj.get_attr("desc").unwrap();
    log::info!("Descriptor");
}
"""
