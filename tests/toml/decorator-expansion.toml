[metadata]
name = "Decorator Expansion Tests"
category = "decorators"

# =============================================================================
# Stacked Decorators Order
# =============================================================================

[[test]]
name = "stacked_decorators_order"
description = "Stacked decorator application order"

python = '''
def add_one(f):
    def wrapper(x: int) -> int:
        return f(x) + 1
    return wrapper

def double(f):
    def wrapper(x: int) -> int:
        return f(x) * 2
    return wrapper

def compute(x: int) -> int:
    return x
'''

rust = '''
pub fn add_one<F>(f: F) -> impl Fn(i32) -> i32
where
    F: Fn(i32) -> i32,
{
    move |x: i32| -> i32 {
        return f(x) + 1;
    }
}

pub fn double<F>(f: F) -> impl Fn(i32) -> i32
where
    F: Fn(i32) -> i32,
{
    move |x: i32| -> i32 {
        return f(x) * 2;
    }
}

pub fn compute(x: i32) -> i32 {
    return x;
}
'''

