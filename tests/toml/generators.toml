[[test]]
name = "generator_simple_yield"
description = "Simple generator with single yield"

python = '''
def simple_generator():
    yield 1
'''

rust = '''
#[doc = " Generator state struct"]
#[derive(Debug)]
struct SimpleGeneratorState {
    state: usize,
}
#[doc = " Generator function - returns Iterator"]
pub fn simple_generator() -> impl Iterator<Item = i32> {
    SimpleGeneratorState { state: 0 }
}
impl Iterator for SimpleGeneratorState {
    type Item = i32;
    fn next(&mut self) -> Option<Self::Item> {
        match self.state {
            0 => {
                self.state = 1usize;
                return Some(1);
            }
            1usize => {
                self.state = 1usize + 1;
                None
            }
            _ => None,
        }
    }
}
'''

