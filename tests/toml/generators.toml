[[test]]
name = "generator_with_loop"
description = "Generator using while loop"

python = '''
def count_up(n: int):
    i = 0
    while i < n:
        yield i
        i = i + 1
'''

rust = '''
#[doc = " Generator state struct"]
#[derive(Debug)]
struct CountUpState {
    state: usize,
    i: i32,
    n: i32,
}
#[doc = " Generator function - returns Iterator"]
pub fn count_up(n: i32) -> impl Iterator<Item = i32> {
    CountUpState { state: 0, i: 0, n: n }
}
impl Iterator for CountUpState {
    type Item = i32;
    fn next(&mut self) -> Option<Self::Item> {
        match self.state {
            0 => {
                self.i = 0;
                self.state = 1;
                self.next()
            }
            1 => {
                if self.i < self.n {
                    let result = self.i;
                    self.i = self.i + 1;
                    return Some(result);
                } else {
                    self.state = 2;
                    None
                }
            }
            _ => None,
        }
    }
}
'''

