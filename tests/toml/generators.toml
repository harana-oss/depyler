[[test]]
name = "generator_with_condition"
description = "Generator with conditional yield"

python = '''
def even_numbers(n: int):
    for i in range(n):
        if i % 2 == 0:
            yield i
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = " Depyler: proven to terminate"]
#[doc = " Generator state struct"]
#[derive(Debug)]
struct EvenNumbersState {
    state: usize,
    n: i32,
}
#[doc = " Generator function - returns Iterator"]
pub fn even_numbers(n: i32) -> impl Iterator<Item = i32> {
    EvenNumbersState { state: 0, n: n }
}
impl Iterator for EvenNumbersState {
    type Item = i32;
    fn next(&mut self) -> Option<Self::Item> {
        match self.state {
            0 => {
                self.state = 1;
                for i in 0..self.n {
                    if i % 2 == 0 {
                        return Some(i);
                    }
                }
                None
            }
            _ => None,
        }
    }
}
'''

