[[test]]
name = "generator_with_start_stop"
description = "Generator with start and stop parameters"

python = '''
def range_gen(start: int, stop: int):
    i = start
    while i < stop:
        yield i
        i += 1
'''

rust = '''
use serde_json;
#[doc = " Generator state struct"]
#[derive(Debug)]
struct RangeGenState {
    state: usize,
    i: serde_json::Value,
    start: i32,
    stop: i32,
}
#[doc = " Generator function - returns Iterator"]
pub fn range_gen(start: i32, stop: i32) -> impl Iterator<Item = i32> {
    RangeGenState {
        state: 0,
        i: Default::default(),
        start: start,
        stop: stop,
    }
}
impl Iterator for RangeGenState {
    type Item = i32;
    fn next(&mut self) -> Option<Self::Item> {
        match self.state {
            0 => {
                self.i = self.start;
                self.state = 1;
                self.next()
            }
            1 => {
                if self.i < self.stop {
                    let result = self.i;
                    self.i = self.i + 1;
                    return Some(result);
                } else {
                    self.state = 2;
                    None
                }
            }
            _ => None,
        }
    }
}
'''

[[test]]
name = "generator_expression_basic"
description = "Generator expression syntax"

python = '''
def sum_squares(n: int) -> int:
    return sum(x * x for x in range(n))
'''

rust = '''
pub fn sum_squares(n: i32) -> i32 {
    return 0..n.map(|x| x * x).sum::<i32>();
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_sum_squares_examples() {
        assert_eq!(sum_squares(0), 0);
        assert_eq!(sum_squares(1), 1);
        assert_eq!(sum_squares(-1), -1);
    }
}
'''

[[test]]
name = "generator_expression_filter"
description = "Generator expression with filter"

python = '''
def sum_even_squares(n: int) -> int:
    return sum(x * x for x in range(n) if x % 2 == 0)
'''

rust = '''
pub fn sum_even_squares(n: i32) -> i32 {
    return 0..n.filter(|x| x % 2 == 0).map(|x| x * x).sum::<i32>();
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_sum_even_squares_examples() {
        assert_eq!(sum_even_squares(0), 0);
        assert_eq!(sum_even_squares(1), 1);
        assert_eq!(sum_even_squares(-1), -1);
    }
}
'''

[[test]]
name = "generator_stateful"
description = "Stateful generator tracking count"

python = '''
def counter(start: int):
    count = start
    while count < 100:
        yield count
        count += 1
'''

rust = '''
use serde_json;
#[doc = " Generator state struct"]
#[derive(Debug)]
struct CounterState {
    state: usize,
    count: serde_json::Value,
    start: i32,
}
#[doc = " Generator function - returns Iterator"]
pub fn counter(start: i32) -> impl Iterator<Item = i32> {
    CounterState {
        state: 0,
        count: Default::default(),
        start: start,
    }
}
impl Iterator for CounterState {
    type Item = i32;
    fn next(&mut self) -> Option<Self::Item> {
        match self.state {
            0 => {
                self.count = self.start;
                self.state = 1;
                self.next()
            }
            1 => {
                if self.count < 100 {
                    let result = self.count;
                    self.count = self.count + 1;
                    return Some(result);
                } else {
                    self.state = 2;
                    None
                }
            }
            _ => None,
        }
    }
}
'''

[[test]]
name = "generator_fibonacci"
description = "Fibonacci generator"

python = '''
def fibonacci(n: int):
    a, b = 0, 1
    for _ in range(n):
        yield a
        a, b = b, a + b
'''

rust = '''
#[doc = " Generator state struct"]
#[derive(Debug)]
struct FibonacciState {
    state: usize,
    n: i32,
}
#[doc = " Generator function - returns Iterator"]
pub fn fibonacci(n: i32) -> impl Iterator<Item = i32> {
    FibonacciState { state: 0, n: n }
}
impl Iterator for FibonacciState {
    type Item = i32;
    fn next(&mut self) -> Option<Self::Item> {
        match self.state {
            0 => {
                self.state = 1;
                let (mut a, mut b) = (0, 1);
                for __ in 0..self.n {
                    return Some(a);
                    (a, b) = (b, a + b);
                }
                None
            }
            _ => None,
        }
    }
}
'''

[[test]]
name = "generator_consume_list"
description = "Consume generator into list"

python = '''
def first_n(n: int) -> list[int]:
    def gen():
        for i in range(n):
            yield i
    return list(gen())
'''

rust = '''
pub fn first_n(n: i32) -> Vec<i32> {
    fn gen() -> () {
        for _i in 0..n {
            yield i;
        }
    }
    return gen().into_iter().collect::<Vec<_>>();
}
'''

