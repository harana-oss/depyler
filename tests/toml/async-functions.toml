[[test]]
name = "async_init"
description = "__init__ cannot be async"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

    @classmethod
    async def create(cls, value):
        return cls(value)

result = Example(42)
assert result.value == 42
result = True
'''

rust = '''
#[derive(Debug, Copy, Clone] pub struct Example {
    pub value: i32
}
impl Example {
    pub fn new(value: i32) -> Self {
    Self {
    value
}
} pub async fn create(value: i32) {
    return Self::new(value);
   
}
pub async fn increment(&mut self) -> i32 {
    self._simulate_delay().await;
    self.value += 1;
    return self.value.clone();
   
}
pub async fn get_value(&self) -> i32 {
    return self.value.clone();
   
}
pub async fn _simulate_delay(&self) {
    {
}
} pub async fn process(&self, data: String) -> String {
    self._async_work().await;
    return data.to_uppercase();
   
}
pub async fn _async_work(&self) {
    {
}
} }
'''

