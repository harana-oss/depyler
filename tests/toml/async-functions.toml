# =============================================================================
# Basic Async Functions
# =============================================================================

[[test]]
name = "async_def_basic"
description = "async def f(): return 42"

python = '''
import asyncio

async def f():
    return 42

result = asyncio.run(f())
'''

rust = '''
async fn f() -> i32 {
    42
}

// In Rust, would use runtime like tokio:
// let result = tokio::runtime::Runtime::new().unwrap().block_on(f());
'''


