[[test]]
name = "async_init"
description = "__init__ cannot be async"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

    @classmethod
    async def create(cls, value):
        return cls(value)

result = Example(42)
assert result.value == 42
result = True
'''

rust = '''
use serde_json;
#[derive(Debug, Clone)] pub struct Example {
    pub value: serde_json::Value
}
impl Example {
    pub fn new(value: serde_json::Value) -> Self {
    Self {
    value
}
} pub async fn create(value: serde_json::Value) {
    return Self::new(value);
   
}
pub fn _get_field(&self, name: & str) -> Option<Box<dyn std::any::Any>>{
    match name {
    "value" =>Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>), _ =>None
}
} pub fn _set_field(&mut self, name: & str, value: & dyn std::any::Any) -> bool {
    match name {
    "value" =>{
    if let Some(v) = value.downcast_ref::<serde_json::Value>() {
    self.value = v.clone();
    true
}
else {
    false
}
}, _ =>false
}
}
}
fn main () {
    let result = Example::new(42);
    assert!(result.value.clone() == 42);
    result = true;
    }
'''


