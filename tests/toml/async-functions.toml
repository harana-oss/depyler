# =============================================================================
# Return and Exceptions
# =============================================================================

[[test]]
name = "async_return"
description = "Return value obtained via await"

python = '''
import asyncio

async def f():
    return 42

async def main():
    # Return value obtained via await
    result = await f()
    print(f"Awaited result: {result}")
    return result

result = asyncio.run(main())
'''

rust = '''
pub const result: serde_json::Value = {
    main () };
    use serde_json;
    pub async fn f() -> i32 {
    return 42;
   
}
pub async fn main () -> String {
    let result = f().await;
    log::info!("{}", format!("Awaited result: {}", result));
    return result;
    }
'''


