[metadata]
name = "Async Functions Tests"
category = "async"

# =============================================================================
# Basic Async Functions
# =============================================================================

[[test]]
name = "async_def_basic"
description = "async def f(): return 42"

python = '''
import asyncio

async def f():
    return 42

result = asyncio.run(f())
'''

rust = '''
pub const result: i32 = {
    f() };
    pub async fn f() -> i32 {
    return 42;
    }
'''


