[[test]]
name = "async_closure"
description = "async function with closure over variables"

python = '''
import asyncio

async def outer():
    x = 10
    
    async def inner():
        # async function with closure over variables
        return x + 20
    
    result = await inner()
    print(f"Closure result: {result}")
    return result

result = asyncio.run(outer())
'''

rust = '''
pub const result: serde_json::Value = asyncio.run(outer());
    use serde_json;
    pub async fn outer() -> String {
    let x = 10;
    async fn inner() -> () {
    return format!("{}{}", x, 20);
   
}
let result = inner().await;
    log::info!("{}", format!("Closure result: {}", result));
    return result;
    }
'''


