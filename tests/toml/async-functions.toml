[[test]]
name = "async_closure"
description = "async function with closure over variables"

python = '''
import asyncio

async def outer():
    x = 10
    
    async def inner():
        # async function with closure over variables
        return x + 20
    
    result = await inner()
    print(f"Closure result: {result}")
    return result

result = asyncio.run(outer())
'''

rust = '''
async fn outer() -> i32 {
    let x = 10;

    async fn inner_impl(x: i32) -> i32 {
        // async function with closure over variables
        x + 20
    }

    let result = inner_impl(x).await;
    log::info!("Closure result: {}", result);
    result
}

// Would use a runtime like tokio:
// #[tokio::main]
// async fn main() {
//     let result = outer().await;
// }
'''


