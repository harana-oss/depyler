# =============================================================================
# Return and Exceptions
# =============================================================================

[[test]]
name = "async_return"
description = "Return value obtained via await"

python = '''
import asyncio

async def f():
    return 42

async def main():
    # Return value obtained via await
    result = await f()
    print(f"Awaited result: {result}")
    return result

result = asyncio.run(main())
'''

rust = '''
async fn f() -> i32 {
    42
}

async fn main_async() -> i32 {
    // Return value obtained via await
    let result = f().await;
    log::info!("Awaited result: {}", result);
    result
}

// Would use a runtime like tokio:
// #[tokio::main]
// async fn main() {
//     let result = main_async().await;
// }
'''


