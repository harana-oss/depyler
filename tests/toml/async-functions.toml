[[test]]
name = "test_async_function"
description = "Test async function support"

python = '''
# Test async function support

async def fetch_data(url: str) -> str:
    # Simulated async operation
    await async_sleep(1)
    return f"Data from {url}"

async def process_urls(urls: list[str]) -> list[str]:
    results = []
    for url in urls:
        data = await fetch_data(url)
        results.append(data)
    return results

async def async_sleep(seconds: int) -> None:
    # Placeholder for async sleep
    pass

async def main() -> None:
    urls = ["http://api.example.com", "http://api2.example.com"]
    results = await process_urls(urls)
    for result in results:
        print(result)
'''

rust = '''
#[doc = " Depyler: verified panic-free"]
#[doc = " Depyler: proven to terminate"]
pub async fn fetch_data(url: String) -> String {
    async_sleep(1).await;
    format!("Data from {:?}", url)
}
#[doc = " Depyler: verified panic-free"]
pub async fn process_urls(urls: &Vec<String>) -> Vec<String> {
    let mut results = vec![];
    for _url in urls.iter().cloned() {
        let data = fetch_data(url).await;
        results.push(data);
    }
    results
}
#[doc = " Depyler: verified panic-free"]
#[doc = " Depyler: proven to terminate"]
pub async fn async_sleep(seconds: i32) {}
#[doc = " Depyler: verified panic-free"]
pub async fn main() {
    let urls = vec![
        "http://api.example.com".to_string(),
        "http://api2.example.com".to_string(),
    ];
    let mut results = process_urls(&urls).await;
    for result in results.iter().cloned() {
        log::info!("{}", result);
    }
}
'''

[[test]]
name = "test_async_methods"
description = "Test async methods in classes"

python = '''
# Test async methods in classes

class AsyncCounter:
    def __init__(self, start: int = 0):
        self.value = start
    
    async def increment(self) -> int:
        await self._simulate_delay()
        self.value += 1
        return self.value
    
    async def get_value(self) -> int:
        return self.value
    
    async def _simulate_delay(self) -> None:
        # Simulated async operation
        pass

class AsyncDataProcessor:
    async def process(self, data: str) -> str:
        # Simulate async processing
        await self._async_work()
        return data.upper()
    
    async def _async_work(self) -> None:
        pass
'''

rust = '''
#[derive(Debug, Clone)]
pub struct AsyncCounter {
    pub value: i32,
}
impl AsyncCounter {
    pub fn new(start: i32) -> Self {
        Self { value: 0 }
    }
    pub async fn increment(&mut self) -> i32 {
        self._simulate_delay().await;
        self.value = self.value + 1;
        return self.value;
    }
    pub async fn get_value(&self) -> i32 {
        return self.value;
    }
    pub async fn _simulate_delay(&self) {
        {}
    }
}
#[derive(Debug, Clone)]
pub struct AsyncDataProcessor {}
impl AsyncDataProcessor {
    pub fn new() -> Self {
        Self {}
    }
    pub async fn process(&self, data: String) -> String {
        self._async_work().await;
        return data.to_uppercase();
    }
    pub async fn _async_work(&self) {
        {}
    }
}
'''

