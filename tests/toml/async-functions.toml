[[test]]
name = "async_init"
description = "__init__ cannot be async"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

    @classmethod
    async def create(cls, value):
        return cls(value)

result = Example(42)
assert result.value == 42
result = True
'''

rust = '''
    struct Example {
        value: i32,
    }

    impl Example {
        fn new(value: i32) -> Self {
            Self { value }
        }

        async fn create(value: i32) -> Self {
            Self::new(value)
        }
    }

    let result = Example::new(42);
    assert_eq!(result.value, 42);
    let result = true;
'''


[[test]]
name = "async_lambda"
description = "No async lambda in Python"

python = '''
# Python doesn't support async lambdas directly
# Use async def instead for async closures
async def async_closure():
    return 42

result = True
'''

rust = '''
    // Rust async blocks provide similar functionality
    // async || { } is nightly only
    // Use async fn or async blocks instead
    async fn async_closure() -> i32 {
        42
    }

    let result = true;
'''


