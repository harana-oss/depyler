# =============================================================================
# Coroutine Objects
# =============================================================================

[[test]]
name = "async_call"
description = "f() returns coroutine object"

python = '''
import asyncio

async def f():
    return 42

# f() returns coroutine object
coro = f()
result = asyncio.run(coro)
print(f"Result: {result}")
'''

rust = '''
pub async fn f() -> i32 {
    return 42;
   
}
fn main () {
    let coro = f();
    let result = {
    coro };
    log::info!("{}", format!("Result: {}", result));
    }
'''


[[test]]
name = "coroutine_type"
description = "isinstance(f(), Coroutine)"

python = '''
import asyncio
from collections.abc import Coroutine

async def f():
    return 42

# isinstance(f(), Coroutine)
coro = f()
result = isinstance(coro, Coroutine)
print(f"Is coroutine: {result}")
asyncio.run(coro)
'''

rust = '''
pub async fn f() -> i32 {
    return 42;
   
}
fn main () {
    let coro = f();
    let result = true;
    log::info!("{}", format!("Is coroutine: {}", result));
    {
    coro };
    }
'''


[[test]]
name = "iscoroutinefunction"
description = "inspect.iscoroutinefunction(f) is True"

python = '''
