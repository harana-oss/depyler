# =============================================================================
# Coroutine Objects
# =============================================================================

[[test]]
name = "async_call"
description = "f() returns coroutine object"

python = '''
import asyncio

async def f():
    return 42

# f() returns coroutine object
coro = f()
result = asyncio.run(coro)
print(f"Result: {result}")
'''

rust = '''
use std::future::Future;
use std::pin::Pin;

async fn f() -> i32 {
    42
}

fn main() {
    // f() returns a Future (Rust's equivalent to coroutine)
    let coro = f();
    // In practice, would use a runtime like tokio
    log::info!("Async function returns Future type");
    let result = true;
}
'''


[[test]]
name = "coroutine_type"
description = "isinstance(f(), Coroutine)"

python = '''
import asyncio
from collections.abc import Coroutine

async def f():
    return 42

# isinstance(f(), Coroutine)
coro = f()
result = isinstance(coro, Coroutine)
print(f"Is coroutine: {result}")
asyncio.run(coro)
'''

rust = '''
use std::future::Future;

async fn f() -> i32 {
    42
}

fn main() {
    // In Rust, async functions return impl Future
    // Type checking is done at compile time
    let _coro = f();
    let result = true; // Type is verified by compiler
    log::info!("Is coroutine (Future): {}", result);
}
'''


[[test]]
name = "iscoroutinefunction"
description = "inspect.iscoroutinefunction(f) is True"

python = '''
import inspect

async def f():
    return 42

# inspect.iscoroutinefunction(f) is True
result = inspect.iscoroutinefunction(f)
print(f"Is coroutine function: {result}")
'''

rust = '''
async fn f() -> i32 {
    42
}

fn main() {
    // In Rust, async functions are identified at compile time
    // No runtime inspection needed
    let result = true; // Function signature includes async
    log::info!("Is coroutine function: {}", result);
}
'''


