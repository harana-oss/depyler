# =============================================================================
# Async Context Manager Protocol
# =============================================================================

[[test]]
name = "aenter"
description = "async def __aenter__(self): ..."

python = '''
async def f():
    pass

result = f()  # Returns coroutine
'''

rust = '''
async fn f() {
    // Async function
}
'''


[[test]]
name = "aexit"
description = "async def __aexit__(self, exc_type, exc_val, exc_tb): ..."

python = '''
async def f():
    pass

result = f()  # Returns coroutine
'''

rust = '''
async fn f() {
    // Async function
}
'''


