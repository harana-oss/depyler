    pub fn empty(&self) -> bool {
        return self.items.len() == 0;
    }
}
#[derive(Debug, Clone)]
pub struct SimpleStack {}
impl SimpleStack {
    pub fn new() -> Self {
        Self {}
    }
    pub fn push(&self, item: i32) {
        self.items.push(item);
    }
    pub fn pop(&self) -> i32 {
        if self.items.len() == 0 {
            return -1;
        };
        return self.items.pop().unwrap_or_default();
    }
    pub fn size(&self) -> i32 {
