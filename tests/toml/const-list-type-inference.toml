[metadata]
name = "Constant List Type Inference Tests"
category = "codegen"
description = "Module-level list constants should use static arrays for primitives and Vec<T> for heap types"

[[test]]
name = "string_list_constant_type"
description = "List of string literals should be Vec<String>, not serde_json::Value"

python = '''
KICKOFF_RESULTS = ["A1KickAway", "A1Retain"]
'''

rust = '''
lazy_static::lazy_static! {
    pub static ref KICKOFF_RESULTS: Vec<String> = vec!["A1KickAway".to_string(), "A1Retain".to_string()];
}
'''

[[test]]
name = "int_list_constant_type"
description = "List of int literals should be static array [i32; N]"

python = '''
SCORES = [10, 20, 30]
'''

rust = '''
pub static SCORES: [i32; 3] = [10, 20, 30];
'''

[[test]]
name = "float_list_constant_type"
description = "List of float literals should be static array [f64; N]"

python = '''
RATES = [1.5, 2.5, 3.5]
'''

rust = '''
pub static RATES: [f64; 3] = [1.5, 2.5, 3.5];
'''

[[test]]
name = "bool_list_constant_type"
description = "List of bool literals should be static array [bool; N]"

python = '''
FLAGS = [True, False, True]
'''

rust = '''
pub static FLAGS: [bool; 3] = [true, false, true];
'''

[[test]]
name = "heterogeneous_int_string_list"
description = "List mixing ints and strings should fall back to Vec<serde_json::Value>"

python = '''
MIXED = [1, "hello", 3]
'''

rust = '''
use serde_json;
lazy_static::lazy_static! {
    pub static ref MIXED: Vec<serde_json::Value>= vec![1, "hello".to_string(), 3];
}
'''

[[test]]
name = "heterogeneous_int_float_list"
description = "List mixing ints and floats should fall back to Vec<serde_json::Value>"

python = '''
NUMS = [1, 2.5, 3]
'''

rust = '''
use serde_json;
lazy_static::lazy_static! {
    pub static ref NUMS: Vec<serde_json::Value>= vec![1, 2.5, 3];
}
'''

[[test]]
name = "homogeneous_all_ints_verified"
description = "All elements checked - list of ints uses static array [i32; N]"

python = '''
PRIMES = [2, 3, 5, 7, 11, 13]
'''

rust = '''
pub static PRIMES: [i32; 6] = [2, 3, 5, 7, 11, 13];
'''

[[test]]
name = "homogeneous_all_strings_verified"
description = "All elements checked - list of strings remains Vec<String>"

python = '''
COLORS = ["red", "green", "blue", "yellow"]
'''

rust = '''
lazy_static::lazy_static! {
    pub static ref COLORS: Vec<String> = vec![
        "red".to_string(),
        "green".to_string(),
        "blue".to_string(),
        "yellow".to_string(),
    ];
}
'''
