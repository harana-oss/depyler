'''

[test.assertions]
contains = ["*"]

[[test]]
name = "fraction_divide"
description = "Fraction division"
tags = ["fractions", "arithmetic"]

[test.python]
code = '''
from fractions import Fraction

def divide_fractions(a: Fraction, b: Fraction) -> Fraction:
