[metadata]
name = "Numeric and CSV Module Tests"
category = "stdlib-numeric"

# =============================================================================
# csv Module
# =============================================================================

[[test]]
name = "csv_reader"
description = "csv.reader() basic reading"

python = '''
import csv

def read_csv_file(filename: str) -> list:
    with open(filename, 'r') as f:
        reader = csv.reader(f)
        return list(reader)
'''

rust = '''
use csv;
use serde_json;
pub fn read_csv_file(filename: String) -> Vec<serde_json::Value> {
    let mut f = std::fs::File::open(filename)?;
    let reader = csv::Reader::from_reader(f);
    return reader
        .deserialize::<HashMap<String, String>>()
        .collect::<Vec<_>>();
}
'''

[[test]]
name = "csv_reader_delimiter"
description = "csv.reader() with delimiter"

python = '''
import csv

def read_csv_with_delimiter(filename: str, delim: str) -> list:
    with open(filename, 'r') as f:
        reader = csv.reader(f, delimiter=delim)
        return list(reader)
'''

rust = '''
use csv;
use serde_json;
pub fn read_csv_with_delimiter(filename: String, delim: String) -> Vec<serde_json::Value> {
    let mut f = std::fs::File::open(filename)?;
    let reader = csv::Reader::from_reader(f);
    return reader
        .deserialize::<HashMap<String, String>>()
        .collect::<Vec<_>>();
}
'''

[[test]]
name = "csv_writer"
description = "csv.writer() basic writing"

python = '''
import csv

def write_csv_file(filename: str, rows: list) -> None:
    with open(filename, 'w') as f:
        writer = csv.writer(f)
        writer.writerows(rows)
'''

rust = '''
use csv;
use serde_json;
pub fn write_csv_file(filename: String, rows: &Vec<serde_json::Value>) {
    let mut f = std::fs::File::create(filename)?;
    let writer = csv::Writer::from_writer(f);
    writer.writerows(rows);
}
'''

[[test]]
name = "csv_writerow"
description = "csv.writer().writerow() single row"

python = '''
import csv

def write_single_row(filename: str, row: list) -> None:
    with open(filename, 'w') as f:
        writer = csv.writer(f)
        writer.writerow(row)
'''

rust = '''
use csv;
use serde_json;
pub fn write_single_row(filename: String, row: &Vec<serde_json::Value>) {
    let mut f = std::fs::File::create(filename)?;
    let writer = csv::Writer::from_writer(f);
    writer.writerow(row);
}
'''

