[[test]]
name = "hmac_compare_digest"
description = "hmac.compare_digest() timing-safe comparison"

python = '''
import hmac

def safe_compare(a: bytes, b: bytes) -> bool:
    return hmac.compare_digest(a, b)
'''

rust = '''
pub fn safe_compare(a: &bytes, b: &bytes) -> bool {
    return {
        use subtle::ConstantTimeEq;
        a.ct_eq(b).into()
    }
'''

[[test]]
name = "hmac_compare_digest_strings"
description = "hmac.compare_digest() with strings"

python = '''
import hmac

def safe_compare_strings(a: str, b: str) -> bool:
    return hmac.compare_digest(a, b)
'''

rust = '''
pub fn safe_compare_strings(a: String, b: String) -> bool {
    return {
        use subtle::ConstantTimeEq;
        a.as_bytes().ct_eq(b.as_bytes()).into()
    }
'''

[[test]]
name = "hmac_update"
description = "hmac incremental update"

python = '''
import hmac
import hashlib

def incremental_hmac(key: bytes, msg1: bytes, msg2: bytes) -> str:
    h = hmac.new(key, digestmod=hashlib.sha256)
    h.update(msg1)
    h.update(msg2)
    return h.hexdigest()
'''

[test.assertions]
contains = ["hmac", "insert", "hex"]

