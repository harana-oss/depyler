[[test]]
name = "hmac_new_sha256"
description = "hmac.new() with SHA-256"

python = '''
import hmac
import hashlib

def create_hmac(key: bytes, msg: bytes) -> str:
    return hmac.new(key, msg, hashlib.sha256)
'''

rust = '''
use sha2 as hashlib;
pub fn create_hmac(key: &bytes, msg: &bytes) -> String {
    return {
        use hmac::{Hmac, Mac};
        use sha2::Sha256;
        type HmacSha256 = Hmac<Sha256>;
        let mut mac = HmacSha256::new_from_slice(key).expect("HMAC key error");
        mac.update(msg);
        hex::encode(mac.finalize().into_bytes())
    }
'''

[[test]]
name = "hmac_new_md5"
description = "hmac.new() with MD5"

python = '''
import hmac
import hashlib

def create_hmac_md5(key: bytes, msg: bytes) -> str:
