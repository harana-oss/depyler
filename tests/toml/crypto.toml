# =============================================================================
# hmac Module (from test_hmac_unit.rs)
# =============================================================================

[[test]]
name = "hmac_new_sha256"
description = "hmac.new() with SHA-256"
tags = ["hmac", "sha256"]

[test.python]
code = '''
import hmac
import hashlib

def create_hmac(key: bytes, msg: bytes) -> str:
    return hmac.new(key, msg, hashlib.sha256)
'''

[test.assertions]
contains_any = [["Hmac", "hmac"]]
contains_any = [["Sha256", "sha256"]]
contains = ["hex"]

[[test]]
name = "hmac_new_md5"
description = "hmac.new() with MD5"
tags = ["hmac", "md5"]

[test.python]
code = '''
import hmac
import hashlib

def create_hmac_md5(key: bytes, msg: bytes) -> str:
    return hmac.new(key, msg, hashlib.md5).hexdigest()
'''

[test.assertions]
contains_any = [["Hmac", "hmac"]]
contains_any = [["md5", "Md5"]]

[[test]]
name = "hmac_sha1"
description = "hmac.new() with SHA-1"
tags = ["hmac", "sha1"]

[test.python]
code = '''
import hmac
import hashlib

def create_hmac_sha1(key: bytes, msg: bytes) -> str:
    return hmac.new(key, msg, hashlib.sha1).hexdigest()
'''

[test.assertions]
contains_any = [["Hmac", "hmac"]]
contains_any = [["sha1", "Sha1"]]

[[test]]
name = "hmac_update"
description = "hmac incremental update"
tags = ["hmac", "update"]

[test.python]
code = '''
import hmac
import hashlib

def incremental_hmac(key: bytes, msg1: bytes, msg2: bytes) -> str:
    h = hmac.new(key, digestmod=hashlib.sha256)
    h.update(msg1)
    h.update(msg2)
    return h.hexdigest()
'''

[test.assertions]
contains = ["update"]

