[[test]]
name = "binascii_crc32"
description = "binascii.crc32() checksum"

python = '''
import binascii

def calculate_crc32(data: bytes) -> int:
    return binascii.crc32(data)
'''

rust = '''
pub fn calculate_crc32(data: &bytes) -> i32 {
    return {
        use crc32fast::Hasher;
        let mut hasher = Hasher::new();
        hasher.update(data);
        hasher.finalize() as i32
    }
'''