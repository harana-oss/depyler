[metadata]
name = "Encoding and Crypto Module Tests"
category = "stdlib-encoding"

# =============================================================================
# base64 Module
# =============================================================================

[[test]]
name = "base64_b64encode"
description = "base64.b64encode() standard encoding"

python = '''
import base64

def encode_base64(data: bytes) -> bytes:
    return base64.b64encode(data)
'''

rust = '''
use base64;
pub fn encode_base64(data: &bytes) -> bytes {
    return base64::engine::general_purpose::STANDARD.encode(data);
}
'''

[[test]]
name = "base64_b64decode"
description = "base64.b64decode() standard decoding"

python = '''
import base64

def decode_base64(data: bytes) -> bytes:
    return base64.b64decode(data)
'''

rust = '''
use base64;
pub fn decode_base64(data: &bytes) -> bytes {
    return base64::engine::general_purpose::STANDARD
        .decode(data)
        .unwrap();
}
'''

