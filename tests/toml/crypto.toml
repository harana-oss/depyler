[[test]]
name = "hashlib_md5"
description = "hashlib.md5() MD5 hash"

python = '''
import hashlib

def hash_md5(data: bytes) -> str:
    return hashlib.md5(data)
'''

rust = '''
use sha2 as hashlib;
pub fn hash_md5(data: &bytes) -> String {
    return {
        use md5::Digest;
        let mut hasher = md5::Md5::new();
        hasher.update(data);
        hex::encode(hasher.finalize())
    }
'''

