# binascii Module (from test_binascii_unit.rs)
# =============================================================================

[[test]]
name = "binascii_hexlify"
description = "binascii.hexlify() bytes to hex"
tags = ["binascii", "hex"]

[test.python]
code = '''
import binascii

def bytes_to_hex(data: bytes) -> bytes:
    return binascii.hexlify(data)
'''

[test.assertions]
contains = ["hex"]
contains_any = [["encode", "format"]]

[[test]]
name = "binascii_unhexlify"
description = "binascii.unhexlify() hex to bytes"
tags = ["binascii", "hex"]

[test.python]
code = '''
import binascii

def hex_to_bytes(hex_str: str) -> bytes:
    return binascii.unhexlify(hex_str)
'''

[test.assertions]
contains = ["hex"]
contains_any = [["decode", "from_hex"]]

