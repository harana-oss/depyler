pub fn create_hmac_md5(key: &bytes, msg: &bytes) -> String {
    return {
        use hmac::{Hmac, Mac};
        use sha2::Sha256;
        type HmacSha256 = Hmac<Sha256>;
        let mut mac = HmacSha256::new_from_slice(key).expect("HMAC key error");
        mac.update(msg);
        hex::encode(mac.finalize().into_bytes())
    }
    .hexdigest();
}
'''

