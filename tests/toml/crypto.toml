# =============================================================================
# Base32 Encoding Tests (from expr_gen.rs:5217-5253)
# Note: base64 crate doesn't support base32, would need data-encoding crate
# =============================================================================

[[test]]
name = "base64_b32encode"
description = "base64.b32encode() base32 encoding (NOTE: requires data-encoding crate)"

python = '''
import base64

def encode_base32(data: bytes) -> bytes:
    return base64.b32encode(data)
'''

rust = '''
use data_encoding;
pub fn encode_base32(data: &[u8]) -> Vec<u8> {
    return data_encoding::BASE32.encode(data).into_bytes();
}
'''

[[test]]
name = "base64_b32decode"
description = "base64.b32decode() base32 decoding (NOTE: requires data-encoding crate)"

python = '''
import base64

def decode_base32(data: bytes) -> bytes:
    return base64.b32decode(data)
'''

rust = '''
use data_encoding;
pub fn decode_base32(data: &[u8]) -> Vec<u8> {
    return data_encoding::BASE32.decode(data).unwrap();
}
'''

