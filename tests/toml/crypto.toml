[[test]]
name = "binascii_b2a_base64"
description = "binascii.b2a_base64() bytes to base64"

python = '''
import binascii

def bytes_to_base64(data: bytes) -> bytes:
    return binascii.b2a_base64(data)
'''

rust = '''
pub fn bytes_to_base64(data: &bytes) -> bytes {
    return {
        let mut result = base64::engine::general_purpose::STANDARD.encode(data);
        result.push('\n');
        result.into_bytes()
    }
'''

