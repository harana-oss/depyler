[[test]]
name = "nonlocal_chain"
description = "Nonlocal across multiple nesting levels"
python = """
def level1():
    x = 1
    
    def level2():
        nonlocal x
        x = 2
        
        def level3():
            nonlocal x
            x = 3
        
        level3()
        print(f"Level 2 sees: {x}")
    
    level2()
    print(f"Level 1 sees: {x}")

level1()
"""
rust = """
use std::cell::Cell;

fn level1() {
    let x = Cell::new(1);

    let level2 = || {
        x.set(2);

        let level3 = || {
            x.set(3);
        };

        level3();
        log::info!("Level 2 sees: {}", x.get());
    };

    level2();
    log::info!("Level 1 sees: {}", x.get());
}

fn main() {
    level1();
}
"""

# =============================================================================
# Closures with Global/Nonlocal
# =============================================================================

[[test]]
name = "closure_counter"
description = "Counter closure using nonlocal"
python = """
def make_counter():
    count = 0
    
    def increment():
        nonlocal count
        count += 1
        return count
    
    return increment

counter = make_counter()
print(f"Call 1: {counter()}")
print(f"Call 2: {counter()}")
print(f"Call 3: {counter()}")
"""
rust = """
use std::cell::Cell;
use std::rc::Rc;

fn make_counter() -> impl FnMut() -> i32 {
    let count = Rc::new(Cell::new(0));
    move || {
        let new_count = count.get() + 1;
        count.set(new_count);
        new_count
    }
}

fn main() {
    let mut counter = make_counter();
    log::info!("Call 1: {}", counter());
    log::info!("Call 2: {}", counter());
    log::info!("Call 3: {}", counter());
}
"""

[[test]]
name = "closure_factory"
description = "Function returning closure with nonlocal state"
python = """
def make_adder(n):
    def adder(x):
        return x + n
    return adder

add5 = make_adder(5)
add10 = make_adder(10)

print(f"add5(3) = {add5(3)}")
print(f"add10(3) = {add10(3)}")
"""
rust = """
fn make_adder(n: i32) -> impl Fn(i32) -> i32 {
    move |x| x + n
}

fn main() {
    let add5 = make_adder(5);
    let add10 = make_adder(10);

    log::info!("add5(3) = {}", add5(3));
    log::info!("add10(3) = {}", add10(3));
}
"""

[[test]]
name = "closures_shared_state"
description = "Multiple closures from same factory"
python = """
def make_account(initial):
    balance = initial
    
    def deposit(amount):
        nonlocal balance
        balance += amount
        return balance
    
    def withdraw(amount):
        nonlocal balance
        balance -= amount
        return balance
    
    return deposit, withdraw

deposit, withdraw = make_account(100)
print(f"Initial balance after deposit(50): {deposit(50)}")
print(f"Balance after withdraw(30): {withdraw(30)}")
print(f"Balance after deposit(20): {deposit(20)}")
"""
rust = """
use std::cell::Cell;
use std::rc::Rc;

fn make_account(initial: i32) -> (impl FnMut(i32) -> i32, impl FnMut(i32) -> i32) {
    let balance = Rc::new(Cell::new(initial));
    let balance2 = balance.clone();

    let deposit = move |amount: i32| {
        let new_balance = balance.get() + amount;
        balance.set(new_balance);
        new_balance
    };

    let withdraw = move |amount: i32| {
        let new_balance = balance2.get() - amount;
        balance2.set(new_balance);
        new_balance
    };

    (deposit, withdraw)
}

fn main() {
    let (mut deposit, mut withdraw) = make_account(100);
    log::info!("Initial balance after deposit(50): {}", deposit(50));
    log::info!("Balance after withdraw(30): {}", withdraw(30));
    log::info!("Balance after deposit(20): {}", deposit(20));
}
"""

