[metadata]
name = "Global and Nonlocal Tests"
category = "core-language"

# =============================================================================
# Global Statement
# =============================================================================

[[test]]
name = "global_basic"
description = "global x; x = value"
python = """
x = 10

def modify():
    global x
    x = 20

print(f"Before: {x}")
modify()
print(f"After: {x}")
"""
rust = """
use std::cell::Cell;

thread_local! {
    static X: Cell<i32> = Cell::new(10);
}

fn modify() {
    X.with(|x| x.set(20));
}

fn main() {
    log::info!("Before: {}", X.with(|x| x.get()));
    modify();
    log::info!("After: {}", X.with(|x| x.get()));
}
"""

[[test]]
name = "global_read"
description = "Read global variable inside function"
python = """
x = 42

def read_global():
    return x

result = read_global()
print(f"Global value: {result}")
"""
rust = """
const X: i32 = 42;

fn read_global() -> i32 {
    X
}

fn main() {
    let result = read_global();
    log::info!("Global value: {}", result);
}
"""

[[test]]
name = "global_write"
description = "Modify global variable inside function"
python = """
counter = 0

def increment():
    global counter
    counter += 1

print(f"Initial: {counter}")
increment()
increment()
print(f"After increments: {counter}")
"""
rust = """
use std::sync::atomic::{AtomicI32, Ordering};

static COUNTER: AtomicI32 = AtomicI32::new(0);

fn increment() {
    COUNTER.fetch_add(1, Ordering::SeqCst);
}

fn main() {
    log::info!("Initial: {}", COUNTER.load(Ordering::SeqCst));
    increment();
    increment();
    log::info!("After increments: {}", COUNTER.load(Ordering::SeqCst));
}
"""

[[test]]
name = "global_multiple"
description = "global a, b, c"
python = """
a, b, c = 1, 2, 3

def modify_all():
    global a, b, c
    a = 10
    b = 20
    c = 30

print(f"Before: {a}, {b}, {c}")
modify_all()
print(f"After: {a}, {b}, {c}")
"""
rust = """
use std::cell::Cell;

thread_local! {
    static A: Cell<i32> = Cell::new(1);
    static B: Cell<i32> = Cell::new(2);
    static C: Cell<i32> = Cell::new(3);
}

fn modify_all() {
    A.with(|a| a.set(10));
    B.with(|b| b.set(20));
    C.with(|c| c.set(30));
}

fn main() {
    log::info!(
        "Before: {}, {}, {}",
        A.with(|a| a.get()),
        B.with(|b| b.get()),
        C.with(|c| c.get())
    );
    modify_all();
    log::info!(
        "After: {}, {}, {}",
        A.with(|a| a.get()),
        B.with(|b| b.get()),
        C.with(|c| c.get())
    );
}
"""

[[test]]
name = "global_nested"
description = "Global in nested function skips enclosing scope"
python = """
x = 100

def outer():
    x = 50  # Local to outer
    
    def inner():
        global x  # Refers to global, not outer's x
        x = 200
    
    inner()
    print(f"Outer's x: {x}")

outer()
print(f"Global x: {x}")
"""
rust = """
use std::cell::Cell;

thread_local! {
    static X: Cell<i32> = Cell::new(100);
}

fn outer() {
    let x = 50; // Local to outer

    fn inner() {
        X.with(|x| x.set(200));
    }

    inner();
    log::info!("Outer's x: {}", x);
}

fn main() {
    outer();
    log::info!("Global x: {}", X.with(|x| x.get()));
}
"""

# =============================================================================
# Nonlocal Statement
# =============================================================================

[[test]]
name = "nonlocal_basic"
description = "nonlocal x in nested function"
python = """
def outer():
    x = 10
    
    def inner():
        nonlocal x
        x = 20
    
    print(f"Before: {x}")
    inner()
    print(f"After: {x}")

outer()
"""
rust = """
use std::cell::Cell;

fn outer() {
    let x = Cell::new(10);

    let inner = || {
        x.set(20);
    };

    log::info!("Before: {}", x.get());
    inner();
    log::info!("After: {}", x.get());
}

fn main() {
    outer();
}
"""

[[test]]
name = "nonlocal_read"
description = "Read enclosing scope variable"
python = """
def outer():
    x = 42
    
    def inner():
        return x  # Implicitly reads enclosing scope
    
    result = inner()
    print(f"Value: {result}")

outer()
"""
rust = """
fn outer() {
    let x = 42;

    let inner = || {
        x // Captures x from enclosing scope
    };

    let result = inner();
    log::info!("Value: {}", result);
}

fn main() {
    outer();
}
"""

[[test]]
name = "nonlocal_write"
description = "Modify enclosing scope variable"
python = """
def counter():
    count = 0
    
    def increment():
        nonlocal count
        count += 1
        return count
    
    print(f"Count 1: {increment()}")
    print(f"Count 2: {increment()}")
