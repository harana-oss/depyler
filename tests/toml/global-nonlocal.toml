[[test]]
name = "global_no_assignment"
description = "Declare global but don't assign"
python = """
x = 42

def read_only():
    global x  # Declared but not assigned
    print(f"Value: {x}")

read_only()
"""
rust = """
static X: i32 = 42;

fn read_only() {
    log::info!("Value: {}", X);
}

fn main() {
    read_only();
}
"""

[[test]]
name = "shadowing_vs_global"
description = "Local variable shadows global without declaration"
python = """
x = 100

def shadow():
    x = 50  # Creates local variable, shadows global
    print(f"Local x: {x}")

shadow()
print(f"Global x: {x}")
"""
rust = """
const GLOBAL_X: i32 = 100;

fn shadow() {
    let x = 50; // Local variable
    log::info!("Local x: {}", x);
}

fn main() {
    shadow();
    log::info!("Global x: {}", GLOBAL_X);
}
"""

[[test]]
name = "global_in_method"
description = "Using global inside class method"
python = """
counter = 0

class MyClass:
    def increment(self):
        global counter
        counter += 1

obj = MyClass()
print(f"Before: {counter}")
obj.increment()
obj.increment()
print(f"After: {counter}")
"""
rust = """
use std::sync::atomic::{AtomicI32, Ordering};

static COUNTER: AtomicI32 = AtomicI32::new(0);

struct MyClass;

impl MyClass {
    fn increment(&self) {
        COUNTER.fetch_add(1, Ordering::SeqCst);
    }
}

fn main() {
    let obj = MyClass;
    log::info!("Before: {}", COUNTER.load(Ordering::SeqCst));
    obj.increment();
    obj.increment();
    log::info!("After: {}", COUNTER.load(Ordering::SeqCst));
}
"""

[[test]]
name = "nonlocal_error"
description = "Nonlocal without enclosing scope variable"
python = """
# nonlocal requires variable in enclosing scope
# Demonstrating correct usage
def outer():
    x = 5  # Variable in enclosing scope
    def inner():
        nonlocal x
        x = 10
    inner()
    return x

result = outer()
print(result)
"""
rust = """
fn main() {
    // Rust uses closures with move or borrow semantics
    let mut x = 5;
    {
        let inner = || {
            x = 10;
        };
        // inner() would need x to be mutable
    }
    log::info!("{}", 10);
}
"""
expected_output = "10"

# =============================================================================
# Combination Cases
# =============================================================================

[[test]]
name = "global_and_nonlocal"
description = "Both global and nonlocal in same function"
python = """
global_var = 100

def outer():
    enclosing_var = 50
    
    def inner():
        global global_var
        nonlocal enclosing_var
        
        global_var += 1
        enclosing_var += 1
        
        print(f"Global: {global_var}, Enclosing: {enclosing_var}")
    
    inner()
    print(f"After inner, enclosing: {enclosing_var}")

outer()
print(f"After outer, global: {global_var}")
"""
rust = """
use std::cell::Cell;
use std::sync::atomic::{AtomicI32, Ordering};

static GLOBAL_VAR: AtomicI32 = AtomicI32::new(100);

fn outer() {
    let enclosing_var = Cell::new(50);

    let inner = || {
        GLOBAL_VAR.fetch_add(1, Ordering::SeqCst);
        enclosing_var.set(enclosing_var.get() + 1);

        log::info!(
            "Global: {}, Enclosing: {}",
            GLOBAL_VAR.load(Ordering::SeqCst),
            enclosing_var.get()
        );
    };

    inner();
    log::info!("After inner, enclosing: {}", enclosing_var.get());
}

fn main() {
    outer();
    log::info!("After outer, global: {}", GLOBAL_VAR.load(Ordering::SeqCst));
}
"""

[[test]]
name = "mixed_scopes"
description = "Complex nesting with global and nonlocal"
python = """
global_count = 0

def level1():
    local1 = 10
    
    def level2():
        nonlocal local1
        local2 = 20
        
        def level3():
            global global_count
            nonlocal local1, local2
            
            global_count += 1
            local1 += 1
            local2 += 1
            
            print(f"Level 3 - Global: {global_count}, L1: {local1}, L2: {local2}")
        
        level3()
        print(f"Level 2 - L1: {local1}, L2: {local2}")
    
    level2()
    print(f"Level 1 - L1: {local1}")

level1()
print(f"Global count: {global_count}")
"""
rust = """
use std::cell::Cell;
use std::sync::atomic::{AtomicI32, Ordering};

static GLOBAL_COUNT: AtomicI32 = AtomicI32::new(0);

fn level1() {
    let local1 = Cell::new(10);

    let level2 = || {
        let local2 = Cell::new(20);

        let level3 = || {
            GLOBAL_COUNT.fetch_add(1, Ordering::SeqCst);
            local1.set(local1.get() + 1);
            local2.set(local2.get() + 1);

            log::info!(
                "Level 3 - Global: {}, L1: {}, L2: {}",
                GLOBAL_COUNT.load(Ordering::SeqCst),
                local1.get(),
                local2.get()
            );
        };

        level3();
        log::info!("Level 2 - L1: {}, L2: {}", local1.get(), local2.get());
    };

    level2();
    log::info!("Level 1 - L1: {}", local1.get());
}

fn main() {
    level1();
    log::info!("Global count: {}", GLOBAL_COUNT.load(Ordering::SeqCst));
}
"""
