[[test]]
name = "abc_subclasshook"
description = "Custom isinstance/issubclass logic"

python = '''
from abc import ABC

class MyABC(ABC):
    @classmethod
    def __subclasshook__(cls, C):
        if hasattr(C, 'special_method'):
            return True
        return NotImplemented

class HasMethod:
    def special_method(self):
        pass

def test_abc_subclasshook() -> bool:
    return issubclass(HasMethod, MyABC)
'''

rust = '''
// Rust doesn't have dynamic subclass hooks
// This is a conceptual approximation
trait MyABC {}
struct HasMethod;

fn test_abc_subclasshook() -> bool {
    true
}
'''


# =============================================================================
# ABC with Multiple Inheritance
# =============================================================================

[[test]]
name = "abc_multiple"
description = "class Concrete(ABC1, ABC2): ..."

python = '''
from abc import ABC, abstractmethod

class ABC1(ABC):
    @abstractmethod
    def method1(self) -> int:
        pass

class ABC2(ABC):
    @abstractmethod
    def method2(self) -> int:
        pass

class Concrete(ABC1, ABC2):
    def method1(self) -> int:
        return 10
    def method2(self) -> int:
        return 20

def test_abc_multiple() -> int:
    obj = Concrete()
    return obj.method1() + obj.method2()
'''

rust = '''
trait ABC1 {
    fn method1(&self) -> i32;
}

trait ABC2 {
    fn method2(&self) -> i32;
}

struct Concrete;

impl ABC1 for Concrete {
    fn method1(&self) -> i32 {
        10
    }
}

impl ABC2 for Concrete {
    fn method2(&self) -> i32 {
        20
    }
}

fn test_abc_multiple() -> i32 {
    let obj = Concrete;
    obj.method1() + obj.method2()
}
'''


[[test]]
name = "abc_mixin"
description = "ABC as mixin with partial implementation"

python = '''
from abc import ABC, abstractmethod

class Mixin(ABC):
    @abstractmethod
    def get_value(self) -> int:
        pass
    
    def double_value(self) -> int:
        return self.get_value() * 2

class Concrete(Mixin):
    def get_value(self) -> int:
        return 15

def test_abc_mixin() -> int:
    obj = Concrete()
    return obj.double_value()
'''

rust = '''
trait Mixin {
    fn get_value(&self) -> i32;
    
    fn double_value(&self) -> i32 {
        self.get_value() * 2
    }
}

struct Concrete;

impl Mixin for Concrete {
    fn get_value(&self) -> i32 {
        15
    }
}

fn test_abc_mixin() -> i32 {
    let obj = Concrete;
    obj.double_value()
}
'''


# =============================================================================
# Standard Library ABCs
# =============================================================================

[[test]]
name = "collections_abc"
description = "Iterable, Iterator, Sequence, Mapping, etc."

python = '''
from collections.abc import Iterable

class MyIterable(Iterable):
    def __iter__(self):
        return iter([1, 2, 3])

def test_collections_abc() -> int:
    obj = MyIterable()
    return sum(obj)
'''

rust = '''
struct MyIterable;

impl IntoIterator for MyIterable {
    type Item = i32;
    type IntoIter = std::vec::IntoIter<i32>;
    
    fn into_iter(self) -> Self::IntoIter {
        vec![1, 2, 3].into_iter()
    }
}

fn test_collections_abc() -> i32 {
    let obj = MyIterable;
    obj.into_iter().sum()
}
'''


[[test]]
name = "numbers_abc"
description = "Number, Complex, Real, Rational, Integral"

python = '''
from numbers import Integral

class MyInt(Integral):
    def __init__(self, value):
        self._value = value
    
    def __int__(self):
        return self._value
    
    # Minimal required methods for Integral
    def __abs__(self):
        return MyInt(abs(self._value))
    
    def __add__(self, other):
        return MyInt(self._value + int(other))
    
    def __radd__(self, other):
        return MyInt(int(other) + self._value)
    
    def __mul__(self, other):
        return MyInt(self._value * int(other))
    
    def __rmul__(self, other):
        return MyInt(int(other) * self._value)
    
    def __eq__(self, other):
        return self._value == int(other)
    
    def __lt__(self, other):
        return self._value < int(other)

def test_numbers_abc() -> int:
    num = MyInt(42)
    return int(num)
'''

rust = '''
trait Integral {
    fn to_int(&self) -> i32;
}

struct MyInt {
    value: i32,
}

impl Integral for MyInt {
    fn to_int(&self) -> i32 {
        self.value
    }
}

fn test_numbers_abc() -> i32 {
    let num = MyInt { value: 42 };
    num.to_int()
}
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "abc_partial"
description = "Subclass implements some but not all abstract methods"

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def method1(self):
        pass
    
    @abstractmethod
    def method2(self):
        pass

class Partial(Base):
    def method1(self):
        return 1
    # method2 not implemented

def test_abc_partial() -> bool:
    try:
        Partial()
        return False
    except TypeError:
        return True
'''

rust = '''
// Rust requires all trait methods to be implemented
trait Base {
    fn method1(&self) -> i32;
    fn method2(&self) -> i32;
}

fn test_abc_partial() -> bool {
    true
}
'''


[[test]]
name = "abstractmethod_varargs"
description = "Abstract method with flexible signature"

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def process(self, *args, **kwargs) -> int:
        pass

class Concrete(Base):
    def process(self, *args, **kwargs) -> int:
        return sum(args) + len(kwargs)

def test_abstractmethod_varargs() -> int:
    obj = Concrete()
    return obj.process(1, 2, 3, x=4, y=5)
'''

rust = '''
trait Base {
    fn process(&self, args: Vec<i32>) -> i32;
}

struct Concrete;

impl Base for Concrete {
    fn process(&self, args: Vec<i32>) -> i32 {
        args.iter().sum()
    }
}

fn test_abstractmethod_varargs() -> i32 {
    let obj = Concrete;
    obj.process(vec![1, 2, 3])
}
'''


[[test]]
name = "abstract_init"
description = "@abstractmethod on __init__"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __abs__(self):
        return Number(abs(self.value))

n = Number(-5)
result = abs(n).value
'''

rust = '''
struct Number { value: i32 }
impl Number {
    fn abs(self) -> Number {
        Number { value: self.value.abs() }
    }
}
'''

