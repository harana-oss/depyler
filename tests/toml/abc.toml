[[test]]
name = "abc_subclasshook"
description = "Custom isinstance/issubclass logic"

python = '''
from abc import ABC

class MyABC(ABC):
    @classmethod
    def __subclasshook__(cls, C):
        if hasattr(C, 'special_method'):
            return True
        return NotImplemented

class HasMethod:
    def special_method(self):
        pass

def test_abc_subclasshook() -> bool:
    return issubclass(HasMethod, MyABC)
'''

rust = '''
trait MyABC {}
#[derive(Debug, Copy, Clone)]
pub struct HasMethod {}
impl HasMethod {
    pub fn new() -> Self {
        Self {}
    }
    pub fn special_method(&self) {
        {}
    }
}
pub fn test_abc_subclasshook() -> bool {
    return issubclass(HasMethod, MyABC);
}
'''


# =============================================================================
# ABC with Multiple Inheritance
# =============================================================================

[[test]]
name = "abc_multiple"
description = "class Concrete(ABC1, ABC2): ..."

python = '''
from abc import ABC, abstractmethod

class ABC1(ABC):
    @abstractmethod
    def method1(self) -> int:
        pass

class ABC2(ABC):
    @abstractmethod
    def method2(self) -> int:
        pass

class Concrete(ABC1, ABC2):
    def method1(self) -> int:
        return 10
    def method2(self) -> int:
        return 20

def test_abc_multiple() -> int:
    obj = Concrete()
    return obj.method1() + obj.method2()
'''

rust = '''
trait ABC1 {
    fn method1(&self) -> i32;
}
trait ABC2 {
    fn method2(&self) -> i32;
}
#[derive(Debug, Copy, Clone)]
pub struct Concrete {}
impl Concrete {
    pub fn new() -> Self {
        Self {}
    }
    pub fn method1(&self) -> i32 {
        return 10;
    }
    pub fn method2(&self) -> i32 {
        return 20;
    }
}
pub fn test_abc_multiple() -> i32 {
    let obj = Concrete::new();
    return obj.method1() + obj.method2();
}
'''


[[test]]
name = "abc_mixin"
description = "ABC as mixin with partial implementation"

python = '''
from abc import ABC, abstractmethod

class Mixin(ABC):
    @abstractmethod
    def get_value(self) -> int:
        pass
    
    def double_value(self) -> int:
        return self.get_value() * 2

class Concrete(Mixin):
    def get_value(self) -> int:
        return 15

def test_abc_mixin() -> int:
    obj = Concrete()
    return obj.double_value()
'''

rust = '''
