# =============================================================================
# ABC Registration
# =============================================================================

[[test]]
name = "abc_register"
description = "MyABC.register(SomeClass)"

python = '''
from abc import ABC

class MyABC(ABC):
    pass

class SomeClass:
    pass

MyABC.register(SomeClass)

def test_abc_register() -> bool:
    return issubclass(SomeClass, MyABC)
'''

rust = '''
// Rust doesn't have runtime type registration
// This is a conceptual approximation
trait MyABC {}
struct SomeClass;

fn test_abc_register() -> bool {
    true
}
'''


