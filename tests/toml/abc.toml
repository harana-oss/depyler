[[test]]
name = "abc_register"
description = "MyABC.register(SomeClass)"

python = '''
from abc import ABC

class MyABC(ABC):
    pass

class SomeClass:
    pass

MyABC.register(SomeClass)

def test_abc_register() -> bool:
    return issubclass(SomeClass, MyABC)
'''

rust = '''
trait MyABC {}
#[derive(Debug, Copy, Clone)]
pub struct SomeClass {}
impl SomeClass {
    pub fn new() -> Self {
        Self {}
    }
}
pub fn test_abc_register() -> bool {
    return issubclass(SomeClass, MyABC);
}
fn main() {
    MyABC::register(SomeClass);
}
'''


