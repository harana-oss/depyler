[[test]]
name = "abstractmethod_with_impl"
description = "Abstract method can have default implementation"

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def method(self) -> int:
        return 10

class Concrete(Base):
    def method(self) -> int:
        return super().method() * 2

def test_abstractmethod_with_impl() -> int:
    obj = Concrete()
    return obj.method()
'''

rust = '''
trait Base {
    fn method(&self) -> i32 {
        return 10;
    }
}
#[derive(Debug, Copy, Clone)]
pub struct Concrete {}
impl Concrete {
    pub fn new() -> Self {
        Self {}
    }
}
impl Base for Concrete {
    fn method(&self) -> i32 {
        return <Self as Base>::method(self) * 2;
    }
}
pub fn test_abstractmethod_with_impl() -> i32 {
    let obj = Concrete::new();
    return obj.method();
}
'''


