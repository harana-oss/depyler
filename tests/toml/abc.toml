'''


[[test]]
name = "abstractmethod_super"
description = "Subclass can call super().method()"

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def compute(self) -> int:
        return 5

class Derived(Base):
    def compute(self) -> int:
        return super().compute() + 10

def test_abstractmethod_super() -> int:
    obj = Derived()
    return obj.compute()
'''

rust = '''
trait Base {
    fn compute(&self) -> i32 {
        5
    }
}

struct Derived;

impl Base for Derived {
    fn compute(&self) -> i32 {
        15
    }
}

fn test_abstractmethod_super() -> i32 {
    let obj = Derived;
    obj.compute()
}
'''


