[metadata]
name = "Abstract Base Class Tests"
category = "advanced-oop"

# =============================================================================
# Basic ABC
# =============================================================================

[[test]]
name = "abc_basic"
description = "from abc import ABC; class MyABC(ABC): ..."

python = '''
from abc import ABC

class MyABC(ABC):
    pass

def test_abc_basic() -> bool:
    return isinstance(MyABC, type)
'''

rust = '''
trait MyABC {}

fn test_abc_basic() -> bool {
    true
}
'''


[[test]]
name = "abc_meta"
description = "class MyABC(metaclass=ABCMeta): ..."

python = '''
from abc import ABCMeta

class MyABC(metaclass=ABCMeta):
    pass

def test_abc_meta() -> bool:
    return isinstance(MyABC, type)
'''

rust = '''
trait MyABC {}

fn test_abc_meta() -> bool {
    true
}
'''


[[test]]
name = "abc_no_instantiate"
description = "TypeError when instantiating ABC with abstract methods"

python = '''
from abc import ABC, abstractmethod

class MyABC(ABC):
    @abstractmethod
    def method(self):
        pass

def test_abc_no_instantiate() -> bool:
    try:
        MyABC()
        return False
    except TypeError:
        return True
'''

rust = '''
// Rust traits cannot be instantiated directly
trait MyABC {
    fn method(&self);
}

fn test_abc_no_instantiate() -> bool {
    true
}
'''


# =============================================================================
# @abstractmethod
# =============================================================================

[[test]]
name = "abstractmethod_basic"
description = "@abstractmethod def method(self): ..."

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def method(self) -> int:
        pass

class Concrete(Base):
    def method(self) -> int:
        return 42

def test_abstractmethod_basic() -> int:
    obj = Concrete()
    return obj.method()
'''

rust = '''
trait Base {
    fn method(&self) -> i32;
}

struct Concrete;

impl Base for Concrete {
    fn method(&self) -> i32 {
        42
    }
}

fn test_abstractmethod_basic() -> i32 {
    let obj = Concrete;
    obj.method()
}
'''


