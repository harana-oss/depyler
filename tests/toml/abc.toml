[[test]]
name = "abc_no_instantiate"
description = "TypeError when instantiating ABC with abstract methods"

python = '''
from abc import ABC, abstractmethod

class MyABC(ABC):
    @abstractmethod
    def method(self):
        pass

def test_abc_no_instantiate() -> bool:
    try:
        MyABC()
        return False
    except TypeError:
        return True
'''

rust = '''
trait MyABC {
    fn method(&self) -> ();
}
pub fn test_abc_no_instantiate() -> bool {
    {
        MyABC::new();
        return false;
        return true;
    }
}
'''


# =============================================================================
# @abstractmethod
# =============================================================================

[[test]]
name = "abstractmethod_basic"
description = "@abstractmethod def method(self): ..."

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def method(self) -> int:
        pass

class Concrete(Base):
    def method(self) -> int:
        return 42

def test_abstractmethod_basic() -> int:
    obj = Concrete()
    return obj.method()
'''

rust = '''
trait Base {
    fn method(&self) -> i32;
}
#[derive(Debug, Copy, Clone)]
pub struct Concrete {}
impl Concrete {
    pub fn new() -> Self {
        Self {}
    }
    pub fn method(&self) -> i32 {
        return 42;
    }
}
pub fn test_abstractmethod_basic() -> i32 {
    let obj = Concrete::new();
    return obj.method();
}
'''


