[[test]]
name = "numbers_abc"
description = "Number, Complex, Real, Rational, Integral"

python = '''
from numbers import Integral

class MyInt(Integral):
    def __init__(self, value):
        self._value = value
    
    def __int__(self):
        return self._value
    
    # Minimal required methods for Integral
    def __abs__(self):
        return MyInt(abs(self._value))
    
    def __add__(self, other):
        return MyInt(self._value + int(other))
    
    def __radd__(self, other):
        return MyInt(int(other) + self._value)
    
    def __mul__(self, other):
        return MyInt(self._value * int(other))
    
    def __rmul__(self, other):
        return MyInt(int(other) * self._value)
    
    def __eq__(self, other):
        return self._value == int(other)
    
    def __lt__(self, other):
        return self._value < int(other)

def test_numbers_abc() -> int:
    num = MyInt(42)
    return int(num)
'''

rust = '''
use serde_json;
#[derive(Debug, Clone)]
pub struct MyInt {
    pub _value: serde_json::Value,
}
impl MyInt {
    pub fn new(value: serde_json::Value) -> Self {
        Self { _value: value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "_value" => Some(Box::new(self._value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "_value" => {
                if let Some(v) = value.downcast_ref::<serde_json::Value>() {
                    self._value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn test_numbers_abc() -> i32 {
    let num = MyInt::new(42);
    return (num) as i32;
}
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "abc_partial"
description = "Subclass implements some but not all abstract methods"

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def method1(self):
        pass
    
    @abstractmethod
    def method2(self):
        pass

class Partial(Base):
    def method1(self):
        return 1
    # method2 not implemented

def test_abc_partial() -> bool:
    try:
        Partial()
        return False
    except TypeError:
        return True
'''

rust = '''
trait Base {
    fn method1(&self) -> ();
    fn method2(&self) -> ();
}
#[derive(Debug, Copy, Clone)]
pub struct Partial {}
impl Partial {
    pub fn new() -> Self {
        Self {}
    }
    pub fn method1(&self) -> i32 {
        return 1;
    }
}
pub fn test_abc_partial() -> bool {
    {
        Partial::new();
        return false;
        return true;
    }
}
'''


[[test]]
name = "abstractmethod_varargs"
description = "Abstract method with flexible signature"

python = '''
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def process(self, *args, **kwargs) -> int:
        pass

class Concrete(Base):
    def process(self, *args, **kwargs) -> int:
        return sum(args) + len(kwargs)

def test_abstractmethod_varargs() -> int:
    obj = Concrete()
    return obj.process(1, 2, 3, x=4, y=5)
'''

rust = '''
trait Base {
    fn process(&self) -> i32;
}
#[derive(Debug, Copy, Clone)]
pub struct Concrete {}
impl Concrete {
    pub fn new() -> Self {
        Self {}
    }
    pub fn process(&self) -> i32 {
        return sum(args) + kwargs.len();
    }
}
pub fn test_abstractmethod_varargs() -> i32 {
    let obj = Concrete::new();
    return obj.process();
}
'''


[[test]]
name = "abstract_init"
