[metadata]
name = "Dataclasses Comparison Tests"
category = "data-structures"

# =============================================================================
# Equality (Default)
# =============================================================================

[[test]]
name = "dataclass_eq_default"
description = "@dataclass auto-generates __eq__"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

result = Point(1, 2)
'''

rust = '''
#[derive(Debug)]
struct Point {
    x: i32,
    y: i32,
}
'''


[[test]]
name = "dataclass_equal"
description = "Point(1, 2) == Point(1, 2)"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

result = Point(1, 2) == Point(1, 2)
'''

rust = '''
#[derive(Debug, PartialEq)]
struct Point {
    x: i32,
    y: i32,
}

let result = Point { x: 1, y: 2 } == Point { x: 1, y: 2 };
'''


[[test]]
name = "dataclass_not_equal"
description = "Point(1, 2) != Point(1, 3)"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

result = Point(1, 2) != Point(1, 3)
'''

rust = '''
#[derive(Debug, PartialEq)]
struct Point {
    x: i32,
    y: i32,
}

let result = Point { x: 1, y: 2 } != Point { x: 1, y: 3 };
'''


[[test]]
name = "dataclass_eq_types"
description = "Point(1, 2) != (1, 2)"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

result = Point(1, 2) != (1, 2)
'''

rust = '''
#[derive(Debug, PartialEq)]
struct Point {
    x: i32,
    y: i32,
}

// Different types can't be compared in Rust
let result = true;
'''


