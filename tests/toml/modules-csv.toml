[[test]]
name = "csv_filtering"
description = "Filter CSV rows by column value"

python = '''
import csv

def filter_csv(filepath: str, column: str, value: str) -> list:
    with open(filepath) as f:
        reader = csv.DictReader(f)
        results = []
        for row in reader:
            if row[column] == value:
                results.append(row)
        return results
'''

rust = '''
use csv;
use serde_json;
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn filter_csv(filepath: String, column: String, value: String) -> Vec<serde_json::Value> {
    let mut f = std::fs::File::open(filepath)?;
    let reader = csv::ReaderBuilder::new().has_headers(true).from_reader(f);
    let results = vec![];
    for result in reader.deserialize::<HashMap<String, String>>() {
        let row = result?;
        if row.get(&column).cloned().unwrap() == value {
            results.push(row);
        }
    }
    return results;
}
'''

[[test]]
name = "csv_comprehension"
description = "CSV filtering with list comprehension"

python = '''
import csv

def filter_csv_generator(filepath: str, column: str, value: str) -> list:
    with open(filepath) as f:
        reader = csv.DictReader(f)
        filtered = [row for row in reader if row[column] == value]
        return filtered
'''

rust = '''
use csv;
use serde_json;
pub fn filter_csv_generator(filepath: String, column: String, value: String) -> Vec<serde_json::Value> {
    let mut f = std::fs::File::open(filepath)?;
    let reader = csv::ReaderBuilder::new().has_headers(true).from_reader(f);
    let filtered = reader
        .deserialize::<std::collections::HashMap<String, String>>()
        .filter_map(|result| result.ok())
        .filter(|row| row.get(&column).cloned().unwrap() == value)
        .map(|row| row)
        .collect::<Vec<_>>();
    return filtered;
}
'''

[[test]]
