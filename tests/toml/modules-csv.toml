[[test]]
name = "csv_dictwriter_multiple_rows"
description = "csv.DictWriter writing multiple rows"

python = '''
import csv

def write_multiple_rows(filename: str, data: list) -> None:
    with open(filename, 'w') as f:
        writer = csv.DictWriter(f, fieldnames=['name', 'score'])
        writer.writeheader()
        for row in data:
            writer.writerow(row)
'''

rust = '''
use csv;
use serde_json;
pub fn write_multiple_rows(filename: String, data: &Vec<serde_json::Value>) {
    let mut f = std::fs::File::create(filename)?;
    let writer = csv::Writer::from_writer(f);
    writer.writeheader();
    for row in data.iter().cloned() {
        writer.writerow(row);
    }
}
'''

