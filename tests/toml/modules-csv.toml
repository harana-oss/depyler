[[test]]
name = "csv_dictwriter_writerow_dict"
description = "csv.DictWriter().writerow(dict) writes row from dictionary"

python = '''
import csv

def write_single_row(filename: str) -> None:
    with open(filename, 'w') as f:
        writer = csv.DictWriter(f, fieldnames=['name', 'age'])
        writer.writerow({'name': 'Alice', 'age': '30'})
'''

rust = '''
use csv;
pub fn write_single_row(filename: String) {
    let mut f = std::fs::File::create(filename)?;
    let writer = csv::Writer::from_writer(f);
    writer.writerow(HashMap::from([
        ("name".to_string(), "Alice".to_string()),
        ("age".to_string(), "30".to_string()),
    ]));
}
'''

[[test]]
name = "csv_dictwriter_writeheader"
description = "csv.DictWriter().writeheader() outputs column headers"

python = '''
import csv

def write_with_header(filename: str) -> None:
    with open(filename, 'w') as f:
        writer = csv.DictWriter(f, fieldnames=['id', 'name', 'email'])
        writer.writeheader()
        writer.writerow({'id': '1', 'name': 'Bob', 'email': 'bob@test.com'})
'''

rust = '''
use csv;
