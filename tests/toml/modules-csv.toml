[metadata]
name = "CSV Module Tests"
category = "stdlib-csv"

# =============================================================================
# CSV DictReader
# =============================================================================

[[test]]
name = "csv_dictreader_creation"
description = "csv.DictReader creation and usage"

python = '''
import csv

def read_csv(filepath: str) -> list:
    with open(filepath) as f:
        reader = csv.DictReader(f)
        return list(reader)
'''

rust = '''
use csv;
use serde_json;
pub fn read_csv(filepath: String) -> Vec<i32> {
    let mut f = std::fs::File::open(filepath)?;
    let reader = csv::ReaderBuilder::new().has_headers(true).from_reader(f);
    return reader
        .deserialize::<HashMap<String, String>>()
        .collect::<Vec<_>>();
}
'''

