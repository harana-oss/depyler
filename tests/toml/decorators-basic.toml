[[test]]
name = "decorator_lambda"
description = "@decorator applied to lambda"

python = '''
def add_one(f):
    def wrapper(x):
        return f(x) + 1
    return wrapper

# Lambda can't use @ syntax, must use explicit decoration
add_two = add_one(lambda x: x + 1)
result = add_two(5)
'''

rust = '''
    fn add_one<F>(f: F) -> impl Fn(i32) -> i32
    where
        F: Fn(i32) -> i32,
    {
        move |x| f(x) + 1
    }

    let add_two = add_one(|x| x + 1);
    let result = add_two(5);
'''

[[test]]
name = "decorator_recursive"
description = "Recursive function with decorator"

python = '''
call_count = []

def count_calls(f):
    def wrapper(n):
        call_count.append(1)
        return f(n)
    return wrapper

@count_calls
def factorial(n):
    if n <= 1:
        return 1
    return n * factorial(n - 1)

result = factorial(5)
total_calls = len(call_count)
'''

rust = '''
    use std::cell::RefCell;
    use std::rc::Rc;

    fn count_calls<F>(f: Rc<F>, call_count: Rc<RefCell<Vec<i32>>>) -> impl Fn(i32) -> i32
    where
        F: Fn(i32) -> i32,
    {
        let call_count_clone = call_count.clone();
        move |n| {
            call_count_clone.borrow_mut().push(1);
            f(n)
        }
    }

    fn factorial(n: i32) -> i32 {
        if n <= 1 { 1 } else { n * factorial(n - 1) }
    }

    let call_count: Rc<RefCell<Vec<i32>>> = Rc::new(RefCell::new(Vec::new()));
    let result = factorial(5);
    let total_calls = call_count.borrow().len() as i32;
'''

