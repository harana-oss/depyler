[[test]]
name = "decorator_exception"
description = "Exceptions propagate through wrapper"
tags = ["decorators", "exception"]

python = '''
def decorator(f):
    def wrapper():
        return f()
    return wrapper

@decorator
def failing():
    raise ValueError("error")

try:
    result = failing()
except ValueError as e:
    result = str(e)
'''

rust = '''
fn decorator<F>(f: F) -> impl Fn() -> Result<String, String> 
where F: Fn() -> Result<String, String> {
    move || f()
}

fn failing_impl() -> Result<String, String> {
    Err("error".to_string())
}

let failing = decorator(failing_impl);
let result = match failing() {
    Ok(val) => val,
    Err(e) => e,
};
'''

# =============================================================================
# Method Decorators
# =============================================================================

[[test]]
name = "decorator_method"
description = "@decorator def method(self): ..."
tags = ["decorators", "method"]

python = '''
def add_prefix(f):
    def wrapper(self):
        return "PREFIX: " + f(self)
    return wrapper

class MyClass:
    @add_prefix
    def greet(self):
        return "hello"

obj = MyClass()
result = obj.greet()
'''

rust = '''
fn add_prefix<F>(f: F) -> impl Fn(&MyClass) -> String 
where F: Fn(&MyClass) -> String {
    move |self_ref| format!("PREFIX: {}", f(self_ref))
}

struct MyClass;

impl MyClass {
    fn greet_impl(&self) -> String {
        "hello".to_string()
    }
    
    fn greet(&self) -> String {
        add_prefix(Self::greet_impl)(self)
    }
}

let obj = MyClass;
let result = obj.greet();
'''

[[test]]
name = "decorator_self"
description = "Wrapper receives self correctly"
tags = ["decorators", "self"]

python = '''
def add_name(f):
    def wrapper(self):
        return f(self) + " - " + self.name
    return wrapper

class Person:
    def __init__(self, name):
        self.name = name
    
    @add_name
    def greet(self):
        return "Hello"

person = Person("Alice")
result = person.greet()
'''

rust = '''
fn add_name<F>(f: F) -> impl Fn(&Person) -> String 
where F: Fn(&Person) -> String {
    move |self_ref| format!("{} - {}", f(self_ref), self_ref.name)
}

struct Person {
    name: String,
}

impl Person {
    fn new(name: String) -> Self {
        Person { name }
    }
    
    fn greet_impl(&self) -> String {
        "Hello".to_string()
    }
    
    fn greet(&self) -> String {
        add_name(Self::greet_impl)(self)
    }
}

let person = Person::new("Alice".to_string());
let result = person.greet();
'''

