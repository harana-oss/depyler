python = '''
def no_op_decorator(f):
    return f

@no_op_decorator
def greet():
    return "hello"

result = greet()
'''

rust = '''
    fn no_op_decorator<F>(f: F) -> F {
        f
    }

    fn greet_impl() -> String {
