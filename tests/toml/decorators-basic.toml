[[test]]
name = "decorator_lambda"
description = "@decorator applied to lambda"
tags = ["decorators", "lambda"]
skip = true

python = '''
def add_one(f):
    def wrapper(x):
        return f(x) + 1
    return wrapper

# Lambda can't use @ syntax, must use explicit decoration
add_two = add_one(lambda x: x + 1)
result = add_two(5)
'''

rust = '''
fn add_one<F>(f: F) -> impl Fn(i32) -> i32 
where F: Fn(i32) -> i32 {
