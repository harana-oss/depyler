# Basic Decorators Tests - Function decorators
# Rust Mapping: Wrapper functions, macros

[metadata]
name = "Basic Decorators Tests"
category = "decorators-closures"

# =============================================================================
# Simple Decorators
# =============================================================================

[[test]]
name = "decorator_basic"
description = "@decorator def f(): ..."
tags = ["decorators", "basic"]

python = '''
def identity(f):
    return f

@identity
def greet():
    return "hello"

result = greet()
'''

rust = '''
fn identity<F>(f: F) -> F where F: Fn() -> String {
    f
}

fn greet_impl() -> String {
    "hello".to_string()
}

let greet = identity(greet_impl);
let result = greet();
'''

[[test]]
name = "decorator_wrapper"
description = "def decorator(f): def wrapper(): return f() return wrapper"
tags = ["decorators", "wrapper"]

python = '''
def decorator(f):
    def wrapper():
        return f()
    return wrapper

@decorator
def greet():
    return "hello"

result = greet()
'''

rust = '''
fn decorator<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || f()
}

fn greet_impl() -> String {
    "hello".to_string()
}

let greet = decorator(greet_impl);
let result = greet();
'''

