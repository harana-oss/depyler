[[test]]
name = "decorator_return_none"
description = "Decorator not returning function"

python = '''
def bad_decorator(f):
    return None

@bad_decorator
def func():
    return 42

# This will raise TypeError: 'NoneType' object is not callable
try:
    result = func()
except TypeError:
    result = "error"
'''

rust = '''
// Rust's type system prevents this at compile time
// A decorator must return a callable type
'''

