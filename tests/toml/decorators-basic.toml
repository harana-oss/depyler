# =============================================================================
# Decorator Application Order
# =============================================================================

[[test]]
name = "decorator_stacked"
description = "@a @b @c def f(): ... equivalent to a(b(c(f)))"
tags = ["decorators", "stacking"]

python = '''
def add_a(f):
    def wrapper():
        return "a(" + f() + ")"
    return wrapper

def add_b(f):
    def wrapper():
        return "b(" + f() + ")"
    return wrapper

def add_c(f):
    def wrapper():
        return "c(" + f() + ")"
    return wrapper

@add_a
@add_b
@add_c
def func():
    return "x"

result = func()
'''

rust = '''
fn add_a<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || format!("a({})", f())
}

fn add_b<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || format!("b({})", f())
}

fn add_c<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || format!("c({})", f())
}

fn func_impl() -> String {
    "x".to_string()
}

let func = add_a(add_b(add_c(func_impl)));
let result = func();
'''

[[test]]
name = "decorator_order"
description = "Bottom decorator applied first"
tags = ["decorators", "order"]

python = '''
def add_1(f):
    def wrapper():
        return f() + " first"
    return wrapper

def add_2(f):
    def wrapper():
        return f() + " second"
    return wrapper

@add_2
@add_1
def message():
    return "hello"

result = message()
'''

rust = '''
fn add_1<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || format!("{} first", f())
}

fn add_2<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || format!("{} second", f())
}

fn message_impl() -> String {
    "hello".to_string()
}

let message = add_2(add_1(message_impl));
let result = message();
'''

[[test]]
name = "decorator_three"
description = "Multiple decorator application"
tags = ["decorators", "multiple"]

python = '''
def upper(f):
    def wrapper():
        return f().upper()
    return wrapper

def exclaim(f):
    def wrapper():
        return f() + "!"
    return wrapper

def repeat(f):
    def wrapper():
        return f() + " " + f()
    return wrapper

@upper
@exclaim
@repeat
def word():
    return "hi"

result = word()
'''

rust = '''
fn upper<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || f().to_uppercase()
}

fn exclaim<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || format!("{}!", f())
}

fn repeat<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String + Clone {
    move || {
        let val = f();
        format!("{} {}", val, val)
    }
}

fn word_impl() -> String {
    "hi".to_string()
}

let word = upper(exclaim(repeat(word_impl)));
let result = word();
'''

# =============================================================================
# Common Decorator Patterns
# =============================================================================

[[test]]
name = "decorator_logging"
description = "Log function calls"
tags = ["decorators", "logging"]

python = '''
log = []

def logging_decorator(f):
    def wrapper():
        log.append(f"Calling {f.__name__}")
        result = f()
        log.append(f"Returned {result}")
        return result
    return wrapper

@logging_decorator
def add():
    return 42

result = add()
log_result = log
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

fn logging_decorator<F>(f: F, log: Rc<RefCell<Vec<String>>>) -> impl Fn() -> i32 
where F: Fn() -> i32 {
    let log_clone = log.clone();
    move || {
        log_clone.borrow_mut().push(format!("Calling add"));
        let result = f();
        log_clone.borrow_mut().push(format!("Returned {}", result));
        result
    }
}

fn add_impl() -> i32 {
    42
}

let log: Rc<RefCell<Vec<String>>> = Rc::new(RefCell::new(Vec::new()));
let add = logging_decorator(add_impl, log.clone());
let result = add();
let log_result = log.borrow().clone();
'''

[[test]]
name = "decorator_timing"
description = "Measure execution time"
tags = ["decorators", "timing"]

python = '''
import time

def timing_decorator(f):
    def wrapper():
        start = time.time()
        result = f()
        elapsed = time.time() - start
        return result
    return wrapper

@timing_decorator
def slow_function():
    return "done"

result = slow_function()
'''

rust = '''
use std::time::Instant;

fn timing_decorator<F>(f: F) -> impl Fn() -> String 
where F: Fn() -> String {
    move || {
        let start = Instant::now();
        let result = f();
        let _elapsed = start.elapsed();
        result
    }
}

fn slow_function_impl() -> String {
    "done".to_string()
}

let slow_function = timing_decorator(slow_function_impl);
let result = slow_function();
'''

[[test]]
name = "decorator_validation"
description = "Validate arguments"
tags = ["decorators", "validation"]

python = '''
def validate_positive(f):
    def wrapper(x):
        if x < 0:
            raise ValueError("Must be positive")
        return f(x)
    return wrapper

@validate_positive
def square(x):
    return x * x

result = square(5)
'''

rust = '''
fn validate_positive<F>(f: F) -> impl Fn(i32) -> Result<i32, String> 
where F: Fn(i32) -> i32 {
    move |x| {
        if x < 0 {
            Err("Must be positive".to_string())
        } else {
            Ok(f(x))
        }
    }
}

fn square_impl(x: i32) -> i32 {
    x * x
}

let square = validate_positive(square_impl);
let result = square(5).unwrap();
'''

[[test]]
name = "decorator_retry"
description = "Retry on failure"
tags = ["decorators", "retry"]

python = '''
attempts = []

def retry(max_attempts=3):
    def decorator(f):
        def wrapper():
            for i in range(max_attempts):
                attempts.append(i)
                try:
                    return f()
                except Exception:
                    if i == max_attempts - 1:
                        raise
            return None
        return wrapper
    return decorator

@retry(max_attempts=2)
def unreliable():
    if len(attempts) < 2:
        raise ValueError("fail")
    return "success"

result = unreliable()
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

fn retry<F>(f: F, max_attempts: usize, attempts: Rc<RefCell<Vec<usize>>>) -> impl Fn() -> Result<String, String> 
where F: Fn() -> Result<String, String> {
    let attempts_clone = attempts.clone();
    move || {
        for i in 0..max_attempts {
            attempts_clone.borrow_mut().push(i);
            match f() {
                Ok(val) => return Ok(val),
                Err(e) => {
                    if i == max_attempts - 1 {
                        return Err(e);
                    }
                }
            }
        }
        Err("Max attempts reached".to_string())
    }
}

let attempts: Rc<RefCell<Vec<usize>>> = Rc::new(RefCell::new(Vec::new()));
let attempts_clone = attempts.clone();

let unreliable = retry(
    move || {
        if attempts_clone.borrow().len() < 2 {
            Err("fail".to_string())
        } else {
            Ok("success".to_string())
        }
    },
    2,
    attempts.clone()
);

let result = unreliable().unwrap();
'''

