# Decorators Preserving Signature
# =============================================================================

[[test]]
name = "decorator_args_kwargs"
description = "def wrapper(*args, **kwargs): return f(*args, **kwargs)"
tags = ["decorators", "args"]

python = '''
def passthrough(f):
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

@passthrough
def add(a, b):
    return a + b

result = add(3, 5)
'''

rust = '''
fn passthrough<F>(f: F) -> impl Fn(i32, i32) -> i32 
where F: Fn(i32, i32) -> i32 {
    move |a, b| f(a, b)
}

fn add_impl(a: i32, b: i32) -> i32 {
    a + b
}

let add = passthrough(add_impl);
let result = add(3, 5);
'''

