# =============================================================================
# Implicit Namespace Packages
# =============================================================================

[[test]]
name = "namespace_no_init"
skip = true
description = "Directory without __init__.py"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


