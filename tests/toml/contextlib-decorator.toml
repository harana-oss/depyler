# @contextmanager Decorator Tests - Generator-based context managers
# Rust Mapping: Custom wrapper implementation

[metadata]
name = "@contextmanager Decorator Tests"
category = "context-managers"

# =============================================================================
# Basic @contextmanager
# =============================================================================

[[test]]
name = "contextmanager_basic"
description = "@contextmanager def cm(): yield"

python = '''
from contextlib import contextmanager

@contextmanager
def simple():
    yield

with simple():
    result = "success"
'''

rust = '''
// Rust uses closures for context management
fn simple<F, R>(f: F) -> R 
where F: FnOnce() -> R {
    f()
}

let result = simple(|| "success");
'''

[[test]]
name = "contextmanager_setup"
description = "Setup before yield"

python = '''
from contextlib import contextmanager

setup_done = []

@contextmanager
def with_setup():
    setup_done.append(True)
    yield

with with_setup():
    result = len(setup_done)
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

let setup_done: Rc<RefCell<Vec<bool>>> = Rc::new(RefCell::new(Vec::new()));
let setup_clone = setup_done.clone();

fn with_setup<F, R>(setup: Rc<RefCell<Vec<bool>>>, f: F) -> R 
where F: FnOnce() -> R {
    setup.borrow_mut().push(true);
    f()
}

let result = with_setup(setup_clone, || setup_done.borrow().len());
'''

[[test]]
name = "contextmanager_teardown"
description = "Teardown after yield"

python = '''
from contextlib import contextmanager

cleanup_done = []

@contextmanager
def with_cleanup():
    yield
    cleanup_done.append(True)

with with_cleanup():
    pass

result = len(cleanup_done)
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

let cleanup_done: Rc<RefCell<Vec<bool>>> = Rc::new(RefCell::new(Vec::new()));
let cleanup_clone = cleanup_done.clone();

fn with_cleanup<F, R>(cleanup: Rc<RefCell<Vec<bool>>>, f: F) -> R 
where F: FnOnce() -> R {
    let result = f();
    cleanup.borrow_mut().push(true);
    result
}

with_cleanup(cleanup_clone, || ());
let result = cleanup_done.borrow().len();
'''

