# =============================================================================
# Comparison with Class-Based
# =============================================================================

[[test]]
name = "contextmanager_vs_class"
description = "@contextmanager vs __enter__/__exit__"

python = '''
from contextlib import contextmanager

# Generator-based
@contextmanager
def generator_cm():
    print("enter")
    yield 42
    print("exit")

# Class-based
class ClassCM:
    def __enter__(self):
        print("enter")
        return 42
    
    def __exit__(self, *args):
        print("exit")
        return False

result = "both work the same"
'''

rust = '''
// Rust uses RAII and Drop trait for cleanup
struct ClassCM {
    value: i32,
}

impl Drop for ClassCM {
    fn drop(&mut self) {
        log::info!("exit");
    }
}

impl ClassCM {
    fn new() -> Self {
        log::info!("enter");
        ClassCM { value: 42 }
    }
}

let result = "both work the same";
'''

