[[test]]
name = "contextmanager_setup_fail"
description = "Exception before yield"

python = '''
from contextlib import contextmanager

@contextmanager
def fail_in_setup():
    raise ValueError("setup failed")
    yield

try:
    with fail_in_setup():
        pass
except ValueError as e:
    result = str(e)
'''

rust = '''
fn fail_in_setup<F, R>(f: F) -> Result<R, String> 
where F: FnOnce() -> R {
    Err("setup failed".to_string())
}

let result = match fail_in_setup(|| ()) {
    Err(e) => e,
    Ok(_) => String::new(),
};
'''

[[test]]
name = "contextmanager_teardown_fail"
description = "Exception after yield"

python = '''
from contextlib import contextmanager

log = []

@contextmanager
def fail_in_teardown():
    try:
        yield
    finally:
        log.append("cleanup attempted")
        raise ValueError("teardown failed")

try:
    with fail_in_teardown():
        log.append("body executed")
except ValueError:
    result = log
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

let log: Rc<RefCell<Vec<&str>>> = Rc::new(RefCell::new(Vec::new()));
let log_clone = log.clone();

fn fail_in_teardown<F, R>(log: Rc<RefCell<Vec<&'static str>>>, f: F) -> Result<R, String> 
where F: FnOnce() -> R {
    let result = f();
    log.borrow_mut().push("cleanup attempted");
    Err("teardown failed".to_string())
}

let _ = fail_in_teardown(log_clone, || {
    log.borrow_mut().push("body executed");
});

let result = log.borrow().clone();
'''

[[test]]
name = "contextmanager_reuse"
description = "Each call creates new generator"

python = '''
from contextlib import contextmanager

call_count = []

@contextmanager
def counting_cm():
    call_count.append(1)
    yield len(call_count)

with counting_cm() as first:
    pass

with counting_cm() as second:
    pass

result = (first, second)
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

let call_count: Rc<RefCell<Vec<i32>>> = Rc::new(RefCell::new(Vec::new()));

fn counting_cm<F, R>(call_count: Rc<RefCell<Vec<i32>>>, f: F) -> R 
where F: FnOnce(usize) -> R {
    call_count.borrow_mut().push(1);
    f(call_count.borrow().len())
}

let first = counting_cm(call_count.clone(), |count| count);
let second = counting_cm(call_count.clone(), |count| count);

let result = (first, second);
'''
