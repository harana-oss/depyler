# =============================================================================
# Try/Finally Pattern
# =============================================================================

[[test]]
name = "contextmanager_try_finally"
description = "try: yield finally: cleanup"

python = '''
from contextlib import contextmanager

log = []

@contextmanager
def with_finally():
    try:
        log.append("enter")
        yield
    finally:
        log.append("exit")

with with_finally():
    log.append("body")

result = log
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

let log: Rc<RefCell<Vec<&str>>> = Rc::new(RefCell::new(Vec::new()));
let log_clone = log.clone();

fn with_finally<F, R>(log: Rc<RefCell<Vec<&'static str>>>, f: F) -> R 
where F: FnOnce() -> R {
    log.borrow_mut().push("enter");
    let result = f();
    log.borrow_mut().push("exit");
    result
}

with_finally(log_clone, || {
    log.borrow_mut().push("body");
});

let result = log.borrow().clone();
'''

[[test]]
name = "contextmanager_exception"
description = "Exception propagates through yield"

python = '''
from contextlib import contextmanager

log = []

@contextmanager
def track_exception():
    try:
        yield
    finally:
        log.append("cleanup")

try:
    with track_exception():
        raise ValueError("error")
except ValueError:
    result = log
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

let log: Rc<RefCell<Vec<&str>>> = Rc::new(RefCell::new(Vec::new()));
let log_clone = log.clone();

fn track_exception<F, R>(log: Rc<RefCell<Vec<&'static str>>>, f: F) -> Result<R, String> 
where F: FnOnce() -> Result<R, String> {
    let result = f();
    log.borrow_mut().push("cleanup");
    result
}

let _ = track_exception(log_clone, || {
    Err::<(), String>("error".to_string())
});

let result = log.borrow().clone();
'''

[[test]]
name = "contextmanager_suppress"
description = "try: yield except: pass to suppress"

python = '''
from contextlib import contextmanager

@contextmanager
def suppress_errors():
    try:
        yield
    except Exception:
        pass

with suppress_errors():
    raise ValueError("ignored")

result = "success"
'''

rust = '''
fn suppress_errors<F, R>(f: F) -> Option<R> 
where F: FnOnce() -> Result<R, String> {
    match f() {
        Ok(val) => Some(val),
        Err(_) => None,
    }
}

suppress_errors(|| {
    Err::<(), String>("ignored".to_string())
});

let result = "success";
'''

# =============================================================================
# @contextmanager Use Cases
# =============================================================================

[[test]]
name = "contextmanager_temp_value"
description = "Change and restore a value"

python = '''
from contextlib import contextmanager

value = 10

@contextmanager
def temp_change(new_val):
    global value
    old_val = value
    value = new_val
    yield
    value = old_val

with temp_change(20):
    in_context = value

result = (in_context, value)
'''

rust = '''
use std::cell::RefCell;
use std::rc::Rc;

let value: Rc<RefCell<i32>> = Rc::new(RefCell::new(10));
let value_clone = value.clone();

fn temp_change<F, R>(value: Rc<RefCell<i32>>, new_val: i32, f: F) -> R 
where F: FnOnce() -> R {
    let old_val = *value.borrow();
    *value.borrow_mut() = new_val;
    let result = f();
    *value.borrow_mut() = old_val;
    result
}

let in_context = temp_change(value_clone.clone(), 20, || *value.borrow());
let result = (in_context, *value.borrow());
'''

[[test]]
name = "contextmanager_timing"
description = "Measure time in context"

python = '''
from contextlib import contextmanager
import time

elapsed = []

@contextmanager
def timer():
    start = time.time()
    yield
    elapsed.append(time.time() - start)

with timer():
    pass

result = len(elapsed) == 1
'''

rust = '''
use std::time::Instant;
use std::cell::RefCell;
use std::rc::Rc;

let elapsed: Rc<RefCell<Vec<f64>>> = Rc::new(RefCell::new(Vec::new()));
let elapsed_clone = elapsed.clone();

fn timer<F, R>(elapsed: Rc<RefCell<Vec<f64>>>, f: F) -> R 
where F: FnOnce() -> R {
    let start = Instant::now();
    let result = f();
    elapsed.borrow_mut().push(start.elapsed().as_secs_f64());
    result
}

timer(elapsed_clone, || ());
let result = elapsed.borrow().len() == 1;
'''

[[test]]
name = "contextmanager_chdir"
description = "Change and restore cwd"
skip = true

python = '''
from contextlib import contextmanager
import os

@contextmanager
def chdir(path):
    old_dir = os.getcwd()
    os.chdir(path)
    try:
        yield
    finally:
        os.chdir(old_dir)

# Example usage
result = "chdir implemented"
'''

rust = '''
// Directory operations are OS-specific
use std::env;
use std::path::Path;

fn chdir<F, R, P: AsRef<Path>>(path: P, f: F) -> std::io::Result<R> 
where F: FnOnce() -> R {
    let old_dir = env::current_dir()?;
    env::set_current_dir(path)?;
    let result = f();
    env::set_current_dir(old_dir)?;
    Ok(result)
}

let result = "chdir implemented";
'''

[[test]]
name = "contextmanager_environ"
description = "Set and restore env var"
skip = true

python = '''
from contextlib import contextmanager
import os

@contextmanager
def set_env(key, value):
    old_value = os.environ.get(key)
    os.environ[key] = value
    try:
        yield
    finally:
        if old_value is None:
            del os.environ[key]
        else:
            os.environ[key] = old_value

# Example usage
result = "environ implemented"
'''

rust = '''
use std::env;

fn set_env<F, R>(key: &str, value: &str, f: F) -> R 
where F: FnOnce() -> R {
    let old_value = env::var(key).ok();
    env::set_var(key, value);
    let result = f();
    match old_value {
        Some(val) => env::set_var(key, val),
        None => env::remove_var(key),
    }
    result
}

let result = "environ implemented";
'''

