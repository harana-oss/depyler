[[test]]
name = "decimal_round"
skip = true
description = "Decimal rounding"

python = '''
def round_to_places(value: float, places: int) -> float:
    factor = 10.0 ** places
    return round(value * factor) / factor
'''

rust = '''
pub fn round_to_places(value: f64, places: i32) -> f64 {
