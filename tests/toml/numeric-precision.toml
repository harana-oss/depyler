[metadata]
name = "Numeric Precision Tests"
category = "numeric"

# =============================================================================
# Integer Overflow Behavior
# =============================================================================

[[test]]
name = "int_overflow_behavior"
description = "Python arbitrary precision int handling"

python = '''
def large_multiply(a: int, b: int) -> int:
    return a * b
'''

rust = '''
pub fn large_multiply(a: i32, b: i32) -> i32 {
    return a * b;
}
'''

[[test]]
name = "int_overflow_add"
description = "Addition overflow handling"

python = '''
def safe_add(a: int, b: int) -> int:
    return a + b
'''

rust = '''
pub fn safe_add(a: i32, b: i32) -> i32 {
    return a + b;
}
'''

[[test]]
name = "int_overflow_subtract"
description = "Subtraction overflow handling"

python = '''
def safe_subtract(a: int, b: int) -> int:
    return a - b
'''

rust = '''
pub fn safe_subtract(a: i32, b: i32) -> i32 {
    return a - b;
}
'''

[[test]]
name = "int_overflow_power"
skip = true
description = "Power operation overflow"

python = '''
def power(base: int, exp: int) -> int:
    result = 1
    for _ in range(exp):
        result *= base
    return result
'''

rust = '''
pub fn power(base: i32, exp: i32) -> i32 {
    let mut result = 1;
    for _ in 0..exp {
        result *= base;
    }
    return result;
}
'''

# =============================================================================
# Float Precision
# =============================================================================

[[test]]
name = "float_precision_loss"
description = "Float precision edge cases"

python = '''
def float_add(a: float, b: float) -> float:
    return a + b
'''

rust = '''
pub fn float_add(a: f64, b: f64) -> f64 {
    return a + b;
}
'''

[[test]]
name = "float_comparison"
description = "Float comparison with epsilon"

python = '''
def floats_equal(a: float, b: float, epsilon: float) -> bool:
    return abs(a - b) < epsilon
'''

rust = '''
pub fn floats_equal(a: f64, b: f64, epsilon: f64) -> bool {
    return (a - b).abs() < epsilon;
}
'''

[[test]]
name = "float_division"
skip = true
description = "Float division precision"

python = '''
def safe_div(a: float, b: float) -> float:
    if b == 0.0:
        return 0.0
    return a / b
'''

rust = '''
pub fn safe_div(a: f64, b: f64) -> f64 {
    if b == 0.0 {
        return 0.0;
    }
    return a / b;
}
'''

