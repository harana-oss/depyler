[[test]]
name = "multiple_early_returns"
description = "Multiple early returns with different wrapping"

python = '''
def categorize(x: int) -> str | None:
    if x < 0:
        return None
    if x == 0:
        return "zero"
    if x == 1:
        return "one"
    return "many"
'''

rust = '''
pub fn categorize(x: i32) -> Option<String> {
    let _cse_temp_0 = x < 0;
    if _cse_temp_0 {
        return None;
    }
    let _cse_temp_1 = x == 0;
    if _cse_temp_1 {
        return Some("zero".to_string());
    }
    let _cse_temp_2 = x == 1;
    if _cse_temp_2 {
        return Some("one".to_string());
    }
    return Some("many".to_string());
}
'''

[[test]]
name = "nested_optional_returns"
description = "Deep nesting doesn't break wrapping"

python = '''
def nested_search(matrix: list[list[int]], target: int) -> int | None:
    for row in matrix:
        for val in row:
            if val == target:
                return val
    return None
'''

rust = '''
pub fn nested_search(matrix: &Vec<Vec<i32>>, target: i32) -> Option<i32> {
    for row in matrix.iter().cloned() {
        for val in row.iter().cloned() {
            if val == target {
                return Some(val);
            }
        }
    }
    return None;
}
'''

[[test]]
name = "complex_return_patterns"
description = "Complex function with all return patterns"

python = '''
def complex_logic(items: list[int], threshold: int) -> int | None:
    """Complex function with multiple return patterns."""
    if len(items) == 0:
        raise ValueError("Empty list")
    if threshold < 0:
        return None
    for item in items:
        if item > threshold:
            return item
    return None
'''

