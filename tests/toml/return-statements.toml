[[test]]
name = "optional_return_some"
description = "Optional return with Some() wrapping for non-None value"

python = '''
def find_value(items: list[int], target: int) -> int | None:
    for item in items:
        if item == target:
            return item
    return None
'''

rust = '''
pub fn find_value(items: &Vec<i32>, target: i32) -> Option<i32> {
    for item in items.iter().cloned() {
        if item == target {
            return Some(item);
        }
    }
    return None;
}
'''

