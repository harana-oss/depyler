python = '''
@dataclass
class Item:
    val: int

def main(items: list[Item]):
    (idx, b) = next((x, y) for x, y in enumerate(items) if y.val == items[0].val)
    items[0].val = idx
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Item {
    pub val: i32,
}
impl Item {
    pub fn new(val: i32) -> Self {
        Self { val }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "val" => Some(Box::new(self.val.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "val" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.val = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn main(items: &mut Vec<Item>) {
    let (idx, b) = items
        .iter()
        .enumerate()
        .map(|(i, x)| (i as i32, x.clone()))
        .filter(|(x, y)| y.val == items.get(0usize).cloned().unwrap().val)
        .map(|(x, y)| (x, y))
        .next()
        .expect("StopIteration: iterator is empty");
    items[0usize].val = idx;
}
'''

