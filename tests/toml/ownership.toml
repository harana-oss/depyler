[metadata]
name = "Ownership Tests"
category = "ownership"

# =============================================================================
# Basic Ownership
# =============================================================================

[[test]]
name = "ownership_move"
description = "Value moves when assigned"
tags = ["ownership", "move"]

[test.python]
code = '''
def transfer_ownership():
    original = [1, 2, 3]
    new_owner = original
    return new_owner
'''

[test.assertions]
contains_any = [["clone()", "let new_owner = original"]]

[[test]]
name = "ownership_clone"
description = "Explicit clone for copy"
tags = ["ownership", "clone"]

[test.python]
code = '''
def copy_list(items: list[int]) -> list[int]:
    copy = list(items)
    return copy
'''

[test.assertions]
contains_any = [["clone()", "into_iter().collect()"]]

