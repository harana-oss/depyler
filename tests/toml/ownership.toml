# =============================================================================
# Clone Requirements
# =============================================================================

[[test]]
name = "clone_string_used_twice"
description = "String param used twice needs clone"
tags = ["clone", "string"]

[test.python]
code = '''
def use_string_twice(s: str) -> str:
    a = s
    b = s
    return a + b
'''

[test.assertions]
contains = ["clone()"]

[[test]]
name = "clone_list_field_returned"
description = "List field returned needs clone"
tags = ["clone", "list"]

[test.python]
code = '''
from dataclasses import dataclass

@dataclass
class State:
    items: list[int]

def get_items(state: State) -> list[int]:
    return state.items
'''

[test.assertions]
contains = ["clone()"]

[[test]]
name = "clone_dict_field_returned"
description = "Dict field returned needs clone"
tags = ["clone", "dict"]

[test.python]
code = '''
from dataclasses import dataclass

@dataclass
class State:
    data: dict[str, int]

def get_data(state: State) -> dict[str, int]:
    return state.data
'''

[test.assertions]
contains = ["clone()"]

[[test]]
name = "no_clone_copy_types"
description = "Copy types (int, float, bool) don't need clone"
tags = ["clone", "copy"]

[test.python]
code = '''
def double_use(x: float, y: float) -> float:
    a = x
    b = x
    return a + b + y
'''

[test.assertions]
not_contains = ["x.clone()"]

[[test]]
name = "no_clone_last_use"
description = "Last use moves, no clone needed"
tags = ["clone", "move"]

[test.python]
code = '''
def identity(items: list[int]) -> list[int]:
    return items
'''

[test.assertions]
not_contains = ["items.clone()"]

[[test]]
name = "clone_in_loop"
description = "Clone string in loop append"
tags = ["clone", "loop"]

[test.python]
code = '''
from dataclasses import dataclass

@dataclass
class State:
    template: str

def build_list(state: State, n: int) -> list[str]:
    result: list[str] = []
    for i in range(n):
        result.append(state.template)
    return result
'''

[test.assertions]
contains = ["clone()"]

# =============================================================================
# Struct Field Borrowing - Migrated from test_struct_field_borrow.rs
# =============================================================================

[[test]]
name = "struct_field_passed_to_fn_borrows"
description = "Struct String field passed to function should borrow"
tags = ["borrow", "struct", "field"]

[test.python]
code = '''
class State:
    field: str

    def __init__(self, field: str):
        self.field = field

def take_str(s: str) -> None:
    pass

def main() -> None:
    state = State("hello")
    take_str(state.field)
'''

[test.assertions]
contains = ["fn take_str(s: &str)", "&state.field"]

[[test]]
name = "self_field_passed_to_fn_borrows"
description = "self.field passed to function should borrow"
tags = ["borrow", "self", "field"]

[test.python]
code = '''
class State:
    field: str

    def __init__(self, field: str):
        self.field = field

    def process(self) -> None:
        take_str(self.field)

def take_str(s: str) -> None:
    pass
'''

[test.assertions]
contains = ["&self.field"]

[[test]]
name = "nested_field_passed_to_fn_borrows"
description = "Nested struct field passed to function should borrow"
tags = ["borrow", "nested", "field"]

[test.python]
code = '''
class Inner:
    value: str

    def __init__(self, value: str):
        self.value = value

class Outer:
    inner: Inner

    def __init__(self, inner: Inner):
        self.inner = inner

def take_str(s: str) -> None:
    pass

def main() -> None:
    inner = Inner("hello")
    outer = Outer(inner)
    take_str(outer.inner.value)
'''

[test.assertions]
contains = ["&outer.inner.value"]

# =============================================================================
# Iterator/Generator Filtering (from test_method_ownership.rs)
# =============================================================================

[[test]]
name = "next_with_generator_filtering_dataclass"
description = "next() with generator filtering on dataclass"
tags = ["ownership", "iterator", "dataclass", "filtering"]

[test.python]
code = '''
@dataclass
class Incident:
    points_scored_team: str
    score: int

def find_away_incident(try_incidents: List[Incident]) -> Optional[Incident]:
    return next((incident for incident in try_incidents if incident.points_scored_team == "Away"), None)
'''

[test.assertions]
contains = ["struct Incident", "points_scored_team: String", "score: i32", "fn find_away_incident", "-> Option<Incident>", ".filter(", ".next()"]

[[test]]
name = "enumerate_next_dataclass_field_assignment"
description = "enumerate with next() and assignment to dataclass field via index"
tags = ["ownership", "iterator", "dataclass", "enumerate", "index-field-assignment"]

[test.python]
code = '''
@dataclass
class Item:
    val: int

def main(items: list[Item]):
    (idx, b) = next((x, y) for x, y in enumerate(items) if y.val == items[0].val)
    items[0].val = idx
'''

[test.assertions]
contains = ["struct Item", "val: i32", "fn main", "&mut Vec<Item>", "enumerate()", ".filter(", ".next()", "items[0].val ="]
not_contains = [".get(0usize).cloned().unwrap().val ="]

