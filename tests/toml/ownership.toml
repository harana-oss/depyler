[[test]]
name = "next_with_generator_filtering_dataclass"
description = "next() with generator filtering on dataclass"

python = '''
@dataclass
class Incident:
    points_scored_team: str
    score: int

def find_away_incident(try_incidents: List[Incident]) -> Optional[Incident]:
    return next((incident for incident in try_incidents if incident.points_scored_team == "Away"), None)
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Incident {
    pub points_scored_team: String,
    pub score: i32,
}
impl Incident {
    pub fn new(points_scored_team: String, score: i32) -> Self {
        Self {
            points_scored_team,
            score,
        }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "points_scored_team" => Some(Box::new(self.points_scored_team.clone()) as Box<dyn std::any::Any>),
            "score" => Some(Box::new(self.score.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "points_scored_team" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.points_scored_team = v.clone();
                    true
                } else {
                    false
                }
            }
            "score" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.score = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn find_away_incident(try_incidents: &Vec<Incident>) -> Option<Incident> {
    return try_incidents
        .iter()
        .cloned()
        .filter(|incident| incident.points_scored_team == "Away")
        .next();
}
'''

