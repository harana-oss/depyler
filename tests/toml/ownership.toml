[[test]]
name = "struct_owned_field"
description = "Struct with owned field"

python = '''
class Container:
    def __init__(self, items: list[int]):
        self.items = items
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Container {
    pub items: Vec<i32>,
}
impl Container {
    pub fn new(items: Vec<i32>) -> Self {
        Self { items }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "items" => Some(Box::new(self.items.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "items" => {
                if let Some(v) = value.downcast_ref::<Vec<i32>>() {
                    self.items = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
'''

