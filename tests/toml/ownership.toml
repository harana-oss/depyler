'''

[test.assertions]
contains = ["&mut"]

[[test]]
name = "borrow_multiple_immutable"
description = "Multiple immutable borrows allowed"
tags = ["borrow", "immutable", "multiple"]

[test.python]
code = '''
def compare_lists(a: list[int], b: list[int]) -> bool:
