[[test]]
name = "clone_struct_from_function_used_twice"
description = "Struct returned from function and used twice needs clone"
tags = ["clone", "struct", "function-return"]
compile_check = true

python = '''
from dataclasses import dataclass

@dataclass
class Statistics:
    value: int

@dataclass
class Player:
    total_statistics: Statistics

def create_statistics() -> Statistics:
    return Statistics(value=0)

def setup_player() -> list[Statistics]:
    items: list[Statistics] = []
    player = Player(total_statistics=Statistics(value=0))
    total_statistics = create_statistics()
    player.total_statistics = total_statistics
    items.append(total_statistics)
    return items
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Statistics {
    pub value: i32,
}
impl Statistics {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub total_statistics: Statistics,
}
impl Player {
    pub fn new(total_statistics: Statistics) -> Self {
        Self { total_statistics }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "total_statistics" => Some(Box::new(self.total_statistics.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "total_statistics" => {
                if let Some(v) = value.downcast_ref::<Statistics>() {
                    self.total_statistics = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn create_statistics() -> Statistics {
    return Statistics::new(0);
}
pub fn setup_player() -> Vec<Statistics> {
    let mut items: Vec<Statistics> = vec![];
    let mut player = Player::new(Statistics::new(0));
    let total_statistics = create_statistics();
    player.total_statistics = total_statistics.clone();
    items.push(total_statistics);
    return items;
}
'''

