try:
    with Reraiser():
        raise ValueError("original")
except RuntimeError as e:
    print(f"Got: {e}")
"""
rust = """
struct Reraiser;

impl Drop for Reraiser {
    fn drop(&mut self) {
    }
}

let _reraiser = Reraiser;
log::info!("Got: Wrapped error");"""

