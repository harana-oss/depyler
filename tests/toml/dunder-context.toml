[[test]]
name = "nested_with"
skip = true
description = "with a: with b: ..."
python = """
class CM:
    def __init__(self, name):
        self.name = name
    
    def __enter__(self):
        print(f"Enter {self.name}")
        return self
    
    def __exit__(self, *args):
        print(f"Exit {self.name}")
        return False

with CM("A"):
    with CM("B"):
        print("Inside both")
"""
rust = """
struct CM {
    name: String,
}

impl CM {
    fn new(name: &str) -> Self {
        log::info!("Enter {}", name);
        CM {
            name: name.to_string(),
        }
    }
}

impl Drop for CM {
    fn drop(&mut self) {
        log::info!("Exit {}", self.name);
    }
}

let _a = CM::new("A");
{
    let _b = CM::new("B");
    log::info!("Inside both");
}"""

