impl Tracker {
    fn new() -> Self {
        Tracker
    }
}

impl Drop for Tracker {
    fn drop(&mut self) {
        log::info!("Exit called with: None");
    }
}

let _tracker = Tracker::new();
log::info!("Working");"""

