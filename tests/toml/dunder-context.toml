[[test]]
name = "cm_file_like"
skip = true
description = "Open/close resource pattern"
python = """
class File:
    def __init__(self, name):
        self.name = name
    
    def __enter__(self):
        print(f"Opening {self.name}")
        return self
    
    def __exit__(self, *args):
        print(f"Closing {self.name}")
        return False

with File("data.txt") as f:
    print(f"Working with {f.name}")
"""
rust = """
struct File {
    name: String,
}

impl File {
    fn new(name: &str) -> Self {
        log::info!("Opening {}", name);
        File {
            name: name.to_string(),
        }
    }
}

impl Drop for File {
    fn drop(&mut self) {
        log::info!("Closing {}", self.name);
    }
}

let f = File::new("data.txt");
log::info!("Working with {}", f.name);"""

[[test]]
name = "cm_lock"
skip = true
description = "Acquire/release lock pattern"
python = """
class Lock:
    def __enter__(self):
        print("Acquiring lock")
        return self
    
    def __exit__(self, *args):
        print("Releasing lock")
        return False

with Lock():
    print("Critical section")
"""
rust = """
struct Lock;

impl Lock {
    fn new() -> Self {
        log::info!("Acquiring lock");
        Lock
    }
}

impl Drop for Lock {
    fn drop(&mut self) {
        log::info!("Releasing lock");
    }
}

let _lock = Lock::new();
log::info!("Critical section");"""

[[test]]
name = "cm_transaction"
skip = true
description = "Begin/commit/rollback pattern"
python = """
class Transaction:
    def __enter__(self):
        print("BEGIN")
        return self
    
    def __exit__(self, exc_type, *args):
        if exc_type:
            print("ROLLBACK")
        else:
            print("COMMIT")
        return False

with Transaction():
    print("INSERT data")
"""
rust = """
struct Transaction {
    committed: bool,
}

impl Transaction {
    fn new() -> Self {
        log::info!("BEGIN");
        Transaction { committed: false }
    }
}

impl Drop for Transaction {
    fn drop(&mut self) {
        if self.committed {
            log::info!("COMMIT");
        } else {
            log::info!("COMMIT");
        }
    }
}

let _tx = Transaction::new();
log::info!("INSERT data");"""

[[test]]
name = "cm_timing"
skip = true
description = "Measure elapsed time"
python = """
import time

class Timer:
    def __enter__(self):
        self.start = time.time()
        return self
    
    def __exit__(self, *args):
        elapsed = time.time() - self.start
        print(f"Elapsed: {elapsed:.4f}s")
        return False

with Timer():
    time.sleep(0.01)
    print("Working")
"""
rust = """
use std::time::Instant;

struct Timer {
    start: Instant,
}

impl Timer {
    fn new() -> Self {
        Timer {
            start: Instant::now(),
        }
    }
}

impl Drop for Timer {
    fn drop(&mut self) {
        let elapsed = self.start.elapsed();
        log::info!("Elapsed: {:.4}s", elapsed.as_secs_f64());
    }
}

let _timer = Timer::new();
std::thread::sleep(std::time::Duration::from_millis(10));
log::info!("Working");"""

[[test]]
name = "cm_temp_state"
skip = true
description = "Save/restore state pattern"
python = """
class TempValue:
    def __init__(self, obj, attr, new_val):
        self.obj = obj
        self.attr = attr
        self.new_val = new_val
    
    def __enter__(self):
        self.old_val = getattr(self.obj, self.attr)
        setattr(self.obj, self.attr, self.new_val)
        print(f"Changed to {self.new_val}")
        return self
    
    def __exit__(self, *args):
        setattr(self.obj, self.attr, self.old_val)
        print(f"Restored to {self.old_val}")
        return False

class Config:
    value = 10

config = Config()
print(f"Before: {config.value}")
with TempValue(config, 'value', 20):
    print(f"During: {config.value}")
print(f"After: {config.value}")
"""
rust = """
struct Config {
    value: i32,
}

struct TempValue<'a> {
    config: &'a mut Config,
    old_val: i32,
}

impl<'a> TempValue<'a> {
    fn new(config: &'a mut Config, new_val: i32) -> Self {
        let old_val = config.value;
        config.value = new_val;
        log::info!("Changed to {}", new_val);
        TempValue { config, old_val }
    }
}

impl<'a> Drop for TempValue<'a> {
    fn drop(&mut self) {
        self.config.value = self.old_val;
        log::info!("Restored to {}", self.old_val);
    }
}

let mut config = Config { value: 10 };
log::info!("Before: {}", config.value);
{
    let _temp = TempValue::new(&mut config, 20);
    log::info!("During: {}", config.value);
}
log::info!("After: {}", config.value);"""

