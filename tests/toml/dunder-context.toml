[[test]]
name = "enter_returns_other"
skip = true
description = "Return managed resource"
python = """
class FileManager:
    def __enter__(self):
        self.file = "file_handle"
        return self.file
    
    def __exit__(self, *args):
        print("Closing file")
        return False

with FileManager() as f:
    print(f"Using: {f}")
"""
rust = """
struct FileManager {
    file: Option<String>,
}

impl FileManager {
    fn new() -> (Self, String) {
        let mgr = FileManager {
            file: Some("file_handle".to_string()),
        };
        let handle = "file_handle".to_string();
        (mgr, handle)
    }
}

impl Drop for FileManager {
    fn drop(&mut self) {
        log::info!("Closing file");
    }
}

let (mgr, f) = FileManager::new();
log::info!("Using: {}", f);
drop(mgr);"""

