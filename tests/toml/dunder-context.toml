[[test]]
name = "cm_reentrant"
skip = true
description = "Nested use of same context manager"
python = """
class Counter:
    def __init__(self):
        self.level = 0
    
    def __enter__(self):
        self.level += 1
        print(f"Level: {self.level}")
        return self
    
    def __exit__(self, *args):
        self.level -= 1
        return False

cm = Counter()
with cm:
    with cm:
        print("Nested")
"""
rust = """
struct Counter {
    level: i32,
}

impl Counter {
    fn new() -> Self {
        Counter { level: 0 }
    }

    fn enter(&mut self) {
        self.level += 1;
        log::info!("Level: {}", self.level);
    }

    fn exit(&mut self) {
        self.level -= 1;
    }
}

let mut cm = Counter::new();
cm.enter();
cm.enter();
log::info!("Nested");
cm.exit();
cm.exit();"""
