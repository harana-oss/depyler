[metadata]
name = "Dunder Context Manager Tests"
category = "dunder-methods"

# =============================================================================
# Basic Context Manager
# =============================================================================

[[test]]
name = "dunder_enter"
skip = true
description = "def __enter__(self): return self"
python = """
class MyContext:
    def __enter__(self):
        print("Entering")
        return self
    
    def __exit__(self, exc_type, exc_val, exc_tb):
        print("Exiting")
        return False

with MyContext() as ctx:
    print("Inside")
"""
rust = """
struct MyContext;

impl MyContext {
    fn enter(&self) {
        log::info!("Entering");
    }
}

impl Drop for MyContext {
    fn drop(&mut self) {
        log::info!("Exiting");
    }
}

let ctx = MyContext;
ctx.enter();
log::info!("Inside");"""

[[test]]
