[[test]]
name = "enter_exception"
skip = true
description = "__exit__ not called if __enter__ raises"
python = """
class FailEnter:
    def __enter__(self):
        print("Trying to enter")
        raise ValueError("Can't enter")
    
    def __exit__(self, *args):
        print("This won't be called")
        return False

try:
    with FailEnter():
        print("Never reached")
except ValueError as e:
    print(f"Caught: {e}")
"""
rust = """
struct FailEnter;

impl FailEnter {
    fn new() -> Result<Self, String> {
        log::info!("Trying to enter");
        Err("Can't enter".to_string())
    }
}

impl Drop for FailEnter {
    fn drop(&mut self) {
        log::info!("This won't be called");
    }
}

match FailEnter::new() {
    Err(e) => log::info!("Caught: {}", e),
    Ok(_) => log::info!("Never reached"),
}"""

