[metadata]
name = "Constant List of Tuples Type Inference Tests"
category = "codegen"
description = "Module-level list constants containing tuples should infer Vec<(T1, T2, ...)>"

[[test]]
name = "list_of_int_tuples"
description = "List of int tuples should be Vec<(i32, i32)>"

python = '''
GOAL_LINE_Y_VALUES = [(0, 113), (113, 226)]
'''

rust = '''
lazy_static::lazy_static! {
    pub static ref GOAL_LINE_Y_VALUES: Vec<(i32, i32)> = vec![(0, 113), (113, 226)];
}
'''

[[test]]
name = "list_of_float_tuples"
description = "List of float tuples should be Vec<(f64, f64)>"

python = '''
COORDINATES = [(1.0, 2.0), (3.0, 4.0)]
'''

rust = '''
lazy_static::lazy_static! {
    pub static ref COORDINATES: Vec<(f64, f64)> = vec![(1.0, 2.0), (3.0, 4.0)];
}
'''

[[test]]
name = "list_of_mixed_tuples"
description = "List of mixed-type tuples should be Vec<(i32, f64)>"

python = '''
MIXED = [(1, 2.5), (3, 4.5)]
'''

rust = '''
lazy_static::lazy_static! {
    pub static ref MIXED: Vec<(i32, f64)> = vec![(1, 2.5), (3, 4.5)];
}
'''

[[test]]
name = "list_of_triple_tuples"
description = "List of 3-element tuples should be Vec<(i32, i32, i32)>"

python = '''
RGB_VALUES = [(255, 0, 0), (0, 255, 0)]
'''

rust = '''
lazy_static::lazy_static! {
    pub static ref RGB_VALUES: Vec<(i32, i32, i32)> = vec![(255, 0, 0), (0, 255, 0)];
}
'''

[[test]]
name = "standalone_tuple_const"
description = "Standalone tuple constant should be pub const with tuple type"

python = '''
POINT = (10, 20)
'''

rust = '''
pub const POINT: (i32, i32) = (10, 20);
'''
