[metadata]
name = "Serialization Tests"
category = "serialization"

# =============================================================================
# Pickle Warning
# =============================================================================

[[test]]
name = "pickle_warning"
description = "Warn about pickle usage"

python = '''
class Data:
    def __init__(self, value: int):
        self.value = value
    
    def to_dict(self) -> dict[str, int]:
        return {"value": self.value}
    
    @staticmethod
    def from_dict(d: dict[str, int]) -> 'Data':
        return Data(d.get("value", 0))
'''

rust = '''
use std::collections::HashMap;

pub struct Data {
    pub value: i32,
}

impl Data {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
    
    pub fn to_dict(&self) -> HashMap<String, i32> {
        let mut m = HashMap::new();
        m.insert("value".to_string(), self.value);
        return m;
    }
    
    pub fn from_dict(d: &HashMap<String, i32>) -> Data {
        return Data::new(*d.get("value").unwrap_or(&0));
    }
}
'''

[[test]]
name = "pickle_alternative"
description = "Alternative to pickle"

python = '''
def serialize_int(value: int) -> str:
    return str(value)

def deserialize_int(s: str) -> int:
    return int(s)
'''

rust = '''
pub fn serialize_int(value: i32) -> String {
    return value.to_string();
}

pub fn deserialize_int(s: &str) -> i32 {
    return s.parse::<i32>().unwrap_or(0);
}
'''

# =============================================================================
# JSON Nested
# =============================================================================

[[test]]
name = "json_nested"
description = "Deep nested JSON structures"

python = '''
def create_nested() -> dict[str, dict[str, int]]:
    return {
        "level1": {
            "level2": 42
        }
    }

def get_nested(data: dict[str, dict[str, int]], k1: str, k2: str) -> int:
    if k1 in data and k2 in data[k1]:
        return data[k1][k2]
    return 0
'''

rust = '''
use std::collections::HashMap;

pub fn create_nested() -> HashMap<String, HashMap<String, i32>> {
    let mut inner = HashMap::new();
    inner.insert("level2".to_string(), 42);
    let mut outer = HashMap::new();
    outer.insert("level1".to_string(), inner);
    return outer;
}

pub fn get_nested(data: &HashMap<String, HashMap<String, i32>>, k1: &str, k2: &str) -> i32 {
    if let Some(inner) = data.get(k1) {
        if let Some(&value) = inner.get(k2) {
            return value;
        }
    }
    return 0;
}
'''

[[test]]
name = "json_list_of_objects"
description = "JSON array of objects"

python = '''
def create_list_objects() -> list[dict[str, int]]:
    return [
        {"id": 1, "value": 10},
        {"id": 2, "value": 20}
    ]

def sum_values(items: list[dict[str, int]]) -> int:
    total = 0
    for item in items:
        total += item.get("value", 0)
    return total
'''

rust = '''
use std::collections::HashMap;

pub fn create_list_objects() -> Vec<HashMap<String, i32>> {
    let mut item1 = HashMap::new();
    item1.insert("id".to_string(), 1);
    item1.insert("value".to_string(), 10);
    
    let mut item2 = HashMap::new();
    item2.insert("id".to_string(), 2);
    item2.insert("value".to_string(), 20);
    
    return vec![item1, item2];
}

pub fn sum_values(items: &Vec<HashMap<String, i32>>) -> i32 {
    let mut total = 0;
    for item in items {
        total += item.get("value").unwrap_or(&0);
    }
    return total;
}
'''

# =============================================================================
# JSON Custom Encoder
# =============================================================================

[[test]]
name = "json_custom_encoder"
description = "Custom JSON encoder handling"

python = '''
class Point:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y
    
    def to_json(self) -> dict[str, int]:
        return {"x": self.x, "y": self.y}
    
    @staticmethod
    def from_json(data: dict[str, int]) -> 'Point':
        return Point(data.get("x", 0), data.get("y", 0))
'''

rust = '''
use std::collections::HashMap;

pub struct Point {
    pub x: i32,
    pub y: i32,
}

impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
    
    pub fn to_json(&self) -> HashMap<String, i32> {
        let mut m = HashMap::new();
        m.insert("x".to_string(), self.x);
        m.insert("y".to_string(), self.y);
        return m;
    }
    
    pub fn from_json(data: &HashMap<String, i32>) -> Point {
        return Point::new(
            *data.get("x").unwrap_or(&0),
            *data.get("y").unwrap_or(&0)
        );
    }
}
'''

[[test]]
name = "json_encoder_datetime"
description = "Datetime JSON encoding"

python = '''
class Timestamp:
    def __init__(self, year: int, month: int, day: int):
        self.year = year
        self.month = month
        self.day = day
    
    def to_string(self) -> str:
        return f"{self.year}-{self.month:02d}-{self.day:02d}"
    
    @staticmethod
    def parse(s: str) -> 'Timestamp':
        parts = s.split("-")
        return Timestamp(int(parts[0]), int(parts[1]), int(parts[2]))
'''

rust = '''
pub struct Timestamp {
    pub year: i32,
    pub month: i32,
    pub day: i32,
}

impl Timestamp {
    pub fn new(year: i32, month: i32, day: i32) -> Self {
        Self { year, month, day }
    }
    
    pub fn to_string(&self) -> String {
        return format!("{}-{:02}-{:02}", self.year, self.month, self.day);
    }
    
    pub fn parse(s: &str) -> Timestamp {
        let parts: Vec<&str> = s.split('-').collect();
        return Timestamp::new(
            parts[0].parse().unwrap_or(0),
            parts[1].parse().unwrap_or(0),
            parts[2].parse().unwrap_or(0)
        );
    }
}
'''

# =============================================================================
# YAML Support
# =============================================================================

[[test]]
name = "yaml_support"
description = "YAML serialization"

python = '''
def yaml_to_dict(yaml_str: str) -> dict[str, str]:
    result = {}
    for line in yaml_str.split("\n"):
        if ":" in line:
            parts = line.split(":", 1)
            key = parts[0].strip()
            value = parts[1].strip()
            result[key] = value
    return result
'''

rust = '''
use std::collections::HashMap;

pub fn yaml_to_dict(yaml_str: &str) -> HashMap<String, String> {
    let mut result = HashMap::new();
    for line in yaml_str.lines() {
        if let Some(idx) = line.find(':') {
            let key = line[..idx].trim().to_string();
            let value = line[idx+1..].trim().to_string();
            result.insert(key, value);
        }
    }
    return result;
}
'''

[[test]]
name = "yaml_list"
description = "YAML list parsing"

python = '''
def parse_yaml_list(yaml_str: str) -> list[str]:
    result = []
    for line in yaml_str.split("\n"):
        line = line.strip()
        if line.startswith("- "):
            result.append(line[2:])
    return result
'''

rust = '''
pub fn parse_yaml_list(yaml_str: &str) -> Vec<String> {
    let mut result = vec![];
    for line in yaml_str.lines() {
        let line = line.trim();
        if line.starts_with("- ") {
            result.push(line[2..].to_string());
        }
    }
    return result;
}
'''

# =============================================================================
# TOML Support
# =============================================================================

[[test]]
name = "toml_support"
description = "TOML serialization"

python = '''
def parse_toml_section(toml_str: str, section: str) -> dict[str, str]:
    result = {}
    in_section = False
    for line in toml_str.split("\n"):
        line = line.strip()
        if line.startswith("[") and line.endswith("]"):
            in_section = line[1:-1] == section
        elif in_section and "=" in line:
            parts = line.split("=", 1)
            key = parts[0].strip()
            value = parts[1].strip().strip('"')
            result[key] = value
    return result
'''

rust = '''
use std::collections::HashMap;

pub fn parse_toml_section(toml_str: &str, section: &str) -> HashMap<String, String> {
    let mut result = HashMap::new();
    let mut in_section = false;
    for line in toml_str.lines() {
        let line = line.trim();
        if line.starts_with('[') && line.ends_with(']') {
            in_section = &line[1..line.len()-1] == section;
        } else if in_section {
            if let Some(idx) = line.find('=') {
                let key = line[..idx].trim().to_string();
                let value = line[idx+1..].trim().trim_matches('"').to_string();
                result.insert(key, value);
            }
        }
    }
    return result;
}
'''

[[test]]
name = "toml_key_value"
description = "TOML key-value parsing"

python = '''
def parse_toml_value(line: str) -> tuple[str, str]:
    if "=" in line:
        parts = line.split("=", 1)
        key = parts[0].strip()
        value = parts[1].strip().strip('"')
        return (key, value)
    return ("", "")
'''

rust = '''
pub fn parse_toml_value(line: &str) -> (String, String) {
    if let Some(idx) = line.find('=') {
        let key = line[..idx].trim().to_string();
        let value = line[idx+1..].trim().trim_matches('"').to_string();
        return (key, value);
    }
    return (String::new(), String::new());
}
'''
