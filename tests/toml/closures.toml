# Closures Tests - Functions capturing free variables
# Rust Mapping: Move/borrow closures

[metadata]
name = "Closures Tests"
category = "decorators-closures"

# =============================================================================
# Basic Closures
# =============================================================================

[[test]]
name = "closure_basic"
description = "Test simple closure - inner function accesses outer's variable"
python = '''
def outer():
    x = 1
    def inner():
        return x
    return inner

result = outer()()
assert result == 1
'''

[[test]]
name = "closure_capture"
description = "Test closure captures variable from enclosing scope"
python = '''
def outer():
    message = "hello"
    def inner():
        return message + " world"
    return inner

f = outer()
result = f()
assert result == "hello world"
'''

[[test]]
name = "closure_return"
description = "Test outer returns inner, inner still accesses x after outer finishes"
python = '''
def make_greeter(name):
    greeting = "Hello"
    def greet():
        return f"{greeting}, {name}!"
    return greet

greet_alice = make_greeter("Alice")
greet_bob = make_greeter("Bob")
assert greet_alice() == "Hello, Alice!"
assert greet_bob() == "Hello, Bob!"
'''

[[test]]
name = "closure_call"
description = "Test f = outer(); f() returns captured value"
python = '''
def outer():
    x = 42
    def inner():
        return x * 2
    return inner

f = outer()
result = f()
assert result == 84
'''

# =============================================================================
# Closure Scope
# =============================================================================

[[test]]
name = "closure_multi_capture"
description = "Test closure captures multiple variables from outer scope"
python = '''
def outer():
    x = 10
    y = 20
    z = 30
    def inner():
        return x + y + z
    return inner

f = outer()
result = f()
assert result == 60
'''

[[test]]
name = "closure_nested"
description = "Test nested closures - closure inside closure"
python = '''
def outer(x):
    def middle(y):
        def inner(z):
            return x + y + z
        return inner
    return middle

f = outer(1)(2)(3)
assert f == 6
'''

[[test]]
name = "closure_multi_level"
description = "Test inner closure captures from multiple nesting levels"
python = '''
def level1():
    a = 1
    def level2():
        b = 2
        def level3():
            c = 3
            return a + b + c
        return level3
    return level2

result = level1()()()
assert result == 6
'''

# =============================================================================
# Closure vs Parameter
# =============================================================================

[[test]]
name = "closure_vs_param"
description = "Test closure captures from scope, parameter receives at call time"
python = '''
def outer(x):
    def with_closure():
        return x * 2
    def with_param(y):
        return y * 2
    return with_closure, with_param

closure_fn, param_fn = outer(5)
assert closure_fn() == 10  # Uses captured x
assert param_fn(7) == 14   # Uses passed y
'''

[[test]]
name = "closure_and_param"
description = "Test closure with both captured variable and parameter"
python = '''
def outer(x):
    def inner(y):
        return x + y
    return inner

add_10 = outer(10)
assert add_10(5) == 15
assert add_10(20) == 30
'''

# =============================================================================
# Closures in Loops
# =============================================================================

[[test]]
name = "closure_loop_gotcha"
description = "Test closure in loop captures last value (common gotcha)"
python = '''
# All lambdas capture the same 'i', which ends at 2
funcs = [lambda: i for i in range(3)]
results = [f() for f in funcs]
# All return 2 because i = 2 after loop
assert results == [2, 2, 2]
'''

[[test]]
name = "closure_loop_fix_default"
description = "Test closure loop fix using default argument"
python = '''
# Default argument binds at definition time
funcs = [lambda i=i: i for i in range(3)]
results = [f() for f in funcs]
assert results == [0, 1, 2]
'''

[[test]]
name = "closure_loop_fix_partial"
description = "Test closure loop fix using functools.partial"
python = '''
from functools import partial

def return_value(x):
    return x

# partial binds the argument at creation time
funcs = [partial(return_value, i) for i in range(3)]
results = [f() for f in funcs]
assert results == [0, 1, 2]
'''

# =============================================================================
# Closure Use Cases
# =============================================================================

[[test]]
name = "closure_factory"
description = "Test factory function returning customized closure"
python = '''
def make_adder(n):
    def adder(x):
        return x + n
    return adder

add_5 = make_adder(5)
add_10 = make_adder(10)
assert add_5(3) == 8
assert add_10(3) == 13
'''

[[test]]
name = "closure_counter"
description = "Test closure maintaining state as a counter"
python = '''
def make_counter():
    count = [0]  # Use list to allow mutation
    def counter():
        count[0] += 1
        return count[0]
    return counter

c1 = make_counter()
c2 = make_counter()
assert c1() == 1
assert c1() == 2
assert c2() == 1  # Independent counter
assert c1() == 3
'''

[[test]]
name = "closure_accumulator"
description = "Test closure accumulating values over time"
python = '''
def make_accumulator():
    values = []
    def accumulate(value):
        values.append(value)
        return sum(values)
    return accumulate

acc = make_accumulator()
assert acc(10) == 10
assert acc(20) == 30
assert acc(5) == 35
'''

[[test]]
name = "closure_callback"
description = "Test callback function capturing context from enclosing scope"
python = '''
def process_data(data, multiplier):
    def callback(x):
        return x * multiplier
    return [callback(item) for item in data]

result = process_data([1, 2, 3], 10)
assert result == [10, 20, 30]
'''

# =============================================================================
# __closure__ Attribute
# =============================================================================

[[test]]
name = "closure_attribute"
description = "Test __closure__ attribute contains cell objects for free variables"
python = '''
def outer(x):
    y = 2
    def inner():
        return x + y
    return inner

f = outer(10)
# f.__closure__ is a tuple of cell objects
assert f.__closure__ is not None
assert len(f.__closure__) == 2  # Two captured variables: x and y
'''

[[test]]
name = "closure_cell_contents"
description = "Test accessing captured values via cell_contents"
python = '''
def outer(x):
    def inner():
        return x * 2
    return inner

f = outer(5)
# Access the captured value through the cell
assert f.__closure__[0].cell_contents == 5
assert f() == 10
'''

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "closure_no_free"
description = "Test function with no free variables has no closure"
python = '''
def outer():
    def inner():
        return 42  # No captured variables
    return inner

f = outer()
# No free variables, so __closure__ is None
assert f.__closure__ is None or f.__closure__ == ()
assert f() == 42
'''

[[test]]
name = "closure_class_var"
description = "Test closure in method can capture class/instance variables"
python = '''
class Counter:
    def __init__(self):
        self.count = 0
    
    def make_incrementer(self, step):
        def increment():
            self.count += step
            return self.count
        return increment

c = Counter()
inc = c.make_incrementer(5)
assert inc() == 5
assert inc() == 10
assert c.count == 10
'''

[[test]]
name = "closure_global"
description = "Test global variables are not in __closure__"
python = '''
global_var = 100

def outer():
    local_var = 10
    def inner():
        # Uses global (not captured) and local_var (captured)
        return global_var + local_var
    return inner

f = outer()
assert f() == 110
# Only local_var is in closure, not global_var
assert len(f.__closure__) == 1
assert f.__closure__[0].cell_contents == 10
'''
