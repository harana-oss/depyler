#[derive(Debug, Clone, PartialEq, Default)]
pub struct Numbers {
    pub factor: Option<i32>,
}
impl Numbers {
    pub fn new(factor: Option<i32>) -> Self {
        Self { factor }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
