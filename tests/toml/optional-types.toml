[[test]]
name = "optional_string_or_default"
description = "Optional string with 'or' default pattern"

python = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Person:
    name: Optional[str]

def get_name(p: Person) -> str:
    return p.name or "Unknown"
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Person {
    pub name: Option<String>,
}
impl Person {
    pub fn new(name: Option<String>) -> Self {
        Self { name }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "name" => Some(Box::new(self.name.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "name" => {
                if let Some(v) = value.downcast_ref::<Option<String>>() {
                    self.name = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn get_name(p: &Person) -> String {
    return p.name.clone().clone().unwrap_or_else(|| "Unknown".to_string());
}
'''

