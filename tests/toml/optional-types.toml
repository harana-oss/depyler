[[test]]
name = "optional_param"
description = "Optional parameter type"

python = '''
from typing import Optional

def greet(name: Optional[str]) -> str:
    if name is None:
        return "Hello, stranger"
    return f"Hello, {name}"
'''

rust = '''
pub fn greet(name: &Option<String>) -> String {
    if name.is_none() {
        return "Hello, stranger".to_string();
    }
    return format!("Hello, {}", {
        match &name {
            Some(v) => format!("{}", v),
            None => "None".to_string(),
        }
    });
}
'''

[[test]]
name = "optional_return"
description = "Optional return type"

python = '''
from typing import Optional

def find_item(items: list[int], target: int) -> Optional[int]:
    for item in items:
        if item == target:
            return item
    return None
'''

rust = '''
pub fn find_item(items: &Vec<i32>, target: i32) -> Option<i32> {
    for item in items.iter().cloned() {
        if item == target {
            return Some(item);
        }
    }
    return None;
}
'''

