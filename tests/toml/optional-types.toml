compile_check = true

[test.python]
code = '''
from typing import Optional

class Player:
    def __init__(self, name: str, score: int):
        self.name = name
        self.score = score

def find_player(players: list[Player], name: str) -> Optional[Player]:
    for p in players:
        if p.name == name:
            return p
    return None

def update_score(players: list[Player], name: str, bonus: int) -> None:
    player = find_player(players, name)
    if player is not None:
        player.score = player.score + bonus
'''

