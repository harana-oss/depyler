name = "optional_var_multiple_uses"
description = "Optional variable used multiple times avoids move errors"
tags = ["optional", "borrow", "unwrap"]
compile_check = true

[test.python]
code = '''
from typing import Optional

def get_value() -> Optional[str]:
    return "test"

def process_twice() -> str:
    value = get_value()
    if value is not None:
        first = value.upper()
        second = value.lower()
        return first + second
    return ""
'''

[test.assertions]
# Uses as_ref().unwrap() or clone().unwrap() to allow multiple uses
contains_any = [[".as_ref().unwrap()", ".clone().unwrap()", ".clone()"]]

[[test]]
name = "optional_var_push_to_list"
description = "Optional variable pushed to list uses clone().unwrap()"
tags = ["optional", "list", "push"]
compile_check = true

[test.python]
code = '''
from typing import Optional

class Item:
    def __init__(self, name: str):
        self.name = name

def find_item(name: str) -> Optional[Item]:
    if name:
        return Item(name)
    return None

def collect_items(names: list[str]) -> list[Item]:
    items: list[Item] = []
    for name in names:
        item = find_item(name)
        if item is not None:
            items.append(item)
    return items
'''

[test.assertions]
contains = [".push("]
contains_any = [[".clone().unwrap()", ".unwrap()"]]

