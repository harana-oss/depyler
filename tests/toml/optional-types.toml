# Optional Type Tests - Migrated from test_optional_*.rs files

[metadata]
name = "Optional Type Tests"
category = "optional-types"

# =============================================================================
# Basic Optional
# =============================================================================

[[test]]
name = "optional_param"
description = "Optional parameter type"
tags = ["optional", "parameter"]

[test.python]
code = '''
from typing import Optional

def greet(name: Optional[str]) -> str:
    if name is None:
        return "Hello, stranger"
    return f"Hello, {name}"
'''

[test.assertions]
contains = ["Option<String>"]

[[test]]
name = "optional_return"
description = "Optional return type"
tags = ["optional", "return"]

[test.python]
code = '''
from typing import Optional

def find_item(items: list[int], target: int) -> Optional[int]:
    for item in items:
        if item == target:
            return item
    return None
'''

[test.assertions]
contains = ["Option<"]
contains_any = [["Some(", "None"]]

# =============================================================================
# None Checks
# =============================================================================

[[test]]
name = "optional_is_none"
description = "Check if value is None"
tags = ["optional", "none"]

[test.python]
code = '''
from typing import Optional

def is_empty(value: Optional[str]) -> bool:
    return value is None
'''

[test.assertions]
contains = [".is_none()"]

[[test]]
name = "optional_is_not_none"
description = "Check if value is not None"
tags = ["optional", "some"]

[test.python]
code = '''
from typing import Optional

def has_value(value: Optional[str]) -> bool:
    return value is not None
'''

[test.assertions]
contains = [".is_some()"]

# =============================================================================
# Optional Unwrapping
# =============================================================================

[[test]]
name = "optional_unwrap_or"
description = "Unwrap with default value"
tags = ["optional", "unwrap"]

[test.python]
code = '''
from typing import Optional

def get_or_default(value: Optional[int]) -> int:
    return value if value is not None else 0
'''

[test.assertions]
contains_any = [["unwrap_or(0)", "unwrap_or_default()"]]

[[test]]
name = "optional_unwrap_or_default"
description = "Unwrap with type default"
tags = ["optional", "unwrap"]

[test.python]
code = '''
from typing import Optional

def safe_string(value: Optional[str]) -> str:
    return value if value is not None else ""
'''

[test.assertions]
contains_any = [["unwrap_or_default()", "unwrap_or("]]

[[test]]
name = "optional_if_let"
description = "if let pattern for Optional"
tags = ["optional", "pattern"]

[test.python]
code = '''
from typing import Optional

def process(value: Optional[int]) -> int:
    if value is not None:
        return value * 2
    return 0
'''

[test.assertions]
contains_any = [["if let Some(", "match", "is_some()"]]

# =============================================================================
# Optional with Operations
# =============================================================================

[[test]]
name = "optional_arithmetic"
description = "Arithmetic on optional value"
tags = ["optional", "arithmetic"]

[test.python]
code = '''
from typing import Optional

def double(value: Optional[int]) -> Optional[int]:
    if value is None:
        return None
    return value * 2
'''

[test.assertions]
contains_any = [[".map(|v| v * 2)", "Some(value * 2)", "Some("]]

[[test]]
name = "optional_method_call"
description = "Method call on optional value"
tags = ["optional", "method"]

[test.python]
code = '''
from typing import Optional

def upper(value: Optional[str]) -> Optional[str]:
    if value is None:
        return None
    return value.upper()
'''

[test.assertions]
contains_any = [[".map(|v| v.to_uppercase())", "Some("]]

# =============================================================================
# Optional in Collections
# =============================================================================

[[test]]
name = "optional_in_list"
description = "Optional values in list"
tags = ["optional", "list"]

[test.python]
code = '''
from typing import Optional, List

def filter_none(items: List[Optional[int]]) -> List[int]:
    return [x for x in items if x is not None]
'''

[test.assertions]
contains_any = [["filter_map", "flatten", "filter("]]

# =============================================================================
# Optional Default Values
# =============================================================================

[[test]]
name = "optional_default_param"
description = "Optional parameter with default"
tags = ["optional", "default"]

[test.python]
code = '''
from typing import Optional

def greet(name: Optional[str] = None) -> str:
    if name is None:
        return "Hello!"
    return f"Hello, {name}!"
'''

[test.assertions]
contains = ["Option<"]

# =============================================================================
# Optional Chaining
# =============================================================================

[[test]]
name = "optional_and_then"
description = "Chaining optional operations"
tags = ["optional", "chain"]

[test.python]
code = '''
from typing import Optional

def parse_and_double(s: Optional[str]) -> Optional[int]:
    if s is None:
        return None
    return int(s) * 2
'''

[test.assertions]
contains_any = [["and_then", "map", "Some("]]

# =============================================================================
# Optional with 'or' Pattern (from test_optional_default_values.rs)
# =============================================================================

[[test]]
name = "optional_string_or_default"
description = "Optional string with 'or' default pattern"
tags = ["optional", "or", "default"]

[test.python]
code = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Person:
    name: Optional[str]

def get_name(p: Person) -> str:
    return p.name or "Unknown"
'''

[test.assertions]
contains_any = [["unwrap_or_else", "unwrap_or("]]

[[test]]
name = "optional_variable_or_default"
description = "Optional variable with 'or' default"
tags = ["optional", "or", "default"]

[test.python]
code = '''
from typing import Optional

def get_value(x: Optional[str]) -> str:
    return x or "default"
'''

[test.assertions]
contains_any = [["unwrap_or_else", "unwrap_or("]]

[[test]]
name = "optional_int_or_default"
description = "Optional int with 'or' default zero"
tags = ["optional", "or", "default"]

[test.python]
code = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Counter:
    value: Optional[int]

def get_value(c: Counter) -> int:
    return c.value or 0
'''

[test.assertions]
contains_any = [["unwrap_or_else", "unwrap_or(0)"]]

[[test]]
name = "chained_optional_or"
description = "Chained optional 'or' expressions"
tags = ["optional", "or", "chain"]

[test.python]
code = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Person:
    nickname: Optional[str]
    name: Optional[str]

def get_display(p: Person) -> str:
    return p.nickname or p.name or "Anonymous"
'''

[test.assertions]
contains_any = [["or_else", "unwrap_or"]]

[[test]]
name = "non_optional_or_unchanged"
description = "Non-optional 'or' remains boolean operator"
tags = ["optional", "boolean"]

[test.python]
code = '''
def check_flags(a: bool, b: bool) -> bool:
    return a or b
'''

[test.assertions]
contains = ["||"]
not_contains = ["unwrap_or_else"]

[[test]]
name = "optional_or_in_assignment"
description = "Optional 'or' in variable assignment"
tags = ["optional", "or", "assignment"]

[test.python]
code = '''
from typing import Optional

def process(name: Optional[str]) -> str:
    result = name or "fallback"
    return result
'''

[test.assertions]
contains_any = [["unwrap_or_else", "unwrap_or("]]

[[test]]
name = "optional_field_or_method"
description = "Optional field with 'or' default string"
tags = ["optional", "or", "field"]

[test.python]
code = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Config:
    prefix: Optional[str]

def get_prefix(c: Config) -> str:
    return c.prefix or "default_"
'''

[test.assertions]
contains_any = [["unwrap_or_else", "unwrap_or("]]

