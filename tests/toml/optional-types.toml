[[test]]
name = "chained_optional_or"
description = "Chained optional 'or' expressions"

python = '''
from dataclasses import dataclass
from typing import Optional

@dataclass
class Person:
    nickname: Optional[str]
    name: Optional[str]

def get_display(p: Person) -> str:
    return p.nickname or p.name or "Anonymous"
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Person {
    pub nickname: Option<String>,
    pub name: Option<String>,
}
impl Person {
    pub fn new(nickname: Option<String>, name: Option<String>) -> Self {
        Self { nickname, name }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "nickname" => Some(Box::new(self.nickname.clone()) as Box<dyn std::any::Any>),
            "name" => Some(Box::new(self.name.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "nickname" => {
                if let Some(v) = value.downcast_ref::<Option<String>>() {
                    self.nickname = v.clone();
                    true
                } else {
                    false
                }
            }
            "name" => {
                if let Some(v) = value.downcast_ref::<Option<String>>() {
                    self.name = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn get_display(p: &Person) -> String {
    return p
        .nickname
        .clone()
        .clone()
        .or_else(|| p.name.clone().clone())
        .unwrap_or_else(|| "Anonymous".to_string());
}
'''

