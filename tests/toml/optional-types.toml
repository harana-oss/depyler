# Optional Type Tests - Migrated from test_optional_*.rs files

[metadata]
name = "Optional Type Tests"
category = "optional-types"

# =============================================================================
# Basic Optional
# =============================================================================

[[test]]
name = "optional_param"
description = "Optional parameter type"
tags = ["optional", "parameter"]

[test.python]
code = '''
from typing import Optional

def greet(name: Optional[str]) -> str:
    if name is None:
        return "Hello, stranger"
    return f"Hello, {name}"
'''

[test.assertions]
contains = ["Option<String>"]

[[test]]
name = "optional_return"
description = "Optional return type"
tags = ["optional", "return"]

[test.python]
code = '''
from typing import Optional

def find_item(items: list[int], target: int) -> Optional[int]:
    for item in items:
        if item == target:
            return item
    return None
'''

[test.assertions]
contains = ["Option<"]
contains_any = [["Some(", "None"]]

