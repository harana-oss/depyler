    pub fn new(score: i32, bonus: i32, total_statistics: PlayerStatistics) -> Self {
        Self {
            score,
            bonus,
            total_statistics,
        }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct TeamStats {
    pub player_statistics: Vec<PlayerStatistics>,
}
impl TeamStats {
    pub fn new(player_statistics: Vec<PlayerStatistics>) -> Self {
        Self {
            player_statistics,
        }
    }
}
pub fn _create_player_statistics(player: &Player) -> PlayerStatistics {
    return PlayerStatistics::new(player.score + player.bonus, "total".to_string());
}
pub fn build_team_stats(player: &mut Player) -> TeamStats {
    let team_stats = TeamStats::new(vec![]);
    let total_statistics = _create_player_statistics(player);
    player.total_statistics = total_statistics.clone();
    team_stats.player_statistics.push(total_statistics);
    return team_stats;
}
