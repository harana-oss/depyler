    pub fn new(total_score: i32, label: String) -> Self {
        Self { total_score, label }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub score: i32,
    pub bonus: i32,
    pub total_statistics: PlayerStatistics,
}
