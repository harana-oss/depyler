# =============================================================================
# Chained mutating calls (A mutates, then calls B which also mutates)
# =============================================================================

[[test]]
name = "call_site_chained_mut_calls"
description = "Function that mutates then calls another mutating function"

python = '''
from dataclasses import dataclass

@dataclass
class Score:
    points: int

def double_score(score: Score) -> int:
    score.points = score.points * 2
    return score.points

def triple_and_double(score: Score) -> int:
    score.points = score.points * 3
    return double_score(score)

def compute() -> int:
    s = Score(points=5)
    return triple_and_double(s)
'''

rust = '''
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Score {
    pub points: i32,
}
impl Score {
    pub fn new(points: i32) -> Self {
        Self { points }
    }
}
pub fn double_score(score: &mut Score) -> i32 {
    score.points *= 2;
    return score.points;
}
pub fn triple_and_double(score: &mut Score) -> i32 {
    score.points *= 3;
    return double_score(score);
}
pub fn compute() -> i32 {
    let mut s = Score::new(5);
    return triple_and_double(&mut s);
}
'''

# =============================================================================
# Mutating call inside a list comprehension (maps to .map() closure)
# =============================================================================

[[test]]
name = "call_site_mut_ref_in_list_comprehension"
description = "Mutating function called in list comprehension requires &mut at call site"

python = '''
from dataclasses import dataclass

@dataclass
class Counter:
    value: int

def bump(c: Counter) -> int:
    c.value = c.value + 1
    return c.value

def collect_bumps(n: int) -> list[int]:
    c = Counter(value=0)
    return [bump(c) for _ in range(n)]
'''

rust = '''
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Counter {
    pub value: i32,
}
impl Counter {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
pub fn bump(c: &mut Counter) -> i32 {
    c.value += 1;
    return c.value;
}
pub fn collect_bumps(n: i32) -> Vec<i32> {
    let mut c = Counter::new(0);
    return (0..n).map(|_| bump(&mut c)).collect::<Vec<_>>();
}
'''

