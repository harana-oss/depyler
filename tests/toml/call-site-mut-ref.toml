[[test]]
name = "call_site_mut_ref_list_append"
description = "Call site passes &mut for function that appends to a list"

python = '''
from dataclasses import dataclass

@dataclass
class Inventory:
    items: list[str]

def add_item(inventory: Inventory, item: str) -> None:
    inventory.items.append(item)

def build_inventory() -> int:
    inv = Inventory(items=[])
    add_item(inv, "sword")
    add_item(inv, "shield")
    return len(inv.items)
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Inventory {
    pub items: Vec<String>,
}
impl Inventory {
    pub fn new(items: Vec<String>) -> Self {
        Self { items }
    }
}
pub fn add_item(inventory: &mut Inventory, item: String) {
    inventory.items.push(item);
}
pub fn build_inventory() -> i32 {
    let mut inv = Inventory::new(vec![]);
    add_item(&mut inv, "sword".to_string());
    add_item(&mut inv, "shield".to_string());
    return inv.items.len() as i32 as i32;
}
'''

# =============================================================================
# Mutating call inside an if-body — caller must still use let mut and &mut
# =============================================================================

[[test]]
name = "call_site_mut_ref_inside_if_body"
description = "Mutating function called conditionally still requires &mut at call site"

python = '''
from dataclasses import dataclass

@dataclass
class Counter:
    value: int

def increment(c: Counter) -> None:
    c.value = c.value + 1

def maybe_bump() -> int:
    counter = Counter(value=0)
    flag = True
    if flag:
        increment(counter)
    return counter.value
'''

rust = '''
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Counter {
    pub value: i32,
}
impl Counter {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
pub fn increment(c: &mut Counter) {
    c.value += 1;
}
pub fn maybe_bump() -> i32 {
    let mut counter = Counter::new(0);
    let flag = true;
    if flag {
        increment(&mut counter);
    }
    return counter.value;
}
'''

# =============================================================================
# Mutating call inside a for-loop body
# =============================================================================

[[test]]
name = "call_site_mut_ref_inside_for_loop"
description = "Mutating function called in a for-loop requires &mut at call site"

python = '''
from dataclasses import dataclass

@dataclass
class Tally:
    count: int

def add_to_tally(tally: Tally, amount: int) -> None:
    tally.count = tally.count + amount

def count_items(items: list[int]) -> int:
    tally = Tally(count=0)
    for item in items:
        add_to_tally(tally, item)
    return tally.count
'''

rust = '''
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Tally {
    pub count: i32,
}
impl Tally {
    pub fn new(count: i32) -> Self {
        Self { count }
    }
}
pub fn add_to_tally(tally: &mut Tally, amount: i32) {
    tally.count += amount;
}
pub fn count_items(items: &Vec<i32>) -> i32 {
    let mut tally = Tally::new(0);
    for item in items.iter().cloned() {
        add_to_tally(&mut tally, item);
    }
    return tally.count;
}
'''

