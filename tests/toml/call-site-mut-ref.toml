[[test]]
name = "call_site_mut_ref_transitive_via_alias"
description = "Caller gets &mut when callee mutates param through a field-access alias"

python = '''
from dataclasses import dataclass

@dataclass
class Inner:
    value: int

@dataclass
class State:
    data: Inner

def mutate_via_alias(state: State) -> None:
    alias = state.data
    alias.value = 42

def caller(state: State) -> None:
    mutate_via_alias(state)
'''

