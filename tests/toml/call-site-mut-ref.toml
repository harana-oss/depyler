# =============================================================================
# Variable used in both attribute assignment and method call — needs clone
# =============================================================================

[[test]]
name = "clone_var_used_in_attr_assign_and_push"
description = "Variable assigned to struct field AND pushed to list needs .clone() on earlier use"

python = '''
from dataclasses import dataclass

@dataclass
class PlayerStatistics:
    total_score: int
    label: str

@dataclass
class Player:
    score: int
    bonus: int
    total_statistics: PlayerStatistics

@dataclass
class TeamStats:
    player_statistics: list[PlayerStatistics]

def _create_player_statistics(player: Player) -> PlayerStatistics:
    return PlayerStatistics(total_score=player.score + player.bonus, label="total")

def build_team_stats(player: Player) -> TeamStats:
    team_stats = TeamStats(player_statistics=[])
    total_statistics = _create_player_statistics(player)
    player.total_statistics = total_statistics
    team_stats.player_statistics.append(total_statistics)
    return team_stats
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct PlayerStatistics {
    pub total_score: i32,
    pub label: String,
}
