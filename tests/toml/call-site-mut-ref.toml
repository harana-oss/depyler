[[test]]
name = "call_site_mut_ref_comprehension_field_assign"
description = "Mutating function in comprehension assigned to struct field"

python = '''
from dataclasses import dataclass

@dataclass
class PlayerStatistics:
    total_score: int

@dataclass
class Player:
    score: int
    bonus: int
    period_statistics: list[PlayerStatistics]

def _create_player_statistics(player: Player) -> PlayerStatistics:
    player.score = player.score + player.bonus
    return PlayerStatistics(total_score=player.score)

def init_periods(player: Player, num_periods: int) -> None:
    player.period_statistics = [_create_player_statistics(player) for _ in range(num_periods)]

def setup_player() -> Player:
    player = Player(score=10, bonus=5, period_statistics=[])
    init_periods(player, 3)
    return player
'''

rust = '''
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct PlayerStatistics {
    pub total_score: i32,
}
impl PlayerStatistics {
    pub fn new(total_score: i32) -> Self {
        Self { total_score }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub score: i32,
    pub bonus: i32,
    pub period_statistics: Vec<PlayerStatistics>,
}
impl Player {
    pub fn new(score: i32, bonus: i32, period_statistics: Vec<PlayerStatistics>) -> Self {
        Self {
            score,
            bonus,
            period_statistics,
        }
    }
}
pub fn _create_player_statistics(player: &mut Player) -> PlayerStatistics {
    player.score += player.bonus;
    return PlayerStatistics::new(player.score);
}
pub fn init_periods(player: &mut Player, num_periods: i32) {
    player.period_statistics = (0..num_periods)
        .map(|_| _create_player_statistics(player))
        .collect::<Vec<_>>();
}
pub fn setup_player() -> Player {
    let mut player = Player::new(10, 5, vec![]);
    init_periods(&mut player, 3);
    return player;
}
'''

# =============================================================================
# Loop variable needs `mut` when passed to function expecting &mut
# =============================================================================

[[test]]
name = "call_site_for_loop_var_mut_for_mut_ref_call"
description = "Loop variable from .iter().cloned() must be mut when passed to &mut function"

python = '''
from dataclasses import dataclass

@dataclass
class Player:
    score: int

def add_bonus(player: Player) -> None:
    player.score = player.score + 10

def process_players(players: list[Player]) -> int:
    total: int = 0
    for player in players:
        add_bonus(player)
        total = total + player.score
    return total
'''

rust = '''
#[derive(Debug, Copy, Clone, PartialEq, Default)]
pub struct Player {
    pub score: i32,
}
impl Player {
    pub fn new(score: i32) -> Self {
        Self { score }
    }
}
pub fn add_bonus(player: &mut Player) {
    player.score += 10;
}
pub fn process_players(players: &Vec<Player>) -> i32 {
    let mut total: i32 = 0;
    for mut player in players.iter().cloned() {
        add_bonus(&mut player);
        total += player.score;
    }
    return total;
}
'''

