[[test]]
name = "lambda_in_comprehension"
description = "Lambda in list comprehension"
tags = ["lambda", "comprehension"]

python = '''
def process_items(items: list) -> list:
    transform = lambda x: x * 2
    return [transform(item) for item in items]
'''

rust = '''
use serde_json;
pub fn process_items(items: &Vec<serde_json::Value>) -> Vec<serde_json::Value> {
    let transform = |x| x * 2;
    return items
        .clone()
        .into_iter()
        .map(|item| transform(item))
        .collect::<Vec<_>>();
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_process_items_examples() {
        assert_eq!(process_items(vec![]), vec![]);
        assert_eq!(process_items(vec![1]), vec![1]);
    }
}
'''

[[test]]
name = "lambda_distance_calc"
description = "Lambda with complex math expression"
tags = ["lambda", "math"]

python = '''
def calculate_distances(points: list) -> list:
    return list(map(lambda p: (p[0] ** 2 + p[1] ** 2) ** 0.5, points))
'''

rust = '''
use serde_json;
pub fn calculate_distances(points: Vec<serde_json::Value>) -> Vec<serde_json::Value> {
    return points
        .iter()
        .map(|p| {
            (p.get(0usize).cloned().unwrap().pow(2 as u32) + p.get(1usize).cloned().unwrap().pow(2 as u32) as f64)
                .powf(0.5 as f64)
        })
        .collect::<Vec<_>>();
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_calculate_distances_examples() {
        assert_eq!(calculate_distances(vec![]), vec![]);
        assert_eq!(calculate_distances(vec![1]), vec![1]);
    }
}
'''