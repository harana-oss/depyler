[[test]]
name = "lambda_sorted_key"
description = "Lambda as key function for sorted"
tags = ["lambda", "sorted", "key"]

python = '''
def sort_by_length(words: list[str]) -> list[str]:
    return sorted(words, key=lambda x: len(x))
'''

rust = '''
pub fn sort_by_length(words: &Vec<String>) -> Vec<String> {
    return {
        let mut __sorted_result = words.clone();
        __sorted_result.sort_by_key(|x| x.len() as i32);
        __sorted_result
    };
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn quickcheck_sort_by_length() {
        fn prop(words: Vec<String>) -> TestResult {
            let input_len = words.len();
            let result = sort_by_length(&words);
            if result.len() != input_len {
                return TestResult::failed();
            }
            let result = sort_by_length(&words);
            for i in 1..result.len() {
                if result[i - 1] > result[i] {
                    return TestResult::failed();
                }
            }
            let mut input_sorted = words.clone();
            input_sorted.sort();
            let mut result = sort_by_length(&words);
            result.sort();
            if input_sorted != result {
                return TestResult::failed();
            }
            TestResult::passed()
        }
        quickcheck(prop as fn(Vec<String>) -> TestResult);
    }
    #[test]
    fn test_sort_by_length_examples() {
        assert_eq!(sort_by_length(vec![]), vec![]);
        assert_eq!(sort_by_length(vec![1]), vec![1]);
    }
}
'''

[[test]]
name = "lambda_sorted_reverse"
description = "Lambda for reverse sorting"
tags = ["lambda", "sorted", "reverse"]

python = '''
def sort_descending(numbers: list[int]) -> list[int]:
    return sorted(numbers, key=lambda x: -x)
'''

rust = '''
pub fn sort_descending(numbers: &Vec<i32>) -> Vec<i32> {
    return {
        let mut __sorted_result = numbers.clone();
        __sorted_result.sort_by_key(|x| (-x));
        __sorted_result
    };
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn quickcheck_sort_descending() {
        fn prop(numbers: Vec<i32>) -> TestResult {
            let input_len = numbers.len();
            let result = sort_descending(&numbers);
            if result.len() != input_len {
                return TestResult::failed();
            }
            let result = sort_descending(&numbers);
            for i in 1..result.len() {
                if result[i - 1] > result[i] {
                    return TestResult::failed();
                }
            }
            let mut input_sorted = numbers.clone();
            input_sorted.sort();
            let mut result = sort_descending(&numbers);
            result.sort();
            if input_sorted != result {
                return TestResult::failed();
            }
            TestResult::passed()
        }
        quickcheck(prop as fn(Vec<i32>) -> TestResult);
    }
    #[test]
    fn test_sort_descending_examples() {
        assert_eq!(sort_descending(vec![]), vec![]);
        assert_eq!(sort_descending(vec![1]), vec![1]);
    }
}
'''

