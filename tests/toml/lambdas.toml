[[test]]
name = "lambda_simple"
description = "Simple single-parameter lambda"
tags = ["lambda", "map"]

python = '''
def double_numbers(numbers: list[int]) -> list[int]:
    return list(map(lambda x: x * 2, numbers))
'''

rust = '''
pub fn double_numbers(numbers: Vec<i32>) -> Vec<i32> {
    return numbers.iter().map(|x| x * 2).collect::<Vec<_>>();
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_double_numbers_examples() {
        assert_eq!(double_numbers(vec![]), vec![]);
        assert_eq!(double_numbers(vec![1]), vec![1]);
    }
}
'''

