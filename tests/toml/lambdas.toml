[[test]]
name = "lambda_reduce_sum"
description = "Lambda in reduce for sum"
tags = ["lambda", "reduce", "fold"]

python = '''
from functools import reduce

def sum_all(numbers: list[int]) -> int:
    return reduce(lambda acc, x: acc + x, numbers, 0)
'''

rust = '''
use std::iter::Iterator::fold;
pub fn sum_all(numbers: Vec<i32>) -> i32 {
    return std::iter::Iterator::fold(|acc, x| acc + x, numbers, 0);
}
#[cfg(test)]
mod tests {
    use super::*;
    use quickcheck::{TestResult, quickcheck};
    #[test]
    fn test_sum_all_examples() {
        assert_eq!(sum_all(vec![]), 0);
        assert_eq!(sum_all(vec![1]), 1);
        assert_eq!(sum_all(vec![1, 2, 3]), 6);
    }
}
'''

