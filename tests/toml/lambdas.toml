# Lambda Tests - Migrated from test_lambdas.rs, test_lambda_integration.rs

[metadata]
name = "Lambda Tests"
category = "lambdas"

# =============================================================================
# Basic Lambdas
# =============================================================================

[[test]]
name = "lambda_simple"
description = "Simple single-parameter lambda"
tags = ["lambda", "map"]

[test.python]
code = '''
def double_numbers(numbers: list[int]) -> list[int]:
    return list(map(lambda x: x * 2, numbers))
'''

[test.assertions]
contains = [".map"]
contains_any = [["|x|", "| x |"]]

[[test]]
name = "lambda_identity"
description = "Identity lambda"
tags = ["lambda", "identity"]

[test.python]
code = '''
def identity_map(items: list[int]) -> list[int]:
    return list(map(lambda x: x, items))
'''

[test.assertions]
contains_any = [["|x| x", "| x | x"]]

# =============================================================================
# Lambda with filter
# =============================================================================

[[test]]
name = "lambda_filter_positive"
description = "Lambda in filter for positive numbers"
tags = ["lambda", "filter"]

[test.python]
code = '''
def filter_positive(numbers: list[int]) -> list[int]:
    return list(filter(lambda x: x > 0, numbers))
'''

[test.assertions]
contains = [".filter"]
contains_any = [["|x|", "| x |"]]

[[test]]
name = "lambda_filter_predicate"
description = "Lambda filter with complex predicate"
tags = ["lambda", "filter", "predicate"]

[test.python]
code = '''
def filter_range(items: list[int], low: int, high: int) -> list[int]:
    return list(filter(lambda x: x >= low and x <= high, items))
'''

[test.assertions]
contains = [".filter"]
contains_any = [["|x|", "&&"]]

# =============================================================================
# Lambda with sorted
# =============================================================================

[[test]]
name = "lambda_sorted_key"
description = "Lambda as key function for sorted"
tags = ["lambda", "sorted", "key"]

[test.python]
code = '''
def sort_by_length(words: list[str]) -> list[str]:
    return sorted(words, key=lambda x: len(x))
'''

[test.assertions]
contains_any = [["|x|", "| x |", "sort", "len()"]]

[[test]]
name = "lambda_sorted_reverse"
description = "Lambda for reverse sorting"
tags = ["lambda", "sorted", "reverse"]

[test.python]
code = '''
def sort_descending(numbers: list[int]) -> list[int]:
    return sorted(numbers, key=lambda x: -x)
'''

[test.assertions]
contains_any = [["|x| -x", "cmp", "reverse", "sort"]]

# =============================================================================
# Multi-parameter Lambda
# =============================================================================

[[test]]
name = "lambda_two_params"
description = "Lambda with two parameters"
tags = ["lambda", "multi-param"]

[test.python]
code = '''
def add_pairs(pairs: list[tuple[int, int]]) -> list[int]:
    return [x + y for x, y in pairs]
'''

[test.assertions]
contains_any = [["|x, y|", "| x, y |", "|(x, y)|"]]

# =============================================================================
# Lambda with reduce
# =============================================================================

[[test]]
name = "lambda_reduce_sum"
description = "Lambda in reduce for sum"
tags = ["lambda", "reduce", "fold"]

[test.python]
code = '''
from functools import reduce

def sum_all(numbers: list[int]) -> int:
    return reduce(lambda acc, x: acc + x, numbers, 0)
'''

[test.assertions]
contains = ["fold("]
contains_any = [["|acc, x|", "|acc,x|"]]

[[test]]
name = "lambda_reduce_product"
description = "Lambda in reduce for product"
tags = ["lambda", "reduce", "fold"]

[test.python]
code = '''
from functools import reduce

def product_all(numbers: list[int]) -> int:
    return reduce(lambda acc, x: acc * x, numbers, 1)
'''

[test.assertions]
contains = ["fold("]
contains_any = [["|acc, x|", "acc * x"]]

