# =============================================================================
# Nested Lambdas
# =============================================================================

[[test]]
name = "lambda_nested"
description = "Nested lambda expressions"
tags = ["lambda", "nested"]

[test.python]
code = '''
def nested_transform(matrix: list) -> list:
    return list(map(lambda row: list(map(lambda x: x * 2, row)), matrix))
'''

[test.assertions]
contains_any = [["|row|", "| row |"]]
contains = [".map"]

[[test]]
name = "lambda_in_comprehension"
description = "Lambda in list comprehension"
tags = ["lambda", "comprehension"]

[test.python]
code = '''
def process_items(items: list) -> list:
    transform = lambda x: x * 2
    return [transform(item) for item in items]
'''

[test.assertions]
contains_any = [["|x|", "| x |"]]

[[test]]
name = "lambda_distance_calc"
description = "Lambda with complex math expression"
tags = ["lambda", "math"]

[test.python]
code = '''
def calculate_distances(points: list) -> list:
    return list(map(lambda p: (p[0] ** 2 + p[1] ** 2) ** 0.5, points))
'''

[test.assertions]
contains_any = [["|p|", "| p |"]]
contains = [".map"]
