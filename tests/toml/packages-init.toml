[[test]]
name = "init_import_sub"
description = "import pkg.sub"

python = '''
# import pkg.sub
# This imports the submodule and makes it available as pkg.sub
# Both pkg/__init__.py and pkg/sub.py (or pkg/sub/__init__.py) run
# Access with: pkg.sub.function()
result = True
print("import pkg.sub makes submodule available")
'''

rust = '''
// In Rust: use pkg::sub;
// Or: use pkg::sub::*; for all public items
// Example:
// mod pkg {
//     pub mod sub {
//         pub fn function() {}
//     }
// }
// use pkg::sub;
let result = true;
println!("Rust uses 'use pkg::sub' for imports");
'''


[[test]]
name = "init_from_sub"
description = "from pkg.sub import item"

python = '''
# from pkg.sub import item
# Imports specific item from submodule
# Makes item directly available without pkg.sub prefix
# Example: from math import pi
# Use as: print(pi) instead of print(math.pi)
result = True
print("from pkg.sub import item imports specific items")
'''

rust = '''
// In Rust: use pkg::sub::item;
// Brings item into current scope
// Example:
// use std::collections::HashMap;
// let map = HashMap::new();  // No std::collections:: prefix needed
let result = true;
println!("Rust uses 'use pkg::sub::item' for specific imports");
'''


