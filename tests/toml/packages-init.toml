[[test]]
name = "init_lazy"
description = "Submodules loaded on demand"

python = '''
# Submodules loaded on demand
# In Python, submodules are not automatically imported
# Package structure:
#   mypackage/
#     __init__.py
#     submodule.py
# 
# import mypackage  # Does NOT import submodule
# mypackage.submodule  # AttributeError
# 
# Must explicitly: import mypackage.submodule
result = True
print("Python submodules load on demand, not automatically")
'''

rust = '''
// Rust modules must be explicitly declared with mod keyword
// File structure:
//   src/
//     lib.rs
//     submodule.rs
//
// In lib.rs: mod submodule;  // Explicitly declares module
// Submodules are not automatically included
let result = true;
println!("Rust modules must be explicitly declared");
'''


