# Package __init__.py Tests - Package initialization
# Rust Mapping: mod.rs, lib.rs

[metadata]
name = "Package __init__.py Tests"
category = "imports"

# =============================================================================
# Basic __init__.py
# =============================================================================

[[test]]
name = "init_empty"
description = "Empty __init__.py makes directory a package"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example { value: i32 }
'''


[[test]]
name = "init_with_code"
description = "Code runs on package import"

python = '''
# In Python, __init__.py code runs when package is imported
# Example __init__.py:
# print("Package initialized!")
# VERSION = "1.0.0"

# Code runs on package import
# When you do: import mypackage
# All code in mypackage/__init__.py executes
result = True
print("Package __init__.py executes on import")
'''

rust = '''
// In Rust, mod.rs or lib.rs code runs on first use
// Example lib.rs:
// const VERSION: &str = "1.0.0";

// Code at module level runs when module is loaded
const VERSION: &str = "1.0.0";
let result = true;
println!("Rust module initialization happens on first use");
'''


[[test]]
name = "init_import_package"
description = "import pkg runs __init__.py"

python = '''
