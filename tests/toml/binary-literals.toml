# =============================================================================
# Hexadecimal Literals
# =============================================================================

[[test]]
name = "hex_literal_lower"
description = "x = 0xff"

python = '''
x = 0xff
result = x == 255
'''

rust = '''
let x = 0xff;
let result = x == 255;
'''

[[test]]
name = "hex_literal_upper"
description = "x = 0xFF"

python = '''
x = 0xFF
result = x == 255
'''

rust = '''
let x = 0xFF;
let result = x == 255;
'''

[[test]]
name = "hex_underscore"
description = "x = 0xFF_FF"

python = '''
x = 0xFF_FF
result = x == 65535
'''

rust = '''
let x = 0xFF_FF;
let result = x == 65535;
'''

[[test]]
name = "hex_mixed_case"
description = "x = 0xDeAdBeEf"

python = '''
x = 0xDeAdBeEf
result = x == 3735928559
'''

rust = '''
let x = 0xDeAdBeEf;
let result = x == 3735928559;
