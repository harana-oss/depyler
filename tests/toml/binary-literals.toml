[metadata]
name = "Binary Literals Tests"
category = "core-language"

# =============================================================================
# Binary Literals
# =============================================================================

[[test]]
name = "binary_literal"
description = "x = 0b1010"

python = '''
x = 0b1010
result = x == 10
'''

rust = '''
let x = 0b1010;
let result = x == 10;
'''

[[test]]
name = "binary_literal_upper"
description = "x = 0B1010"

python = '''
x = 0B1010
result = x == 10
'''

rust = '''
let x = 0b1010;
let result = x == 10;
'''

[[test]]
name = "binary_underscore"
description = "x = 0b1010_1010"

python = '''
x = 0b1010_1010
result = x == 170
'''

rust = '''
let x = 0b1010_1010;
let result = x == 170;
'''

