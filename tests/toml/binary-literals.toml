# =============================================================================
# Decimal with Underscores
# =============================================================================

[[test]]
name = "decimal_underscore"
description = "x = 1_000_000"

python = '''
x = 1_000_000
result = x == 1000000
'''

rust = '''
let x = 1_000_000;
let result = x == 1000000;
'''

[[test]]
name = "float_underscore"
description = "x = 1_000.000_001"

python = '''
x = 1_000.000_001
result = abs(x - 1000.000001) < 0.000001
'''

rust = '''
let x = 1_000.000_001;
let result = (x - 1000.000001).abs() < 0.000001;
'''

# =============================================================================
# Operations with Literals
# =============================================================================

[[test]]
name = "binary_arithmetic"
description = "0b1010 + 0b0101"

python = '''
result = (0b1010 + 0b0101) == 15
'''

rust = '''
let result = (0b1010 + 0b0101) == 15;
'''

[[test]]
name = "mixed_base_arithmetic"
description = "0xFF + 0o77 + 0b11"

python = '''
result = (0xFF + 0o77 + 0b11) == 321
'''

rust = '''
let result = (0xFF + 0o77 + 0b11) == 321;
'''

[[test]]
name = "binary_bitwise"
description = "0b1010 & 0b1100"

python = '''
result = (0b1010 & 0b1100) == 8
'''

rust = '''
let result = (0b1010 & 0b1100) == 8;
'''

# =============================================================================
# Type Conversion
# =============================================================================

[[test]]
name = "bin_function"
description = "bin(10) == '0b1010'"

python = '''
result = bin(10) == '0b1010'
'''

rust = '''
fn bin(n: i32) -> String {
    format!("0b{:b}", n)
}
let result = bin(10) == "0b1010";
'''

[[test]]
name = "oct_function"
description = "oct(64) == '0o100'"

python = '''
result = oct(64) == '0o100'
'''

rust = '''
fn oct(n: i32) -> String {
    format!("0o{:o}", n)
}
let result = oct(64) == "0o100";
'''

[[test]]
name = "hex_function"
description = "hex(255) == '0xff'"

python = '''
result = hex(255) == '0xff'
'''

rust = '''
fn hex(n: i32) -> String {
    format!("0x{:x}", n)
}
let result = hex(255) == "0xff";
'''

[[test]]
name = "int_with_base"
description = "int('ff', 16) == 255"

python = '''
result = int('ff', 16) == 255
'''

rust = '''
let result = i32::from_str_radix("ff", 16).unwrap() == 255;
'''

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "zero_all_bases"
description = "0b0, 0o0, 0x0"

python = '''
result = (0b0 == 0) and (0o0 == 0) and (0x0 == 0)
'''

rust = '''
let result = (0b0 == 0) && (0o0 == 0) && (0x0 == 0);
'''

[[test]]
name = "negative_literals"
description = "-0xFF is unary minus applied to 0xFF"

python = '''
result = -0xFF == -255
'''

rust = '''
let result = -0xFF == -255;
'''

[[test]]
name = "large_literals"
description = "0xFFFF_FFFF_FFFF_FFFF"

python = '''
x = 0xFFFF_FFFF_FFFF_FFFF
result = x == 18446744073709551615
'''

rust = '''
let x: u64 = 0xFFFF_FFFF_FFFF_FFFF;
let result = x == 18446744073709551615;
'''
