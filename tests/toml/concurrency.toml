[[test]]
name = "threading_rwlock"
description = "RwLock pattern for readers-writers"

python = '''
class Cache:
    def __init__(self):
        self.data = {}
    
    def read(self, key: str) -> int:
        return self.data.get(key, 0)
    
    def write(self, key: str, value: int) -> None:
        self.data[key] = value
'''

rust = '''
use std::collections::HashMap;

pub struct Cache {
    pub data: HashMap<String, i32>,
}

impl Cache {
    pub fn new() -> Self {
        Self { data: HashMap::new() }
    }
    
    pub fn read(&self, key: &str) -> i32 {
        return *self.data.get(key).unwrap_or(&0);
    }
    
    pub fn write(&mut self, key: String, value: i32) {
        self.data.insert(key, value);
    }
}
'''

