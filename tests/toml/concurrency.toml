[[test]]
name = "threading_locks"
description = "Lock/RLock to Mutex/RwLock mapping"

python = '''
class Counter:
    def __init__(self):
        self.count = 0
    
    def increment(self) -> None:
        self.count += 1
    
    def get(self) -> int:
        return self.count
'''

rust = '''
pub struct Counter {
    pub count: i32,
}

impl Counter {
    pub fn new() -> Self {
        Self { count: 0 }
    }
    
    pub fn increment(&mut self) {
        self.count += 1;
    }
    
    pub fn get(&self) -> i32 {
        return self.count;
    }
}
'''

