[[test]]
name = "threading_barrier"
description = "Barrier synchronization pattern"

python = '''
class Barrier:
    def __init__(self, count: int):
        self.count = count
        self.waiting = 0
    
    def wait(self) -> bool:
        self.waiting += 1
        return self.waiting >= self.count
'''

rust = '''
pub struct Barrier {
    pub count: i32,
    pub waiting: i32,
}

impl Barrier {
    pub fn new(count: i32) -> Self {
        Self { count, waiting: 0 }
    }
    
    pub fn wait(&mut self) -> bool {
        self.waiting += 1;
        return self.waiting >= self.count;
    }
}
'''

# =============================================================================
# Thread-Safe Queue
# =============================================================================

[[test]]
name = "queue_thread_safe"
description = "queue.Queue to crossbeam::channel"

python = '''
class SimpleQueue:
    def __init__(self):
        self.items = []
    
    def put(self, item: int) -> None:
        self.items.append(item)
    
    def get(self) -> int:
        if len(self.items) > 0:
            return self.items.pop(0)
        return -1
'''

rust = '''
pub struct SimpleQueue {
    pub items: Vec<i32>,
}

impl SimpleQueue {
    pub fn new() -> Self {
        Self { items: vec![] }
    }
    
    pub fn put(&mut self, item: i32) {
        self.items.push(item);
    }
    
    pub fn get(&mut self) -> i32 {
        if self.items.len() > 0 {
            return self.items.remove(0);
        }
        return -1;
    }
}
'''

[[test]]
name = "queue_bounded"
description = "Bounded queue pattern"

python = '''
class BoundedQueue:
    def __init__(self, capacity: int):
        self.capacity = capacity
        self.items = []
    
    def is_full(self) -> bool:
        return len(self.items) >= self.capacity
    
    def put(self, item: int) -> bool:
        if self.is_full():
            return False
        self.items.append(item)
        return True
'''

rust = '''
pub struct BoundedQueue {
    pub capacity: i32,
    pub items: Vec<i32>,
}

impl BoundedQueue {
    pub fn new(capacity: i32) -> Self {
        Self { capacity, items: vec![] }
    }
    
    pub fn is_full(&self) -> bool {
        return self.items.len() as i32 >= self.capacity;
    }
    
    pub fn put(&mut self, item: i32) -> bool {
        if self.is_full() {
            return false;
        }
        self.items.push(item);
        return true;
    }
}
'''

