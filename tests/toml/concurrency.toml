[metadata]
name = "Concurrency Tests"
category = "thread-safety"

# =============================================================================
# Basic Threading
# =============================================================================

[[test]]
name = "threading_basic"
description = "Python threading to Rust std::thread"

python = '''
import threading

def worker(name: str) -> str:
    return f"Hello from {name}"

def run_thread() -> str:
    return worker("main")
'''

rust = '''
pub fn worker(name: &str) -> String {
    return format!("Hello from {}", name);
}

pub fn run_thread() -> String {
    return worker("main");
}
'''

[[test]]
name = "threading_spawn"
description = "Thread spawn pattern"

python = '''
def compute(n: int) -> int:
    return n * 2

def parallel_compute(value: int) -> int:
    result = compute(value)
    return result
'''

rust = '''
pub fn compute(n: i32) -> i32 {
    return n * 2;
}

pub fn parallel_compute(value: i32) -> i32 {
    let result = compute(value);
    return result;
}
'''

