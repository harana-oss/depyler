[[test]]
name = "shared_state_multiple"
description = "Multiple shared state values"

python = '''
class Stats:
    def __init__(self):
        self.min_val = 0
        self.max_val = 0
        self.sum = 0
        self.count = 0
    
    def add(self, value: int) -> None:
        if self.count == 0:
            self.min_val = value
            self.max_val = value
        else:
            if value < self.min_val:
                self.min_val = value
            if value > self.max_val:
                self.max_val = value
        self.sum += value
        self.count += 1
'''

rust = '''
pub struct Stats {
    pub min_val: i32,
    pub max_val: i32,
    pub sum: i32,
    pub count: i32,
}

impl Stats {
    pub fn new() -> Self {
        Self { min_val: 0, max_val: 0, sum: 0, count: 0 }
    }
    
    pub fn add(&mut self, value: i32) {
        if self.count == 0 {
            self.min_val = value;
            self.max_val = value;
        } else {
            if value < self.min_val {
                self.min_val = value;
            }
            if value > self.max_val {
                self.max_val = value;
            }
        }
        self.sum += value;
        self.count += 1;
    }
}
'''

# =============================================================================
# Atomic Operations
# =============================================================================

[[test]]
name = "atomic_operations"
description = "Atomic counter operations"

python = '''
class AtomicCounter:
    def __init__(self, initial: int = 0):
        self.value = initial
    
    def load(self) -> int:
        return self.value
    
    def store(self, val: int) -> None:
        self.value = val
    
    def fetch_add(self, delta: int) -> int:
        old = self.value
        self.value += delta
        return old
'''

rust = '''
pub struct AtomicCounter {
    pub value: i32,
}

impl AtomicCounter {
    pub fn new(initial: i32) -> Self {
        Self { value: initial }
    }
    
    pub fn load(&self) -> i32 {
        return self.value;
    }
    
    pub fn store(&mut self, val: i32) {
        self.value = val;
    }
    
    pub fn fetch_add(&mut self, delta: i32) -> i32 {
        let old = self.value;
        self.value += delta;
        return old;
    }
}
'''

[[test]]
name = "atomic_compare_exchange"
description = "Atomic compare-and-swap operations"

python = '''
class AtomicValue:
    def __init__(self, initial: int):
        self.value = initial
    
    def compare_exchange(self, expected: int, new: int) -> bool:
        if self.value == expected:
            self.value = new
            return True
        return False
'''

rust = '''
pub struct AtomicValue {
    pub value: i32,
}

impl AtomicValue {
    pub fn new(initial: i32) -> Self {
        Self { value: initial }
    }
    
    pub fn compare_exchange(&mut self, expected: i32, new: i32) -> bool {
        if self.value == expected {
            self.value = new;
            return true;
        }
        return false;
    }
}
'''

[[test]]
name = "atomic_flag"
description = "Atomic boolean flag"

python = '''
class AtomicFlag:
    def __init__(self):
        self.flag = False
    
    def test_and_set(self) -> bool:
        old = self.flag
        self.flag = True
        return old
    
    def clear(self) -> None:
        self.flag = False
'''

rust = '''
pub struct AtomicFlag {
    pub flag: bool,
}

impl AtomicFlag {
    pub fn new() -> Self {
        Self { flag: false }
    }
    
    pub fn test_and_set(&mut self) -> bool {
        let old = self.flag;
        self.flag = true;
        return old;
    }
    
    pub fn clear(&mut self) {
        self.flag = false;
    }
}
'''
