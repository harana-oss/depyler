# Use Cases
# =============================================================================

[[test]]
name = "or_http_status"
description = "case 200 | 201 | 204: success"

python = '''
status = 201
match status:
    case 200 | 201 | 204:
        result = True
    case _:
        result = False
'''

rust = '''
let status = 201;
let result = match status {
    200 | 201 | 204 => true,
    _ => false,
};
'''


[[test]]
name = "or_command"
description = "case 'quit' | 'exit' | 'q': ..."

python = '''
cmd = 'q'
match cmd:
    case 'quit' | 'exit' | 'q':
        result = True
    case _:
        result = False
'''

rust = '''
let cmd = "q";
let result = match cmd {
    "quit" | "exit" | "q" => true,
    _ => false,
};
'''


[[test]]
name = "or_falsy"
description = "case None | False | 0 | '' | [] | {}: ..."

python = '''
x = 0
match x:
    case None | False | 0 | '' | [] | {}:
        result = True
    case _:
        result = False
'''

rust = '''
// Different types can't be matched together in Rust
let x = 0;
let result = match x {
    0 => true,
    _ => false,
};
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "or_precedence"
description = "OR has lowest precedence in patterns"

python = '''
x = (1, 2)
match x:
    case (1, 2) | (3, 4):
        result = True
    case _:
        result = False
'''

rust = '''
let x = (1, 2);
let result = match x {
    (1, 2) | (3, 4) => true,
    _ => false,
};
'''


[[test]]
name = "or_overlapping"
description = "case 1 | _ : _ always matches"

python = '''
x = 5
match x:
    case 1 | _:
        result = True
'''

rust = '''
let x = 5;
let result = match x {
    1 | _ => true,
};
'''


[[test]]
name = "or_with_as"
description = "case (1 | 2 | 3) as x: capture matched value"

python = '''
value = 2
match value:
    case (1 | 2 | 3) as x:
        result = x == 2
    case _:
        result = False
'''

rust = '''
let value = 2;
let result = match value {
    x @ (1 | 2 | 3) => x == 2,
    _ => false,
};
'''

