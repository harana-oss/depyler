[metadata]
name = "Match OR Patterns Tests"
category = "modern-python"

# =============================================================================
# Basic OR Patterns
# =============================================================================

[[test]]
name = "or_literal"
description = "case 1 | 2 | 3: ..."

python = '''
x = 2
match x:
    case 1 | 2 | 3:
        result = True
    case _:
        result = False
'''

rust = '''
let x = 2;
let result = match x {
    1 | 2 | 3 => true,
    _ => false,
};
'''


[[test]]
name = "or_string"
description = "case 'yes' | 'y' | 'true': ..."

python = '''
s = 'y'
match s:
    case 'yes' | 'y' | 'true':
        result = True
    case _:
        result = False
'''

rust = '''
let s = "y";
let result = match s {
    "yes" | "y" | "true" => true,
    _ => false,
};
'''


[[test]]
name = "or_none"
description = "case None | 0 | '': ..."

python = '''
x = 0
match x:
    case None | 0 | '':
        result = True
    case _:
        result = False
'''

rust = '''
let x: Option<i32> = Some(0);
let result = match x {
    None | Some(0) => true,
    _ => false,
};
'''


# =============================================================================
# OR with Capture
# =============================================================================

[[test]]
name = "or_same_capture"
description = "case (x, 0) | (0, x): must bind same names"

python = '''
point = (5, 0)
match point:
    case (x, 0) | (0, x):
        result = x == 5
    case _:
        result = False
'''

rust = '''
let point = (5, 0);
let result = match point {
    (x, 0) | (0, x) => x == 5,
    _ => false,
};
'''


[[test]]
name = "or_binding_rule"
description = "All alternatives must bind same variables"

python = '''
value = (1, 2)
match value:
    case (x, y) | (y, x):
        result = True
    case _:
        result = False
'''

rust = '''
let value = (1, 2);
let result = match value {
    (x, y) | (y, x) => true,
    _ => false,
};
'''


[[test]]
name = "or_wildcard"
description = "case _ | _: always matches"

python = '''
x = 42
match x:
    case _ | _:
        result = True
'''

rust = '''
let x = 42;
let result = match x {
    _ | _ => true,
};
'''


# =============================================================================
# OR with Sequences
# =============================================================================

[[test]]
name = "or_sequence"
description = "case [] | [_]: empty or single"

python = '''
lst = [1]
match lst:
    case [] | [_]:
        result = True
    case _:
        result = False
'''

rust = '''
let lst = vec![1];
let result = match lst.len() {
    0 | 1 => true,
    _ => false,
};
'''


[[test]]
name = "or_tuple"
description = "case () | (x,) | (x, y): ..."

python = '''
tup = (1,)
match tup:
    case () | (x,) | (x, y):
        result = True
    case _:
        result = False
'''

rust = '''
let tup = (1,);
let result = match tup {
    () | (_,) | (_, _) => true,
    _ => false,
};
'''


# =============================================================================
# OR with Class Patterns
# =============================================================================

[[test]]
name = "or_class"
description = "case int() | float(): any number"

python = '''
x = 42
match x:
    case int() | float():
        result = True
    case _:
        result = False
'''

rust = '''
// case int() | float(): any number
// Type checked at compile time
let result = true;
'''


[[test]]
name = "or_different_classes"
description = "case Success() | Failure(): ..."

python = '''
class Success:
    pass
class Failure:
    pass
x = Success()
match x:
    case Success() | Failure():
        result = True
    case _:
        result = False
'''

rust = '''
enum Result {
    Success,
    Failure,
}
let x = Result::Success;
let result = match x {
    Result::Success | Result::Failure => true,
};
'''


# =============================================================================
# Nested OR Patterns
# =============================================================================

[[test]]
name = "or_nested"
description = "case ('a' | 'b', x): first is 'a' or 'b'"

python = '''
pair = ('a', 10)
match pair:
    case ('a' | 'b', x):
        result = x == 10
    case _:
        result = False
'''

rust = '''
let pair = ('a', 10);
let result = match pair {
    ('a' | 'b', x) => x == 10,
    _ => false,
};
'''


[[test]]
name = "or_in_sequence"
description = "case [1 | 2, x]: ..."

python = '''
lst = [1, 5]
match lst:
    case [1 | 2, x]:
        result = x == 5
    case _:
        result = False
'''

rust = '''
let lst = vec![1, 5];
let result = match lst.as_slice() {
    [1 | 2, x] => *x == 5,
    _ => false,
};
'''


[[test]]
name = "or_in_mapping"
description = "case {'type': 'a' | 'b'}: ..."

python = '''
data = {'type': 'a', 'value': 10}
match data:
    case {'type': 'a' | 'b'}:
        result = True
    case _:
        result = False
'''

rust = '''
use std::collections::HashMap;
let mut data = HashMap::new();
data.insert("type", "a");
let result = match data.get("type").map(|s| s.as_str()) {
    Some("a" | "b") => true,
    _ => false,
};
'''


# =============================================================================
# OR with Guards
# =============================================================================

[[test]]
name = "or_with_guard"
description = "case 1 | 2 | 3 if condition: ..."

python = '''
x = 2
condition = True
match x:
    case 1 | 2 | 3 if condition:
        result = True
    case _:
        result = False
'''

rust = '''
let x = 2;
let condition = true;
let result = match x {
    1 | 2 | 3 if condition => true,
    _ => false,
};
'''


[[test]]
name = "or_guard_capture"
description = "case x | y if x > 0: ..."

python = '''
# Invalid: OR patterns can't use different variable names
# case x | y if x > 0: would be an error
result = True
'''

rust = '''
// Invalid: OR patterns must bind same variables
// This would be a compile error
let result = true;
'''


