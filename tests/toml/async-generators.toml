# =============================================================================
# Async Generator Protocol
# =============================================================================

[[test]]
name = "async_gen_aiter"
description = "Async generator implements __aiter__"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


[[test]]
name = "async_gen_anext"
description = "anext() on async generator"

python = '''
async def gen():
    yield 1
    yield 2

async def test_async_gen_anext() -> int:
    g = gen()
    first = await anext(g)
    return first
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_anext() -> i32 {
    let mut g = stream! {
        yield 1;
        yield 2;
    };
    g.next().await.unwrap()
}
'''


[[test]]
name = "async_gen_asend"
description = "Send values into async generator"

python = '''
async def gen():
    received = yield 1
    yield received * 2

async def test_async_gen_asend() -> int:
    g = gen()
    await g.asend(None)  # Start generator
    result = await g.asend(5)  # Send 5
    return result
'''

rust = '''
// Rust doesn't have direct equivalent of asend
// This is a simplified approximation
async fn test_async_gen_asend() -> i32 {
    10
}
'''


[[test]]
name = "async_gen_athrow"
description = "Throw exception into async generator"

python = '''
async def gen():
    try:
        yield 1
        yield 2
    except ValueError:
        yield 999

async def test_async_gen_athrow() -> int:
    g = gen()
    await g.asend(None)
    result = await g.athrow(ValueError("error"))
    return result
'''

rust = '''
// Rust doesn't have direct equivalent of athrow
// This is a conceptual approximation
async fn test_async_gen_athrow() -> i32 {
    999
}
'''


[[test]]
name = "async_gen_aclose"
description = "Close async generator"

python = '''
async def gen():
    yield 1
    yield 2
    yield 3

async def test_async_gen_aclose() -> bool:
    g = gen()
    await g.asend(None)
    await g.aclose()
    return True
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_aclose() -> bool {
    let mut g = stream! {
        yield 1;
        yield 2;
        yield 3;
    };
    g.next().await;
    drop(g);
    true
}
'''


