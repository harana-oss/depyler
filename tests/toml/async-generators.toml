[metadata]
name = "Async Generators Tests"
category = "async"

# =============================================================================
# Basic Async Generator
# =============================================================================

[[test]]
name = "async_generator_basic"
description = "async def gen(): yield 1; yield 2"

python = '''
async def f():
    pass

result = f()  # Returns coroutine
'''

rust = '''
async fn f() {
    // Async function
}
'''


[[test]]
name = "async_generator_iterate"
description = "async for x in gen(): ..."

python = '''
async def gen():
    yield 1
    yield 2
    yield 3

async def test_async_generator_iterate() -> int:
    total = 0
    async for x in gen():
        total += x
    return total
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

pub async fn test_async_generator_iterate() -> i32 {
    let s = stream! {
        yield 1;
        yield 2;
        yield 3;
    };

    let mut total = 0;
    tokio::pin!(s);
    while let Some(x) = s.next().await {
        total += x;
    }
    total
}
'''


