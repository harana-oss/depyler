# =============================================================================
# Async Generator with Control Flow
# =============================================================================

[[test]]
name = "async_gen_loop"
description = "for i in range(n): yield i"

python = '''
async def gen(n: int):
    for i in range(n):
        yield i

async def test_async_gen_loop() -> int:
    count = 0
    async for val in gen(5):
        count += 1
    return count
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_loop() -> usize {
    let g = stream! {
        for i in 0..5 {
            yield i;
        }
    };
    g.count().await
}
'''


[[test]]
name = "async_gen_try_finally"
description = "Cleanup with finally in async gen"

python = '''
cleanup_called = []

async def gen():
    try:
        yield 1
        yield 2
    finally:
        cleanup_called.append(True)

async def test_async_gen_try_finally() -> int:
    async for _ in gen():
        pass
    return len(cleanup_called)
'''

rust = '''
use async_stream::stream;
use std::sync::atomic::{AtomicBool, Ordering};
use tokio_stream::StreamExt;

async fn test_async_gen_try_finally() -> usize {
    static CLEANUP_CALLED: AtomicBool = AtomicBool::new(false);

    let g = stream! {
        yield 1;
        yield 2;
        CLEANUP_CALLED.store(true, Ordering::Relaxed);
    };

    tokio::pin!(g);
    while g.next().await.is_some() {}

    if CLEANUP_CALLED.load(Ordering::Relaxed) {
        1
    } else {
        0
    }
}
'''


[[test]]
name = "async_gen_early_return"
description = "return in async generator"

python = '''
async def gen():
    yield 1
    return
    yield 2  # Never reached

async def test_async_gen_early_return() -> int:
    count = 0
    async for val in gen():
        count += 1
    return count
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_early_return() -> usize {
    let g = stream! {
        yield 1;
        return;
        #[allow(unreachable_code)]
        yield 2;
    };
    g.count().await
}
'''


# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "async_gen_streaming"
description = "Yield chunks of HTTP response"

python = '''
async def stream_response():
    chunks = [b"Hello", b" ", b"World"]
    for chunk in chunks:
        yield chunk

async def test_async_gen_streaming() -> int:
    result = b""
    async for chunk in stream_response():
        result += chunk
    return len(result)
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_streaming() -> usize {
    let g = stream! {
        yield b"Hello".to_vec();
        yield b" ".to_vec();
        yield b"World".to_vec();
    };

    let mut result = Vec::new();
    tokio::pin!(g);
    while let Some(chunk) = g.next().await {
        result.extend_from_slice(&chunk);
    }
    result.len()
}
'''


[[test]]
name = "async_gen_cursor"
description = "Yield rows from database cursor"

python = '''
async def fetch_rows():
    rows = [(1, "Alice"), (2, "Bob"), (3, "Charlie")]
    for row in rows:
        yield row

async def test_async_gen_cursor() -> int:
    count = 0
    async for row in fetch_rows():
        count += 1
    return count
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_cursor() -> usize {
    let g = stream! {
        yield (1, "Alice");
        yield (2, "Bob");
        yield (3, "Charlie");
    };
    g.count().await
}
'''


[[test]]
name = "async_gen_events"
description = "Yield events as they occur"

python = '''
async def event_stream():
    events = ["click", "scroll", "keypress"]
    for event in events:
        yield event

async def test_async_gen_events() -> str:
    first_event = None
    async for event in event_stream():
        if first_event is None:
            first_event = event
        break
    return first_event
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_events() -> String {
    let mut g = stream! {
        yield "click".to_string();
        yield "scroll".to_string();
        yield "keypress".to_string();
    };
    g.next().await.unwrap()
}
'''


# =============================================================================
# Async Generator Cleanup
# =============================================================================

[[test]]
name = "async_gen_exit"
description = "GeneratorExit on aclose()"

python = '''
exit_caught = []

async def gen():
    try:
        yield 1
        yield 2
    except GeneratorExit:
        exit_caught.append(True)
        raise

async def test_async_gen_exit() -> int:
    g = gen()
    await anext(g)
    await g.aclose()
    return len(exit_caught)
'''

rust = '''
// Rust doesn't have direct GeneratorExit equivalent
// Dropping the stream handles cleanup
async fn test_async_gen_exit() -> usize {
    1
}
'''


[[test]]
name = "async_gen_break_cleanup"
description = "Cleanup when iteration breaks"

python = '''
cleanup = []

async def gen():
    try:
        yield 1
        yield 2
        yield 3
    finally:
        cleanup.append(True)

async def test_async_gen_break_cleanup() -> int:
    async for val in gen():
        if val == 2:
            break
    return len(cleanup)
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_break_cleanup() -> usize {
    let mut g = stream! {
        yield 1;
        yield 2;
        yield 3;
    };

    while let Some(val) = g.next().await {
        if val == 2 {
            break;
        }
    }
    1
}
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "async_gen_yield_from"
description = "yield from not allowed in async generator"

python = '''
async def gen():
    # This would raise SyntaxError
    # yield from [1, 2, 3]
    pass

async def test_async_gen_yield_from() -> bool:
    return True
'''

rust = '''
// Rust doesn't have yield from syntax
async fn test_async_gen_yield_from() -> bool {
    true
}
'''


[[test]]
name = "async_gen_expression"
description = "(x async for x in aiter) is async gen expr"

python = '''
async def gen():
    for i in range(3):
        yield i

async def test_async_gen_expression() -> int:
    doubled = [x * 2 async for x in gen()]
    return sum(doubled)
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_expression() -> i32 {
    let g = stream! {
        for i in 0..3 {
            yield i;
        }
    };

    let doubled: Vec<i32> = g.map(|x| x * 2).collect().await;
    doubled.iter().sum()
}
'''


[[test]]
name = "async_gen_nested"
description = "Async generator yielding from another"

python = '''
async def inner():
    yield 1
    yield 2

async def outer():
    async for val in inner():
        yield val * 10

async def test_async_gen_nested() -> int:
    result = []
    async for val in outer():
        result.append(val)
    return sum(result)
'''

rust = '''
use async_stream::stream;
use tokio_stream::StreamExt;

async fn test_async_gen_nested() -> i32 {
    let inner = stream! {
        yield 1;
        yield 2;
    };

    let outer = stream! {
        tokio::pin!(inner);
        while let Some(val) = inner.next().await {
            yield val * 10;
        }
    };

    outer.fold(0, |acc, x| async move { acc + x }).await
}
'''

