[[test]]
name = "async_gen_multi_yield"
description = "Multiple yield statements"

python = '''
async def gen():
    yield 1
    yield 2
    yield 3

async def test_async_gen_multi_yield() -> int:
    total = 0
    async for val in gen():
        total += val
    return total
'''

rust = '''
use async_stream::stream;
