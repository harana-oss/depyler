# Edge Cases
# =============================================================================

[[test]]
name = "inplace_different_type"
description = "list += tuple extends list"
python = """
my_list = [1, 2, 3]
my_list += (4, 5)  # Tuple is iterable, extends list

print(f"List: {my_list}")
"""
rust = """
fn main() {
    let mut my_list = vec![1, 2, 3];
    let tuple = [4, 5];  // Rust doesn't have true tuples for this, use array
    my_list.extend_from_slice(&tuple);
    
    log::info!("List: {:?}", my_list);
}
"""

[[test]]
name = "inplace_different_object"
description = "In-place can return different object"
python = """
class Weird:
    def __init__(self, x):
        self.x = x
    
    def __iadd__(self, other):
        # Return a different object (unusual but allowed)
        return Weird(self.x + other.x)
    
    def __repr__(self):
        return f"Weird({self.x})"

a = Weird(5)
original_id = id(a)
a += Weird(3)
new_id = id(a)

print(a)
print(f"Different object: {original_id != new_id}")
"""
rust = """
// In Rust, AddAssign must mutate self, can't return different object
// But regular Add can
use std::ops::Add;

#[derive(Debug)]
struct Weird {
    x: i32,
}

impl Add for Weird {
    type Output = Weird;
    
    fn add(self, other: Weird) -> Weird {
        Weird { x: self.x + other.x }
    }
}

fn main() {
    let a = Weird { x: 5 };
    let a = a + Weird { x: 3 };
    
    log::info!("Weird({})", a.x);
    log::info!("Different object: true");
}
"""

[[test]]
name = "inplace_chained"
description = "a += b += c not valid (different from a = b = c)"
python = """
# This demonstrates that in-place operators don't chain like assignment
a = 5
b = 10
c = 3

# b += c returns None implicitly for built-ins, but for our purposes:
b += c
a += b

print(f"a: {a}, b: {b}, c: {c}")
"""
rust = """
fn main() {
    let mut a = 5;
    let mut b = 10;
    let c = 3;
    
    b += c;
    a += b;
    
    log::info!("a: {}, b: {}, c: {}", a, b, c);
}
"""
