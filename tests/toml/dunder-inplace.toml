# =============================================================================
# Other In-Place
# =============================================================================

[[test]]
name = "dunder_imatmul"
description = "def __imatmul__(self, other): ... (@= operator)"
python = """
class Matrix:
    def __init__(self, data):
        self.data = data
    
    def __imatmul__(self, other):
        # Simplified matrix multiplication
        self.data = [[sum(a*b for a,b in zip(row, col)) 
                     for col in zip(*other.data)] 
                     for row in self.data]
        return self
    
    def __repr__(self):
        return f"Matrix({self.data})"

a = Matrix([[1, 2], [3, 4]])
b = Matrix([[2, 0], [1, 2]])
a @= b
print(a)
"""
rust = """
// Rust doesn't have a MatMulAssign trait in std
// This would typically be in a linear algebra library like nalgebra
#[derive(Debug)]
struct Matrix {
    data: Vec<Vec<i32>>,
}

impl Matrix {
    fn matmul_assign(&mut self, other: &Matrix) {
        // Simplified 2x2 matrix multiplication
        let result = vec![
            vec![
                self.data[0][0] * other.data[0][0] + self.data[0][1] * other.data[1][0],
                self.data[0][0] * other.data[0][1] + self.data[0][1] * other.data[1][1]
            ],
            vec![
                self.data[1][0] * other.data[0][0] + self.data[1][1] * other.data[1][0],
                self.data[1][0] * other.data[0][1] + self.data[1][1] * other.data[1][1]
            ]
        ];
        self.data = result;
    }
}

fn main() {
    let mut a = Matrix { data: vec![vec![1, 2], vec![3, 4]] };
    let b = Matrix { data: vec![vec![2, 0], vec![1, 2]] };
    a.matmul_assign(&b);
    log::info!("Matrix({:?})", a.data);
}
"""

# =============================================================================
# Fallback Behavior
# =============================================================================

[[test]]
name = "inplace_fallback"
description = "a += b falls back to a = a + b if no __iadd__"
python = """
class NoInPlace:
    def __init__(self, x):
        self.x = x
    
    def __add__(self, other):
        return NoInPlace(self.x + other.x)
    
    def __repr__(self):
        return f"NoInPlace({self.x})"

# No __iadd__ defined, so += falls back to __add__
a = NoInPlace(5)
original_id = id(a)
a += NoInPlace(3)
new_id = id(a)

print(a)
print(f"Object changed: {original_id != new_id}")
"""
rust = """
use std::ops::Add;

#[derive(Debug)]
struct NoInPlace {
    x: i32,
}

impl Add for NoInPlace {
    type Output = NoInPlace;
    
    fn add(self, other: NoInPlace) -> NoInPlace {
        NoInPlace { x: self.x + other.x }
    }
}

fn main() {
    let a = NoInPlace { x: 5 };
    let a = a + NoInPlace { x: 3 };  // No in-place in Rust without mut + AddAssign
    
    log::info!("NoInPlace({})", a.x);
    log::info!("Object changed: true");
}
"""

[[test]]
name = "iadd_return_self"
description = "In-place methods should return self"
python = """
class Accumulator:
    def __init__(self, x):
        self.x = x
    
    def __iadd__(self, other):
        self.x += other.x
        return self  # Must return self
    
    def __repr__(self):
        return f"Accumulator({self.x})"

a = Accumulator(5)
original_id = id(a)
a += Accumulator(3)
new_id = id(a)

print(a)
print(f"Same object: {original_id == new_id}")
"""
rust = """
use std::ops::AddAssign;

#[derive(Debug)]
struct Accumulator {
    x: i32,
}

impl AddAssign for Accumulator {
    fn add_assign(&mut self, other: Accumulator) {
        self.x += other.x;
        // Rust's += automatically works on &mut self
    }
}

fn main() {
    let mut a = Accumulator { x: 5 };
    a += Accumulator { x: 3 };
    
    log::info!("Accumulator({})", a.x);
    log::info!("Same object: true");
}
"""

# =============================================================================
# Mutable vs Immutable
# =============================================================================

[[test]]
name = "inplace_mutable"
description = "list += [x] modifies in-place"
python = """
original = [1, 2, 3]
original_id = id(original)

original += [4, 5]
new_id = id(original)

print(f"List: {original}")
print(f"Same object: {original_id == new_id}")
"""
rust = """
fn main() {
    let mut original = vec![1, 2, 3];
    
    original.extend_from_slice(&[4, 5]);
    
    log::info!("List: {:?}", original);
    log::info!("Same object: true");
}
"""

[[test]]
name = "inplace_immutable"
description = "int += 1 creates new object (rebinds)"
python = """
x = 5
original_id = id(x)

x += 1
new_id = id(x)

print(f"Value: {x}")
print(f"Different object: {original_id != new_id}")
"""
rust = """
fn main() {
    let mut x = 5;
    
    x += 1;  // In Rust, integers are always copied
    
    log::info!("Value: {}", x);
    log::info!("Different object: true");
}
"""

