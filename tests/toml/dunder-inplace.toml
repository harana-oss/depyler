[metadata]
name = "Dunder In-Place Tests"
category = "dunder-methods"

# =============================================================================
# In-Place Arithmetic
# =============================================================================

[[test]]
name = "dunder_iadd"
description = "def __iadd__(self, other): self.x += other.x; return self"
python = """
class Counter:
    def __init__(self, x):
        self.x = x
    
    def __iadd__(self, other):
        self.x += other.x
        return self
    
    def __repr__(self):
        return f"Counter({self.x})"

a = Counter(5)
a += Counter(3)
print(a)
"""
rust = """
use std::ops::AddAssign;

#[derive(Debug)]
struct Counter {
    x: i32,
}

impl AddAssign for Counter {
    fn add_assign(&mut self, other: Counter) {
        self.x += other.x;
    }
}

fn main() {
    let mut a = Counter { x: 5 };
    a += Counter { x: 3 };
    log::info!("Counter({})", a.x);
}
"""

