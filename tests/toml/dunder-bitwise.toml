# =============================================================================
# Bitwise with Integers
# =============================================================================

[[test]]
name = "bitwise_custom_int"
description = "CustomFlags() & 0xFF"
python = """
class CustomFlags:
    def __init__(self, value=0xFF00):
        self.value = value
    
    def __and__(self, other):
        if isinstance(other, int):
            return CustomFlags(self.value & other)
        return CustomFlags(self.value & other.value)
    
    def __repr__(self):
        return f"CustomFlags({hex(self.value)})"

flags = CustomFlags()
result = flags & 0xFF
print(result)
"""
rust = """
use std::ops::BitAnd;

#[derive(Debug)]
struct CustomFlags {
    value: i32,
}

impl BitAnd<i32> for CustomFlags {
    type Output = CustomFlags;
    
    fn bitand(self, other: i32) -> CustomFlags {
        CustomFlags { value: self.value & other }
    }
}

fn main() {
    let flags = CustomFlags { value: 0xFF00 };
    let result = flags & 0xFF;
    log::info!("CustomFlags({:#x})", result.value);
}
"""

[[test]]
name = "bitwise_int_custom"
description = "0xFF & CustomFlags() via __rand__"
python = """
class CustomFlags:
    def __init__(self, value=0xFF00):
        self.value = value
    
    def __rand__(self, other):
        return CustomFlags(other & self.value)
    
    def __repr__(self):
        return f"CustomFlags({hex(self.value)})"

flags = CustomFlags()
result = 0xFF & flags
print(result)
"""
rust = """
use std::ops::BitAnd;

#[derive(Debug)]
struct CustomFlags {
    value: i32,
}

impl BitAnd<CustomFlags> for i32 {
    type Output = CustomFlags;
    
    fn bitand(self, other: CustomFlags) -> CustomFlags {
        CustomFlags { value: self & other.value }
    }
}

fn main() {
    let flags = CustomFlags { value: 0xFF00 };
    let result = 0xFF & flags;
    log::info!("CustomFlags({:#x})", result.value);
}
"""

# =============================================================================
# Use Cases: Flags
# =============================================================================

[[test]]
name = "flags_or"
description = "READ | WRITE combining flags"
python = """
READ = 1
WRITE = 2
EXECUTE = 4

permissions = READ | WRITE
print(f"Permissions: {permissions}")
print(f"Has read: {bool(permissions & READ)}")
print(f"Has execute: {bool(permissions & EXECUTE)}")
"""
rust = """
const READ: i32 = 1;
const WRITE: i32 = 2;
const EXECUTE: i32 = 4;

fn main() {
    let permissions = READ | WRITE;
    log::info!("Permissions: {}", permissions);
    log::info!("Has read: {}", (permissions & READ) != 0);
    log::info!("Has execute: {}", (permissions & EXECUTE) != 0);
}
"""

[[test]]
name = "flags_and"
description = "permissions & READ checking flags"
python = """
READ = 1
WRITE = 2

permissions = 3  # READ | WRITE
has_read = (permissions & READ) != 0
has_write = (permissions & WRITE) != 0

print(f"Has read: {has_read}")
print(f"Has write: {has_write}")
"""
rust = """
const READ: i32 = 1;
const WRITE: i32 = 2;

fn main() {
    let permissions = 3;  // READ | WRITE
    let has_read = (permissions & READ) != 0;
    let has_write = (permissions & WRITE) != 0;
    
    log::info!("Has read: {}", has_read);
    log::info!("Has write: {}", has_write);
}
"""

[[test]]
name = "flags_xor"
description = "flags ^ TOGGLE toggling flags"
python = """
READ = 1
WRITE = 2

flags = READ
print(f"Initial: {flags}")

flags = flags ^ WRITE  # Add WRITE
print(f"After adding WRITE: {flags}")

flags = flags ^ WRITE  # Remove WRITE
print(f"After removing WRITE: {flags}")
"""
rust = """
const READ: i32 = 1;
const WRITE: i32 = 2;

fn main() {
    let mut flags = READ;
    log::info!("Initial: {}", flags);
    
    flags = flags ^ WRITE;  // Add WRITE
    log::info!("After adding WRITE: {}", flags);
    
    flags = flags ^ WRITE;  // Remove WRITE
    log::info!("After removing WRITE: {}", flags);
}
"""

# =============================================================================
# Use Cases: Bitmasks
# =============================================================================

[[test]]
name = "bitmask_create"
description = "1 << n creating bitmask"
python = """
# Create bitmasks for different positions
masks = [1 << i for i in range(5)]
print(f"Bitmasks: {masks}")
"""
rust = """
fn main() {
    let masks: Vec<i32> = (0..5).map(|i| 1 << i).collect();
    log::info!("Bitmasks: {:?}", masks);
}
"""

[[test]]
name = "bitmask_extract"
description = "(value >> n) & 0xFF extracting bits"
python = """
value = 0x12345678

# Extract bytes
byte0 = value & 0xFF
byte1 = (value >> 8) & 0xFF
byte2 = (value >> 16) & 0xFF
byte3 = (value >> 24) & 0xFF

print(f"Bytes: {hex(byte0)}, {hex(byte1)}, {hex(byte2)}, {hex(byte3)}")
"""
rust = """
fn main() {
    let value: u32 = 0x12345678;
    
    let byte0 = value & 0xFF;
    let byte1 = (value >> 8) & 0xFF;
    let byte2 = (value >> 16) & 0xFF;
    let byte3 = (value >> 24) & 0xFF;
    
    log::info!("Bytes: {:#x}, {:#x}, {:#x}, {:#x}", byte0, byte1, byte2, byte3);
}
"""

# =============================================================================
# Use Cases: Sets (using bitwise for sets)
# =============================================================================

[[test]]
name = "set_and"
description = "set1 & set2 intersection"
python = """
set1 = {1, 2, 3, 4}
set2 = {3, 4, 5, 6}
result = set1 & set2
print(sorted(result))
"""
rust = """
use std::collections::HashSet;

fn main() {
    let set1: HashSet<_> = vec![1, 2, 3, 4].into_iter().collect();
    let set2: HashSet<_> = vec![3, 4, 5, 6].into_iter().collect();
    let result: Vec<_> = set1.intersection(&set2).copied().collect();
    let mut sorted = result;
    sorted.sort();
    log::info!("{:?}", sorted);
}
"""

[[test]]
name = "set_or"
description = "set1 | set2 union"
python = """
