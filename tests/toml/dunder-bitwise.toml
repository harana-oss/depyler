description = "True & False == False"
python = """
result1 = True & False
result2 = True | False
result3 = True ^ False

print(f"True & False = {result1}")
print(f"True | False = {result2}")
print(f"True ^ False = {result3}")
"""
rust = """
fn main() {
    let result1 = true & false;
    let result2 = true | false;
    let result3 = true ^ false;
    
    log::info!("True & False = {}", result1);
    log::info!("True | False = {}", result2);
    log::info!("True ^ False = {}", result3);
}
"""
