[metadata]
name = "Dunder Bitwise Tests"
category = "dunder-methods"

# =============================================================================
# Bitwise Operations
# =============================================================================

[[test]]
name = "dunder_and"
description = "def __and__(self, other): return MyClass(self.x & other.x)"
python = """
class MyClass:
    def __init__(self, x):
        self.x = x
    
    def __and__(self, other):
        return MyClass(self.x & other.x)
    
    def __repr__(self):
        return f"MyClass({self.x})"

a = MyClass(0b1100)
b = MyClass(0b1010)
result = a & b
print(result)
"""
rust = """
use std::ops::BitAnd;

#[derive(Debug)]
struct MyClass {
    x: i32,
}

impl BitAnd for MyClass {
    type Output = MyClass;
    
    fn bitand(self, other: MyClass) -> MyClass {
        MyClass { x: self.x & other.x }
    }
}

fn main() {
    let a = MyClass { x: 0b1100 };
    let b = MyClass { x: 0b1010 };
    let result = a & b;
    log::info!("MyClass({})", result.x);
}
"""

