# =============================================================================
# @lru_cache
# =============================================================================

[[test]]
name = "lru_cache_basic"
description = "@lru_cache def f(x): ..."

python = '''
from functools import lru_cache

@lru_cache
def func(x):
    return x * x

result = func(3) == 9
'''

rust = '''
// @lru_cache def f(x): ...
use lru::LruCache;
use std::sync::Mutex;

lazy_static::lazy_static! {
    static ref CACHE: Mutex<LruCache<i32, i32>> = Mutex::new(LruCache::new(128.try_into().unwrap()));
}

fn func(x: i32) -> i32 {
    let mut cache = CACHE.lock().unwrap();
    if let Some(&val) = cache.get(&x) {
        return val;
    }
    let val = x * x;
    cache.put(x, val);
    val
}

let result = func(3) == 9;
'''


