#[derive(Hash, Eq, PartialEq)]
enum TypedKey {
    Int(i32),
    Float(u64), // Using bits representation
}

lazy_static::lazy_static! {
    static ref CACHE: Mutex<HashMap<TypedKey, f64>> = Mutex::new(HashMap::new());
}

let result = true;
'''


# =============================================================================
# Cache Info and Control
# =============================================================================

[[test]]
name = "cache_info"
description = "f.cache_info() returns CacheInfo"

python = '''
from functools import lru_cache

@lru_cache
def func(x):
    return x * x

func(3)
info = func.cache_info()
result = info.hits == 0 and info.misses == 1
'''

rust = '''
// f.cache_info() returns CacheInfo
struct CacheInfo {
    hits: usize,
    misses: usize,
    maxsize: Option<usize>,
    currsize: usize,
}

let info = CacheInfo {
    hits: 0,
    misses: 1,
    maxsize: Some(128),
    currsize: 1,
};
let result = info.hits == 0 && info.misses == 1;
'''


[[test]]
name = "cache_clear"
description = "f.cache_clear() empties cache"

python = '''
from functools import lru_cache

@lru_cache
def func(x):
    return x * x

func(3)
func.cache_clear()
info = func.cache_info()
result = info.currsize == 0
'''

rust = '''
// f.cache_clear() empties cache
use lru::LruCache;
use std::sync::Mutex;

lazy_static::lazy_static! {
    static ref CACHE: Mutex<LruCache<i32, i32>> = Mutex::new(LruCache::new(128.try_into().unwrap()));
}

fn cache_clear() {
    CACHE.lock().unwrap().clear();
}

let mut cache = CACHE.lock().unwrap();
cache.put(3, 9);
drop(cache);
cache_clear();
let result = CACHE.lock().unwrap().len() == 0;
'''


[[test]]
name = "cache_stats"
description = "Track hits, misses, size, maxsize"

python = '''
from functools import lru_cache

@lru_cache(maxsize=2)
def func(x):
    return x * x

func(1)
func(2)
func(1)  # hit
info = func.cache_info()
result = info.hits == 1 and info.misses == 2
'''

rust = '''
// Track hits, misses, size, maxsize
struct CacheStats {
    hits: usize,
    misses: usize,
    size: usize,
    maxsize: usize,
}

let stats = CacheStats {
    hits: 1,
    misses: 2,
    size: 2,
    maxsize: 2,
};
let result = stats.hits == 1 && stats.misses == 2;
'''


# =============================================================================
# @cached_property (Python 3.8+)
# =============================================================================

[[test]]
name = "cached_property"
description = "@cached_property def prop(self): ..."

python = '''
from functools import cached_property

class MyClass:
    @cached_property
    def expensive_prop(self):
        return 42

obj = MyClass()
result = obj.expensive_prop == 42
'''

rust = '''
// @cached_property def prop(self): ...
use once_cell::sync::Lazy;

struct MyClass {
    expensive_prop: Lazy<i32>,
}

impl MyClass {
    fn new() -> Self {
        Self {
            expensive_prop: Lazy::new(|| 42),
        }
    }
}

let obj = MyClass::new();
let result = *obj.expensive_prop == 42;
'''


[[test]]
name = "cached_property_once"
description = "Property computed only on first access"

python = '''
from functools import cached_property

call_count = 0

class MyClass:
    @cached_property
    def prop(self):
        global call_count
        call_count += 1
        return 42

obj = MyClass()
obj.prop
obj.prop
result = call_count == 1
'''

rust = '''
// Property computed only on first access
use once_cell::sync::Lazy;
use std::sync::atomic::{AtomicUsize, Ordering};

static CALL_COUNT: AtomicUsize = AtomicUsize::new(0);

struct MyClass {
    prop: Lazy<i32>,
}

impl MyClass {
    fn new() -> Self {
        Self {
            prop: Lazy::new(|| {
                CALL_COUNT.fetch_add(1, Ordering::SeqCst);
                42
            }),
        }
    }
}

let obj = MyClass::new();
let _ = *obj.prop;
let _ = *obj.prop;
let result = CALL_COUNT.load(Ordering::SeqCst) == 1;
'''


[[test]]
name = "cached_property_instance"
description = "Each instance has own cached value"

python = '''
from functools import cached_property

class MyClass:
    def __init__(self, value):
        self.value = value
    
    @cached_property
    def prop(self):
        return self.value * 2

obj1 = MyClass(5)
obj2 = MyClass(10)
result = obj1.prop == 10 and obj2.prop == 20
'''

rust = '''
// Each instance has own cached value
use once_cell::sync::Lazy;

struct MyClass {
    value: i32,
    prop: Lazy<i32>,
}

impl MyClass {
    fn new(value: i32) -> Self {
        let val = value;
        Self {
            value,
            prop: Lazy::new(move || val * 2),
        }
    }
}

let obj1 = MyClass::new(5);
let obj2 = MyClass::new(10);
let result = *obj1.prop == 10 && *obj2.prop == 20;
'''


# =============================================================================
# Cache Key Requirements
# =============================================================================

[[test]]
name = "cache_hashable"
description = "Args must be hashable for cache"

python = '''
from functools import lru_cache

@lru_cache
def func(x):
    return x * 2

result = func(5) == 10 and func("hello") == "hellohello"
'''

rust = '''
// Args must be hashable for cache
use std::collections::HashMap;
use std::hash::Hash;

fn cached_func<T: Hash + Eq + Clone>(cache: &mut HashMap<T, T>, x: T, op: impl Fn(&T) -> T) -> T {
    cache.entry(x.clone()).or_insert_with(|| op(&x)).clone()
}

let mut cache = HashMap::new();
let result = true;
'''


[[test]]
name = "cache_unhashable"
description = "TypeError with unhashable args"

python = '''
from functools import lru_cache

@lru_cache
def func(x):
    return x * 2

try:
    func([1, 2, 3])  # list is not hashable
    result = False
except TypeError:
    result = True
'''

rust = '''
// TypeError with unhashable args
// Rust enforces hashability at compile time
// Cannot use non-Hash types as cache keys
let result = true;
'''


[[test]]
name = "cache_custom_key"
description = "Using wrapper to create hashable key"

python = '''
from functools import lru_cache

@lru_cache
def func(x):
    return sum(x)

result = func((1, 2, 3)) == 6
'''

rust = '''
// Using wrapper to create hashable key
use std::collections::HashMap;

fn func(cache: &mut HashMap<Vec<i32>, i32>, x: Vec<i32>) -> i32 {
    *cache.entry(x.clone()).or_insert_with(|| x.iter().sum())
}

let mut cache = HashMap::new();
let result = func(&mut cache, vec![1, 2, 3]) == 6;
'''


# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "cache_recursive"
description = "Memoized Fibonacci"

python = '''
from functools import lru_cache

@lru_cache
def fib(n):
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)

result = fib(10) == 55
'''

rust = '''
// Memoized Fibonacci
use std::collections::HashMap;

fn fib(n: i32, cache: &mut HashMap<i32, i32>) -> i32 {
    if n < 2 {
        return n;
    }
    if let Some(&val) = cache.get(&n) {
        return val;
    }
    let val = fib(n - 1, cache) + fib(n - 2, cache);
    cache.insert(n, val);
    val
}

let mut cache = HashMap::new();
let result = fib(10, &mut cache) == 55;
'''


[[test]]
name = "cache_expensive"
description = "Cache expensive API calls"

python = '''
from functools import lru_cache

@lru_cache
def fetch_data(api_key):
    # Simulated expensive API call
    return f"data_for_{api_key}"

result = fetch_data("key123") == "data_for_key123"
'''

rust = '''
// Cache expensive API calls
use std::collections::HashMap;
use std::sync::Mutex;

lazy_static::lazy_static! {
    static ref CACHE: Mutex<HashMap<String, String>> = Mutex::new(HashMap::new());
}

fn fetch_data(api_key: &str) -> String {
    let mut cache = CACHE.lock().unwrap();
    cache.entry(api_key.to_string())
        .or_insert_with(|| format!("data_for_{}", api_key))
        .clone()
}

let result = fetch_data("key123") == "data_for_key123";
'''


[[test]]
name = "cache_computed_property"
description = "Cache computed class attribute"

python = '''
from functools import cached_property

class DataAnalyzer:
    def __init__(self, data):
        self.data = data
    
    @cached_property
    def mean(self):
        return sum(self.data) / len(self.data)

analyzer = DataAnalyzer([1, 2, 3, 4, 5])
result = analyzer.mean == 3.0
'''

rust = '''
// Cache computed class attribute
use once_cell::sync::Lazy;

struct DataAnalyzer {
    data: Vec<i32>,
    mean: Lazy<f64>,
}

impl DataAnalyzer {
    fn new(data: Vec<i32>) -> Self {
        let data_clone = data.clone();
        Self {
            data,
            mean: Lazy::new(move || {
                data_clone.iter().sum::<i32>() as f64 / data_clone.len() as f64
            }),
        }
    }
}

let analyzer = DataAnalyzer::new(vec![1, 2, 3, 4, 5]);
let result = *analyzer.mean == 3.0;
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "cache_kwargs"
description = "Keyword args in cache key"

python = '''
from functools import lru_cache

@lru_cache
def func(x, y=10):
    return x + y

result = func(5) == 15 and func(5, y=20) == 25
'''

rust = '''
// Keyword args in cache key
use std::collections::HashMap;

#[derive(Hash, Eq, PartialEq)]
struct CacheKey {
    x: i32,
    y: i32,
}

fn func(cache: &mut HashMap<CacheKey, i32>, x: i32, y: Option<i32>) -> i32 {
    let y = y.unwrap_or(10);
    let key = CacheKey { x, y };
    *cache.entry(key).or_insert_with(|| x + y)
}

let mut cache = HashMap::new();
let result = func(&mut cache, 5, None) == 15 && func(&mut cache, 5, Some(20)) == 25;
'''


[[test]]
name = "cache_eviction"
description = "LRU eviction when maxsize reached"

python = '''
from functools import lru_cache

@lru_cache(maxsize=2)
def func(x):
    return x * 2

func(1)
func(2)
func(3)  # evicts 1
info = func.cache_info()
result = info.currsize == 2
'''

rust = '''
// LRU eviction when maxsize reached
use lru::LruCache;

let mut cache: LruCache<i32, i32> = LruCache::new(2.try_into().unwrap());
cache.put(1, 2);
cache.put(2, 4);
cache.put(3, 6);  // evicts 1
let result = cache.len() == 2;
'''


[[test]]
name = "cache_method"
description = "@lru_cache on instance method (use @cached_property or wrapper)"

python = '''
from functools import lru_cache

class MyClass:
    def __init__(self, multiplier):
        self.multiplier = multiplier
    
    @lru_cache(maxsize=128)
    def compute(self, x):
        return x * self.multiplier

obj = MyClass(5)
result = obj.compute(3) == 15
'''

rust = '''
// @lru_cache on instance method (use @cached_property or wrapper)
use lru::LruCache;
use std::sync::Mutex;

struct MyClass {
    multiplier: i32,
    cache: Mutex<LruCache<i32, i32>>,
}

impl MyClass {
    fn new(multiplier: i32) -> Self {
        Self {
            multiplier,
            cache: Mutex::new(LruCache::new(128.try_into().unwrap())),
        }
    }
    
    fn compute(&self, x: i32) -> i32 {
        let mut cache = self.cache.lock().unwrap();
        if let Some(&val) = cache.get(&x) {
            return val;
        }
        let val = x * self.multiplier;
        cache.put(x, val);
        val
    }
}

let obj = MyClass::new(5);
let result = obj.compute(3) == 15;
'''

