[metadata]
name = "functools Cache Tests"
category = "decorators-closures"

# =============================================================================
# @cache (Python 3.9+)
# =============================================================================

[[test]]
name = "cache_basic"
description = "@cache def f(x): return expensive(x)"

python = '''
from functools import cache

@cache
def expensive(x):
    return x * x

result = expensive(5) == 25
'''

rust = '''
// @cache def f(x): return expensive(x)
use std::collections::HashMap;
use std::sync::Mutex;

lazy_static::lazy_static! {
    static ref CACHE: Mutex<HashMap<i32, i32>> = Mutex::new(HashMap::new());
}

fn expensive(x: i32) -> i32 {
    let mut cache = CACHE.lock().unwrap();
    *cache.entry(x).or_insert_with(|| x * x)
}

let result = expensive(5) == 25;
'''


[[test]]
name = "cache_hits"
description = "Same args return cached result"

python = '''
from functools import cache

call_count = 0

@cache
def func(x):
    global call_count
    call_count += 1
    return x * 2

func(5)
func(5)
result = call_count == 1
'''

rust = '''
// Same args return cached result
use std::collections::HashMap;
use std::sync::Mutex;

lazy_static::lazy_static! {
    static ref CACHE: Mutex<HashMap<i32, i32>> = Mutex::new(HashMap::new());
    static ref CALL_COUNT: Mutex<i32> = Mutex::new(0);
}

fn func(x: i32) -> i32 {
    let mut cache = CACHE.lock().unwrap();
    *cache.entry(x).or_insert_with(|| {
        *CALL_COUNT.lock().unwrap() += 1;
        x * 2
    })
}

func(5);
func(5);
let result = *CALL_COUNT.lock().unwrap() == 1;
'''


