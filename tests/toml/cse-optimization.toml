# =============================================================================
# Real-World Game State Example (from test_array_bug.rs)
# =============================================================================

[[test]]
name = "game_state_period_check"
description = "Game state period check should not create unnecessary temps"

python = '''
class Period:
    name: str
    number: int

class State:
    period: Period
    time_elapsed: int
    game_status: str

HALF_LENGTH = 2700

def check_half_complete(state: State) -> bool:
    if state.time_elapsed > HALF_LENGTH and state.period.name != "ExtraTime":
        return True
    return False
'''

rust = '''
pub struct Period {
    pub name: String,
    pub number: i64,
}

pub struct State {
    pub period: Period,
    pub time_elapsed: i64,
    pub game_status: String,
}

const HALF_LENGTH: i64 = 2700;

pub fn check_half_complete(state: &State) -> bool {
    if state.time_elapsed > HALF_LENGTH && state.period.name != "ExtraTime" {
        return true;
    }
    return false;
}
'''

[[test]]
name = "multiple_period_checks"
description = "Multiple period checks with same expression should use CSE"

python = '''
class Period:
    name: str

class State:
    period: Period

def handle_period(state: State) -> str:
    if state.period.name == "FirstHalf":
        return "first"
    elif state.period.name == "SecondHalf":
        return "second"
    elif state.period.name == "ExtraTime":
        return "extra"
    return "unknown"
'''

rust = '''
pub struct Period {
    pub name: String,
}

pub struct State {
    pub period: Period,
}

pub fn handle_period(state: &State) -> String {
    if state.period.name == "FirstHalf" {
        return "first".to_string();
    } else if state.period.name == "SecondHalf" {
        return "second".to_string();
    } else if state.period.name == "ExtraTime" {
        return "extra".to_string();
    }
    return "unknown".to_string();
}
'''

# =============================================================================
# Method Call CSE - Should create temp variables
# =============================================================================

[[test]]
name = "method_call_list_index"
description = "list.index() call should be cached with CSE"

python = '''
def find_twice(items: list[int], value: int) -> int:
    idx = items.index(value)
    return idx + items.index(value)
'''

rust = '''
pub fn find_twice(items: Vec<i32>, value: i32) -> i32 {
    let _cse_temp_0 = items
        .iter()
        .position(|x| *x == value)
        .map(|i| i as i32)
        .unwrap_or(-1);
    let idx = _cse_temp_0;
    return idx + _cse_temp_0;
}
'''

[[test]]
name = "method_call_str_find"
description = "str.find() call should be cached with CSE"

python = '''
def check_position(text: str, char: str) -> bool:
    if text.find(char) >= 0:
        return text.find(char) < 10
    return False
'''

rust = '''
pub fn check_position(text: &str, char: &str) -> bool {
    let _cse_temp_0 = text.find(char).map(|i| i as i32).unwrap_or(-1);
    if _cse_temp_0 >= 0 {
        return _cse_temp_0 < 10;
    }
    return false;
}
'''

