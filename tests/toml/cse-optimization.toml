# =============================================================================
# Nested Binary Operations - SHOULD create CSE temps when reused
# =============================================================================

[[test]]
name = "nested_arithmetic_reused"
description = "Nested arithmetic expression used multiple times should use CSE"

python = '''
def calculate(a: int, b: int, c: int) -> int:
    x = (a + b) * c
    y = (a + b) * c + 1
    return x + y
'''

rust = '''
pub fn calculate(a: i64, b: i64, c: i64) -> i64 {
    let _cse_temp_0 = (a + b) * c;
    let x = _cse_temp_0;
    let y = _cse_temp_0 + 1;
    return x + y;
}
'''

[[test]]
name = "function_call_in_expression"
description = "Function call results should be cached"

python = '''
def use_abs_twice(x: int) -> int:
    if abs(x) > 10:
        return abs(x)
    return 0
'''

rust = '''
pub fn use_abs_twice(x: i64) -> i64 {
    let _cse_temp_0 = x.abs();
    if _cse_temp_0 > 10 {
        return _cse_temp_0;
    }
    return 0;
}
'''

