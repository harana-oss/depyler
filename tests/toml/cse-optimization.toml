# =============================================================================
# Complex Expressions That SHOULD Use CSE
# =============================================================================

[[test]]
name = "repeated_complex_expression"
description = "Same complex expression used twice should use CSE"

python = '''
def compute(a: int, b: int) -> int:
    x = a * b + a * b
    return x
'''

rust = '''
pub fn compute(a: i64, b: i64) -> i64 {
    let _cse_temp_0 = a * b;
    let x = _cse_temp_0 + _cse_temp_0;
    return x;
}
'''

[[test]]
name = "expression_with_function_call"
description = "Expression containing function call should use CSE"

python = '''
def safe_divide(a: int, b: int) -> int:
    if abs(b) > 0:
        return a // abs(b)
    return 0
'''

rust = '''
pub fn safe_divide(a: i64, b: i64) -> i64 {
    let _cse_temp_0 = b.abs();
    if _cse_temp_0 > 0 {
        return a / _cse_temp_0;
    }
    return 0;
}
'''

