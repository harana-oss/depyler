[metadata]
name = "CSE Optimization Tests"
category = "optimizer"

# =============================================================================
# Simple Comparisons - Should NOT create temp variables
# =============================================================================

[[test]]
name = "simple_equality_comparison"
description = "Simple equality comparison should not create CSE temp"

python = '''
def check_status(name: str) -> bool:
    if name == "Active":
        return True
    return False
'''

rust = '''
pub fn check_status(name: &str) -> bool {
    if name == "Active" {
        return true;
    }
    return false;
}
'''

