[[test]]
name = "result_return_type"
description = "Function with Result return type"

python = '''
def divide(a: int, b: int) -> int:
    if b == 0:
        raise ZeroDivisionError("division by zero")
    return a // b
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn divide(a: i32, b: i32) -> i32 {
    if b == 0 {
        panic!("{}", "division by zero");
    }
    return {
        let a = a;
        let b = b;
        let q = a / b;
        let r = a % b;
        let r_negative = r < 0;
        let b_negative = b < 0;
        let r_nonzero = r != 0;
        let signs_differ = r_negative != b_negative;
        let needs_adjustment = r_nonzero && signs_differ;
        if needs_adjustment { q - 1 } else { q }
    };
}
'''

[[test]]
name = "side_effect_function_result"
description = "Side effect function with try/except has Result return and Ok(())"

python = '''
def set_value(data: dict[str, int], key: str, value: int):
    try:
        data[key] = value
    except KeyError:
        raise ValueError("Invalid key")
'''

rust = '''
use std::collections::HashMap;
#[derive(Debug, Clone)]
pub struct ValueError {
    message: String,
}
impl std::fmt::Display for ValueError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "value error: {}", self.message)
    }
}
impl std::error::Error for ValueError {}
impl ValueError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn set_value(data: &mut HashMap<String, i32>, key: String, value: i32) {
    {
        data.insert(key, value);
        panic!("{}", "Invalid key");
    }
}
'''

