'''

rust = '''
use std::collections::HashMap;
pub fn update_config(config: &mut HashMap<String, i32>, key: String, value: i32) {
    if !config.get(&key).is_some() {
        panic!("{}", "Key not found");
    }
    config.insert(key, value);
}
'''

[[test]]
name = "divide_by_zero_result"
description = "Safe divide with try/except generates Result"

python = '''
def safe_divide(a: int, b: int) -> int:
    try:
        result = a // b
        return result
    except ZeroDivisionError:
        raise ValueError("Division by zero")
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ValueError {
    message: String,
}
impl std::fmt::Display for ValueError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "value error: {}", self.message)
    }
}
impl std::error::Error for ValueError {}
impl ValueError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn safe_divide(a: i32, b: i32) -> i32 {
    {
        let result = {
            let a = a;
            let b = b;
            let q = a / b;
            let r = a % b;
            let r_negative = r < 0;
            let b_negative = b < 0;
            let r_nonzero = r != 0;
            let signs_differ = r_negative != b_negative;
            let needs_adjustment = r_nonzero && signs_differ;
            if needs_adjustment { q - 1 } else { q }
        };
        return result;
        panic!("{}", "Division by zero");
    }
}
'''

[[test]]
name = "result_unwrapping_at_call_site"
description = "Call site should unwrap Result for dict return"
compile_check = true

python = '''
def calculate_stats(numbers: list[int]) -> dict[str, int]:
    if not numbers:
        return {"count": 0, "sum": 0}
    count = len(numbers)
    return {"count": count, "sum": 0}
'''

rust = '''
use std::collections::HashMap;
pub fn calculate_stats(numbers: &Vec<i32>) -> HashMap<String, i32> {
    if numbers.is_empty() {
        return {
            let mut map = HashMap::new();
            map.insert("count".to_string(), 0);
            map.insert("sum".to_string(), 0);
            map
        };
    }
    let count = numbers.len() as i32;
    return {
        let mut map = HashMap::new();
        map.insert("count".to_string(), count);
        map.insert("sum".to_string(), 0);
        map
    };
}
'''