[metadata]
name = "JSON Module Tests"
category = "stdlib-json"

# =============================================================================
# JSON Serialization
# =============================================================================

[[test]]
name = "json_dumps"
description = "json.dumps() serialization"

python = '''
import json

def serialize_data(data: dict) -> str:
    return json.dumps(data)
'''

rust = '''
use serde_json as json;
use serde_json;
use std::collections::HashMap;
pub fn serialize_data(data: &HashMap<serde_json::Value, serde_json::Value>) -> String {
    return serde_json::to_string(&data).unwrap();
}
'''

