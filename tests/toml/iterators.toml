[[test]]
name = "range_positive_step"
description = "range with positive step uses step_by"

python = '''
def count_by_twos():
    for i in range(0, 10, 2):
        print(i)
'''

rust = '''
pub fn count_by_twos() {
    for i in {
        let step = 2 as usize;
        if step == 0 {
            panic!("range() arg 3 must not be zero");
        }
        (0..10).step_by(step)
    } {
        log::info!("{}", i);
    }
}
'''

[[test]]
name = "range_negative_step"
description = "range with negative step uses rev or step_by"

python = '''
def count_down():
    for i in range(10, 0, -1):
        print(i)
'''

rust = '''
pub fn count_down() {
    for i in {
        let step = (-1 as i32).abs() as usize;
        if step == 0 {
            panic!("range() arg 3 must not be zero");
        }
        (0..10).rev().step_by(step.max(1))
    } {
        log::info!("{}", i);
    }
}
'''

