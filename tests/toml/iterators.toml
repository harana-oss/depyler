[[test]]
name = "iterator_take"
description = "Taking first n elements"

python = '''
def first_n(items: list[int], n: int) -> list[int]:
    result = []
    for i, item in enumerate(items):
        if i >= n:
            break
        result.append(item)
    return result
'''

rust = '''
pub fn first_n(items: Vec<i32>, n: i32) -> Vec<i32> {
    let mut result = vec![];
    for (i, item) in items.iter().enumerate().map(|(i, x)| (i as i32, x.clone())) {
        let i = i as i32;
        if i >= n {
            break;
        }
        result.push(item);
    }
    return result;
}
'''

[[test]]
name = "iterator_skip"
description = "Skipping first n elements"

python = '''
def after_n(items: list[int], n: int) -> list[int]:
    return items[n:]
'''

rust = '''
pub fn after_n(items: &Vec<i32>, n: i32) -> Vec<i32> {
    return {
        let base = &items;
        let start = (n).max(0) as usize;
        if start < base.len() {
            base[start..].to_vec()
        } else {
            Vec::new()
        }
    }
'''

