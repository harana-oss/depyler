[[test]]
name = "sum_dict_values_direct"
description = "sum() on dict values should not have redundant collect().iter()"

python = '''
def average_values(d: dict[str, int]) -> float:
    if len(d) == 0:
        return 0.0
    return sum(d.values()) / len(d)
'''

rust = '''
use std::collections::HashMap;
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = " Depyler: proven to terminate"]
pub fn average_values(d: &HashMap<String, i32>) -> f64 {
    let _cse_temp_0 = d.clone().len() as i32;
    let _cse_temp_1 = _cse_temp_0 == 0;
    if _cse_temp_1 {
        return 0.0;
    }
    return (d.values().cloned().sum::<i32>() as f64) / (d.len() as i32 as f64);
}
'''

