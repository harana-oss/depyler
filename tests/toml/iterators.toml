[[test]]
name = "range_with_variables"
description = "range with dynamic variable arguments"

python = '''
def dynamic_range(start: int, end: int, step: int):
    result = []
    for i in range(start, end, step):
        result.append(i)
    return result
'''

rust = '''
use serde_json;
pub fn dynamic_range(start: i32, end: i32, step: i32) -> Vec<serde_json::Value> {
    let mut result = vec![];
    for i in {
        let step = step as usize;
        if step == 0 {
            panic!("range() arg 3 must not be zero");
        }
        (start..end).step_by(step)
    } {
        result.push(i);
    }
    return result;
}
'''

[[test]]
name = "zip_uses_into_iter"
description = "zip() should use .into_iter() for owned collections"

python = '''
def create_from_lists(keys: list[str], values: list[int]) -> dict[str, int]:
    return dict(zip(keys, values))
'''

rust = '''
use std::collections::HashMap;
pub fn create_from_lists(keys: Vec<String>, values: Vec<i32>) -> HashMap<String, i32> {
    return keys
        .into_iter()
        .zip(values.into_iter())
        .into_iter()
        .collect::<HashMap<_, _>>();
}
'''

