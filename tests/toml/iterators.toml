[[test]]
name = "iterator_map"
description = "map() function on iterable"

python = '''
def double_all(items: list[int]) -> list[int]:
    return list(map(lambda x: x * 2, items))
'''

rust = '''
pub fn double_all(items: Vec<i32>) -> Vec<i32> {
    return items.iter().map(|x| x * 2).collect::<Vec<_>>();
}
'''

