# =============================================================================
# Iterator Chaining
# =============================================================================

[[test]]
name = "iterator_chain"
description = "Chaining multiple iterator operations"
tags = ["iterator", "chain"]

[test.python]
code = '''
def process(items: list[int]) -> list[int]:
    return list(map(lambda x: x * 2, filter(lambda x: x > 0, items)))
'''

[test.assertions]
contains = [".filter(", ".map(", "collect"]

[[test]]
name = "iterator_take"
description = "Taking first n elements"
tags = ["iterator", "take"]

[test.python]
code = '''
def first_n(items: list[int], n: int) -> list[int]:
    result = []
    for i, item in enumerate(items):
        if i >= n:
            break
        result.append(item)
    return result
'''

[test.assertions]
contains_any = [[".take(", "break"]]

[[test]]
name = "iterator_skip"
description = "Skipping first n elements"
tags = ["iterator", "skip"]

[test.python]
code = '''
def after_n(items: list[int], n: int) -> list[int]:
    return items[n:]
'''

[test.assertions]
contains_any = [[".skip(", "&items[n..]"]]

