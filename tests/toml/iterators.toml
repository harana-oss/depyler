# Iterator Tests - Migrated from test_iterator_deref.rs

[metadata]
name = "Iterator Tests"
category = "iterators"

# =============================================================================
# Iterator Methods
# =============================================================================

[[test]]
name = "iterator_map"
description = "map() function on iterable"
tags = ["iterator", "map"]

[test.python]
code = '''
def double_all(items: list[int]) -> list[int]:
    return list(map(lambda x: x * 2, items))
'''

[test.assertions]
contains = [".map(", "collect"]

