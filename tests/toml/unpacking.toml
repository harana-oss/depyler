# Nested Unpacking
# =============================================================================

[[test]]
name = "nested_tuple_unpacking"
skip = true
description = "(a, b), c = ((1, 2), 3)"
python = """
(a, b), c = ((1, 2), 3)
print(f"a={a}, b={b}, c={c}")
"""
rust = """
