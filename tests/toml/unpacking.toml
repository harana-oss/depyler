[metadata]
name = "Unpacking Tests"
category = "core-language"

# =============================================================================
# Basic Unpacking
# =============================================================================

[[test]]
name = "basic_tuple_unpacking"
skip = true
description = "a, b = (1, 2)"
python = """
a, b = (1, 2)
print(f"a={a}, b={b}")
"""
rust = """
let (a, b) = (1, 2);
log::info!("{}", format!("a={}, b={}", a, b));"""

[[test]]
name = "basic_list_unpacking"
skip = true
description = "a, b, c = [1, 2, 3]"
python = """
a, b, c = [1, 2, 3]
print(f"a={a}, b={b}, c={c}")
"""
rust = """
let (a, b, c) = vec![1, 2, 3];
log::info!("{}", format!("a={}, b={}, c={}", a, b, c));"""

# =============================================================================
# Starred Expressions
# =============================================================================

[[test]]
name = "starred_at_end"
skip = true
description = "a, *rest = [1, 2, 3, 4]"
python = """
a, *rest = [1, 2, 3, 4]
print(f"a={a}, rest={rest}")
"""
rust = """
let _data = vec![1, 2, 3, 4];
let a = _data[0];
let rest: Vec<_> = _data[1usize..].to_vec();
log::info!("{}", format!("a={}, rest={}", a, rest));"""

[[test]]
name = "starred_at_beginning"
skip = true
description = "*rest, last = [1, 2, 3, 4]"
python = """
*rest, last = [1, 2, 3, 4]
print(f"rest={rest}, last={last}")
"""
rust = """
let _data = vec![1, 2, 3, 4];
let rest: Vec<_> = _data[.._data.len() - 1usize].to_vec();
let last = _data[_data.len() - 0usize - 1];
log::info!("{}", format!("rest={}, last={}", rest, last));"""

[[test]]
name = "starred_in_middle"
skip = true
description = "first, *middle, last = [1, 2, 3, 4, 5]"
python = """
first, *middle, last = [1, 2, 3, 4, 5]
print(f"first={first}, middle={middle}, last={last}")
"""
rust = """
let _data = vec![1, 2, 3, 4, 5];
let first = _data[0];
let middle: Vec<_> = _data[1usize.._data.len() - 1usize].to_vec();
let last = _data[_data.len() - 0usize - 1];
log::info!(
    "{}",
    format!("first={}, middle={}, last={}", first, middle, last)
);"""

[[test]]
name = "starred_single_element"
skip = true
description = "a, *rest = [1] results in rest = []"
python = """
a, *rest = [1]
print(f"a={a}, rest={rest}")
"""
rust = """
let _data = vec![1];
let a = _data[0];
let rest: Vec<_> = _data[1usize..].to_vec();
log::info!("{}", format!("a={}, rest={}", a, rest));"""

