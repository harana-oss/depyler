[metadata]
name = "Unpacking Tests"
category = "core-language"

# =============================================================================
# Basic Unpacking
# =============================================================================

[[test]]
name = "basic_tuple_unpacking"
description = "a, b = (1, 2)"
python = """
a, b = (1, 2)
print(f"a={a}, b={b}")
"""
rust = """
fn main() {
    let (a, b) = (1, 2);
    log::info!("a={}, b={}", a, b);
}
"""

[[test]]
name = "basic_list_unpacking"
description = "a, b, c = [1, 2, 3]"
python = """
a, b, c = [1, 2, 3]
print(f"a={a}, b={b}, c={c}")
"""
rust = """
fn main() {
    let data = vec![1, 2, 3];
    let a = data[0];
    let b = data[1];
    let c = data[2];
    log::info!("a={}, b={}, c={}", a, b, c);
}
"""

# =============================================================================
# Starred Expressions
# =============================================================================

[[test]]
name = "starred_at_end"
description = "a, *rest = [1, 2, 3, 4]"
python = """
a, *rest = [1, 2, 3, 4]
print(f"a={a}, rest={rest}")
"""
rust = """
fn main() {
    let data = vec![1, 2, 3, 4];
    let a = data[0];
    let rest: Vec<i32> = data[1..].to_vec();
    log::info!("a={}, rest={:?}", a, rest);
}
"""

[[test]]
name = "starred_at_beginning"
description = "*rest, last = [1, 2, 3, 4]"
python = """
*rest, last = [1, 2, 3, 4]
print(f"rest={rest}, last={last}")
"""
rust = """
fn main() {
    let data = vec![1, 2, 3, 4];
    let last = data[data.len() - 1];
    let rest: Vec<i32> = data[..data.len() - 1].to_vec();
    log::info!("rest={:?}, last={}", rest, last);
}
"""

[[test]]
name = "starred_in_middle"
description = "first, *middle, last = [1, 2, 3, 4, 5]"
python = """
first, *middle, last = [1, 2, 3, 4, 5]
print(f"first={first}, middle={middle}, last={last}")
"""
rust = """
fn main() {
    let data = vec![1, 2, 3, 4, 5];
    let first = data[0];
    let last = data[data.len() - 1];
    let middle: Vec<i32> = data[1..data.len() - 1].to_vec();
    log::info!("first={}, middle={:?}, last={}", first, middle, last);
}
"""

[[test]]
name = "starred_single_element"
description = "a, *rest = [1] results in rest = []"
python = """
a, *rest = [1]
print(f"a={a}, rest={rest}")
"""
rust = """
fn main() {
    let data = vec![1];
    let a = data[0];
    let rest: Vec<i32> = if data.len() > 1 { data[1..].to_vec() } else { vec![] };
    log::info!("a={}, rest={:?}", a, rest);
}
"""

# =============================================================================
# Nested Unpacking
# =============================================================================

[[test]]
name = "nested_tuple_unpacking"
description = "(a, b), c = ((1, 2), 3)"
python = """
(a, b), c = ((1, 2), 3)
print(f"a={a}, b={b}, c={c}")
"""
rust = """
fn main() {
    let ((a, b), c) = ((1, 2), 3);
    log::info!("a={}, b={}, c={}", a, b, c);
}
"""

[[test]]
name = "deeply_nested_unpacking"
description = "a, (b, (c, d)) = (1, (2, (3, 4)))"
python = """
a, (b, (c, d)) = (1, (2, (3, 4)))
print(f"a={a}, b={b}, c={c}, d={d}")
"""
rust = """
fn main() {
    let (a, (b, (c, d))) = (1, (2, (3, 4)));
    log::info!("a={}, b={}, c={}, d={}", a, b, c, d);
}
"""

# =============================================================================
# Unpacking in Function Calls
# =============================================================================

[[test]]
name = "starred_in_call"
description = "func(*args)"
python = """
def print_values(*args):
    print(f"Values: {args}")

numbers = [1, 2, 3]
print_values(*numbers)
"""
rust = """
fn print_values(args: &[i32]) {
    log::info!("Values: {:?}", args);
}

fn main() {
    let numbers = vec![1, 2, 3];
    print_values(&numbers);
}
"""

[[test]]
name = "double_starred_in_call"
description = "func(**kwargs)"
python = """
def print_kwargs(**kwargs):
    for key, value in kwargs.items():
        print(f"{key}={value}")

config = {"x": 10, "y": 20}
print_kwargs(**config)
"""
rust = """
use std::collections::HashMap;

fn print_kwargs(kwargs: &HashMap<&str, i32>) {
    for (key, value) in kwargs {
        log::info!("{}={}", key, value);
    }
}

fn main() {
    let mut config = HashMap::new();
    config.insert("x", 10);
    config.insert("y", 20);
    print_kwargs(&config);
}
"""

[[test]]
name = "combined_unpacking_in_call"
description = "func(*args, **kwargs)"
python = """
def combined_func(*args, **kwargs):
    print(f"args: {args}")
    print(f"kwargs: {kwargs}")

args = [1, 2]
kwargs = {"x": 10, "y": 20}
combined_func(*args, **kwargs)
"""
rust = """
use std::collections::HashMap;

fn combined_func(args: &[i32], kwargs: &HashMap<&str, i32>) {
    log::info!("args: {:?}", args);
    log::info!("kwargs: {:?}", kwargs);
}

fn main() {
    let args = vec![1, 2];
    let mut kwargs = HashMap::new();
    kwargs.insert("x", 10);
    kwargs.insert("y", 20);
    combined_func(&args, &kwargs);
}
"""

# =============================================================================
# Unpacking in Loops
# =============================================================================

[[test]]
name = "unpacking_in_for"
description = "for a, b in pairs:"
python = """
pairs = [(1, 2), (3, 4), (5, 6)]
for a, b in pairs:
    print(f"a={a}, b={b}")
"""
rust = """
fn main() {
    let pairs = vec![(1, 2), (3, 4), (5, 6)];
    for (a, b) in pairs {
        log::info!("a={}, b={}", a, b);
    }
}
"""

[[test]]
name = "nested_unpacking_in_for"
description = "for (a, b), c in data:"
python = """
data = [((1, 2), 3), ((4, 5), 6)]
for (a, b), c in data:
    print(f"a={a}, b={b}, c={c}")
"""
rust = """
fn main() {
    let data = vec![((1, 2), 3), ((4, 5), 6)];
    for ((a, b), c) in data {
        log::info!("a={}, b={}, c={}", a, b, c);
    }
}
"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "unpacking_with_annotations"
description = "Unpacking where variables have type hints"
python = """
data: tuple[int, int] = (10, 20)
x: int
y: int
x, y = data
print(f"x={x}, y={y}")
"""
rust = """
fn main() {
    let data: (i32, i32) = (10, 20);
    let (x, y): (i32, i32) = data;
    log::info!("x={}, y={}", x, y);
}
"""

[[test]]
name = "unpacking_string"
description = "a, b, c = 'abc'"
python = """
a, b, c = 'abc'
print(f"a={a}, b={b}, c={c}")
"""
rust = """
fn main() {
    let s = "abc";
    let chars: Vec<char> = s.chars().collect();
    let a = chars[0];
    let b = chars[1];
    let c = chars[2];
    log::info!("a={}, b={}, c={}", a, b, c);
}
"""

[[test]]
name = "unpacking_range"
description = "a, b, c = range(3)"
python = """
a, b, c = range(3)
print(f"a={a}, b={b}, c={c}")
"""
rust = """
fn main() {
    let range: Vec<i32> = (0..3).collect();
    let a = range[0];
    let b = range[1];
    let c = range[2];
    log::info!("a={}, b={}, c={}", a, b, c);
}
"""
