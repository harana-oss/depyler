log::info!("{}", format!("a={}, b={}, c={}, d={}", a, b, c, d));"""

# =============================================================================
# Unpacking in Function Calls
# =============================================================================

[[test]]
name = "starred_in_call"
skip = true
description = "func(*args)"
python = """
def print_values(*args):
    print(f"Values: {args}")

numbers = [1, 2, 3]
print_values(*numbers)
"""
rust = """
pub fn print_values() {
    log::info!("{}", format!("Values: {}", args));
}
let numbers = vec![1, 2, 3];
print_values(&numbers);"""

[[test]]
name = "double_starred_in_call"
skip = true
description = "func(**kwargs)"
python = """
def print_kwargs(**kwargs):
    for key, value in kwargs.items():
        print(f"{key}={value}")

config = {"x": 10, "y": 20}
print_kwargs(**config)
"""
rust = """
pub fn print_kwargs() {
    for (key, value) in kwargs
        .iter()
        .map(|(k, v)| (k.clone(), v.clone()))
        .collect::<Vec<_>>()
    {
        log::info!("{}", format!("{}={}", key, value));
    }
}
let config = {
    let mut map = HashMap::new();
    map.insert("x".to_string(), 10);
    map.insert("y".to_string(), 20);
    map
};
print_kwargs();"""

[[test]]
name = "combined_unpacking_in_call"
skip = true
description = "func(*args, **kwargs)"
python = """
def combined_func(*args, **kwargs):
    print(f"args: {args}")
    print(f"kwargs: {kwargs}")

args = [1, 2]
kwargs = {"x": 10, "y": 20}
combined_func(*args, **kwargs)
"""
rust = """
pub fn combined_func() {
    log::info!("{}", format!("args: {}", args));
    log::info!("{}", format!("kwargs: {}", kwargs));
}
let args = vec![1, 2];
let kwargs = {
    let mut map = HashMap::new();
    map.insert("x".to_string(), 10);
    map.insert("y".to_string(), 20);
    map
};
combined_func(&args);"""

# =============================================================================
# Unpacking in Loops
# =============================================================================

[[test]]
name = "unpacking_in_for"
skip = true
description = "for a, b in pairs:"
python = """
pairs = [(1, 2), (3, 4), (5, 6)]
for a, b in pairs:
    print(f"a={a}, b={b}")
"""
rust = """
let pairs = vec![(1, 2), (3, 4), (5, 6)];
for (a, b) in pairs.iter().cloned() {
    log::info!("{}", format!("a={}, b={}", a, b));
}"""

[[test]]
name = "nested_unpacking_in_for"
skip = true
description = "for (a, b), c in data:"
python = """
data = [((1, 2), 3), ((4, 5), 6)]
for (a, b), c in data:
    print(f"a={a}, b={b}, c={c}")
"""
rust = """
let data = vec![((1, 2), 3), ((4, 5), 6)];
for ((a, b), c) in data.iter().cloned() {
    log::info!("{}", format!("a={}, b={}, c={}", a, b, c));
}"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "unpacking_with_annotations"
skip = true
description = "Unpacking where variables have type hints"
python = """
data: tuple[int, int] = (10, 20)
x: int
y: int
x, y = data
print(f"x={x}, y={y}")
"""
rust = """
let data: (i32, i32) = (10, 20);
let x: i32;
let y: i32;
(x, y) = data;
log::info!("{}", format!("x={}, y={}", x, y));"""

[[test]]
name = "unpacking_string"
skip = true
description = "a, b, c = 'abc'"
python = """
a, b, c = 'abc'
print(f"a={a}, b={b}, c={c}")
"""
rust = """
let (a, b, c) = "abc".to_string();
log::info!("{}", format!("a={}, b={}, c={}", a, b, c));"""

[[test]]
name = "unpacking_range"
skip = true
description = "a, b, c = range(3)"
python = """
a, b, c = range(3)
print(f"a={a}, b={b}, c={c}")
"""
rust = """
let (a, b, c) = 0..3;
log::info!("{}", format!("a={}, b={}, c={}", a, b, c));"""
