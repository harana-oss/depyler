[metadata]
name = "exception-handling"
description = "Tests for Python try/except/finally error handling"

# ============================================================================
# Phase 1: Simple Try/Except Blocks
# ============================================================================

[[test]]
name = "simple_try_except"
description = "Test basic try/except with bare except"

python = '''
def safe_divide(a: int, b: int) -> int:
    try:
        return a // b
    except:
        return 0
'''

rust = '''
#[derive(Debug, Clone)]
pub struct ZeroDivisionError {
    message: String,
}
impl std::fmt::Display for ZeroDivisionError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "division by zero: {}", self.message)
    }
}
impl std::error::Error for ZeroDivisionError {}
impl ZeroDivisionError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn safe_divide(a: i32, b: i32) -> i32 {
    {
        return {
            let a = a;
            let b = b;
            let q = a / b;
            let r = a % b;
            let r_negative = r < 0;
            let b_negative = b < 0;
            let r_nonzero = r != 0;
            let signs_differ = r_negative != b_negative;
            let needs_adjustment = r_nonzero && signs_differ;
            if needs_adjustment { q - 1 } else { q }
        };
        return 0;
    }
};
}
'''

