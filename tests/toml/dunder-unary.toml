# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "neg_vector"
description = "Negating a vector class"

python = '''
class Vector:
    def __init__(self, x, y):
        self.x = x
        self.y = y
    
    def __neg__(self):
        return Vector(-self.x, -self.y)
    
    def __repr__(self):
        return f"Vector({self.x}, {self.y})"

# Negating a vector class
v = Vector(3, 4)
neg_v = -v
result = (neg_v.x == -3 and neg_v.y == -4)
print(f"Original: {v}, Negated: {neg_v}, result: {result}")
'''

rust = '''
use std::ops::Neg;

#[derive(Debug)]
struct Vector {
    x: i32,
    y: i32,
}

impl Neg for Vector {
    type Output = Vector;
    
    fn neg(self) -> Vector {
        Vector { x: -self.x, y: -self.y }
    }
}

fn main() {
    let v = Vector { x: 3, y: 4 };
    let neg_v = -v;
    let result = neg_v.x == -3 && neg_v.y == -4;
    log::info!("Negated vector: {:?}, result: {}", neg_v, result);
}
'''


[[test]]
name = "abs_complex"
description = "Magnitude of complex number"

python = '''
import math

class Complex:
    def __init__(self, real, imag):
        self.real = real
        self.imag = imag
    
    def __abs__(self):
        # Magnitude of complex number
        return math.sqrt(self.real**2 + self.imag**2)

c = Complex(3, 4)
magnitude = abs(c)
result = (magnitude == 5.0)
print(f"Complex(3, 4) magnitude: {magnitude}, result: {result}")
'''

rust = '''
struct Complex {
    real: f64,
    imag: f64,
}

impl Complex {
    fn abs(&self) -> f64 {
        // Magnitude of complex number
        (self.real * self.real + self.imag * self.imag).sqrt()
    }
}

fn main() {
    let c = Complex { real: 3.0, imag: 4.0 };
    let magnitude = c.abs();
    let result = (magnitude - 5.0).abs() < 1e-10;
    log::info!("Complex(3, 4) magnitude: {}, result: {}", magnitude, result);
}
'''


[[test]]
name = "invert_bitmask"
description = "Inverting a bitmask class"

python = '''
class BitMask:
    def __init__(self, value):
        self.value = value
    
    def __invert__(self):
        # Inverting a bitmask class (bitwise NOT)
        # For 8-bit: ~5 = ~0b00000101 = 0b11111010 = -6 in two's complement
        return BitMask(~self.value)
    
    def __repr__(self):
        return f"BitMask({self.value})"

mask = BitMask(5)
inverted = ~mask
result = (inverted.value == ~5)
print(f"Original: {mask}, Inverted: {inverted}, result: {result}")
'''

rust = '''
use std::ops::Not;

#[derive(Debug)]
struct BitMask {
    value: i32,
}

impl Not for BitMask {
    type Output = BitMask;
    
    fn not(self) -> BitMask {
        // Inverting a bitmask class (bitwise NOT)
        BitMask { value: !self.value }
    }
}

fn main() {
    let mask = BitMask { value: 5 };
    let inverted = !mask;
    let result = inverted.value == !5;
    log::info!("Original: 5, Inverted: {}, result: {}", inverted.value, result);
}
'''


# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "pos_identity"
description = "+x often returns x (or copy)"

python = '''
class Value:
    def __init__(self, x):
        self.x = x
    
    def __pos__(self):
        # +x often returns x (or copy)
        return Value(+self.x)

v = Value(42)
pos_v = +v
result = (pos_v.x == 42 and v.x == 42)
print(f"Original: {v.x}, After +: {pos_v.x}, result: {result}")
'''

rust = '''
// Rust doesn't have unary + operator trait
// The + operator on numbers is typically identity
// For custom types, you could implement Clone or Copy

#[derive(Clone, Debug)]
struct Value {
    x: i32,
}

fn main() {
    let v = Value { x: 42 };
    // In Rust, "+" would just clone
    let pos_v = v.clone();
    let result = pos_v.x == 42 && v.x == 42;
    log::info!("Original: {}, Cloned: {}, result: {}", v.x, pos_v.x, result);
}
'''


