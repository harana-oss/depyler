[metadata]
name = "Dunder Unary Tests"
category = "dunder-methods"

# =============================================================================
# Numeric Unary
# =============================================================================

[[test]]
name = "dunder_neg"
description = "def __neg__(self): return MyClass(-self.x)"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __neg__(self):
        return Number(-self.value)

n = Number(5)
result = (-n).value
'''

rust = '''
use std::ops::Neg;
struct Number { value: i32 }
impl Neg for Number {
    type Output = Number;
    fn neg(self) -> Number {
        Number { value: -self.value }
    }
}
'''


[[test]]
name = "dunder_pos"
description = "def __pos__(self): return MyClass(+self.x)"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __pos__(self):
        return Number(+self.value)

n = Number(5)
result = (+n).value
'''

rust = '''
// Rust doesn't have unary + operator trait
'''


[[test]]
name = "dunder_abs"
description = "def __abs__(self): return MyClass(abs(self.x))"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __abs__(self):
        return Number(abs(self.value))

n = Number(-5)
result = abs(n).value
'''

rust = '''
struct Number { value: i32 }
impl Number {
    fn abs(self) -> Number {
        Number { value: self.value.abs() }
    }
}
'''


