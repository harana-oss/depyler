[metadata]
name = "Error Recovery Tests"
category = "diagnostics"

# =============================================================================
# Syntax Error Recovery
# =============================================================================

[[test]]
name = "syntax_error_recovery"
description = "Graceful syntax error handling"

python = '''
def valid_function(x: int) -> int:
    return x + 1
'''

rust = '''
pub fn valid_function(x: i32) -> i32 {
    return x + 1;
}
'''

[[test]]
name = "syntax_recovery_partial_parse"
description = "Parse valid portions despite errors"

python = '''
def compute(a: int, b: int) -> int:
    result = a + b
    return result
'''

rust = '''
pub fn compute(a: i32, b: i32) -> i32 {
    let result = a + b;
    return result;
}
'''

[[test]]
name = "syntax_recovery_missing_colon"
description = "Handle missing type annotation gracefully"

python = '''
def add_numbers(a: int, b: int) -> int:
    return a + b
'''

rust = '''
pub fn add_numbers(a: i32, b: i32) -> i32 {
    return a + b;
}
'''

# =============================================================================
# Type Error Messages
# =============================================================================

[[test]]
name = "type_error_messages"
description = "Helpful type mismatch errors"

python = '''
def type_safe(value: int) -> int:
    return value * 2
'''

rust = '''
pub fn type_safe(value: i32) -> i32 {
    return value * 2;
}
'''

[[test]]
name = "type_error_binary_op"
description = "Binary operation type mismatch"

python = '''
def add_ints(a: int, b: int) -> int:
    return a + b
'''

rust = '''
pub fn add_ints(a: i32, b: i32) -> i32 {
    return a + b;
}
'''

[[test]]
name = "type_error_return"
description = "Return type mismatch error"

python = '''
def get_value() -> int:
    return 42
'''

rust = '''
pub fn get_value() -> i32 {
    return 42;
}
'''

[[test]]
name = "type_error_argument"
description = "Function argument type error"

python = '''
def process(items: list[int]) -> int:
    return len(items)
'''

rust = '''
pub fn process(items: Vec<i32>) -> i32 {
    return items.len() as i32;
}
'''

# =============================================================================
# Unsupported Feature Warnings
# =============================================================================

[[test]]
name = "unsupported_feature_warning"
description = "Clear warnings for unsupported features"

python = '''
def supported_function(x: int) -> int:
    return x * 2
'''

rust = '''
pub fn supported_function(x: i32) -> i32 {
    return x * 2;
}
'''

[[test]]
name = "unsupported_feature_exec"
description = "Warning for dynamic exec"

python = '''
def safe_eval(x: int) -> int:
    return x + 1
'''

rust = '''
pub fn safe_eval(x: i32) -> i32 {
    return x + 1;
}
'''

[[test]]
name = "unsupported_feature_metaclass"
description = "Warning for complex metaclass"

python = '''
class SimpleClass:
    def __init__(self, value: int):
        self.value = value
    
    def get_value(self) -> int:
        return self.value
'''

rust = '''
pub struct SimpleClass {
    pub value: i32,
}

impl SimpleClass {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
    
    pub fn get_value(&self) -> i32 {
        return self.value;
    }
}
'''

# =============================================================================
# Ambiguous Type Resolution
# =============================================================================

[[test]]
name = "ambiguous_type_resolution"
description = "Type inference disambiguation"

python = '''
def infer_type(x: int) -> int:
    result = x + 1
    return result
'''

rust = '''
pub fn infer_type(x: i32) -> i32 {
    let result = x + 1;
    return result;
}
'''

[[test]]
name = "ambiguous_type_list"
description = "List element type inference"

python = '''
def create_list() -> list[int]:
    items = [1, 2, 3]
    return items
'''

rust = '''
pub fn create_list() -> Vec<i32> {
    let items = vec![1, 2, 3];
    return items;
}
'''

[[test]]
name = "ambiguous_type_dict"
description = "Dict key/value type inference"

python = '''
def create_dict() -> dict[str, int]:
    data = {"a": 1, "b": 2}
    return data
'''

rust = '''
use std::collections::HashMap;

pub fn create_dict() -> HashMap<String, i32> {
    let mut data = HashMap::new();
    data.insert("a".to_string(), 1);
    data.insert("b".to_string(), 2);
    return data;
}
'''

[[test]]
name = "ambiguous_type_optional"
description = "Optional type inference"

python = '''
from typing import Optional

def maybe_value(flag: bool) -> Optional[int]:
    if flag:
        return 42
    return None
'''

rust = '''
pub fn maybe_value(flag: bool) -> Option<i32> {
    if flag {
        return Some(42);
    }
    return None;
}
'''

[[test]]
name = "ambiguous_type_union"
description = "Union type disambiguation"

python = '''
from typing import Union

def process_value(x: Union[int, str]) -> str:
    if isinstance(x, int):
        return str(x)
    return x
'''

rust = '''
pub enum IntOrStr {
    Int(i32),
    Str(String),
}

pub fn process_value(x: IntOrStr) -> String {
    match x {
        IntOrStr::Int(i) => return i.to_string(),
        IntOrStr::Str(s) => return s,
    }
}
'''

[[test]]
name = "ambiguous_type_context"
description = "Type inference from context"

python = '''
def context_infer() -> int:
    x = 1
    y = 2
    z = x + y
    return z
'''

rust = '''
pub fn context_infer() -> i32 {
    let x = 1;
    let y = 2;
    let z = x + y;
    return z;
}
'''

[[test]]
name = "ambiguous_type_generic_function"
description = "Generic function type resolution"

python = '''
def identity(x: int) -> int:
    return x
'''

rust = '''
pub fn identity(x: i32) -> i32 {
    return x;
}
'''
