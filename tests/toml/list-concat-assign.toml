[metadata]
name = "List Concatenation Assignment Tests"
category = "codegen"
description = "Tests for list + [elem] augmented assignment generating .extend() instead of +="

[[test]]
name = "list_concat_assign_literal"
description = "x = x + [elem] generates .extend() not +="

python = '''
def append_item(items: list[int], val: int) -> list[int]:
    items = items + [val]
    return items
'''

[test.assertions]
contains = [".extend("]
not_contains = ["+="]

[[test]]
name = "list_concat_assign_multi"
description = "x = x + [a, b] generates .extend()"

python = '''
def append_two(items: list[int], a: int, b: int) -> list[int]:
    items = items + [a, b]
    return items
'''

[test.assertions]
contains = [".extend("]
not_contains = ["+="]

[[test]]
name = "attr_list_concat_assign"
description = "self.field = self.field + [elem] on typed attribute generates .extend()"

python = '''
class GameState:
    scorers: list[int]

    def __init__(self) -> None:
        self.scorers = []

    def add_scorer(self, player_idx: int) -> None:
        self.scorers = self.scorers + [player_idx]
'''

[test.assertions]
contains = [".extend("]
not_contains = ["+="]

[[test]]
name = "list_concat_assign_compiles"
description = "list concat augmented assignment produces compilable Rust"

python = '''
def collect_scores(n: int) -> list[int]:
    result: list[int] = []
    i: int = 0
    while i < n:
        result = result + [i]
        i = i + 1
    return result
'''

[test.assertions]
compiles = true
contains = [".extend("]

[[test]]
name = "numeric_augassign_still_works"
description = "Regular numeric += is not affected"

python = '''
def increment(x: int) -> int:
    x = x + 1
    return x
'''

[test.assertions]
contains = ["+="]
not_contains = [".extend("]
