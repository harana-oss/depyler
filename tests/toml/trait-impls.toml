[[test]]
name = "ord_impl_multi_field"
description = "Ordering with multiple fields"

python = '''
class Version:
    def __init__(self, major: int, minor: int, patch: int):
        self.major = major
        self.minor = minor
        self.patch = patch
    
    def __lt__(self, other: 'Version') -> bool:
        if self.major != other.major:
            return self.major < other.major
        if self.minor != other.minor:
            return self.minor < other.minor
        return self.patch < other.patch
'''

rust = '''
#[derive(Clone, PartialEq, Eq)]
pub struct Version {
    pub major: i32,
    pub minor: i32,
    pub patch: i32,
}

impl Version {
    pub fn new(major: i32, minor: i32, patch: i32) -> Self {
        Self { major, minor, patch }
    }
}

impl PartialOrd for Version {
    fn partial_cmp(&self, other: &Self) -> Option<std::cmp::Ordering> {
        return Some(self.cmp(other));
    }
}

impl Ord for Version {
    fn cmp(&self, other: &Self) -> std::cmp::Ordering {
        match self.major.cmp(&other.major) {
            std::cmp::Ordering::Equal => {}
            ord => return ord,
        }
        match self.minor.cmp(&other.minor) {
            std::cmp::Ordering::Equal => {}
            ord => return ord,
        }
        return self.patch.cmp(&other.patch);
    }
}
'''

# =============================================================================
# Hash Implementation
# =============================================================================

[[test]]
name = "hash_impl_correctness"
description = "Hash consistency with Eq"

python = '''
class Key:
    def __init__(self, id: int, name: str):
        self.id = id
        self.name = name
    
    def __eq__(self, other: object) -> bool:
        if isinstance(other, Key):
            return self.id == other.id and self.name == other.name
        return False
    
    def __hash__(self) -> int:
        return hash((self.id, self.name))
'''

rust = '''
use std::hash::{Hash, Hasher};

#[derive(Clone, PartialEq, Eq)]
pub struct Key {
    pub id: i32,
    pub name: String,
}

impl Key {
    pub fn new(id: i32, name: String) -> Self {
        Self { id, name }
    }
}

impl Hash for Key {
    fn hash<H: Hasher>(&self, state: &mut H) {
        self.id.hash(state);
        self.name.hash(state);
    }
}
'''

[[test]]
name = "hash_impl_derived"
description = "Derived Hash implementation"

python = '''
