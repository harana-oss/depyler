# =============================================================================
# Debug Trait
# =============================================================================

[[test]]
name = "debug_impl"
description = "__repr__ to Debug trait"

python = '''
class Config:
    def __init__(self, key: str, value: int):
        self.key = key
        self.value = value
    
    def __repr__(self) -> str:
        return f"Config(key={self.key!r}, value={self.value})"
'''

rust = '''
use std::fmt;

pub struct Config {
    pub key: String,
    pub value: i32,
}

impl Config {
    pub fn new(key: String, value: i32) -> Self {
        Self { key, value }
    }
}

impl fmt::Debug for Config {
    fn fmt(&self, f: &mut fmt::Formatter<'_>) -> fmt::Result {
        f.debug_struct("Config")
            .field("key", &self.key)
            .field("value", &self.value)
            .finish()
    }
}
'''

