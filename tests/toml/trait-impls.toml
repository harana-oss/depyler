[metadata]
name = "Trait Implementation Tests"
category = "type-system"

# =============================================================================
# Eq/PartialEq Implementation
# =============================================================================

[[test]]
name = "eq_impl_correctness"
description = "Correct Eq/PartialEq implementation"

python = '''
class Point:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y
    
    def __eq__(self, other: object) -> bool:
        if isinstance(other, Point):
            return self.x == other.x and self.y == other.y
        return False
'''

rust = '''
#[derive(Clone)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}

impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}

impl PartialEq for Point {
    fn eq(&self, other: &Self) -> bool {
        return self.x == other.x && self.y == other.y;
    }
}

impl Eq for Point {}
'''

