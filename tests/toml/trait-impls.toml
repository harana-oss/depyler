# Clone vs Copy
# =============================================================================

[[test]]
name = "clone_vs_copy"
description = "Correct Clone vs Copy derivation"

python = '''
class Coordinate:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y
'''

rust = '''
#[derive(Clone, Copy)]
pub struct Coordinate {
    pub x: i32,
    pub y: i32,
}

impl Coordinate {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
'''

[[test]]
name = "clone_only_heap"
description = "Clone only for heap-allocated data"

python = '''
class Document:
    def __init__(self, content: str):
        self.content = content
    
    def copy(self) -> 'Document':
        return Document(self.content)
'''

rust = '''
#[derive(Clone)]
pub struct Document {
    pub content: String,
}

impl Document {
    pub fn new(content: String) -> Self {
        Self { content }
    }
    
    pub fn copy(&self) -> Document {
        return Document::new(self.content.clone());
    }
}
'''

