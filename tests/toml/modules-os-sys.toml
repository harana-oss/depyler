def test() -> str:
    value: str = os.getenv("VAR", "")
    return value
'''

[test.assertions]
contains = ["unwrap_or_else"]

[[test]]
name = "os_environ_membership_check"
description = "'key in os.environ' uses std::env::var().is_ok()"
tags = ["os", "env", "membership"]

[test.python]
code = '''
import os

def test() -> bool:
    exists: bool = "PATH" in os.environ
    return exists
'''

[test.assertions]
contains = ["std::env::var", ".is_ok()"]
not_contains = ["contains_key"]

[[test]]
name = "os_environ_not_in"
description = "'key not in os.environ' negation"
tags = ["os", "env", "membership"]

[test.python]
code = '''
import os

def test() -> bool:
    missing: bool = "NONEXISTENT" not in os.environ
    return missing
'''

[test.assertions]
contains = ["std::env::var", ".is_ok()", "!"]

[[test]]
name = "os_environ_variable_key"
description = "Variable key in os.environ check"
tags = ["os", "env", "membership"]

[test.python]
code = '''
