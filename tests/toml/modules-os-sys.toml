# OS and Sys Module Tests - Migrated from test_os_unit.rs, test_os_additional_unit.rs, test_sys_unit.rs

[metadata]
name = "OS and Sys Module Tests"
category = "stdlib-os-sys"

# =============================================================================
# OS Environment
# =============================================================================

[[test]]
name = "os_environ_get"
description = "os.environ.get() for environment variable"
tags = ["os", "env"]

[test.python]
code = '''
import os

def get_env(key: str) -> str:
    return os.environ.get(key, "")
'''

[test.assertions]
contains_any = [["std::env::var", "env::var"]]

[[test]]
name = "os_getenv"
description = "os.getenv() function"
tags = ["os", "env"]

[test.python]
code = '''
import os

def get_home() -> str:
    return os.getenv("HOME", "/tmp")
'''

[test.assertions]
contains_any = [["std::env::var", "env::var", "unwrap_or"]]

