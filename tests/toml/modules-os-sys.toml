[[test]]
name = "sys_argv"
description = "sys.argv command line arguments"
tags = ["sys", "args"]

[test.python]
code = '''
import sys

def get_first_arg() -> str:
    if len(sys.argv) > 1:
        return sys.argv[1]
    return ""
'''

[test.assertions]
contains_any = [["std::env::args()", "env::args"]]

