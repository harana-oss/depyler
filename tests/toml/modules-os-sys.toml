[[test]]
name = "os_path_relpath"
description = "os.path.relpath() for relative paths"

python = '''
import os.path

def relative_path(path: str, start: str) -> str:
    return os.path.relpath(path, start)
'''

rust = '''
use std::path;
pub fn relative_path(path: String, start: String) -> String {
    return {
        let path_obj = std::path::Path::new(path);
        let start_obj = std::path::Path::new(start);
        path_obj
            .strip_prefix(start_obj)
            .map(|p| p.to_string_lossy().to_string())
            .unwrap_or_else(|_| path.to_string())
    }
'''

