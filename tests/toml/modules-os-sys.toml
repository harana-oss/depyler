# =============================================================================
# Subprocess Module Tests (from expr_gen.rs:4662)
# =============================================================================

[[test]]
name = "subprocess_run_basic"
description = "subprocess.run() basic execution"

python = '''
import subprocess

def run_command(cmd: list[str]) -> int:
    result = subprocess.run(cmd)
    return result.returncode
'''

rust = '''
#[doc = "// NOTE: Map Python module 'subprocess'()"]
pub fn run_command(cmd: &Vec<String>) -> i32 {
    let result = std::process::Command::new(&cmd[0])
        .args(&cmd[1..])
        .status()
        .expect("Failed to execute command");
    return result.code().unwrap_or(-1);
}
'''

[[test]]
name = "subprocess_run_capture_output"
description = "subprocess.run() with capture_output=True"

python = '''
import subprocess

def run_with_output(cmd: list[str]) -> str:
    result = subprocess.run(cmd, capture_output=True, text=True)
    return result.stdout
'''

rust = '''
#[doc = "// NOTE: Map Python module 'subprocess'()"]
pub fn run_with_output(cmd: &Vec<String>) -> String {
    let result = std::process::Command::new(&cmd[0])
        .args(&cmd[1..])
        .output()
        .expect("Failed to execute command");
    return String::from_utf8_lossy(&result.stdout).to_string();
}
'''

[[test]]
name = "subprocess_run_with_cwd"
description = "subprocess.run() with cwd parameter"

python = '''
