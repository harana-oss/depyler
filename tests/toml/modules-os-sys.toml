[[test]]
name = "os_remove"
description = "os.remove() file deletion"
tags = ["os", "file"]

python = '''
import os

def delete_file(path: str) -> None:
    os.remove(path)
'''

rust = '''
use std as os;
pub fn delete_file(path: String) {
    if let Some(pos) = os.iter().position(|x| x == &path) {
        os.remove(pos)
    } else {
        panic!("ValueError: list.remove(x): x not in list")
    };
}
'''

[[test]]
name = "sys_argv"
description = "sys.argv command line arguments"
tags = ["sys", "args"]

python = '''
import sys

def get_first_arg() -> str:
    if len(sys.argv) > 1:
        return sys.argv[1]
    return ""
'''

rust = '''
use std as sys;
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = " Depyler: proven to terminate"]
pub fn get_first_arg() -> String {
    let _cse_temp_0 = std::env::args().collect::<Vec<String>>().len() as i32;
    let _cse_temp_1 = _cse_temp_0 > 1;
    if _cse_temp_1 {
        return std::env::args().collect::<Vec<String>>().get(1usize).cloned().unwrap();
    }
    return "".to_string();
}
'''

