# =============================================================================
# OS Environment
# =============================================================================

[[test]]
name = "os_environ_get"
description = "os.environ.get() for environment variable"

python = '''
import os

def get_env(key: str) -> str:
    return os.environ.get(key, "")
'''

rust = '''
use std as os;
pub fn get_env(key: String) -> String {
    return std::env::var(key).unwrap_or_else(|_| "".to_string()).unwrap();
}
'''

