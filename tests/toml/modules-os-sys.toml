[[test]]
name = "os_getenv_with_default"
description = "os.getenv() with default value uses unwrap_or_else"
tags = ["os", "env", "default"]

[test.python]
code = '''
import os

def test() -> str:
    home: str = os.getenv("HOME", "/home/user")
    return home
'''

[test.assertions]
contains = ["std::env::var", "unwrap_or_else"]

[[test]]
name = "os_getenv_empty_default"
description = "os.getenv() with empty default"
tags = ["os", "env", "default"]

[test.python]
code = '''
