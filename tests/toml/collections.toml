# =============================================================================
# TYPED COLLECTIONS
# =============================================================================

[[test]]
name = "collection_type_annotations"
description = "Test typed collections with List, Dict, Tuple, Optional"
tags = ["typed", "annotations", "collections"]

[test.python]
code = '''
from typing import List, Dict, Tuple, Optional

def typed_collections(
    numbers: List[int],
    scores: Dict[str, float],
    point: Tuple[int, int],
    maybe_name: Optional[str]
) -> List[str]:
    result = []
    
    for num in numbers:
        result.append(str(num))
    
    return result
'''

[test.assertions]
contains_any = [["Vec<i32>", "Vec<i64>", "Vec < i32 >", "Vec < i64 >"]]

# =============================================================================
# COLLECTION METHODS
# =============================================================================

[[test]]
name = "collection_methods"
description = "Test list and dict methods"
tags = ["methods", "collections"]

[test.python]
code = '''
def collection_methods():
    numbers = [1, 2, 3]
    numbers.append(4)
    numbers.pop()
    numbers.insert(0, 0)
    numbers.remove(2)
    
    data = {"a": 1, "b": 2}
    data.update({"c": 3})
    value = data.get("a", 0)
    data.pop("b")
    
    unique = set([1, 2, 2, 3])
    
    return len(numbers)
'''

[test.assertions]
contains_any = [["push", "pop", "insert", "remove"]]

# =============================================================================
# COLLECTION ITERATION
# =============================================================================

[[test]]
name = "collection_iteration"
description = "Test iterating over lists and dicts"
tags = ["iteration", "collections"]

[test.python]
code = '''
def iterate_collections():
    numbers = [1, 2, 3, 4, 5]
    
    total = 0
    for num in numbers:
        total += num
    
    scores = {"alice": 95, "bob": 87}
    for name in scores:
        print(name)
    
    for name, score in scores.items():
        print(name, score)
    
    return total
'''

[test.assertions]
contains = ["for"]

