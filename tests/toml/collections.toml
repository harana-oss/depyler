[[test]]
name = "combined_vector_operations"
description = "Combine lists using both concatenation and extend"
compile_check = true

python = '''
def combine_and_extend(list1: list[int], list2: list[int], list3: list[int]) -> list[int]:
    """Combine lists using both concatenation and extend."""
    combined = list1 + list2
    result = combined.copy()
    result.extend(list3)
    return result
'''

rust = '''
#[doc = "Combine lists using both concatenation and extend."]
pub fn combine_and_extend(list1: &Vec<i32>, list2: &Vec<i32>, list3: &Vec<i32>) -> Vec<i32> {
    let combined = list1
        .iter()
        .chain(list2.iter())
        .cloned()
        .collect::<Vec<_>>();
    let mut result = combined.clone();
    result.extend(list3.iter().cloned());
    return result;
}
'''

