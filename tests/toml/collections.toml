[[test]]
name = "collection_methods"
description = "Test list and dict methods"

python = '''
def collection_methods():
    numbers = [1, 2, 3]
    numbers.append(4)
    numbers.pop()
    numbers.insert(0, 0)
    numbers.remove(2)
    
    data = {"a": 1, "b": 2}
    data.update({"c": 3})
    value = data.get("a", 0)
    data.pop("b")
    
    unique = set([1, 2, 2, 3])
    
    return len(numbers)
'''

rust = '''
use std::collections::HashMap;
use std::collections::HashSet;
pub fn collection_methods() -> i32 {
    let mut numbers = vec![1, 2, 3];
    numbers.push(4);
    numbers.pop().unwrap();
    numbers.insert(0 as usize, 0);
    if let Some(pos) = numbers.iter().position(|x| x == &2) {
        numbers.remove(pos)
    } else {
        panic!("ValueError: list.remove(x): x not in list")
    };
    let mut data = {
        let mut map = HashMap::new();
        map.insert("a".to_string(), 1);
        map.insert("b".to_string(), 2);
        map
    };
    for (k, v) in {
        let mut map = HashMap::new();
        map.insert("c".to_string(), 3);
        map
    } {
        data.insert(k, v);
    }
    let value = data.get("a").cloned().unwrap_or(0);
    data.remove("b").expect("KeyError: key not found");
    let unique = vec![1, 2, 2, 3].into_iter().collect::<HashSet<_>>();
    return numbers.len() as i32;
}
'''

[[test]]
name = "collection_iteration"
description = "Test iterating over lists and dicts"

python = '''
def iterate_collections():
    numbers = [1, 2, 3, 4, 5]
    
    total = 0
    for num in numbers:
        total += num
    
    scores = {"alice": 95, "bob": 87}
    for name in scores:
        print(name)
    
    for name, score in scores.items():
        print(name, score)
    
    return total
'''

rust = '''
use std::collections::HashMap;
pub fn iterate_collections() -> i32 {
    let numbers = vec![1, 2, 3, 4, 5];
    let mut total = 0;
    for num in numbers.iter().cloned() {
        total = total + num;
    }
    let scores = {
        let mut map = HashMap::new();
        map.insert("alice".to_string(), 95);
        map.insert("bob".to_string(), 87);
        map
    };
    for name in scores.iter().cloned() {
        log::info!("{}", name.clone());
    }
    for (name, score) in scores
        .iter()
        .map(|(k, v)| (k.clone(), v.clone()))
        .collect::<Vec<_>>()
    {
        log::info!("{} {}", name, score);
    }
    return total;
}
'''

