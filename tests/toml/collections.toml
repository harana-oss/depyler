# Collections Tests
# Merged from builtins-collections, collection-operations, and python-collections
# Tests for Python collection types, operations, and related builtins

[metadata]
name = "collections"
description = "Tests for Python collection types, operations, builtins, and functional programming"

# =============================================================================
# LIST BASIC OPERATIONS
# =============================================================================

[[test]]
name = "list_operations"
description = "Test list creation, access, methods, and comprehension"
tags = ["list", "operations"]

[test.python]
code = '''
def work_with_lists():
    numbers = [1, 2, 3, 4, 5]
    
    first = numbers[0]
    last = numbers[-1]
    
    numbers.append(6)
    numbers.extend([7, 8])
    
    squares = [x * x for x in numbers]
    
    return len(numbers)
'''

[test.assertions]
contains = ["vec!"]

[[test]]
name = "list_extend"
description = "list.extend() extend with iterable"
tags = ["list", "method"]

[test.python]
code = '''
def extend_list(lst: list, items: list) -> None:
    lst.extend(items)
'''

[test.assertions]
contains_any = [["extend", "append"]]

