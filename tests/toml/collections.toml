[[test]]
name = "next_generator_dataclass_no_default_no_unwrap"
description = "next() on generator returning dataclass - result should not have as_ref().unwrap()"

python = '''
from dataclasses import dataclass

@dataclass
class Player:
    name: str
    score: int

def find_high_scorer(players: list[Player]) -> int:
    candidate = next(p for p in players if p.score > 100)
    return candidate.score
'''

rust = '''
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Player {
    pub name: String,
    pub score: i32,
}
impl Player {
    pub fn new(name: String, score: i32) -> Self {
        Self { name, score }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "name" => Some(Box::new(self.name.clone()) as Box<dyn std::any::Any>),
            "score" => Some(Box::new(self.score.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "name" => {
                if let Some(v) = value.downcast_ref::<String>() {
                    self.name = v.clone();
                    true
                } else {
                    false
                }
            }
            "score" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.score = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn find_high_scorer(players: &Vec<Player>) -> i32 {
    let candidate = players
        .iter()
        .cloned()
        .filter(|p| p.score > 100)
        .next()
        .expect("StopIteration: iterator is empty");
    return candidate.score;
}
'''

