# =============================================================================
# FUNCTIONAL PROGRAMMING
# =============================================================================

[[test]]
name = "functools_reduce"
description = "functools.reduce() accumulate values"
tags = ["functools", "functional"]

[test.python]
code = '''
from functools import reduce

def sum_reduce(items: list) -> int:
    return reduce(lambda x, y: x + y, items)
'''

[test.assertions]
contains_any = [["fold", "reduce"]]

[[test]]
name = "itertools_chain"
description = "itertools.chain() chain multiple iterators"
tags = ["itertools", "functional"]

[test.python]
code = '''
from itertools import chain

def chain_lists(a: list, b: list) -> list:
    return list(chain(a, b))
'''

[test.assertions]
contains_any = [["chain", "extend"]]

[[test]]
name = "itertools_cycle"
description = "itertools.cycle() infinite cycle"
tags = ["itertools", "functional"]

[test.python]
code = '''
from itertools import cycle

def cycle_items(items: list, n: int) -> list:
    cycler = cycle(items)
    return [next(cycler) for _ in range(n)]
'''

[test.assertions]
contains_any = [["cycle", "iter"]]

# =============================================================================
# OPERATOR MODULE
# =============================================================================

[[test]]
name = "operator_attrgetter"
description = "operator.attrgetter() attribute access"
tags = ["operator", "functional"]

[test.python]
code = '''
import operator

def get_name_attr(obj) -> str:
    getter = operator.attrgetter('name')
    return getter(obj)
'''

[test.assertions]
contains_any = [["name", "get"]]

[[test]]
name = "operator_itemgetter"
description = "operator.itemgetter() item access"
tags = ["operator", "functional"]

[test.python]
code = '''
import operator

def get_first_item(obj) -> object:
    getter = operator.itemgetter(0)
    return getter(obj)
'''

[test.assertions]
contains_any = [["get", "[0]"]]

[[test]]
name = "operator_methodcaller"
description = "operator.methodcaller() method invocation"
tags = ["operator", "functional"]

[test.python]
code = '''
import operator

def call_upper(obj) -> str:
    caller = operator.methodcaller('upper')
    return caller(obj)
'''

[test.assertions]
contains_any = [["upper", "to_uppercase"]]

