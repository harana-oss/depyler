# =============================================================================
# VECTOR CONCATENATION & EXTEND
# =============================================================================

[[test]]
name = "vector_concatenation"
description = "Concatenate two lists using + operator"
tags = ["list", "concatenation", "vector"]
compile_check = true

[test.python]
code = '''
def concat_lists(list1: list[int], list2: list[int]) -> list[int]:
    """Concatenate two lists."""
    return list1 + list2
'''

[test.assertions]
contains_any = [["chain", "extend", "iter"]]

[[test]]
name = "list_extend_and_copy"
description = "Extend list1 with list2 using extend method"
tags = ["list", "extend", "vector"]
compile_check = true

[test.python]
code = '''
def extend_list_copy(list1: list[int], list2: list[int]) -> list[int]:
    """Extend list1 with list2."""
    result = list1.copy()
    result.extend(list2)
    return result
'''

[test.assertions]
contains_any = [["extend", "clone"]]

[[test]]
name = "combined_vector_operations"
description = "Combine lists using both concatenation and extend"
tags = ["list", "concatenation", "extend", "vector"]
compile_check = true

[test.python]
code = '''
def combine_and_extend(list1: list[int], list2: list[int], list3: list[int]) -> list[int]:
    """Combine lists using both concatenation and extend."""
    combined = list1 + list2
    result = combined.copy()
    result.extend(list3)
    return result
'''

[test.assertions]
contains_any = [["extend", "chain", "clone"]]

