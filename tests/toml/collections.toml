[[test]]
name = "list_operations"
description = "Test list creation, access, methods, and comprehension"

python = '''
def work_with_lists():
    numbers = [1, 2, 3, 4, 5]
    
    first = numbers[0]
    last = numbers[-1]
    
    numbers.append(6)
    numbers.extend([7, 8])
    
    squares = [x * x for x in numbers]
    
    return len(numbers)
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
#[doc = " Depyler: proven to terminate"]
pub fn work_with_lists() -> i32 {
    let mut numbers = vec![1, 2, 3, 4, 5];
    let first = numbers.clone().get(0usize).cloned().unwrap();
    let last = numbers.clone().last().cloned().unwrap();
    numbers.clone().push(6);
    numbers.extend(vec![7, 8].iter().cloned());
    let squares = numbers
        .clone()
        .into_iter()
        .map(|x| x * x)
        .collect::<Vec<_>>();
    return numbers.len() as i32;
}
'''

