[metadata]
name = "Namedtuple Tests"
category = "data-structures"

# =============================================================================
# Creating Namedtuples
# =============================================================================

[[test]]
name = "namedtuple_create"
description = "Point = namedtuple('Point', ['x', 'y'])"

python = '''
from collections import namedtuple

Point = namedtuple('Point', ['x', 'y'])
result = Point(1, 2)
'''

rust = '''
struct Point {
    x: i32,
    y: i32,
}
'''


