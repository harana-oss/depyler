[metadata]
name = "Complex Number Tests"
category = "core-language"

# =============================================================================
# Complex Literals
# =============================================================================

[[test]]
name = "imaginary_literal"
description = "Imaginary literal with j suffix"
python = """
x = 3j
print(x.real)
print(x.imag)
"""
rust = """
use num::Complex;

fn main() {
    let x = Complex::new(0.0, 3.0);
    log::info!("{}", x.re);
    log::info!("{}", x.im);
}
"""
expected_output = """0.0
3.0"""

[[test]]
name = "complex_literal"
description = "Complex literal notation"
python = """
x = 3 + 4j
print(x.real)
print(x.imag)
"""
rust = """
use num::Complex;

fn main() {
    let x = Complex::new(3.0, 4.0);
    log::info!("{}", x.re);
    log::info!("{}", x.im);
}
"""
expected_output = """3.0
4.0"""

