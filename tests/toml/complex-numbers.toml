[[test]]
name = "complex_in_list"
description = "Complex numbers in list"
python = """
numbers = [1+2j, 3+4j, 5+6j]
print(len(numbers))
print(f"{numbers[0].real}+{numbers[0].imag}j")
"""
rust = """
use num::Complex;

fn main() {
    let numbers = vec![
        Complex::new(1.0, 2.0),
        Complex::new(3.0, 4.0),
        Complex::new(5.0, 6.0),
    ];
    log::info!("{}", numbers.len());
    log::info!("{}+{}j", numbers[0].re, numbers[0].im);
}
"""
expected_output = """3
1.0+2.0j"""
