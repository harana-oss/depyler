# Complex Arithmetic
# =============================================================================

[[test]]
name = "complex_add"
description = "Complex addition"
python = """
result = (1+2j) + (3+4j)
print(f"{result.real}+{result.imag}j")
"""
rust = """
use num::Complex;

fn main() {
    let a = Complex::new(1.0, 2.0);
    let b = Complex::new(3.0, 4.0);
    let result = a + b;
    log::info!("{}+{}j", result.re, result.im);
}
"""
expected_output = "4.0+6.0j"

[[test]]
