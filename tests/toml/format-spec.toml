[metadata]
name = "Format Spec Tests"
category = "strings"

# =============================================================================
# Basic Format Spec
# =============================================================================

[[test]]
name = "format_simple"
skip = true
description = "format(42, 'd')"

python = '''
def format_decimal() -> str:
    return format(42, 'd')
'''

rust = '''
pub fn format_decimal() -> String {
    return format!("{}", 42);
}
'''


[[test]]
name = "format_str"
description = "'{:d}'.format(42)"

python = '''
def format_str_method() -> str:
    return '{:d}'.format(42)
'''

rust = '''
pub fn format_str_method() -> String {
    return format!("{:}", 42);
}
'''


[[test]]
name = "format_fstring"
skip = true
description = "f'{x:d}'"

python = '''
x = 42
result = f'Value: {x}'
'''

rust = '''
    let x = 42;
    let result = format!("Value: {}", x);
'''


