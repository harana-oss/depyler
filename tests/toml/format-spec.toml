# =============================================================================
# Grouping Options
# =============================================================================

[[test]]
name = "format_comma"
skip = true
description = "'{:,}'.format(1000000)"

python = '''
def format_comma_separator() -> str:
    return '{:,}'.format(1000000)
'''

rust = '''
pub fn format_comma_separator() -> String {
    let n = 1000000;
    let s = n.to_string();
    let mut result = String::new();
    for (i, c) in s.chars().rev().enumerate() {
        if i > 0 && i % 3 == 0 {
            result.push(',');
        }
        result.push(c);
    }
    return result.chars().rev().collect();
}
'''


[[test]]
name = "format_underscore"
