rust = '''
pub fn format_underscore_separator() -> String {
    let n = 1000000;
    let s = n.to_string();
    let mut result = String::new();
    for (i, c) in s.chars().rev().enumerate() {
        if i > 0 && i % 3 == 0 {
            result.push('_');
        }
        result.push(c);
    }
    return result.chars().rev().collect();
}
'''


# =============================================================================
# Type Codes
# =============================================================================

[[test]]
name = "format_int_types"
skip = true
description = "d, b, o, x, X, n"

python = '''
def format_int_types() -> tuple:
    n = 42
    return (format(n, 'd'), format(n, 'b'), format(n, 'o'), format(n, 'x'), format(n, 'X'))
'''

rust = '''
pub fn format_int_types() -> (String, String, String, String, String) {
    let n = 42;
    return (
        format!("{}", n),
        format!("{:b}", n),
        format!("{:o}", n),
        format!("{:x}", n),
        format!("{:X}", n),
    );
}
'''


