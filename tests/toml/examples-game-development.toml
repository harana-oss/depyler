                base.get(actual_idx).cloned().unwrap_or_default()
            } - populations.get(i as usize).cloned().unwrap_or_default())
                as f64
                / (populations.get(i as usize).cloned().unwrap_or_default()) as f64;
            total_growth = total_growth + growth_rate;
