    let avg_growth: f64 = if num_intervals > 0 {
        total_growth / (num_intervals) as f64
    } else {
        0.0
    };
    let mut peak: i32 = populations.get(0usize).cloned().unwrap_or_default();
    for pop in populations.iter().cloned() {
