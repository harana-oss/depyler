        map.insert("peak_population".to_string(), (peak) as f64);
        map.insert(
            "final_population".to_string(),
            ({
                let base = &populations;
                base.get(base.len().saturating_sub(1usize))
                    .cloned()
                    .unwrap_or_default()
            }) as f64,
        );
        map
    };
    Ok(analysis)
}
