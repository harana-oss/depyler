# =============================================================================
# Mutable Sets Should NOT Become Bitflags
# =============================================================================

[[test]]
name = "mutable_set_add"
description = "Set with .add() should NOT become bitflags"

python = '''
COLORS = {"red", "green", "blue"}
COLORS.add("yellow")
'''

rust = '''
lazy_static! {
    pub static ref COLORS: HashSet<String> = {
        let mut set = HashSet::new();
        set.insert("red".to_string());
        set.insert("green".to_string());
        set.insert("blue".to_string());
        set
    };
}
'''

[[test]]
name = "mutable_set_remove"
description = "Set with .remove() should NOT become bitflags"

python = '''
ITEMS = {"a", "b", "c"}
ITEMS.remove("a")
'''

rust = '''
lazy_static! {
    pub static ref ITEMS: HashSet<String> = {
        let mut set = HashSet::new();
        set.insert("a".to_string());
        set.insert("b".to_string());
        set.insert("c".to_string());
        set
    };
}
'''

[[test]]
name = "mutable_list_append"
description = "List with .append() should NOT become bitflags"

python = '''
NAMES = ["alice", "bob"]
NAMES.append("charlie")
'''

rust = '''
lazy_static! {
    pub static ref NAMES: Vec<String> = vec![
        "alice".to_string(),
        "bob".to_string(),
    ];
}
'''

[[test]]
name = "mutable_set_augmented_assignment"
description = "Set with |= should NOT become bitflags"

python = '''
FLAGS = {"a", "b"}
FLAGS |= {"c"}
'''

rust = '''
lazy_static! {
    pub static ref FLAGS: HashSet<String> = {
        let mut set = HashSet::new();
        set.insert("a".to_string());
        set.insert("b".to_string());
        set
    };
}
'''

