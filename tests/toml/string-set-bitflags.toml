# String Set to Bitflags Optimization Tests
# Tests for detecting immutable string sets/lists and converting them to bitflags

[metadata]
name = "String Set to Bitflags Tests"
category = "optimization"

# =============================================================================
# Basic String Set Detection
# =============================================================================

[[test]]
name = "immutable_string_set_constant"
description = "Immutable string set should become bitflags"

python = '''
PERMISSIONS = {"read", "write", "execute"}

def has_permission(perm: str) -> bool:
    return perm in PERMISSIONS
'''

rust = '''
bitflags::bitflags! {
    #[derive(Debug, Clone, Copy, PartialEq, Eq, Hash)]
    pub struct Permissions: u8 {
        const READ = 1;
        const WRITE = 2;
        const EXECUTE = 4;
    }
}

impl Permissions {
    pub fn from_str(s: &str) -> Option<Self> {
        match s {
            "read" => Some(Self::READ),
            "write" => Some(Self::WRITE),
            "execute" => Some(Self::EXECUTE),
            _ => None,
        }
    }

    pub fn as_str(&self) -> &'static str {
        match *self {
            Self::READ => "read",
            Self::WRITE => "write",
            Self::EXECUTE => "execute",
            _ => "",
        }
    }
}

pub fn has_permission(perm: &str) -> bool {
    Permissions::from_str(perm).is_some()
}
'''

