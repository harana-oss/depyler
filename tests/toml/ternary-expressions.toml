# =============================================================================
# Ternary as Arguments
# =============================================================================

[[test]]
name = "ternary_as_argument"
description = "func(x if cond else y)"
python = """
def func(val):
    return val * 2
result = func(10 if True else 5)
print(result)
"""
rust = """
fn func(val: i32) -> i32 {
    val * 2
}
fn main() {
    let result = func(if true { 10 } else { 5 });
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_multiple_args"
description = "func(a if x else b, c if y else d)"
python = """
def func(a, b):
    return a + b
x = True
y = False
result = func(10 if x else 20, 30 if y else 40)
print(result)
"""
rust = """
fn func(a: i32, b: i32) -> i32 {
    a + b
}
fn main() {
    let x = true;
    let y = false;
    let result = func(if x { 10 } else { 20 }, if y { 30 } else { 40 });
    log::info!("{}", result);
}
"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "ternary_with_none"
description = "value if value is not None else default"
python = """
value = None
result = value if value is not None else 'default'
print(result)
value = 'actual'
result = value if value is not None else 'default'
print(result)
"""
rust = """
fn main() {
    let value: Option<&str> = None;
    let result = value.unwrap_or("default");
    log::info!("{}", result);
    let value: Option<&str> = Some("actual");
    let result = value.unwrap_or("default");
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_boolean_result"
description = "True if condition else False"
python = """
x = 10
result = True if x > 5 else False
print(result)
"""
rust = """
fn main() {
    let x = 10;
    let result = if x > 5 { true } else { false };
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_same_type"
description = "Both branches return same type"
python = """
cond = True
result = 'yes' if cond else 'no'
print(type(result).__name__, result)
"""
rust = """
fn main() {
    let cond = true;
    let result = if cond { "yes" } else { "no" };
    log::info!("str {}", result);
}
"""

[[test]]
name = "ternary_numeric_promotion"
description = "1 if cond else 1.0"
python = """
cond = False
result = 1 if cond else 1.0
print(result, type(result).__name__)
"""
rust = """
fn main() {
    let cond = false;
    let result: f64 = if cond { 1.0 } else { 1.0 };
    log::info!("{} float", result);
}
"""

[[test]]
name = "ternary_short_circuit"
description = "Only true or false branch is evaluated"
python = """
def side_effect_true():
    print("true branch")
    return 1

def side_effect_false():
    print("false branch")
    return 2

result = side_effect_true() if True else side_effect_false()
print(result)
"""
rust = """
fn side_effect_true() -> i32 {
    log::info!("true branch");
    1
}

fn side_effect_false() -> i32 {
    log::info!("false branch");
    2
}

fn main() {
    let result = if true { side_effect_true() } else { side_effect_false() };
    log::info!("{}", result);
}
"""

# =============================================================================
# Primitive Casts with Ternary (DEPYLER-0350)
# =============================================================================

[[test]]
name = "ternary_float_cast_no_reference"
description = "float(x if cond else y) should not add references"
python = """
class State:
    def __init__(self):
        self.x = 10
        self.y = 20

state = State()
cond = True
result = float(state.x if cond else state.y)
print(result)
"""
rust = """
struct State {
    x: i32,
    y: i32,
}

impl State {
    fn new() -> Self {
        Self { x: 10, y: 20 }
    }
}

fn main() {
    let state = State::new();
    let cond = true;
    let result = (if cond { state.x } else { state.y }) as f64;
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_int_cast_no_reference"
description = "int(a if cond else b) should not add references"
python = """
class Data:
    def __init__(self):
        self.a = 3.14
        self.b = 2.71

data = Data()
cond = False
result = int(data.a if cond else data.b)
print(result)
"""
rust = """
struct Data {
    a: f64,
    b: f64,
}

impl Data {
    fn new() -> Self {
        Self { a: 3.14, b: 2.71 }
    }
}

fn main() {
    let data = Data::new();
    let cond = false;
    let result = (if cond { data.a } else { data.b }) as i32;
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_float_cast_with_expression"
description = "float(expr if cond else expr) with arithmetic expressions"
python = """
class State:
    def __init__(self):
        self.ball_location_y = 100

state = State()
is_home = True
result = float(state.ball_location_y if is_home else (700 - state.ball_location_y))
print(result)
"""
rust = """
struct State {
    ball_location_y: i32,
}

impl State {
    fn new() -> Self {
        Self { ball_location_y: 100 }
    }
}

fn main() {
    let state = State::new();
    let is_home = true;
    let result = (if is_home { state.ball_location_y } else { 700 - state.ball_location_y }) as f64;
    log::info!("{}", result);
}
"""
