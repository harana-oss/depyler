[metadata]
name = "Ternary Expression Tests"
category = "core-language"

# =============================================================================
# Basic Ternary
# =============================================================================

[[test]]
name = "ternary_basic"
description = "x if condition else y"
python = """
x = 10
y = 20
result = x if True else y
print(result)
result2 = x if False else y
print(result2)
"""
rust = """
fn main() {
    let x = 10;
    let y = 20;
    let result = if true { x } else { y };
    log::info!("{}", result);
    let result2 = if false { x } else { y };
    log::info!("{}", result2);
}
"""

[[test]]
name = "ternary_integers"
description = "max_val = a if a > b else b"
python = """
a = 5
b = 3
max_val = a if a > b else b
print(max_val)
"""
rust = """
fn main() {
    let a = 5;
    let b = 3;
    let max_val = if a > b { a } else { b };
    log::info!("{}", max_val);
}
"""

[[test]]
name = "ternary_strings"
description = "result = 'yes' if flag else 'no'"
python = """
flag = True
result = 'yes' if flag else 'no'
print(result)
"""
rust = """
fn main() {
    let flag = true;
    let result = if flag { "yes" } else { "no" };
    log::info!("{}", result);
}
"""

# =============================================================================
# Nested Ternary
# =============================================================================

[[test]]
name = "ternary_nested"
description = "a if x else b if y else c"
python = """
x = False
y = True
result = 'a' if x else 'b' if y else 'c'
print(result)
"""
rust = """
fn main() {
    let x = false;
    let y = true;
    let result = if x { "a" } else if y { "b" } else { "c" };
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_deeply_nested"
description = "Multiple levels of nesting"
python = """
score = 75
grade = 'A' if score >= 90 else 'B' if score >= 80 else 'C' if score >= 70 else 'F'
print(grade)
"""
rust = """
fn main() {
    let score = 75;
    let grade = if score >= 90 { "A" } else if score >= 80 { "B" } else if score >= 70 { "C" } else { "F" };
    log::info!("{}", grade);
}
"""

# =============================================================================
# Ternary with Expressions
# =============================================================================

[[test]]
name = "ternary_function_calls"
description = "f() if cond else g()"
python = """
def f(): return 'f'
def g(): return 'g'
result = f() if True else g()
print(result)
"""
rust = """
fn f() -> &'static str { "f" }
fn g() -> &'static str { "g" }
fn main() {
    let result = if true { f() } else { g() };
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_method_calls"
description = "obj.method1() if cond else obj.method2()"
python = """
class Obj:
    def method1(self): return 'm1'
    def method2(self): return 'm2'
obj = Obj()
result = obj.method1() if False else obj.method2()
print(result)
"""
rust = """
struct Obj;
impl Obj {
    fn method1(&self) -> &str { "m1" }
    fn method2(&self) -> &str { "m2" }
}
fn main() {
    let obj = Obj;
    let result = if false { obj.method1() } else { obj.method2() };
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_with_comprehension"
description = "[x if x > 0 else 0 for x in items]"
python = """
items = [-2, 1, -1, 3]
result = [x if x > 0 else 0 for x in items]
print(result)
"""
rust = """
fn main() {
    let items = vec![-2, 1, -1, 3];
    let result: Vec<i32> = items.into_iter().map(|x| if x > 0 { x } else { 0 }).collect();
    log::info!("{:?}", result);
}
"""

# =============================================================================
# Ternary in Assignments
# =============================================================================

[[test]]
name = "ternary_assignment"
description = "result = value if valid else default"
python = """
value = 42
valid = True
result = value if valid else 0
print(result)
"""
rust = """
fn main() {
    let value = 42;
    let valid = true;
    let result = if valid { value } else { 0 };
    log::info!("{}", result);
}
"""

[[test]]
name = "ternary_augmented_assignment"
description = "x += 1 if cond else 0"
python = """
x = 10
cond = True
x += 1 if cond else 0
print(x)
"""
rust = """
fn main() {
    let mut x = 10;
