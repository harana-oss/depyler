# =============================================================================
# Basic Multiple Inheritance
# =============================================================================

[[test]]
name = "multiple_inheritance_basic"
description = "class C(A, B): ..."

python = '''
class Mixin1:
    def method1(self):
        return 1

class Mixin2:
    def method2(self):
        return 2

class Combined(Mixin1, Mixin2):
    pass

result = Combined()
'''

rust = '''
// Rust uses traits for composition
trait Mixin1 {
    fn method1(&self) -> i32 { 1 }
}
trait Mixin2 {
    fn method2(&self) -> i32 { 2 }
}
'''


[[test]]
name = "mi_method_first"
description = "Method resolution picks first parent"

python = '''
class Parent1:
    def shared_method(self):
        return "from_parent1"

class Parent2:
    def shared_method(self):
        return "from_parent2"

class Child(Parent1, Parent2):
    pass

result = Child().shared_method() == "from_parent1"
'''

rust = '''
// Method resolution picks first parent
trait Parent1 {
    fn shared_method(&self) -> &str { "from_parent1" }
}

trait Parent2 {
    fn shared_method(&self) -> &str { "from_parent2" }
}

struct Child;

impl Parent1 for Child {}
impl Parent2 for Child {}

pub fn test_method_first() -> bool {
    let child = Child;
    Parent1::shared_method(&child) == "from_parent1"
}

let result = test_method_first();
'''


