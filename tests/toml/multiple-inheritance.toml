[[test]]
name = "mixin_basic"
description = "class MyClass(Mixin1, Mixin2, Base): ..."

python = '''
class Mixin1:
    def feature1(self):
        return "feature1"

class Mixin2:
    def feature2(self):
        return "feature2"

class Base:
    def base_method(self):
        return "base"

class MyClass(Mixin1, Mixin2, Base):
    pass

obj = MyClass()
result = obj.feature1() == "feature1" and obj.feature2() == "feature2" and obj.base_method() == "base"
'''

rust = '''
// class MyClass(Mixin1, Mixin2, Base): ...
trait Mixin1 {
    fn feature1(&self) -> &str { "feature1" }
}

trait Mixin2 {
    fn feature2(&self) -> &str { "feature2" }
}

trait Base {
    fn base_method(&self) -> &str { "base" }
}

struct MyClass;

impl Mixin1 for MyClass {}
impl Mixin2 for MyClass {}
impl Base for MyClass {}

pub fn test_mixin_basic() -> bool {
    let obj = MyClass;
    obj.feature1() == "feature1" && obj.feature2() == "feature2" && obj.base_method() == "base"
}

let result = test_mixin_basic();
'''


[[test]]
name = "mixin_methods"
description = "Mixin adds functionality to class"

python = '''
class LogMixin:
    def log(self, message):
        return f"LOG: {message}"

class Calculator:
    def add(self, a, b):
        return a + b

class LoggingCalculator(LogMixin, Calculator):
    def add(self, a, b):
        result = super().add(a, b)
        self.log(f"Added {a} + {b} = {result}")
        return result

calc = LoggingCalculator()
result = calc.add(2, 3) == 5 and calc.log("test") == "LOG: test"
'''

rust = '''
// Mixin adds functionality to class
trait LogMixin {
    fn log(&self, message: &str) -> String {
        format!("LOG: {}", message)
    }
}

struct LoggingCalculator;

impl LogMixin for LoggingCalculator {}

impl LoggingCalculator {
    fn add(&self, a: i32, b: i32) -> i32 {
        let result = a + b;
        self.log(&format!("Added {} + {} = {}", a, b, result));
        result
    }
}

pub fn test_mixin_methods() -> bool {
    let calc = LoggingCalculator;
    calc.add(2, 3) == 5 && calc.log("test") == "LOG: test"
}

let result = test_mixin_methods();
'''


[[test]]
name = "mixin_order"
description = "Mixin before base class in inheritance"

python = '''
class Base:
    def method(self):
        return "base"

class Mixin:
    def method(self):
        return "mixin"

class WithMixinFirst(Mixin, Base):
    pass

class WithBaseFirst(Base, Mixin):
    pass

result = WithMixinFirst().method() == "mixin" and WithBaseFirst().method() == "base"
'''

rust = '''
// Mixin before base class in inheritance
trait Base {
    fn method(&self) -> &str { "base" }
}

trait Mixin {
    fn method_mixin(&self) -> &str { "mixin" }
}

struct WithMixinFirst;
impl Mixin for WithMixinFirst {}
impl Base for WithMixinFirst {
    fn method(&self) -> &str { "mixin" }
}

struct WithBaseFirst;
impl Base for WithBaseFirst {}
impl Mixin for WithBaseFirst {}

pub fn test_mixin_order() -> bool {
    let first = WithMixinFirst;
    let second = WithBaseFirst;
    first.method() == "mixin" && second.method() == "base"
}

let result = test_mixin_order();
'''


