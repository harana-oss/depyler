# =============================================================================
# Method Resolution Order (MRO)
# =============================================================================

[[test]]
name = "mro_attribute"
description = "Class.__mro__ shows resolution order"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example { value: i32 }
'''


[[test]]
name = "mro_method"
description = "Class.mro() returns list"

python = '''
class A:
    pass

class B(A):
    pass

class C(A):
    pass

class D(B, C):
    pass

mro_list = D.mro()
result = len(mro_list) > 0 and mro_list[0] == D
'''

rust = '''
// Class.mro() returns list
// Rust doesn't have runtime MRO, but we can verify trait bounds
trait A {}
trait B: A {}
trait C: A {}

struct D;
impl A for D {}
impl B for D {}
impl C for D {}

pub fn test_mro() -> bool {
    // Verify D implements all traits
    let _d: &dyn A = &D;
    true
}

let result = test_mro();
'''


[[test]]
name = "c3_linearization"
description = "MRO follows C3 algorithm"

python = '''
class O:
    pass

class A(O):
    pass

class B(O):
    pass

class C(O):
    pass

class D(A, B):
    pass

class E(B, C):
    pass

class F(D, E):
    pass

# C3 linearization ensures consistent order
mro = F.mro()
result = mro.index(B) < mro.index(O) and mro.index(A) < mro.index(O)
'''

rust = '''
// MRO follows C3 algorithm
// Rust uses trait bounds for hierarchies
trait O {}
trait A: O {}
trait B: O {}
trait C: O {}

struct F;

impl O for F {}
impl A for F {}
impl B for F {}
impl C for F {}

pub fn test_c3() -> bool {
    // Verify F implements all traits in hierarchy
    let f = F;
    let _o: &dyn O = &f;
    true
}

let result = test_c3();
'''


# =============================================================================
# Diamond Problem
# =============================================================================

[[test]]
name = "diamond_basic"
description = "D inherits from B, C which both inherit from A"

python = '''
class A:
    def method(self):
        return "A"

class B(A):
    pass

class C(A):
    pass

class D(B, C):
    pass

d = D()
result = d.method() == "A"
'''

rust = '''
// D inherits from B, C which both inherit from A
trait A {
    fn method(&self) -> &str { "A" }
}

struct B;
impl A for B {}

struct C;
impl A for C {}

struct D;
impl A for D {}

pub fn test_diamond_basic() -> bool {
    let d = D;
    d.method() == "A"
}

let result = test_diamond_basic();
'''


[[test]]
name = "diamond_method"
description = "Which implementation is used in diamond"

python = '''
class A:
    def method(self):
        return "A"

class B(A):
    def method(self):
        return "B"

class C(A):
    def method(self):
        return "C"

class D(B, C):
    pass

d = D()
result = d.method() == "B"  # MRO picks first parent
'''

rust = '''
// Which implementation is used in diamond
trait A {
    fn method(&self) -> &str { "A" }
}

struct D;

trait B: A {
    fn method_b(&self) -> &str { "B" }
}

trait C: A {
    fn method_c(&self) -> &str { "C" }
}

impl A for D {
    fn method(&self) -> &str { "B" }  // Explicit implementation
}

impl B for D {}
impl C for D {}

pub fn test_diamond_method() -> bool {
    let d = D;
    d.method() == "B"
}

let result = test_diamond_method();
'''


[[test]]
name = "diamond_super"
description = "super() in diamond follows MRO"

python = '''
class A:
    def method(self):
        return "A"

class B(A):
    def method(self):
        return "B" + super().method()

class C(A):
    def method(self):
        return "C" + super().method()

class D(B, C):
    def method(self):
        return "D" + super().method()

d = D()
result = d.method() == "DBCA"  # super() follows MRO: D -> B -> C -> A
'''

rust = '''
// super() in diamond follows MRO
// Rust doesn't have super() but we can simulate the behavior
pub fn test_diamond_super() -> bool {
    fn method_a() -> String { "A".to_string() }
    fn method_c() -> String { format!("C{}", method_a()) }
    fn method_b() -> String { format!("B{}", method_c()) }
    fn method_d() -> String { format!("D{}", method_b()) }
    
    method_d() == "DBCA"
}

let result = test_diamond_super();
'''


# =============================================================================
# super() with Multiple Inheritance
# =============================================================================

[[test]]
name = "super_basic"
description = "super().method() calls parent"

python = '''
class Parent:
    def method(self):
        return "parent"

class Child(Parent):
    def method(self):
        return super().method() + "_child"

result = Child().method() == "parent_child"
'''

rust = '''
// super().method() calls parent
trait Parent {
    fn method(&self) -> String { "parent".to_string() }
}

struct Child;

impl Parent for Child {}

impl Child {
    fn method(&self) -> String {
        format!("{}_child", Parent::method(self))
    }
}

pub fn test_super_basic() -> bool {
    let child = Child;
    child.method() == "parent_child"
}

let result = test_super_basic();
'''


[[test]]
name = "super_with_args"
description = "super(Class, self).method()"

python = '''
class A:
    def method(self):
        return "A"

class B(A):
    def method(self):
        return "B"

class C(B):
    def method(self):
        return super(C, self).method()

result = C().method() == "B"
'''

rust = '''
// super(Class, self).method()
// Rust doesn't have super() with args, but we can explicitly call parent methods
trait A {
    fn method(&self) -> &str { "A" }
}

trait B: A {
    fn method_b(&self) -> &str { "B" }
}

struct C;

impl A for C {
    fn method(&self) -> &str { "B" }
}

impl B for C {}

pub fn test_super_with_args() -> bool {
    let c = C;
    c.method() == "B"
}

let result = test_super_with_args();
'''


[[test]]
name = "super_cooperative"
description = "All classes in hierarchy use super()"

python = '''
class A:
    def __init__(self):
        self.a = "A"

class B(A):
    def __init__(self):
        super().__init__()
        self.b = "B"

class C(A):
    def __init__(self):
        super().__init__()
        self.c = "C"

class D(B, C):
    def __init__(self):
        super().__init__()
        self.d = "D"

d = D()
result = hasattr(d, 'a') and hasattr(d, 'b') and hasattr(d, 'c') and hasattr(d, 'd')
'''

rust = '''
// All classes in hierarchy use super()
struct D {
    a: String,
    b: String,
    c: String,
    d: String,
}

impl D {
    fn new() -> Self {
        D {
            a: "A".to_string(),
            b: "B".to_string(),
            c: "C".to_string(),
            d: "D".to_string(),
        }
    }
}

pub fn test_super_cooperative() -> bool {
    let d = D::new();
    !d.a.is_empty() && !d.b.is_empty() && !d.c.is_empty() && !d.d.is_empty()
}

let result = test_super_cooperative();
'''


[[test]]
name = "super_init"
description = "Proper initialization with super()"

python = '''
class Base:
    def __init__(self, value):
        self.value = value

class Child(Base):
    def __init__(self, value, extra):
        super().__init__(value)
        self.extra = extra

child = Child(10, 20)
result = child.value == 10 and child.extra == 20
'''

rust = '''
// Proper initialization with super()
struct Child {
    value: i32,
    extra: i32,
}

impl Child {
    fn new(value: i32, extra: i32) -> Self {
        Child { value, extra }
    }
}

pub fn test_super_init() -> bool {
    let child = Child::new(10, 20);
    child.value == 10 && child.extra == 20
}

let result = test_super_init();
'''


