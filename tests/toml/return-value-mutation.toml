[[test]]
name = "nested_return_value_access"
description = "Nested access to return value without mutation"

python = '''
from dataclasses import dataclass

@dataclass
class Inner:
    value: int

@dataclass
class Outer:
    inner: Inner

def get_inner(o: Outer) -> Inner:
    return o.inner

def read_inner_value(o: Outer) -> int:
    inner = get_inner(o)
    return inner.value
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Inner {
    pub value: i32,
}
impl Inner {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Outer {
    pub inner: Inner,
}
impl Outer {
    pub fn new(inner: Inner) -> Self {
        Self { inner }
    }
}
pub fn get_inner(o: &Outer) -> Inner {
    return o.inner.clone();
}
pub fn read_inner_value(o: &Outer) -> i32 {
    let inner = get_inner(o);
    return inner.value;
}
'''
