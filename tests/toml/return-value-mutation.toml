[[test]]
name = "return_value_method_mutation"
description = "Return value mutated via method call"

python = '''
from dataclasses import dataclass

@dataclass
class Container:
    items: list[int]

def get_items(c: Container) -> list[int]:
    return c.items

def add_item(c: Container, value: int) -> None:
    items = get_items(c)
    items.append(value)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Container {
    pub items: Vec<i32>,
}
impl Container {
    pub fn new(items: Vec<i32>) -> Self {
        Self { items }
    }
}
pub fn get_items<'a>(c: &'a mut Container) -> &'a mut Vec<i32> {
    return &mut c.items;
}
pub fn add_item(c: &mut Container, value: i32) {
    let mut items = get_items(c).clone();
    items.push(value);
}
