[metadata]
name = "Return Value Mutation Analysis Tests"
category = "ownership-mutability"
description = "Tests for return value mutation detection and interprocedural analysis"

[[test]]
name = "return_value_mutated_at_call_site"
description = "Return value mutation detection"

python = '''
from dataclasses import dataclass

@dataclass
class Stats:
    value: int

@dataclass
class State:
    statistics: Stats

def get_stats(state: State) -> Stats:
    return state.statistics

def caller(s: State) -> None:
    stats = get_stats(s)
    stats.value = 10
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Stats {
    pub value: i32,
}
impl Stats {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct State {
    pub statistics: Stats,
}
impl State {
    pub fn new(statistics: Stats) -> Self {
        Self { statistics }
    }
}
pub fn get_stats<'a>(state: &'a mut State) -> &'a mut Stats {
    return &mut state.statistics;
}
pub fn caller(s: &mut State) {
    let mut stats = get_stats(s).clone();
    stats.value = 10;
}
'''

[[test]]
name = "return_value_not_mutated"
description = "Return value NOT mutated at call site"

python = '''
from dataclasses import dataclass

@dataclass
class Data:
    count: int

@dataclass
class State:
    data: Data

def get_count(state: State) -> int:
    return state.data.count

def read_only(s: State) -> int:
    val = get_count(s)
    return val
'''

