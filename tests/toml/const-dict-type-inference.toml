[metadata]
name = "Constant Dict Type Inference Tests"
category = "codegen"
description = "Module-level dict constants should infer HashMap<K, V> from element types"

[[test]]
name = "string_string_dict_constant"
description = "Dict with string keys and string values should be HashMap<String, String>"

python = '''
KICKOFF_TO_GRID_RESULT = {"A1Retain": "A1", "A1KickAway": "A1"}
'''

rust = '''
use std::collections::HashMap;
lazy_static::lazy_static! {
    pub static ref KICKOFF_TO_GRID_RESULT: HashMap<String, String> = {
        let mut map = HashMap::new();
        map.insert("A1Retain".to_string(), "A1".to_string());
        map.insert("A1KickAway".to_string(), "A1".to_string());
        map
    };
}
'''

