[[test]]
name = "tuple_return_with_constructed_values"
description = "Tuple return with constructed values has no reference wrapper"

python = '''
from dataclasses import dataclass

@dataclass
class Item:
    value: int

def create_pair(a: int, b: int) -> tuple[Item, Item]:
    return (Item(a), Item(b))
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Item {
    pub value: i32,
}
impl Item {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
pub fn create_pair(a: i32, b: i32) -> (Item, Item) {
    return (Item::new(a), Item::new(b));
}
'''

