[metadata]
name = "Reference Return Type Tests"
category = "codegen"
description = "Tests for constructor return values not adding spurious references"

[[test]]
name = "constructor_return_no_reference"
description = "Constructor return should be value, not reference"

python = '''
from dataclasses import dataclass

@dataclass
class Point:
    x: int
    y: int

def create_point(x: int, y: int) -> Point:
    return Point(x, y)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
}
pub fn create_point(x: i32, y: i32) -> Point {
    return Point::new(x, y);
}
'''

