[[test]]
name = "nested_constructor_in_return"
description = "Nested constructor calls in return statement"

python = '''
from dataclasses import dataclass

@dataclass
class Inner:
    value: int

@dataclass
class Outer:
    inner: Inner

def create_nested(v: int) -> Outer:
    return Outer(Inner(v))
'''

rust = '''
#[doc = "// NOTE: Map Python module 'dataclasses'()"]
use serde_json;
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Inner {
    pub value: i32,
}
impl Inner {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
}
#[derive(Debug, Clone, PartialEq, Default)]
pub struct Outer {
    pub inner: Inner,
}
impl Outer {
    pub fn new(inner: Inner) -> Self {
        Self { inner }
    }
}
pub fn create_nested(v: i32) -> Outer {
    return Outer::new(Inner::new(v));
}
'''
