    return 42

result = f()
'''

rust = '''
'''


[[test]]
name = "decorator_optional_args"
skip = true
description = "Some args required, others optional"

python = '''
def decorator(arg):
    def actual_decorator(func):
        def wrapper(*args, **kwargs):
            print(f'Called with: {arg}')
            return func(*args, **kwargs)
        return wrapper
    return actual_decorator

@decorator('test')
def f():
    return 42

result = f()
'''

rust = '''
'''


