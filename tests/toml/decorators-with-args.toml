[metadata]
name = "Decorators with Arguments Tests"
category = "decorators-closures"

# =============================================================================
# Basic Parameterized Decorator
# =============================================================================

[[test]]
name = "decorator_args_basic"
skip = true
description = "@decorator(arg) def f(): ..."

python = '''
def decorator(func):
    def wrapper(*args, **kwargs):
        return func(*args, **kwargs)
    return wrapper

@decorator
def f():
    return 42

result = f()
'''

rust = '''
'''


[[test]]
name = "decorator_factory"
skip = true
description = "def decorator(arg): def actual_decorator(f): ... return actual_decorator"

