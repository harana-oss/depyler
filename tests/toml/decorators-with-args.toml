# Decorators with Arguments Tests - Parameterized decorators
# Rust Mapping: Macro with parameters

[metadata]
name = "Decorators with Arguments Tests"
category = "decorators-closures"

# =============================================================================
# Basic Parameterized Decorator
# =============================================================================

[[test]]
name = "decorator_args_basic"
description = "@decorator(arg) def f(): ..."

python = '''
def decorator(func):
    def wrapper(*args, **kwargs):
        return func(*args, **kwargs)
    return wrapper

@decorator
def f():
    return 42

result = f()
'''

rust = '''
// Rust procedural macro
// #[decorator]
// fn f() -> i32 { 42 }
'''


