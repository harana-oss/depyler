[[test]]
name = "re_subn"
description = "re.subn() with count"

python = '''
import re

def replace_first_number(s: str) -> str:
    result, count = re.subn(r"\d+", "N", s, count=1)
    return result
'''

rust = '''
use regex as re;
pub fn replace_first_number(s: String) -> String {
    let (result, count) = {
        let re = regex::Regex::new("\\d+").unwrap();
        let count = re.find_iter(s).count();
        let result = re.replace_all(s, "N").to_string();
        (result, count)
    };
    return result;
}
'''

