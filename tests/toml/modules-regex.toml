[[test]]
name = "re_groups"
description = "regex capture groups extraction"

python = '''
import re

def extract_date_parts(s: str) -> tuple[str, str, str]:
    m = re.match(r"(\d{4})-(\d{2})-(\d{2})", s)
    if m:
        return (m.group(1), m.group(2), m.group(3))
    return ("", "", "")
'''

rust = '''
use regex as re;
pub fn extract_date_parts(s: String) -> (String, String, String) {
    let m = regex::Regex::new("(\\d{4})-(\\d{2})-(\\d{2})").unwrap().find(s);
    if m.is_some() {
        return (
            m.as_ref().unwrap().get(1).map(|m| m.as_str()).unwrap_or(""),
            m.as_ref().unwrap().get(2).map(|m| m.as_str()).unwrap_or(""),
            m.as_ref().unwrap().get(3).map(|m| m.as_str()).unwrap_or(""),
        );
    }
    return ("", "", "");
}
'''

[[test]]
name = "re_named_groups"
description = "regex named capture groups"

python = '''
import re

def extract_name_value(s: str) -> dict[str, str]:
    m = re.match(r"(?P<key>\w+)=(?P<value>\w+)", s)
    if m:
        return {"key": m.group("key"), "value": m.group("value")}
    return {}
'''

rust = '''
use regex as re;
use std::collections::HashMap;
pub fn extract_name_value(s: String) -> HashMap<String, String> {
    let m = regex::Regex::new("(?P<key>\\w+)=(?P<value>\\w+)").unwrap().find(s);
    if m.is_some() {
        return {
            let mut map = HashMap::new();
            map.insert(
                "key".to_string(),
                if "key" == 0 {
                    m.as_ref().unwrap().as_str()
                } else {
                    m.as_ref().unwrap().get("key").map(|m| m.as_str()).unwrap_or("")
                },
            );
            map.insert(
                "value".to_string(),
                if "value" == 0 {
                    m.as_ref().unwrap().as_str()
                } else {
                    m.as_ref().unwrap().get("value").map(|m| m.as_str()).unwrap_or("")
                },
            );
            map
        };
    }
    return {
        let map = HashMap::new();
        map
    }
'''

