[[test]]
name = "re_match_groups"
description = "match.groups() returns tuple of captured groups (currently returns empty Vec)"

python = '''
import re

def get_groups(pattern: str, text: str) -> list[str]:
    m = re.match(pattern, text)
    if m:
        return m.groups()
    return []
'''

rust = '''
use regex as re;
pub fn get_groups(pattern: String, text: String) -> Vec<String> {
    let m = regex::Regex::new(pattern).unwrap().find(text);
    if m.is_some() {
        return vec![] as Vec<String>;
    }
    return vec![];
}
'''

