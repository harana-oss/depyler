[[test]]
name = "re_match"
description = "re.match() pattern at start"

python = '''
import re

def starts_with_hello(s: str) -> bool:
    return re.match(r"^hello", s) is not None
'''

rust = '''
use regex as re;
pub fn starts_with_hello(s: String) -> bool {
    return regex::Regex::new("^hello").unwrap().find(s).is_some();
}
'''

