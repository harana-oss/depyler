[[test]]
name = "fnmatch_match"
description = "fnmatch filename matching"

python = '''
import fnmatch

def matches_pattern(filename: str, pattern: str) -> bool:
    return fnmatch.fnmatch(filename, pattern)
'''

rust = '''
#[doc = "// NOTE: Map Python module 'fnmatch'()"]
pub fn matches_pattern(filename: String, pattern: String) -> bool {
    return {
        let pattern_str = pattern;
        let regex_pattern = pattern_str
            .replace(".", "\\.")
            .replace("*", ".*")
            .replace("?", ".")
            .replace("[!", "[^");
        let regex =
            regex::Regex::new(&format!("^{}$", regex_pattern)).unwrap_or_else(|_| regex::Regex::new("^$").unwrap());
        regex.is_match(filename)
    }
'''

[[test]]
name = "fnmatch_filter"
description = "fnmatch.filter() list filtering"

python = '''
import fnmatch

def filter_py_files(files: list[str]) -> list[str]:
    return fnmatch.filter(files, "*.py")
'''

rust = '''
#[doc = "// NOTE: Map Python module 'fnmatch'()"]
pub fn filter_py_files(files: &Vec<String>) -> Vec<String> {
    return {
        let pattern_str = "*.py";
        let regex_pattern = pattern_str
            .replace(".", "\\.")
            .replace("*", ".*")
            .replace("?", ".")
            .replace("[!", "[^");
        let regex =
            regex::Regex::new(&format!("^{}$", regex_pattern)).unwrap_or_else(|_| regex::Regex::new("^$").unwrap());
        (files)
            .into_iter()
            .filter(|name| regex.is_match(&name.to_string()))
            .collect::<Vec<_>>()
    };
}
'''

