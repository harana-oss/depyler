[[test]]
name = "tuple_param_index"
description = "Tuple parameter indexed with literal generates field access syntax"

python = '''
def get_start(x_range: tuple[int, int]) -> int:
    return x_range[0]
'''

rust = '''
pub fn get_start(x_range: (i32, i32)) -> i32 {
    return x_range.0;
}
'''

[[test]]
name = "tuple_param_index_second"
description = "Tuple parameter second element access"

python = '''
def get_end(x_range: tuple[int, int]) -> int:
    return x_range[1]
'''

rust = '''
pub fn get_end(x_range: (i32, i32)) -> i32 {
    return x_range.1;
}
'''

[[test]]
name = "tuple_param_both_elements"
description = "Accessing both tuple elements from parameter"

python = '''
def span(x_range: tuple[int, int]) -> int:
    return x_range[1] - x_range[0]
'''

rust = '''
pub fn span(x_range: (i32, i32)) -> i32 {
    return x_range.1 - x_range.0;
}
'''

[[test]]
name = "tuple_literal_assignment_index"
description = "Tuple assigned from literal then indexed"

python = '''
def get_first() -> int:
    pair = (10, 20)
    return pair[0]
'''

rust = '''
pub fn get_first() -> i32 {
    let pair = (10, 20);
    return pair.0;
}
'''

[[test]]
name = "tuple_three_element_index"
description = "Three element tuple parameter indexing"

python = '''
def get_middle(t: tuple[int, str, float]) -> str:
    return t[1]
'''

rust = '''
pub fn get_middle(t: &(i32, String, f64)) -> String {
    return t.1;
}
'''

[[test]]
name = "divmod_tuple_first"
description = "divmod result indexed with literal uses tuple field access"

python = '''
def divmod_first(a: int, b: int) -> int:
    result = divmod(a, b)
    return result[0]
'''

rust = '''
pub fn divmod_first(a: i32, b: i32) -> i32 {
    let result = (a / b, a % b);
    return result.0;
}
'''

[[test]]
name = "divmod_tuple_both"
description = "divmod result both elements accessed with tuple field syntax"

python = '''
def divmod_both(a: int, b: int) -> int:
    result = divmod(a, b)
    return result[0] + result[1]
'''

rust = '''
pub fn divmod_both(a: i32, b: i32) -> i32 {
    let result = (a / b, a % b);
    return result.0 + result.1;
}
'''

[[test]]
name = "tuple_from_list_iteration"
description = "Tuple field access on loop variable from list of tuples"

python = '''
def sum_first_elements(pairs: list[tuple[int, int]]) -> int:
    total = 0
    for pair in pairs:
        total += pair[0]
    return total
'''

rust = '''
pub fn sum_first_elements(pairs: &Vec<(i32, i32)>) -> i32 {
    let mut total = 0;
    for pair in pairs.iter().cloned() {
        total += pair.0;
    }
    return total;
}
'''

[[test]]
name = "tuple_span_from_list"
description = "Both tuple elements accessed on loop variable from list"

python = '''
def total_span(ranges: list[tuple[int, int]]) -> int:
    total = 0
    for r in ranges:
        total += r[1] - r[0]
    return total
'''

rust = '''
pub fn total_span(ranges: &Vec<(i32, i32)>) -> i32 {
    let mut total = 0;
    for r in ranges.iter().cloned() {
        total += r.1 - r.0;
    }
    return total;
}
'''
