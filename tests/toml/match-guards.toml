[metadata]
name = "Match Guards Tests"
category = "modern-python"

# =============================================================================
# Basic Guards
# =============================================================================

[[test]]
name = "guard_basic"
skip = true
description = "case x if x > 0: ..."

python = '''
value = 5
match value:
    case x if x > 0:
        result = True
    case _:
        result = False
'''

rust = '''
    let value = 5;
    let result = match value {
        x if x > 0 => true,
        _ => false,
    };
'''


[[test]]
name = "guard_comparison"
skip = true
description = "case x if x >= 10 and x <= 20: ..."

python = '''
value = 15
match value:
    case x if x >= 10 and x <= 20:
        result = True
    case _:
        result = False
'''

rust = '''
    let value = 15;
    let result = match value {
        x if x >= 10 && x <= 20 => true,
        _ => false,
    };
'''


[[test]]
name = "guard_function"
skip = true
description = "case x if is_valid(x): ..."

python = '''
def is_valid(x):
    return x % 2 == 0

value = 10
match value:
    case x if is_valid(x):
        result = True
    case _:
        result = False
'''

rust = '''
    fn is_valid(x: i32) -> bool {
        x % 2 == 0
    }

    let value = 10;
    let result = match value {
        x if is_valid(x) => true,
        _ => false,
    };
'''


# =============================================================================
# Guards with Pattern Variables
# =============================================================================

[[test]]
name = "guard_captured"
skip = true
description = "case (x, y) if x < y: ..."

python = '''
value = (3, 5)
match value:
    case (x, y) if x < y:
        result = True
    case _:
        result = False
'''

rust = '''
    let value = (3, 5);
    let result = match value {
        (x, y) if x < y => true,
        _ => false,
    };
'''


[[test]]
name = "guard_multi_capture"
skip = true
description = "case [first, *rest] if len(rest) > 0: ..."

python = '''
value = [1, 2, 3, 4]
match value:
    case [first, *rest] if len(rest) > 0:
        result = first == 1 and len(rest) == 3
    case _:
        result = False
'''

rust = '''
    let value = vec![1, 2, 3, 4];
    let result = match value.as_slice() {
        [first, rest @ ..] if rest.len() > 0 => *first == 1 && rest.len() == 3,
        _ => false,
    };
'''


