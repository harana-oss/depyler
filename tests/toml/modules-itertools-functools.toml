[[test]]
name = "functools_lru_cache"
description = "functools.lru_cache() memoization"

python = '''
from functools import lru_cache

@lru_cache(maxsize=128)
def fib(n: int) -> int:
    if n < 2:
        return n
    return fib(n - 1) + fib(n - 2)
'''

rust = '''
use std;
pub fn fib(n: i32) -> i32 {
    let _cse_temp_0 = n < 2;
    if _cse_temp_0 {
        return n;
    }
    return fib(n - 1) + fib(n - 2);
}
'''

