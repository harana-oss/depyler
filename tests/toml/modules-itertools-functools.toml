[[test]]
name = "itertools_groupby"
description = "itertools.groupby() grouping"

python = '''
from itertools import groupby

def group_by_first_char(words: list[str]) -> dict[str, list[str]]:
    result = {}
    for k, g in groupby(sorted(words), key=lambda x: x[0]):
        result[k] = list(g)
    return result
'''

rust = '''
use itertools::group_by;
use std::collections::HashMap;
pub fn group_by_first_char(words: Vec<String>) -> HashMap<String, Vec<String>> {
    let mut result = {
        let map = HashMap::new();
        map
    };
    for (k, g) in itertools::group_by(
        {
            let mut __sorted_result = words.clone();
            __sorted_result.sort();
            __sorted_result
        },
        |x| x.get(0usize).cloned().unwrap(),
    ) {
        result.insert(k, g.into_iter().collect::<Vec<_>>());
    }
    return result;
}
'''

