[metadata]
name = "Itertools and Functools Module Tests"
category = "stdlib-itertools-functools"

# =============================================================================
# Itertools - Combinations
# =============================================================================

[[test]]
name = "itertools_chain"
description = "itertools.chain() iterator chaining"

python = '''
from itertools import chain

def combine_lists(a: list[int], b: list[int]) -> list[int]:
    return list(chain(a, b))
'''

rust = '''
use itertools::chain;
pub fn combine_lists(a: Vec<i32>, b: Vec<i32>) -> Vec<i32> {
    return itertools::chain(a, b).into_iter().collect::<Vec<_>>();
}
'''

[[test]]
name = "itertools_combinations"
description = "itertools.combinations() n-choose-k"

python = '''
from itertools import combinations

def all_pairs(items: list[int]) -> list[tuple[int, int]]:
    return list(combinations(items, 2))
'''

rust = '''
use itertools::combinations;
pub fn all_pairs(items: Vec<i32>) -> Vec<(i32, i32)> {
    return itertools::combinations(items, 2)
        .into_iter()
        .collect::<Vec<_>>();
}
'''

