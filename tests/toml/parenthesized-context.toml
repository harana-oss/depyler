[[test]]
name = "paren_line_length"
skip = true
description = "Keep lines under limit with parentheses"

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

with (
    CM("very_long_context_manager_name_1") as ctx1,
    CM("very_long_context_manager_name_2") as ctx2,
):
    result = len(ctx1) + len(ctx2)
assert result > 0
'''

rust = '''
    // Rust: long variable names formatted across lines
    {
        let ctx1 = String::from("very_long_context_manager_name_1");
        let ctx2 = String::from("very_long_context_manager_name_2");
        let result = ctx1.len() + ctx2.len();
        assert!(result > 0);
    }
'''


