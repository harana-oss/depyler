# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "paren_empty"
skip = true
description = "with (): is syntax error"

python = '''
# Empty parentheses in with statement are invalid
# Must have at least one context manager
# Using valid single context manager instead
class CM:
    def __enter__(self):
        return 42
    def __exit__(self, *args):
        pass

with CM() as x:
    result = x == 42
'''

rust = '''
    // Rust: valid block with resource
    {
        let x = 42;
        let result = x == 42;
    }
'''


[[test]]
name = "paren_single_trailing"
skip = true
description = "with (cm,): same as with cm:"

python = '''
class CM:
    def __enter__(self):
        return 99
    def __exit__(self, *args):
        pass

with (CM(),) as cm:
    result = cm
assert result == 99
'''

rust = '''
    // Rust: single binding
    {
        let cm = 99;
        let result = cm;
        assert_eq!(result, 99);
    }
'''


[[test]]
name = "paren_nested"
skip = true
description = "with ((cm)): ..."

python = '''
class CM:
    def __enter__(self):
        return 77
    def __exit__(self, *args):
