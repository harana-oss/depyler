# =============================================================================
# Comparison with Pre-3.10
# =============================================================================

[[test]]
name = "backslash_continuation"
skip = true
description = "with a, \\\n     b: ... (old way)"

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

with CM(1) as a, \
     CM(2) as b:
    result = a + b
assert result == 3
'''

rust = '''
    // Rust: line continuation not needed
    {
        let a = 1;
        let b = 2;
        let result = a + b;
        assert_eq!(result, 3);
    }
'''


[[test]]
name = "nested_with_old"
skip = true
description = "with a:\n    with b: ... (old way)"

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

with CM(1) as a:
    with CM(2) as b:
        result = a + b
assert result == 3
'''

rust = '''
    // Rust: nested scopes
    {
        let a = 1;
        {
            let b = 2;
            let result = a + b;
            assert_eq!(result, 3);
        }
    }
'''


[[test]]
name = "exitstack_alternative"
skip = true
description = "ExitStack for dynamic cases"

python = '''
from contextlib import ExitStack

class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

with ExitStack() as stack:
    items = [stack.enter_context(CM(i)) for i in [1, 2, 3]]
    result = sum(items)
assert result == 6
'''

rust = '''
    // Rust: Vec of resources
    {
        let items: Vec<i32> = vec![1, 2, 3];
        let result: i32 = items.iter().sum();
        assert_eq!(result, 6);
    }
'''


# =============================================================================
# Complex Expressions
# =============================================================================

[[test]]
name = "paren_expressions"
skip = true
description = "with (\n    get_cm() as x,\n    obj.method(),\n): ..."

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

def get_cm():
    return CM(42)

class Obj:
    def method(self):
        return CM(100)

obj = Obj()
with (
    get_cm() as x,
    obj.method() as y,
):
    result = x + y
assert result == 142
'''

rust = '''
    // Rust: expressions in bindings
    fn get_cm() -> i32 {
        42
    }

    struct Obj;
    impl Obj {
        fn method(&self) -> i32 {
            100
        }
    }

    let obj = Obj;
    let x = get_cm();
    let y = obj.method();
    let result = x + y;
    assert_eq!(result, 142);
'''


