[metadata]
name = "Parenthesized Context Managers Tests"
category = "context-managers"

# =============================================================================
# Basic Parenthesized Syntax
# =============================================================================

[[test]]
name = "paren_basic"
skip = true
description = "with (cm): ..."

python = '''
class CM:
    def __enter__(self):
        return "resource"
    def __exit__(self, *args):
        pass

with (CM()) as cm:
    result = cm
assert result == "resource"
'''

rust = '''
    // Rust: RAII pattern with explicit scope
    {
        let cm = String::from("resource");
        let result = cm;
        assert_eq!(result, "resource");
    }
'''


[[test]]
name = "paren_multiline"
skip = true
description = "with (\n    a,\n    b,\n): ..."

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

with (
    CM("a") as a,
    CM("b") as b,
):
    result = (a, b)
assert result == ("a", "b")
'''

rust = '''
    // Rust: multiple bindings in scope
    {
        let a = String::from("a");
        let b = String::from("b");
        let result = (a.clone(), b.clone());
        assert_eq!(result, (String::from("a"), String::from("b")));
    }
'''


[[test]]
name = "paren_trailing_comma"
skip = true
description = "with (a, b,): ..."

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

with (CM(1) as a, CM(2) as b,):
    result = a + b
assert result == 3
'''

rust = '''
    // Rust: multiple bindings with trailing comma style
    {
        let a = 1;
        let b = 2;
        let result = a + b;
        assert_eq!(result, 3);
    }
'''


# =============================================================================
# Multiple Context Managers
# =============================================================================

[[test]]
name = "paren_two"
skip = true
description = "with (\n    open(a) as f1,\n    open(b) as f2,\n): ..."

python = '''
from io import StringIO

file1 = StringIO("content1")
file2 = StringIO("content2")

with (
    file1 as f1,
    file2 as f2,
):
    result = (f1.read(), f2.read())
assert result == ("content1", "content2")
'''

rust = '''
    // Rust: RAII file handles
    use std::io::Cursor;
    use std::io::Read;

    let mut file1 = Cursor::new(b"content1");
    let mut file2 = Cursor::new(b"content2");
    let mut buf1 = String::new();
    let mut buf2 = String::new();
    file1.read_to_string(&mut buf1).unwrap();
    file2.read_to_string(&mut buf2).unwrap();
    let result = (buf1, buf2);
    assert_eq!(result.0, "content1");
    assert_eq!(result.1, "content2");
'''


[[test]]
name = "paren_many"
skip = true
description = "Readable syntax for many contexts"

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

with (
    CM(1) as a,
    CM(2) as b,
    CM(3) as c,
    CM(4) as d,
):
    result = a + b + c + d
assert result == 10
'''

rust = '''
    // Rust: many bindings in scope
    {
        let a = 1;
        let b = 2;
        let c = 3;
        let d = 4;
        let result = a + b + c + d;
        assert_eq!(result, 10);
    }
'''


