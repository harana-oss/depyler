# =============================================================================
# Python Version Compatibility
# =============================================================================

[[test]]
name = "paren_version"
skip = true
description = "Parenthesized with requires Python 3.10+"

python = '''
import sys
# Parenthesized with requires Python 3.10+
result = sys.version_info >= (3, 10)
'''

rust = '''
    // Rust: no version requirements for this pattern
    let result = true;
'''


[[test]]
name = "paren_alternatives"
skip = true
description = "Ways to achieve same in older Python"

python = '''
class CM:
    def __init__(self, value):
        self.value = value
    def __enter__(self):
        return self.value
    def __exit__(self, *args):
        pass

# Alternative 1: backslash continuation
# Alternative 2: nested with statements
# Alternative 3: contextlib.ExitStack
with CM(10) as a, CM(20) as b:
    result = a + b
assert result == 30
'''

rust = '''
    // Rust: same pattern works at any version
    {
        let a = 10;
        let b = 20;
        let result = a + b;
        assert_eq!(result, 30);
    }
'''

