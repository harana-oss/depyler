[[test]]
name = "type_tracking_slice"
description = "Slicing operation preserves Vec type"

python = '''
def slice_list(items: list[int]) -> list[int]:
    subset = items[1:3]
    return subset
'''

rust = '''
pub fn slice_list(items: &Vec<i32>) -> Vec<i32> {
    let subset = {
        let base = &items;
        let start = (1).max(0) as usize;
        let stop = (3).max(0) as usize;
        if start < base.len() {
            base[start..stop.min(base.len())].to_vec()
        } else {
            Vec::new()
        }
    };
    return subset;
}
'''

