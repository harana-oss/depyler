[[test]]
name = "tuple_unpack_enumerate_nested"
description = "Tuple unpacking with enumerate and nested tuples"

python = '''
def process_bounds():
    values = [(1, 1), (2, 2), (3, 3)]
    total = 0
    for index, bounds in enumerate(values):
        lower, upper = bounds
        total += lower + upper
    return total
'''

rust = '''
pub fn process_bounds() -> i32 {
    let values = vec![(1, 1), (2, 2), (3, 3)];
    let mut total = 0;
    for (_index, bounds) in values
        .iter()
        .enumerate()
        .map(|(i, x)| (i as i32, x.clone()))
    {
        let (lower, upper) = bounds;
        total += lower + upper;
    }
    return total;
}
'''

[[test]]
name = "tuple_index_access_in_loop"
skip = true
description = "Accessing tuple elements by index in enumerate loop"

python = '''
def access_bounds():
    values = [(1, 1), (2, 2), (3, 3)]
    total = 0
    for index, bounds in enumerate(values):
        total += bounds[0] + bounds[1]
    return total
'''

rust = '''
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn access_bounds() -> i32 {
    let values = vec![(1, 1), (2, 2), (3, 3)];
    let mut total = 0;
    for (_index, bounds) in values
        .iter()
        .enumerate()
        .map(|(i, x)| (i as i32, x.clone()))
    {
        total += bounds.0 + bounds.1;
    }
    return total;
}
'''

[[test]]
name = "tuple_index_after_list_index"
skip = true
description = "Tuple index access after extracting from list"

python = '''
import random

def one(x: int, y: int):
    pass

def two():
    values = [(1, 1), (2, 2), (3, 3)]
    value1 = values[0]
    return one(x=random.randint(value1[0], value1[1] - 1))
'''

rust = '''
use rand as random;
use rand::Rng;
use rand::prelude::*;
#[derive(Debug, Clone)]
pub struct IndexError {
    message: String,
}
impl std::fmt::Display for IndexError {
    fn fmt(&self, f: &mut std::fmt::Formatter<'_>) -> std::fmt::Result {
        write!(f, "index out of range: {}", self.message)
    }
}
impl std::error::Error for IndexError {}
impl IndexError {
    pub fn new(message: impl Into<String>) -> Self {
        Self {
            message: message.into(),
        }
    }
}
pub fn one(x: i32, y: i32) {}
pub fn two() {
    let values = vec![(1, 1), (2, 2), (3, 3)];
    let value1 = values.get(0usize).cloned().unwrap();
    return one(rand::thread_rng().gen_range(value1.0..=value1.1 - 1));
}
'''

