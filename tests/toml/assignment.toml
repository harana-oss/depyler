# =============================================================================
# Tuple Unpacking
# =============================================================================

[[test]]
name = "tuple_unpack_basic"
description = "Basic tuple unpacking"
tags = ["assignment", "tuple", "unpack"]

[test.python]
code = '''
def unpack_tuple():
    a, b = (1, 2)
    return a + b
'''

[test.assertions]
contains_any = [["let (a, b)", "let a", "let b"]]

[[test]]
name = "tuple_unpack_triple"
description = "Triple tuple unpacking"
tags = ["assignment", "tuple", "unpack"]

[test.python]
code = '''
def unpack_triple():
    x, y, z = (1, 2, 3)
    return x + y + z
'''

[test.assertions]
contains_any = [["let (x, y, z)", "let x"]]

[[test]]
name = "tuple_unpack_enumerate_nested"
description = "Tuple unpacking with enumerate and nested tuples"
tags = ["assignment", "tuple", "unpack", "enumerate"]

[test.python]
code = '''
def process_bounds():
    values = [(1, 1), (2, 2), (3, 3)]
    total = 0
    for index, bounds in enumerate(values):
        lower, upper = bounds
        total += lower + upper
    return total
'''

[test.assertions]
contains_any = [["enumerate", "iter().enumerate()"], ["let (lower, upper)", "let lower"]]

[[test]]
name = "tuple_index_access_in_loop"
description = "Accessing tuple elements by index in enumerate loop"
tags = ["assignment", "tuple", "index", "enumerate"]

[test.python]
code = '''
def access_bounds():
    values = [(1, 1), (2, 2), (3, 3)]
    total = 0
    for index, bounds in enumerate(values):
        total += bounds[0] + bounds[1]
    return total
'''

[test.assertions]
contains = ["bounds.0", "bounds.1"]

[[test]]
name = "tuple_index_after_list_index"
description = "Tuple index access after extracting from list"
tags = ["assignment", "tuple", "index", "list"]

[test.python]
code = '''
import random

def one(x: int, y: int):
    pass

def two():
    values = [(1, 1), (2, 2), (3, 3)]
    value1 = values[0]
    return one(x=random.randint(value1[0], value1[1] - 1))
'''

[test.assertions]
contains = ["value1.0", "value1.1"]

