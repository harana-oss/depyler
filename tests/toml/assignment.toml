'''

rust = '''
use std::collections::HashMap;
pub fn nested_update() -> HashMap<String, HashMap<String, i32>> {
    let mut data = {
        let mut map = HashMap::new();
        map.insert("stats".to_string(), {
            let mut map = HashMap::new();
            map.insert("count".to_string(), 0);
            map
        });
        map
    };
    data.clone().get_mut(&"stats").unwrap().insert(
        "count".to_string(),
        data.get("stats")
            .cloned()
            .unwrap()
            .get("count")
            .cloned()
            .unwrap()
            + 1,
    );
    return data;
}
'''

