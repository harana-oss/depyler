# =============================================================================
# Basic Variable Assignment
# =============================================================================

[[test]]
name = "assign_integer"
description = "Simple integer assignment"
tags = ["assignment", "integer"]

[test.python]
code = '''
def assign_int():
    x = 42
    return x
'''

[test.assertions]
contains = ["let x = 42"]

[[test]]
name = "assign_string"
description = "Simple string assignment"
tags = ["assignment", "string"]

