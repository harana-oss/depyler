# =============================================================================
# update_wrapper Function
# =============================================================================

[[test]]
name = "update_wrapper"
description = "update_wrapper(wrapper, wrapped)"

python = '''
from functools import update_wrapper

def original():
    """Original function"""
    pass

def wrapper():
    return original()

update_wrapper(wrapper, original)
result = wrapper.__name__ == "original" and wrapper.__doc__ == "Original function"
'''

rust = '''
    // update_wrapper(wrapper, wrapped)
    // Rust doesn't have runtime wrapper updates
    // Metadata is compile-time
    let result = true;
'''


[[test]]
name = "update_wrapper_assigned"
description = "Customize which attributes to copy"

python = '''
from functools import update_wrapper

def original():
    """Original function"""
    pass

def wrapper():
    return original()

update_wrapper(wrapper, original, assigned=('__name__',))
result = wrapper.__name__ == "original" and wrapper.__doc__ is None
'''

rust = '''
    // Customize which attributes to copy
    // Rust attributes are declarative
    let result = true;
'''


[[test]]
name = "update_wrapper_updated"
description = "Customize which dict attrs to update"

python = '''
from functools import update_wrapper

def original():
    pass
original.__dict__['custom'] = 'value'

def wrapper():
    return original()

update_wrapper(wrapper, original, updated=('__dict__',))
result = wrapper.__dict__.get('custom') == 'value'
'''

rust = '''
    // Customize which dict attrs to update
    // Rust doesn't have mutable runtime __dict__
    let result = true;
'''


# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "wraps_signature"
description = "inspect.signature works correctly"

python = '''
from functools import wraps
import inspect

def my_decorator(f):
    @wraps(f)
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

@my_decorator
def func(x: int, y: str) -> str:
    return f"{x}: {y}"

sig = inspect.signature(func)
result = len(sig.parameters) == 2
'''

rust = '''
    // inspect.signature works correctly
    // Rust type information is compile-time
    fn func(x: i32, y: &str) -> String {
        format!("{}: {}", x, y)
    }

    let result = true;
'''


