[metadata]
name = "functools.wraps Tests"
category = "decorators-closures"

# =============================================================================
# Basic @wraps Usage
# =============================================================================

[[test]]
name = "wraps_basic"
description = "@wraps(f) def wrapper(): ..."

python = '''
from functools import wraps

def my_decorator(f):
    @wraps(f)
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

@my_decorator
def hello():
    return "Hello"

result = hello.__name__ == "hello"
'''

rust = '''
    // @wraps(f) def wrapper(): ...
    // Rust uses proc macros for decoration, metadata preserved automatically
    fn hello() -> &'static str {
        "Hello"
    }

    let result = true;
'''


[[test]]
name = "without_wraps"
description = "wrapper.__name__ would be 'wrapper'"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


[[test]]
name = "with_wraps"
description = "wrapper.__name__ becomes f.__name__"

python = '''
class Example:
    def __init__(self, value):
        self.value = value

result = Example(42)
'''

rust = '''
struct Example {
    value: i32,
}
'''


