# =============================================================================
# @wraps with Decorator Factory
# =============================================================================

[[test]]
name = "wraps_factory"
description = "@wraps in parameterized decorator"

python = '''
from functools import wraps

def repeat(times):
    def decorator(f):
        @wraps(f)
        def wrapper(*args, **kwargs):
            for _ in range(times):
                result = f(*args, **kwargs)
            return result
        return wrapper
    return decorator

@repeat(3)
def greet():
    return "Hello"

result = greet.__name__ == "greet"
'''

rust = '''
    // @wraps in parameterized decorator
    // Rust proc macros can take parameters
    fn greet() -> &'static str {
        "Hello"
    }

    let result = true;
'''


[[test]]
name = "wraps_nested"
description = "Multiple decorators all using @wraps"

python = '''
from functools import wraps

def deco1(f):
    @wraps(f)
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

def deco2(f):
    @wraps(f)
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

@deco1
@deco2
def original():
    pass

result = original.__name__ == "original"
'''

rust = '''
    // Multiple decorators all using @wraps
    // Rust can stack multiple attributes
    #[allow(dead_code)]
    #[inline]
    fn original() {}

    let result = true;
'''


