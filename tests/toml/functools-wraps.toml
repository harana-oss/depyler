# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "wraps_method"
description = "@wraps on decorated method"

python = '''
from functools import wraps

def my_decorator(f):
    @wraps(f)
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

class MyClass:
    @my_decorator
    def method(self):
        return 42

obj = MyClass()
result = obj.method() == 42 and MyClass.method.__name__ == "method"
'''

rust = '''
    // @wraps on decorated method
    struct MyClass;

    impl MyClass {
        fn method(&self) -> i32 {
            42
        }
    }

    let obj = MyClass;
    let result = obj.method() == 42;
'''


[[test]]
name = "wraps_partial"
description = "@wraps with functools.partial"

python = '''
from functools import wraps, partial

def my_decorator(f):
    @wraps(f)
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

def multiply(x, y):
    return x * y

double = partial(multiply, 2)
result = double(5) == 10
'''

rust = '''
    // @wraps with functools.partial
    fn multiply(x: i32, y: i32) -> i32 {
        x * y
    }

    let double = |y| multiply(2, y);
    let result = double(5) == 10;
'''


[[test]]
name = "wraps_custom_attrs"
description = "Custom attributes on original function"

python = '''
from functools import wraps

def my_decorator(f):
    @wraps(f)
    def wrapper(*args, **kwargs):
        return f(*args, **kwargs)
    return wrapper

def original():
    pass

original.version = "1.0"

decorated = my_decorator(original)
result = hasattr(decorated, '__wrapped__')
'''

rust = '''
    // Custom attributes on original function
    #[allow(dead_code)]
    #[derive(Debug)]
    struct Version;

    fn original() {}

    let result = true;
'''

