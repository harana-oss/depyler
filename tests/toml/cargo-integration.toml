[[test]]
name = "cargo_dependency_version"
description = "Dependency version specification"

python = '''
def parse_version(version_str: str) -> tuple[int, int, int]:
    parts = version_str.split(".")
    major = int(parts[0]) if len(parts) > 0 else 0
    minor = int(parts[1]) if len(parts) > 1 else 0
    patch = int(parts[2]) if len(parts) > 2 else 0
    return (major, minor, patch)

def format_version(major: int, minor: int, patch: int) -> str:
    return f"{major}.{minor}.{patch}"
'''

rust = '''
pub fn parse_version(version_str: &str) -> (i32, i32, i32) {
    let parts: Vec<&str> = version_str.split('.').collect();
    let major = parts.get(0).and_then(|s| s.parse().ok()).unwrap_or(0);
    let minor = parts.get(1).and_then(|s| s.parse().ok()).unwrap_or(0);
    let patch = parts.get(2).and_then(|s| s.parse().ok()).unwrap_or(0);
    return (major, minor, patch);
}

pub fn format_version(major: i32, minor: i32, patch: i32) -> String {
    return format!("{}.{}.{}", major, minor, patch);
}
'''

[[test]]
name = "cargo_metadata"
description = "Package metadata"

python = '''
class PackageInfo:
    def __init__(self, name: str, version: str, authors: list[str]):
        self.name = name
        self.version = version
        self.authors = authors
    
    def author_string(self) -> str:
        return ", ".join(self.authors)
'''

rust = '''
pub struct PackageInfo {
    pub name: String,
    pub version: String,
    pub authors: Vec<String>,
}

impl PackageInfo {
    pub fn new(name: String, version: String, authors: Vec<String>) -> Self {
        Self {
            name,
            version,
            authors,
        }
    }

    pub fn author_string(&self) -> String {
        return self.authors.join(", ");
    }
}
'''

# =============================================================================
# Feature Flags
# =============================================================================

[[test]]
name = "feature_flags"
description = "Optional feature flag generation"

python = '''
def is_feature_enabled(features: list[str], feature: str) -> bool:
    return feature in features

def default_features() -> list[str]:
    return ["std"]

def all_features() -> list[str]:
    return ["std", "serde", "async"]
'''

rust = '''
pub fn is_feature_enabled(features: &[String], feature: &str) -> bool {
    return features.iter().any(|f| f == feature);
}

pub fn default_features() -> Vec<String> {
    return vec!["std".to_string()];
}

pub fn all_features() -> Vec<String> {
    return vec!["std".to_string(), "serde".to_string(), "async".to_string()];
}
'''

[[test]]
name = "feature_conditional"
description = "Conditional compilation by feature"

python = '''
def get_implementation(feature: str) -> str:
    if feature == "fast":
        return "optimized"
    elif feature == "debug":
        return "verbose"
    return "default"
'''

rust = '''
pub fn get_implementation(feature: &str) -> String {
    if feature == "fast" {
        return "optimized".to_string();
    } else if feature == "debug" {
        return "verbose".to_string();
    }
    return "default".to_string();
}
'''

[[test]]
name = "feature_dependencies"
description = "Feature-gated dependencies"

python = '''
def get_dependencies(features: list[str]) -> list[str]:
    deps = ["core"]
    if "serde" in features:
        deps.append("serde")
    if "async" in features:
        deps.append("tokio")
    return deps
'''

rust = '''
pub fn get_dependencies(features: &[String]) -> Vec<String> {
    let mut deps = vec!["core".to_string()];
    if features.iter().any(|f| f == "serde") {
        deps.push("serde".to_string());
    }
    if features.iter().any(|f| f == "async") {
        deps.push("tokio".to_string());
    }
    return deps;
}
'''

# =============================================================================
# Workspace Support
# =============================================================================

[[test]]
name = "workspace_support"
description = "Multi-crate workspace generation"

python = '''
def workspace_members() -> list[str]:
    return ["crate-a", "crate-b", "crate-c"]

def is_member(workspace: list[str], name: str) -> bool:
    return name in workspace

def add_member(workspace: list[str], name: str) -> list[str]:
    if name not in workspace:
        workspace.append(name)
    return workspace
'''

rust = '''
pub fn workspace_members() -> Vec<String> {
    return vec![
        "crate-a".to_string(),
        "crate-b".to_string(),
        "crate-c".to_string(),
    ];
}

pub fn is_member(workspace: &[String], name: &str) -> bool {
    return workspace.iter().any(|m| m == name);
}

pub fn add_member(mut workspace: Vec<String>, name: String) -> Vec<String> {
    if !workspace.iter().any(|m| m == &name) {
        workspace.push(name);
    }
    return workspace;
}
'''

[[test]]
name = "workspace_paths"
description = "Workspace path resolution"

python = '''
def resolve_path(workspace_root: str, member: str) -> str:
    return f"{workspace_root}/{member}"

def relative_path(from_crate: str, to_crate: str) -> str:
    return f"../{to_crate}"
'''

rust = '''
pub fn resolve_path(workspace_root: &str, member: &str) -> String {
    return format!("{}/{}", workspace_root, member);
}

pub fn relative_path(_from_crate: &str, to_crate: &str) -> String {
    return format!("../{}", to_crate);
}
'''

