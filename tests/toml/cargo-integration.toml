[[test]]
name = "build_script"
description = "build.rs generation when needed"

python = '''
def needs_build_script(features: list[str]) -> bool:
    return "codegen" in features or "native" in features

def build_script_content() -> str:
    return "fn main() { println!(\"cargo:rerun-if-changed=build.rs\"); }"
'''

rust = '''
pub fn needs_build_script(features: &[String]) -> bool {
    return features.iter().any(|f| f == "codegen" || f == "native");
}

pub fn build_script_content() -> String {
    return "fn main() { println!(\"cargo:rerun-if-changed=build.rs\"); }".to_string();
}
'''

[[test]]
name = "build_env_vars"
description = "Build-time environment variables"

python = '''
def cargo_env(name: str) -> str:
    env_vars = {
        "CARGO_PKG_NAME": "my_crate",
        "CARGO_PKG_VERSION": "1.0.0",
        "CARGO_MANIFEST_DIR": "/path/to/crate"
    }
    return env_vars.get(name, "")
'''

rust = '''
use std::collections::HashMap;

pub fn cargo_env(name: &str) -> String {
    let mut env_vars = HashMap::new();
    env_vars.insert("CARGO_PKG_NAME", "my_crate");
    env_vars.insert("CARGO_PKG_VERSION", "1.0.0");
    env_vars.insert("CARGO_MANIFEST_DIR", "/path/to/crate");
    return env_vars.get(name).unwrap_or(&"").to_string();
}
'''

