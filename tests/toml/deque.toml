# Removing Elements
# =============================================================================

[[test]]
name = "deque_pop"
skip = true
description = "d.pop()"

python = '''
from collections import deque

d = deque([1, 2, 3])
x = d.pop()
result = x == 3 and list(d) == [1, 2]
'''

rust = '''
    // d.pop()
    use std::collections::VecDeque;

    let mut d = VecDeque::from(vec![1, 2, 3]);
    let x = d.pop_back().unwrap();
    let result = x == 3 && d.iter().cloned().collect::<Vec<_>>() == vec![1, 2];
'''


[[test]]
name = "deque_popleft"
skip = true
description = "d.popleft()"

python = '''
from collections import deque

d = deque([1, 2, 3])
x = d.popleft()
result = x == 1 and list(d) == [2, 3]
'''

rust = '''
    // d.popleft()
    use std::collections::VecDeque;

    let mut d = VecDeque::from(vec![1, 2, 3]);
    let x = d.pop_front().unwrap();
    let result = x == 1 && d.iter().cloned().collect::<Vec<_>>() == vec![2, 3];
'''


[[test]]
name = "deque_remove"
skip = true
description = "d.remove(x)"

python = '''
from collections import deque

d = deque([1, 2, 3, 2])
d.remove(2)
result = list(d) == [1, 3, 2]
'''

rust = '''
    // d.remove(x)
    use std::collections::VecDeque;

    let mut d = VecDeque::from(vec![1, 2, 3, 2]);
    if let Some(pos) = d.iter().position(|&x| x == 2) {
        d.remove(pos);
    }
    let result = d.iter().cloned().collect::<Vec<_>>() == vec![1, 3, 2];
'''


