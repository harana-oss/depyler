[[test]]
name = "deque_extendleft"
skip = true
description = "d.extendleft([1, 2, 3]) # reversed"

python = '''
from collections import deque

d = deque([4])
d.extendleft([1, 2, 3])
result = list(d) == [3, 2, 1, 4]
'''

rust = '''
    // d.extendleft([1, 2, 3]) # reversed
    use std::collections::VecDeque;

    let mut d = VecDeque::from(vec![4]);
    for x in vec![1, 2, 3] {
        d.push_front(x);
    }
    let result = d.iter().cloned().collect::<Vec<_>>() == vec![3, 2, 1, 4];
'''


