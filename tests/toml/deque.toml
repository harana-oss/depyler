[[test]]
name = "deque_reverse"
skip = true
description = "d.reverse()"

python = '''
from collections import deque

d = deque([1, 2, 3])
d.reverse()
result = list(d) == [3, 2, 1]
'''

rust = '''
    // d.reverse()
    use std::collections::VecDeque;

    let mut d = VecDeque::from(vec![1, 2, 3]);
    let reversed: VecDeque<_> = d.iter().rev().cloned().collect();
    d = reversed;
    let result = d.iter().cloned().collect::<Vec<_>>() == vec![3, 2, 1];
'''


