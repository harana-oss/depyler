# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "deque_queue"
skip = true
description = "append right, popleft"

python = '''
from collections import deque

queue = deque()
queue.append(1)
queue.append(2)
result = queue.popleft() == 1 and queue.popleft() == 2
'''

rust = '''
    // append right, popleft
    use std::collections::VecDeque;

    let mut queue = VecDeque::new();
    queue.push_back(1);
    queue.push_back(2);
    let result = queue.pop_front().unwrap() == 1 && queue.pop_front().unwrap() == 2;
'''


[[test]]
name = "deque_stack"
skip = true
description = "append right, pop right"

python = '''
from collections import deque

stack = deque()
stack.append(1)
stack.append(2)
result = stack.pop() == 2 and stack.pop() == 1
'''

rust = '''
    // append right, pop right
    use std::collections::VecDeque;

    let mut stack = VecDeque::new();
    stack.push_back(1);
    stack.push_back(2);
    let result = stack.pop_back().unwrap() == 2 && stack.pop_back().unwrap() == 1;
'''


[[test]]
name = "deque_sliding"
skip = true
description = "maxlen for fixed-size window"

python = '''
from collections import deque

window = deque(maxlen=3)
for i in range(5):
    window.append(i)
result = list(window) == [2, 3, 4]
'''

rust = '''
    // maxlen for fixed-size window
    use std::collections::VecDeque;

    let mut window = VecDeque::new();
    let maxlen = 3;
    for i in 0..5 {
        window.push_back(i);
        if window.len() > maxlen {
            window.pop_front();
        }
    }
    let result = window.iter().cloned().collect::<Vec<_>>() == vec![2, 3, 4];
'''


