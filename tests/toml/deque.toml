# =============================================================================
# Maxlen Behavior
# =============================================================================

[[test]]
name = "deque_maxlen_right"
skip = true
description = "append to full deque drops left"

python = '''
from collections import deque

d = deque([1, 2, 3], maxlen=3)
d.append(4)
result = list(d) == [2, 3, 4]
'''

rust = '''
    // append to full deque drops left
    use std::collections::VecDeque;

    let mut d = VecDeque::from(vec![1, 2, 3]);
    let maxlen = 3;
    d.push_back(4);
    while d.len() > maxlen {
        d.pop_front();
    }
    let result = d.iter().cloned().collect::<Vec<_>>() == vec![2, 3, 4];
'''


[[test]]
name = "deque_maxlen_left"
skip = true
description = "appendleft to full drops right"

python = '''
from collections import deque

d = deque([1, 2, 3], maxlen=3)
d.appendleft(0)
result = list(d) == [0, 1, 2]
'''

rust = '''
    // appendleft to full drops right
    use std::collections::VecDeque;

    let mut d = VecDeque::from(vec![1, 2, 3]);
    let maxlen = 3;
    d.push_front(0);
    while d.len() > maxlen {
        d.pop_back();
    }
    let result = d.iter().cloned().collect::<Vec<_>>() == vec![0, 1, 2];
'''


[[test]]
name = "deque_maxlen_prop"
skip = true
description = "d.maxlen"

python = '''
from collections import deque

d1 = deque(maxlen=5)
d2 = deque()
result = d1.maxlen == 5 and d2.maxlen is None
'''

rust = '''
    // d.maxlen
    struct BoundedDeque<T> {
        deque: std::collections::VecDeque<T>,
        maxlen: Option<usize>,
    }

    let d1 = BoundedDeque {
        deque: std::collections::VecDeque::new(),
        maxlen: Some(5),
    };
    let d2 = BoundedDeque {
        deque: std::collections::VecDeque::new(),
        maxlen: None,
    };
    let result = d1.maxlen == Some(5) && d2.maxlen == None;
'''


