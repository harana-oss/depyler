[metadata]
name = "Deque Tests"
category = "data-structures"

# =============================================================================
# Creating Deques
# =============================================================================

[[test]]
name = "deque_empty"
skip = true
description = "deque()"

python = '''
from collections import deque

d = deque()
result = len(d) == 0
'''

rust = '''
    // deque()
    use std::collections::VecDeque;

    let d: VecDeque<i32> = VecDeque::new();
    let result = d.len() == 0;
'''


[[test]]
name = "deque_from_iter"
skip = true
description = "deque([1, 2, 3])"

python = '''
from collections import deque

d = deque([1, 2, 3])
result = list(d) == [1, 2, 3]
'''

rust = '''
    // deque([1, 2, 3])
    use std::collections::VecDeque;

    let d: VecDeque<i32> = VecDeque::from(vec![1, 2, 3]);
    let result = d.iter().cloned().collect::<Vec<_>>() == vec![1, 2, 3];
'''


[[test]]
name = "deque_maxlen"
skip = true
description = "deque(maxlen=3)"

python = '''
from collections import deque

d = deque(maxlen=3)
result = d.maxlen == 3
'''

rust = '''
    // deque(maxlen=3)
    use std::collections::VecDeque;

    struct BoundedDeque<T> {
        deque: VecDeque<T>,
        maxlen: usize,
    }

    let d = BoundedDeque {
        deque: VecDeque::new(),
        maxlen: 3,
    };
    let result = d.maxlen == 3;
'''


