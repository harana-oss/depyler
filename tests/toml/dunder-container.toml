[[test]]
name = "not_in_operator"
skip = true
description = "item not in obj"

python = '''
class Container:
    def __init__(self, items):
        self.items = items
    
    def __contains__(self, item):
        return item in self.items

# item not in obj
container = Container([1, 2, 3, 4, 5])
result = (3 in container) and (6 not in container)
print(f"3 in container: {3 in container}, 6 not in container: {6 not in container}")
print(f"result: {result}")
'''

rust = '''
struct Container {
    items: Vec<i32>,
}

impl Container {
    fn contains(&self, item: i32) -> bool {
        self.items.contains(&item)
    }
}

let container = Container {
    items: vec![1, 2, 3, 4, 5],
};
let result = container.contains(3) && !container.contains(6);
log::info!(
    "3 in container: {}, 6 not in container: {}",
    container.contains(3),
    !container.contains(6)
);
log::info!("result: {}", result);
'''


