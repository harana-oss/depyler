[[test]]
name = "dunder_getitem_negative"
skip = true
description = "obj[-1] for last element"

python = '''
class Number:
    def __init__(self, value):
        self.value = value
    def __neg__(self):
        return Number(-self.value)

n = Number(5)
result = (-n).value
'''

rust = '''
use std::ops::Neg;
struct Number {
    value: i32,
}
impl Neg for Number {
    type Output = Number;
    fn neg(self) -> Number {
        Number { value: -self.value }
    }
}
'''


