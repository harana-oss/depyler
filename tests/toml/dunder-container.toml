# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "getitem_keyerror"
skip = true
description = "Raise KeyError for missing key"

python = '''
class CustomDict:
    def __init__(self):
        self.data = {}
    
    def __getitem__(self, key):
        # Raise KeyError for missing key
        if key not in self.data:
            raise KeyError(f"Key '{key}' not found")
        return self.data[key]
    
    def __setitem__(self, key, value):
        self.data[key] = value

d = CustomDict()
d['exists'] = 42
try:
    value = d['missing']
    result = False
except KeyError:
    result = True
    print("KeyError raised for missing key")
'''

rust = '''
use std::collections::HashMap;

struct CustomDict {
    data: HashMap<String, i32>,
}

impl CustomDict {
    fn new() -> Self {
        CustomDict {
            data: HashMap::new(),
        }
    }

    fn get(&self, key: &str) -> Option<&i32> {
        self.data.get(key)
    }

    fn insert(&mut self, key: String, value: i32) {
        self.data.insert(key, value);
    }
}

fn main() {
    let mut d = CustomDict::new();
    d.insert("exists".to_string(), 42);

    let result = d.get("missing").is_none();
    log::info!("Missing key returns None: {}", result);
}
'''


[[test]]
name = "getitem_indexerror"
skip = true
description = "Raise IndexError for out of range"

python = '''
class CustomList:
    def __init__(self, items):
        self.items = items
    
    def __getitem__(self, index):
        # Raise IndexError for out of range
        if not isinstance(index, int):
            raise TypeError("Index must be an integer")
        if index < 0 or index >= len(self.items):
            raise IndexError("Index out of range")
        return self.items[index]

lst = CustomList([10, 20, 30])
try:
    value = lst[5]
    result = False
except IndexError:
    result = True
    print("IndexError raised for out of range index")
'''

rust = '''
struct CustomList {
    items: Vec<i32>,
}

impl CustomList {
    fn new(items: Vec<i32>) -> Self {
        CustomList { items }
    }

    fn get(&self, index: usize) -> Option<&i32> {
        self.items.get(index)
    }
}

fn main() {
    let lst = CustomList::new(vec![10, 20, 30]);

    let result = lst.get(5).is_none();
    log::info!("Out of range index returns None: {}", result);
}
'''


