[[test]]
name = "new_singleton"
description = "Singleton pattern using __new__"

python = '''
class Singleton:
    _instance = None
    
    def __new__(cls):
        if cls._instance is None:
            cls._instance = super().__new__(cls)
        return cls._instance

def get_singleton() -> Singleton:
    return Singleton()
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Singleton {}
impl Singleton {
    pub fn new() -> Self {
        Self {}
    }
}
pub fn get_singleton() -> Singleton {
    return Singleton::new();
}
'''

[[test]]
name = "new_immutable"
description = "__new__ for subclassing immutable types"

python = '''
class PositiveInt(int):
    def __new__(cls, value: int):
        if value < 0:
            value = 0
        return super().__new__(cls, value)

def create_positive(val: int) -> PositiveInt:
    return PositiveInt(val)
'''

rust = '''
