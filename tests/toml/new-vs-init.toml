[[test]]
name = "new_metaclass"
description = "__new__ in metaclass creates class objects"

python = '''
class Meta(type):
    def __new__(mcs, name, bases, namespace):
        cls = super().__new__(mcs, name, bases, namespace)
        cls.meta_attr = "from_meta"
        return cls

class MyClass(metaclass=Meta):
    pass

def check() -> str:
    return MyClass.meta_attr
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Meta {}
impl Meta {
    pub fn new() -> Self {
        Self {}
    }
}
#[derive(Debug, Clone)]
pub struct MyClass {}
impl MyClass {
    pub fn new() -> Self {
        Self {}
    }
}
pub fn check() -> String {
    return MyClass.meta_attr;
}
'''

