[[test]]
name = "factory_vs_new"
description = "Factory classmethod vs __new__ pattern"

python = '''
class WithFactory:
    def __init__(self, value: int):
        self.value = value
    
    @classmethod
    def from_string(cls, s: str) -> "WithFactory":
        return cls(int(s))

class WithNew:
    def __new__(cls, value):
        if isinstance(value, str):
            value = int(value)
        instance = super().__new__(cls)
        instance.value = value
        return instance

def create_both() -> tuple:
    a = WithFactory.from_string("42")
    b = WithNew("42")
    return (a, b)
'''

[test.assertions]
contains = ["WithFactory", "WithNew", "value"]