}
'''

[[test]]
name = "new_caching"
description = "Caching pattern with __new__"

python = '''
class CachedObject:
    _cache = {}
    
    def __new__(cls, key: str):
        if key not in cls._cache:
            instance = super().__new__(cls)
            cls._cache[key] = instance
        return cls._cache[key]

def get_cached(k: str) -> CachedObject:
    return CachedObject(k)
'''

rust = '''
#[derive(Debug, Clone)]
pub struct CachedObject {}
impl CachedObject {
    pub fn new() -> Self {
        Self {}
    }
}
pub fn get_cached(k: String) -> CachedObject {
    return CachedObject::new(k);
}
'''

[[test]]
name = "new_init_order"
description = "__new__ called before __init__"

python = '''
class Ordered:
    def __new__(cls, value: int):
        print("__new__")
        return super().__new__(cls)
    
    def __init__(self, value: int):
        print("__init__")
        self.value = value

def create() -> Ordered:
    return Ordered(42)
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Ordered {
    pub value: i32,
}
impl Ordered {
    pub fn new(value: i32) -> Self {
        Self { value }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn create() -> Ordered {
    return Ordered::new(42);
}
'''

