[metadata]
name = "__new__ vs __init__ Tests"
category = "advanced-oop"

# =============================================================================
# Basic __init__
# =============================================================================

[[test]]
name = "init_basic"
description = "Basic __init__ with parameter assignment"

python = '''
class Point:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y

def create_point() -> Point:
    return Point(10, 20)
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "x" => Some(Box::new(self.x.clone()) as Box<dyn std::any::Any>),
            "y" => Some(Box::new(self.y.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "x" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.x = v.clone();
                    true
                } else {
                    false
                }
            }
            "y" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.y = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
pub fn create_point() -> Point {
    return Point::new(10, 20);
}
'''

