[metadata]
name = "Ellipsis Tests"
category = "core-language"

# =============================================================================
# Ellipsis as Placeholder
# =============================================================================

[[test]]
name = "ellipsis_function_placeholder"
skip = true
description = "def func(): ..."
python = """
def func():
    ...

# Function exists but does nothing
func()
print("Function with ellipsis works")
"""
rust = """
fn func() {
}

func();
log::info!("Function with ellipsis works");"""

[[test]]
name = "ellipsis_class_placeholder"
skip = true
description = "class Empty: ..."
python = """
class Empty:
    ...

# Class exists but has no members
obj = Empty()
print(f"Empty class works: {type(obj).__name__}")
"""
rust = """
struct Empty;

let _obj = Empty;
log::info!("Empty class works: Empty");"""

[[test]]
name = "ellipsis_abstract"
skip = true
description = "@abstractmethod def method(self): ..."
python = """
from abc import ABC, abstractmethod

class Base(ABC):
    @abstractmethod
    def method(self):
        ...

class Concrete(Base):
    def method(self):
        return "implemented"

obj = Concrete()
print(obj.method())
"""
rust = """
trait Base {
    fn method(&self) -> String;
}

struct Concrete;

impl Base for Concrete {
    fn method(&self) -> String {
        "implemented".to_string()
    }
}

let obj = Concrete;
log::info!("{}", obj.method());"""

[[test]]
name = "ellipsis_vs_pass"
skip = true
description = "Both valid as no-op body"
python = """
def with_pass():
    pass

def with_ellipsis():
    ...

# Both work the same
with_pass()
with_ellipsis()
print("Both pass and ellipsis work")
"""
rust = """
fn with_pass() {
}

fn with_ellipsis() {
}

with_pass();
with_ellipsis();
log::info!("Both pass and ellipsis work");"""

# =============================================================================
# Ellipsis in Type Hints
# =============================================================================

[[test]]
name = "ellipsis_callable"
skip = true
description = "Callable[..., ReturnType]"
python = """
from typing import Callable

def accepts_any_callable(func: Callable[..., int]) -> int:
    return func(1, 2, 3)

def my_func(*args):
    return sum(args)

result = accepts_any_callable(my_func)
print(f"Result: {result}")
"""
rust = """
type AnyCallable = Box<dyn Fn(&[i32]) -> i32>;

fn accepts_any_callable(func: AnyCallable) -> i32 {
    func(&[1, 2, 3])
}

let my_func: AnyCallable = Box::new(|args| args.iter().sum());
let result = accepts_any_callable(my_func);
log::info!("Result: {}", result);"""

[[test]]
name = "ellipsis_tuple"
skip = true
description = "Tuple[int, ...] for variable-length tuple"
python = """
from typing import Tuple

def process_ints(items: Tuple[int, ...]) -> int:
    return sum(items)

result1 = process_ints((1, 2))
result2 = process_ints((1, 2, 3, 4, 5))
print(f"Results: {result1}, {result2}")
"""
rust = """
fn process_ints(items: &[i32]) -> i32 {
    items.iter().sum()
}

let result1 = process_ints(&[1, 2]);
let result2 = process_ints(&[1, 2, 3, 4, 5]);
log::info!("Results: {}, {}", result1, result2);"""

# =============================================================================
# Ellipsis in NumPy-style Slicing
# =============================================================================

[[test]]
name = "ellipsis_slice"
skip = true
description = "arr[..., 0] for multi-dimensional indexing"
python = """
# Simulating multi-dimensional array behavior
class Array:
    def __getitem__(self, key):
        if isinstance(key, tuple) and Ellipsis in key:
            return "Ellipsis slice accessed"
        return "Normal slice"

arr = Array()
result = arr[..., 0]
print(result)
"""
rust = """
struct Array;

impl Array {
    fn get(&self, _key: &str) -> &str {
        "Ellipsis slice accessed"
    }
}

let arr = Array;
let result = arr.get("..., 0");
log::info!("{}", result);"""

[[test]]
name = "ellipsis_expand"
skip = true
description = "arr[0, ...] equivalent to arr[0, :, :, :]"
python = """
class Array:
    def __getitem__(self, key):
        if isinstance(key, tuple):
            if Ellipsis in key:
                return f"Ellipsis at position {key.index(Ellipsis)}"
        return "No ellipsis"

arr = Array()
result = arr[0, ...]
print(result)
"""
rust = """
struct Array;

impl Array {
    fn get(&self, pos: usize) -> String {
        format!("Ellipsis at position {}", pos)
    }
}

let arr = Array;
let result = arr.get(1);
log::info!("{}", result);"""

