"""
rust = """
log::info!("Ellipsis equals itself: true");
log::info!("Ellipsis is itself: true");"""

[[test]]
name = "ellipsis_default_arg"
skip = true
description = "def f(x=...): to distinguish from None"
python = """
def func(x=...):
    if x is ...:
        return "No argument provided"
    elif x is None:
        return "None provided"
    else:
        return f"Value: {x}"

print(func())
print(func(None))
print(func(42))
"""
rust = """
enum Arg {
    NotProvided,
    Null,
    Value(i32),
}

fn func(x: Arg) -> String {
    match x {
        Arg::NotProvided => "No argument provided".to_string(),
        Arg::Null => "None provided".to_string(),
        Arg::Value(v) => format!("Value: {}", v),
    }
}

log::info!("{}", func(Arg::NotProvided));
log::info!("{}", func(Arg::Null));
log::info!("{}", func(Arg::Value(42)));"""
