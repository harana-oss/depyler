[[test]]
name = "exception_group_traceback"
description = "Exception group structure"
python = """
try:
    raise ExceptionGroup("errors", [
        ValueError("error 1"),
        TypeError("error 2"),
    ])
except ExceptionGroup as eg:
    print("ExceptionGroup:", eg.message)
    for i, exc in enumerate(eg.exceptions):
        print(f"  [{i}] {type(exc).__name__}: {exc}")
"""
rust = """
#[derive(Debug)]
enum Error {
    ValueError(String),
    TypeError(String),
}

impl std::fmt::Display for Error {
    fn fmt(&self, f: &mut std::fmt::Formatter) -> std::fmt::Result {
        match self {
            Error::ValueError(msg) => write!(f, "ValueError: {}", msg),
            Error::TypeError(msg) => write!(f, "TypeError: {}", msg),
        }
    }
}

struct ErrorGroup {
    message: String,
    exceptions: Vec<Error>,
}

fn main() {
    let eg = ErrorGroup {
        message: "errors".to_string(),
        exceptions: vec![
            Error::ValueError("error 1".to_string()),
            Error::TypeError("error 2".to_string()),
        ],
    };
    
    log::info!("ExceptionGroup: {}", eg.message);
    for (i, exc) in eg.exceptions.iter().enumerate() {
        log::info!("  [{}] {}", i, exc);
    }
}
"""
expected_output = """ExceptionGroup: errors
  [0] ValueError: error 1
  [1] TypeError: error 2"""
