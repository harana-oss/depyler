[[test]]
name = "exception_group_concurrent"
description = "Collecting errors from multiple tasks"
python = """
def process_item(item):
    if item < 0:
        raise ValueError(f"Negative: {item}")
    if item == 0:
        raise ZeroDivisionError("Cannot be zero")
    return item * 2

items = [-1, 0, 5]
errors = []
for item in items:
    try:
        result = process_item(item)
    except Exception as e:
        errors.append(e)

if errors:
    raise ExceptionGroup("Processing errors", errors)
"""
rust = """
#[derive(Debug)]
enum ProcessError {
    Negative(i32),
    Zero,
}

fn process_item(item: i32) -> Result<i32, ProcessError> {
    if item < 0 {
        Err(ProcessError::Negative(item))
    } else if item == 0 {
        Err(ProcessError::Zero)
    } else {
        Ok(item * 2)
    }
}

fn main() {
    let items = vec![-1, 0, 5];
    let mut errors = Vec::new();
    
    for item in items {
        if let Err(e) = process_item(item) {
            errors.push(e);
        }
    }
    
    if !errors.is_empty() {
        log::info!("Processing errors: {:?}", errors);
    }
}
"""
expected_output = "Processing errors: [Negative(-1), Zero]"

[[test]]
name = "exception_group_validation"
description = "Multiple validation failures"
python = """
def validate_user(data):
    errors = []
    if len(data.get('name', '')) < 3:
        errors.append(ValueError("Name too short"))
    if data.get('age', 0) < 18:
        errors.append(ValueError("Must be 18+"))
    if '@' not in data.get('email', ''):
        errors.append(ValueError("Invalid email"))
    
    if errors:
        raise ExceptionGroup("Validation failed", errors)

try:
    validate_user({'name': 'Al', 'age': 16, 'email': 'invalid'})
except ExceptionGroup as eg:
    print(f"Validation errors: {len(eg.exceptions)}")
"""
rust = """
#[derive(Debug)]
struct ValidationError(String);

fn validate_user(name: &str, age: i32, email: &str) -> Result<(), Vec<ValidationError>> {
    let mut errors = Vec::new();
    
    if name.len() < 3 {
        errors.push(ValidationError("Name too short".to_string()));
    }
    if age < 18 {
        errors.push(ValidationError("Must be 18+".to_string()));
    }
    if !email.contains('@') {
        errors.push(ValidationError("Invalid email".to_string()));
    }
    
    if errors.is_empty() {
        Ok(())
    } else {
        Err(errors)
    }
}

fn main() {
    match validate_user("Al", 16, "invalid") {
        Err(errors) => log::info!("Validation errors: {}", errors.len()),
        Ok(_) => log::info!("Valid"),
    }
}
"""
expected_output = "Validation errors: 3"

[[test]]
name = "exception_group_cleanup"
description = "Multiple cleanup failures"
python = """
class Resource:
    def __init__(self, name, should_fail=False):
        self.name = name
        self.should_fail = should_fail
    
    def close(self):
        if self.should_fail:
            raise RuntimeError(f"Failed to close {self.name}")

resources = [
    Resource("db", True),
    Resource("file", False),
    Resource("socket", True),
]

errors = []
for res in resources:
    try:
        res.close()
    except Exception as e:
        errors.append(e)

if errors:
    print(f"Cleanup errors: {len(errors)}")
"""
rust = """
#[derive(Debug)]
struct CloseError(String);

struct Resource {
    name: String,
    should_fail: bool,
}

impl Resource {
    fn new(name: &str, should_fail: bool) -> Self {
        Resource {
            name: name.to_string(),
            should_fail,
        }
    }
    
    fn close(&self) -> Result<(), CloseError> {
        if self.should_fail {
            Err(CloseError(format!("Failed to close {}", self.name)))
        } else {
            Ok(())
        }
    }
}

fn main() {
    let resources = vec![
        Resource::new("db", true),
        Resource::new("file", false),
        Resource::new("socket", true),
    ];
    
    let mut errors = Vec::new();
    for res in &resources {
        if let Err(e) = res.close() {
            errors.push(e);
        }
    }
    
    if !errors.is_empty() {
        log::info!("Cleanup errors: {}", errors.len());
    }
}
"""
expected_output = "Cleanup errors: 2"

