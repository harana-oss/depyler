[[test]]
name = "base_exception_group"
description = "BaseExceptionGroup for BaseException subclasses"
python = """
# BaseExceptionGroup can contain any BaseException
# ExceptionGroup can only contain Exception subclasses
eg = BaseExceptionGroup("system errors", [
    SystemExit(1),
    KeyboardInterrupt(),
])
print(f"Base group: {len(eg.exceptions)}")
"""
rust = """
// Rust doesn't distinguish BaseException vs Exception
// All errors use Result/panic mechanism

#[derive(Debug)]
enum SystemError {
    Exit(i32),
    Interrupt,
}

struct BaseErrorGroup {
    message: String,
    errors: Vec<SystemError>,
}

fn main() {
    let eg = BaseErrorGroup {
        message: "system errors".to_string(),
        errors: vec![
            SystemError::Exit(1),
            SystemError::Interrupt,
        ],
    };
    log::info!("Base group: {}", eg.errors.len());
}
"""
expected_output = "Base group: 2"

[[test]]
name = "exception_group_derive"
description = "Create derived group with same message"
python = """
original = ExceptionGroup("errors", [
    ValueError("v1"),
    TypeError("t1"),
])

# derive creates new group with same message
derived = original.derive([ValueError("v2")])
print(f"Original message: {original.message}")
print(f"Derived message: {derived.message}")
print(f"Derived count: {len(derived.exceptions)}")
"""
rust = """
#[derive(Debug, Clone)]
enum Error {
    ValueError(String),
    TypeError(String),
}

#[derive(Clone)]
struct ErrorGroup {
    message: String,
    errors: Vec<Error>,
}

impl ErrorGroup {
    fn derive(&self, new_errors: Vec<Error>) -> ErrorGroup {
        ErrorGroup {
            message: self.message.clone(),
            errors: new_errors,
        }
    }
}

fn main() {
    let original = ErrorGroup {
        message: "errors".to_string(),
        errors: vec![
            Error::ValueError("v1".to_string()),
            Error::TypeError("t1".to_string()),
        ],
    };
    
    let derived = original.derive(vec![Error::ValueError("v2".to_string())]);
    log::info!("Original message: {}", original.message);
    log::info!("Derived message: {}", derived.message);
    log::info!("Derived count: {}", derived.errors.len());
}
"""
expected_output = """Original message: errors
Derived message: errors
Derived count: 1"""

