# Exception Groups Tests - Python 3.11+ exception handling
# Rust Mapping: Result composition, error aggregation

[metadata]
name = "Exception Groups Tests"
category = "modern-python"

# =============================================================================
# ExceptionGroup
# =============================================================================

[[test]]
name = "exception_group_create"
description = "Creating an ExceptionGroup"
python = """
errors = [ValueError("val error"), TypeError("type error")]
eg = ExceptionGroup("Multiple errors", errors)
print(f"Message: {eg.message}")
print(f"Count: {len(eg.exceptions)}")
"""
rust = """
// Rust uses Result and custom error types
// This demonstrates error aggregation pattern

#[derive(Debug)]
struct MultiError {
    message: String,
    errors: Vec<String>,
}

impl MultiError {
    fn new(message: &str, errors: Vec<String>) -> Self {
        MultiError {
            message: message.to_string(),
            errors,
        }
    }
}

fn main() {
    let errors = vec![
        "val error".to_string(),
        "type error".to_string(),
    ];
    let eg = MultiError::new("Multiple errors", errors);
    log::info!("Message: {}", eg.message);
    log::info!("Count: {}", eg.errors.len());
}
"""
expected_output = """Message: Multiple errors
Count: 2"""

[[test]]
name = "exception_group_raise"
description = "Raising an ExceptionGroup"
python = """
def validate(values):
    errors = []
    for val in values:
        if val < 0:
            errors.append(ValueError(f"{val} is negative"))
    if errors:
        raise ExceptionGroup("Validation errors", errors)
    return "OK"

try:
    validate([-1, -2])
except ExceptionGroup as eg:
    print(f"Caught: {eg.message}")
    print(f"Errors: {len(eg.exceptions)}")
"""
rust = """
#[derive(Debug)]
struct ValidationError {
    message: String,
    errors: Vec<String>,
}

fn validate(values: &[i32]) -> Result<&'static str, ValidationError> {
    let mut errors = Vec::new();
    for &val in values {
        if val < 0 {
            errors.push(format!("{} is negative", val));
        }
    }
    if !errors.is_empty() {
        return Err(ValidationError {
            message: "Validation errors".to_string(),
            errors,
        });
    }
    Ok("OK")
}

fn main() {
    match validate(&[-1, -2]) {
        Err(eg) => {
            log::info!("Caught: {}", eg.message);
            log::info!("Errors: {}", eg.errors.len());
        }
        Ok(msg) => log::info!("{}", msg),
    }
}
"""
expected_output = """Caught: Validation errors
Errors: 2"""

[[test]]
name = "exception_group_nested"
description = "Nested ExceptionGroup"
python = """
inner_errors = [ValueError("inner1"), ValueError("inner2")]
inner_group = ExceptionGroup("Inner errors", inner_errors)

outer_errors = [TypeError("outer"), inner_group]
outer_group = ExceptionGroup("Outer errors", outer_errors)

print(f"Outer: {len(outer_group.exceptions)}")
print(f"Has nested: {isinstance(outer_group.exceptions[1], ExceptionGroup)}")
"""
rust = """
#[derive(Debug)]
enum ErrorItem {
    Single(String),
    Group(ErrorGroup),
}

#[derive(Debug)]
struct ErrorGroup {
    message: String,
    errors: Vec<ErrorItem>,
}

fn main() {
    let inner_group = ErrorGroup {
        message: "Inner errors".to_string(),
        errors: vec![
            ErrorItem::Single("inner1".to_string()),
            ErrorItem::Single("inner2".to_string()),
        ],
    };
    
    let outer_group = ErrorGroup {
        message: "Outer errors".to_string(),
        errors: vec![
            ErrorItem::Single("outer".to_string()),
            ErrorItem::Group(inner_group),
        ],
    };
    
    log::info!("Outer: {}", outer_group.errors.len());
    log::info!("Has nested: {}", matches!(outer_group.errors[1], ErrorItem::Group(_)));
}
"""
expected_output = """Outer: 2
Has nested: True"""

