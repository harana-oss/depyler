[[test]]
name = "exception_group_partial"
description = "Partial exception handling"
python = """
try:
    try:
        raise ExceptionGroup("errors", [
            ValueError("val"),
            TypeError("type"),
        ])
    except* ValueError:
        print("Handled ValueError")
        # TypeError still propagates
except TypeError:
    print("Caught propagated TypeError")
"""
rust = """
#[derive(Debug)]
enum Error {
    ValueError(String),
    TypeError(String),
}

fn main() {
    let errors = vec![
        Error::ValueError("val".to_string()),
        Error::TypeError("type".to_string()),
    ];
    
    // Handle ValueError
    for err in &errors {
        if matches!(err, Error::ValueError(_)) {
            log::info!("Handled ValueError");
        }
    }
    
    // TypeError propagates
    for err in &errors {
        if matches!(err, Error::TypeError(_)) {
            log::info!("Caught propagated TypeError");
        }
    }
}
"""
expected_output = """Handled ValueError
Caught propagated TypeError"""

[[test]]
name = "exception_group_subgroup"
description = "Extract subgroup of matching exceptions"
python = """
eg = ExceptionGroup("errors", [
    ValueError("v1"),
    TypeError("t1"),
    ValueError("v2"),
])

# Extract only ValueErrors
value_errors = eg.subgroup(ValueError)
if value_errors:
    print(f"ValueErrors: {len(value_errors.exceptions)}")
"""
rust = """
#[derive(Debug, Clone)]
enum Error {
    ValueError(String),
    TypeError(String),
}

struct ErrorGroup {
    message: String,
    errors: Vec<Error>,
}

impl ErrorGroup {
    fn subgroup_value_errors(&self) -> Option<ErrorGroup> {
        let filtered: Vec<Error> = self.errors.iter()
            .filter(|e| matches!(e, Error::ValueError(_)))
            .cloned()
            .collect();
        
        if filtered.is_empty() {
            None
        } else {
            Some(ErrorGroup {
                message: self.message.clone(),
                errors: filtered,
            })
        }
    }
}

fn main() {
    let eg = ErrorGroup {
        message: "errors".to_string(),
        errors: vec![
            Error::ValueError("v1".to_string()),
            Error::TypeError("t1".to_string()),
            Error::ValueError("v2".to_string()),
        ],
    };
    
    if let Some(value_errors) = eg.subgroup_value_errors() {
        log::info!("ValueErrors: {}", value_errors.errors.len());
    }
}
"""
expected_output = "ValueErrors: 2"

[[test]]
name = "exception_group_split"
description = "Split into matching and non-matching"
python = """
eg = ExceptionGroup("errors", [
    ValueError("v1"),
    TypeError("t1"),
    ValueError("v2"),
])

matching, rest = eg.split(ValueError)
print(f"Matching: {len(matching.exceptions) if matching else 0}")
print(f"Rest: {len(rest.exceptions) if rest else 0}")
"""
rust = """
#[derive(Debug, Clone)]
enum Error {
    ValueError(String),
    TypeError(String),
}

struct ErrorGroup {
    errors: Vec<Error>,
}

impl ErrorGroup {
    fn split_value_errors(&self) -> (Option<ErrorGroup>, Option<ErrorGroup>) {
        let matching: Vec<Error> = self.errors.iter()
            .filter(|e| matches!(e, Error::ValueError(_)))
            .cloned()
            .collect();
        
        let rest: Vec<Error> = self.errors.iter()
            .filter(|e| !matches!(e, Error::ValueError(_)))
            .cloned()
            .collect();
        
        let matching_group = if matching.is_empty() {
            None
        } else {
            Some(ErrorGroup { errors: matching })
        };
        
        let rest_group = if rest.is_empty() {
            None
        } else {
            Some(ErrorGroup { errors: rest })
        };
        
        (matching_group, rest_group)
    }
}

fn main() {
    let eg = ErrorGroup {
        errors: vec![
            Error::ValueError("v1".to_string()),
            Error::TypeError("t1".to_string()),
            Error::ValueError("v2".to_string()),
        ],
    };
    
    let (matching, rest) = eg.split_value_errors();
    log::info!("Matching: {}", matching.map_or(0, |g| g.errors.len()));
    log::info!("Rest: {}", rest.map_or(0, |g| g.errors.len()));
}
"""
expected_output = """Matching: 2
Rest: 1"""

