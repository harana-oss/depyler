[[test]]
name = "except_star_basic"
description = "Basic except* usage"
python = """
try:
    raise ExceptionGroup("errors", [
        ValueError("val"),
        TypeError("type"),
    ])
except* ValueError as eg:
    print(f"Caught ValueError group: {len(eg.exceptions)}")
except* TypeError as eg:
    print(f"Caught TypeError group: {len(eg.exceptions)}")
"""
rust = """
// Rust handles this with match on error types
#[derive(Debug)]
enum Error {
    ValueError(String),
    TypeError(String),
}

struct ErrorGroup {
    errors: Vec<Error>,
}

impl ErrorGroup {
    fn filter_value_errors(&self) -> Vec<&Error> {
        self.errors.iter()
            .filter(|e| matches!(e, Error::ValueError(_)))
            .collect()
    }
    
    fn filter_type_errors(&self) -> Vec<&Error> {
        self.errors.iter()
            .filter(|e| matches!(e, Error::TypeError(_)))
            .collect()
    }
}

fn main() {
    let eg = ErrorGroup {
        errors: vec![
            Error::ValueError("val".to_string()),
            Error::TypeError("type".to_string()),
        ],
    };
    
    let value_errs = eg.filter_value_errors();
    if !value_errs.is_empty() {
        log::info!("Caught ValueError group: {}", value_errs.len());
    }
    
    let type_errs = eg.filter_type_errors();
    if !type_errs.is_empty() {
        log::info!("Caught TypeError group: {}", type_errs.len());
    }
}
"""
expected_output = """Caught ValueError group: 1
Caught TypeError group: 1"""

[[test]]
name = "except_star_multiple"
description = "Multiple except* clauses"
python = """
try:
    raise ExceptionGroup("errors", [
        ValueError("v1"),
        ValueError("v2"),
        TypeError("t1"),
    ])
except* ValueError:
    print("Handling ValueErrors")
except* TypeError:
    print("Handling TypeErrors")
"""
rust = """
#[derive(Debug)]
enum Error {
    ValueError(String),
    TypeError(String),
}

struct ErrorGroup {
    errors: Vec<Error>,
}

impl ErrorGroup {
    fn has_value_errors(&self) -> bool {
        self.errors.iter().any(|e| matches!(e, Error::ValueError(_)))
    }
    
    fn has_type_errors(&self) -> bool {
        self.errors.iter().any(|e| matches!(e, Error::TypeError(_)))
    }
}

fn main() {
    let eg = ErrorGroup {
        errors: vec![
            Error::ValueError("v1".to_string()),
            Error::ValueError("v2".to_string()),
            Error::TypeError("t1".to_string()),
        ],
    };
    
    if eg.has_value_errors() {
        log::info!("Handling ValueErrors");
    }
    if eg.has_type_errors() {
        log::info!("Handling TypeErrors");
    }
}
"""
expected_output = """Handling ValueErrors
Handling TypeErrors"""

