[metadata]
name = "Bytes Tests"
category = "data-structures"

# =============================================================================
# Bytes Literals
# =============================================================================

[[test]]
name = "bytes_literal"
skip = true
description = "b'hello'"

python = '''
result = b'hello'
'''

rust = '''
    let result = b"hello";
'''

[[test]]
name = "bytes_escapes"
skip = true
description = "b'\\x00\\xff\\n'"

python = '''
result = b'\x00\xff\n'
'''

rust = '''
    let result = b"\x00\xff\n";
'''

[[test]]
name = "bytes_raw"
skip = true
description = "rb'\\n' vs b'\\n'"

python = '''
raw = rb'\n'
escaped = b'\n'
result = (len(raw), len(escaped))
'''

rust = '''
    let raw = br"\n";
    let escaped = b"\n";
    let result = (raw.len(), escaped.len());
'''

# =============================================================================
# Bytes Constructor
# =============================================================================

[[test]]
name = "bytes_from_int"
skip = true
description = "bytes(10) - zero bytes"

python = '''
result = bytes(10)
length = len(result)
'''

rust = '''
    let result = vec![0u8; 10];
    let length = result.len();
'''

[[test]]
name = "bytes_from_iterable"
skip = true
description = "bytes([65, 66, 67])"

python = '''
result = bytes([65, 66, 67])
'''

rust = '''
    let result: Vec<u8> = vec![65, 66, 67];
'''

[[test]]
name = "bytes_from_string"
skip = true
description = "'hello'.encode('utf-8')"

python = '''
result = 'hello'.encode('utf-8')
'''

rust = '''
    let result = "hello".as_bytes().to_vec();
'''

# =============================================================================
# Bytearray
# =============================================================================

[[test]]
name = "bytearray_mutable"
skip = true
description = "ba = bytearray(b'hi'); ba[0] = 72"

python = '''
ba = bytearray(b'hi')
ba[0] = 72
result = bytes(ba)
'''

rust = '''
    let mut ba = b"hi".to_vec();
    ba[0] = 72;
    let result = ba;
'''

[[test]]
name = "bytearray_methods"
skip = true
description = "append, extend, pop"

python = '''
ba = bytearray(b'ab')
ba.append(99)
ba.extend(b'de')
last = ba.pop()
result = bytes(ba)
'''

rust = '''
    let mut ba = b"ab".to_vec();
    ba.push(99);
    ba.extend_from_slice(b"de");
    let last = ba.pop();
    let result = ba;
'''

[[test]]
name = "bytearray_to_bytes"
skip = true
description = "bytes(ba)"

python = '''
ba = bytearray(b'hello')
result = bytes(ba)
'''

rust = '''
    let ba = b"hello".to_vec();
    let result = ba;
'''

# =============================================================================
# Bytes Methods
# =============================================================================

[[test]]
name = "bytes_find"
skip = true
description = "b'hello'.find(b'l')"

python = '''
result = b'hello'.find(b'l')
'''

rust = '''
    let haystack = b"hello";
    let needle = b"l";
    let result = haystack
        .windows(needle.len())
        .position(|window| window == needle)
        .map(|i| i as i32)
        .unwrap_or(-1);
'''

[[test]]
name = "bytes_split"
skip = true
description = "b'a,b,c'.split(b',')"

python = '''
result = b'a,b,c'.split(b',')
'''

rust = '''
    let result: Vec<Vec<u8>> = b"a,b,c".split(|&b| b == b',').map(|s| s.to_vec()).collect();
'''

[[test]]
name = "bytes_startswith"
skip = true
description = "b'hello'.startswith(b'he')"

python = '''
starts = b'hello'.startswith(b'he')
ends = b'hello'.endswith(b'lo')
result = (starts, ends)
'''

rust = '''
    let data = b"hello";
    let starts = data.starts_with(b"he");
    let ends = data.ends_with(b"lo");
    let result = (starts, ends);
'''

[[test]]
name = "bytes_replace"
skip = true
description = "b'hello'.replace(b'l', b'L')"

python = '''
result = b'hello'.replace(b'l', b'L')
'''

rust = '''
    let result = b"hello"
        .iter()
        .map(|&b| if b == b'l' { b'L' } else { b })
        .collect::<Vec<u8>>();
'''

[[test]]
name = "bytes_case"
skip = true
description = "b'Hello'.lower()"

python = '''
lower = b'Hello'.lower()
upper = b'hello'.upper()
result = (lower, upper)
'''

rust = '''
    let lower = b"Hello".to_ascii_lowercase();
    let upper = b"hello".to_ascii_uppercase();
    let result = (lower, upper);
'''

# =============================================================================
# Encoding/Decoding
# =============================================================================

[[test]]
name = "bytes_decode"
skip = true
description = "b'hello'.decode('utf-8')"

python = '''
result = b'hello'.decode('utf-8')
'''

rust = '''
    let result = String::from_utf8(b"hello".to_vec()).unwrap();
'''

[[test]]
name = "bytes_encode"
skip = true
description = "'hello'.encode('utf-8')"

python = '''
result = 'hello'.encode('utf-8')
'''

rust = '''
    let result = "hello".as_bytes().to_vec();
'''

[[test]]
name = "bytes_encoding_errors"
skip = true
description = "errors='ignore', 'replace', 'strict'"

python = '''
# Invalid UTF-8 sequence
invalid = b'\xff\xfe'
result_ignore = invalid.decode('utf-8', errors='ignore')
result_replace = invalid.decode('utf-8', errors='replace')
'''

rust = '''
    // Rust handles encoding errors with Result types
    let invalid = vec![0xff, 0xfe];
    let result_ignore = String::from_utf8_lossy(&invalid);
'''

# =============================================================================
# Bytes Operations
# =============================================================================

[[test]]
name = "bytes_concat"
skip = true
description = "b'a' + b'b'"

python = '''
result = b'a' + b'b'
'''

rust = '''
    let mut result = b"a".to_vec();
    result.extend_from_slice(b"b");
'''

[[test]]
name = "bytes_repeat"
skip = true
description = "b'ab' * 3"

python = '''
result = b'ab' * 3
'''

rust = '''
    let result = b"ab".repeat(3);
'''

[[test]]
name = "bytes_contains"
skip = true
description = "b'l' in b'hello'"

python = '''
result = b'l' in b'hello'
'''

rust = '''
    let result = b"hello".contains(&b'l');
'''

[[test]]
name = "bytes_index"
skip = true
description = "b'hello'[0] returns int"

python = '''
result = b'hello'[0]
is_int = isinstance(result, int)
'''

rust = '''
    let result = b"hello"[0];
    let is_int = true; // result is u8
'''

[[test]]
name = "bytes_slice"
skip = true
description = "b'hello'[1:3]"

python = '''
result = b'hello'[1:3]
'''

rust = '''
    let result = &b"hello"[1..3];
'''

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "bytes_empty"
skip = true
description = "b'' and bytes()"

python = '''
empty1 = b''
empty2 = bytes()
result = (len(empty1), len(empty2))
'''

rust = '''
    let empty1 = b"";
    let empty2: Vec<u8> = Vec::new();
    let result = (empty1.len(), empty2.len());
'''

[[test]]
name = "bytes_vs_str"
skip = true
description = "Different types, comparison"

python = '''
b = b'hello'
s = 'hello'
are_equal = (b.decode() == s)
result = are_equal
'''

rust = '''
    let b = b"hello";
    let s = "hello";
    let are_equal = b == s.as_bytes();
    let result = are_equal;
'''

[[test]]
name = "bytes_hex"
skip = true
description = "b'\\xde\\xad'.hex() and bytes.fromhex('dead')"

python = '''
data = b'\xde\xad'
hex_str = data.hex()
from_hex = bytes.fromhex('dead')
result = (hex_str, from_hex)
'''

rust = '''
    let data = b"\xde\xad";
    let hex_str = hex::encode(data);
    let from_hex = hex::decode("dead").unwrap();
    let result = (hex_str, from_hex);
'''
