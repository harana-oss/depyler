        if self.index < self.items.len() {
            let result = self.items[self.index];
            self.index += 1;
            Some(result)
        } else {
            None
        }
    }
}

fn main() {
    let mut it = MyIterator::new(vec![1, 2]);
    println!("{}", it.next().unwrap_or(-1));
    println!("{}", it.next().unwrap_or(-1));
