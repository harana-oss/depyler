[[test]]
name = "custom_iterator"
description = "Complete iterator implementation"
python = """
class Countdown:
    def __init__(self, start):
        self.current = start
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.current <= 0:
            raise StopIteration
        self.current -= 1
        return self.current + 1

for i in Countdown(3):
    print(i)
"""
rust = """
struct Countdown {
    current: i32,
}

impl Countdown {
    fn new(start: i32) -> Self {
        Countdown { current: start }
    }
}

impl Iterator for Countdown {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.current <= 0 {
            None
        } else {
            let result = self.current;
            self.current -= 1;
            Some(result)
        }
    }
}

fn main() {
    for i in Countdown::new(3) {
        println!("{}", i);
    }
}
"""
expected_output = """3
2
1"""

[[test]]
name = "iterator_state"
description = "Iterator maintains position"
python = """
class PositionIterator:
    def __init__(self, items):
        self.items = items
        self.position = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.position >= len(self.items):
            raise StopIteration
        result = self.items[self.position]
        self.position += 1
        return result

it = PositionIterator(['a', 'b', 'c'])
print(next(it))
print(f"Position: {it.position}")
print(next(it))
print(f"Position: {it.position}")
"""
rust = """
struct PositionIterator {
    items: Vec<char>,
    position: usize,
}

impl PositionIterator {
    fn new(items: Vec<char>) -> Self {
        PositionIterator { items, position: 0 }
    }
}

impl Iterator for PositionIterator {
    type Item = char;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.position >= self.items.len() {
            None
        } else {
            let result = self.items[self.position];
            self.position += 1;
            Some(result)
        }
    }
}

fn main() {
    let mut it = PositionIterator::new(vec!['a', 'b', 'c']);
    println!("{}", it.next().unwrap());
    println!("Position: {}", it.position);
    println!("{}", it.next().unwrap());
    println!("Position: {}", it.position);
}
"""
expected_output = """a
Position: 1
b
Position: 2"""

[[test]]
name = "iterator_exhausted"
description = "Iterator raises StopIteration when exhausted"
python = """
class TwoIterator:
    def __init__(self):
        self.count = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.count < 2:
            self.count += 1
            return self.count
        raise StopIteration

it = TwoIterator()
print(next(it))
print(next(it))
try:
    print(next(it))
except StopIteration:
    print("Exhausted")
"""
rust = """
struct TwoIterator {
    count: i32,
}

impl TwoIterator {
    fn new() -> Self {
        TwoIterator { count: 0 }
    }
}

impl Iterator for TwoIterator {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.count < 2 {
            self.count += 1;
            Some(self.count)
        } else {
            None
        }
    }
}

fn main() {
    let mut it = TwoIterator::new();
    println!("{}", it.next().unwrap());
    println!("{}", it.next().unwrap());
    match it.next() {
        Some(val) => println!("{}", val),
        None => println!("Exhausted"),
    }
}
"""
expected_output = """1
2
Exhausted"""

[[test]]
name = "multiple_iterations"
description = "Iterable can be iterated multiple times"
python = """
class ReusableIterable:
    def __init__(self, items):
        self.items = items
    
    def __iter__(self):
        return iter(self.items)

iterable = ReusableIterable([1, 2, 3])
print("First iteration:")
for item in iterable:
    print(item)
print("Second iteration:")
for item in iterable:
    print(item)
