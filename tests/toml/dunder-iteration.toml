[[test]]
name = "range_iterator"
description = "Custom range implementation"
python = """
class MyRange:
    def __init__(self, start, end, step=1):
        self.start = start
        self.end = end
        self.step = step
    
    def __iter__(self):
        current = self.start
        while current < self.end:
            yield current
            current += self.step

for i in MyRange(0, 6, 2):
    print(i)
"""
rust = """
struct MyRange {
    current: i32,
    end: i32,
    step: i32,
}

impl MyRange {
    fn new(start: i32, end: i32, step: i32) -> Self {
        MyRange {
            current: start,
            end,
            step,
        }
    }
}

impl Iterator for MyRange {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.current < self.end {
            let result = self.current;
            self.current += self.step;
            Some(result)
        } else {
            None
        }
    }
}

fn main() {
    for i in MyRange::new(0, 6, 2) {
        println!("{}", i);
    }
}
"""
expected_output = """0
2
4"""

