# Dunder Iteration Tests - Iteration magic methods
# Rust Mapping: Iterator, IntoIterator traits

[metadata]
name = "Dunder Iteration Tests"
category = "dunder-methods"

# =============================================================================
# __iter__
# =============================================================================

[[test]]
name = "dunder_iter_self"
description = "Iterator returning self"
python = """
class Counter:
    def __init__(self, max_val):
        self.max_val = max_val
        self.current = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.current < self.max_val:
            self.current += 1
            return self.current
        raise StopIteration

counter = Counter(3)
for i in counter:
    print(i)
"""
rust = """
struct Counter {
    max_val: i32,
    current: i32,
}

impl Counter {
    fn new(max_val: i32) -> Self {
        Counter { max_val, current: 0 }
    }
}

impl Iterator for Counter {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.current < self.max_val {
            self.current += 1;
            Some(self.current)
        } else {
            None
        }
    }
}

fn main() {
    let counter = Counter::new(3);
    for i in counter {
        println!("{}", i);
    }
}
"""
expected_output = """1
2
3"""

