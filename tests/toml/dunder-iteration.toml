[[test]]
name = "for_loop"
description = "For loop uses iterator protocol"
python = """
class CustomRange:
    def __init__(self, end):
        self.end = end
    
    def __iter__(self):
        return RangeIterator(self.end)

class RangeIterator:
    def __init__(self, end):
        self.end = end
        self.current = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.current < self.end:
            result = self.current
            self.current += 1
            return result
        raise StopIteration

for i in CustomRange(3):
    print(i)
"""
rust = """
struct CustomRange {
    end: i32,
}

impl CustomRange {
    fn new(end: i32) -> Self {
        CustomRange { end }
    }
}

struct RangeIterator {
    end: i32,
    current: i32,
}

impl RangeIterator {
    fn new(end: i32) -> Self {
        RangeIterator { end, current: 0 }
    }
}

impl Iterator for RangeIterator {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.current < self.end {
            let result = self.current;
            self.current += 1;
            Some(result)
        } else {
            None
        }
    }
}

impl IntoIterator for CustomRange {
    type Item = i32;
    type IntoIter = RangeIterator;
    
    fn into_iter(self) -> Self::IntoIter {
        RangeIterator::new(self.end)
    }
}

fn main() {
    for i in CustomRange::new(3) {
        println!("{}", i);
    }
}
"""
expected_output = """0
1
2"""

[[test]]
