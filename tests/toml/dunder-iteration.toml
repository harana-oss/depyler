[[test]]
name = "dunder_next"
description = "Iterator protocol with __next__"
python = """
class SimpleIterator:
    def __init__(self, data):
        self.data = data
        self.index = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.index < len(self.data):
            result = self.data[self.index]
            self.index += 1
            return result
        raise StopIteration

it = SimpleIterator([10, 20, 30])
print(next(it))
print(next(it))
print(next(it))
"""
rust = """
struct SimpleIterator {
    data: Vec<i32>,
    index: usize,
}

impl SimpleIterator {
    fn new(data: Vec<i32>) -> Self {
        SimpleIterator { data, index: 0 }
    }
}

impl Iterator for SimpleIterator {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.index < self.data.len() {
            let result = self.data[self.index];
            self.index += 1;
            Some(result)
        } else {
            None
        }
    }
}

fn main() {
    let mut it = SimpleIterator::new(vec![10, 20, 30]);
    println!("{}", it.next().unwrap());
    println!("{}", it.next().unwrap());
    println!("{}", it.next().unwrap());
}
"""
expected_output = """10
20
30"""

[[test]]
name = "stop_iteration"
description = "StopIteration signals end of iteration"
python = """
class ThreeIterator:
    def __init__(self):
        self.count = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.count < 3:
            self.count += 1
            return self.count
        raise StopIteration

it = ThreeIterator()
try:
    while True:
        print(next(it))
except StopIteration:
    print("Done")
"""
rust = """
struct ThreeIterator {
    count: i32,
}

impl ThreeIterator {
    fn new() -> Self {
        ThreeIterator { count: 0 }
    }
}

impl Iterator for ThreeIterator {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.count < 3 {
            self.count += 1;
            Some(self.count)
        } else {
            None
        }
    }
}

fn main() {
    let mut it = ThreeIterator::new();
    while let Some(val) = it.next() {
        println!("{}", val);
    }
    println!("Done");
}
"""
expected_output = """1
2
3
Done"""

