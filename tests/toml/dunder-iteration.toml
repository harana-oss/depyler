rust = """
struct ReusableIterable {
    items: Vec<i32>,
}

impl ReusableIterable {
    fn new(items: Vec<i32>) -> Self {
        ReusableIterable { items }
    }
}

impl<'a> IntoIterator for &'a ReusableIterable {
    type Item = &'a i32;
    type IntoIter = std::slice::Iter<'a, i32>;
    
    fn into_iter(self) -> Self::IntoIter {
        self.items.iter()
    }
}

fn main() {
    let iterable = ReusableIterable::new(vec![1, 2, 3]);
    println!("First iteration:");
    for item in &iterable {
