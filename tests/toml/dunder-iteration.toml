[[test]]
name = "infinite_iterator"
description = "Iterator that never stops"
python = """
class Repeater:
    def __init__(self, value):
        self.value = value
    
    def __iter__(self):
        return self
    
    def __next__(self):
        return self.value

repeater = Repeater(42)
for i, val in enumerate(repeater):
    print(val)
    if i >= 2:
        break
"""
rust = """
struct Repeater {
    value: i32,
}

impl Repeater {
    fn new(value: i32) -> Self {
        Repeater { value }
    }
}

impl Iterator for Repeater {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        Some(self.value)
    }
}

fn main() {
    let repeater = Repeater::new(42);
    for (i, val) in repeater.enumerate() {
        println!("{}", val);
        if i >= 2 {
            break;
        }
    }
}
"""
