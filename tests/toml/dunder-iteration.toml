[[test]]
name = "iterator_not_reusable"
description = "Iterator exhausted after one pass"
python = """
class OneTimeIterator:
    def __init__(self, items):
        self.items = items
        self.index = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.index < len(self.items):
            result = self.items[self.index]
            self.index += 1
            return result
        raise StopIteration

it = OneTimeIterator([1, 2, 3])
print("First pass:")
for item in it:
    print(item)
print("Second pass:")
for item in it:
    print(item)
print("Done")
"""
rust = """
struct OneTimeIterator {
    items: Vec<i32>,
    index: usize,
}

impl OneTimeIterator {
    fn new(items: Vec<i32>) -> Self {
        OneTimeIterator { items, index: 0 }
    }
}

impl Iterator for OneTimeIterator {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.index < self.items.len() {
            let result = self.items[self.index];
            self.index += 1;
            Some(result)
        } else {
            None
        }
    }
}

fn main() {
    let mut it = OneTimeIterator::new(vec![1, 2, 3]);
    println!("First pass:");
    for item in &mut it {
        println!("{}", item);
    }
    println!("Second pass:");
    for item in &mut it {
        println!("{}", item);
    }
    println!("Done");
}
"""
expected_output = """First pass:
1
2
3
Second pass:
Done"""

[[test]]
name = "iter_sentinel"
description = "iter() with sentinel value"
python = """
class Counter:
    def __init__(self):
        self.count = 0
    
    def __call__(self):
        self.count += 1
        return self.count

counter = Counter()
# Stop when counter returns 3
for val in iter(counter, 3):
    print(val)
"""
rust = """
struct Counter {
    count: i32,
}

impl Counter {
    fn new() -> Self {
        Counter { count: 0 }
    }
    
    fn next(&mut self) -> i32 {
        self.count += 1;
        self.count
    }
}

fn main() {
    let mut counter = Counter::new();
    loop {
        let val = counter.next();
        if val == 3 {
            break;
        }
        println!("{}", val);
    }
}
"""
expected_output = """1
2"""

[[test]]
name = "length_hint"
description = "Optional __length_hint__ for optimization"
python = """
class HintedIterator:
    def __init__(self, items):
        self.items = items
        self.index = 0
    
    def __iter__(self):
        return self
    
    def __next__(self):
        if self.index < len(self.items):
            result = self.items[self.index]
            self.index += 1
            return result
        raise StopIteration
    
    def __length_hint__(self):
        return len(self.items) - self.index

it = HintedIterator([1, 2, 3, 4, 5])
print(f"Length hint: {it.__length_hint__()}")
print(next(it))
print(next(it))
print(f"Length hint: {it.__length_hint__()}")
"""
rust = """
struct HintedIterator {
    items: Vec<i32>,
    index: usize,
}

impl HintedIterator {
    fn new(items: Vec<i32>) -> Self {
        HintedIterator { items, index: 0 }
    }
    
    fn length_hint(&self) -> usize {
        self.items.len() - self.index
    }
}

impl Iterator for HintedIterator {
    type Item = i32;
    
    fn next(&mut self) -> Option<Self::Item> {
        if self.index < self.items.len() {
            let result = self.items[self.index];
            self.index += 1;
            Some(result)
        } else {
            None
        }
    }
    
    fn size_hint(&self) -> (usize, Option<usize>) {
        let remaining = self.items.len() - self.index;
        (remaining, Some(remaining))
    }
}

fn main() {
    let mut it = HintedIterator::new(vec![1, 2, 3, 4, 5]);
    println!("Length hint: {}", it.length_hint());
    println!("{}", it.next().unwrap());
    println!("{}", it.next().unwrap());
    println!("Length hint: {}", it.length_hint());
}
"""
expected_output = """Length hint: 5
1
2
Length hint: 3"""
