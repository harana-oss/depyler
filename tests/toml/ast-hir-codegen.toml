[[test]]
name = "hir_control_flow_if"
description = "HIR control flow representation"

python = '''
def conditional(x: int) -> int:
    if x > 0:
        return 1
    else:
        return -1
'''

rust = '''
pub fn conditional(x: i32) -> i32 {
    let _cse_temp_0 = x > 0;
    if _cse_temp_0 {
        return 1;
    } else {
        return -1;
    }
}
'''

[[test]]
name = "hir_loop_for"
description = "HIR for loop representation"

python = '''
def sum_list(nums: list[int]) -> int:
    total = 0
    for n in nums:
        total += n
    return total
'''

rust = '''
pub fn sum_list(nums: &Vec<i32>) -> i32 {
    let mut total = 0;
    for n in nums.iter().cloned() {
        total = total + n;
    }
    return total;
}
'''

[[test]]
name = "hir_loop_while"
description = "HIR while loop representation"

python = '''
def countdown(n: int) -> int:
    while n > 0:
        n -= 1
    return n
'''

rust = '''
pub fn countdown(mut n: i32) -> i32 {
    while n > 0 {
        n = n - 1;
    }
    return n;
}
'''

