[[test]]
name = "codegen_struct_definition"
description = "Struct definition code generation"

python = '''
class Point:
    def __init__(self, x: int, y: int):
        self.x = x
        self.y = y
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Point {
    pub x: i32,
    pub y: i32,
}
impl Point {
    pub fn new(x: i32, y: i32) -> Self {
        Self { x, y }
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "x" => Some(Box::new(self.x.clone()) as Box<dyn std::any::Any>),
            "y" => Some(Box::new(self.y.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "x" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.x = v.clone();
                    true
                } else {
                    false
                }
            }
            "y" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.y = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
'''

[[test]]
name = "codegen_impl_block"
description = "Impl block code generation"

python = '''
class Counter:
    def __init__(self):
        self.value = 0
    
    def increment(self) -> int:
        self.value += 1
        return self.value
'''

rust = '''
#[derive(Debug, Clone)]
pub struct Counter {
    pub value: i32,
}
impl Counter {
    pub fn new() -> Self {
        Self { value: 0 }
    }
    pub fn increment(&mut self) -> i32 {
        self.value = format!("{}{}", self.value, 1);
        return self.value.clone();
    }
    pub fn _get_field(&self, name: &str) -> Option<Box<dyn std::any::Any>> {
        match name {
            "value" => Some(Box::new(self.value.clone()) as Box<dyn std::any::Any>),
            _ => None,
        }
    }
    pub fn _set_field(&mut self, name: &str, value: &dyn std::any::Any) -> bool {
        match name {
            "value" => {
                if let Some(v) = value.downcast_ref::<i32>() {
                    self.value = v.clone();
                    true
                } else {
                    false
                }
            }
            _ => false,
        }
    }
}
'''

