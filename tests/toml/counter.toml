# =============================================================================
# Use Cases
# =============================================================================

[[test]]
name = "counter_words"
skip = true
description = "Counter(text.split())"
python = """
from collections import Counter
text = "the quick brown fox jumps over the lazy dog"
c = Counter(text.split())
print(c['the'])
"""
rust = """
use std::collections::HashMap;
let text = "the quick brown fox jumps over the lazy dog";
let mut c: HashMap<&str, usize> = HashMap::new();
for word in text.split_whitespace() {
    *c.entry(word).or_insert(0) += 1;
}
log::info!("{}", c.get("the").unwrap_or(&0));"""

[[test]]
name = "counter_histogram"
skip = true
description = "Count occurrences in data"
python = """
from collections import Counter
data = [1, 2, 2, 3, 3, 3]
c = Counter(data)
print(c[3])
"""
rust = """
use std::collections::HashMap;
let data = vec![1, 2, 2, 3, 3, 3];
let mut c: HashMap<i32, usize> = HashMap::new();
for x in data {
    *c.entry(x).or_insert(0) += 1;
}
log::info!("{}", c.get(&3).unwrap_or(&0));"""

# =============================================================================
# Edge Cases
# =============================================================================

[[test]]
name = "counter_negative_counts"
skip = true
description = "Counter({'a': -1})"
python = """
from collections import Counter
c = Counter({'a': -1, 'b': 0, 'c': 1})
print(dict(sorted(c.items())))
"""
rust = """
use std::collections::HashMap;
let c: HashMap<char, i32> = [('a', -1), ('b', 0), ('c', 1)].iter().cloned().collect();
let mut items: Vec<_> = c.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

[[test]]
name = "counter_zero"
skip = true
description = "Zero counts kept in counter"
python = """
from collections import Counter
c = Counter(a=1)
c['a'] = 0
print('a' in c, c['a'])
"""
rust = """
use std::collections::HashMap;
let mut c: HashMap<char, i32> = [('a', 1)].iter().cloned().collect();
c.insert('a', 0);
log::info!("{} {}", c.contains_key(&'a'), c.get(&'a').unwrap_or(&0));"""

[[test]]
name = "counter_equality"
skip = true
description = "Counter comparison"
python = """
from collections import Counter
c1 = Counter(a=1, b=2)
c2 = Counter(b=2, a=1)
print(c1 == c2)
"""
rust = """
use std::collections::HashMap;
let c1: HashMap<char, i32> = [('a', 1), ('b', 2)].iter().cloned().collect();
let c2: HashMap<char, i32> = [('b', 2), ('a', 1)].iter().cloned().collect();
log::info!("{}", c1 == c2);"""
