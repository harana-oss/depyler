log::info!("{}", c.get(&'a').unwrap_or(&0));"""

[[test]]
name = "counter_update_counter"
skip = true
description = "c.update(other_counter)"
python = """
from collections import Counter
c1 = Counter('abc')
c2 = Counter('aaa')
c1.update(c2)
print(c1['a'])
"""
rust = """
use std::collections::HashMap;
let mut c1: HashMap<char, usize> = HashMap::new();
for ch in "abc".chars() {
    *c1.entry(ch).or_insert(0) += 1;
}
let mut c2: HashMap<char, usize> = HashMap::new();
for ch in "aaa".chars() {
    *c2.entry(ch).or_insert(0) += 1;
}
for (k, v) in c2 {
    *c1.entry(k).or_insert(0) += v;
}
log::info!("{}", c1.get(&'a').unwrap_or(&0));"""

# =============================================================================
# Most Common
# =============================================================================

[[test]]
name = "counter_most_common"
skip = true
description = "c.most_common()"
python = """
from collections import Counter
c = Counter('abracadabra')
print(c.most_common())
"""
rust = """
use std::collections::HashMap;
let mut c: HashMap<char, usize> = HashMap::new();
for ch in "abracadabra".chars() {
    *c.entry(ch).or_insert(0) += 1;
}
let mut items: Vec<_> = c.iter().collect();
items.sort_by(|a, b| b.1.cmp(a.1).then(a.0.cmp(b.0)));
log::info!("{:?}", items);"""

[[test]]
name = "counter_most_common_n"
skip = true
description = "c.most_common(3)"
python = """
from collections import Counter
c = Counter('abracadabra')
print(c.most_common(3))
"""
rust = """
use std::collections::HashMap;
let mut c: HashMap<char, usize> = HashMap::new();
for ch in "abracadabra".chars() {
    *c.entry(ch).or_insert(0) += 1;
}
let mut items: Vec<_> = c.iter().collect();
items.sort_by(|a, b| b.1.cmp(a.1));
log::info!("{:?}", &items[..3.min(items.len())]);"""

[[test]]
name = "counter_least_common"
skip = true
description = "c.most_common()[:-n-1:-1]"
python = """
from collections import Counter
c = Counter('abracadabra')
print(c.most_common()[-2:])
"""
rust = """
use std::collections::HashMap;
let mut c: HashMap<char, usize> = HashMap::new();
for ch in "abracadabra".chars() {
    *c.entry(ch).or_insert(0) += 1;
}
let mut items: Vec<_> = c.iter().collect();
items.sort_by(|a, b| a.1.cmp(b.1));
log::info!("{:?}", &items[..2.min(items.len())]);"""

# =============================================================================
# Arithmetic Operations
# =============================================================================

[[test]]
name = "counter_add"
skip = true
description = "c1 + c2"
python = """
from collections import Counter
c1 = Counter(a=3, b=1)
c2 = Counter(a=1, b=2)
print(dict(sorted((c1 + c2).items())))
"""
rust = """
use std::collections::HashMap;
let mut c1: HashMap<char, i32> = [('a', 3), ('b', 1)].iter().cloned().collect();
let c2: HashMap<char, i32> = [('a', 1), ('b', 2)].iter().cloned().collect();
for (k, v) in c2 {
    *c1.entry(k).or_insert(0) += v;
}
let mut items: Vec<_> = c1.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

[[test]]
name = "counter_sub"
skip = true
description = "c1 - c2"
python = """
from collections import Counter
c1 = Counter(a=4, b=2)
c2 = Counter(a=1, b=2)
print(dict(sorted((c1 - c2).items())))
"""
rust = """
use std::collections::HashMap;
let mut c1: HashMap<char, i32> = [('a', 4), ('b', 2)].iter().cloned().collect();
let c2: HashMap<char, i32> = [('a', 1), ('b', 2)].iter().cloned().collect();
for (k, v) in c2 {
    if let Some(count) = c1.get_mut(&k) {
        *count = (*count - v).max(0);
        if *count == 0 {
            c1.remove(&k);
        }
    }
}
let mut items: Vec<_> = c1.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

[[test]]
name = "counter_and"
skip = true
description = "c1 & c2"
python = """
from collections import Counter
c1 = Counter(a=3, b=1)
c2 = Counter(a=1, b=2)
print(dict(sorted((c1 & c2).items())))
"""
rust = """
use std::collections::HashMap;
let c1: HashMap<char, i32> = [('a', 3), ('b', 1)].iter().cloned().collect();
let c2: HashMap<char, i32> = [('a', 1), ('b', 2)].iter().cloned().collect();
let mut result: HashMap<char, i32> = HashMap::new();
for (k, v1) in &c1 {
    if let Some(v2) = c2.get(k) {
        result.insert(*k, *v1.min(v2));
    }
}
let mut items: Vec<_> = result.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

[[test]]
name = "counter_or"
skip = true
description = "c1 | c2"
python = """
from collections import Counter
c1 = Counter(a=3, b=1)
c2 = Counter(a=1, b=2)
print(dict(sorted((c1 | c2).items())))
"""
rust = """
use std::collections::HashMap;
let c1: HashMap<char, i32> = [('a', 3), ('b', 1)].iter().cloned().collect();
let c2: HashMap<char, i32> = [('a', 1), ('b', 2)].iter().cloned().collect();
let mut result = c1.clone();
for (k, v2) in c2 {
    result
        .entry(k)
        .and_modify(|v1| *v1 = (*v1).max(v2))
        .or_insert(v2);
}
let mut items: Vec<_> = result.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

# =============================================================================
# Unary Operations
# =============================================================================

[[test]]
name = "counter_positive"
skip = true
description = "+c removes zero/negative"
python = """
from collections import Counter
c = Counter(a=2, b=0, c=-1)
result = +c
print(dict(sorted(result.items())))
"""
rust = """
use std::collections::HashMap;
let c: HashMap<char, i32> = [('a', 2), ('b', 0), ('c', -1)].iter().cloned().collect();
let result: HashMap<char, i32> = c.into_iter().filter(|(_, v)| *v > 0).collect();
let mut items: Vec<_> = result.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

[[test]]
name = "counter_negative"
skip = true
description = "-c negates counts"
python = """
from collections import Counter
c = Counter(a=2, b=1)
result = -c
print(dict(sorted(result.items())))
"""
rust = """
use std::collections::HashMap;
let c: HashMap<char, i32> = [('a', 2), ('b', 1)].iter().cloned().collect();
let result: HashMap<char, i32> = c.into_iter().map(|(k, v)| (k, -v)).collect();
let mut items: Vec<_> = result.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

# =============================================================================
# Methods
# =============================================================================

[[test]]
name = "counter_elements"
skip = true
description = "list(c.elements())"
python = """
from collections import Counter
c = Counter(a=2, b=1)
print(sorted(c.elements()))
"""
rust = """
use std::collections::HashMap;
let c: HashMap<char, usize> = [('a', 2), ('b', 1)].iter().cloned().collect();
let mut elements: Vec<char> = c.iter().flat_map(|(k, v)| vec![*k; *v]).collect();
elements.sort();
log::info!("{:?}", elements);"""

[[test]]
name = "counter_subtract"
skip = true
description = "c.subtract(other)"
python = """
from collections import Counter
c = Counter(a=4, b=2)
c.subtract(Counter(a=1, b=2, c=3))
print(dict(sorted(c.items())))
"""
rust = """
use std::collections::HashMap;
let mut c: HashMap<char, i32> = [('a', 4), ('b', 2)].iter().cloned().collect();
let other: HashMap<char, i32> = [('a', 1), ('b', 2), ('c', 3)].iter().cloned().collect();
for (k, v) in other {
    *c.entry(k).or_insert(0) -= v;
}
let mut items: Vec<_> = c.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

[[test]]
name = "counter_total"
skip = true
description = "c.total()"
python = """
from collections import Counter
c = Counter(a=2, b=3, c=1)
print(sum(c.values()))
"""
rust = """
use std::collections::HashMap;
let c: HashMap<char, i32> = [('a', 2), ('b', 3), ('c', 1)].iter().cloned().collect();
let total: i32 = c.values().sum();
log::info!("{}", total);"""

# =============================================================================
# Dict Operations
# =============================================================================

[[test]]
name = "counter_views"
skip = true
description = "c.keys(), c.values(), c.items()"
python = """
from collections import Counter
c = Counter(a=2, b=1)
print(sorted(c.keys()), sorted(c.values()), sorted(c.items()))
"""
rust = """
use std::collections::HashMap;
let c: HashMap<char, i32> = [('a', 2), ('b', 1)].iter().cloned().collect();
let mut keys: Vec<_> = c.keys().collect();
keys.sort();
let mut values: Vec<_> = c.values().collect();
values.sort();
let mut items: Vec<_> = c.iter().collect();
items.sort();
log::info!("{:?} {:?} {:?}", keys, values, items);"""

