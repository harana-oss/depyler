# =============================================================================
# Counting
# =============================================================================

[[test]]
name = "counter_access"
skip = true
description = "c['a']"
python = """
from collections import Counter
c = Counter('aab')
print(c['a'], c['b'])
"""
rust = """
use std::collections::HashMap;
let s = "aab";
let mut c: HashMap<char, usize> = HashMap::new();
for ch in s.chars() {
    *c.entry(ch).or_insert(0) += 1;
}
log::info!(
    "{} {}",
    c.get(&'a').unwrap_or(&0),
    c.get(&'b').unwrap_or(&0)
);"""

[[test]]
name = "counter_missing"
skip = true
description = "c['missing'] returns 0"
python = """
from collections import Counter
c = Counter('abc')
print(c['x'])
"""
rust = """
use std::collections::HashMap;
let s = "abc";
let mut c: HashMap<char, usize> = HashMap::new();
for ch in s.chars() {
    *c.entry(ch).or_insert(0) += 1;
}
log::info!("{}", c.get(&'x').unwrap_or(&0));"""

[[test]]
name = "counter_update"
skip = true
description = "c.update('more')"
python = """
from collections import Counter
c = Counter('abc')
c.update('aaa')
print(c['a'])
"""
rust = """
use std::collections::HashMap;
let mut c: HashMap<char, usize> = HashMap::new();
