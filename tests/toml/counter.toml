[metadata]
name = "Counter Tests"
category = "data-structures"

# =============================================================================
# Creating Counters
# =============================================================================

[[test]]
name = "counter_empty"
skip = true
description = "Counter()"
python = """
from collections import Counter
c = Counter()
print(dict(c))
"""
rust = """
use std::collections::HashMap;

let c: HashMap<String, usize> = HashMap::new();
log::info!("{{}}");"""

[[test]]
name = "counter_iterable"
skip = true
description = "Counter('abracadabra')"
python = """
from collections import Counter
c = Counter('abracadabra')
print(dict(sorted(c.items())))
"""
rust = """
use std::collections::HashMap;

let s = "abracadabra";
let mut c: HashMap<char, usize> = HashMap::new();
for ch in s.chars() {
    *c.entry(ch).or_insert(0) += 1;
}
let mut items: Vec<_> = c.iter().collect();
items.sort_by_key(|&(k, _)| k);
log::info!("{:?}", items);"""

