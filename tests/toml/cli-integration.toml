            .collect::<Vec<String>>()
            .len() as i32;
        let words = content
            .split_whitespace()
            .map(|s| s.to_string())
            .collect::<Vec<String>>()
            .len() as i32;
        let chars = content.len() as i32;
        return Stats::new(lines, words, chars, filepath.to_string());
        println!("{}", format!("Error reading {:?}: {:?}", filepath, e));
        return Stats::new(0, 0, 0, filepath.to_string());
    }
}
#[doc = "Format statistics for output"]
